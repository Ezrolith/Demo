name: Gameplay audit follow-up validation
on:
  push:
    branches: [codex/bonus-three]
    paths: [.github/workflows/validate-audit-followup.yml]
permissions:
  contents: write
concurrency:
  group: gameplay-audit-followup-publisher
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'Ezrolith/Demo' && github.ref == 'refs/heads/codex/bonus-three'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply assertion-checked source corrections
        run: |
          python3 .github/apply-audit-followup.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/play-audit-followup.mjs')
          s = p.read_text()
          old = 'const checkpoint = await page.evaluate(() => JSON.stringify(DM.Bonus.data.checkpoints.long_summer));'
          assert s.count(old) == 1
          s = s.replace(old, 'const checkpoint = await page.evaluate(() => DM.Bonus.data.checkpoints.long_summer);')
          old = "    check('reload then menu RESUME preserves the real truck checkpoint', resumed.rescued === 6 &&\n      resumed.unmade === 0 && checkpoint === await page.evaluate(() => JSON.stringify(DM.Bonus.data.checkpoints.long_summer)));"
          new = "    const restored = await page.evaluate(() => DM.Bonus.data.checkpoints.long_summer);\n    assert.deepEqual(restored, checkpoint, 'cold resume must restore the same checkpoint data');\n    check('reload then menu RESUME preserves the real truck checkpoint', resumed.rescued === 6 && resumed.unmade === 0);"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          find src tests tools -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Real-RAF nonlethal journey and cold resume
        run: |
          mkdir -p tests/out/followup-validation
          set +e
          node tests/play-audit-followup.mjs > tests/out/followup-validation/live-journey.log 2>&1
          result=$?
          set -e
          printf 'live-journey attempt=1 exit=%s\n' "$result" >> tests/out/followup-validation/exits.txt
          cat tests/out/followup-validation/live-journey.log
          exit "$result"
      - name: Twelve source suites sequentially
        shell: bash
        run: |
          failed=0
          for suite in smoke visual audio powers saves settings ledger encounters flows bonus ninth-minute long-summer; do
            for attempt in 1 2; do
              set +e
              node "tests/$suite.mjs" > "tests/out/followup-validation/$suite-$attempt.log" 2>&1
              result=$?
              set -e
              printf '%s attempt=%s exit=%s\n' "$suite" "$attempt" "$result" | tee -a tests/out/followup-validation/exits.txt
              cat "tests/out/followup-validation/$suite-$attempt.log"
              if [ "$result" -eq 0 ]; then break; fi
            done
            if [ "$result" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Rebuild standalone
        run: node tools/build.mjs
      - name: Three standalone suites sequentially
        shell: bash
        run: |
          failed=0
          for suite in bonus ninth-minute long-summer; do
            set +e
            node "tests/$suite.mjs" dist/dr-manhattan.html > "tests/out/followup-validation/dist-$suite.log" 2>&1
            result=$?
            set -e
            printf 'dist-%s attempt=1 exit=%s\n' "$suite" "$result" | tee -a tests/out/followup-validation/exits.txt
            cat "tests/out/followup-validation/dist-$suite.log"
            if [ "$result" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Record evidence and commit only reviewed files
        run: |
          mkdir -p docs/screenshots/audit-followup
          cp tests/out/audit-followup/*.png tests/out/audit-followup/journey.json docs/screenshots/audit-followup/
          python3 - <<'PY'
          from pathlib import Path
          import json
          p = Path('tests/out/followup-validation')
          lines = ['# Gameplay audit follow-up - 25 October 2026', '',
            'Branch: `codex/bonus-three`; draft PR #4. No merge or deployment.', '',
            '## Corrections', '',
            '- Reset the Summer camera target and clear old markers/transient objectives when a new map is built. The previous street target otherwise pulled Jon off-screen throughout the next briefing; the BALCONY ROUTE marker also leaked into the tenement.',
            '- Bind lethal cab targeting to the actual pending Disintegrate pulse instead of a 0.35-second wall-clock deadline. The game\'s legitimate 0.2-second impact freeze could expire a deliberately aimed cast. Wheel splash remains nonlethal; an expired cast cannot authorise later damage.', '',
            '## Verification', '',
            'The preceding full run 40139580928 completed successfully. This follow-up separately reruns all twelve source suites, rebuilds, and runs all three standalone suites.', '',
            'The new `tests/play-audit-followup.mjs` uses real RAF and Playwright keyboard/mouse actions from the original avenue spawn through six rescues to the truck briefing, then reloads the file and selects RESUME. No actor relocation, health/energy refill, godMode, injected quest flags or stage skips are used after first-spawn setup. It follows a known route, not a first-time human playthrough.', '',
            '| Command | Final output | Recorded exit |', '| --- | --- | --- |']
          for entry in (p / 'exits.txt').read_text().splitlines():
            name, attempt, result = entry.split()
            number = attempt.split('=')[1]
            log = p / (name + ('' if name == 'live-journey' or name.startswith('dist-') else '-' + number) + '.log')
            final = log.read_text().strip().splitlines()[-1] if log.exists() else 'See retained log'
            lines.append(f'| {name} (attempt {number}) | `{final}` | {result.split("=")[1]} |')
          j = json.loads(Path('tests/out/audit-followup/journey.json').read_text())
          lines += ['', f'Live journey checks: {len(j["checks"])}; minimum coherence: {j["minimumHealth"]:.2f}; page errors: {len(j["errors"])}.', '',
            '## Evidence and successor', '',
            '- `docs/screenshots/audit-followup/tenement-arrival-live.png`: actual new-area briefing and camera.',
            '- `six-rescued-live.png`: all six residents saved on the actual input route.',
            '- `truck-arrival-live.png`: actual transition to the boss area.',
            '- `truck-resumed-live.png`: real file reload and menu resume.',
            '- `journey.json`: methods, trace, checks and health telemetry.', '',
            'Local development used inlined scripts/memory storage because local file navigation is blocked; the authoritative GitHub run uses normal file navigation and real browser storage. The frozen-impact reproduction is a controlled mechanics test, not a claimed naturally occurring live capture.', '',
            'Still unverified: a complete first-time human playthrough through the truck ending, subjective soundtrack quality, Safari/Firefox, low-end hardware, cross-file save migration and mobile gameplay. The live journey stops at the truck checkpoint; existing focused suites cover boss outcomes. Keep PR #4 draft and preserve all Claude branches.', '']
          Path('docs/GAMEPLAY-AUDIT-FOLLOWUP.md').write_text('\n'.join(lines))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/chapters/long-summer.js src/game/long-summer-truck.js tests/long-summer.mjs tests/play-audit-followup.mjs dist/dr-manhattan.html docs/GAMEPLAY-AUDIT-FOLLOWUP.md docs/screenshots/audit-followup .github/apply-audit-followup.py .github/live-audit-template.mjs
          git commit -m 'Fix stale area framing and hitstop-sensitive cab targeting; verify real rescue and resume journey'
          git push origin HEAD:refs/heads/codex/bonus-three
          git rev-parse HEAD > tests/out/followup-validation/tested-commit.txt
          git archive --format=zip -o audit-source.zip HEAD src tests tools index.html package.json README.md HANDOVER.md .gitignore dist docs/GAMEPLAY-AUDIT-FOLLOWUP.md docs/screenshots/audit-followup .github/workflows/bonus-validation.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-audit-followup-${{ github.run_id }}
          path: |
            audit-source.zip
            dist/dr-manhattan.html
            tests/out/followup-validation/
            tests/out/audit-followup/
          retention-days: 14
