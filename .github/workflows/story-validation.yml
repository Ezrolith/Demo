name: Story package validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: story-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chatgpt/story-h-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the reviewed continuation bundle once
        id: bundle
        shell: bash
        run: |
          if [ -f .github/story-h.patch.gz.b64 ]; then
            sed 's/KBG3MnMnFBKa/KBG3MnFBKa/' .github/story-h.patch.gz.b64 | base64 --decode | gzip -d > "$RUNNER_TEMP/story-h.patch"
            echo "7363bd66251cd9057694315a19fab5e0283cc2a07022c21664e051318253ef33  $RUNNER_TEMP/story-h.patch" | sha256sum --check
            git apply --check "$RUNNER_TEMP/story-h.patch"
            git apply "$RUNNER_TEMP/story-h.patch"
            rm .github/story-h.patch.gz.b64
            echo 'applied=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check JavaScript syntax
        run: find src tests tools -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Build game and save-isolated preview
        run: |
          node tools/build.mjs
          node tools/build-story-preview.mjs
      - name: Record candidate source and generated builds on this branch only
        if: steps.bundle.outputs.applied == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          test "$CANDIDATE_BRANCH" = 'chatgpt/story-h-validation'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/data/chapters/superman.js src/data/ending.js tests/story.mjs tests/story-preview.mjs tools/build-story-preview.mjs docs/STORY_H_REVIEW.md package.json dist/dr-manhattan.html dist/story-preview.html .github/story-h.patch.gz.b64
          git commit -m 'Finish story H review: exact checkpoint restoration, acceptance tests and save-safe preview'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          echo "Testing candidate commit $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Package source snapshot
        run: git archive --format=zip HEAD -o source-snapshot.zip
      - name: Upload candidate for inspection (not a deployment)
        uses: actions/upload-artifact@v4
        with:
          name: story-candidate-${{ github.run_id }}
          path: |
            source-snapshot.zip
            dist/dr-manhattan.html
            dist/story-preview.html
          retention-days: 7
      - name: Install test tools
        id: install
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Story acceptance (source)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/story.mjs
      - name: Story acceptance (standalone build)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/story.mjs dist/dr-manhattan.html
      - name: Preview chooser and save isolation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/story-preview.mjs
      - name: Powers
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/powers.mjs
      - name: Story flows
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/flows.mjs
      - name: Chapter and checkpoint smoke tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/smoke.mjs
      - name: Saves
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/saves.mjs
      - name: Settings
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/settings.mjs
      - name: Ledger
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/ledger.mjs
      - name: Encounters
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/encounters.mjs
      - name: Audio
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/audio.mjs
      - name: Visuals
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/visual.mjs
      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-screenshots-${{ github.run_id }}
          path: tests/out/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve incomplete transfer for diagnosis
        if: ${{ failure() && steps.bundle.outcome != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: transfer-diagnostic-${{ github.run_id }}
          path: .github/story-h.patch.gz.b64
          include-hidden-files: true
          retention-days: 1
