name: Capture bonus polish evidence
on:
  push:
    branches: [codex/bonus-polish]
    paths: [tests/capture-bonus-polish.mjs, .github/workflows/capture-polish.yml]
permissions:
  contents: write
jobs:
  capture:
    if: github.repository == 'Ezrolith/Demo' && github.ref == 'refs/heads/codex/bonus-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Capture baseline and polished build through real file navigation
        run: |
          git worktree add --detach /tmp/bonus-before 5f64f6dd98bb649d15f435e136a816deb96157c3
          node tests/capture-bonus-polish.mjs --before-root=/tmp/bonus-before
      - name: Commit only the screenshot evidence to the same branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/bonus-polish
          git commit -m 'Record matched map, Sight and boss-phase screenshots against the original pier'
          git push origin HEAD:refs/heads/codex/bonus-polish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bonus-polish-visual-evidence
          path: docs/screenshots/bonus-polish/
          retention-days: 14
