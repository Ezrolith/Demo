name: Apply and validate polish step
on:
  push:
    branches: [codex/bonus-polish]
    paths: [.github/apply-polish.py, .github/workflows/apply-polish.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Ezrolith/Demo' && github.ref == 'refs/heads/codex/bonus-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed source transformation
        shell: bash
        run: |
          test -f .github/apply-polish.py
          python3 .github/apply-polish.py
          rm .github/apply-polish.py
          find src tests tools -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node tools/build.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests tools docs index.html dist .github/apply-polish.py
          git commit -m 'Apply reviewed bonus polish source changes and rebuild standalone'
          git push origin HEAD:refs/heads/codex/bonus-polish
          git rev-parse HEAD
      - name: Source snapshot
        if: always()
        run: git archive --format=zip HEAD -o source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polish-source-${{ github.run_id }}
          path: source.zip
          retention-days: 14
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Eleven regression suites, sequentially
        shell: bash
        run: |
          mkdir -p tests/out/regression
          git rev-parse HEAD > tests/out/regression/commit.txt
          failed=0
          for suite in smoke visual audio powers saves settings ledger encounters flows bonus ninth-minute; do
            for attempt in 1 2; do
              set +e
              node "tests/$suite.mjs" > "tests/out/regression/$suite-$attempt.log" 2>&1
              result=$?
              set -e
              printf '%s attempt=%s exit=%s\n' "$suite" "$attempt" "$result" | tee -a tests/out/regression/exits.txt
              cat "tests/out/regression/$suite-$attempt.log"
              if [ "$result" -eq 0 ]; then break; fi
            done
            if [ "$result" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Standalone bonus checks
        if: always()
        shell: bash
        run: |
          mkdir -p tests/out/regression
          failed=0
          for suite in bonus ninth-minute; do
            set +e
            node "tests/$suite.mjs" dist/dr-manhattan.html > "tests/out/regression/dist-$suite.log" 2>&1
            result=$?
            set -e
            printf 'dist-%s exit=%s\n' "$suite" "$result" | tee -a tests/out/regression/exits.txt
            cat "tests/out/regression/dist-$suite.log"
            if [ "$result" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polish-evidence-${{ github.run_id }}
          path: tests/out/
          retention-days: 14
