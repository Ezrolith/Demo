name: Publish and validate Long Summer candidate
on:
  push:
    branches: [codex/bonus-three]
    paths: [.github/workflows/publish-long-summer.yml]
permissions:
  contents: write
jobs:
  candidate:
    if: github.repository == 'Ezrolith/Demo' && github.ref == 'refs/heads/codex/bonus-three'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and install reviewed source
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          parts = [Path(f'.github/summer-package-{i}.b64') for i in range(1,5)]
          data = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          actual = hashlib.sha256(data).hexdigest()
          print('Transfer SHA256:', actual)
          assert actual == 'ac5cad7a53b8889d03736b2b418b254f3e996fab9e65fb68bd554702257a1057', 'Transfer mismatch; do not apply'
          bundle = json.loads(lzma.decompress(data))
          assert bundle['base'] == '9aec9bb0eaf3d76511201fb769b2af7512e60dad'
          subprocess.run(['git','merge-base','--is-ancestor',bundle['base'],'HEAD'],check=True)
          allowed = {'src/game/long-summer-kit.js','src/game/long-summer-truck.js','src/data/bonus-summer-atmosphere.js','src/data/chapters/long-summer.js','tests/long-summer.mjs','tests/capture-long-summer.mjs'}
          assert set(bundle['files']) == allowed
          patch_paths = [line.split(' b/',1)[1] for line in bundle['patch'].splitlines() if line.startswith('diff --git ')]
          assert set(patch_paths) == {'index.html','package.json','src/game/bonus.js','tests/ninth-minute.mjs'}
          subprocess.run(['git','apply','--check','-'],input=bundle['patch'],text=True,check=True)
          subprocess.run(['git','apply','-'],input=bundle['patch'],text=True,check=True)
          for name, text in bundle['files'].items():
              p=Path(name)
              assert not p.exists(), name
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(text)
          for p in parts: p.unlink()
          Path('.github/summer-source-1.b64').unlink(missing_ok=True)
          PY
          find src tests tools -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node tools/build.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests index.html package.json dist/dr-manhattan.html
          git add -u .github/*.b64
          git commit -m 'Add The Long Summer: Heat, restraint, six-person rescue, truck and 58 acceptance checks' -m 'Update Ninth Minute menu assertions for the intentional third bonus card; existing mechanics and original nine suites are unchanged.'
          git push origin HEAD:refs/heads/codex/bonus-three
          mkdir -p tests/out/long-summer-validation
          git rev-parse HEAD | tee tests/out/long-summer-validation/commit.txt
          git archive --format=zip HEAD -o long-summer-source.zip
      - name: Preserve source before testing
        uses: actions/upload-artifact@v4
        with:
          name: long-summer-source-${{ github.run_id }}
          path: |
            long-summer-source.zip
            dist/dr-manhattan.html
            tests/out/long-summer-validation/commit.txt
          retention-days: 14
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Twelve suites sequentially, real exits, at most one retry
        shell: bash
        run: |
          mkdir -p tests/out/long-summer-validation
          failed=0
          for suite in smoke visual audio powers saves settings ledger encounters flows bonus ninth-minute long-summer; do
            for attempt in 1 2; do
              set +e
              node "tests/$suite.mjs" > "tests/out/long-summer-validation/$suite-$attempt.log" 2>&1
              result=$?
              set -e
              printf '%s attempt=%s exit=%s\n' "$suite" "$attempt" "$result" | tee -a tests/out/long-summer-validation/exits.txt
              cat "tests/out/long-summer-validation/$suite-$attempt.log"
              if [ "$result" -eq 0 ]; then break; fi
            done
            if [ "$result" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: All three standalone adventures
        if: always()
        shell: bash
        run: |
          mkdir -p tests/out/long-summer-validation
          failed=0
          for suite in bonus ninth-minute long-summer; do
            for attempt in 1 2; do
              set +e
              node "tests/$suite.mjs" dist/dr-manhattan.html > "tests/out/long-summer-validation/dist-$suite-$attempt.log" 2>&1
              result=$?
              set -e
              printf 'dist-%s attempt=%s exit=%s\n' "$suite" "$attempt" "$result" | tee -a tests/out/long-summer-validation/exits.txt
              cat "tests/out/long-summer-validation/dist-$suite-$attempt.log"
              if [ "$result" -eq 0 ]; then break; fi
            done
            if [ "$result" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Capture actual file-loaded visual evidence
        if: always()
        run: node tests/capture-long-summer.mjs
      - name: Save visual evidence on this branch only
        if: success()
        run: |
          git add docs/screenshots/long-summer
          git diff --cached --quiet || git commit -m 'Record Long Summer maps, Temporal Sight, truck attacks and original pier reference'
          git push origin HEAD:refs/heads/codex/bonus-three
      - name: Full evidence archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-summer-evidence-${{ github.run_id }}
          path: |
            tests/out/
            docs/screenshots/long-summer/
            dist/dr-manhattan.html
          retention-days: 14
