name: Bonus polish regression
on:
  push:
    branches: [codex/bonus-polish]
  pull_request:
    branches: [chatgpt/bonus-adventures]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Eleven suites, sequentially, with one retry on failure
        shell: bash
        run: |
          mkdir -p tests/out/regression
          failed=0
          for suite in smoke visual audio powers saves settings ledger encounters flows bonus ninth-minute; do
            for attempt in 1 2; do
              set +e
              node "tests/$suite.mjs" > "tests/out/regression/$suite-$attempt.log" 2>&1
              result=$?
              set -e
              printf '%s attempt=%s exit=%s\n' "$suite" "$attempt" "$result" | tee -a tests/out/regression/exits.txt
              cat "tests/out/regression/$suite-$attempt.log"
              if [ "$result" -eq 0 ]; then break; fi
            done
            if [ "$result" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polish-tests-651fdd6285b4b529a1095f6b1decc202c6efbf6d
          path: tests/out/
          retention-days: 14
