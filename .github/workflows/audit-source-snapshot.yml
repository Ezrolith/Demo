name: Gameplay audit source snapshot
on:
  push:
    branches: [codex/bonus-three]
    paths: [.github/workflows/audit-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive source
        run: |
          git rev-parse HEAD > snapshot-commit.txt
          git archive --format=zip HEAD -o source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: gameplay-audit-source
          path: |
            source.zip
            snapshot-commit.txt
          retention-days: 7
