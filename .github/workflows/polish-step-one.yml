name: Polish step one
on:
  push:
    branches: [codex/bonus-polish]
    paths: [.github/workflows/polish-step-one.yml]
permissions:
  contents: write
jobs:
  step-one:
    if: github.repository == 'Ezrolith/Demo' && github.ref == 'refs/heads/codex/bonus-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/bonus-polish
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply step one and remove this one-time transport
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              assert s.count(old) == 1, (path, old, s.count(old))
              p.write_text(s.replace(old, new, 1))
          replace_once('src/data/chapters/last-broadcast.js', 'bpm: 74, level: 3,', 'bpm: 74, level: -1,')
          replace_once('src/data/chapters/ninth-minute.js', 'bpm:66,level:3,barsPerChord:2', 'bpm:66,level:0.5,barsPerChord:2')
          p = Path('index.html')
          s = p.read_text()
          s, n = re.subn(r'<title>[^<]*</title>', '<title>Dr. Manhattan</title>', s)
          assert n == 1
          p.write_text(s)
          for name in ['tools/verify-bonus-release.mjs', 'verification/bonus-source-sha256.json']:
              Path(name).unlink(missing_ok=True)
          p = Path('README.md')
          s = p.read_text()
          s = re.sub(r'^> \*\*Bonus adventures update[^\n]*\n', 'Bonus adventures: see [docs/BONUS.md](docs/BONUS.md).\n', s, flags=re.M)
          p.write_text(s)
          p = Path('HANDOVER.md')
          s = p.read_text()
          s = re.sub(r'^> \*\*Bonus adventures update[^\n]*\n', '> Bonus adventures: see [docs/BONUS.md](docs/BONUS.md). The original campaign and separate Story H branch remain untouched.\n', s, flags=re.M)
          p.write_text(s)
          Path('docs/BONUS.md').write_text('''# Bonus adventures

          Two optional, original fan stories for Dr. Manhattan: The Watchmaker\'s Son.
          Open `index.html` or `dist/dr-manhattan.html` in a desktop browser, enable
          audio with a click, and choose **BONUS LEVELS**. Select either adventure
          with the cards or left/right arrows. No campaign completion is required.
          Keyboard and mouse/trackpad are required; mobile controls are not included.

          ## The Last Broadcast

          New York, November 1976. Join Nite Owl and Rorschach to investigate three
          missing radio engineers. Cross the rooftops, free the engineers, use
          telekinesis to place two coils into their docks, and disable the shielded
          Carrier by breaking its three pylons. Three optional evidence records
          affect the conclusion. Broadcasting the evidence brings interceptors;
          shutting down quietly avoids that final fight. Nite Owl uses stun darts;
          Rorschach closes with enemies and stuns them. All six powers are available.

          ## The Ninth Minute

          New York, February 1977. Join Silk Spectre and Nite Owl at Harrow Street,
          where six passengers are caught in a repeating moment. Set the route to
          SERVICE, clear security drones, and cross the rail hazards. At each of
          three carriages, E calls Laurie to open the door; nearby enemies interrupt
          her work. Passengers count only when they reach the exit. The Pendulum
          exposes its core for the final three seconds of its nine-second cycle;
          a returned missile can open it early. Three optional lost moments use
          Temporal Sight. Release the loop immediately, or hold F in the temporal
          anchor to preserve its records. Both routes rescue the passengers.

          ## Style and saves

          Both adventures use the existing procedural figures, portraits, dialogue,
          lighting, weather, powers and WebAudio synthesizer. Five added musical
          arrangements do not replace any campaign track. Each adventure has its
          own checkpoint and completion record in `dr-manhattan.bonus.v1`, separate
          from campaign progress, Continue and the campaign ending. Settings are
          shared. Storage can be blocked by the browser; in that case progress is
          session-only. Cross-file save migration is not guaranteed.

          ## Source and tests

          Shared integration: `src/game/bonus.js`. Chapters:
          `src/data/chapters/last-broadcast.js` and `ninth-minute.js`.
          The original campaign chapter registry list is not extended.

          ```sh
          npm install
          npx playwright install chromium
          node tools/build.mjs
          npm test
          node tests/bonus.mjs
          node tests/ninth-minute.mjs
          node tests/bonus.mjs dist/dr-manhattan.html
          node tests/ninth-minute.mjs dist/dr-manhattan.html
          ```

          `npm test` runs the original nine suites. The two bonus suites are also
          required. Run suites sequentially and retain their actual exit codes.
          Their setup uses positioning shortcuts and some invulnerability, so
          they are not complete human playthroughs or balance assessments. The
          optional `--offline` harness is not proof of real file loading/storage.
          Safari, Firefox, subjective music quality and mobile support have not
          been independently verified. Do not infer them from Chromium results.

          ## Polish continuation

          Work is isolated on `codex/bonus-polish`, based on the existing bonus
          branch. Step one lowers only `bonus_noir` (4 dB) and `ninth_platform`
          (2.5 dB), restores the browser title, and consolidates documentation.
          The eleven-suite results, screenshots and remaining work will be recorded
          in the draft PR/handover. No merge, deployment or campaign edits are
          authorised. The third adventure is gated on completion of Part A.
          ''')
          for name in ['BONUS-README.md', 'THE-NINTH-MINUTE.md']:
              Path(name).unlink()
          Path('CHANGELOG.md').write_text('''# Changes

          ## Bonus polish — in progress
          - Corrected two bonus-track levels without changing campaign music.
          - Restored the Dr. Manhattan browser title.
          - Consolidated play/development notes in docs/BONUS.md.
          - Removed publication hashes and verification tooling; retained test-only CI.

          ## Bonus Adventures I and II
          The Last Broadcast and The Ninth Minute add optional adventures with
          separate saves. Story H remains in PR #1. No default-branch merge or
          external live-site deployment has been performed.
          ''')
          Path('.github/workflows/bonus-validation.yml').write_text('''name: Bonus polish regression
          on:
            push:
              branches: [codex/bonus-polish]
            pull_request:
              branches: [chatgpt/bonus-adventures]
          permissions:
            contents: read
          jobs:
            regression:
              runs-on: ubuntu-latest
              timeout-minutes: 90
              steps:
                - uses: actions/checkout@v4
                  with:
                    persist-credentials: false
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                - run: npm install --ignore-scripts
                - run: npx playwright install --with-deps chromium
                - name: Eleven suites, sequentially, with one retry on failure
                  shell: bash
                  run: |
                    mkdir -p tests/out/regression
                    failed=0
                    for suite in smoke visual audio powers saves settings ledger encounters flows bonus ninth-minute; do
                      for attempt in 1 2; do
                        set +e
                        node "tests/$suite.mjs" > "tests/out/regression/$suite-$attempt.log" 2>&1
                        result=$?
                        set -e
                        printf '%s attempt=%s exit=%s\\n' "$suite" "$attempt" "$result" | tee -a tests/out/regression/exits.txt
                        cat "tests/out/regression/$suite-$attempt.log"
                        if [ "$result" -eq 0 ]; then break; fi
                      done
                      if [ "$result" -ne 0 ]; then failed=1; fi
                    done
                    exit "$failed"
                - uses: actions/upload-artifact@v4
                  if: always()
                  with:
                    name: polish-tests-${{ github.sha }}
                    path: tests/out/
                    retention-days: 14
          ''')
          Path('.github/workflows/polish-step-one.yml').unlink()
          PY
          node tools/build.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix bonus music levels, restore title and consolidate docs (step 1)'
          git push origin HEAD:refs/heads/codex/bonus-polish
          git rev-parse HEAD
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Run all eleven suites in order and retain real exit codes
        shell: bash
        run: |
          mkdir -p tests/out/step-1
          git rev-parse HEAD > tests/out/step-1/commit.txt
          failed=0
          for suite in smoke visual audio powers saves settings ledger encounters flows bonus ninth-minute; do
            for attempt in 1 2; do
              set +e
              node "tests/$suite.mjs" > "tests/out/step-1/$suite-$attempt.log" 2>&1
              result=$?
              set -e
              printf '%s attempt=%s exit=%s\n' "$suite" "$attempt" "$result" | tee -a tests/out/step-1/exits.txt
              cat "tests/out/step-1/$suite-$attempt.log"
              if [ "$result" -eq 0 ]; then break; fi
            done
            if [ "$result" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Source and evidence snapshot
        if: always()
        run: |
          git archive --format=zip HEAD -o source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polish-step-one
          path: |
            source.zip
            tests/out/
          retention-days: 14
