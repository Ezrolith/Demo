name: Browser and performance QA
on:
  workflow_dispatch:
  push:
    branches: [codex/bonus-three]
    paths: ['.github/workflows/platform-qa.yml', 'src/**', 'dist/**', 'index.html', 'tests/platform-qa.mjs', 'tests/bonus-portability.mjs', 'tests/play-audit-followup.mjs']
  pull_request:
    branches: [codex/bonus-polish, codex/bonus-three]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: platform-qa-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the committed playable build
        run: |
          find src tests tools -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node tools/build.mjs
          git diff --exit-code -- dist/dr-manhattan.html
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Enable virtual audio output for headless Firefox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=qa_audio
          pactl set-default-sink qa_audio
      - name: Three engines, both builds, backup transfers and physical-input route
        shell: bash
        run: |
          mkdir -p tests/out/platform-clean
          failed=0
          check() {
            name="$1"; shift
            set +e
            "$@" > "tests/out/platform-clean/$name.log" 2>&1
            result=$?
            set -e
            printf '%s exit=%s\n' "$name" "$result" | tee -a tests/out/platform-clean/exits.txt
            cat "tests/out/platform-clean/$name.log"
            if [ "$result" -ne 0 ]; then failed=1; fi
          }
          for browser in chromium firefox webkit; do
            check "$browser-source" env QA_BROWSER="$browser" node tests/platform-qa.mjs index.html
            check "$browser-dist" env QA_BROWSER="$browser" node tests/platform-qa.mjs dist/dr-manhattan.html
            check "$browser-backup-source" env QA_BROWSER="$browser" node tests/bonus-portability.mjs index.html
            check "$browser-backup-dist" env QA_BROWSER="$browser" node tests/bonus-portability.mjs dist/dr-manhattan.html
            check "$browser-journey" env QA_BROWSER="$browser" node tests/play-audit-followup.mjs
          done
          check 'chromium-4x-high' env QA_BROWSER=chromium QA_CPU=4 QA_QUALITY=high node tests/platform-qa.mjs dist/dr-manhattan.html
          check 'chromium-4x-low' env QA_BROWSER=chromium QA_CPU=4 QA_QUALITY=low node tests/platform-qa.mjs dist/dr-manhattan.html
          exit "$failed"
      - name: Preserve exact test logs, frame timings, screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-evidence
          path: |
            tests/out/platform-clean/
            tests/out/platform-qa/
            tests/out/bonus-portability/
            tests/out/audit-followup/
          retention-days: 14
