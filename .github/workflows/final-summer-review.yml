name: Final Summer review validation
on:
  push:
    branches: [codex/bonus-three]
    paths: [.github/workflows/final-summer-review.yml]
permissions:
  contents: write
concurrency:
  group: summer-review-publisher
  cancel-in-progress: true
jobs:
  review:
    if: github.repository == 'Ezrolith/Demo' && github.ref == 'refs/heads/codex/bonus-three'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/bonus-three
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Close the autonomous-casualty Heat edge case
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/game/long-summer-kit.js')
          s = p.read_text()
          a = "      this.change(20, 'The Comedian killed someone');"
          b = "      // Autonomous fatalities use the same rate limit as live fire; the ledger updates immediately.\n      this.shotHeat += 20;"
          assert s.count(a) == 1
          s = s.replace(a, b)
          s = s.replace('  Object.assign(S, { SummerBossFraming, CityState, FireGrid, Hydrant, Puddle, Gas, Molotov, Rioter, LiveRound, Comedian, Resident, StairBeam });', '  Object.assign(S, {\n    SummerBossFraming, CityState, FireGrid, Hydrant, Puddle, Gas, Molotov, Rioter, LiveRound, Comedian, Resident, StairBeam,\n  });')
          p.write_text(s)
          p = Path('tests/long-summer.mjs')
          s = p.read_text()
          a = "    state.shotHeat = 200;\n    let previous = state.passiveAdded;\n    let previousFire = state.fireHeatAdded;\n    for (let i = 0; i < 40; i++) {\n      T.step(1);\n      if (state.passiveAdded - previous > 1.50001 || state.fireHeatAdded - previousFire > 0.50001) return false;\n      previous = state.passiveAdded;\n      previousFire = state.fireHeatAdded;\n    }"
          b = "    const initialHeat = state.heat;\n    state.casualty(T.p().ctx.flags.looter);\n    if (state.heat !== initialHeat || T.p().ctx.flags.comedianCasualties !== 1) return false;\n    state.shotHeat += 200;\n    let previous = state.passiveAdded;\n    let previousFire = state.fireHeatAdded;\n    let previousHeat = state.heat;\n    for (let i = 0; i < 40; i++) {\n      T.step(1);\n      if (state.passiveAdded - previous > 1.50001 || state.fireHeatAdded - previousFire > 0.50001 ||\n        state.heat - previousHeat > 1.50001) return false;\n      previous = state.passiveAdded;\n      previousFire = state.fireHeatAdded;\n      previousHeat = state.heat;\n    }"
          assert s.count(a) == 1
          p.write_text(s.replace(a, b))
          PY
          find src tests tools -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          git diff 90a9595eb063b58d9eb8bf6ae6f43cc372a94459 --exit-code -- src/core src/game/world.js src/game/powers.js src/game/entities src/data/music.js src/data/ambience.js src/data/chapters/prologue.js src/data/chapters/reassembly.js src/data/chapters/superman.js src/data/chapters/deterrent.js src/data/chapters/mars.js src/data/chapters/karnak.js src/data/chapters/last-broadcast.js src/data/chapters/ninth-minute.js src/data/bonus-ninth-atmosphere.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/long-summer-kit.js tests/long-summer.mjs
          git commit -m 'Rate-limit all autonomous Heat including Comedian casualties; assert actual meter changes'
          git push origin HEAD:refs/heads/codex/bonus-three
          mkdir -p tests/out/review-validation
          git rev-parse HEAD > tests/out/review-validation/source-commit.txt
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Twelve source suites sequentially with real exits
        shell: bash
        run: |
          mkdir -p tests/out/review-validation
          failed=0
          for suite in smoke visual audio powers saves settings ledger encounters flows bonus ninth-minute long-summer; do
            for attempt in 1 2; do
              set +e
              node "tests/$suite.mjs" > "tests/out/review-validation/$suite-$attempt.log" 2>&1
              result=$?
              set -e
              printf '%s attempt=%s exit=%s\n' "$suite" "$attempt" "$result" | tee -a tests/out/review-validation/exits.txt
              cat "tests/out/review-validation/$suite-$attempt.log"
              if [ "$result" -eq 0 ]; then break; fi
            done
            if [ "$result" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Rebuild after source tests
        if: always()
        run: node tools/build.mjs
      - name: Three standalone adventure suites
        if: always()
        shell: bash
        run: |
          mkdir -p tests/out/review-validation
          failed=0
          for suite in bonus ninth-minute long-summer; do
            for attempt in 1 2; do
              set +e
              node "tests/$suite.mjs" dist/dr-manhattan.html > "tests/out/review-validation/dist-$suite-$attempt.log" 2>&1
              result=$?
              set -e
              printf 'dist-%s attempt=%s exit=%s\n' "$suite" "$attempt" "$result" | tee -a tests/out/review-validation/exits.txt
              cat "tests/out/review-validation/dist-$suite-$attempt.log"
              if [ "$result" -eq 0 ]; then break; fi
            done
            if [ "$result" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Real ten-second before and after captures
        if: success()
        shell: bash
        run: |
          git worktree add --detach /tmp/summer-review-before 90a9595eb063b58d9eb8bf6ae6f43cc372a94459
          CAPTURE_ROOT=/tmp/summer-review-before CAPTURE_OUT="$PWD/docs/screenshots/summer-review" CAPTURE_LABEL=before node tests/capture-summer-review.mjs
          CAPTURE_LABEL=after node tests/capture-summer-review.mjs
      - name: Commit verified HTML and live evidence to review branch
        if: success()
        shell: bash
        run: |
          git add dist/dr-manhattan.html docs/screenshots/summer-review
          git commit -m 'Record final tested Summer fairness build and live ten-second comparison evidence'
          git push origin HEAD:refs/heads/codex/bonus-three
      - name: Preserve source and results
        if: always()
        run: |
          mkdir -p tests/out/review-validation
          git rev-parse HEAD > tests/out/review-validation/final-commit.txt
          git archive --format=zip HEAD -o review-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summer-review-${{ github.run_id }}
          path: |
            review-source.zip
            dist/dr-manhattan.html
            tests/out/review-validation/
            docs/screenshots/summer-review/
          retention-days: 14
