name: Publish verified gameplay-audit build
on:
  push:
    branches: [codex/bonus-three]
    paths: [.github/workflows/publish-gameplay-audit.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'Ezrolith/Demo' && github.ref == 'refs/heads/codex/bonus-three'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/bonus-three
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Test deliberate versus incidental cab targeting in source
        run: node tests/long-summer.mjs
      - run: node tools/build.mjs
      - name: Test the standalone game
        run: node tests/long-summer.mjs dist/dr-manhattan.html
      - name: Commit only verified standalone HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/dr-manhattan.html
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild audited game with local cab safety cue"
          git push origin HEAD:refs/heads/codex/bonus-three
