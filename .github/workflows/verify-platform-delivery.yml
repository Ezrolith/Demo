name: Verify platform delivery
on:
  push:
    branches: [codex/bonus-three]
    paths: ['.github/workflows/verify-platform-delivery.yml']
permissions:
  contents: read
concurrency:
  group: verify-platform-delivery
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python3 .github/apply-platform.py
          python3 .github/platform-final-fixes.py
          find src tests tools -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Twelve source suites, sequentially
        shell: bash
        run: |
          mkdir -p tests/out/platform-delivery
          failed=0
          for suite in smoke visual audio powers saves settings ledger encounters flows bonus ninth-minute long-summer; do
            for attempt in 1 2; do
              set +e
              node "tests/$suite.mjs" > "tests/out/platform-delivery/$suite-$attempt.log" 2>&1
              result=$?
              set -e
              printf '%s attempt=%s exit=%s\n' "$suite" "$attempt" "$result" | tee -a tests/out/platform-delivery/exits.txt
              cat "tests/out/platform-delivery/$suite-$attempt.log"
              if [ "$result" -eq 0 ]; then break; fi
            done
            if [ "$result" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - run: node tools/build.mjs
      - name: Standalone and new portability checks
        shell: bash
        run: |
          failed=0
          for suite in bonus ninth-minute long-summer bonus-portability; do
            set +e
            node "tests/$suite.mjs" dist/dr-manhattan.html > "tests/out/platform-delivery/dist-$suite.log" 2>&1
            result=$?
            set -e
            printf 'dist-%s exit=%s\n' "$suite" "$result" | tee -a tests/out/platform-delivery/exits.txt
            cat "tests/out/platform-delivery/dist-$suite.log"
            if [ "$result" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-regression-${{ github.run_id }}
          path: |
            tests/out/platform-delivery/
            tests/out/bonus-portability/
          retention-days: 14
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python3 .github/apply-platform.py
          python3 .github/platform-final-fixes.py
          node tools/build.mjs
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Audio backend for headless Firefox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=qa_audio
          pactl set-default-sink qa_audio
      - name: Browser matrix, known-route journeys and 4x CPU probes
        shell: bash
        run: |
          mkdir -p tests/out/platform-matrix
          failed=0
          run_check() {
            name="$1"; shift
            set +e
            "$@" > "tests/out/platform-matrix/$name.log" 2>&1
            result=$?
            set -e
            printf '%s exit=%s\n' "$name" "$result" | tee -a tests/out/platform-matrix/exits.txt
            cat "tests/out/platform-matrix/$name.log"
            if [ "$result" -ne 0 ]; then failed=1; fi
          }
          for browser in chromium firefox webkit; do
            for target in index.html dist/dr-manhattan.html; do
              name="${browser}-$(basename "$target")"
              run_check "$name" env QA_BROWSER="$browser" node tests/platform-qa.mjs "$target"
              run_check "backup-$name" env QA_BROWSER="$browser" node tests/bonus-portability.mjs "$target"
            done
            run_check "journey-$browser" env QA_BROWSER="$browser" node tests/play-audit-followup.mjs
          done
          run_check chromium-4x env QA_BROWSER=chromium QA_CPU=4 node tests/platform-qa.mjs dist/dr-manhattan.html
          run_check chromium-4x-low env QA_BROWSER=chromium QA_CPU=4 QA_QUALITY=low node tests/platform-qa.mjs dist/dr-manhattan.html
          exit "$failed"
      - name: Preserve exact tested source and reports
        if: always()
        run: |
          mkdir -p tests/out/platform-matrix
          tar -czf tests/out/platform-matrix/tested-source.tgz src tests/*.mjs tests/*.py index.html tools/build.mjs package.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-matrix-${{ github.run_id }}
          path: |
            tests/out/platform-matrix/
            tests/out/platform-qa/
            tests/out/bonus-portability/
            tests/out/audit-followup/
          retention-days: 14
  safari:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python3 .github/apply-platform.py
          python3 .github/platform-final-fixes.py
          node tools/build.mjs
      - name: Native Safari with real input over loopback HTTP
        shell: bash
        run: |
          mkdir -p tests/out/native-safari
          sw_vers > tests/out/native-safari/macos.txt
          /usr/bin/safaridriver --version > tests/out/native-safari/driver.txt
          sudo /usr/bin/safaridriver --enable
          python3 -m http.server 8765 --bind 127.0.0.1 > tests/out/native-safari/http.log 2>&1 &
          http_pid=$!
          /usr/bin/safaridriver -p 4444 > tests/out/native-safari/driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" "$http_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4444/status > tests/out/native-safari/driver-status.json; then break; fi
            sleep 1
          done
          set +e
          python3 tests/safari-platform.py > tests/out/native-safari/run.log 2>&1
          result=$?
          set -e
          printf 'native-safari exit=%s\n' "$result" > tests/out/native-safari/exits.txt
          cat tests/out/native-safari/run.log
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-safari-${{ github.run_id }}
          path: tests/out/native-safari/
          retention-days: 14
  publish:
    needs: [regression, browsers, safari]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/bonus-three
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Commit only the verified integration on this review branch
        run: |
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          python3 .github/apply-platform.py
          python3 .github/platform-final-fixes.py
          node tools/build.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/bonus.js src/game/bonus-portability.js src/game/long-summer-kit.js index.html tests/platform-qa.mjs tests/bonus-portability.mjs tests/play-audit-followup.mjs tests/long-summer.mjs tests/safari-platform.py dist/dr-manhattan.html
          git commit -m 'Fix truck camera readability and add verified portable saves with browser coverage'
          git push origin HEAD:refs/heads/codex/bonus-three
      - name: Preserve published playable build
        run: |
          git rev-parse HEAD > published-commit.txt
          git archive --format=zip HEAD src tests tools index.html package.json docs .github > published-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: platform-published-${{ github.run_id }}
          path: |
            dist/dr-manhattan.html
            published-commit.txt
            published-source.zip
          retention-days: 14
