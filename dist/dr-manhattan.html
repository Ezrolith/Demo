      if (this.isForward(chapterId, stage)) this.data.checkpoint = { chapter: chapterId, stage, carry: c };
      this.write();
    },
    // A chapter was finished: Continue moves to the start of the next one (or,
    // after the last chapter, clears), unless the player is further along.
    chapterDone(chapterId) {
      const ch = DM.Chapters.get(chapterId);
      const next = DM.Chapters.next(chapterId);
      delete this.data.checkpoints[chapterId];
      if (next) {
        if (this.isForward(next.id, 0)) this.data.checkpoint = { chapter: next.id, stage: 0, carry: null };
      } else if (ch) this.data.checkpoint = null; // the story is finished: nothing lies further
      this.write();
    },
    // New Game: the run starts over from the first chapter. Chapters stay unlocked.
    startOver() {
      const first = DM.Chapters.list[0];
      this.data.checkpoint = first ? { chapter: first.id, stage: 0, carry: null } : null;
      this.data.checkpoints = {};
      this.write();
    },
    // Where Continue leads: the saved checkpoint, or the start of the furthest
    // unlocked chapter if the checkpoint had to be dropped. null once the game is finished.
    continueTarget() {
      const cp = this.data.checkpoint;
      if (cp && DM.Chapters.get(cp.chapter)) return cp;
      const list = DM.Chapters.list;
      if (this.data.reached > 0 && this.data.reached < list.length) return { chapter: list[this.data.reached].id, stage: 0, carry: null };
      return null;
    },
    get finished() {
      return this.data.reached >= DM.Chapters.list.length;
    },
  };

  DM.Save = Save;
})();
</script>
<script>/* src/core/gfx.js */
/*
 * Gfx: procedural drawing. There are no image assets — characters, symbols,
 * portraits and icons are all drawn here, which keeps the game a handful of
 * text files and makes restyling cheap.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const F = DM.FONTS;
  const TAU = Math.PI * 2;
  const Gfx = {};

  // ---- primitives ---------------------------------------------------------
  Gfx.circle = (ctx, x, y, r) => {
    ctx.beginPath();
    ctx.arc(x, y, Math.max(0, r), 0, TAU);
  };
  Gfx.ellipse = (ctx, x, y, rx, ry, rot = 0) => {
    ctx.beginPath();
    ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, TAU);
  };
  Gfx.rr = (ctx, x, y, w, h, r) => {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  };
  Gfx.line = (ctx, x1, y1, x2, y2) => {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  };

  // ---- glow sprites (cached radial gradients, drawn additively) -----------
  // A radial glow looks the same at any size, so each colour gets one 128 px
  // sprite (and a 256 px one for radii above 200) that callers draw scaled.
  // Animated radii therefore never create new canvases. The cache keeps the
  // 64 most recently used colours.
  const GLOW_SIZES = [128, 256];
  const GLOW_COLOURS = 64;
  const glowCache = new Map(); // colour -> [128 px, 256 px], least recently used first
  let glowLast = null, glowLastEntry = null;
  Gfx.glowStats = { created: 0 };
  function makeGlow(color, size) {
    const r = size / 2;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(r, r, 0, r, r, r);
    grad.addColorStop(0, U.rgba(color, 1));
    grad.addColorStop(0.22, U.rgba(color, 0.55));
    grad.addColorStop(0.55, U.rgba(color, 0.16));
    grad.addColorStop(1, U.rgba(color, 0));
    g.fillStyle = grad;
    g.fillRect(0, 0, size, size);
    Gfx.glowStats.created++;
    return c;
  }
  // `radius` only picks the tier; draw the sprite at radius * 2.
  Gfx.glowSprite = (color, radius) => {
    const tier = radius > 200 ? 1 : 0;
    let entry = glowLastEntry;
    if (color !== glowLast) {
      entry = glowCache.get(color);
      if (entry) glowCache.delete(color);
      else {
        entry = [null, null];
        if (glowCache.size >= GLOW_COLOURS) glowCache.delete(glowCache.keys().next().value);
      }
      glowCache.set(color, entry);
      glowLast = color;
      glowLastEntry = entry;
    }
    return entry[tier] || (entry[tier] = makeGlow(color, GLOW_SIZES[tier]));
  };
  Gfx.glow = (ctx, x, y, radius, color, alpha = 1) => {
    if (alpha <= 0.003 || radius <= 0) return;
    const s = Gfx.glowSprite(color, radius);
    const op = ctx.globalCompositeOperation;
    const a = ctx.globalAlpha;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a * Math.min(1, alpha);
    ctx.drawImage(s, x - radius, y - radius, radius * 2, radius * 2);
    ctx.globalCompositeOperation = op;
    ctx.globalAlpha = a;
  };

  // ---- text ---------------------------------------------------------------
  Gfx.font = (size, family = F.display, weight = 400) => `${weight} ${size}px ${family}`;
  const hasSpacing = (ctx) => 'letterSpacing' in ctx;

  Gfx.text = (ctx, str, x, y, o = {}) => {
    ctx.font = Gfx.font(o.size || 16, o.font || F.display, o.weight || 400);
    ctx.textAlign = o.align || 'left';
    ctx.textBaseline = o.baseline || 'alphabetic';
    if (hasSpacing(ctx)) ctx.letterSpacing = (o.spacing || 0) + 'px';
    // Restore alpha by assignment: dividing it back out breaks for 0 and for values above 1.
    const ga = ctx.globalAlpha;
    if (o.alpha != null) ctx.globalAlpha = ga * (Number.isFinite(o.alpha) ? U.clamp(o.alpha, 0, 1) : 1);
    if (o.shadow) {
      ctx.fillStyle = o.shadow;
      ctx.fillText(str, x + (o.shadowOff || 2), y + (o.shadowOff || 2));
    }
    if (o.stroke) {
      ctx.strokeStyle = o.stroke;
      ctx.lineWidth = o.strokeWidth || 3;
      ctx.lineJoin = 'round';
      ctx.strokeText(str, x, y);
    }
    ctx.fillStyle = o.color || '#fff';
    ctx.fillText(str, x, y);
    ctx.globalAlpha = ga;
    if (hasSpacing(ctx)) ctx.letterSpacing = '0px';
  };

  Gfx.measure = (ctx, str, o = {}) => {
    ctx.font = Gfx.font(o.size || 16, o.font || F.display, o.weight || 400);
    if (hasSpacing(ctx)) ctx.letterSpacing = (o.spacing || 0) + 'px';
    const w = ctx.measureText(str).width;
    if (hasSpacing(ctx)) ctx.letterSpacing = '0px';
    return w;
  };

  const wrapCache = new Map();
  Gfx.wrap = (ctx, text, maxW) => {
    const key = ctx.font + '|' + maxW + '|' + text;
    let lines = wrapCache.get(key);
    if (lines) return lines;
    lines = [];
    for (const para of String(text).split('\n')) {
      const words = para.split(' ');
      let line = '';
      for (const w of words) {
        const test = line ? line + ' ' + w : w;
        if (ctx.measureText(test).width > maxW && line) {
          lines.push(line);
          line = w;
        } else line = test;
      }
      lines.push(line);
    }
    if (wrapCache.size > 600) wrapCache.clear();
    wrapCache.set(key, lines);
    return lines;
  };
  // Forget measured line breaks, e.g. once web fonts replace the fallback faces.
  Gfx.clearTextCache = () => wrapCache.clear();

  // Wrapped text. `chars` reveals only the first N characters (typewriter effect).
  Gfx.paragraph = (ctx, text, x, y, maxW, lh, o = {}) => {
    ctx.font = Gfx.font(o.size || 18, o.font || F.hand, o.weight || 400);
    ctx.textAlign = o.align || 'left';
    ctx.textBaseline = 'top';
    if (hasSpacing(ctx)) ctx.letterSpacing = '0px';
    ctx.fillStyle = o.color || '#fff';
    const lines = Gfx.wrap(ctx, text, maxW);
    let remaining = o.chars == null ? Infinity : o.chars;
    for (let i = 0; i < lines.length; i++) {
      if (remaining <= 0) break;
      let ln = lines[i];
      if (ln.length > remaining) ln = ln.slice(0, Math.max(0, Math.floor(remaining)));
      ctx.fillText(ln, x, y + i * lh);
      remaining -= lines[i].length + 1;
    }
    return lines.length * lh;
  };
  Gfx.paragraphHeight = (ctx, text, maxW, lh, o = {}) => {
    ctx.font = Gfx.font(o.size || 18, o.font || F.hand, o.weight || 400);
    return Gfx.wrap(ctx, text, maxW).length * lh;
  };

  // ---- UI pieces ----------------------------------------------------------
  Gfx.panel = (ctx, x, y, w, h, o = {}) => {
    ctx.fillStyle = o.fill || DM.C.uiBg;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = o.edge || 'rgba(140, 200, 240, 0.18)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    // corner brackets
    const c = o.accent || DM.C.uiEdge;
    const k = Math.min(10, w / 4, h / 4);
    ctx.strokeStyle = c;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y + k); ctx.lineTo(x, y); ctx.lineTo(x + k, y);
    ctx.moveTo(x + w - k, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + k);
    ctx.moveTo(x + w, y + h - k); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - k, y + h);
    ctx.moveTo(x + k, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - k);
    ctx.stroke();
  };

  Gfx.bar = (ctx, x, y, w, h, frac, color, o = {}) => {
    ctx.fillStyle = o.bg || 'rgba(255,255,255,0.08)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w * U.clamp(frac, 0, 1), h);
    if (o.segments) {
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      for (let i = 1; i < o.segments; i++) ctx.fillRect(x + (w * i) / o.segments - 1, y, 2, h);
    }
  };

  // Watchmen-style narration caption: paper box, ink border, typewriter text.
  Gfx.caption = (ctx, text, cx, y, maxW, o = {}) => {
    const pad = 14;
    const size = o.size || 17;
    const lh = Math.round(size * 1.35);
    ctx.font = Gfx.font(size, F.type);
    const lines = Gfx.wrap(ctx, text, maxW - pad * 2);
    let w = 0;
    for (const l of lines) w = Math.max(w, ctx.measureText(l).width);
    w += pad * 2;
    const h = lines.length * lh + pad * 2 - (lh - size);
    const x = cx - w / 2;
    ctx.save();
    if (o.alpha != null) ctx.globalAlpha *= o.alpha;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(x + 4, y + 4, w, h);
    ctx.fillStyle = o.bg || DM.C.paper;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = o.border || DM.C.ink;
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);
    Gfx.paragraph(ctx, text, x + pad, y + pad, maxW - pad * 2, lh, { size, font: F.type, color: o.color || DM.C.ink, chars: o.chars });
    ctx.restore();
    return h;
  };

  // Comic speech bubble with a tail pointing down at (x, y).
  Gfx.bubble = (ctx, text, x, y, o = {}) => {
    const size = o.size || 15;
    ctx.font = Gfx.font(size, F.hand);
    const w = Math.min(220, ctx.measureText(text).width) + 16;
    const lines = Gfx.wrap(ctx, text, w - 16);
    const h = lines.length * (size + 2) + 10;
    const bx = x - w / 2, by = y - h - 12;
    ctx.save();
    if (o.alpha != null) ctx.globalAlpha *= o.alpha;
    ctx.fillStyle = o.bg || '#fbf8ef';
    ctx.strokeStyle = DM.C.ink;
    ctx.lineWidth = 1.5;
    Gfx.rr(ctx, bx, by, w, h, 8);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - 6, by + h - 1);
    ctx.lineTo(x, y - 2);
    ctx.lineTo(x + 6, by + h - 1);
    ctx.fill();
    ctx.stroke();
    ctx.fillRect(x - 5, by + h - 3, 10, 3);
    Gfx.paragraph(ctx, text, x, by + 5, w - 16, size + 2, { size, font: F.hand, color: DM.C.ink, align: 'center' });
    ctx.restore();
  };

  // ---- Watchmen motifs ----------------------------------------------------
  // The hydrogen atom: Jon's chosen symbol.
  Gfx.hydrogen = (ctx, x, y, r, color, t = 0, lw) => {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = lw || Math.max(1, r * 0.14);
    Gfx.circle(ctx, x, y, r);
    ctx.stroke();
    Gfx.circle(ctx, x, y, r * 0.24);
    ctx.fill();
    Gfx.circle(ctx, x + Math.cos(t) * r, y + Math.sin(t) * r, r * 0.17);
    ctx.fill();
    ctx.restore();
  };

  // The Doomsday Clock. `minutes` = minutes to midnight.
  Gfx.clock = (ctx, x, y, r, minutes, o = {}) => {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = o.face || DM.C.paper;
    Gfx.circle(ctx, 0, 0, r);
    ctx.fill();
    ctx.strokeStyle = o.rim || DM.C.ink;
    ctx.lineWidth = Math.max(1.5, r * 0.08);
    ctx.stroke();
    ctx.lineCap = 'round';
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * TAU;
      ctx.lineWidth = i === 0 ? r * 0.08 : r * 0.04;
      Gfx.line(ctx, Math.cos(a) * r * 0.74, Math.sin(a) * r * 0.74, Math.cos(a) * r * 0.88, Math.sin(a) * r * 0.88);
    }
    const mA = -Math.PI / 2 - (minutes / 60) * TAU;
    const hA = -Math.PI / 2 - (minutes / 720) * TAU;
    ctx.strokeStyle = o.hands || DM.C.ink;
    ctx.lineWidth = r * 0.1;
    Gfx.line(ctx, 0, 0, Math.cos(hA) * r * 0.48, Math.sin(hA) * r * 0.48);
    ctx.lineWidth = r * 0.06;
    Gfx.line(ctx, 0, 0, Math.cos(mA) * r * 0.78, Math.sin(mA) * r * 0.78);
    ctx.fillStyle = o.hands || DM.C.ink;
    Gfx.circle(ctx, 0, 0, r * 0.08);
    ctx.fill();
    if (o.blood) {
      ctx.fillStyle = DM.C.blood;
      const bx = r * 0.28, by = -r * 0.55;
      Gfx.circle(ctx, bx, by, r * 0.13);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(bx - r * 0.06, by);
      ctx.quadraticCurveTo(bx - r * 0.02, by + r * 0.5, bx + r * 0.02, by + r * 0.62);
      ctx.quadraticCurveTo(bx + r * 0.08, by + r * 0.3, bx + r * 0.12, by);
      ctx.fill();
    }
    ctx.restore();
  };

  // The smiley badge. A small nod; used as an easter egg prop.
  Gfx.smiley = (ctx, x, y, r) => {
    ctx.save();
    ctx.fillStyle = DM.C.yellow;
    Gfx.circle(ctx, x, y, r);
    ctx.fill();
    ctx.strokeStyle = DM.C.ink;
    ctx.lineWidth = r * 0.08;
    ctx.stroke();
    ctx.fillStyle = DM.C.ink;
    Gfx.ellipse(ctx, x - r * 0.33, y - r * 0.25, r * 0.1, r * 0.2);
    ctx.fill();
    Gfx.ellipse(ctx, x + r * 0.33, y - r * 0.25, r * 0.1, r * 0.2);
    ctx.fill();
    ctx.lineWidth = r * 0.09;
    ctx.beginPath();
    ctx.arc(x, y + r * 0.05, r * 0.55, 0.2 * Math.PI, 0.8 * Math.PI);
    ctx.stroke();
    ctx.fillStyle = DM.C.blood;
    ctx.beginPath();
    ctx.moveTo(x + r * 0.15, y - r * 0.9);
    ctx.quadraticCurveTo(x + r * 0.05, y - r * 0.2, x + r * 0.32, y + r * 0.1);
    ctx.quadraticCurveTo(x + r * 0.45, y - r * 0.35, x + r * 0.45, y - r * 0.8);
    ctx.fill();
    ctx.restore();
  };

  // A body lying on its back, seen from above, in the figure's rotated frame:
  // head toward +x, legs out toward -x, arms splayed, hat (if any) knocked off
  // and lying beside it.
  function figureDown(ctx, o, paint) {
    const sleeve = o.sleeve || o.body || '#777';
    const skin = o.skin || '#e0b896';
    Gfx.ellipse(ctx, -18, -5, 10.5, 3.8, 0.12);
    paint(o.legs || '#333');
    Gfx.ellipse(ctx, -18, 5.5, 10.5, 3.8, -0.06);
    paint(o.legs || '#333');
    // arms: one flung up past the head, one out to the side
    Gfx.ellipse(ctx, 6, -14.5, 7.5, 3.6, -1.9);
    paint(sleeve);
    Gfx.ellipse(ctx, 8.5, 15, 7.5, 3.6, 1.5);
    paint(sleeve);
    Gfx.ellipse(ctx, 1.5, 0, 12.5, 8.5);
    paint(o.body || '#777');
    if (o.trim) {
      ctx.fillStyle = o.trim;
      ctx.fillRect(-9, -1.5, 18, 3);
    }
    ctx.fillStyle = skin;
    Gfx.circle(ctx, 3.6, -21.4, 2.6);
    ctx.fill();
    Gfx.circle(ctx, 9, 22, 2.6);
    ctx.fill();
    Gfx.circle(ctx, 18.5, 0, 6.8);
    paint(skin);
    const hair = o.hair || (o.hat ? '#2b221c' : null);
    if (hair && o.hairStyle !== 'bald') {
      ctx.beginPath();
      ctx.arc(18.5, 0, 6.9, -Math.PI * 0.42, Math.PI * 0.42);
      ctx.closePath();
      ctx.fillStyle = hair;
      ctx.fill();
    }
    if (o.hat) {
      Gfx.circle(ctx, 30, 14, 8.2);
      paint(o.hatBrim || o.hat);
      Gfx.circle(ctx, 30.5, 13.5, 5.2);
      paint(o.hat);
    }
  }

  // ---- characters (top-down) ----------------------------------------------
  // `o` = a look (see DM.LOOKS) plus x, y, angle, walk, moving, scale, alpha,
  // aim (arms forward), gun ('pistol' | 'tommy'), flash (0..1 white hit flash),
  // kick (0..1 recoil: upper body and arms jolt back), pose ('down' = lying
  // knocked out; angle then points from feet to head).
  Gfx.figure = (ctx, o) => {
    const s = (o.scale || 1) * (o.size || 1);
    const down = o.pose === 'down';
    ctx.save();
    ctx.translate(o.x, o.y);
    if (o.alpha != null) ctx.globalAlpha *= o.alpha;
    if (!o.noShadow) {
      ctx.fillStyle = 'rgba(0,0,0,0.26)';
      if (down) Gfx.ellipse(ctx, 3 * s, 4 * s, 26 * s, 13 * s, o.angle || 0);
      else Gfx.ellipse(ctx, 3 * s, 4 * s, 14 * s, 11 * s);
      ctx.fill();
    }
    ctx.rotate(o.angle || 0);
    ctx.scale(s, s);
    const sw = o.moving ? Math.sin(o.walk || 0) : 0;
    const armsFwd = o.aim || o.carry;
    // Comic-book ink line around each shape keeps figures readable on any floor.
    const ink = o.ink === false ? null : o.ink || 'rgba(16,12,10,0.6)';
    ctx.strokeStyle = ink || 'transparent';
    ctx.lineWidth = 1.4;
    ctx.lineJoin = 'round';
    const paint = (color) => {
      ctx.fillStyle = color;
      ctx.fill();
      if (ink) ctx.stroke();
    };
    if (down) {
      figureDown(ctx, o, paint);
      ctx.restore();
      return;
    }

    if (o.cape) {
      ctx.beginPath();
      ctx.moveTo(-1, -13);
      ctx.quadraticCurveTo(-24 - Math.abs(sw) * 4, 0, -1, 13);
      ctx.closePath();
      paint(o.cape);
    }
    Gfx.ellipse(ctx, sw * 7, -5, 6.5, 4);
    paint(o.legs || '#333');
    Gfx.ellipse(ctx, -sw * 7, 5, 6.5, 4);
    paint(o.legs || '#333');
    if (o.kick) ctx.translate(-o.kick * 2.6, 0); // recoil: everything above the legs jolts back

    const sleeve = o.sleeve || o.body || '#777';
    if (armsFwd) {
      Gfx.circle(ctx, 8, -8, 4.1);
      paint(sleeve);
      Gfx.circle(ctx, 8, 8, 4.1);
      paint(sleeve);
    } else {
      Gfx.circle(ctx, -sw * 6 + 1, -12, 4.2);
      paint(sleeve);
      Gfx.circle(ctx, sw * 6 + 1, 12, 4.2);
      paint(sleeve);
    }
    Gfx.ellipse(ctx, 0, 0, 8.5, 12.5);
    paint(o.body || '#777');
    if (o.trim) {
      ctx.fillStyle = o.trim;
      ctx.fillRect(-1.5, -10, 3, 20);
    }
    const skin = o.skin || '#e0b896';
    ctx.fillStyle = skin;
    const ka = armsFwd && o.kick ? o.kick * 1.6 : 0; // hands and gun kick back further
    if (armsFwd) {
      Gfx.circle(ctx, 12.5 - ka, -5, 2.7);
      ctx.fill();
      Gfx.circle(ctx, 12.5 - ka, 5, 2.7);
      ctx.fill();
    } else {
      Gfx.circle(ctx, -sw * 6 + 4.5, -12.5, 2.6);
      ctx.fill();
      Gfx.circle(ctx, sw * 6 + 4.5, 12.5, 2.6);
      ctx.fill();
    }
    if (o.gun) {
      ctx.fillStyle = '#17171a';
      ctx.fillRect(12 - ka, -1.8, o.gun === 'tommy' ? 17 : 10, 3.6);
      if (o.gun === 'tommy') {
        Gfx.circle(ctx, 18 - ka, 0, 3.6);
        ctx.fill();
      }
    }

    // head
    Gfx.circle(ctx, 1, 0, 7.2);
    paint(skin);
    if (o.hairStyle === 'long' && o.hair) {
      Gfx.ellipse(ctx, -5, 0, 7, 8.5);
      paint(o.hair);
    }
    if (o.hat) {
      const brim = o.hatBrim || o.hat;
      if (o.hatStyle === 'cap') {
        Gfx.circle(ctx, 0.5, 0, 7.8);
        paint(brim);
        Gfx.ellipse(ctx, 7.5, 0, 3.6, 6.2);
        paint(brim);
      } else {
        Gfx.circle(ctx, 0, 0, 10.5);
        paint(brim);
        Gfx.circle(ctx, 0, 0, 6.8);
        paint(o.hat);
      }
    } else if (o.hair && o.hairStyle !== 'bald') {
      ctx.beginPath();
      ctx.arc(0.5, 0, 7.6, Math.PI * 0.36, Math.PI * 1.64);
      ctx.closePath();
      ctx.fillStyle = o.hair;
      ctx.fill();
    }
    if (o.glasses) {
      ctx.strokeStyle = 'rgba(20,20,20,0.85)';
      ctx.lineWidth = 1.2;
      Gfx.line(ctx, 7.6, -4, 7.6, 4);
    }
    if (o.mark) Gfx.hydrogen(ctx, 1, 0, 3.4, o.mark, o.markT || 0, 0.9);
    if (o.flash) {
      ctx.fillStyle = `rgba(255,255,255,${o.flash})`;
      Gfx.ellipse(ctx, 0, 0, 9, 13);
      ctx.fill();
      Gfx.circle(ctx, 1, 0, 7.6);
      ctx.fill();
    }
    ctx.restore();
  };

  Gfx.MANHATTAN_LOOK = { skin: '#8fe1ff', body: '#55c6f4', sleeve: '#55c6f4', legs: '#3aa6dc', hair: null, ink: '#0b3558' };

  Gfx.manhattan = (ctx, o) => {
    const s = (o.scale || 1) * (o.size || 1);
    const a = o.alpha == null ? 1 : o.alpha;
    const pulse = 0.85 + Math.sin((o.t || 0) * 2.2) * 0.08;
    Gfx.glow(ctx, o.x, o.y, 54 * s, '#2fa8ff', 0.4 * a * pulse);
    Gfx.figure(ctx, Object.assign({}, Gfx.MANHATTAN_LOOK, o, { mark: '#eafcff', markT: (o.t || 0) * 1.4 }));
    Gfx.glow(ctx, o.x, o.y, 22 * s, '#bff1ff', 0.18 * a);
  };

  // Jon as pure awareness: a lone hydrogen atom.
  Gfx.awareness = (ctx, x, y, t, s = 1, alpha = 1) => {
    Gfx.glow(ctx, x, y, 46 * s, '#2fa8ff', 0.75 * alpha);
    Gfx.glow(ctx, x, y, 14 * s, '#eefbff', 0.9 * alpha);
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.translate(x, y);
    ctx.rotate(t * 0.7);
    ctx.strokeStyle = 'rgba(210,246,255,0.85)';
    ctx.lineWidth = 1.5;
    Gfx.ellipse(ctx, 0, 0, 17 * s, 6.5 * s);
    ctx.stroke();
    const ea = t * 4.2;
    ctx.fillStyle = '#ffffff';
    Gfx.circle(ctx, Math.cos(ea) * 17 * s, Math.sin(ea) * 6.5 * s, 2.6 * s);
    ctx.fill();
    Gfx.circle(ctx, 0, 0, 3.8 * s);
    ctx.fill();
    ctx.restore();
  };

  // ---- portraits (front view, for dialogue) --------------------------------
  Gfx.portrait = (ctx, x, y, size, look, t = 0, talking = false) => {
    const s = size / 100;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.beginPath();
    ctx.rect(0, 0, 100, 100);
    ctx.clip();
    ctx.fillStyle = look.bg || '#2a3340';
    ctx.fillRect(0, 0, 100, 100);
    // halftone dots for a printed-comic feel
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    for (let yy = 4; yy < 100; yy += 8) for (let xx = (yy / 8) % 2 ? 4 : 0; xx < 100; xx += 8) {
      Gfx.circle(ctx, xx, yy, 1.3);
      ctx.fill();
    }
    if (look.manhattan) Gfx.glow(ctx, 50, 52, 80, '#2fa8ff', 0.7);

    if (look.cape) {
      ctx.fillStyle = look.cape;
      Gfx.ellipse(ctx, 50, 112, 52, 34);
      ctx.fill();
    }
    ctx.fillStyle = look.body || '#666';
    Gfx.ellipse(ctx, 50, 110, 44, 32);
    ctx.fill();
    if (look.collar) {
      ctx.fillStyle = look.collar;
      ctx.beginPath();
      ctx.moveTo(38, 80); ctx.lineTo(50, 96); ctx.lineTo(62, 80); ctx.lineTo(56, 80); ctx.lineTo(50, 88); ctx.lineTo(44, 80);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = U.mix(look.skin, '#000000', 0.18);
    ctx.fillRect(43, 64, 14, 18);
    if (look.hairStyle === 'long') {
      ctx.fillStyle = look.hair;
      Gfx.ellipse(ctx, 50, 56, 28, 36);
      ctx.fill();
    }
    ctx.fillStyle = look.skin;
    Gfx.ellipse(ctx, 50, 48, 20, 25);
    ctx.fill();
    Gfx.ellipse(ctx, 30.5, 50, 3.5, 6);
    ctx.fill();
    Gfx.ellipse(ctx, 69.5, 50, 3.5, 6);
    ctx.fill();

    const style = look.hairStyle || 'short';
    if (look.hair && style !== 'bald') {
      ctx.fillStyle = look.hair;
      if (style === 'long') {
        Gfx.ellipse(ctx, 50, 32, 22, 13);
        ctx.fill();
        ctx.fillRect(28, 32, 7, 34);
        ctx.fillRect(65, 32, 7, 34);
      } else if (style === 'slick') {
        Gfx.ellipse(ctx, 50, 30, 21, 11);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(29, 36); ctx.quadraticCurveTo(45, 18, 72, 30); ctx.lineTo(70, 38); ctx.quadraticCurveTo(52, 28, 31, 42);
        ctx.fill();
      } else if (style === 'thin') {
        ctx.beginPath();
        ctx.moveTo(30, 44); ctx.quadraticCurveTo(30, 26, 40, 27); ctx.lineTo(36, 46);
        ctx.moveTo(70, 44); ctx.quadraticCurveTo(70, 26, 60, 27); ctx.lineTo(64, 46);
        ctx.fill();
      } else {
        Gfx.ellipse(ctx, 50, 31, 21, 12);
        ctx.fill();
        ctx.fillRect(29, 31, 5, 13);
        ctx.fillRect(66, 31, 5, 13);
      }
    }
    if (look.hat) {
      ctx.fillStyle = look.hat;
      if (look.hatStyle === 'cap') {
        Gfx.ellipse(ctx, 50, 27, 25, 11);
        ctx.fill();
        ctx.fillStyle = look.hatBrim || '#111';
        Gfx.ellipse(ctx, 50, 34, 27, 5);
        ctx.fill();
        if (look.badge) {
          ctx.fillStyle = look.badge;
          Gfx.circle(ctx, 50, 26, 4);
          ctx.fill();
        }
      } else {
        Gfx.ellipse(ctx, 50, 31, 36, 7);
        ctx.fill();
        Gfx.rr(ctx, 32, 10, 36, 22, 7);
        ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(32, 24, 36, 5);
      }
    }

    // face
    if (look.manhattan) {
      ctx.fillStyle = '#ffffff';
      Gfx.ellipse(ctx, 42, 49, 4.2, 2.6);
      ctx.fill();
      Gfx.ellipse(ctx, 58, 49, 4.2, 2.6);
      ctx.fill();
      Gfx.glow(ctx, 42, 49, 9, '#bff1ff', 0.7);
      Gfx.glow(ctx, 58, 49, 9, '#bff1ff', 0.7);
    } else {
      ctx.fillStyle = '#1b1612';
      Gfx.ellipse(ctx, 42, 49, 2.3, 2.6);
      ctx.fill();
      Gfx.ellipse(ctx, 58, 49, 2.3, 2.6);
      ctx.fill();
    }
    ctx.strokeStyle = 'rgba(30,20,15,0.75)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    Gfx.line(ctx, 37, 42, 46, 41);
    Gfx.line(ctx, 54, 41, 63, 42);
    ctx.lineWidth = 1.6;
    Gfx.line(ctx, 50, 50, 48, 57);
    Gfx.line(ctx, 48, 57, 51, 58);
    const open = talking ? (Math.sin(t * 22) * 0.5 + 0.5) * 4 : 0;
    ctx.fillStyle = 'rgba(60,20,20,0.8)';
    if (open > 0.6) {
      Gfx.ellipse(ctx, 50, 64, 5, open / 2 + 0.5);
      ctx.fill();
    } else Gfx.line(ctx, 45, 64, 55, 64);
    if (look.glasses) {
      ctx.strokeStyle = '#1b1612';
      ctx.lineWidth = 1.8;
      Gfx.circle(ctx, 42, 49, 6.5);
      ctx.stroke();
      Gfx.circle(ctx, 58, 49, 6.5);
      ctx.stroke();
      Gfx.line(ctx, 48.5, 49, 51.5, 49);
    }
    if (look.moustache) {
      ctx.fillStyle = look.hair || '#222';
      Gfx.ellipse(ctx, 50, 60, 8, 2.4);
      ctx.fill();
    }
    // Optional character-local mask; campaign looks have no mask callback.
    if (typeof look.mask === 'function') look.mask(ctx, t);
    if (look.manhattan) Gfx.hydrogen(ctx, 50, 33, 6.5, '#e8fbff', t * 0.8, 1.5);
    ctx.restore();
    ctx.strokeStyle = DM.C.ink;
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, size, size);
  };

  // ---- power icons -------------------------------------------------------
  Gfx.icon = (ctx, id, x, y, size, color, t = 0) => {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size / 40, size / 40);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    switch (id) {
      case 'telekinesis':
        Gfx.circle(ctx, 0, 0, 4.5);
        ctx.fill();
        for (let i = 1; i <= 2; i++) {
          const r = 6 + i * 6 + Math.sin(t * 3 + i) * 0.8;
          ctx.beginPath(); ctx.arc(0, 0, r, -0.65, 0.65); ctx.stroke();
          ctx.beginPath(); ctx.arc(0, 0, r, Math.PI - 0.65, Math.PI + 0.65); ctx.stroke();
        }
        break;
      case 'disintegrate':
        ctx.setLineDash([3, 3]);
        Gfx.circle(ctx, -3, 2, 7);
        ctx.stroke();
        ctx.setLineDash([]);
        for (let i = 0; i < 9; i++) {
          const a = -1.2 + i * 0.32;
          const r = 10 + (i % 3) * 3.5;
          Gfx.circle(ctx, -3 + Math.cos(a) * r, 2 + Math.sin(a) * r, 2.4 - (i % 3) * 0.6);
          ctx.fill();
        }
        break;
      case 'teleport':
        ctx.setLineDash([2.5, 3]);
        Gfx.circle(ctx, -9, 6, 6);
        ctx.stroke();
        ctx.setLineDash([]);
        Gfx.circle(ctx, 9, -6, 6);
        ctx.fill();
        Gfx.line(ctx, -3, 2, 3, -2);
        Gfx.line(ctx, 3, -2, -1, -3);
        Gfx.line(ctx, 3, -2, 2, 2);
        break;
      case 'duplicate':
        for (const [dx, dy, a] of [[-11, 3, 0.5], [11, 3, 0.5], [0, -2, 1]]) {
          ctx.globalAlpha = a;
          Gfx.circle(ctx, dx, dy - 6, 4.5);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(dx, dy + 9, 8, Math.PI, 0);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        break;
      case 'timesight':
        Gfx.circle(ctx, 0, 0, 15);
        ctx.stroke();
        for (let i = 0; i < 4; i++) {
          const a = (i * Math.PI) / 2;
          Gfx.line(ctx, Math.cos(a) * 11, Math.sin(a) * 11, Math.cos(a) * 14, Math.sin(a) * 14);
        }
        Gfx.line(ctx, 0, 0, Math.cos(t * 2 - 1.57) * 10, Math.sin(t * 2 - 1.57) * 10);
        Gfx.line(ctx, 0, 0, 6, 3);
        break;
      case 'expand':
        ctx.strokeRect(-5, -5, 10, 10);
        for (const [sx, sy] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
          Gfx.line(ctx, sx * 8, sy * 8, sx * 15, sy * 15);
          Gfx.line(ctx, sx * 15, sy * 15, sx * 10, sy * 15);
          Gfx.line(ctx, sx * 15, sy * 15, sx * 15, sy * 10);
        }
        break;
      case 'coalesce':
        Gfx.circle(ctx, 0, 0, 4);
        ctx.fill();
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * TAU + t * 0.5;
          const r = 13 + Math.sin(t * 3 + i) * 2;
          Gfx.circle(ctx, Math.cos(a) * r, Math.sin(a) * r, 2);
          ctx.fill();
        }
        break;
      default:
        Gfx.circle(ctx, 0, 0, 12);
        ctx.stroke();
    }
    ctx.restore();
  };

  // ---- screen effects -----------------------------------------------------
  // Corner darkening (or a coloured edge glow), drawn per call. Play uses it only
  // for the pulsing low-coherence edge; the steady vignette is part of Gfx.postFx.
  const vignettes = new Map(); // colour -> half-resolution canvas
  Gfx.vignette = (ctx, alpha = 1, color = '#000000') => {
    let c = vignettes.get(color);
    if (!c) {
      c = document.createElement('canvas');
      c.width = DM.W / 2;
      c.height = DM.H / 2;
      const g = c.getContext('2d');
      const grad = g.createRadialGradient(DM.W / 4, DM.H / 4, DM.H * 0.18, DM.W / 4, DM.H / 4, DM.W * 0.42);
      grad.addColorStop(0, U.rgba(color, 0));
      grad.addColorStop(1, U.rgba(color, 0.72));
      g.fillStyle = grad;
      g.fillRect(0, 0, DM.W / 2, DM.H / 2);
      vignettes.set(color, c);
    }
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.drawImage(c, 0, 0, DM.W, DM.H);
    ctx.restore();
  };

  // Post effects: the steady vignette and the film grain. As two full-screen
  // passes per frame (the grain with an 'overlay' blend) they took most of the
  // frame, so they are pre-composited instead: three overlay frames with the
  // vignette and grain specks baked in, rendered once per canvas size at device
  // resolution and drawn 1:1, switching every 4 frames so the grain still
  // crawls. Without a vignette (the interlude) the grain is one source-over
  // pattern fill. Grain follows Save.settings.grain.
  //   Gfx.postFx(ctx)                              vignette 0.55 + grain
  //   Gfx.postFx(ctx, { vignette: 0, grain: 0.06 }) grain only (0.035 = normal strength)
  const GRAIN_ALPHA = 0.06;
  const PostFx = (Gfx.postFxState = { key: '', frames: [], tile: null, patterns: new WeakMap(), n: 0, builds: 0 });
  const grainTile = () => {
    if (PostFx.tile) return PostFx.tile;
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const g = c.getContext('2d');
    const img = g.createImageData(256, 256);
    const rnd = U.seeded(35);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = rnd() < 0.5 ? 0 : 255;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = rnd() < 0.55 ? 0 : (rnd() * 255) | 0;
    }
    g.putImageData(img, 0, 0);
    return (PostFx.tile = c);
  };
  // The letterboxed DM.W x DM.H game area, in device pixels.
  const deviceRect = () => {
    const E = DM.Engine;
    const k = E.dpr * E.scale;
    return { k, x: Math.round(E.dpr * E.offX), y: Math.round(E.dpr * E.offY), w: Math.max(1, Math.round(DM.W * k)), h: Math.max(1, Math.round(DM.H * k)) };
  };
  // Grain specks are one CSS pixel, as before, whatever the device ratio.
  const fillGrain = (g, r, alpha, frame) => {
    let pat = PostFx.patterns.get(g);
    if (!pat) PostFx.patterns.set(g, (pat = g.createPattern(grainTile(), 'repeat')));
    const s = Math.max(1, Math.round(r.k));
    g.save();
    g.globalAlpha = alpha;
    g.fillStyle = pat;
    g.beginPath();
    g.rect(r.x, r.y, r.w, r.h);
    g.clip();
    g.translate(r.x - ((frame * 83) % 256) * s, r.y - ((frame * 47) % 256) * s);
    g.scale(s, s);
    g.fillRect(0, 0, r.w / s + 512, r.h / s + 512);
    g.restore();
  };
  function buildFrames(r, vignette, grain) {
    for (const f of PostFx.frames) f.width = f.height = 0; // free the old frames now, not at the next GC
    PostFx.frames = [];
    PostFx.builds++;
    for (let i = 0; i < (grain ? 3 : 1); i++) {
      const c = document.createElement('canvas');
      c.width = r.w;
      c.height = r.h;
      const g = c.getContext('2d');
      const grad = g.createRadialGradient(r.w / 2, r.h / 2, r.h * 0.18, r.w / 2, r.h / 2, r.w * 0.42);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, `rgba(0,0,0,${0.72 * vignette})`);
      g.fillStyle = grad;
      g.fillRect(0, 0, r.w, r.h);
      if (grain) fillGrain(g, { k: r.k, x: 0, y: 0, w: r.w, h: r.h }, GRAIN_ALPHA, i);
      PostFx.frames.push(c);
    }
  }
  Gfx.postFx = (ctx, o = {}) => {
    const S = DM.Save && DM.Save.settings;
    const grain = o.grain !== false && o.grain !== 0 && !(S && S.grain === false);
    const vignette = o.vignette == null ? 0.55 : o.vignette;
    if (!DM.Engine || !DM.Engine.canvas || (vignette <= 0 && !grain)) return;
    const r = deviceRect();
    const n = PostFx.n++;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (vignette > 0) {
      const key = `${r.w}x${r.h}|${vignette}|${grain}`;
      if (key !== PostFx.key) {
        PostFx.key = key;
        buildFrames(r, vignette, grain);
      }
      const f = PostFx.frames;
      ctx.drawImage(f[(n >> 2) % f.length], r.x, r.y);
    } else {
      fillGrain(ctx, r, GRAIN_ALPHA * (typeof o.grain === 'number' ? o.grain / 0.035 : 1), (n >> 2) % 3);
    }
    ctx.restore();
  };
  // Film grain alone, for older callers.
  Gfx.grain = (ctx, alpha = 0.035) => Gfx.postFx(ctx, { vignette: 0, grain: alpha });

  // Seeded starfield
  Gfx.makeStars = (seed, n, w, h) => {
    const rnd = U.seeded(seed);
    const out = [];
    for (let i = 0; i < n; i++) out.push({ x: rnd() * w, y: rnd() * h, r: rnd() * 1.4 + 0.2, a: rnd() * 0.7 + 0.2, tw: rnd() * TAU });
    return out;
  };

  DM.Gfx = Gfx;
})();
</script>
<script>/* src/core/particles.js */
/* Particle system: a flat array, swap-remove on death, two render passes (normal + additive). */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const TAU = Math.PI * 2;

  class Particles {
    constructor(max = 3500) {
      this.list = [];
      this.max = max;
    }

    // o: vx, vy, life, size, size1 (end size), color, alpha, drag, g (gravity),
    //    add (additive, default true), shape: 'dot' | 'glow' | 'spark' | 'ring' | 'shard' | 'smoke'
    emit(x, y, o = {}) {
      if (this.list.length >= this.max) return null;
      const p = {
        x, y,
        vx: o.vx || 0,
        vy: o.vy || 0,
        t: 0,
        life: o.life == null ? 1 : o.life,
        size: o.size == null ? 3 : o.size,
        size1: o.size1 == null ? 0 : o.size1,
        color: o.color || '#ffffff',
        alpha: o.alpha == null ? 1 : o.alpha,
        drag: o.drag == null ? 2 : o.drag,
        g: o.g || 0,
        add: o.add == null ? true : o.add,
        shape: o.shape || 'dot',
        rot: o.rot || Math.random() * TAU,
        vr: o.vr || 0,
      };
      this.list.push(p);
      return p;
    }

    // Radial burst. Ranges are [min, max]. `angle` + `spread` aim it.
    burst(x, y, n, o = {}) {
      const sp = o.speed || [40, 200];
      const lf = o.life || [0.4, 1];
      const sz = o.size || [2, 4];
      for (let i = 0; i < n; i++) {
        const a = o.angle != null ? o.angle + U.rand(-(o.spread || TAU) / 2, (o.spread || TAU) / 2) : U.rand(0, TAU);
        const v = U.rand(sp[0], sp[1]);
        const r = o.radius ? U.rand(0, o.radius) : 0;
        this.emit(x + Math.cos(a) * r, y + Math.sin(a) * r, {
          vx: Math.cos(a) * v + (o.vx || 0),
          vy: Math.sin(a) * v + (o.vy || 0),
          life: U.rand(lf[0], lf[1]),
          size: U.rand(sz[0], sz[1]),
          size1: o.size1,
          color: Array.isArray(o.color) ? U.pick(o.color) : o.color,
          alpha: o.alpha,
          drag: o.drag,
          g: o.g,
          add: o.add,
          shape: o.shape,
          vr: o.vr ? U.rand(-o.vr, o.vr) : 0,
        });
      }
    }

    // Particles that start on a ring and rush inward (charging effects).
    implode(x, y, r, n, o = {}) {
      for (let i = 0; i < n; i++) {
        const a = U.rand(0, TAU);
        const life = o.life || 0.35;
        const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
        this.emit(px, py, { vx: (x - px) / life, vy: (y - py) / life, life, size: o.size || 2.5, size1: 0.5, color: o.color || '#bff1ff', drag: 0 });
      }
    }

    update(dt) {
      const L = this.list;
      for (let i = L.length - 1; i >= 0; i--) {
        const p = L[i];
        p.t += dt;
        if (p.t >= p.life) {
          L[i] = L[L.length - 1];
          L.pop();
          continue;
        }
        if (p.drag) {
          const f = Math.exp(-p.drag * dt);
          p.vx *= f;
          p.vy *= f;
        }
        p.vy += p.g * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
      }
    }

    render(ctx, view) {
      this._pass(ctx, view, false);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      this._pass(ctx, view, true);
      ctx.restore();
    }

    _pass(ctx, view, additive) {
      const L = this.list;
      for (let i = 0; i < L.length; i++) {
        const p = L[i];
        if (p.add !== additive) continue;
        if (view && (p.x < view.x0 - 40 || p.x > view.x1 + 40 || p.y < view.y0 - 40 || p.y > view.y1 + 40)) continue;
        const k = p.t / p.life;
        const size = p.size + (p.size1 - p.size) * k;
        const a = p.alpha * (1 - k * k);
        if (a <= 0.01 || size <= 0.05) continue;
        ctx.globalAlpha = a;
        switch (p.shape) {
          case 'glow': {
            const spr = Gfx.glowSprite(p.color, size * 3);
            ctx.drawImage(spr, p.x - size * 3, p.y - size * 3, size * 6, size * 6);
            break;
          }
          case 'spark':
            ctx.strokeStyle = p.color;
            ctx.lineWidth = size;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x - p.vx * 0.04, p.y - p.vy * 0.04);
            ctx.stroke();
            break;
          case 'ring':
            ctx.strokeStyle = p.color;
            ctx.lineWidth = Math.max(1, 3 * (1 - k));
            Gfx.circle(ctx, p.x, p.y, size);
            ctx.stroke();
            break;
          case 'shard':
            ctx.fillStyle = p.color;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.beginPath();
            ctx.moveTo(size, 0);
            ctx.lineTo(-size * 0.6, size * 0.5);
            ctx.lineTo(-size * 0.4, -size * 0.6);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
            break;
          case 'smoke':
            ctx.fillStyle = p.color;
            Gfx.circle(ctx, p.x, p.y, size);
            ctx.fill();
            break;
          default:
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x - size / 2, p.y - size / 2, size, size);
        }
      }
      ctx.globalAlpha = 1;
    }

    clear() {
      this.list.length = 0;
    }
  }

  DM.Particles = Particles;
})();
</script>
<script>/* src/core/camera.js */
/*
 * Camera: smooth follow, trauma-based screen shake, directional kicks, zoom,
 * world bounds.
 *
 * Shake: shake(amount) adds trauma (0..1, decays 1.3/s); the offset is
 * trauma² × 44 px (capped at 22) along smooth noise, so it rumbles instead of
 * jittering. Rough guide: 0.12 a nudge, 0.35 a solid hit, 0.6 a big blast.
 * kick(dx, dy, px) shoves the view along a direction and springs back. Both
 * scale with Settings > shake (0 turns them off).
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;

  class Camera {
    constructor() {
      this.x = 0;
      this.y = 0;
      this.zoom = 1;
      this.targetZoom = 1;
      this.trauma = 0;
      this.ox = 0; // total offset this frame (shake + kick), in world px
      this.oy = 0;
      this.kx = 0; // directional kick, decaying
      this.ky = 0;
      this.t = 0;
      this.seed = Math.random() * 100;
      this.bounds = null; // {w, h}
    }
    snap(x, y) {
      this.x = x;
      this.y = y;
      this.clamp();
    }
    follow(tx, ty, dt, speed = 6) {
      this.x = U.damp(this.x, tx, speed, dt);
      this.y = U.damp(this.y, ty, speed, dt);
      this.clamp();
    }
    shake(amount) {
      if (amount > 0) this.trauma = Math.min(1, this.trauma + amount);
    }
    // Shove the view px pixels along (dx, dy); it springs back in ~0.15 s.
    kick(dx, dy, px) {
      const l = Math.hypot(dx, dy);
      if (!(l > 0) || !(px > 0)) return;
      this.kx += (dx / l) * px;
      this.ky += (dy / l) * px;
      const m = Math.hypot(this.kx, this.ky);
      if (m > 16) {
        this.kx *= 16 / m;
        this.ky *= 16 / m;
      }
    }
    update(dt) {
      this.t += dt;
      this.trauma = Math.max(0, this.trauma - dt * 1.3);
      const k = Math.exp(-18 * dt);
      this.kx *= k;
      this.ky *= k;
      const set = DM.Save.settings.shake == null ? 1 : DM.Save.settings.shake;
      const s = Math.min(22, this.trauma * this.trauma * 44) * set;
      // Two detuned sines per axis: smooth, never repeating in step, and it
      // reaches full swing within a few frames of the hit.
      const t = this.t, q = this.seed;
      this.ox = s * (0.7 * Math.sin(t * 53 + q) + 0.3 * Math.sin(t * 89 + q * 1.7)) + this.kx * set;
      this.oy = s * (0.7 * Math.sin(t * 47 + q * 2.3) + 0.3 * Math.sin(t * 97 + q * 0.6)) + this.ky * set;
      this.zoom = U.damp(this.zoom, this.targetZoom, 3, dt);
      this.clamp();
    }
    clamp() {
      if (!this.bounds) return;
      const hw = DM.W / 2 / this.zoom, hh = DM.H / 2 / this.zoom;
      const b = this.bounds;
      this.x = b.w <= hw * 2 ? b.w / 2 : U.clamp(this.x, hw, b.w - hw);
      this.y = b.h <= hh * 2 ? b.h / 2 : U.clamp(this.y, hh, b.h - hh);
    }
    apply(ctx) {
      ctx.translate(DM.W / 2, DM.H / 2);
      ctx.scale(this.zoom, this.zoom);
      ctx.translate(-this.x + this.ox, -this.y + this.oy);
    }
    toWorld(sx, sy) {
      return { x: (sx - DM.W / 2) / this.zoom + this.x, y: (sy - DM.H / 2) / this.zoom + this.y };
    }
    toScreen(wx, wy) {
      return { x: (wx - this.x) * this.zoom + DM.W / 2, y: (wy - this.y) * this.zoom + DM.H / 2 };
    }
    view() {
      const hw = DM.W / 2 / this.zoom, hh = DM.H / 2 / this.zoom;
      return { x0: this.x - hw, y0: this.y - hh, x1: this.x + hw, y1: this.y + hh };
    }
  }

  DM.Camera = Camera;
})();
</script>
<script>/* src/core/engine.js */
/*
 * Engine: canvas, letterboxing, the main loop and a scene stack.
 *
 * Scenes are plain objects/classes with optional hooks:
 *   enter(params), exit(), resume(), update(dt), render(ctx)
 * and flags:
 *   opaque (default true)  — if false, the scene below is rendered first (overlays)
 *   cursor ('pointer' | 'reticle' | 'none')
 * Only the top scene updates, so pushing an overlay pauses whatever is under it.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;

  const Engine = {
    stack: [],
    time: 0,
    fps: 60,
    scale: 1,
    offX: 0,
    offY: 0,
    dpr: 1,
    fade: { a: 0, dir: 0, speed: 2, color: '#000', cb: null, inSpeed: 2 },
    error: null,

    init(canvas) {
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d');
      this.resize();
      window.addEventListener('resize', () => {
        this.governor.grace = Math.max(this.governor.grace, 1); // dragging a window edge is not slowness
        this.resize();
      });
      this.last = performance.now();
      requestAnimationFrame((t) => this.frame(t));
    },

    // `dpr` is the backing-store ratio actually used: the device pixel ratio
    // (capped at 2) times the QUALITY render scale, minus any tiers the frame
    // governor has dropped this session.
    resize() {
      const device = Math.min(window.devicePixelRatio || 1, 2);
      const dpr = device * this.renderScale();
      const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
      this.canvas.width = Math.max(1, Math.round(w * dpr));
      this.canvas.height = Math.max(1, Math.round(h * dpr));
      this.canvas.style.width = w + 'px';
      this.canvas.style.height = h + 'px';
      this.dpr = dpr;
      this.deviceDpr = device;
      this.scale = Math.min(w / DM.W, h / DM.H);
      this.offX = (w - DM.W * this.scale) / 2;
      this.offY = (h - DM.H * this.scale) / 2;
    },

    // ---- quality & frame stats ----------------------------------------------
    QUALITY: ['high', 'balanced', 'low'],
    RENDER_SCALE: { high: 1, balanced: 0.75, low: 0.5 },
    stats: { updMs: 0, renderMs: 0, gapMs: 1000 / 60 },
    // Drops one QUALITY tier (for this session only; the saved setting is kept)
    // when the frame gap stays above 22 ms for 2 s while the game's own work is
    // a large share of it (a display or browser capped at 30 fps is not slow).
    governor: { enabled: true, limitMs: 22, holdS: 2, slow: 0, grace: 3, drop: 0 },
    notice: null, // { text, shown } for the Play HUD to toast once

    qualityTier() {
      const S = DM.Save && DM.Save.settings;
      const i = Math.max(0, this.QUALITY.indexOf(S && S.quality));
      return this.QUALITY[Math.min(this.QUALITY.length - 1, i + this.governor.drop)];
    },
    renderScale() {
      return this.RENDER_SCALE[this.qualityTier()] || 1;
    },

    // gapMs: the unclamped time since the previous animation frame.
    measure(gapMs) {
      if (!(gapMs > 0) || gapMs > 250 || document.hidden) return; // tab switches, hitches, background tabs
      const st = this.stats, g = this.governor;
      st.gapMs = U.lerp(st.gapMs, gapMs, 0.05);
      if (!g.enabled) return;
      if (g.grace > 0) {
        g.grace -= gapMs / 1000;
        g.slow = 0;
        return;
      }
      const busy = st.updMs + st.renderMs > 0.45 * st.gapMs;
      g.slow = st.gapMs > g.limitMs && busy ? g.slow + gapMs / 1000 : 0;
      if (g.slow < g.holdS || this.qualityTier() === 'low') return;
      g.drop++;
      g.slow = 0;
      g.grace = 3;
      this.resize();
      const tier = this.qualityTier();
      this.notice = { text: `QUALITY LOWERED TO ${tier.toUpperCase()} TO KEEP THE GAME SMOOTH`, shown: false };
      DM.Events.emit('engine:quality', { quality: tier, auto: true });
    },

    toLogical(cx, cy) {
      const r = this.canvas.getBoundingClientRect();
      return { x: (cx - r.left - this.offX) / this.scale, y: (cy - r.top - this.offY) / this.scale };
    },

    // ---- scenes -----------------------------------------------------------
    set(scene, params) {
      while (this.stack.length) {
        const s = this.stack.pop();
        s.exit && s.exit();
      }
      this.push(scene, params);
    },
    push(scene, params) {
      this.stack.push(scene);
      scene.enter && scene.enter(params || {});
    },
    pop() {
      const s = this.stack.pop();
      if (s && s.exit) s.exit();
      const top = this.top();
      if (top && top.resume) top.resume();
      return s;
    },
    remove(scene) {
      const i = this.stack.indexOf(scene);
      if (i < 0) return;
      if (i === this.stack.length - 1) this.pop();
      else {
        this.stack.splice(i, 1);
        scene.exit && scene.exit();
      }
    },
    top() {
      return this.stack[this.stack.length - 1];
    },

    // Fade to a colour, run cb (usually a scene change), fade back in.
    fadeTo(cb, o = {}) {
      const f = this.fade;
      f.color = o.color || '#000';
      f.speed = 1 / (o.out || 0.45);
      f.inSpeed = 1 / (o.in || 0.45);
      f.dir = 1;
      f.cb = cb;
    },
    get fading() {
      return this.fade.dir === 1;
    },

    // ---- loop -------------------------------------------------------------
    frame(t) {
      requestAnimationFrame((tt) => this.frame(tt));
      this.measure(t - this.last);
      let dt = (t - this.last) / 1000;
      this.last = t;
      if (!(dt > 0)) dt = 1 / 60;
      if (dt > 0.05) dt = 0.05; // clamp after tab switches / hitches
      this.time += dt;
      this.fps = U.lerp(this.fps, 1 / dt, 0.05);

      if (this.error) {
        this.renderError();
        if (DM.Input.pressed('confirm')) location.reload();
        DM.Input.endFrame();
        return;
      }

      const f = this.fade;
      if (f.dir === 1) {
        DM.Input.clearAll();
        f.a = Math.min(1, f.a + dt * f.speed);
        if (f.a >= 1) {
          f.dir = -1;
          const cb = f.cb;
          f.cb = null;
          if (cb) this.guard(cb);
        }
      } else if (f.dir === -1) {
        f.a = Math.max(0, f.a - dt * f.inSpeed);
        if (f.a <= 0) f.dir = 0;
      }

      const top = this.top();
      const t0 = performance.now();
      if (top && top.update) this.guard(() => top.update(dt));
      const t1 = performance.now();
      this.guard(() => this.render());
      const st = this.stats;
      st.updMs = U.lerp(st.updMs, t1 - t0, 0.1);
      st.renderMs = U.lerp(st.renderMs, performance.now() - t1, 0.1);
      DM.Input.endFrame();
    },

    guard(fn) {
      try {
        fn();
      } catch (e) {
        console.error(e);
        this.error = e;
      }
    },

    render() {
      const ctx = this.ctx;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#020306';
      ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
      const k = this.dpr * this.scale;
      ctx.setTransform(k, 0, 0, k, this.dpr * this.offX, this.dpr * this.offY);
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, DM.W, DM.H);
      ctx.clip();

      let i = this.stack.length - 1;
      while (i > 0 && this.stack[i].opaque === false) i--;
      for (; i < this.stack.length; i++) {
        ctx.save();
        this.stack[i].render(ctx);
        ctx.restore();
      }
      if (this.fade.a > 0) {
        ctx.globalAlpha = this.fade.a;
        ctx.fillStyle = this.fade.color;
        ctx.fillRect(0, 0, DM.W, DM.H);
        ctx.globalAlpha = 1;
      }
      this.renderCursor(ctx);
      ctx.restore();
    },

    // The game draws its own cursor inside the 1280x720 view; over the letterbox
    // bars (where nothing is drawn) the system cursor comes back.
    renderCursor(ctx) {
      const I = DM.Input;
      const { x, y } = I.mouse;
      const outside = x < 0 || y < 0 || x > DM.W || y > DM.H;
      const sys = outside && !I.touch ? 'default' : 'none';
      if (this.canvas.style.cursor !== sys) this.canvas.style.cursor = sys;
      if (I.touch || !I.mouse.inside || outside) return;
      const top = this.top();
      const mode = (top && top.cursor) || 'pointer';
      if (mode === 'none') return;
      ctx.save();
      if (mode === 'reticle') {
        ctx.strokeStyle = 'rgba(200,245,255,0.9)';
        ctx.lineWidth = 1.5;
        DM.Gfx.circle(ctx, x, y, 9);
        ctx.stroke();
        for (let a = 0; a < 4; a++) {
          const ang = (a * Math.PI) / 2;
          DM.Gfx.line(ctx, x + Math.cos(ang) * 12, y + Math.sin(ang) * 12, x + Math.cos(ang) * 17, y + Math.sin(ang) * 17);
        }
        ctx.fillStyle = '#ffffff';
        DM.Gfx.circle(ctx, x, y, 1.6);
        ctx.fill();
        // Power state at the point of aim: cooldown, low energy, grabs, failures.
        if (top.player && DM.Powers && DM.Powers.renderReticle) DM.Powers.renderReticle(ctx, x, y, top.player);
      } else {
        ctx.fillStyle = '#eefbff';
        ctx.strokeStyle = '#0b1420';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + 13, y + 5);
        ctx.lineTo(x + 6, y + 7);
        ctx.lineTo(x + 4, y + 14);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();
    },

    renderError() {
      const ctx = this.ctx;
      const k = this.dpr * this.scale;
      ctx.setTransform(k, 0, 0, k, this.dpr * this.offX, this.dpr * this.offY);
      ctx.fillStyle = '#0a0d14';
      ctx.fillRect(0, 0, DM.W, DM.H);
      const G = DM.Gfx;
      G.text(ctx, 'THE INTRINSIC FIELD COLLAPSED', DM.W / 2, 260, { size: 34, align: 'center', color: DM.C.blue, spacing: 3, weight: 600 });
      G.text(ctx, 'Something went wrong. Click or press Enter to reload.', DM.W / 2, 310, { size: 18, align: 'center', color: '#cfe0ee' });
      const msg = String((this.error && (this.error.stack || this.error.message)) || this.error).split('\n').slice(0, 6);
      msg.forEach((l, i) => G.text(ctx, l.slice(0, 140), DM.W / 2, 370 + i * 20, { size: 13, align: 'center', color: '#7f93a6', font: DM.FONTS.type }));
    },
  };

  DM.Engine = Engine;
})();
</script>
<script>/* src/core/lighting.js */
/*
 * Lighting: darkness and light for night and interior maps.
 *
 * A low-resolution canvas is filled with the map's ambient darkness, lights
 * are punched out of it with 'destination-out' (cached radial and cone falloff
 * sprites, in screen space), each light's colour is washed over the pool it
 * cleared, and the result is laid over the world: one full-screen blit per
 * frame, whatever the number of lights. Maps without darkness (daylight) skip
 * all of it and cost nothing.
 *
 * The look of each map comes from its profile in src/data/atmosphere.js
 * (keyed by world.mapId):
 *   light: {
 *     ambient: 'rgba(...)' | fn(world) -> colour or null (null = no darkness)
 *     zones: [{ x, y, w, h, ambient }]   world rects with their own darkness
 *     player: 1, playerK: 0.34            Jon's light radius multiplier (0 = none), colour strength
 *     lights(world, add, t)               the map's own lights (lamps, beacons...)
 *   }
 * add(x, y, r, o) takes world units; o: { i (strength 0..1), color, k (colour
 * strength), cone (angle), spread (half-angle), flicker }.
 *
 * Everything else lights itself from game state, so no entity needs to know
 * about lighting: Jon, his duplicates, projectiles, additive glow particles
 * (explosions light the yard), emitters, atoms in the void, and a flashlight
 * along the facing of every armed man still standing (which also shows where
 * he is aiming).
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;

  const MAX_LIGHTS = 160;
  const MAX_PARTICLE_LIGHTS = 48;
  const MAX_ATOM_LIGHTS = 64;
  const CONE_SPREAD = 0.5; // half-angle baked into the cone sprite

  let S = 0.4; // light layer resolution relative to the logical screen (Lighting.resolution)
  let dark = null, dg = null;
  let radial = null, cone = null;
  const pool = [];
  let count = 0;

  function canvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    return c;
  }

  // Alpha falloff used to punch lights out of the darkness.
  function radialSprite() {
    const c = canvas(128, 128);
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(0,0,0,1)');
    gr.addColorStop(0.45, 'rgba(0,0,0,0.75)');
    gr.addColorStop(0.8, 'rgba(0,0,0,0.22)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, 128, 128);
    return c;
  }

  // A wedge pointing right from (0, 128), soft at its edges and its far end.
  function coneSprite() {
    const c = canvas(256, 256);
    const g = c.getContext('2d');
    for (let i = 0; i < 6; i++) {
      const sp = CONE_SPREAD * (1 - i * 0.11);
      g.fillStyle = 'rgba(0,0,0,0.2)';
      g.beginPath();
      g.moveTo(0, 128);
      g.arc(0, 128, 256, -sp, sp);
      g.closePath();
      g.fill();
    }
    g.globalCompositeOperation = 'destination-in';
    const gr = g.createRadialGradient(0, 128, 0, 0, 128, 256);
    gr.addColorStop(0, 'rgba(0,0,0,1)');
    gr.addColorStop(0.5, 'rgba(0,0,0,0.7)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, 256, 256);
    return c;
  }

  // The cone sprite filled with a colour, for the colour wash (cached per colour).
  const cones = new Map();
  function colouredCone(color) {
    let c = cones.get(color);
    if (c) return c;
    c = canvas(256, 256);
    const g = c.getContext('2d');
    g.drawImage(cone, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = color;
    g.fillRect(0, 0, 256, 256);
    if (cones.size > 16) cones.clear();
    cones.set(color, c);
    return c;
  }

  // A cone light: the wedge sprite rotated along l.cone and squeezed to l.spread.
  function drawCone(g, sprite, sx, sy, r, l) {
    g.save();
    g.translate(sx, sy);
    g.rotate(l.cone);
    g.scale(r / 256, (r / 256) * (Math.tan(l.spread) / Math.tan(CONE_SPREAD)));
    g.drawImage(sprite, 0, -128);
    g.restore();
  }

  function setup() {
    S = Lighting.resolution;
    const w = Math.round(DM.W * S), h = Math.round(DM.H * S);
    if (!radial) radial = radialSprite();
    if (!cone) cone = coneSprite();
    if (dark && dark.width === w && dark.height === h) return;
    dark = canvas(w, h);
    dg = dark.getContext('2d');
  }

  // Lights are pooled objects so a frame of 100 lights allocates nothing.
  function add(x, y, r, o) {
    if (count >= MAX_LIGHTS || !(r > 0)) return null;
    let l = pool[count];
    if (!l) l = pool[count] = {};
    count++;
    l.x = x;
    l.y = y;
    l.r = r;
    l.i = o && o.i != null ? o.i : 1;
    l.color = (o && o.color) || null;
    l.k = (o && o.k) || 0;
    l.cone = o && o.cone != null ? o.cone : null;
    l.spread = (o && o.spread) || 0.4;
    l.flicker = !!(o && o.flicker);
    l.seed = (o && o.seed) || x * 0.013 + y * 0.007;
    l.on = false;
    l.fl = 1;
    return l;
  }

  const reducedFlashing = () => !!(DM.SettingsSchema && DM.SettingsSchema.reducedFlashing());

  const Lighting = {
    resolution: 0.4, // of the logical screen; cost scales with its area
    colour: true,
    // Filtered upscale of the layer. Off by default: under film grain the
    // nearest-sampled layer looks the same and costs a tenth in software raster.
    smooth: false,
    stats: { lights: 0, ms: 0 },
    // The light layer canvas (for tests and debugging).
    layers: () => ({ dark }),

    // Darkness colour for this frame, or null when the map is lit by day.
    ambient(world, profile) {
      const L = profile && profile.light;
      if (!L) return null;
      return typeof L.ambient === 'function' ? L.ambient(world) : L.ambient || null;
    },
    active(world, profile) {
      return !!Lighting.ambient(world, profile);
    },

    // Gather this frame's lights (world units) from the profile and the game state.
    collect(world, profile) {
      count = 0;
      const L = profile.light;
      const t = world.realTime || 0;
      const view = world.camera.view();
      const m = 320;
      const near = (x, y, r) => x > view.x0 - r - m && x < view.x1 + r + m && y > view.y0 - r - m && y < view.y1 + r + m;
      const p = world.player;
      const pm = L.player == null ? 1 : L.player;
      if (p && !p.hidden && pm > 0) {
        const fade = p.down ? 0.4 : 1;
        if (p.form === 'manhattan') add(p.x, p.y, 260 * (p.scale || 1) * pm, { i: fade, color: '#5fd4ff', k: (L.playerK == null ? 0.34 : L.playerK) * fade });
        else if (p.form === 'awareness') add(p.x, p.y, 230 * pm, { i: fade, color: '#5fd4ff', k: 0.24 * fade });
      }
      if (L.lights) L.lights(world, add, t);
      const Proj = DM.Proj || {}, En = DM.Enemies || {}, Sp = DM.Special || {}, FX = DM.FX || {};
      let atoms = 0;
      for (const e of world.entities) {
        if (e.dead || e.hidden) continue;
        if (!near(e.x, e.y, 300)) continue;
        if (e.isDuplicate) add(e.x, e.y, 170, { i: 0.85, color: '#5fd4ff', k: 0.12 });
        else if (e.isProjectile) {
          if (Proj.Missile && e instanceof Proj.Missile) add(e.x, e.y, 90, { i: 0.8, color: '#ff9a3c', k: 0.2 });
          else if (Proj.TachyonDisc && e instanceof Proj.TachyonDisc) add(e.x, e.y, 70, { i: 0.7, color: '#c06bff', k: 0.22 });
          else if (Proj.Shell && e instanceof Proj.Shell) add(e.x, e.y, 60, { i: 0.6, color: '#ffd27a', k: 0.16 });
          else add(e.x, e.y, 54, { i: 0.65, color: e.color && e.color[0] === '#' ? e.color : '#ffd27a', k: 0.18 });
        } else if (En.Emitter && e instanceof En.Emitter) add(e.x, e.y, 210, { i: 0.75, color: '#c06bff', k: 0.2 });
        else if (Sp.Atom && e instanceof Sp.Atom) {
          if (atoms++ < MAX_ATOM_LIGHTS) add(e.x, e.y, 44, { i: 0.55, color: '#bff1ff', k: 0.12 });
        } else if (e.human && e.team === 'enemy' && !e.ko) {
          // An armed man carries a flashlight along his facing (it shows where he
          // aims); every hostile gets a little spill so he never vanishes.
          const a = e.facing || 0;
          if (e.gun && !e.heldBy) add(e.x + Math.cos(a) * 10, e.y + Math.sin(a) * 10, 330, { i: 0.78, cone: a, spread: 0.34, color: '#fff2c4', k: 0.05 });
          add(e.x, e.y, 80, { i: 0.55 });
        } else if (e.human && e.ko) add(e.x, e.y, 70, { i: 0.4 }); // the spared stay visible
        else if (FX.Unbinding && e instanceof FX.Unbinding) add(e.x, e.y, 120, { i: 0.6, color: '#bff1ff', k: 0.18 });
        else if (Sp.TachyonCloud && e instanceof Sp.TachyonCloud) add(e.x, e.y, 110, { i: 0.55, color: '#c06bff', k: 0.18 });
        else if (Sp.Memory && e instanceof Sp.Memory && world.timesight) add(e.x, e.y, 90, { i: 0.7, color: '#f2c418', k: 0.15 });
      }
      let parts = 0;
      const P = world.particles.list;
      for (let i = 0; i < P.length && parts < MAX_PARTICLE_LIGHTS; i++) {
        const q = P[i];
        if (!q.add || q.shape !== 'glow' || q.size < 2.5) continue;
        const f = 1 - q.t / q.life;
        const r = q.size * 14 * f;
        if (r < 12 || !near(q.x, q.y, r)) continue;
        parts++;
        add(q.x, q.y, r, { i: 0.85 * f, color: q.color && q.color[0] === '#' ? q.color : null, k: 0.06 * f });
      }
      return count;
    },

    // Draw the light layer over the world. ctx is in logical screen space.
    render(ctx, world, profile) {
      const ambient = Lighting.ambient(world, profile);
      if (!ambient) return false;
      const t0 = performance.now();
      setup();
      const cam = world.camera;
      const z = cam.zoom * S;
      // Same mapping as Camera.apply, shake included, scaled to the light layer.
      const ox = (DM.W / 2) * S - (cam.x - cam.ox) * z, oy = (DM.H / 2) * S - (cam.y - cam.oy) * z;
      const W = dark.width, H = dark.height;
      dg.globalCompositeOperation = 'source-over';
      dg.globalAlpha = 1;
      dg.clearRect(0, 0, W, H);
      dg.fillStyle = ambient;
      dg.fillRect(0, 0, W, H);
      for (const zn of profile.light.zones || []) {
        const a = typeof zn.ambient === 'function' ? zn.ambient(world) : zn.ambient;
        const x = zn.x * z + ox, y = zn.y * z + oy, w = zn.w * z, h = zn.h * z;
        if (x > W || y > H || x + w < 0 || y + h < 0) continue;
        dg.clearRect(x, y, w, h);
        if (a) {
          dg.fillStyle = a;
          dg.fillRect(x, y, w, h);
        }
      }
      const n = Lighting.collect(world, profile);
      const steady = reducedFlashing();
      const tm = world.realTime || 0;
      // The falloffs are smooth enough for nearest sampling, which is several
      // times cheaper than filtering when the browser rasterises in software.
      dg.imageSmoothingEnabled = false;
      dg.globalCompositeOperation = 'destination-out';
      let drawn = 0;
      for (let i = 0; i < n; i++) {
        const l = pool[i];
        const sx = l.x * z + ox, sy = l.y * z + oy, r = l.r * z;
        l.on = !(sx + r < 0 || sy + r < 0 || sx - r > W || sy - r > H);
        if (!l.on) continue;
        drawn++;
        // Lamps breathe a little; never with REDUCED flashing.
        l.fl = l.flicker && !steady ? 0.9 + 0.1 * Math.sin(tm * 9 + l.seed) * Math.sin(tm * 5.3 + l.seed * 2) : 1;
        dg.globalAlpha = U.clamp(l.i * l.fl, 0, 1);
        if (l.cone != null) {
          drawCone(dg, cone, sx, sy, r, l);
          dg.drawImage(radial, sx - r * 0.12, sy - r * 0.12, r * 0.24, r * 0.24);
        } else dg.drawImage(radial, sx - r, sy - r, r * 2, r * 2);
      }
      // Then each light's colour, washed over the pool it cleared.
      if (Lighting.colour) {
        dg.globalCompositeOperation = 'source-over';
        for (let i = 0; i < n; i++) {
          const l = pool[i];
          if (!l.on || !l.color || !(l.k > 0)) continue;
          const sx = l.x * z + ox, sy = l.y * z + oy, r = l.r * z;
          dg.globalAlpha = U.clamp(l.k * l.fl, 0, 1);
          if (l.cone != null) drawCone(dg, colouredCone(l.color), sx, sy, r, l);
          else dg.drawImage(Gfx.glowSprite(l.color, r), sx - r * 0.65, sy - r * 0.65, r * 1.3, r * 1.3);
        }
      }
      dg.globalAlpha = 1;
      dg.globalCompositeOperation = 'source-over';
      dg.imageSmoothingEnabled = true;
      ctx.save();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (!Lighting.smooth) ctx.imageSmoothingEnabled = false;
      ctx.drawImage(dark, 0, 0, DM.W, DM.H);
      ctx.restore();
      Lighting.stats.lights = drawn;
      Lighting.stats.ms = performance.now() - t0;
      return true;
    },
  };

  DM.Lighting = Lighting;
})();
</script>
<script>/* src/core/weather.js */
/*
 * Weather: ambient motion over each map (snow, dust, drizzle, parallax stars,
 * haze) so no place is a still picture. Layers come from the map's profile in
 * src/data/atmosphere.js:
 *   weather: [{ type, n, color, wind, exclude: [rects], only: rect, ... }]
 * `exclude` / `only` are world rects (indoors, outdoors) the layer is clipped to.
 *
 * Particles live in screen space with a depth z. They wrap around the screen
 * and shift by the camera's movement times z, so near ones parallax more. Time
 * is world time: Temporal Sight slows the snow and the pause menu freezes it.
 * Drawn by Play after the world. Save.settings.fx: 'full', 'reduced' (half the
 * particles) or 'off'.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const TAU = Math.PI * 2;
  const PAD = 40;
  const SW = DM.W + PAD * 2, SH = DM.H + PAD * 2;

  const sprites = {};
  function sprite(key, size, paint) {
    if (sprites[key]) return sprites[key];
    const c = document.createElement('canvas');
    c.width = size[0];
    c.height = size[1];
    paint(c.getContext('2d'), size[0], size[1]);
    return (sprites[key] = c);
  }
  // A soft horizontal band (snow haze) and a soft diagonal shaft (light through dust).
  const bandSprite = () => sprite('band', [8, 128], (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, 'rgba(255,255,255,0)');
    gr.addColorStop(0.5, 'rgba(255,255,255,1)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, w, h);
  });
  const shaftSprite = () => sprite('shaft', [64, 256], (g, w, h) => {
    const gx = g.createLinearGradient(0, 0, w, 0);
    gx.addColorStop(0, 'rgba(255,240,210,0)');
    gx.addColorStop(0.5, 'rgba(255,240,210,1)');
    gx.addColorStop(1, 'rgba(255,240,210,0)');
    g.fillStyle = gx;
    g.fillRect(0, 0, w, h);
    g.globalCompositeOperation = 'destination-in';
    const gy = g.createLinearGradient(0, 0, 0, h);
    gy.addColorStop(0, 'rgba(0,0,0,0)');
    gy.addColorStop(0.25, 'rgba(0,0,0,1)');
    gy.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gy;
    g.fillRect(0, 0, w, h);
  });
  // Soft dark blob for cloud shadows (drawn with 'multiply').
  const cloudSprite = (color) => sprite('cloud' + color, [128, 128], (g) => {
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, U.rgba(color, 1));
    gr.addColorStop(0.6, U.rgba(color, 0.6));
    gr.addColorStop(1, U.rgba(color, 0));
    g.fillStyle = gr;
    g.fillRect(0, 0, 128, 128);
  });

  const fxLevel = () => {
    const S = DM.Save && DM.Save.settings;
    const v = S && S.fx;
    return v === 'off' || v === 'reduced' ? v : 'full';
  };

  // ---- layer types --------------------------------------------------------------
  // init(layer, n, rnd) builds the pool; step(layer, dt, t, dx, dy) moves it
  // (dx, dy: camera movement in screen px this frame); draw(ctx, layer, world, t).
  const wrap = (p) => {
    if (p.x < -PAD) p.x += SW;
    else if (p.x > DM.W + PAD) p.x -= SW;
    if (p.y < -PAD) p.y += SH;
    else if (p.y > DM.H + PAD) p.y -= SH;
  };
  const scatter = (n, rnd, zMin, zMax) => {
    const out = [];
    for (let i = 0; i < n; i++) out.push({ x: rnd() * SW - PAD, y: rnd() * SH - PAD, z: zMin + rnd() * (zMax - zMin), s: rnd() });
    return out;
  };
  const drift = (L, dt, dx, dy, vx, vy) => {
    for (const p of L.ps) {
      p.x += vx * p.z * dt - dx * p.z;
      p.y += vy * p.z * dt - dy * p.z;
      wrap(p);
    }
  };

  const TYPES = {
    // Wind-blown streaks with gusts, plus soft haze bands rolling through.
    snow: {
      n: 260,
      init(L, n, rnd) {
        L.ps = scatter(n, rnd, 0.35, 1.5);
        L.bands = [0, 1, 2].map((i) => ({ y: rnd() * SH, z: 0.4 + i * 0.3, h: 90 + i * 50 }));
      },
      step(L, dt, t, dx, dy) {
        L.gust = 1 + Math.sin(t * 0.7) * 0.35 + Math.sin(t * 2.3 + 1) * 0.15;
        drift(L, dt, dx, dy, (L.wind || -260) * L.gust, L.fall || 95);
        for (const b of L.bands) {
          b.y += (25 + 30 * b.z) * dt * L.gust - dy * b.z;
          if (b.y > DM.H + b.h) b.y -= DM.H + b.h * 2;
          if (b.y < -b.h) b.y += DM.H + b.h * 2;
        }
      },
      draw(ctx, L) {
        const wind = (L.wind || -260) * L.gust, fall = L.fall || 95;
        ctx.lineCap = 'round';
        ctx.strokeStyle = L.color || '#ffffff';
        for (let b = 0; b < 3; b++) {
          const z0 = 0.35 + b * 0.39, z1 = z0 + 0.39;
          ctx.globalAlpha = 0.45 + b * 0.2;
          ctx.lineWidth = 1.3 + b * 0.75;
          ctx.beginPath();
          for (const p of L.ps) {
            if (p.z < z0 || p.z >= z1) continue;
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x - wind * p.z * 0.04, p.y - fall * p.z * 0.04);
          }
          ctx.stroke();
        }
        const spr = bandSprite();
        for (const b of L.bands) {
          ctx.globalAlpha = 0.07 + 0.05 * b.z;
          ctx.drawImage(spr, 0, b.y - b.h / 2, DM.W, b.h);
        }
      },
    },

    // Slow motes, and now and then a dust devil whirling across the ground.
    // `clouds` adds big soft cloud shadows sliding over the map.
    dust: {
      n: 150,
      init(L, n, rnd) {
        L.ps = scatter(n, rnd, 0.4, 1.4);
        L.gusts = scatter(Math.round(n / 6), rnd, 0.8, 1.6); // long faint streaks of blown sand
        L.devil = null;
        L.nextDevil = 2 + rnd() * 4;
        L.rnd = rnd;
        if (L.clouds) L.cl = [0, 1, 2, 3].map(() => ({ x: rnd() * 2600, y: rnd() * 2600, r: 280 + rnd() * 260 }));
      },
      step(L, dt, t, dx, dy, world) {
        const wind = L.wind || 60;
        drift(L, dt, dx, dy, wind, 8);
        for (const p of L.ps) p.y += Math.sin(t * 1.3 + p.s * 20) * 6 * dt;
        for (const p of L.gusts) {
          p.x += wind * 5 * p.z * dt - dx * p.z;
          p.y += 12 * p.z * dt - dy * p.z;
          wrap(p);
        }
        L.nextDevil -= dt;
        if (!L.devil && L.nextDevil <= 0) {
          const v = world.camera.view();
          const fromLeft = wind >= 0;
          L.devil = {
            x: fromLeft ? v.x0 - 80 : v.x1 + 80, y: U.lerp(v.y0, v.y1, 0.2 + L.rnd() * 0.6),
            vx: (fromLeft ? 1 : -1) * (110 + L.rnd() * 60), vy: (L.rnd() - 0.5) * 50, t: 0, life: (v.x1 - v.x0 + 160) / 120,
            ps: Array.from({ length: 30 }, (_, i) => ({ a: L.rnd() * TAU, r: 6 + (i / 30) * 46, h: L.rnd() })),
          };
        }
        const d = L.devil;
        if (d) {
          d.t += dt;
          d.x += d.vx * dt;
          d.y += d.vy * dt;
          for (const p of d.ps) p.a += dt * (7 - p.r * 0.07);
          if (d.t > d.life) {
            L.devil = null;
            L.nextDevil = 6 + L.rnd() * 4;
          }
        }
        if (L.cl) for (const c of L.cl) {
          c.x += 26 * dt;
          c.y += 9 * dt;
          if (c.x - c.r > world.w) c.x = -c.r;
          if (c.y - c.r > world.h) c.y = -c.r;
        }
      },
      draw(ctx, L, world) {
        const cam = world.camera;
        if (L.cl) {
          ctx.save();
          ctx.globalCompositeOperation = 'multiply';
          ctx.globalAlpha = 0.5;
          const spr = cloudSprite(L.cloudColor || '#8a5a48');
          for (const c of L.cl) {
            const s = toScreen(cam, c.x, c.y), r = c.r * cam.zoom;
            if (s.x + r < 0 || s.y + r < 0 || s.x - r > DM.W || s.y - r > DM.H) continue;
            ctx.drawImage(spr, s.x - r, s.y - r * 0.7, r * 2, r * 1.4);
          }
          ctx.restore();
        }
        const col = L.color || '#e8c89a';
        ctx.strokeStyle = col;
        ctx.lineWidth = 1.2;
        ctx.globalAlpha = 0.16;
        ctx.beginPath();
        const sx = (L.wind || 60) >= 0 ? -1 : 1;
        for (const p of L.gusts) {
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x + sx * 46 * p.z, p.y - 3 * p.z);
        }
        ctx.stroke();
        ctx.fillStyle = col;
        for (const p of L.ps) {
          ctx.globalAlpha = 0.3 + p.z * 0.3;
          const s = 1.4 + p.z * 1.6;
          ctx.fillRect(p.x, p.y, s, s);
        }
        const d = L.devil;
        if (d) {
          const s = toScreen(cam, d.x, d.y);
          const k = Math.min(1, d.t * 1.5, (d.life - d.t) * 1.5);
          const z = cam.zoom;
          ctx.globalAlpha = 0.16 * k;
          ctx.drawImage(cloudSprite(L.devilColor || '#c8a070'), s.x - 60 * z, s.y - 46 * z, 120 * z, 92 * z);
          ctx.fillStyle = L.devilColor || '#c8a070';
          for (const p of d.ps) {
            ctx.globalAlpha = (0.25 + p.h * 0.35) * k;
            ctx.fillRect(s.x + Math.cos(p.a) * p.r * z, s.y + Math.sin(p.a) * p.r * 0.6 * z - p.h * 26 * z, 2.5, 2.5);
          }
        }
      },
    },

    // Fast thin diagonal rain, and ripples opening on the map's puddles.
    drizzle: {
      n: 220,
      init(L, n, rnd) {
        L.ps = scatter(n, rnd, 0.5, 1.4);
        L.rip = [];
        L.rnd = rnd;
      },
      step(L, dt, t, dx, dy, world) {
        drift(L, dt, dx, dy, L.wind || -140, 760);
        for (const r of L.rip) r.t += dt;
        L.rip = L.rip.filter((r) => r.t < 0.7);
        const pud = L.puddles;
        if (pud && pud.length && L.rip.length < 36) {
          const v = world.camera.view();
          for (let i = 0; i < 3; i++) {
            if (L.rnd() > dt * 16) continue;
            const p = pud[(L.rnd() * pud.length) | 0];
            if (p.x + p.rx < v.x0 || p.x - p.rx > v.x1 || p.y + p.rx < v.y0 || p.y - p.rx > v.y1) continue;
            const a = L.rnd() * TAU, d = Math.sqrt(L.rnd()) * 0.8;
            const x = p.x + Math.cos(a) * p.rx * d, y = p.y + Math.sin(a) * p.rx * 0.45 * d;
            if (world.walls.some((w) => !w.low && x > w.x && x < w.x + w.w && y > w.y && y < w.y + w.h)) continue; // not on a roof
            L.rip.push({ x, y, t: 0 });
          }
        }
      },
      draw(ctx, L, world) {
        const cam = world.camera;
        ctx.strokeStyle = L.ripple || '#a8c8f0';
        ctx.lineWidth = 1;
        for (const r of L.rip) {
          const k = r.t / 0.7;
          const s = toScreen(cam, r.x, r.y), R = (3 + k * 13) * cam.zoom;
          ctx.globalAlpha = 0.45 * (1 - k);
          Gfx.ellipse(ctx, s.x, s.y, R, R * 0.45);
          ctx.stroke();
        }
        const wind = L.wind || -140;
        ctx.strokeStyle = L.color || '#b4ccf0';
        ctx.globalAlpha = 0.28;
        ctx.beginPath();
        for (const p of L.ps) {
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - wind * p.z * 0.022, p.y - 760 * p.z * 0.022);
        }
        ctx.stroke();
      },
    },

    // Three star layers at depths 0.2 / 0.5 / 0.8 over the baked field.
    stars: {
      n: 150,
      init(L, n) {
        L.layers = [0.2, 0.5, 0.8].map((z, i) => ({ z, s: Gfx.makeStars(77 + i, Math.round(n * (0.45 - i * 0.12)), SW, SH) }));
      },
      step() {},
      draw(ctx, L, world, t) {
        const cam = world.camera;
        ctx.fillStyle = L.color || '#d8f0ff';
        for (const ly of L.layers) {
          const ox = -cam.x * cam.zoom * ly.z, oy = -cam.y * cam.zoom * ly.z;
          for (const s of ly.s) {
            let x = (s.x + ox) % SW, y = (s.y + oy) % SH;
            if (x < 0) x += SW;
            if (y < 0) y += SH;
            ctx.globalAlpha = s.a * (0.55 + 0.45 * Math.sin(t * 1.7 + s.tw)) * (0.5 + ly.z * 0.6);
            const r = s.r * (0.6 + ly.z);
            ctx.fillRect(x - PAD, y - PAD, r, r);
          }
        }
      },
    },

    // Slow light shafts and motes floating in them (interiors).
    haze: {
      n: 80,
      init(L, n, rnd) {
        L.ps = scatter(n, rnd, 0.3, 1.1);
        L.shafts = (L.shaftsAt || [0.2, 0.45, 0.7, 0.9]).map((f, i) => ({ f, w: 90 + rnd() * 70, ph: rnd() * TAU, z: 0.3 + (i % 2) * 0.25 }));
      },
      step(L, dt, t, dx, dy) {
        drift(L, dt, dx, dy, 10, -6);
        for (const p of L.ps) p.x += Math.sin(t * 0.8 + p.s * 30) * 8 * dt;
        L.cx = (L.cx || 0) - dx * 0.4;
      },
      draw(ctx, L, world, t) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const spr = shaftSprite();
        for (const s of L.shafts) {
          const x = ((s.f * DM.W + (L.cx || 0) * s.z) % (DM.W + 300) + DM.W + 300) % (DM.W + 300) - 150;
          ctx.globalAlpha = (L.alpha || 0.07) * (0.7 + 0.3 * Math.sin(t * 0.5 + s.ph));
          ctx.save();
          ctx.translate(x, -40);
          ctx.rotate(L.tilt == null ? 0.38 : L.tilt);
          ctx.drawImage(spr, -s.w / 2, 0, s.w, DM.H * 1.5);
          ctx.restore();
        }
        ctx.fillStyle = L.color || '#fff2d8';
        for (const p of L.ps) {
          ctx.globalAlpha = 0.12 + 0.3 * p.z * (0.6 + 0.4 * Math.sin(t * 2 + p.s * 40));
          ctx.fillRect(p.x, p.y, 1.6, 1.6);
        }
        ctx.restore();
      },
    },
  };

  function toScreen(cam, x, y) {
    return { x: (x - cam.x + cam.ox) * cam.zoom + DM.W / 2, y: (y - cam.y + cam.oy) * cam.zoom + DM.H / 2 };
  }
  function screenRect(cam, r) {
    const a = toScreen(cam, r.x, r.y);
    return { x: a.x, y: a.y, w: r.w * cam.zoom, h: r.h * cam.zoom };
  }
  const covers = (r) => r.x <= 0 && r.y <= 0 && r.x + r.w >= DM.W && r.y + r.h >= DM.H;
  const misses = (r) => r.x >= DM.W || r.y >= DM.H || r.x + r.w <= 0 || r.y + r.h <= 0;

  const Weather = {
    TYPES,
    stats: { particles: 0, ms: 0 },

    // The layers for this world, rebuilt when the map or the fx setting changes.
    state(world, profile) {
      const fx = fxLevel();
      let st = world.weatherState;
      if (st && st.fx === fx && st.profile === profile) return st;
      st = world.weatherState = { fx, profile, layers: [], camX: null, camY: null, time: world.time || 0 };
      if (fx === 'off' || !profile || !profile.weather) return st;
      const rnd = U.seeded(String(world.mapId || '').length * 131 + 7);
      for (const spec of profile.weather) {
        const T = TYPES[spec.type];
        if (!T) continue;
        const L = Object.assign({ T }, spec);
        const n = Math.round((spec.n || T.n) * (fx === 'reduced' ? 0.5 : 1));
        T.init(L, n, rnd, world);
        st.layers.push(L);
      }
      return st;
    },

    // Advance and draw. ctx is in logical screen space.
    render(ctx, world, profile) {
      const st = Weather.state(world, profile);
      if (!st.layers.length) return false;
