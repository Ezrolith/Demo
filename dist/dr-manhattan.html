    desc: 'Be somewhere else. Walls, chasms and shields do not apply.',
    tip: 'Press SPACE to teleport to the cursor, or as far as you can reach toward it. The ring shows where you will land.',
    update(p, s, world, dt) {
      s.dest = p.canUsePowers ? teleportDest(p, world, this.range * p.scale) : null;
      pressUpdate(this, p, s, world, dt);
    },
    blocked(p, s) {
      if (s.cd > 0) return 'cooldown';
      if (!s.dest) return 'target';
      if (p.energy < this.cost) return 'energy';
      return null;
    },
    onFail(p, s, world, why) {
      const now = world.realTime || 0;
      if (why !== 'target' || now - (s.barkT == null ? -9 : s.barkT) < 3) return;
      s.barkT = now;
      world.bark(p, 'Somewhere else.', 1.4);
    },
    fire(p, s, world) {
      const dest = s.dest;
      p.spend(this.cost);
      s.cd = this.cooldown;
      const from = { x: p.x, y: p.y };
      world.add(new DM.Special.Afterimage(p));
      world.particles.burst(p.x, p.y, 22, { color: ['#7fe3ff', '#c9a7ff', '#ffffff'], speed: [30, 160], life: [0.3, 0.7], size: [1.5, 3] });
      p.x = dest.x;
      p.y = dest.y;
      p.vx *= 0.3;
      p.vy *= 0.3;
      p.invuln = Math.max(p.invuln, 0.35);
      p.teleportedAt = world.realTime;
      world.particles.emit(p.x, p.y, { shape: 'ring', size: 4, size1: 40 * p.scale, life: 0.3, color: '#c9a7ff', drag: 0 });
      world.particles.burst(p.x, p.y, 18, { color: ['#7fe3ff', '#ffffff'], speed: [60, 220], life: [0.2, 0.5], size: [1.5, 3] });
      Audio.play('teleport');
      DM.Events.emit('player:teleport', { from, to: { x: dest.x, y: dest.y } });
    },
    // Destination preview: where Jon would land, or an X when nowhere fits.
    render(ctx, p, s, world) {
      if (!p.canUsePowers || s.cd > 0) return;
      const m = world.mouse;
      const d = s.dest;
      ctx.save();
      if (!d) {
        ctx.strokeStyle = 'rgba(255,90,74,0.8)';
        ctx.lineWidth = 2;
        Gfx.line(ctx, m.x - 6, m.y - 6, m.x + 6, m.y + 6);
        Gfx.line(ctx, m.x - 6, m.y + 6, m.x + 6, m.y - 6);
        ctx.restore();
        return;
      }
      const a = p.energy < this.cost ? 0.14 : 0.35;
      ctx.strokeStyle = `rgba(201,167,255,${a})`;
      ctx.lineWidth = 1.5;
      Gfx.circle(ctx, d.x, d.y, p.r);
      ctx.stroke();
      if (d.clamped) {
        ctx.setLineDash([4, 6]);
        ctx.strokeStyle = `rgba(201,167,255,${a * 0.8})`;
        Gfx.line(ctx, d.x, d.y, m.x, m.y);
      }
      ctx.restore();
    },
  });

  // ---- Quantum Duplication ---------------------------------------------------
  Powers.register({
    id: 'duplicate',
    name: 'Duplicate',
    action: 'duplicate',
    press: true,
    color: '#7bd88f',
    cost: 50,
    cooldown: 9,
    desc: 'Divide your attention. And yourself.',
    tip: 'Press R to split off two copies of yourself. They hunt nearby threats for a few seconds.',
    update(p, s, world, dt) {
      pressUpdate(this, p, s, world, dt);
    },
    blocked(p, s) {
      if (s.cd > 0) return 'cooldown';
      if (p.energy < this.cost) return 'energy';
      return null;
    },
    fire(p, s, world) {
      p.spend(this.cost);
      s.cd = this.cooldown;
      const mine = world.entities.filter((e) => e.isDuplicate && !e.dead);
      while (mine.length > 2) mine.shift().expire(world);
      for (const side of [-1, 1]) {
        const a = p.facing + side * 1.9;
        let x = p.x + Math.cos(a) * 42, y = p.y + Math.sin(a) * 42;
        if (!world.isFree(x, y, 12)) {
          x = p.x;
          y = p.y;
        }
        world.add(new DM.Special.Duplicate(p, x, y, 10));
        world.particles.burst(x, y, 16, { color: ['#7fe3ff', '#7bd88f', '#ffffff'], speed: [40, 180], life: [0.2, 0.6], size: [1.5, 3] });
      }
      Audio.play('duplicate');
    },
  });

  // ---- Temporal Sight -------------------------------------------------------
  const CLOUDED_SLOWMO = 0.6; // the slowest Sight can run inside a tachyon cloud (world.sightFloor)

  Powers.register({
    id: 'timesight',
    name: 'Temporal Sight',
    action: 'timesight',
    color: '#f2c418',
    channelRegen: 0.4,
    desc: 'See every moment at once. The world slows; what is about to happen becomes visible.',
    tip: 'HOLD F or SHIFT. Time slows, incoming danger is marked and hidden memories appear. Drains energy.',
    update(p, s, world, dt) {
      // Only the emitters' jamming (jamT) blinds Sight. A tachyon cloud
      // (sightJamT) clouds it: it still works, but time slows less.
      p.sightJamT = Math.max(0, (p.sightJamT || 0) - dt);
      const want = p.canUsePowers && Input.down('timesight') && p.energy > 0.5 && !p.jammed;
      if (want !== s.active) {
        s.active = want;
        Audio.play(want ? 'timesight_on' : 'timesight_off');
        Audio.setMusicFilter(want ? 650 : 18000);
        if (!want && p.jammed && Input.down('timesight')) world.bark(p, 'Tachyons. I cannot see.', 1.4);
      }
      world.slowmo = s.active;
      world.timesight = s.active;
      world.sightFloor = s.active && p.sightJamT > 0 ? CLOUDED_SLOWMO : 0;
      if (s.active) {
        p.drain = true;
        p.energy -= 12 * dt;
      }
    },
  });

  // ---- Expand ---------------------------------------------------------------
  Powers.register({
    id: 'expand',
    name: 'Expand',
    action: 'expand',
    press: true,
    color: '#ff8fb8',
    cost: 55,
    refund: 25, // handed back on cast, so there is energy left to lift with
    cooldown: 16,
    desc: 'Mass is a matter of opinion. Grow, briefly, to the size of a building.',
    tip: 'Press G to grow for a few seconds: a shockwave, triple strength, bullets barely register, and you can lift the heaviest things.',
    update(p, s, world, dt) {
      pressUpdate(this, p, s, world, dt);
    },
    blocked(p, s) {
      if (s.cd > 0) return 'cooldown';
      if (p.expandT > 0) return 'active';
      if (p.energy < this.cost) return 'energy';
      return null;
    },
    fire(p, s, world) {
      p.spend(this.cost);
      p.energy = Math.min(p.maxEnergy, p.energy + this.refund);
      s.cd = this.cooldown;
      p.expandT = 7;
      p.targetScale = 2.2;
      world.camera.targetZoom = world.baseZoom * 0.8;
      for (const e of world.entities) {
        if (e === p || e.dead || e.static || e.team === 'player') continue;
        const d = U.dist(p.x, p.y, e.x, e.y);
        if (d > 260) continue;
        const n = U.norm(e.x - p.x, e.y - p.y);
        const k = 1 - d / 260;
        e.vx += (n.x * 900 * k) / Math.sqrt(e.mass);
        e.vy += (n.y * 900 * k) / Math.sqrt(e.mass);
        if (e.team === 'enemy') {
          e.stun = Math.max(e.stun, 1.2);
          e.thrown = 0.6;
        }
        if (e.isProjectile) e.die('blocked');
      }
      world.particles.emit(p.x, p.y, { shape: 'ring', size: 20, size1: 270, life: 0.45, color: '#ff8fb8', drag: 0 });
      world.particles.burst(p.x, p.y, 40, { color: ['#7fe3ff', '#ff8fb8', '#ffffff'], speed: [200, 520], life: [0.3, 0.7], size: [2, 4], shape: 'spark', drag: 3 });
      world.camera.shake(0.6);
      Audio.play('expand');
    },
  });

  // ---- Reticle --------------------------------------------------------------
  // Drawn by the engine over its base reticle, in screen space, so power state
  // reads where the player is already looking.
  Powers.renderReticle = (ctx, x, y, p) => {
    const t = DM.Engine.time;
    ctx.save();
    if (p.energy < 20) {
      // Running low: the whole reticle warms to red-orange.
      ctx.strokeStyle = 'rgba(255,128,84,0.95)';
      ctx.lineWidth = 1.5;
      Gfx.circle(ctx, x, y, 9);
      ctx.stroke();
      for (let a = 0; a < 4; a++) {
        const ang = (a * Math.PI) / 2;
        Gfx.line(ctx, x + Math.cos(ang) * 12, y + Math.sin(ang) * 12, x + Math.cos(ang) * 17, y + Math.sin(ang) * 17);
      }
    }
    const def = Powers.byId.disintegrate;
    const ds = p.powers.disintegrate;
    if (ds && ds.cd > 0 && def.forms.includes(p.form)) {
      const f = ds.cd / def.cooldown;
      ctx.strokeStyle = 'rgba(255,178,122,0.28)';
      ctx.lineWidth = 2;
      Gfx.circle(ctx, x, y, 13.5);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,190,140,0.95)';
      ctx.beginPath();
      ctx.arc(x, y, 13.5, -Math.PI / 2, -Math.PI / 2 + f * TAU);
      ctx.stroke();
    }
    const tk = p.powers.telekinesis;
    if (tk && (tk.hover || tk.target) && p.form === 'manhattan') {
      // A small cradle under the reticle: open while hovering, filled while holding.
      const heavy = tk.hover && !tk.target && tk.hover.mass > p.tkMaxMass();
      ctx.strokeStyle = heavy ? 'rgba(255,120,100,0.9)' : 'rgba(127,227,255,0.95)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y + 21, 5, 0.15, Math.PI - 0.15);
      ctx.stroke();
      if (tk.target) {
        ctx.fillStyle = 'rgba(127,227,255,0.95)';
        Gfx.circle(ctx, x, y + 21, 2.6);
        ctx.fill();
      }
    }
    if (p.reticleFail > 0) {
      const k = p.reticleFail / 0.25;
      ctx.strokeStyle = `rgba(255,70,60,${0.95 * k})`;
      ctx.lineWidth = 2.5;
      Gfx.circle(ctx, x, y, 9 + (1 - k) * 12);
      ctx.stroke();
      ctx.globalAlpha = 0.5 * k * (0.6 + 0.4 * Math.sin(t * 60));
      ctx.fillStyle = '#ff463c';
      Gfx.circle(ctx, x, y, 9);
      ctx.fill();
    }
    ctx.restore();
  };

  // ---- Sparing pays -----------------------------------------------------------
  // A knockout (never a kill) steadies Jon: a little energy and coherence, carried
  // back to him from the body as a visible pip.
  const SPARE_ENERGY = 10;
  const SPARE_COHERENCE = 4;
  const rewarded = new WeakSet(); // one reward per person, however often a body is knocked about
  DM.Events.on('enemy:down', (ev) => {
    if (!ev || !ev.human || ev.lethal || !ev.enemy || rewarded.has(ev.enemy)) return;
    const e = ev.enemy;
    const w = e.world;
    const p = w && w.player;
    if (!p || p.down || p.form === 'human') return;
    rewarded.add(e);
    p.energy = Math.min(p.maxEnergy, p.energy + SPARE_ENERGY);
    p.coherence = Math.min(p.maxCoherence, p.coherence + SPARE_COHERENCE);
    const life = U.clamp(U.dist(e.x, e.y, p.x, p.y) / 650, 0.25, 0.9);
    const vx = (p.x - e.x) / life, vy = (p.y - e.y) / life;
    w.particles.emit(e.x, e.y, { vx, vy, life, size: 7, size1: 4, color: '#7fe3ff', drag: 0, shape: 'glow' });
    w.particles.emit(e.x, e.y, { vx, vy, life, size: 2.5, size1: 1.5, color: '#ffffff', drag: 0 });
  });

  DM.Powers = Powers;
})();
</script>
<script>/* src/game/entities/props.js */
/* Props: crates, barrels, vehicles, doors, target zones, training dummies, and generic set dressing. */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Entity = DM.Entity;

  // Rotation that follows motion, so thrown boxes tumble.
  function tumble(e, dt) {
    e.rot = (e.rot || 0) + (e.vx * 0.004 - e.vy * 0.002) * dt * 60 * 0.15;
  }

  class Crate extends Entity {
    constructor(x, y, o = {}) {
      super(Object.assign({ x, y, r: 15, mass: 1.5, friction: 5, hp: 60, grabbable: true, colors: ['#a07a4a', '#7a5a34', '#c49a62'], tags: ['crate'] }, o));
      this.rot = U.rand(0, Math.PI);
      this.style = o.style || 'wood';
    }
    update(dt) {
      tumble(this, dt);
    }
    onDeath(kind) {
      if (kind !== 'disintegrate' && this.world) this.world.particles.burst(this.x, this.y, 16, { color: this.colors, speed: [60, 220], life: [0.4, 0.9], size: [3, 6], shape: 'shard', vr: 12, add: false, drag: 3 });
    }
    render(ctx) {
      const s = this.r * 1.75;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(-s / 2 + 3, -s / 2 + 4, s, s);
      ctx.rotate(this.rot);
      if (this.style === 'metal') {
        ctx.fillStyle = '#5d6b4a';
        ctx.fillRect(-s / 2, -s / 2, s, s);
        ctx.strokeStyle = '#3a4430';
        ctx.lineWidth = 2;
        ctx.strokeRect(-s / 2 + 3, -s / 2 + 3, s - 6, s - 6);
        ctx.fillStyle = '#e8d27a';
        ctx.fillRect(-s / 4, -2, s / 2, 4);
      } else {
        ctx.fillStyle = '#a57d4b';
        ctx.fillRect(-s / 2, -s / 2, s, s);
        ctx.strokeStyle = '#6e5130';
        ctx.lineWidth = 2;
        ctx.strokeRect(-s / 2 + 1, -s / 2 + 1, s - 2, s - 2);
        Gfx.line(ctx, -s / 2, -s / 2, s / 2, s / 2);
        Gfx.line(ctx, -s / 2, s / 2, s / 2, -s / 2);
      }
      if (this.hitFlash > 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillRect(-s / 2, -s / 2, s, s);
      }
      ctx.restore();
    }
  }

  class Barrel extends Entity {
    constructor(x, y, o = {}) {
      super(Object.assign({ x, y, r: 12, mass: 1.2, friction: 4, hp: 25, grabbable: true, colors: ['#b8402e', '#7a2a1e', '#e0c060'] }, o));
    }
    onDeath(kind) {
      if (kind === 'disintegrate' || !this.world) return;
      this.world.defer((w) => w.explode(this.x, this.y, 85, 45, { source: this }));
    }
    render(ctx) {
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      Gfx.circle(ctx, this.x + 3, this.y + 4, this.r);
      ctx.fill();
      ctx.fillStyle = this.hitFlash > 0 ? '#ffd0c0' : '#b8402e';
      Gfx.circle(ctx, this.x, this.y, this.r);
      ctx.fill();
      ctx.strokeStyle = '#6e2318';
      ctx.lineWidth = 2;
      Gfx.circle(ctx, this.x, this.y, this.r * 0.65);
      ctx.stroke();
      ctx.fillStyle = '#f2c418';
      ctx.font = Gfx.font(9, DM.FONTS.display, 700);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('!', this.x, this.y + 1);
    }
  }

  // Vehicles: jeep / sedan / wreck. Heavy, grabbable, great for throwing.
  class Vehicle extends Entity {
    constructor(x, y, o = {}) {
      super(Object.assign({ x, y, r: 26, mass: 5, friction: 4, hp: 400, grabbable: true, colors: ['#556b3a', '#3a4a28', '#222'] }, o));
      this.rot = o.rot || 0;
      this.kind = o.kind || 'jeep';
      this.paint = o.paint || (this.kind === 'sedan' ? U.pick(['#7a2e2e', '#2e4a7a', '#2f2f33', '#6b6b4a']) : '#556b3a');
      this.burnt = this.kind === 'wreck';
    }
    update(dt) {
      if (this.speed > 30) this.rot = U.dampAngle(this.rot, Math.atan2(this.vy, this.vx), 2, dt);
      if (this.heldBy) this.rot += dt * 0.6;
    }
    onDeath(kind) {
      if (kind !== 'disintegrate' && this.world) this.world.defer((w) => w.explode(this.x, this.y, 90, 30, { source: this }));
    }
    render(ctx) {
      const L = this.r * 2.4, W = this.r * 1.35;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(-L / 2 + 4, -W / 2 + 5, L, W);
      ctx.rotate(this.rot);
      ctx.fillStyle = '#151515';
      for (const sx of [-1, 1]) for (const sy of [-1, 1]) ctx.fillRect(sx * L * 0.3 - 6, sy * W * 0.5 - 4, 12, 8);
      ctx.fillStyle = this.burnt ? '#3a332c' : this.paint;
      Gfx.rr(ctx, -L / 2, -W / 2, L, W, 6);
      ctx.fill();
      ctx.fillStyle = this.burnt ? '#241f1b' : 'rgba(0,0,0,0.25)';
      ctx.fillRect(-L * 0.1, -W / 2 + 3, L * 0.32, W - 6);
      ctx.fillStyle = this.burnt ? '#1b1815' : 'rgba(170,210,230,0.55)';
      ctx.fillRect(L * 0.18, -W / 2 + 4, 6, W - 8);
      if (this.kind === 'jeep') {
        ctx.fillStyle = '#e8e2c8';
        Gfx.circle(ctx, -L * 0.25, 0, 5);
        ctx.fill();
      }
      if (this.hitFlash > 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.fillRect(-L / 2, -W / 2, L, W);
      }
      ctx.restore();
    }
  }

  // Generic set dressing or interactable. Pass draw(ctx, e, world).
  class Prop extends Entity {
    constructor(o) {
      super(Object.assign({ r: 14, static: true, body: false, solid: false, disintegratable: false, layer: 0 }, o));
      this.drawFn = o.draw || null;
      this.data = o.data || {};
    }
    render(ctx, world) {
      if (this.drawFn) this.drawFn(ctx, this, world);
    }
  }

  // A sliding door that toggles a wall rect.
  class Door extends Entity {
    constructor(world, x, y, w, h, o = {}) {
      super({ x: x + w / 2, y: y + h / 2, r: 4, static: true, body: false, solid: false, disintegratable: false, layer: 1 });
      this.rect = { x, y, w, h };
      this.wall = world.wall(x, y, w, h, 'door');
      this.open = !!o.open;
      this.k = this.open ? 1 : 0;
      this.vertical = h > w;
      this.color = o.color || '#8a929c';
      this.stripe = o.stripe || '#f2c418';
      this.wall.noCollide = this.open;
    }
    setOpen(v) {
      if (v === this.open) return;
      this.open = v;
      DM.Audio.play('door');
    }
    update(dt) {
      this.k = U.approach(this.k, this.open ? 1 : 0, dt * 2.6);
      this.wall.noCollide = this.k > 0.55;
    }
    render(ctx) {
      const R = this.rect;
      const k = this.k;
      ctx.save();
      ctx.fillStyle = '#1a1d22';
      ctx.fillRect(R.x, R.y, R.w, R.h);
      ctx.fillStyle = this.color;
      if (this.vertical) {
        const half = (R.h / 2) * (1 - k);
        ctx.fillRect(R.x, R.y, R.w, half);
        ctx.fillRect(R.x, R.y + R.h - half, R.w, half);
        ctx.fillStyle = this.stripe;
        if (half > 4) {
          ctx.fillRect(R.x, R.y + half - 4, R.w, 3);
          ctx.fillRect(R.x, R.y + R.h - half + 1, R.w, 3);
        }
      } else {
        const half = (R.w / 2) * (1 - k);
        ctx.fillRect(R.x, R.y, half, R.h);
        ctx.fillRect(R.x + R.w - half, R.y, half, R.h);
        ctx.fillStyle = this.stripe;
        if (half > 4) {
          ctx.fillRect(R.x + half - 4, R.y, 3, R.h);
          ctx.fillRect(R.x + R.w - half + 1, R.y, 3, R.h);
        }
      }
      ctx.restore();
    }
  }

  // A marked area that absorbs accepted entities (crates in the test range).
  class Zone extends Entity {
    constructor(x, y, r, o = {}) {
      super({ x, y, r, static: true, body: false, solid: false, disintegratable: false, layer: 0 });
      this.accept = o.accept || (() => false);
      this.onAccept = o.onAccept || null;
      this.label = o.label || 'TARGET ZONE';
      this.color = o.color || '#f2c418';
      this.pulse = 0;
    }
    update(dt, world) {
      this.pulse = Math.max(0, this.pulse - dt);
      for (const e of world.entities) {
        if (e.dead || e.heldBy || !this.accept(e)) continue;
        if (U.dist(this.x, this.y, e.x, e.y) > this.r - e.r * 0.3) continue;
        e.dead = true;
        this.pulse = 0.6;
        world.particles.burst(e.x, e.y, 30, { color: ['#f2c418', '#ffffff', '#7fe3ff'], speed: [60, 260], life: [0.3, 0.8], size: [2, 4] });
        world.particles.emit(this.x, this.y, { shape: 'ring', size: 10, size1: this.r * 1.2, life: 0.4, color: '#f2c418', drag: 0 });
        DM.Audio.play('objective');
        if (this.onAccept) this.onAccept(e);
      }
    }
    render(ctx, world) {
      const t = world.realTime || 0;
      ctx.save();
      ctx.fillStyle = U.rgba(this.color, 0.08 + this.pulse * 0.3);
      Gfx.circle(ctx, this.x, this.y, this.r);
      ctx.fill();
      ctx.strokeStyle = U.rgba(this.color, 0.85);
      ctx.lineWidth = 3;
      ctx.setLineDash([14, 10]);
      ctx.lineDashOffset = -t * 20;
      Gfx.circle(ctx, this.x, this.y, this.r);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.lineWidth = 1.5;
      Gfx.circle(ctx, this.x, this.y, this.r * 0.5);
      ctx.stroke();
      ctx.restore();
      Gfx.text(ctx, this.label, this.x, this.y + this.r + 18, { size: 13, align: 'center', color: U.rgba(this.color, 0.9), spacing: 2, weight: 600 });
    }
  }

  // Training target. Optional rail movement.
  class Dummy extends Entity {
    constructor(x, y, o = {}) {
      super({ x, y, r: 15, static: true, body: true, hp: 1, team: 'target', colors: ['#e8e2d0', '#c4302b', '#6b5a40'], layer: 1 });
      this.baseX = x;
      this.baseY = y;
      this.rail = o.rail || null; // { dx, dy, speed }
      this.phase = U.rand(0, 6);
    }
    update(dt) {
      if (!this.rail) return;
      this.phase += dt * this.rail.speed;
      const s = Math.sin(this.phase);
      this.x = this.baseX + this.rail.dx * s;
      this.y = this.baseY + this.rail.dy * s;
    }
    render(ctx) {
      if (this.rail) {
        ctx.strokeStyle = 'rgba(40,30,20,0.4)';
        ctx.lineWidth = 3;
        Gfx.line(ctx, this.baseX - this.rail.dx, this.baseY - this.rail.dy, this.baseX + this.rail.dx, this.baseY + this.rail.dy);
      }
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      Gfx.circle(ctx, this.x + 3, this.y + 4, this.r);
      ctx.fill();
      const cols = ['#e8e2d0', '#c4302b', '#e8e2d0', '#c4302b'];
      for (let i = 0; i < 4; i++) {
        ctx.fillStyle = cols[i];
        Gfx.circle(ctx, this.x, this.y, this.r * (1 - i * 0.24));
        ctx.fill();
      }
    }
  }

  DM.Props = { Crate, Barrel, Vehicle, Prop, Door, Zone, Dummy };
})();
</script>
<script>/* src/game/entities/projectiles.js */
/* Projectiles: bullets, energy bolts, artillery shells, homing missiles, tachyon discs. */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Entity = DM.Entity;

  const TRAIL = 0.04; // tracer length, in seconds of travel

  // Fast straight shot. Moves itself with a swept segment test so it never tunnels.
  class Bullet extends Entity {
    constructor(o) {
      super({ x: o.x, y: o.y, vx: o.vx, vy: o.vy, r: o.r || 3, body: false, solid: false, layer: 2, disintegratable: true, team: o.team || 'enemy' });
      this.selfMove = true;
      this.isProjectile = true;
      this.dmg = o.dmg == null ? 6 : o.dmg;
      this.life = o.life || 1.8;
      this.color = o.color || '#ffd27a';
      this.kind = o.kind || 'bullet';
      this.width = o.width || 2;
    }
    update(dt, world) {
      this.life -= dt;
      if (this.life <= 0) return this.die('expire');
      const nx = this.x + this.vx * dt, ny = this.y + this.vy * dt;
      const t = world.shotHit(this.x, this.y, nx, ny);
      if (t >= 0) {
        const hx = this.x + (nx - this.x) * t, hy = this.y + (ny - this.y) * t;
        world.particles.burst(hx, hy, 5, { color: [this.color, '#ffffff'], speed: [40, 160], life: [0.1, 0.25], size: [1, 2], shape: 'spark' });
        return this.die('wall');
      }
      for (const e of world.entities) {
        if (e.dead || e === this || e.team === this.team || e.isProjectile || !e.body) continue;
        if (e.hp == null && !e.isPlayer && !e.blocksShots) continue;
        if (e.ko) continue;
        if (!U.segCircle(this.x, this.y, nx, ny, e.x, e.y, e.r + this.r)) continue;
        if (e.shieldR && U.dist(this.x, this.y, e.x, e.y) > e.shieldR - 2) continue;
        e.damage(this.dmg, this, this.kind);
        world.particles.burst(this.x, this.y, 6, { color: [this.color, '#ffffff'], speed: [40, 180], life: [0.1, 0.3], size: [1, 2.5], shape: 'spark' });
        return this.die('hit');
      }
      this.x = nx;
      this.y = ny;
    }
    // A dark underline first, so bright tracers still read on sand and snow.
    render(ctx) {
      const tx = this.x - this.vx * TRAIL, ty = this.y - this.vy * TRAIL;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(20,10,0,0.6)';
      ctx.lineWidth = this.width + 2;
      Gfx.line(ctx, tx, ty, this.x, this.y);
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = this.color;
      ctx.lineWidth = this.width;
      Gfx.line(ctx, tx, ty, this.x, this.y);
      ctx.restore();
    }
    renderFuture(ctx, world) {
      const nx = this.x + this.vx * 1.2, ny = this.y + this.vy * 1.2;
      const t = world.shotHit(this.x, this.y, nx, ny);
      const ex = t >= 0 ? this.x + (nx - this.x) * t : nx, ey = t >= 0 ? this.y + (ny - this.y) * t : ny;
      ctx.save();
      ctx.strokeStyle = 'rgba(255,90,74,0.35)';
      ctx.setLineDash([4, 6]);
      Gfx.line(ctx, this.x, this.y, ex, ey);
      ctx.restore();
    }
  }

  // Energy bolt fired by Dr. Manhattan's duplicates.
  class Bolt extends Bullet {
    constructor(o) {
      super(Object.assign({ color: '#7fe3ff', team: 'player', dmg: 18, r: 4, width: 3, kind: 'bolt', life: 1.4 }, o));
    }
    render(ctx) {
      super.render(ctx);
      Gfx.glow(ctx, this.x, this.y, 12, '#5fd4ff', 0.8);
    }
  }

  // Artillery shell: lobbed at a ground point, marked with a warning ring.
  class Shell extends Entity {
    constructor(o) {
      super({ x: o.x, y: o.y, r: 6, body: false, solid: false, layer: 3, disintegratable: true, team: o.team || 'enemy' });
      this.selfMove = true;
      this.isProjectile = true;
      this.sx = o.x;
      this.sy = o.y;
      this.tx = o.tx;
      this.ty = o.ty;
      this.T = o.T || 1.1;
      this.t = 0;
      this.dmg = o.dmg || 18;
      this.radius = o.radius || 70;
      this.h = 0;
    }
    update(dt, world) {
      this.t += dt;
      const k = Math.min(1, this.t / this.T);
      this.x = U.lerp(this.sx, this.tx, k);
      this.y = U.lerp(this.sy, this.ty, k);
      this.h = Math.sin(k * Math.PI) * Math.min(220, U.dist(this.sx, this.sy, this.tx, this.ty) * 0.45);
      if (k >= 1) {
        this.dead = true;
        world.explode(this.tx, this.ty, this.radius, this.dmg, { team: this.team });
      }
    }
    render(ctx) {
      const k = Math.min(1, this.t / this.T);
      ctx.save();
      ctx.strokeStyle = `rgba(255,80,60,${0.25 + k * 0.6})`;
      ctx.fillStyle = `rgba(255,80,60,${0.05 + k * 0.12})`;
      ctx.lineWidth = 2;
      Gfx.circle(ctx, this.tx, this.ty, this.radius);
      ctx.fill();
      ctx.stroke();
      Gfx.circle(ctx, this.tx, this.ty, this.radius * k);
      ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      Gfx.ellipse(ctx, this.x, this.y, 6, 4);
      ctx.fill();
      ctx.fillStyle = '#3a3a30';
      Gfx.circle(ctx, this.x, this.y - this.h, 6);
      ctx.fill();
      ctx.restore();
      Gfx.glow(ctx, this.x, this.y - this.h, 14, '#ff9a3c', 0.6);
    }
  }

  // Homing missile. Grab it with telekinesis and it's yours.
  class Missile extends Entity {
    constructor(o) {
      super({ x: o.x, y: o.y, r: 8, mass: 0.5, friction: 0, bounce: 0, team: 'enemy', grabbable: true, hp: 1, layer: 2, colors: ['#d8d8d0', '#ff9a3c'] });
      this.isProjectile = true;
      this.angle = o.angle || 0;
      this.speedBase = o.speed || 250;
      this.turn = o.turn || 2.1;
      this.life = o.life || 8;
      this.vx = Math.cos(this.angle) * this.speedBase;
      this.vy = Math.sin(this.angle) * this.speedBase;
      this.body = false;
    }
    onGrab() {
      this.team = 'player';
    }
    update(dt, world) {
      this.life -= dt;
      if (this.life <= 0) return this.boom(world);
      if (this.heldBy || this.team === 'player') {
        this.body = !this.heldBy;
        if (this.speed > 40) this.angle = Math.atan2(this.vy, this.vx);
        if (!this.heldBy) {
          // Looks one step ahead, so it bursts on contact rather than after bouncing off.
          const nx = this.x + this.vx * dt, ny = this.y + this.vy * dt;
          for (const e of world.entities) {
            if (e.dead || e.team !== 'enemy' || e === this || e.isProjectile || e.ko) continue;
            const reach = e.r + this.r + 4;
            if (U.dist(this.x, this.y, e.x, e.y) < reach || U.dist(nx, ny, e.x, e.y) < reach) return this.boom(world);
          }
        }
        return;
      }
      let target = null, bd = 900;
      for (const e of world.entities) {
        if (e.dead || e.team !== 'player' || !e.targetable) continue;
        const d = U.dist(this.x, this.y, e.x, e.y);
        if (d < bd) {
          bd = d;
          target = e;
        }
      }
      if (target) {
        const want = U.angleTo(this.x, this.y, target.x, target.y);
        const diff = U.wrapAngle(want - this.angle);
        this.angle += U.clamp(diff, -this.turn * dt, this.turn * dt);
        if (bd < target.r + this.r + 2) return this.boom(world);
      }
      this.vx = Math.cos(this.angle) * this.speedBase;
      this.vy = Math.sin(this.angle) * this.speedBase;
      if (Math.random() < dt * 40) world.particles.emit(this.x - Math.cos(this.angle) * 10, this.y - Math.sin(this.angle) * 10, { vx: U.rand(-20, 20), vy: U.rand(-20, 20), life: 0.5, size: 4, size1: 9, color: '#9a948a', add: false, shape: 'smoke', alpha: 0.5 });
    }
    onWall(speed, w, world) {
      this.boom(world);
    }
    onImpact(speed, other, world) {
      this.boom(world);
    }
    damage() {
      this.boom(this.world);
      return true;
    }
    boom(world) {
      if (this.dead) return;
      this.dead = true;
      const mine = this.team === 'player';
      world.explode(this.x, this.y, mine ? 75 : 60, mine ? 90 : 16, { team: this.team, source: this });
    }
    render(ctx) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      ctx.fillStyle = this.team === 'player' ? '#cfefff' : '#d8d8d0';
      ctx.fillRect(-10, -3.5, 18, 7);
      ctx.fillStyle = '#c4302b';
      ctx.beginPath();
      ctx.moveTo(8, -3.5);
      ctx.lineTo(13, 0);
      ctx.lineTo(8, 3.5);
      ctx.fill();
      ctx.fillStyle = '#555';
      ctx.fillRect(-10, -6, 4, 12);
      ctx.restore();
      if (!this.heldBy) Gfx.glow(ctx, this.x - Math.cos(this.angle) * 11, this.y - Math.sin(this.angle) * 11, 12, '#ff9a3c', 0.8);
    }
    renderFuture(ctx) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,154,60,0.4)';
      ctx.setLineDash([3, 5]);
      Gfx.line(ctx, this.x, this.y, this.x + this.vx * 1.2, this.y + this.vy * 1.2);
      ctx.restore();
    }
  }

  // Veidt's tachyon disc: thrown along a line to its full range (a dodged disc
  // bursts beyond Jon or against a wall), it leaves a cloud that clouds Temporal Sight.
  const DISC = { speed: 480, range: 520, dmg: 8, jam: 1 };

  class TachyonDisc extends Entity {
    constructor(o) {
      super({ x: o.x, y: o.y, r: 6, body: false, solid: false, layer: 2, disintegratable: true, team: 'enemy' });
      this.selfMove = true;
      this.isProjectile = true;
      let n = U.norm(o.tx - o.x, o.ty - o.y);
      if (!n.l) n = { x: 1, y: 0 };
      this.vx = n.x * DISC.speed;
      this.vy = n.y * DISC.speed;
      this.travel = o.range || DISC.range;
      this.spin = 0;
    }
    update(dt, world) {
      this.spin += dt * 20;
      const step = Math.hypot(this.vx, this.vy) * dt;
      const nx = this.x + this.vx * dt, ny = this.y + this.vy * dt;
      this.travel -= step;
      const p = world.player;
      if (p && !p.dead && U.segCircle(this.x, this.y, nx, ny, p.x, p.y, p.r + 6)) {
        p.damage(DISC.dmg, this, 'disc');
        p.jamT = Math.max(p.jamT, DISC.jam);
        return this.burst(world);
      }
      if (this.travel <= 0 || world.shotHit(this.x, this.y, nx, ny) >= 0) return this.burst(world);
      this.x = nx;
      this.y = ny;
    }
    burst(world) {
      this.dead = true;
      world.add(new DM.Special.TachyonCloud(this.x, this.y));
      DM.Audio.play('zap');
    }
    render(ctx) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.spin);
      ctx.fillStyle = '#d4ad3a';
      Gfx.ellipse(ctx, 0, 0, 8, 4);
      ctx.fill();
      ctx.restore();
      Gfx.glow(ctx, this.x, this.y, 16, '#c06bff', 0.7);
    }
  }

  DM.Proj = { Bullet, Bolt, Shell, Missile, TachyonDisc };
})();
</script>
<script>/* src/game/entities/enemies.js */
/*
 * Enemies. All share the Enemy base: targeting, stun/held handling, and the
 * lethal/non-lethal split (humans knocked out by throws, blasts or bolts are
 * "spared"; only disintegrated ones are not — the game tracks both).
 *
 * To add an enemy: extend Enemy, implement think(dt, world) and render(ctx, world).
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Audio = DM.Audio;
  const Events = DM.Events;
  const { Bullet, Shell, Missile, TachyonDisc } = DM.Proj;

  class Enemy extends DM.Entity {
    constructor(o = {}) {
      super(Object.assign({ team: 'enemy', grabbable: true, r: 12, mass: 1.2, friction: 7, hp: 40 }, o));
      this.human = o.human !== false;
      this.facing = o.facing || 0;
      this.walk = 0;
      this.sight = o.sight || 620;
      this.target = null;
      this.retarget = 0;
      this.alerted = !!o.alerted;
      this.fireCd = U.rand(0.8, 1.8);
      this.aim = 0;
      this.ko = false;
      this.strafeDir = U.chance(0.5) ? 1 : -1;
      this.strafeT = U.rand(1, 3);
      this.needLos = o.needLos !== false;
    }
    get active() {
      return !this.dead && !this.ko;
    }
    acquire(world) {
      let best = null, bd = this.sight;
      for (const e of world.entities) {
        if (e.dead || e.team !== 'player' || !e.targetable || e.hidden || e.down) continue;
        const d = U.dist(this.x, this.y, e.x, e.y);
        if (d >= bd) continue;
        if (this.needLos && !world.los(this.x, this.y, e.x, e.y)) continue;
        best = e;
        bd = d;
      }
      return best;
    }
    update(dt, world) {
      if (this.ko) return;
      if (this.heldBy) {
        this.stun = Math.max(this.stun, 0.5);
        this.aim = 0;
        if (this.onHeld) this.onHeld(dt, world);
        return;
      }
      if (this.stun > 0) {
        this.stun -= dt;
        this.aim = 0;
        return;
      }
      if (world.ceasefire) {
        this.aim = 0;
        this.burst = 0;
        this.vx = U.damp(this.vx, 0, 6, dt);
        this.vy = U.damp(this.vy, 0, 6, dt);
        return;
      }
      this.retarget -= dt;
      if (this.retarget <= 0) {
        this.retarget = 0.25;
        const t = this.acquire(world);
        if (t && !this.alerted && this.onAlert) this.onAlert(world);
        if (t) this.alerted = true;
        this.target = t;
      }
      this.think(dt, world);
    }
    think() {}
    steer(tx, ty, speed, dt, k = 6) {
      const n = U.norm(tx - this.x, ty - this.y);
      this.vx = U.damp(this.vx, n.x * speed, k, dt);
      this.vy = U.damp(this.vy, n.y * speed, k, dt);
    }
    // A knocked-out body takes no further damage: explosions and later wall
    // bounces still push it around, but it can never go down a second time.
    damage(amount, source, kind) {
      if (this.ko) return false;
      return super.damage(amount, source, kind);
    }
    // The ledger: exactly one 'enemy:down' per enemy. A human goes down
    // lethally only when disintegrated; anything else (throws, blasts, bolts)
    // knocks him out.
    die(kind, source) {
      if (this.ko || this.dead) return;
      const w = this.world;
      if (this.human && kind !== 'disintegrate') {
        this.ko = true;
        this.body = false;
        this.layer = 0;
        this.grabbable = false;
        this.disintegratable = false;
        this.hp = 0;
        this.aim = 0;
        this.burst = 0;
        this.thrown = 0;
        this.stun = 0;
        this.vx *= 0.5;
        this.vy *= 0.5;
        Events.emit('enemy:down', { enemy: this, lethal: false, kind, human: true });
        if (w && w.hitstop) w.hitstop(0.06);
        if (this.onKO && w) this.onKO(w, kind, source);
        return;
      }
      super.die(kind, source);
      Events.emit('enemy:down', { enemy: this, lethal: true, kind, human: this.human });
      if (this.human && w && w.hitstop) w.hitstop(0.09);
    }
    get neutralized() {
      return this.dead || this.ko;
    }
  }

  // ---- 1960s mob ------------------------------------------------------------
  const ALERT_BARKS = ["It's the blue guy!", 'Holy— it\'s him!', 'Shoot him! Shoot!', 'Nobody said nothin\' about HIM!', 'Light him up!'];
  const HELD_BARKS = ['Put me down!', 'Whoa— WHOA!', 'Mama!', 'This ain\'t natural!'];

  // A knocked-out man is drawn washed out, so he never reads as a live threat.
  const greyLooks = new WeakMap();
  function greyed(look) {
    let g = greyLooks.get(look);
    if (g) return g;
    g = Object.assign({}, look);
    for (const k of ['skin', 'hair', 'hat', 'hatBrim', 'body', 'sleeve', 'legs']) if (typeof g[k] === 'string' && g[k][0] === '#') g[k] = U.mix(g[k], '#8a8a8e', 0.5);
    greyLooks.set(look, g);
    return g;
  }

  class Gangster extends Enemy {
    constructor(o = {}) {
      super(Object.assign({ hp: 40, colors: ['#2e2a28', '#d9b08c', '#8a2d2a', '#4b4038'] }, o));
      this.look = o.look || DM.LOOKS.randomGangster();
      this.gun = o.gun || 'pistol';
      this.range = this.gun === 'tommy' ? [150, 280] : [180, 340];
      this.speedBase = this.gun === 'tommy' ? 90 : 105;
      this.aimTime = this.gun === 'tommy' ? 0.7 : 0.45;
      this.burst = 0;
      this.burstT = 0;
      this.heldBarked = false;
      this.kick = 0; // recoil 0..1, decays 10/s
      this.flinch = 0;
      this.muzzleT = 0;
      if (this.gun === 'tommy') {
        this.hp = this.maxHp = 60;
        this.mass = 1.5;
      }
    }
    update(dt, world) {
      if (this.kick > 0) this.kick = Math.max(0, this.kick - dt * 10);
      if (this.muzzleT > 0) this.muzzleT -= dt;
      // A solid hit makes him flinch: he stops, and his aim is set back.
      if (this.flinch > 0 && !this.ko && !this.heldBy) {
        this.flinch -= dt;
        this.vx = U.damp(this.vx, 0, 10, dt);
        this.vy = U.damp(this.vy, 0, 10, dt);
        return;
      }
      super.update(dt, world);
    }
    damage(amount, source, kind) {
      const hit = super.damage(amount, source, kind);
      if (hit && amount >= 10 && !this.ko && !this.dead && !this.heldBy) {
        this.flinch = Math.max(this.flinch, 0.12);
        this.kick = 1;
        if (this.aim > 0) this.aim = Math.max(this.aim, this.aimTime * 0.6);
      }
      return hit;
    }
    // Spared: he lies where he fell, gun skidding away.
    onKO(world, kind) {
      const sp = Math.hypot(this.vx, this.vy);
      this.koAngle = sp > 30 ? Math.atan2(-this.vy, -this.vx) : this.facing + Math.PI;
      this.flinch = 0;
      this.kick = 0;
      if (DM.FX) DM.FX.knockout(world, this, { gun: this.gun });
    }
    // Gone: he comes apart from the side facing Jon.
    disintegrate(world, source) {
      if (this.dead || this.ko) return;
      const L = this.look;
      const aim = !!this.target || this.aim > 0;
      const key = ['gangster', L.skin, L.hat, L.hatBrim, L.body, L.legs, this.gun, aim].join('|');
      const draw = (g) => Gfx.figure(g, Object.assign({}, L, { x: 0, y: 0, angle: 0, aim, gun: this.gun }));
      if (!DM.FX || !DM.FX.unbind(world, this, { source, key, draw, angle: this.facing, step: 2, max: 600 })) return super.disintegrate(world, source);
      world.particles.burst(this.x, this.y, 12, { color: ['#bff1ff', '#5fd4ff'], speed: [60, 300], life: [0.2, 0.6], size: [1.5, 3], drag: 3 });
      this.wasDisintegrated = true;
      this.die('disintegrate', source);
    }
    onAlert(world) {
      if (Math.random() < 0.6) world.bark(this, U.pick(ALERT_BARKS));
    }
    onHeld(dt, world) {
      this.facing += dt * 9;
      if (!this.heldBarked) {
        this.heldBarked = true;
        world.bark(this, U.pick(HELD_BARKS), 1.4);
      }
    }
    think(dt, world) {
      this.heldBarked = false;
      const t = this.target;
      this.walk += dt * this.speed * 0.09;
      if (!t) {
        if (this.alerted && this.lastSeen && U.dist(this.x, this.y, this.lastSeen.x, this.lastSeen.y) > 30) this.steer(this.lastSeen.x, this.lastSeen.y, this.speedBase * 0.8, dt);
        else {
          this.vx = U.damp(this.vx, 0, 5, dt);
          this.vy = U.damp(this.vy, 0, 5, dt);
        }
        return;
      }
      this.lastSeen = { x: t.x, y: t.y };
      const d = U.dist(this.x, this.y, t.x, t.y);
      const ang = U.angleTo(this.x, this.y, t.x, t.y);
      this.facing = U.dampAngle(this.facing, ang, 10, dt);
      this.strafeT -= dt;
      if (this.strafeT <= 0) {
        this.strafeDir *= -1;
        this.strafeT = U.rand(1.2, 2.8);
      }
      const nx = Math.cos(ang), ny = Math.sin(ang);
      let mx = -ny * this.strafeDir * 0.7, my = nx * this.strafeDir * 0.7;
      if (d > this.range[1]) {
        mx += nx;
        my += ny;
      } else if (d < this.range[0]) {
        mx -= nx;
        my -= ny;
      }
      const n = U.norm(mx, my);
      const sp = this.aim > 0 || this.burst > 0 ? this.speedBase * 0.25 : this.speedBase;
      this.vx = U.damp(this.vx, n.x * sp, 6, dt);
      this.vy = U.damp(this.vy, n.y * sp, 6, dt);

      if (this.burst > 0) {
        this.burstT -= dt;
        if (this.burstT <= 0) {
          this.fireOne(world, t, 0.13);
          this.burst--;
          this.burstT = 0.09;
        }
        return;
      }
      if (this.aim > 0) {
        this.aim -= dt;
        if (this.aim <= 0) this.fire(world, t);
        return;
      }
      this.fireCd -= dt;
      if (this.fireCd <= 0) this.aim = this.aimTime;
    }
    fire(world, t) {
      if (this.gun === 'tommy') {
        this.burst = 6;
        this.burstT = 0;
        this.fireCd = U.rand(2.4, 3.2);
      } else {
        this.fireOne(world, t, 0.05);
        this.fireCd = U.rand(1.3, 2.1);
      }
    }
    fireOne(world, t, spread) {
      const a = U.angleTo(this.x, this.y, t.x + t.vx * 0.12, t.y + t.vy * 0.12) + U.rand(-spread, spread);
      const mx = this.x + Math.cos(a) * 20, my = this.y + Math.sin(a) * 20;
      world.add(new Bullet({ x: mx, y: my, vx: Math.cos(a) * 560, vy: Math.sin(a) * 560, team: 'enemy', dmg: this.gun === 'tommy' ? 4 : 6 }));
      world.particles.burst(mx, my, 4, { color: ['#fff2c4', '#ffd27a'], speed: [60, 160], life: [0.05, 0.12], size: [2, 4], angle: a, spread: 0.6 });
      this.kick = 1;
      this.muzzleT = 0.035;
      Audio.play('shot');
    }
    render(ctx, world) {
      if (this.ko) {
        const a = this.koAngle == null ? this.facing + Math.PI : this.koAngle;
        Gfx.figure(ctx, Object.assign({}, greyed(this.look), { x: this.x, y: this.y, angle: a, pose: 'down', alpha: 0.8, ink: 'rgba(48,48,54,0.55)' }));
        const t = world.realTime || 0;
        const hx = this.x + Math.cos(a) * 18.5, hy = this.y + Math.sin(a) * 18.5 - 3;
        ctx.fillStyle = '#f2c418';
        for (let i = 0; i < 3; i++) {
          const b = t * 3 + (i * Math.PI * 2) / 3;
          Gfx.circle(ctx, hx + Math.cos(b) * 9, hy + Math.sin(b) * 3.5, 1.8);
          ctx.fill();
        }
        return;
      }
      Gfx.figure(ctx, Object.assign({}, this.look, {
        x: this.x, y: this.y, angle: this.facing, walk: this.walk, moving: this.speed > 20,
        aim: !!this.target || this.aim > 0, gun: this.gun, flash: this.hitFlash > 0 ? 0.7 : 0, kick: this.kick,
      }));
      if (!world.lit) this.renderEmissive(ctx, world);
    }
    // Light that the night must not swallow: the aim telegraph and muzzle flash.
    // (Drawn after the light layer when world.lit is set; see World.render.)
    renderEmissive(ctx, world) {
      if (this.ko || this.dead) return;
      const f = this.facing, c = Math.cos(f), s = Math.sin(f);
      const tip = (this.gun === 'tommy' ? 29 : 22) - this.kick * 4.2;
      const mx = this.x + c * tip, my = this.y + s * tip;
      const t = this.target;
      const tommy = this.gun === 'tommy';
      if (t && !t.dead && (this.aim > 0 || (tommy && this.burst > 0))) {
        const len = Math.max(20, Math.min(U.dist(mx, my, t.x, t.y) + 20, 420));
        const k = this.aim > 0 ? U.clamp(1 - this.aim / this.aimTime, 0, 1) : 1;
        ctx.save();
        if (tommy) {
          // The spray: a translucent cone the burst will fill.
          const sp = 0.13;
          ctx.fillStyle = `rgba(255,70,50,${0.04 + k * 0.1})`;
          ctx.strokeStyle = `rgba(255,90,70,${0.2 + k * 0.45})`;
          ctx.lineWidth = this.aim > 0 && this.aim < 0.15 ? 2 : 1;
          ctx.beginPath();
          ctx.moveTo(mx, my);
          ctx.lineTo(mx + Math.cos(f - sp) * len, my + Math.sin(f - sp) * len);
          ctx.lineTo(mx + Math.cos(f + sp) * len, my + Math.sin(f + sp) * len);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        } else {
          // Two sight lines closing in on the target as the aim settles.
          const sp = 0.25 * (1 - k) * (1 - k);
          const late = this.aim < 0.15;
          ctx.strokeStyle = `rgba(255,70,50,${0.25 + k * 0.6})`;
          ctx.lineWidth = late ? 2.4 : 1.2;
          if (!late) ctx.setLineDash([6, 5]);
          for (const side of sp > 0.01 ? [-1, 1] : [0]) {
            const a = f + side * sp;
            Gfx.line(ctx, mx, my, mx + Math.cos(a) * len, my + Math.sin(a) * len);
          }
        }
        ctx.restore();
      }
      if (this.muzzleT > 0) {
        // A one- or two-frame star at the barrel.
        Gfx.glow(ctx, mx, my, 16, '#ffd27a', 0.9);
        ctx.save();
        ctx.strokeStyle = '#fff6d8';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        for (let i = 0; i < 4; i++) {
          const a = f + (i * Math.PI) / 2 + Math.PI / 4;
          const r = i % 2 ? 5 : 8;
          Gfx.line(ctx, mx, my, mx + Math.cos(a) * r, my + Math.sin(a) * r);
        }
        Gfx.line(ctx, mx, my, mx + c * 12, my + s * 12);
        ctx.restore();
      }
    }
  }

  // ---- machines (Chapter III / V) ---------------------------------------------
  // Every attack is announced before it lands. Telegraphs (aim lines, pod lights,
  // muzzle glows) are drawn in renderEmissive(ctx, world): World.render calls it
  // after the light layer while world.lit is set, and render() calls it directly
  // on unlit maps.
  const POWER_DOWN_T = 0.55; // seconds of sparks and flicker before a machine goes dark

  function onScreen(world, x, y, m = 0) {
    const v = world.camera.view();
    return x > v.x0 - m && x < v.x1 + m && y > v.y0 - m && y < v.y1 + m;
  }
  // A shake, plus a directional camera nudge where the camera supports it.
  function kick(world, nx, ny, px, shake) {
    const cam = world.camera;
    cam.shake(shake);
    if (cam.kick) cam.kick(nx, ny, px);
  }
  // Four-point muzzle star (drawn additively).
  function star(ctx, x, y, a, len, color, alpha) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = color;
    ctx.translate(x, y);
    ctx.rotate(a);
    ctx.beginPath();
    ctx.moveTo(len, 0);
    ctx.lineTo(len * 0.18, len * 0.16);
    ctx.lineTo(0, len * 0.45);
    ctx.lineTo(-len * 0.18, len * 0.16);
    ctx.lineTo(-len * 0.35, 0);
    ctx.lineTo(-len * 0.18, -len * 0.16);
    ctx.lineTo(0, -len * 0.45);
    ctx.lineTo(len * 0.18, -len * 0.16);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  class Machine extends Enemy {
    constructor(o) {
      super(Object.assign({ human: false }, o));
      this.boomR = o.boomR || 50;
      this.boomDmg = o.boomDmg || 8;
      this.downT = 0;
    }
    get active() {
      return !this.dead && !this.ko && !(this.downT > 0);
    }
    update(dt, world) {
      if (this.downT > 0) {
        this.downT -= dt;
        this.aim = 0;
        this.burst = 0;
        this.vx = U.damp(this.vx, 0, 5, dt);
        this.vy = U.damp(this.vy, 0, 5, dt);
        if (Math.random() < dt * 26) world.particles.burst(this.x + U.rand(-this.r, this.r), this.y + U.rand(-this.r, this.r), 3, { color: ['#fff2c4', '#bff1ff', '#ffd27a'], speed: [40, 160], life: [0.1, 0.3], size: [1, 2.5], shape: 'spark' });
        if (this.downT <= 0) {
          this.dead = true;
          world.particles.burst(this.x, this.y, 10, { color: ['#3a3a30', '#2a2522'], speed: [10, 60], life: [0.6, 1.2], size: [6, 12], size1: 18, shape: 'smoke', add: false, alpha: 0.6 });
        }
        return;
      }
      super.update(dt, world);
    }
    // Its power source is gone: it sparks, flickers and goes dark. Not a kill
    // (no 'enemy:down'), and no explosion.
    powerDown(world) {
      if (this.dead || this.downT > 0) return;
      this.downT = POWER_DOWN_T;
      this.aim = 0;
      this.burst = 0;
      this.target = null;
      this.grabbable = false;
      this.disintegratable = false;
      world.particles.burst(this.x, this.y, 14, { color: ['#ffffff', '#bff1ff', '#ffd27a'], speed: [60, 220], life: [0.15, 0.4], size: [1, 2.5], shape: 'spark' });
      Audio.play('fizzle');
    }
    onDeath(kind) {
      if (!this.world) return;
      const w = this.world;
      if (kind === 'disintegrate') return;
      w.defer(() => w.explode(this.x, this.y, this.boomR, this.boomDmg, { team: 'enemy' }));
    }
    render(ctx, world) {
      if (this.downT > 0) {
        // Flicker out: no telegraphs while powering down.
        ctx.save();
        ctx.globalAlpha *= Math.sin((world.realTime || 0) * 70) > 0 ? 0.9 : 0.35;
        this.draw(ctx, world);
        ctx.restore();
        return;
      }
      this.draw(ctx, world);
      if (!world.lit) this.renderEmissive(ctx, world);
    }
    draw() {}
    renderEmissive(ctx, world) {
      if (this.dead || this.downT > 0 || !this.emissive) return;
      this.emissive(ctx, world);
    }
  }

  // Thin red line from a machine to what it is about to shoot. k: 0..1 wind-up.
  function aimLine(ctx, x, y, tx, ty, k, color = '255,70,50') {
    ctx.save();
    ctx.strokeStyle = `rgba(${color},${0.18 + k * 0.55})`;
    ctx.lineWidth = 1 + k;
    ctx.setLineDash([5, 5]);
    ctx.lineDashOffset = -k * 20;
    Gfx.line(ctx, x, y, tx, ty);
    ctx.restore();
  }

  const DRONE = { aimTime: 0.5, cooldown: [1.4, 2.1], speed: 430, dmg: 5 };

  class Drone extends Machine {
    constructor(o = {}) {
      super(Object.assign({ hp: 30, r: 13, mass: 0.8, friction: 3, flying: true, needLos: false, colors: ['#6b7a4a', '#2b2f24', '#ffcc66'] }, o));
      this.style = o.style || 'army';
      if (this.style === 'karnak') this.colors = ['#d4ad3a', '#6f4aa6', '#c06bff'];
      this.orbit = U.rand(150, 230);
      this.orbitDir = U.chance(0.5) ? 1 : -1;
      this.speedBase = o.speed || 190;
      this.spin = U.rand(0, 6);
      this.phi = null;
      this.aimTime = DRONE.aimTime;
    }
    think(dt, world) {
      this.spin += dt * 30;
      const t = this.target;
      if (!t) {
        this.vx = U.damp(this.vx, 0, 2, dt);
        this.vy = U.damp(this.vy, 0, 2, dt);
        return;
      }
      if (this.phi == null) this.phi = U.angleTo(t.x, t.y, this.x, this.y);
      this.phi += this.orbitDir * dt * 0.9;
      this.steer(t.x + Math.cos(this.phi) * this.orbit, t.y + Math.sin(this.phi) * this.orbit, this.speedBase, dt, 3);
      this.facing = U.dampAngle(this.facing, U.angleTo(this.x, this.y, t.x, t.y), 8, dt);
      if (this.aim > 0) {
        this.aim -= dt;
        if (this.aim <= 0) {
          const a = this.facing;
          const col = this.style === 'karnak' ? '#c06bff' : '#ffcf5a';
          world.add(new Bullet({ x: this.x + Math.cos(a) * 14, y: this.y + Math.sin(a) * 14, vx: Math.cos(a) * DRONE.speed, vy: Math.sin(a) * DRONE.speed, team: 'enemy', dmg: DRONE.dmg, color: col, kind: 'pulse', width: 3, r: 4 }));
          Audio.play('pulse');
          this.fireCd = U.rand(DRONE.cooldown[0], DRONE.cooldown[1]);
        }
        return;
      }
      this.fireCd -= dt;
      if (this.fireCd <= 0 && world.los(this.x, this.y, t.x, t.y)) {
        this.aim = this.aimTime;
        Audio.play('charge');
      }
    }
    draw(ctx) {
      const k = this.style === 'karnak';
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      Gfx.ellipse(ctx, this.x + 10, this.y + 18, 13, 8);
      ctx.fill();
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.facing);
      ctx.strokeStyle = k ? '#8a6a1a' : '#2b2f24';
      ctx.lineWidth = 3;
      Gfx.line(ctx, -11, -11, 11, 11);
      Gfx.line(ctx, -11, 11, 11, -11);
      for (const [sx, sy] of [[-11, -11], [11, 11], [-11, 11], [11, -11]]) {
        ctx.fillStyle = 'rgba(200,200,200,0.18)';
        Gfx.circle(ctx, sx, sy, 7);
        ctx.fill();
        ctx.strokeStyle = 'rgba(230,230,230,0.5)';
        ctx.lineWidth = 1.2;
        Gfx.line(ctx, sx + Math.cos(this.spin) * 6, sy + Math.sin(this.spin) * 6, sx - Math.cos(this.spin) * 6, sy - Math.sin(this.spin) * 6);
      }
      ctx.fillStyle = this.hitFlash > 0 ? '#ffffff' : k ? '#d4ad3a' : '#5d6b4a';
      Gfx.circle(ctx, 0, 0, 9);
      ctx.fill();
      ctx.fillStyle = k ? '#6f4aa6' : '#3a4430';
      Gfx.circle(ctx, 0, 0, 5);
      ctx.fill();
      ctx.restore();
    }
    emissive(ctx) {
      const eye = this.style === 'karnak' ? '#c06bff' : '#ff5a4a';
      const ex = this.x + Math.cos(this.facing) * 7, ey = this.y + Math.sin(this.facing) * 7;
      if (this.aim > 0 && this.target) {
        const k = 1 - this.aim / this.aimTime;
        aimLine(ctx, ex, ey, this.target.x, this.target.y, k, this.style === 'karnak' ? '200,110,255' : '255,70,50');
        Gfx.glow(ctx, ex, ey, 10 + k * 12, eye, 0.95);
      } else Gfx.glow(ctx, ex, ey, 9, eye, 0.9);
    }
  }

  const TANK = { aimTime: 0.9, cooldown: [3, 4], recoilDecay: 10, flashT: 0.09, shake: 0.15 };

  class Tank extends Machine {
    constructor(o = {}) {
      super(Object.assign({ hp: 240, r: 28, mass: 8, friction: 4, boomR: 95, boomDmg: 25, colors: ['#5d6b4a', '#3a4430', '#2b2b2b'] }, o));
      this.turret = this.facing;
      this.hullA = this.facing;
      this.speedBase = 55;
      this.range = [240, 430];
      this.fireCd = U.rand(1.8, 3.2);
      this.aimTime = TANK.aimTime;
      this.tread = 0;
      this.recoil = 0;
      this.flashT = 0;
    }
    update(dt, world) {
      this.recoil = Math.max(0, this.recoil - dt * TANK.recoilDecay);
      this.flashT = Math.max(0, this.flashT - dt);
      super.update(dt, world);
    }
    think(dt, world) {
      const t = this.target;
      if (!t) return;
      const d = U.dist(this.x, this.y, t.x, t.y);
      const ang = U.angleTo(this.x, this.y, t.x, t.y);
      let dir = 0;
      if (d > this.range[1]) dir = 1;
      else if (d < this.range[0]) dir = -1;
      if (dir) {
        const a = dir > 0 ? ang : ang + Math.PI;
        this.hullA = U.dampAngle(this.hullA, a, 1.5, dt);
        this.vx = U.damp(this.vx, Math.cos(this.hullA) * this.speedBase, 3, dt);
        this.vy = U.damp(this.vy, Math.sin(this.hullA) * this.speedBase, 3, dt);
        this.tread += dt * 30;
      }
      const diff = U.wrapAngle(ang - this.turret);
      this.turret += U.clamp(diff, -1.6 * dt, 1.6 * dt);
      if (this.aim > 0) {
        this.aim -= dt;
        if (this.aim <= 0) this.fire(world, t);
        return;
      }
      this.fireCd -= dt;
      if (this.fireCd <= 0 && Math.abs(diff) < 0.3) this.aim = this.aimTime;
    }
    fire(world, t) {
      const mx = this.x + Math.cos(this.turret) * 40, my = this.y + Math.sin(this.turret) * 40;
      const lead = 0.9;
      world.add(new Shell({ x: mx, y: my, tx: t.x + t.vx * lead, ty: t.y + t.vy * lead, T: 1.15, dmg: 18, radius: 70, team: 'enemy' }));
      world.particles.burst(mx, my, 10, { color: ['#fff2c4', '#ffd27a', '#9a948a'], speed: [60, 200], life: [0.1, 0.35], size: [3, 6], angle: this.turret, spread: 0.7 });
      world.particles.burst(mx, my, 6, { color: ['#4a4640', '#6a645a'], speed: [20, 80], life: [0.5, 1], size: [6, 10], size1: 16, shape: 'smoke', add: false, alpha: 0.5, angle: this.turret, spread: 0.5 });
      Audio.play('cannon');
      if (onScreen(world, this.x, this.y)) world.camera.shake(TANK.shake);
      this.recoil = 1;
      this.flashT = TANK.flashT;
      this.fireCd = U.rand(TANK.cooldown[0], TANK.cooldown[1]);
    }
    draw(ctx) {
      const L = this.r * 2.3, W = this.r * 1.7;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(-L / 2 + 5, -W / 2 + 6, L, W);
      ctx.rotate(this.hullA);
      ctx.fillStyle = '#222';
      ctx.fillRect(-L / 2, -W / 2, L, 9);
      ctx.fillRect(-L / 2, W / 2 - 9, L, 9);
      ctx.strokeStyle = '#444';
      ctx.lineWidth = 1;
      for (let i = 0; i < 9; i++) {
        const x = -L / 2 + ((i * 8 + this.tread) % L);
        Gfx.line(ctx, x, -W / 2, x, -W / 2 + 9);
        Gfx.line(ctx, x, W / 2 - 9, x, W / 2);
      }
      ctx.fillStyle = this.hitFlash > 0 ? '#c8d0b8' : '#5d6b4a';
      ctx.fillRect(-L / 2 + 4, -W / 2 + 7, L - 8, W - 14);
      ctx.restore();
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.turret);
      // The barrel slides back into the turret when it fires.
      ctx.fillStyle = '#3a4430';
      ctx.fillRect(4 - this.recoil * 9, -3.5, 36, 7);
      ctx.fillStyle = this.hitFlash > 0 ? '#d8e0c8' : '#6d7b56';
      Gfx.circle(ctx, 0, 0, 14);
      ctx.fill();
      ctx.fillStyle = '#e8d27a';
      ctx.fillRect(-4, -2, 8, 4);
      ctx.restore();
    }
    emissive(ctx) {
      const mx = this.x + Math.cos(this.turret) * 40, my = this.y + Math.sin(this.turret) * 40;
      if (this.aim > 0) Gfx.glow(ctx, mx, my, 18 + (1 - this.aim / this.aimTime) * 14, '#ff9a3c', 0.9);
      if (this.flashT > 0) {
        const k = this.flashT / TANK.flashT;
        star(ctx, mx + Math.cos(this.turret) * 6, my + Math.sin(this.turret) * 6, this.turret, 34, '#fff2c4', k);
        Gfx.glow(ctx, mx, my, 40 * k + 10, '#ffd27a', k);
      }
    }
  }

  // Missile battery: blinks its pod lights for 0.8 s before every launch.
  const BATTERY = { aimTime: 0.8, aimRange: 760, cooldown: [4, 5.5], speed: 240 };

  class Battery extends Machine {
    constructor(o = {}) {
      super(Object.assign({ hp: 150, r: 26, mass: 30, static: true, boomR: 90, boomDmg: 20, colors: ['#5d6b4a', '#3a4430', '#c4302b'] }, o));
      this.fireCd = U.rand(2, 4);
      this.aimTime = BATTERY.aimTime;
      this.pod = 0;
      this.aimA = 0;
      this.sight = 900;
      this.needLos = false;
    }
    podPos(i) {
      const off = (i % 2 ? 1 : -1) * 10;
      return { x: this.x + Math.cos(this.aimA) * 24 - Math.sin(this.aimA) * off, y: this.y + Math.sin(this.aimA) * 24 + Math.cos(this.aimA) * off };
    }
    think(dt, world) {
      const t = this.target;
      if (!t) return;
      this.aimA = U.dampAngle(this.aimA, U.angleTo(this.x, this.y, t.x, t.y), 2, dt);
      if (this.aim > 0) {
        this.aim -= dt;
        if (this.aim <= 0) this.launch(world);
        return;
      }
      this.fireCd -= dt;
      if (this.fireCd > 0) return;
      // Only lines up a launch on something it can see, or something close.
      if (U.dist(this.x, this.y, t.x, t.y) < BATTERY.aimRange || world.los(this.x, this.y, t.x, t.y)) {
        this.aim = this.aimTime;
        Audio.play('pod_alarm');
      }
    }
    launch(world) {
      this.fireCd = U.rand(BATTERY.cooldown[0], BATTERY.cooldown[1]);
      const p = this.podPos(this.pod++);
      world.add(new Missile({ x: p.x, y: p.y, angle: this.aimA, speed: BATTERY.speed }));
      world.particles.burst(p.x, p.y, 8, { color: ['#fff2c4', '#ffd27a', '#9a948a'], speed: [40, 140], life: [0.1, 0.3], size: [2, 4], angle: this.aimA + Math.PI, spread: 0.8 });
      Audio.play('whoosh');
    }
    draw(ctx) {
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(this.x - 24 + 5, this.y - 24 + 6, 48, 48);
      ctx.fillStyle = this.hitFlash > 0 ? '#c8d0b8' : '#4d5a3a';
      ctx.fillRect(this.x - 24, this.y - 24, 48, 48);
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.aimA);
      ctx.fillStyle = '#6d7b56';
      ctx.fillRect(-14, -16, 36, 32);
      ctx.fillStyle = '#222';
      for (const oy of [-9, 9]) {
        Gfx.circle(ctx, 20, oy, 5);
        ctx.fill();
      }
      ctx.restore();
    }
    emissive(ctx, world) {
      const t = world.realTime || 0;
      for (let i = 0; i < 2; i++) {
        const p = this.podPos(i);
        const next = this.pod % 2 === i;
        if (this.aim > 0) {
          // Blinks faster as the launch nears; the pod that will fire burns brighter.
          // Solid colour with a dark rim, so it reads on bright sand as well as at night.
          const k = 1 - this.aim / this.aimTime;
          const on = Math.sin(t * (14 + k * 26)) > -0.2;
          if (on) Gfx.glow(ctx, p.x, p.y, (next ? 22 : 12) + k * 10, '#ff3a2a', next ? 1 : 0.6);
          if (next) {
            ctx.strokeStyle = `rgba(255,40,20,${on ? 0.85 : 0.35})`;
            ctx.lineWidth = 2;
            Gfx.circle(ctx, p.x, p.y, 9 + k * 8);
            ctx.stroke();
          }
          ctx.fillStyle = on ? '#ff2a1a' : '#6a1610';
          ctx.strokeStyle = '#1a0806';
          ctx.lineWidth = 1.5;
          Gfx.circle(ctx, p.x, p.y, next ? 5.5 : 4);
          ctx.fill();
          ctx.stroke();
        } else {
          ctx.fillStyle = '#7a2a1e';
          Gfx.circle(ctx, p.x, p.y, 2.5);
          ctx.fill();
        }
      }
    }
  }

  // Chapter III boss: an experimental super-heavy tank. Armoured everywhere but
  // the engine at its rear; its own missiles, thrown back, hurt it badly.
  const BEHEMOTH = {
    hp: 1500,
    hullMul: 0.4, // disintegrate on the armour
    rearMul: 1.5, // disintegrate with Jon behind it
    ventMul: 2, // ...once the rear vent is exposed (phase 3)
    rearArc: Math.PI / 3, // "behind" = within 60 degrees of straight back
    missileMul: 2.7, // blasts from its own missiles, thrown back (about 150-170)
    phases: [0.66, 0.33],
    turn: 0.5, // rad/s: it is slow to turn round
    mgSpin: 0.6,
    hatchT: 0.5,
    mines: 4,
    escorts: 2,
  };
  const BEHEMOTH_BARKS = { 2: 'Hull breach! Mines out, call the escort!', 3: 'Coolant failure! The vent is open!' };

  class Behemoth extends Machine {
    constructor(o = {}) {
      super(Object.assign({ hp: BEHEMOTH.hp, r: 60, mass: 80, friction: 5, boomR: 160, boomDmg: 30, sight: 1400, needLos: false, grabbable: false, colors: ['#4d5a3a', '#2b2b2b', '#c4302b', '#e8d27a'] }, o));
      this.name = 'M-1 "BEHEMOTH"';
      this.turret = this.facing;
      this.hullA = this.facing;
      this.speedBase = 34;
      this.cycle = 0;
      this.actT = 2.5;
      this.mgT = 0;
      this.mgShots = 0;
      this.tread = 0;
      this.phase = 1;
      this.phaseMarks = BEHEMOTH.phases;
      this.windup = null; // 'mg' | 'missiles' while aim > 0
      this.aimTime = 1;
      this.spawned = []; // its mines and escorts, stood down when it dies
      this.ventT = 0;
    }
    // Is Jon within the rear arc?
    rearExposed() {
      const p = this.world && this.world.player;
      if (!p) return false;
      const a = U.angleTo(this.x, this.y, p.x, p.y);
      return Math.abs(U.wrapAngle(a - (this.hullA + Math.PI))) <= BEHEMOTH.rearArc;
    }
    armourMul(source, kind) {
      if (kind === 'disintegrate') return this.rearExposed() ? (this.phase >= 3 ? BEHEMOTH.ventMul : BEHEMOTH.rearMul) : BEHEMOTH.hullMul;
      if (source instanceof Missile) {
        if (kind === 'explosion' && source.team === 'player') return BEHEMOTH.missileMul;
        if (kind === 'impact') return 0; // a thrown missile counts once, by its blast
      }
      return 1;
    }
    damage(amount, source, kind) {
      if (this.dead) return false;
      const hit = super.damage(amount * this.armourMul(source, kind), source, kind);
      if (hit && !this.dead) this.checkPhase();
      return hit;
    }
    checkPhase() {
      const f = this.hp / this.maxHp;
      while (this.phase <= BEHEMOTH.phases.length && f < BEHEMOTH.phases[this.phase - 1]) {
        this.phase++;
        this.onPhase(this.phase, this.world);
      }
    }
    onPhase(n, world) {
      if (!world) return;
      if (world.hitstop) world.hitstop(0.25);
      const p = world.player;
      const n2 = p ? U.norm(p.x - this.x, p.y - this.y) : { x: 1, y: 0 };
      kick(world, n2.x, n2.y, 10, 0.35);
      world.particles.burst(this.x, this.y, 36, { color: ['#4d5a3a', '#6d7b56', '#2b3322', '#c8d0b8'], speed: [120, 420], life: [0.5, 1.2], size: [3, 7], shape: 'shard', add: false, drag: 2.5, radius: 30 });
      world.particles.burst(this.x, this.y, 18, { color: ['#fff2c4', '#ffd27a'], speed: [80, 300], life: [0.15, 0.4], size: [1.5, 3], shape: 'spark' });
      world.bark(this, BEHEMOTH_BARKS[n] || '', 2.4);
      Audio.play('phase');
      const bx = -Math.cos(this.hullA), by = -Math.sin(this.hullA); // straight back
      if (n === 2) {
        // Sows mines in its wake and calls in an escort. Deferred to the end of
        // the frame: the blast that caused this phase may still be walking the
        // entity list, and must not set off the mines it just sowed.
        const Mine = DM.Special && DM.Special.Mine;
        world.defer(() => {
          if (this.dead) return;
          for (let i = 0; i < BEHEMOTH.mines && Mine; i++) {
            const s = (i - (BEHEMOTH.mines - 1) / 2) * 55;
            const x = U.clamp(this.x + bx * 110 - by * s, 40, world.w - 40), y = U.clamp(this.y + by * 110 + bx * s, 40, world.h - 40);
            const m = world.add(new Mine(x, y));
            this.spawned.push(m);
            world.particles.burst(x, y, 6, { color: ['#9a948a', '#6a645a'], speed: [20, 80], life: [0.3, 0.7], size: [4, 8], shape: 'smoke', add: false, alpha: 0.5 });
          }
          for (let i = 0; i < BEHEMOTH.escorts; i++) {
            const x = world.w - 120, y = U.clamp(this.y + (i ? 260 : -260), 120, world.h - 120);
            this.spawned.push(world.add(new Drone({ x, y, sight: 2400, alerted: true })));
          }
        });
      } else if (n === 3) this.ventT = 0.01;
    }
    // The operation is over: its mines are made safe and its escort powers down.
    standDown(world) {
      for (const e of this.spawned) {
        if (e.dead) continue;
        if (e.powerDown) e.powerDown(world);
        else if (e.defuse) e.defuse(world);
      }
    }
    onDeath(kind, source) {
      super.onDeath(kind, source);
      if (this.world) this.standDown(this.world);
    }
    think(dt, world) {
      const t = this.target;
      if (!t) return;
      const phase = this.phase;
      if (this.ventT > 0) {
        this.ventT += dt;
        if (Math.random() < dt * 14) {
          const vx = this.x - Math.cos(this.hullA) * 70, vy = this.y - Math.sin(this.hullA) * 70;
          world.particles.emit(vx, vy, { vx: -Math.cos(this.hullA) * 40 + U.rand(-15, 15), vy: -Math.sin(this.hullA) * 40 + U.rand(-15, 15), life: 1, size: 8, size1: 20, color: '#3a3530', add: false, shape: 'smoke', alpha: 0.45 });
        }
      }
      const ang = U.angleTo(this.x, this.y, t.x, t.y);
      const d = U.dist(this.x, this.y, t.x, t.y);
      // Heavy: turns at a fixed, slow rate, and only drives once Jon is far.
      if (d > 300 || this.rearExposed()) {
        const diff = U.wrapAngle(ang - this.hullA);
        const step = BEHEMOTH.turn * (1 + phase * 0.15) * dt;
        this.hullA += U.clamp(diff, -step, step);
        this.tread += dt * 12;
      }
      if (d > 300) {
        this.vx = U.damp(this.vx, Math.cos(this.hullA) * this.speedBase * (1 + phase * 0.15), 2, dt);
        this.vy = U.damp(this.vy, Math.sin(this.hullA) * this.speedBase * (1 + phase * 0.15), 2, dt);
        this.tread += dt * 20;
      }
      this.turret = U.dampAngle(this.turret, ang, 1.6, dt);
      if (this.mgShots > 0) {
        this.mgT -= dt;
        if (this.mgT <= 0) {
          this.mgShots--;
          this.mgT = 0.07;
          const a = this.turret + U.rand(-0.15, 0.15);
          const g = this.gunPos();
          world.add(new Bullet({ x: g.x, y: g.y, vx: Math.cos(a) * 600, vy: Math.sin(a) * 600, team: 'enemy', dmg: 4 }));
          Audio.play('shot');
        }
      }
      // Wind-up of the queued attack (cancelled if it is stunned).
      if (this.aim > 0) {
        this.aim -= dt;
        if (this.aim <= 0) this.unleash(world, t, phase);
        return;
      }
      // A missile launch that was interrupted comes straight back, so there is
      // always a missile to catch and throw back.
      if (this.windup === 'missiles') this.cycle--;
      this.windup = null;
      this.actT -= dt;
      if (this.actT > 0) return;
      this.actT = Math.max(1.4, 3.2 - phase * 0.5);
      const act = this.cycle++ % 3;
      if (act === 0) {
        for (let i = -1; i <= 1; i++) {
          const ox = Math.cos(ang + Math.PI / 2) * i * 90, oy = Math.sin(ang + Math.PI / 2) * i * 90;
          world.add(new Shell({ x: this.x + Math.cos(this.turret) * 70, y: this.y + Math.sin(this.turret) * 70, tx: t.x + ox + t.vx * 0.6, ty: t.y + oy + t.vy * 0.6, T: 1.3, dmg: 20, radius: 75 }));
        }
        Audio.play('cannon');
        if (onScreen(world, this.x, this.y, 40)) world.camera.shake(0.2);
      } else if (act === 1) {
        // One hatch (alternating) launches; both do once the vent is open.
        this.windup = 'missiles';
        this.hatches = phase >= 3 ? [-1, 1] : [(this.hatchSide = -(this.hatchSide || 1))];
        this.aim = this.aimTime = BEHEMOTH.hatchT;
        Audio.play('pod_alarm');
      } else {
        this.windup = 'mg';
        this.aim = this.aimTime = BEHEMOTH.mgSpin;
        Audio.play('mg_spin');
      }
    }
    unleash(world, t, phase) {
      if (this.windup === 'missiles') {
        for (const side of this.hatches) this.launchMissile(world, side);
        // Hanging around behind it from phase 2 earns a missile out of the back.
        if (phase >= 2 && this.rearExposed()) world.add(new Missile({ x: this.x - Math.cos(this.hullA) * 60, y: this.y - Math.sin(this.hullA) * 60, angle: this.hullA + Math.PI, speed: 230 }));
        Audio.play('whoosh');
      } else if (this.windup === 'mg') {
        this.mgShots = 10 + phase * 4;
        this.mgT = 0;
      }
      this.windup = null;
    }
    launchMissile(world, side) {
      world.add(new Missile({ x: this.x + Math.cos(this.hullA + side * 1.6) * 50, y: this.y + Math.sin(this.hullA + side * 1.6) * 50, angle: this.hullA + side * 1.2, speed: 230 }));
    }
    gunPos() {
      return { x: this.x + Math.cos(this.turret + 0.6) * 44, y: this.y + Math.sin(this.turret + 0.6) * 44 };
    }
    draw(ctx) {
      const L = this.r * 2.4, W = this.r * 1.8;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(-L / 2 + 8, -W / 2 + 10, L, W);
      ctx.rotate(this.hullA);
      ctx.fillStyle = '#1d1d1d';
      ctx.fillRect(-L / 2, -W / 2, L, 18);
      ctx.fillRect(-L / 2, W / 2 - 18, L, 18);
      ctx.strokeStyle = '#3a3a3a';
      for (let i = 0; i < 14; i++) {
        const x = -L / 2 + ((i * 11 + this.tread) % L);
        Gfx.line(ctx, x, -W / 2, x, -W / 2 + 18);
        Gfx.line(ctx, x, W / 2 - 18, x, W / 2);
      }
      ctx.fillStyle = this.hitFlash > 0 ? '#c8d0b8' : '#4d5a3a';
      ctx.fillRect(-L / 2 + 6, -W / 2 + 14, L - 12, W - 28);
      // Battle damage as the phases go by.
      if (this.phase >= 2) {
        ctx.strokeStyle = 'rgba(20,20,16,0.7)';
        ctx.lineWidth = 2;
        Gfx.line(ctx, 18, -W / 2 + 16, 30, -8);
        Gfx.line(ctx, 30, -8, 24, 6);
        Gfx.line(ctx, -40, W / 2 - 16, -30, 10);
      }
      ctx.fillStyle = '#3a4430';
      for (const s of [-1, 1]) ctx.fillRect(-20, s * (W / 2 - 34) - 10, 40, 20);
      // The engine panel at the rear: the weak point.
      ctx.fillStyle = this.phase >= 3 ? '#2a1a12' : '#c4302b';
      ctx.fillRect(-L / 2 + 10, -4 - (this.phase >= 3 ? 6 : 0), 18, 8 + (this.phase >= 3 ? 12 : 0));
      if (this.phase >= 3) {
        ctx.fillStyle = '#c4302b';
        for (let i = 0; i < 3; i++) ctx.fillRect(-L / 2 + 12, -8 + i * 6, 14, 2);
      }
      ctx.restore();
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.turret);
      ctx.fillStyle = '#2b3322';
      ctx.fillRect(10, -12, 72, 8);
      ctx.fillRect(10, 4, 72, 8);
      ctx.fillStyle = this.hitFlash > 0 ? '#d8e0c8' : '#5d6b4a';
      Gfx.circle(ctx, 0, 0, 30);
      ctx.fill();
      ctx.strokeStyle = '#2b3322';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.fillStyle = '#e8d27a';
      ctx.font = Gfx.font(11, DM.FONTS.display, 700);
      ctx.textAlign = 'center';
      ctx.fillText('★', 0, 4);
      ctx.restore();
    }
    emissive(ctx, world) {
      const t = world.realTime || 0;
      const L = this.r * 2.4, W = this.r * 1.8;
      const ca = Math.cos(this.hullA), sa = Math.sin(this.hullA);
      const toWorld = (lx, ly) => ({ x: this.x + ca * lx - sa * ly, y: this.y + sa * lx + ca * ly });
      // Rear engine: a dull glow, a hot vent once phase 3 opens it.
      const rear = toWorld(-L / 2 + 19, 0);
      if (this.phase >= 3) Gfx.glow(ctx, rear.x, rear.y, 30 + Math.sin(t * 9) * 6, '#ff6a2a', 0.95);
      else Gfx.glow(ctx, rear.x, rear.y, 14, '#ff5a3a', 0.45);
      if (this.aim > 0) {
        const k = 1 - this.aim / this.aimTime;
        if (this.windup === 'mg') {
          // Coax gun spinning up.
          const g = this.gunPos();
          Gfx.glow(ctx, g.x, g.y, 8 + k * 22, '#ffb24a', 0.6 + k * 0.4);
          ctx.save();
          ctx.strokeStyle = `rgba(255,190,90,${0.3 + k * 0.5})`;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(g.x, g.y, 7, t * 30, t * 30 + Math.PI * (0.5 + k));
          ctx.stroke();
          ctx.restore();
        } else if (this.windup === 'missiles') {
          // The side hatch about to launch flashes.
          const on = Math.sin(t * 34) > 0;
          for (const s of this.hatches || []) {
            const h = toWorld(0, s * (W / 2 - 34));
            if (on) Gfx.glow(ctx, h.x, h.y, 26 + k * 10, '#ff3a2a', 0.95);
            ctx.save();
            ctx.translate(h.x, h.y);
            ctx.rotate(this.hullA);
            ctx.fillStyle = on ? 'rgba(255,90,60,0.9)' : 'rgba(255,200,120,0.5)';
            ctx.fillRect(-20, -10, 40, 20);
            ctx.restore();
          }
          if (this.phase >= 2 && this.rearExposed()) {
            const b = toWorld(-L / 2 - 4, 0);
            if (on) Gfx.glow(ctx, b.x, b.y, 18 + k * 8, '#ff3a2a', 0.8);
          }
        }
      }
      if (this.mgShots > 0 && this.mgT > 0.035) {
        const g = this.gunPos();
        star(ctx, g.x + Math.cos(this.turret) * 6, g.y + Math.sin(this.turret) * 6, this.turret, 18, '#fff2c4', 0.9);
      }
    }
  }

  // ---- Karnak defences ----------------------------------------------------------
  class Turret extends Machine {
    constructor(o = {}) {
      super(Object.assign({ hp: 90, r: 18, mass: 30, static: true, grabbable: false, boomR: 60, boomDmg: 10, colors: ['#d4ad3a', '#6f4aa6', '#2a2440'] }, o));
      this.aimA = 0;
      this.aimTime = 0.5;
      this.burst = 0;
      this.sight = 560;
    }
    think(dt, world) {
      const t = this.target;
      if (!t) return;
      this.aimA = U.dampAngle(this.aimA, U.angleTo(this.x, this.y, t.x, t.y), 4, dt);
      if (this.burst > 0) {
        this.burstT -= dt;
        if (this.burstT <= 0) {
          this.burst--;
          this.burstT = 0.12;
          const a = this.aimA + U.rand(-0.06, 0.06);
          world.add(new Bullet({ x: this.x + Math.cos(a) * 22, y: this.y + Math.sin(a) * 22, vx: Math.cos(a) * 520, vy: Math.sin(a) * 520, team: 'enemy', dmg: 5, color: '#c06bff', kind: 'pulse', width: 3 }));
          Audio.play('pulse');
        }
        return;
      }
      if (this.aim > 0) {
        this.aim -= dt;
        if (this.aim <= 0) {
          this.burst = 3;
          this.burstT = 0;
          this.fireCd = U.rand(1.8, 2.6);
        }
        return;
      }
      this.fireCd -= dt;
      if (this.fireCd <= 0) this.aim = this.aimTime;
    }
    draw(ctx) {
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      Gfx.circle(ctx, this.x + 4, this.y + 5, 20);
      ctx.fill();
      ctx.fillStyle = '#2a2440';
      Gfx.circle(ctx, this.x, this.y, 20);
      ctx.fill();
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.aimA);
      ctx.fillStyle = '#8a6a1a';
      ctx.fillRect(6, -3, 22, 6);
      ctx.fillStyle = this.hitFlash > 0 ? '#ffffff' : '#d4ad3a';
      Gfx.circle(ctx, 0, 0, 12);
      ctx.fill();
      ctx.restore();
    }
    emissive(ctx) {
      Gfx.glow(ctx, this.x, this.y, this.aim > 0 ? 22 : 10, '#c06bff', 0.8);
      if (this.aim > 0 && this.target) {
        const k = 1 - this.aim / this.aimTime;
        aimLine(ctx, this.x + Math.cos(this.aimA) * 28, this.y + Math.sin(this.aimA) * 28, this.target.x, this.target.y, k, '200,110,255');
      }
    }
  }

  // Tachyon emitter: jams Temporal Sight, shielded against anything from outside.
  class Emitter extends Machine {
    constructor(o = {}) {
      super(Object.assign({ hp: 140, r: 22, mass: 99, static: true, grabbable: false, boomR: 70, boomDmg: 10, colors: ['#d4ad3a', '#6f4aa6', '#c06bff', '#ffffff'] }, o));
      this.shieldR = 125;
      this.jamR = 330;
      this.inside = new Set();
      this.flash = 0;
      this.arcs = [];
    }
    update(dt, world) {
      this.flash = Math.max(0, this.flash - dt);
      const p = world.player;
      if (p && U.dist(this.x, this.y, p.x, p.y) < this.jamR) p.jamT = Math.max(p.jamT, 0.2);
      for (const e of world.entities) {
        if (e.dead || e === this || e.static) continue;
        const d = U.dist(this.x, this.y, e.x, e.y);
        const inside = this.inside.has(e.id);
        if (d < this.shieldR) {
          if (inside) continue;
          if (e.isPlayer && (world.realTime || 0) - (e.teleportedAt == null ? -9 : e.teleportedAt) < 0.2) {
            this.inside.add(e.id);
            continue;
          }
          if (e.isProjectile) {
            if (e.boom) e.boom(world);
            else e.die('blocked');
            this.onShieldBlock(world);
            continue;
          }
          const n = U.norm(e.x - this.x, e.y - this.y);
          const nx = n.l ? n.x : 1, ny = n.l ? n.y : 0;
          e.x = this.x + nx * (this.shieldR + 1);
          e.y = this.y + ny * (this.shieldR + 1);
          const vn = e.vx * nx + e.vy * ny;
          if (vn < 0) {
            e.vx -= 1.6 * vn * nx;
            e.vy -= 1.6 * vn * ny;
            if (vn < -120) this.onShieldBlock(world);
          }
        } else if (inside && d > this.shieldR + e.r) this.inside.delete(e.id);
      }
      if (Math.random() < dt * 8) this.arcs.push({ a: U.rand(0, Math.PI * 2), t: 0.12 });
      for (const a of this.arcs) a.t -= dt;
      this.arcs = this.arcs.filter((a) => a.t > 0);
    }
    onShieldBlock(world) {
      this.flash = 0.4;
      Audio.play('shield');
      DM.Events.emit('shield:block', this);
    }
    // Taken apart from inside (disintegrated), it does not blow up in Jon's face.
    onDeath(kind, source) {
      super.onDeath(kind, source);
      Audio.play('zap');
      if (this.world) this.world.particles.burst(this.x, this.y, 50, { color: this.colors, speed: [80, 360], life: [0.3, 1], size: [2, 4], shape: 'spark' });
      DM.Events.emit('emitter:down', this);
    }
    draw(ctx, world) {
      const t = world.realTime || 0;
      ctx.save();
      ctx.strokeStyle = 'rgba(111,74,166,0.3)';
      ctx.setLineDash([2, 10]);
      ctx.lineDashOffset = t * 15;
      ctx.lineWidth = 2;
      Gfx.circle(ctx, this.x, this.y, this.jamR);
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      Gfx.circle(ctx, this.x + 4, this.y + 6, 26);
      ctx.fill();
      ctx.fillStyle = '#2a2440';
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        ctx.lineTo(this.x + Math.cos(a) * 28, this.y + Math.sin(a) * 28);
      }
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = this.hitFlash > 0 ? '#ffffff' : '#d4ad3a';
      Gfx.circle(ctx, this.x, this.y, 15);
      ctx.fill();
      Gfx.glow(ctx, this.x, this.y, 26 + Math.sin(t * 6) * 4, '#c06bff', 0.9);
      ctx.save();
      ctx.strokeStyle = 'rgba(140,70,220,0.85)';
      ctx.lineWidth = 1.5;
      for (const a of this.arcs) {
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        let px = this.x, py = this.y;
        for (let i = 1; i <= 5; i++) {
          const r = (this.shieldR * i) / 5;
          px = this.x + Math.cos(a.a + U.rand(-0.15, 0.15)) * r;
          py = this.y + Math.sin(a.a + U.rand(-0.15, 0.15)) * r;
          ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
      ctx.restore();
      // Drawn without additive blending so the shield still reads against snow.
      ctx.save();
      ctx.strokeStyle = `rgba(111,74,166,${Math.min(1, 0.55 + this.flash)})`;
      ctx.lineWidth = 3 + this.flash * 6;
      ctx.setLineDash([12, 6]);
      ctx.lineDashOffset = -t * 30;
      Gfx.circle(ctx, this.x, this.y, this.shieldR);
      ctx.stroke();
