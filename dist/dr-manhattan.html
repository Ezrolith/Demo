    g.fillStyle = 'rgba(0,0,0,0.15)';
    g.font = '700 40px Oswald, Arial Narrow, sans-serif';
    g.fillText('AREA 7 · OPERATION BLUE FIRE', 1600, 80);
  }

  function buildProving(ctx) {
    const W = ctx.newWorld({ w: 2600, h: 1600, bg: '#a8824e', wallStyles: WALLS, zoom: 1.15 });
    W.bake(bakeProving);
    W.spawn = { x: 360, y: 800, facing: 0 };
    W.room(0, 0, 2600, 1600, { t: 20, kind: 'rock' });
    W.wall(CANYON.x, 20, CANYON.w, 1560, 'chasm');
    W.wall(1380, 640, 140, 110, 'concrete');
    W.wall(1360, 790, 70, 22, 'sandbag');
    W.wall(1480, 790, 70, 22, 'sandbag');
    for (const [x, y, w, h] of [[1800, 300, 120, 80], [2100, 1100, 160, 90], [1900, 780, 70, 140], [2300, 500, 100, 100], [1650, 1260, 140, 60], [2250, 1380, 90, 70], [300, 400, 120, 70], [420, 1200, 90, 110]]) W.wall(x, y, w, h, 'rock');

    const rnd = U.seeded(7);
    for (let x = 930; x < 1300; x += 92) {
      for (let y = 260; y < 1350; y += 88) {
        if (rnd() < 0.22) continue;
        ctx.add(new Mine(x + rnd() * 50, y + rnd() * 40));
      }
    }
    ctx.add(new NPC({ x: 1450, y: 840, look: 'general', facing: Math.PI / 2 }));
    for (const [x, y, k] of [[1700, 620, 'wreck'], [2000, 1010, 'wreck'], [2220, 300, 'wreck'], [560, 980, 'jeep']]) ctx.add(new Vehicle(x, y, { kind: k, mass: 6, hp: 300, rot: rnd() * 3 }));
    for (const [x, y] of [[1660, 900], [1700, 930], [2150, 700], [2400, 1300], [1980, 560], [1600, 420]]) ctx.add(new Crate(x, y, { style: 'metal' }));
    for (const [x, y] of [[1760, 1120], [2060, 460], [2380, 900]]) ctx.add(new Barrel(x, y));
    return W;
  }

  function edgeSpot(W, r) {
    for (let i = 0; i < 30; i++) {
      const x = U.rand(2360, 2540), y = U.rand(160, 1440);
      if (W.isFree(x, y, r)) return { x, y };
    }
    return { x: 2480, y: 800 };
  }

  function spawnWave(ctx, spec) {
    const W = ctx.world;
    const out = [];
    for (let i = 0; i < (spec.drones || 0); i++) {
      const p = edgeSpot(W, 14);
      out.push(ctx.add(new Drone({ x: p.x, y: p.y, sight: 2400, alerted: true })));
    }
    for (let i = 0; i < (spec.tanks || 0); i++) {
      const p = edgeSpot(W, 32);
      out.push(ctx.add(new Tank({ x: p.x, y: p.y, sight: 1800, needLos: false, facing: Math.PI })));
    }
    for (const [x, y] of spec.batteries || []) out.push(ctx.add(new Battery({ x, y })));
    for (const e of out) W.particles.burst(e.x, e.y, 14, { color: ['#e8d27a', '#ffffff'], speed: [40, 160], life: [0.2, 0.5], size: [2, 3] });
    return out;
  }

  function* runWaves(ctx, from, specs) {
    for (let i = 0; i < specs.length; i++) {
      const n = from + i;
      yield ctx.banner(`WAVE ${n}`, specs[i].title, { dur: 2.2, color: DM.C.orange });
      const enemies = spawnWave(ctx, specs[i]);
      ctx.objective('Survive Operation Blue Fire', () => `Wave ${n}/5 · ${enemies.filter((e) => !e.dead).length} left`);
      if (specs[i].hint) ctx.hint(specs[i].hint, 8);
      yield ctx.until(() => enemies.every((e) => e.dead));
      ctx.objectiveDone();
      yield ctx.wait(1.6);
    }
  }

  DM.Chapters.register({
    id: 'deterrent',
    numeral: 'CHAPTER III',
    title: 'The Deterrent',
    date: '1971 – 1977',
    place: 'Nevada Test Site',
    clock: 5,
    color: '#5f6a2a',
    music: 'action',
    form: 'manhattan',
    epigraph: { text: 'I know not with what weapons World War III will be fought, but World War IV will be fought with sticks and stones.', by: 'Albert Einstein' },
    intro: [
      '1971. The war in Vietnam ends in a week. I am the reason. Whole units surrender to me personally; some of them try to touch me, as though I were a god.',
      'At home, the Soviets answer me with warheads. Every missile they build, they build because of me.',
      'The Pentagon wants proof that nothing on Earth can stop me. They will spend a great deal of money finding out.',
    ],
    maps: { proving: buildProving },
    stages: [
      {
        id: 'blink',
        map: 'proving',
        grants: ['teleport'],
        run: function* (ctx) {
          const P = ctx.player;
          ctx.lock(true);
          yield ctx.wait(0.6);
          yield ctx.dialog([
            ['general', 'Doctor. Operation Blue Fire: everything this country has, pointed at one man. Congress wants to know whether you can be stopped.'],
            ['manhattan', 'And if I can?'],
            ['general', 'Then I sleep better. Get across that canyon. We start when you reach my bunker.'],
          ]);
          yield ctx.unlock('teleport');
          ctx.lock(false);
          ctx.objective('Cross the canyon');
          ctx.marker(CANYON.x + CANYON.w + 60, 800, 'ACROSS');
          yield ctx.until(() => P.x > CANYON.x + CANYON.w + 10);
          ctx.objectiveDone();
          ctx.marker(POST.x, POST.y, 'COMMAND POST');
          yield ctx.wait(0.6);
          ctx.objective('Reach the command post');
          ctx.hint('A minefield. You could walk through it carefully. Or you could not walk at all.', 8);
          yield ctx.until(() => U.dist(P.x, P.y, POST.x, POST.y) < 90);
          ctx.objectiveDone();
          ctx.marker(null);
        },
      },
      {
        id: 'waves1',
        checkpoint: true,
        run: function* (ctx) {
          if (ctx.startedHere) ctx.place(1600, 900, 0);
          ctx.lock(true);
          yield ctx.dialog([['general', 'All units: weapons free. God help us all.']]);
          ctx.lock(false);
          yield* runWaves(ctx, 1, [
            { title: 'RECONNAISSANCE DRONES', drones: 6, hint: 'Throw things at them. Or throw them at things.' },
            { title: 'ARMOUR', drones: 4, tanks: 2, hint: 'Watch for red rings: that is where a shell will land.' },
          ]);
        },
      },
      {
        id: 'waves2',
        checkpoint: true,
        grants: ['duplicate'],
        run: function* (ctx) {
          if (ctx.startedHere) ctx.place(1600, 900, 0);
          ctx.lock(true);
          yield ctx.dialog([['general', 'Send in everything. Everything!']]);
          yield ctx.narrate('There are more of them than there are of me. That is easily corrected.', { dur: 4 });
          yield ctx.unlock('duplicate');
          ctx.lock(false);
          yield* runWaves(ctx, 3, [
            { title: 'COMBINED ARMS', drones: 7, tanks: 2, batteries: [[2350, 460]], hint: 'Grab a missile in flight and it is yours to throw back.' },
            { title: 'SATURATION', drones: 5, tanks: 3, batteries: [[2350, 1150], [2460, 760]] },
          ]);
        },
      },
      {
        id: 'behemoth',
        checkpoint: true,
        run: function* (ctx) {
          const W = ctx.world;
          if (ctx.startedHere) ctx.place(1600, 900, 0);
          ctx.lock(true);
          yield ctx.dialog([['general', 'Bring out the Behemoth. Four hundred tons of experimental armour. It cost more than the moon programme.']]);
          const b = ctx.add(new Behemoth({ x: 2420, y: 800, facing: Math.PI }));
          W.boss = b;
          ctx.focus(b.x, b.y);
          W.camera.shake(0.6);
          DM.Audio.play('explosion');
          yield ctx.wait(1.6);
          ctx.focus(null);
          ctx.lock(false);
          ctx.objective('Destroy the Behemoth');
          ctx.hint('Too heavy to lift. Its own missiles, thrown back, will hurt it badly.', 9);
          yield ctx.until(() => b.dead);
          W.boss = null;
          ctx.objectiveDone();
          yield ctx.wait(2);
        },
      },
      {
        id: 'outro',
        run: function* (ctx) {
          ctx.lock(true);
          yield ctx.dialog([
            ['general', '...Cease fire. Cease fire.'],
            ['general', "Doctor, I've just watched a billion dollars of hardware turn into weather."],
            ['manhattan', 'The Soviets were watching too.'],
            ['general', '...Yes. Yes, they were.'],
          ]);
          yield ctx.narrate('The Doomsday Clock moves forward. Every warhead they build, they build because of me.', { dur: 5.5 });
        },
      },
    ],
  });
})();
</script>
<script>/* src/data/chapters/mars.js */
/*
 * CHAPTER IV — The Watchmaker. A television studio, then Mars, 1985.
 * Leave Earth, unlock Temporal Sight and Expand, build the glass palace,
 * and find the memories hidden in time.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const { Prop } = DM.Props;
  const { Shard, Palace, Memory, Meteor } = DM.Special;
  const NPC = DM.NPC;
  const C = { x: 1200, y: 1200 };

  // ---- studio --------------------------------------------------------------------
  const STUDIO_WALLS = {
    wall: { top: '#2a2633', face: '#1c1924', edge: '#0d0b12' },
    seat: { top: '#5a2a3a', face: '#3e1d28', edge: '#1e0e14', low: true },
    desk: { top: '#2e3b5a', face: '#1f2840', edge: '#0e1320', low: true },
  };
  function bakeStudio(g) {
    g.fillStyle = '#1d1a24';
    g.fillRect(0, 0, 1400, 900);
    const gr = g.createRadialGradient(700, 330, 40, 700, 330, 420);
    gr.addColorStop(0, 'rgba(120,140,200,0.18)');
    gr.addColorStop(1, 'rgba(120,140,200,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, 1400, 900);
    g.fillStyle = '#2e2a3a';
    Gfx.rr(g, 440, 210, 520, 270, 30);
    g.fill();
    g.strokeStyle = '#7fa0e0';
    g.lineWidth = 3;
    g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.08)';
    g.font = '700 46px Oswald, Arial Narrow, sans-serif';
    g.textAlign = 'center';
    g.fillText('NOVA EXPRESS', 700, 140);
    g.textAlign = 'left';
    g.strokeStyle = 'rgba(0,0,0,0.5)';
    g.lineWidth = 3;
    for (let i = 0; i < 6; i++) {
      g.beginPath();
      g.moveTo(100 + i * 40, 880);
      g.bezierCurveTo(300 + i * 30, 700, 400, 650 - i * 10, 520, 560);
      g.stroke();
    }
  }
  function buildStudio(ctx) {
    const W = ctx.newWorld({ w: 1400, h: 900, bg: '#121018', wallStyles: STUDIO_WALLS, zoom: 1.35 });
    W.bake(bakeStudio);
    W.spawn = { x: 700, y: 400, facing: Math.PI / 2 };
    W.room(0, 0, 1400, 900, { t: 24 });
    W.wall(620, 240, 160, 40, 'desk');
    for (const y of [640, 710, 780]) {
      W.wall(180, y, 470, 26, 'seat');
      W.wall(750, y, 470, 26, 'seat');
    }
    const R = (ctx.refs = {});
    R.host = ctx.add(new NPC({ x: 700, y: 310, look: 'host', facing: Math.PI / 2 }));
    R.press = [
      [560, 520, 'reporter'], [840, 520, 'reporter2'], [700, 570, 'reporter'], [470, 440, 'reporter2'], [930, 440, 'reporter'],
    ].map(([x, y, look]) => ctx.add(new NPC({ x, y, look, facing: U.angleTo(x, y, 700, 400), lookAtPlayer: true, speed: 70 })));
    const cams = [[500, 600], [900, 600], [340, 360], [1060, 360]];
    W.overlays.push((g, world) => {
      const t = world.realTime || 0;
      for (const [x, y] of cams) {
        g.fillStyle = '#111';
        g.fillRect(x - 14, y - 10, 28, 20);
        g.fillStyle = '#333';
        g.fillRect(x - 6, y - 18, 12, 10);
        Gfx.glow(g, x, y - 14, 8, '#ff3a2a', Math.sin(t * 4 + x) > 0 ? 0.9 : 0.3);
      }
      for (let i = 0; i < 5; i++) Gfx.glow(g, 300 + i * 200, 40, 120, '#fff2d0', 0.12);
    });
    return W;
  }

  // ---- Mars ------------------------------------------------------------------------
  const MARS_WALLS = {
    rock: {
      draw: (g, w) => {
        g.fillStyle = '#5a2412';
        Gfx.rr(g, w.x, w.y, w.w, w.h, Math.min(w.w, w.h) * 0.45);
        g.fill();
        g.fillStyle = 'rgba(230,140,90,0.25)';
        Gfx.rr(g, w.x + 6, w.y + 4, w.w * 0.6, w.h * 0.4, Math.min(w.w, w.h) * 0.2);
        g.fill();
      },
    },
  };
  const ROCKS = [[500, 500, 120, 90], [1800, 400, 90, 140], [400, 1700, 160, 80], [1900, 1800, 100, 100], [1100, 300, 140, 60], [300, 1100, 70, 150], [2000, 1150, 80, 120], [1450, 2050, 120, 70]];
  const MEMORIES = [
    { x: 500, y: 900, year: 1945, text: 'My father throws his watch parts out of the window. They fall into the street like seeds. The future belongs to physics, he says.' },
    { x: 1900, y: 700, year: 1959, text: "Janey's watch, in pieces on my bench. Everything goes back together, if you understand it well enough. Almost everything." },
    { x: 820, y: 1900, year: 1963, text: 'A motel room in Arizona. Janey is getting older. I am not. We both pretend not to have noticed.' },
    { x: 1700, y: 1850, year: 1966, text: 'A room full of masked people who want to save the world. I am the only one who does not need a mask.' },
    { x: 2080, y: 1350, year: 1970, text: 'Laurie, sixteen, laughing at something I said. Janey sees me watching her, and understands before I do.' },
    { x: 1000, y: 520, year: 1977, text: 'Wally Weaver is buried. I stand at the graveside. I cannot tell if I am sad, or only remembering being sad.' },
  ];

  function bakeMars(g) {
    const rnd = U.seeded(1985);
    const gr = g.createRadialGradient(C.x, C.y, 100, C.x, C.y, 1700);
    gr.addColorStop(0, '#b9582f');
    gr.addColorStop(1, '#7e3219');
    g.fillStyle = gr;
    g.fillRect(0, 0, 2400, 2400);
    for (let i = 0; i < 14000; i++) {
      g.fillStyle = rnd() < 0.5 ? 'rgba(60,20,8,0.12)' : 'rgba(255,200,150,0.07)';
      g.fillRect(rnd() * 2400, rnd() * 2400, 3, 3);
    }
    g.strokeStyle = 'rgba(255,190,140,0.12)';
    g.lineWidth = 6;
    for (let i = 0; i < 22; i++) {
      const y = rnd() * 2400;
      g.beginPath();
      g.moveTo(0, y);
      g.bezierCurveTo(800, y + rnd() * 160 - 80, 1600, y + rnd() * 160 - 80, 2400, y + rnd() * 100 - 50);
      g.stroke();
    }
    for (let i = 0; i < 26; i++) {
      const x = rnd() * 2400, y = rnd() * 2400, r = 30 + rnd() * 110;
      if (U.dist(x, y, C.x, C.y) < 420) continue;
      g.fillStyle = 'rgba(80,25,10,0.4)';
      Gfx.ellipse(g, x, y, r, r * 0.85);
      g.fill();
      g.strokeStyle = 'rgba(240,150,100,0.35)';
      g.lineWidth = 5;
      g.beginPath();
      g.ellipse(x, y, r, r * 0.85, 0, Math.PI * 1.1, Math.PI * 2.1);
      g.stroke();
    }
  }

  function freeSpot(W, rMin, rMax, rad) {
    for (let i = 0; i < 60; i++) {
      const a = U.rand(0, Math.PI * 2), d = U.rand(rMin, rMax);
      const x = C.x + Math.cos(a) * d, y = C.y + Math.sin(a) * d;
      if (W.isFree(x, y, rad + 10)) return { x, y };
    }
    return { x: C.x + rMax, y: C.y };
  }

  function buildMars(ctx) {
    const W = ctx.newWorld({ w: 2400, h: 2400, bg: '#6e2c16', wallStyles: MARS_WALLS, zoom: 1.1 });
    W.bake(bakeMars);
    W.spawn = { x: C.x, y: C.y + 380, facing: -Math.PI / 2 };
    for (const [x, y, w, h] of ROCKS) W.wall(x, y, w, h, 'rock');
    const palace = W.add(new Palace(C.x, C.y));
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
      palace.addSlot(W, C.x + Math.cos(a) * 230, C.y + Math.sin(a) * 230, false);
    }
    for (let i = 0; i < 4; i++) {
      const a = Math.PI / 4 + (i * Math.PI) / 2;
      palace.addSlot(W, C.x + Math.cos(a) * 110, C.y + Math.sin(a) * 110, true);
    }
    for (let i = 0; i < 15; i++) {
      const p = freeSpot(W, 430, 1050, 14);
      W.add(new Shard(p.x, p.y, false));
    }
    for (let i = 0; i < 4; i++) {
      const p = freeSpot(W, 520, 880, 30);
      W.add(new Shard(p.x, p.y, true));
    }
    for (const m of MEMORIES) W.add(new Memory(m.x, m.y, m));
    W.overlays.push((g, world) => {
      const t = world.realTime || 0;
      const v = world.camera.view();
      g.save();
      g.globalAlpha = 0.18;
      g.strokeStyle = '#f0b080';
      g.lineWidth = 1;
      for (let i = 0; i < 26; i++) {
        const x = v.x0 + ((i * 197 + t * 140) % (v.x1 - v.x0 + 200)) - 100;
        const y = v.y0 + ((i * 113 + t * 20) % (v.y1 - v.y0));
        Gfx.line(g, x, y, x + 50, y + 6);
      }
      g.restore();
    });
    ctx.refs = { palace };
    return W;
  }

  function* meteorShower(ctx) {
    while (!ctx.flags.palaceDone) {
      yield ctx.wait(U.rand(3.2, 5.2));
      if (ctx.flags.palaceDone || ctx.locked) continue;
      const P = ctx.player;
      let x = P.x + U.rand(-260, 260), y = P.y + U.rand(-260, 260);
      if (U.chance(0.35)) {
        x = P.x + P.vx * 1.6;
        y = P.y + P.vy * 1.6;
      }
      x = U.clamp(x, 80, 2320);
      y = U.clamp(y, 80, 2320);
      if (U.dist(x, y, C.x, C.y) < 160) continue;
      ctx.add(new Meteor(x, y, { T: 2.6, radius: 70, dmg: 14 }));
    }
  }

  function fillSlots(ctx, big) {
    const W = ctx.world;
    const palace = ctx.refs.palace;
    const shards = W.entities.filter((e) => e instanceof Shard && e.big === big && !e.placed);
    for (const s of palace.slots) {
      if (s.big !== big || s.filled) continue;
      const sh = shards.pop();
      if (sh) s.fill(sh, null);
    }
  }

  DM.Chapters.register({
    id: 'mars',
    numeral: 'CHAPTER IV',
    title: 'The Watchmaker',
    date: 'October 1985',
    place: 'New York · Mars',
    clock: 3,
    color: '#a8432a',
    music: 'mars',
    form: 'manhattan',
    epigraph: { text: 'The distinction between past, present and future is only a stubbornly persistent illusion.', by: 'Albert Einstein' },
    intro: [
      'October 1985. A television studio in New York. The interviewer smiles at me as if we are friends.',
      'Then the questions start: about Wally, about Janey, about the cancers carried by the people who have stood closest to me.',
      'There are too many voices. There is too much light. I go somewhere quiet.',
    ],
    maps: { studio: buildStudio, mars: buildMars },
    stages: [
      {
        id: 'studio',
        map: 'studio',
        run: function* (ctx) {
          const P = ctx.player, R = ctx.refs, W = ctx.world;
          ctx.music('tension');
          ctx.lock(true);
          ctx.cinematic(true);
          yield ctx.wait(0.6);
          yield ctx.dialog([
            ['host', "...and we're back. Doctor Manhattan, thank you for joining us, live."],
            ['reporter', 'Doctor! Wally Weaver died of cancer in 1977. Your friend. Is it true he worked beside you every day?'],
            ['reporter2', 'Janey Slater has cancer too. She says you gave it to her. Is that true?'],
            ['reporter', 'How many others, Doctor? How many people have you hurt just by standing next to them?'],
            ['manhattan', 'Please. Stop.'],
            ['reporter2', "Is that a no, Doctor? Doctor! Look this way!"],
          ]);
          ctx.cinematic(false);
          const barks = ['Doctor!', 'Is it true?', 'Look this way!', 'Did you know?', 'Doctor Manhattan!', 'Answer the question!'];
          ctx.fork(function* () {
            while (!ctx.flags.left) {
              for (const r of R.press) {
                r.walkTo(P.x + U.rand(-70, 70), P.y + U.rand(-70, 70));
                if (U.chance(0.3)) W.bark(r, U.pick(barks), 1.2);
              }
              if (U.chance(0.6)) {
                ctx.flash('#ffffff', 0.25);
                DM.Audio.play('tick');
              }
              yield ctx.wait(0.8);
            }
          });
          ctx.lock(false);
          const before = P.teleportedAt;
          ctx.objective('Leave');
          ctx.hint('Press SPACE to teleport. Somewhere far away.', 99);
          yield ctx.until(() => P.teleportedAt !== before);
          ctx.flags.left = true;
          ctx.hint(null);
          ctx.objective(null);
          ctx.lock(true);
          ctx.flash('#ffffff', 1.2);
          DM.Audio.play('teleport');
          yield ctx.wait(0.5);
        },
      },
      {
        id: 'palace',
        map: 'mars',
        checkpoint: true,
        grants: ['timesight'],
        run: function* (ctx) {
          const palace = ctx.refs.palace;
          ctx.music('mars');
          ctx.lock(true);
          yield ctx.wait(1);
          yield ctx.narrate('Mars. It is quiet here. Nobody is asking me anything.', { dur: 4 });
          yield ctx.narrate('I have begun to see time the way I see space: all of it at once, laid out in front of me.', { dur: 5 });
          yield ctx.unlock('timesight');
          ctx.lock(false);
          ctx.objective('Build the palace', () => `${palace.count(false)}/${palace.total(false)}`);
          ctx.hint('Lift crystals into the glowing slots. Meteors fall here: Temporal Sight shows you where.', 9);
          ctx.fork(meteorShower);
          ctx.fork(function* () {
            yield ctx.wait(30);
            if (ctx.stats.memories === 0) ctx.hint('Hold F somewhere quiet. There are moments hidden here, out of the corner of time.', 8);
          });
          yield ctx.until(() => palace.count(false) >= palace.total(false));
          ctx.objectiveDone();
        },
        restore(ctx) {
          fillSlots(ctx, false);
        },
      },
      {
        id: 'great',
        checkpoint: true,
        grants: ['expand'],
        run: function* (ctx) {
          const palace = ctx.refs.palace;
          if (ctx.startedHere) ctx.fork(meteorShower);
          ctx.lock(true);
          yield ctx.wait(0.8);
          yield ctx.narrate('The great crystals are too heavy to lift. For a man my size.', { dur: 4 });
          yield ctx.unlock('expand');
          ctx.lock(false);
          ctx.objective('Set the great crystals', () => `${palace.count(true)}/${palace.total(true)}`);
          ctx.hint('Press G to grow, then lift a great crystal into the centre before you shrink back.', 9);
          yield ctx.until(() => palace.count(true) >= palace.total(true));
          ctx.objectiveDone();
        },
        restore(ctx) {
          fillSlots(ctx, true);
        },
      },
      {
        id: 'laurie',
        run: function* (ctx) {
          const P = ctx.player, W = ctx.world, palace = ctx.refs.palace;
          ctx.flags.palaceDone = true;
          ctx.lock(true);
          ctx.focus(palace.x, palace.y);
          palace.risingT = 3;
          DM.Audio.play('unlock');
          W.camera.shake(0.4);
          yield ctx.wait(3.4);
          ctx.focus(null);
          const lx = U.clamp(P.x + 90, 60, W.w - 60), ly = P.y;
          W.particles.burst(lx, ly, 40, { color: ['#7fe3ff', '#ffffff'], speed: [40, 200], life: [0.3, 0.8], size: [1.5, 3] });
          DM.Audio.play('teleport');
          ctx.add(new NPC({ x: lx, y: ly, look: 'laurie', facing: Math.PI }));
          yield ctx.wait(0.8);
          yield ctx.dialog([
            ['laurie', "Jon. ...It's beautiful. It's also the loneliest thing I've ever seen."],
            ['laurie', "The world's about to end. You have to come back. You're the only one who can stop it."],
            ['manhattan', 'Why? Life on Earth is no more remarkable than the silence here.'],
            ['laurie', 'Then look at me. One person. Is that so unremarkable?'],
            ['manhattan', 'Thermodynamic miracles. Events so unlikely they are effectively impossible, like oxygen spontaneously becoming gold.'],
            ['manhattan', 'Every human life is one. I had forgotten. We will go back.'],
          ]);
        },
      },
    ],
  });
})();
</script>
<script>/* src/data/chapters/karnak.js */
/*
 * CHAPTER V — Karnak. Antarctica, November 1985.
 * Destroy the shielded tachyon emitters, survive the Intrinsic Field
 * Subtractor (by reassembling, again), then stop Adrian Veidt.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const { Prop, Door, Crate } = DM.Props;
  const { Drone, Turret, Emitter, Veidt } = DM.Enemies;
  const { Atom, BodyForm } = DM.Special;
  const NPC = DM.NPC;

  const WALLS = {
    ice: { top: '#bcd3e6', face: '#93b1cc', edge: '#6d8fae' },
    karnak: { top: '#c9a24a', face: '#8a6a22', edge: '#4e3a10' },
    pillar: { top: '#d8b860', face: '#9a7a2a', edge: '#5a4410' },
    wall: { top: '#c9a24a', face: '#8a6a22', edge: '#4e3a10' },
  };
  const SUB = { x: 2470, y: 1000 };
  const EMITTERS = [[420, 420], [950, 320], [520, 1580], [1050, 1420]];

  function bakeKarnak(g) {
    const rnd = U.seeded(1985);
    g.fillStyle = '#e6eef5';
    g.fillRect(0, 0, 2600, 2000);
    for (let i = 0; i < 12000; i++) {
      g.fillStyle = rnd() < 0.6 ? 'rgba(120,150,190,0.07)' : 'rgba(255,255,255,0.5)';
      g.fillRect(rnd() * 1300, rnd() * 2000, 3, 3);
    }
    g.strokeStyle = 'rgba(150,180,215,0.25)';
    g.lineWidth = 3;
    for (let i = 0; i < 30; i++) {
      const x = rnd() * 1300, y = rnd() * 2000;
      Gfx.line(g, x, y, x + 60 + rnd() * 120, y + rnd() * 10 - 5);
    }
    for (let i = 0; i < 12; i++) {
      g.fillStyle = 'rgba(170,215,240,0.35)';
      Gfx.ellipse(g, rnd() * 1200, rnd() * 2000, 60 + rnd() * 120, 30 + rnd() * 60, rnd() * 3);
      g.fill();
    }
    g.fillStyle = '#c9b27a';
    g.fillRect(1300, 160, 1300, 1680);
    g.strokeStyle = 'rgba(90,70,30,0.25)';
    g.lineWidth = 2;
    for (let x = 1300; x < 2600; x += 60) Gfx.line(g, x, 160, x, 1840);
    for (let y = 160; y < 1840; y += 60) Gfx.line(g, 1300, y, 2600, y);
    g.fillStyle = '#d8b860';
    g.fillRect(1340, 960, 560, 80);
    g.fillStyle = '#2e2440';
    g.fillRect(1900, 500, 650, 1000);
    g.strokeStyle = 'rgba(212,173,58,0.6)';
    g.lineWidth = 3;
    for (const r of [120, 200, 280]) {
      Gfx.circle(g, 2250, 1000, r);
      g.stroke();
    }
    g.fillStyle = 'rgba(212,173,58,0.5)';
    for (let i = 0; i < 40; i++) {
      const x = 1940 + i * 15;
      g.fillRect(x, 540, 6, 14);
      g.fillRect(x, 1446, 6, 14);
    }
    g.fillStyle = 'rgba(40,30,10,0.25)';
    g.font = '700 54px Oswald, Arial Narrow, sans-serif';
    g.fillText('KARNAK', 1420, 260);
  }

  function buildKarnak(ctx) {
    const W = ctx.newWorld({ w: 2600, h: 2000, bg: '#d6e2ec', wallStyles: WALLS, zoom: 1.2 });
    W.bake(bakeKarnak);
    W.spawn = { x: 150, y: 1000, facing: 0 };
    W.room(0, 0, 2600, 2000, { t: 20, kind: 'ice' });
    W.wall(1300, 160, 1300, 40, 'karnak');
    W.wall(1300, 1800, 1300, 40, 'karnak');
    W.wall(1300, 200, 40, 700, 'karnak');
    W.wall(1300, 1100, 40, 700, 'karnak');
    W.room(1900, 500, 676, 1000, { kind: 'karnak', t: 24, doors: [{ side: 'left', at: 440, w: 120 }] });
    for (let x = 1450; x < 1850; x += 130) {
      for (let y = 300; y < 1760; y += 200) {
        if (y > 820 && y < 1180) continue;
        W.wall(x, y, 40, 40, 'pillar');
      }
    }
    for (const [x, y, w, h] of [[300, 820, 200, 40], [780, 980, 40, 200], [200, 1300, 160, 40], [1000, 700, 140, 40], [640, 1180, 140, 40]]) W.wall(x, y, w, h, 'ice');

    const R = (ctx.refs = {});
    R.gate = W.add(new Door(W, 1300, 900, 40, 200, { color: '#b8902e', stripe: '#6f4aa6' }));
    R.emitters = EMITTERS.map(([x, y]) => W.add(new Emitter({ x, y })));
    R.turrets = [[620, 520], [1130, 440], [700, 1480], [1180, 1260]].map(([x, y]) => W.add(new Turret({ x, y })));
    R.drones = [[700, 900], [1100, 1050], [400, 1200]].map(([x, y]) => W.add(new Drone({ x, y, style: 'karnak', sight: 700 })));
    for (const [x, y] of [[260, 600], [300, 640], [880, 1100], [900, 640], [460, 1400], [1150, 900]]) W.add(new Crate(x, y, { style: 'metal' }));
    R.sub = W.add(new Prop({
      x: SUB.x, y: SUB.y, r: 4, data: { charge: 0 },
      draw: (g, e, world) => {
        const t = world.realTime || 0;
        const k = e.data.charge;
        g.fillStyle = '#2a2440';
        Gfx.circle(g, SUB.x, SUB.y, 54);
        g.fill();
        g.strokeStyle = '#d4ad3a';
        g.lineWidth = 6;
        Gfx.circle(g, SUB.x, SUB.y, 46);
        g.stroke();
        g.save();
        g.translate(SUB.x, SUB.y);
        g.rotate(t * (0.5 + k * 6));
        for (let i = 0; i < 6; i++) {
          g.rotate(Math.PI / 3);
          g.fillStyle = '#8a6a22';
          g.fillRect(30, -5, 22, 10);
        }
        g.restore();
        g.fillStyle = '#6f4aa6';
        g.fillRect(SUB.x - 80, SUB.y - 10, 40, 20);
        Gfx.glow(g, SUB.x - 80, SUB.y, 30 + k * 60, '#c06bff', 0.4 + k * 0.6);
      },
    }));
    R.veidtNpc = W.add(new NPC({ x: 2340, y: 1000, look: 'veidt', facing: Math.PI }));
    return W;
  }

  // The Intrinsic Field Subtractor beam.
  function beamOverlay(ctx) {
    return (g, world) => {
      const k = ctx.flags.beam || 0;
      if (k <= 0) return;
      const P = ctx.player;
      g.save();
      g.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 3; i++) {
        g.strokeStyle = i ? `rgba(192,107,255,${0.3 * k})` : `rgba(255,255,255,${0.9 * k})`;
        g.lineWidth = (i ? 18 - i * 4 : 4) * k;
        g.beginPath();
        g.moveTo(SUB.x - 80, SUB.y);
        for (let s = 1; s <= 12; s++) {
          const f = s / 12;
          g.lineTo(U.lerp(SUB.x - 80, P.x, f) + U.rand(-6, 6) * k, U.lerp(SUB.y, P.y, f) + U.rand(-6, 6) * k);
        }
        g.stroke();
      }
      g.restore();
    };
  }

  function* reassemble(ctx) {
    const P = ctx.player, W = ctx.world;
    const body = W.add(new BodyForm(P.x, P.y, { H: 170, depositR: 95 }));
    const quota = 30;
    let bank = 0;
    ctx.setForm('awareness');
    P.carry = 0;
    P.carryMax = 40;
    P.basePull = 120;
    P.y += 150;
    for (let i = 0; i < 46; i++) {
      const a = U.rand(0, Math.PI * 2), d = U.rand(170, 430);
      W.add(new Atom(U.clamp(body.x + Math.cos(a) * d, 1950, 2520), U.clamp(body.y + Math.sin(a) * d, 550, 1450)));
    }
    ctx.lock(false);
    ctx.objective('Reassemble', () => `${bank}/${quota}`);
    ctx.hint('You have done this before. Gather yourself, then return to the ring.', 8);
    while (bank < quota) {
      if (P.carry > 0 && U.dist(P.x, P.y, body.x, body.y) < body.depositR) {
        P.carry--;
        bank++;
        body.pulse = 0.35;
        const f = bank / quota;
        body.layers = [Math.min(1, f * 4), Math.min(1, Math.max(0, f * 4 - 1)), Math.min(1, Math.max(0, f * 4 - 2)), Math.min(1, Math.max(0, f * 4 - 3))];
        DM.Audio.play('deposit');
        yield ctx.wait(0.035);
      } else yield;
    }
    ctx.objectiveDone();
    ctx.lock(true);
    for (const e of W.entities) if (e instanceof Atom) e.dead = true;
    for (let k = 0; k <= 1; k += 0.05) {
      body.skin = k;
      yield ctx.wait(0.03);
    }
    ctx.flash('#dff7ff', 1.4);
    W.camera.shake(0.6);
    DM.Audio.play('expand');
    ctx.setForm('manhattan');
    P.x = body.x;
    P.y = body.y;
    body.dead = true;
    P.targetScale = 2.2;
    P.expandT = 4;
    W.camera.targetZoom = W.baseZoom * 0.8;
  }

  DM.Chapters.register({
    id: 'karnak',
    numeral: 'CHAPTER V',
    title: 'Karnak',
    date: 'November 1985',
    place: 'Antarctica',
    clock: 1,
    color: '#5b3a7a',
    music: 'finale',
    form: 'manhattan',
    epigraph: { text: 'Quis custodiet ipsos custodes? Who watches the watchmen?', by: 'Juvenal, Satires' },
    intro: [
      'November 1985. Laurie has persuaded me to look at the world again. When I try to look ahead, I see only static.',
      'Tachyons: a storm of them, pouring out of Antarctica, drowning my view of the future. Someone has gone to great lengths to hide from me.',
      'At the bottom of the world, behind a wall of ice, an old friend is waiting.',
    ],
    maps: { karnak: buildKarnak },
    stages: [
      {
        id: 'emitters',
        map: 'karnak',
        checkpoint: true,
        run: function* (ctx) {
          const R = ctx.refs, P = ctx.player;
          ctx.lock(true);
          yield ctx.wait(0.8);
          yield ctx.narrate('Antarctica. My future is white noise here. Somebody does not want to be seen.', { dur: 4.5 });
          ctx.lock(false);
          const left = () => R.emitters.filter((e) => !e.dead);
          ctx.objective('Destroy the tachyon emitters', () => `${4 - left().length}/4`);
          ctx.hint('Tachyon emitters jam Temporal Sight. Find them and take them apart.', 8);
          let told = false;
          ctx.on('shield:block', () => {
            if (told) return;
            told = true;
            ctx.hint('The shield stops anything thrown or fired from outside. It will not stop you. SPACE: teleport inside.', 10);
          });
          ctx.fork(function* () {
            while (left().length) {
              let best = null, bd = Infinity;
              for (const e of left()) {
                const d = U.dist(P.x, P.y, e.x, e.y);
                if (d < bd) {
                  bd = d;
                  best = e;
                }
              }
              if (best) ctx.marker(best.x, best.y - 40, 'EMITTER');
              yield ctx.wait(0.5);
            }
            ctx.marker(null);
          });
          yield ctx.until(() => left().length === 0);
          ctx.objectiveDone();
          R.gate.setOpen(true);
          yield ctx.wait(0.8);
          yield ctx.narrate('The static clears. I can see again. I see the next eleven minutes, and I do not like them.', { dur: 5 });
        },
        restore(ctx) {
          const R = ctx.refs;
          for (const e of [...R.emitters, ...R.turrets, ...R.drones]) e.dead = true;
          R.gate.open = true;
          R.gate.k = 1;
          R.gate.wall.noCollide = true;
        },
      },
      {
        id: 'subtractor',
        checkpoint: true,
        run: function* (ctx) {
          const R = ctx.refs, P = ctx.player, W = ctx.world;
          if (ctx.startedHere) ctx.place(1200, 1000, 0);
          ctx.objective('Enter Karnak');
          ctx.marker(1960, 1000, 'SANCTUM');
          yield ctx.until(() => P.x > 1960);
          ctx.marker(null);
          ctx.objective(null);
          ctx.lock(true);
          ctx.cinematic(true);
          ctx.focus(2200, 1000);
          yield ctx.dialog([
            ['veidt', 'Jon. I hoped you would come. I prepared for it, in fact.'],
            ['manhattan', 'Adrian. The tachyons were yours.'],
            ['veidt', 'Of course. You see everything, so I gave you nothing to see. Forgive me. And forgive this.'],
          ]);
          W.overlays.push(beamOverlay(ctx));
          for (let k = 0; k <= 1; k += 0.04) {
            R.sub.data.charge = k;
            yield ctx.wait(0.03);
          }
          DM.Audio.play('zap');
          DM.Audio.play('flash');
          for (let k = 0; k <= 1; k += 0.1) {
            ctx.flags.beam = k;
            yield ctx.wait(0.02);
          }
          W.camera.shake(0.8);
          yield ctx.wait(0.8);
          ctx.flash('#ffffff', 1.6);
          W.particles.burst(P.x, P.y, 200, { color: ['#7fe3ff', '#5fd4ff', '#ffffff', '#c06bff'], speed: [80, 520], life: [0.6, 1.8], size: [1.5, 4], drag: 1.4 });
          ctx.flags.beam = 0;
          R.sub.data.charge = 0.2;
          P.hidden = true;
          yield ctx.wait(1.8);
          yield ctx.dialog([['veidt', "...It's done. I am sorry, Jon. Truly."]]);
          ctx.cinematic(false);
          ctx.focus(null);
          P.hidden = false;
          yield* reassemble(ctx);
          yield ctx.wait(0.6);
          W.particles.burst(SUB.x, SUB.y, 90, { color: ['#d4ad3a', '#6f4aa6', '#2a2440', '#c06bff'], speed: [40, 300], life: [0.5, 1.4], size: [2, 5], add: false });
          R.sub.dead = true;
          DM.Audio.play('disintegrate');
          yield ctx.dialog([
            ['manhattan', 'I am disappointed in you, Adrian. Reassembling myself was the first thing I ever learned.'],
            ['veidt', "...Then I'll simply have to be faster than you, won't I?"],
          ]);
        },
        restore(ctx) {
          if (ctx.refs.sub) ctx.refs.sub.dead = true;
        },
      },
      {
        id: 'veidt',
        checkpoint: true,
        run: function* (ctx) {
          const R = ctx.refs, P = ctx.player, W = ctx.world;
          if (ctx.startedHere) ctx.place(2050, 1000, 0);
          P.targetScale = 1;
          W.camera.targetZoom = W.baseZoom;
          const n = R.veidtNpc;
          const v = ctx.add(new Veidt({ x: n.x, y: n.y, facing: Math.PI }));
          n.dead = true;
          W.boss = v;
          ctx.lock(false);
          ctx.objective('Stop Adrian Veidt');
          ctx.hint('He is fast enough to dodge you. Slow time, pin him with copies, or catch him and throw him.', 10);
          yield ctx.until(() => v.yielded);
          W.boss = null;
          ctx.objectiveDone();
          ctx.lock(true);
          for (const e of W.entities) if (e instanceof Drone) e.disintegrate(W);
          yield ctx.wait(1.2);
          yield ctx.dialog([
            ['veidt', "Enough. Enough! Jon, listen to me. It's already done. New York. Thirty-five minutes ago."],
            ['veidt', 'Half a city, so the rest of the world would stop pointing missiles at itself. Look at the broadcasts. They are shaking hands.'],
            ['manhattan', '...'],
            ['veidt', 'I did the right thing, didn\'t I? Tell me it all works out, in the end.'],
            ['manhattan', 'There is no end, Adrian. There is only the next moment.'],
          ]);
        },
      },
    ],
  });
})();
</script>

<script>/* src/main.js */
/* Boot: load save + settings, wait briefly for web fonts, start on the title screen. */
(function () {
  'use strict';
  const DM = window.DM;
  let booted = false;

  function boot() {
    if (booted) return;
    booted = true;
    const canvas = document.getElementById('game');
    DM.Save.load();
    DM.Audio.setVolumes({ music: DM.Save.settings.music, sfx: DM.Save.settings.sfx });
    DM.Input.init(canvas);
    DM.Engine.init(canvas);
    DM.Engine.set(new DM.Scenes.Title());
    const loading = document.getElementById('boot');
    if (loading) loading.remove();
    if (canvas.focus) canvas.focus({ preventScroll: true });

    // Hooks for debugging and automated tests (see tests/smoke.mjs).
    DM.dev = {
      start(chapter, stage = 0) {
        DM.Engine.set(new DM.Scenes.Play(), { chapter, stage });
      },
      play() {
        return DM.Engine.stack.find((s) => s instanceof DM.Scenes.Play) || null;
      },
      skip() {
        const p = this.play();
        if (p) p.ctx.skipStage();
      },
      state() {
        const p = this.play();
        const top = DM.Engine.top();
        return {
          scene: top && top.constructor.name,
          stack: DM.Engine.stack.map((s) => s.constructor.name),
          error: DM.Engine.error ? String(DM.Engine.error.stack || DM.Engine.error) : null,
          chapter: p && p.chapter.id,
          stage: p && p.ctx.stageIndex,
          stageId: p && p.chapter.stages[p.ctx.stageIndex] && p.chapter.stages[p.ctx.stageIndex].id,
          form: p && p.player.form,
          powers: p ? Object.keys(p.player.powers) : [],
          entities: p ? p.world.entities.length : 0,
          dialog: p ? p.dialog.active : false,
        };
      },
    };
  }

  const fonts = ['700 20px Oswald', '400 20px Oswald', '20px "Special Elite"', '20px "Patrick Hand"'];
  const ready = document.fonts && document.fonts.load ? Promise.all(fonts.map((f) => document.fonts.load(f).catch(() => null))) : Promise.resolve();
  Promise.race([ready, new Promise((r) => setTimeout(r, 2500))]).then(boot, boot);
})();
</script>
