      } else if (this.onBack && Input.pressed('back')) {
        Input.consume('back');
        Audio.play('ui_back');
        this.onBack();
      }
    }
    click(i, mx) {
      const it = this.items[i];
      if (!it || it.disabled) return;
      if (!it.adjust) return this.activate(i, 1);
      const z = this.zones(i);
      if (inside(mx, z.bar) && it.setFrac) {
        it.setFrac(Math.max(0, Math.min(1, (mx - z.bar[0]) / (z.bar[1] - z.bar[0]))));
        Audio.play('ui_move');
        return;
      }
      this.activate(i, inside(mx, z.left) ? -1 : 1);
    }
    activate(i, dir) {
      const it = this.items[i];
      if (!it || it.disabled) return;
      if (it.adjust) {
        it.adjust(dir);
        Audio.play('ui_move');
      } else if (it.action) {
        Audio.play('ui_select');
        it.action();
      }
    }
    render(ctx) {
      for (let i = 0; i < this.items.length; i++) {
        const it = this.items[i];
        const r = this.rowRect(i);
        const sel = i === this.sel && !it.disabled;
        const cy = r.y + r.h / 2 + this.size * 0.36;
        const tx = this.align === 'center' ? r.x + r.w / 2 : r.x + 34;
        if (sel) {
          ctx.fillStyle = 'rgba(95,212,255,0.08)';
          ctx.fillRect(r.x, r.y + 4, r.w, r.h - 8);
          ctx.fillStyle = this.accent;
          ctx.fillRect(r.x, r.y + 4, 3, r.h - 8);
          if (this.align !== 'center') Gfx.hydrogen(ctx, r.x + 17, r.y + r.h / 2, 7, this.accent, this.t * 3, 1.5);
        }
        const color = it.disabled ? 'rgba(160,180,200,0.3)' : sel ? '#ffffff' : 'rgba(200,225,240,0.72)';
        Gfx.text(ctx, it.label, tx, cy, { size: this.size, color, align: this.align === 'center' ? 'center' : 'left', spacing: 2, weight: sel ? 600 : 400 });
        if (!it.value) continue;
        const v = it.value();
        const vs = this.size * 0.8;
        const vcol = sel ? this.accent : 'rgba(200,225,240,0.6)';
        if (!it.adjust) {
          Gfx.text(ctx, v, r.x + r.w - 16, cy, { size: vs, color: vcol, align: 'right', spacing: 1 });
          continue;
        }
        const z = this.zones(i);
        const gcol = sel ? this.accent : 'rgba(200,225,240,0.35)';
        Gfx.text(ctx, '‹', z.left[1] - 6, cy, { size: vs, color: gcol, align: 'right' });
        Gfx.text(ctx, '›', z.right[0] + 6, cy, { size: vs, color: gcol });
        Gfx.text(ctx, v, (z.value[0] + z.value[1]) / 2, cy, { size: vs, color: vcol, align: 'center', spacing: 1 });
        if (z.bar) Gfx.bar(ctx, z.bar[0], r.y + r.h / 2 - 3, z.bar[1] - z.bar[0], 6, it.frac(), sel ? this.accent : 'rgba(200,225,240,0.45)', { segments: 10 });
      }
    }
  }

  DM.UI = { Menu };
})();
</script>
<script>/* src/game/ui/dialog.js */
/*
 * Dialogue box with portraits and a typewriter reveal.
 * Lines: 'plain narration' | ['speaker', 'text'] | ['speaker', 'text', { name: 'Override' }]
 * Speakers are keys of DM.LOOKS. Dr. Manhattan's lines get his blue box.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const Gfx = DM.Gfx;
  const Input = DM.Input;
  const Audio = DM.Audio;
  const Schema = DM.SettingsSchema;
  const F = DM.FONTS;

  // Holding advance this long fast-forwards: whole lines, one every FF_STEP seconds.
  const FF_HOLD = 0.45;
  const FF_STEP = 0.08;

  class Dialog {
    constructor() {
      this.active = false;
      this.lines = [];
      this.i = 0;
      this.chars = 0;
      this.t = 0;
      this.holdT = 0;
      this.ffT = 0;
      this.armed = false;
    }
    normalize(l) {
      if (typeof l === 'string') return { who: null, text: l };
      if (Array.isArray(l)) return Object.assign({ who: l[0], text: l[1] }, l[2] || {});
      return l;
    }
    // Characters shown when a line starts: all of them at TEXT SPEED INSTANT.
    startChars() {
      return Schema.textCPS() === Infinity && this.line ? this.line.text.length : 0;
    }
    open(lines) {
      this.lines = lines.map((l) => this.normalize(l));
      this.i = 0;
      this.t = 0;
      this.cool = 0.2;
      this.holdT = 0;
      this.armed = false; // a key still held from whatever opened this must be let go first
      this.active = this.lines.length > 0;
      this.chars = this.startChars();
    }
    close() {
      this.active = false;
    }
    get line() {
      return this.lines[this.i];
    }
    advance() {
      this.i++;
      this.cool = 0.12;
      if (this.i >= this.lines.length) this.active = false;
      else {
        this.chars = this.startChars();
        Audio.play('ui_move');
      }
    }
    update(dt) {
      if (!this.active) return;
      this.t += dt;
      this.cool -= dt;
      const line = this.line;
      const prev = Math.floor(this.chars);
      this.chars = Math.min(line.text.length, this.chars + dt * Schema.textCPS());
      const now = Math.floor(this.chars);
      if (now > prev && now < line.text.length && now % 2 === 0 && line.text[now] !== ' ') Audio.play('type');

      const held = Input.down('confirm') || Input.down('interact');
      if (!held) this.armed = true;
      this.holdT = held && this.armed ? this.holdT + dt : 0;
      if (this.holdT >= FF_HOLD) {
        Input.consume('confirm');
        Input.consume('interact');
        this.chars = line.text.length;
        this.ffT -= dt;
        if (this.ffT <= 0) {
          this.ffT = FF_STEP;
          this.advance();
        }
        return;
      }
      this.ffT = FF_STEP;

      const go = Input.pressed('confirm') || Input.pressed('interact');
      if (this.cool <= 0 && go) {
        Input.consume('confirm');
        Input.consume('interact');
        Input.consume('teleport');
        Input.consume('telekinesis');
        if (this.chars < line.text.length) this.chars = line.text.length;
        else this.advance();
      }
    }
    render(ctx) {
      if (!this.active) return;
      const line = this.line;
      const look = line.who ? DM.LOOKS[line.who] : null;
      const x = 150, y = 528, w = DM.W - 300, h = 150;
      const done = this.chars >= line.text.length;

      if (!look) {
        Gfx.caption(ctx, line.text, DM.W / 2, y + 20, w - 120, { chars: this.chars, size: 19 });
      } else {
        const mh = look.manhattan;
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(x + 6, y + 6, w, h);
        ctx.fillStyle = mh ? '#0d2a44' : '#fbf8ef';
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = mh ? '#7fe3ff' : DM.C.ink;
        ctx.lineWidth = 2.5;
        ctx.strokeRect(x, y, w, h);
        Gfx.portrait(ctx, x + 18, y + 18, h - 36, look, this.t, !done);
        const name = line.name || look.name;
        const tx = x + h + 6;
        Gfx.text(ctx, name.toUpperCase(), tx, y + 34, { size: 15, color: mh ? '#7fe3ff' : '#8a3b22', spacing: 2, weight: 600 });
        Gfx.paragraph(ctx, line.text, tx, y + 46, w - h - 40, 29, { size: 23, font: F.hand, color: mh ? '#d8f6ff' : DM.C.ink, chars: this.chars });
      }
      if (done && Math.sin(this.t * 6) > -0.3) {
        Gfx.text(ctx, '▼', x + w - 22, y + h - 14, { size: 14, color: look && look.manhattan ? '#7fe3ff' : '#8a3b22', align: 'center' });
      }
      Gfx.text(ctx, 'E / SPACE / CLICK   ·   HOLD TO FAST-FORWARD', x + w, y + h + 22, { size: 13, color: 'rgba(200,225,240,0.7)', align: 'right', spacing: 2 });
    }
  }

  DM.Dialog = Dialog;
})();
</script>
<script>/* src/game/ui/hud.js */
/*
 * HUD: objective, captions, banners, hints, power slots, meters, boss bar,
 * countdowns, objective markers, interaction prompts, flashes and fades.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Input = DM.Input;
  const Schema = DM.SettingsSchema;
  const F = DM.FONTS;

  // Soft dark backing so HUD text stays readable on bright maps (snow, desert).
  function backing(ctx, x, y, w, h) {
    ctx.fillStyle = 'rgba(4,8,16,0.5)';
    Gfx.rr(ctx, x, y, w, h, 4);
    ctx.fill();
  }
  const THREAT_LOST = 0.5; // seconds with no enemy in view before grey chevrons point to them all

  // Edge-indicator arrowhead pointing along +x (stroked, then filled).
  function chevron(ctx, s) {
    ctx.beginPath();
    ctx.moveTo(s, 0);
    ctx.lineTo(-s * 0.55, -s * 0.8);
    ctx.lineTo(-s * 0.15, 0);
    ctx.lineTo(-s * 0.55, s * 0.8);
    ctx.closePath();
    ctx.stroke();
    ctx.fill();
  }

  class HUD {
    constructor(scene) {
      this.scene = scene;
      this.objective = null;
      this.captions = [];
      this.banners = [];
      this.toasts = [];
      this.hintMsg = null;
      this.lastHint = null; // { text, essential, chapter, stage }: what H and the Pause screen recall
      this.flashA = 0;
      this.flashPeak = 1;
      this.flashColor = '#fff';
      this.flashDur = 0.6;
      this.cinematic = false;
      this.cineK = 0;
      this.countdownState = null;
      this.marker = null;
      this.t = 0;
    }

    // ---- API used by chapter scripts ----------------------------------------
    setObjective(text, progress) {
      if (!text) {
        this.objective = null;
        return;
      }
      this.objective = { text, progress: progress || null, t: 0, idleT: 0, nudged: false, done: false };
      DM.Audio.play('objective');
    }
    completeObjective() {
      if (this.objective && !this.objective.done) {
        const o = this.objective;
        if (o.progress) {
          const v = o.progress();
          o.progress = () => v;
        }
        this.objective.done = true;
        this.objective.doneT = 0;
        DM.Audio.play('success');
      }
    }
    // Narration. TEXT SPEED sets the typewriter rate; SLOW also leaves it up longer.
    caption(text, o = {}) {
      const dur = (o.dur || 2.6 + text.length * 0.05) * Schema.readTime();
      const c = { text, t: 0, dur, chars: 0, style: o.style || 'jon', gone: false, skippable: false };
      this.captions.push(c);
      return c;
    }
    banner(title, sub, o = {}) {
      const b = { title, sub, t: 0, dur: o.dur || 3.2, color: o.color || DM.C.blue, gone: false };
      this.banners.push(b);
      return b;
    }
    // Tips respect the HINTS setting; essential ones (ctx.tutorial) always show.
    // Either way the latest is kept, so H and the Pause screen can bring it back.
    // hint(null) clears both.
    hint(text, dur = 7, o = {}) {
      if (!text) {
        this.hintMsg = null;
        this.lastHint = null;
        return;
      }
      const sc = this.scene;
      this.lastHint = { text, essential: !!o.essential, chapter: sc && sc.chapter ? sc.chapter.id : null, stage: sc && sc.ctx ? sc.ctx.stageIndex : 0 };
      if (!o.essential && !Schema.hintsAll()) return;
      this.hintMsg = { text, t: 0, dur };
    }
    recallHint(dur = 6) {
      if (!this.lastHint) return false;
      this.hintMsg = { text: this.lastHint.text, t: 0, dur };
      return true;
    }
    toast(text, color) {
      this.toasts.push({ text, color: color || DM.C.yellow, t: 0 });
    }
    // Full-screen flash. With FLASHING LIGHTS on REDUCED it peaks at a quarter
    // strength and fades 1.5x slower, and strobes ({ strobe: true }) are dropped.
    flash(color, dur, o = {}) {
      const reduced = Schema.reducedFlashing();
      if (reduced && o.strobe) return;
      this.flashColor = color;
      this.flashDur = dur * (reduced ? 1.5 : 1);
      this.flashPeak = Schema.flashCap();
      this.flashA = 1;
    }
    get flashAlpha() {
      return this.flashA * this.flashPeak;
    }
    startCountdown(seconds, label) {
      this.countdownState = { left: seconds, total: seconds, label: label || '' };
      return this.countdownState;
    }
    clearTransient() {
      this.captions = [];
      this.banners = [];
      this.hintMsg = null;
      this.countdownState = null;
      this.cinematic = false;
    }

    // Objective, hints and power slots are hidden during dialogue and letterboxed cutscenes.
    gameHudVisible() {
      const d = this.scene.dialog;
      return this.cineK < 0.5 && !(d && d.active);
    }
    // Narration can be hurried along only while the player is held for a cutscene.
    captionSkippable() {
      const sc = this.scene;
      return !!(sc.ctx && sc.ctx.locked && !(sc.dialog && sc.dialog.active));
    }

    update(dt) {
      this.t += dt;
      const shown = this.gameHudVisible();
      const p = this.scene.player;
      const o = this.objective;
      if (o) {
        o.t += dt;
        if (o.done) {
          o.doneT += dt;
          if (o.doneT > 2.2) this.objective = null;
        } else if (shown && p && !p.locked) o.idleT += dt;
      }
      this.updateCaption(dt);
      if (this.banners.length) {
        const b = this.banners[0];
        b.t += dt;
        if (b.t >= b.dur) {
          b.gone = true;
          this.banners.shift();
        }
      }
      // A hint's clock only runs while it can be seen, so dialogue never eats it.
      if (this.hintMsg && shown) {
        this.hintMsg.t += dt;
        if (this.hintMsg.t > this.hintMsg.dur) this.hintMsg = null;
      }
      if (shown && Input.pressed('hint')) {
        Input.consume('hint');
        if (!this.recallHint()) this.toast('NO FIELD NOTES YET', '#bff1ff');
      }
      // Stuck: the same objective for 45 s of free play brings the last tip back, once.
      if (o && !o.done && !o.nudged && o.idleT >= 45 && !this.hintMsg) {
        const h = this.lastHint;
        const ch = this.scene.chapter;
        if (h && ch && h.chapter === ch.id && (h.essential || Schema.hintsAll())) {
          o.nudged = true;
          this.recallHint(8);
        }
      }
      for (const t of this.toasts) t.t += dt;
      this.toasts = this.toasts.filter((t) => t.t < 2.6);
      this.flashA = Math.max(0, this.flashA - dt / this.flashDur);
      this.cineK = U.damp(this.cineK, this.cinematic ? 1 : 0, 6, dt);
      if (this.countdownState && this.countdownState.left > 0) {
        const before = Math.ceil(this.countdownState.left);
        this.countdownState.left -= dt;
        const after = Math.ceil(this.countdownState.left);
        if (after !== before && after >= 0) DM.Audio.play('tick', { alt: after % 2 });
      }
    }

    updateCaption(dt) {
      const c = this.captions[0];
      if (!c) return;
      c.t += dt;
      c.chars += dt * Schema.textCPS();
      if (c.t > c.dur - 1) c.chars = Infinity; // always fully legible before it fades
      // In a cutscene the first press finishes the line and the second moves on.
      c.skippable = this.captionSkippable();
      if (c.skippable && c.t > 0.15 && Input.pressed('confirm')) {
        for (const a of ['confirm', 'interact', 'teleport', 'telekinesis']) Input.consume(a);
        if (c.chars < c.text.length) c.chars = Infinity;
        else c.t = Math.max(c.t, c.dur - 0.3);
      }
      if (c.t >= c.dur) {
        c.gone = true;
        this.captions.shift();
      }
    }

    // ---- rendering -------------------------------------------------------------
    render(ctx) {
      const scene = this.scene;
      const p = scene.player;
      const world = scene.world;
      const showGameHud = this.cineK < 0.5 && !(scene.dialog && scene.dialog.active);

      if (p && world) this.renderPrompt(ctx, p, world);
      if (this.marker && world) this.renderMarker(ctx, world);
      if (world) this.renderThreats(ctx, world);

      if (this.cineK > 0.01) {
        const bh = 70 * this.cineK;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, DM.W, bh);
        ctx.fillRect(0, DM.H - bh, DM.W, bh);
      }

      if (showGameHud) {
        this.renderTopLeft(ctx);
        if (p) {
          this.renderTopRight(ctx, p);
          this.renderPowers(ctx, p);
        }
        if (world && world.boss && !world.boss.dead) this.renderBoss(ctx, world.boss);
      }
      this.renderCountdown(ctx);
      this.renderCaption(ctx);
      this.renderBanner(ctx);
      this.renderHint(ctx, showGameHud);
      this.renderToasts(ctx);

      if (this.flashAlpha > 0) {
        ctx.globalAlpha = this.flashAlpha;
        ctx.fillStyle = this.flashColor;
        ctx.fillRect(0, 0, DM.W, DM.H);
        ctx.globalAlpha = 1;
      }
    }

    renderTopLeft(ctx) {
      const ch = this.scene.chapter;
      if (!ch) return;
      const label = `${ch.numeral}  ·  ${ch.date.toUpperCase()}  ·  ${ch.place.toUpperCase()}`;
      backing(ctx, 18, 18, Gfx.measure(ctx, label, { size: 13, spacing: 2 }) + 20, 26);
      Gfx.text(ctx, label, 28, 36, { size: 13, color: 'rgba(200,225,240,0.75)', spacing: 2, shadow: 'rgba(0,0,0,0.6)' });
      const o = this.objective;
      if (!o) return;
      const a = o.done ? Math.max(0, 1 - Math.max(0, o.doneT - 1.4) / 0.8) : Math.min(1, o.t * 4);
      ctx.save();
      ctx.globalAlpha = a;
      const prog = o.progress ? o.progress() : null;
      const text = o.text + (prog != null && prog !== '' ? `  ${prog}` : '');
      const w = Math.max(260, Gfx.measure(ctx, text, { size: 19, weight: 400 }) + 60);
      Gfx.panel(ctx, 20, 48, w, 52, { accent: o.done ? 'rgba(123,216,143,0.8)' : 'rgba(242,196,24,0.7)' });
      Gfx.text(ctx, o.done ? 'OBJECTIVE COMPLETE' : 'OBJECTIVE', 36, 66, { size: 11, color: o.done ? DM.C.green : DM.C.yellow, spacing: 3, weight: 600 });
      Gfx.text(ctx, text, 36, 89, { size: 19, color: o.done ? 'rgba(200,225,240,0.6)' : '#ffffff' });
      if (o.done) {
        ctx.strokeStyle = 'rgba(123,216,143,0.8)';
        ctx.lineWidth = 2;
        const tw = Gfx.measure(ctx, text, { size: 19 });
        Gfx.line(ctx, 36, 83, 36 + tw * Math.min(1, o.doneT * 3), 83);
      }
      ctx.restore();
    }

    renderTopRight(ctx, p) {
      const ch = this.scene.chapter;
      const x = DM.W - 28;
      if (p.form !== 'human') backing(ctx, x - 48 - 220 - 12, 16, 220 + 24, 42);
      if (ch) Gfx.clock(ctx, x - 18, 40, 18, ch.clock, { blood: true });
      if (p.form === 'manhattan') {
        const w = 220;
        const bx = x - 48 - w;
        Gfx.text(ctx, 'COHERENCE', bx, 33, { size: 11, color: 'rgba(200,225,240,0.75)', spacing: 3 });
        const frac = p.coherence / p.maxCoherence;
        const col = frac < 0.35 ? (Math.sin(this.t * 10) > 0 ? '#ff5a4a' : '#ff9a8a') : '#bff1ff';
        Gfx.bar(ctx, bx, 40, w, 9, frac, col, { segments: 10 });
      } else if (p.form === 'awareness') {
        const w = 220;
        const bx = x - 48 - w;
        Gfx.text(ctx, 'GATHERED ATOMS', bx, 33, { size: 11, color: 'rgba(200,225,240,0.75)', spacing: 3 });
        Gfx.text(ctx, `${p.carry} / ${p.carryMax}`, bx + w, 33, { size: 12, color: p.carry >= p.carryMax ? DM.C.yellow : '#bff1ff', align: 'right', spacing: 1 });
        Gfx.bar(ctx, bx, 40, w, 9, p.carry / p.carryMax, p.carry >= p.carryMax ? DM.C.yellow : '#7fe3ff', { segments: 5 });
      }
    }

    renderPowers(ctx, p) {
      const defs = DM.Powers.list.filter((d) => p.powers[d.id] && d.forms.includes(p.form));
      if (!defs.length) return;
      const size = 58, gap = 10;
      const total = defs.length * size + (defs.length - 1) * gap;
      const x0 = DM.W / 2 - total / 2;
      const y0 = DM.H - size - 26;
      const bw = Math.max(total, 300);
      const eLow = p.noEnergyT > 0;
      backing(ctx, DM.W / 2 - bw / 2 - 12, y0 - 34, bw + 24, size + 46);
      Gfx.text(ctx, 'INTRINSIC FIELD', DM.W / 2 - bw / 2, y0 - 16, { size: 10, color: eLow ? '#ff5a4a' : 'rgba(200,225,240,0.65)', spacing: 3 });
      Gfx.bar(ctx, DM.W / 2 - bw / 2, y0 - 11, bw, 5, p.energy / p.maxEnergy, eLow ? '#ff5a4a' : '#5fd4ff');
      defs.forEach((d, i) => {
        const st = p.powers[d.id];
        const x = x0 + i * (size + gap);
        const ready = st.cd <= 0 && p.energy >= d.cost && !(d.id === 'timesight' && p.jammed);
        const active = st.active || (d.id === 'telekinesis' && st.target) || (d.id === 'expand' && p.expandT > 0);
        ctx.fillStyle = active ? 'rgba(95,212,255,0.25)' : 'rgba(6,12,22,0.8)';
        ctx.fillRect(x, y0, size, size);
        ctx.strokeStyle = active ? d.color : ready ? 'rgba(160,210,240,0.35)' : 'rgba(160,210,240,0.12)';
        ctx.lineWidth = active ? 2 : 1;
        ctx.strokeRect(x + 0.5, y0 + 0.5, size - 1, size - 1);
        Gfx.icon(ctx, d.id, x + size / 2, y0 + size / 2 - 5, 30, ready || active ? d.color : 'rgba(150,170,190,0.4)', this.t);
        if (st.cd > 0 && d.cooldown > 0) {
          const k = st.cd / d.cooldown;
          ctx.fillStyle = 'rgba(0,0,0,0.55)';
          ctx.fillRect(x, y0 + size * (1 - k), size, size * k);
        }
        if (active) Gfx.glow(ctx, x + size / 2, y0 + size / 2, size * 0.9, d.color, 0.25);
        Gfx.text(ctx, Input.short[d.action] || '', x + size / 2, y0 + size - 6, { size: 11, color: 'rgba(230,245,255,0.85)', align: 'center', spacing: 1, weight: 600 });
      });
      if (p.jammed) Gfx.text(ctx, 'TACHYON INTERFERENCE', DM.W / 2 + bw / 2, y0 - 16, { size: 11, color: '#d9a6ff', align: 'right', spacing: 3 });
    }

    renderBoss(ctx, boss) {
      const w = 460;
      const x = DM.W / 2 - w / 2, y = 30;
      backing(ctx, x - 12, 8, w + 24, 38);
      Gfx.text(ctx, boss.name || 'TARGET', DM.W / 2, y - 6, { size: 13, color: '#ffd9a0', align: 'center', spacing: 4, weight: 600 });
      const frac = Math.max(0, boss.hp) / boss.maxHp;
      Gfx.bar(ctx, x, y, w, 8, frac, '#ff9a3c', { segments: 20 });
      // Phase notches: a tick above and below the bar where the fight changes.
      for (const m of boss.phaseMarks || []) {
        const nx = Math.round(x + w * m) + 0.5;
        ctx.strokeStyle = frac > m ? '#fff2c4' : 'rgba(255,242,196,0.4)';
        ctx.lineWidth = 2;
        Gfx.line(ctx, nx, y - 3, nx, y + 11);
      }
    }

    // ---- threat awareness ------------------------------------------------------
    // Edge indicators for danger Jon cannot see: a red chevron for each offscreen
    // enemy that is winding up an attack and for each hostile missile, an orange
    // triangle for each shell coming down near him (plus its impact ring), and,
    // once the fight thins out or has wandered offscreen, grey chevrons pointing
    // to every enemy still in it. Hidden during cutscenes. Returns how many
    // indicators it drew (this.threats lists them).
    renderThreats(ctx, world) {
      const list = (this.threats = []);
      const p = world.player;
      const live = [];
      let anyOn = false, remaining = 0;
      if (this.threatSeenT == null) this.threatSeenT = this.t; // last time an enemy was on screen
      if (!p || world.ceasefire || !this.gameHudVisible()) {
        this.threatSeenT = this.t;
        this.threatsDrawn = 0;
        return 0;
      }
      const cam = world.camera;
      const v = cam.view();
      const inView = (x, y, m = 0) => x > v.x0 - m && x < v.x1 + m && y > v.y0 - m && y < v.y1 + m;
      const Proj = DM.Proj;
      for (const e of world.entities) {
        if (e.dead || e.team !== 'enemy') continue;
        if (e.isProjectile) {
          if (e instanceof Proj.Missile && !e.heldBy && !inView(e.x, e.y)) list.push({ kind: 'missile', x: e.x, y: e.y, k: 1 });
          else if (e instanceof Proj.Shell && U.dist(e.tx, e.ty, p.x, p.y) < 140) {
            const m = e.r + 120; // the world only draws a shell near the view
            list.push({ kind: 'shell', x: e.x, y: e.y, tx: e.tx, ty: e.ty, r: e.radius, k: Math.min(1, e.t / e.T), off: !inView(e.x, e.y), culled: !inView(e.x, e.y, m) });
          }
          continue;
        }
        if (!e.active || e.hp == null || e.yielded) continue;
        if (!e.alerted && world.boss !== e) continue;
        remaining++;
        if (inView(e.x, e.y)) {
          anyOn = true;
          continue;
        }
        const aiming = e.aim > 0 || e.burst > 0 || e.mgShots > 0;
        if (aiming) list.push({ kind: 'aim', x: e.x, y: e.y, k: e.aim > 0 && e.aimTime ? 1 - e.aim / e.aimTime : 1 });
        else live.push(e);
      }
      // 'Last enemies': with three or fewer left, or none in view for a moment, point to them all.
      if (anyOn || !remaining) this.threatSeenT = this.t;
      if (remaining && (remaining <= 3 || this.t - this.threatSeenT >= THREAT_LOST)) for (const e of live) list.push({ kind: 'last', x: e.x, y: e.y, k: 0 });

      const cx = DM.W / 2, cy = DM.H / 2;
      const pad = 34, top = pad + 50, bottom = DM.H - pad - 90;
      let drawn = 0;
      for (const th of list) {
        if (th.kind === 'shell') {
          // Its ring at the impact point, in case the shell itself is too far off to be drawn.
          if (th.culled) {
            const s = cam.toScreen(th.tx, th.ty);
            ctx.save();
            ctx.strokeStyle = `rgba(255,80,60,${0.3 + th.k * 0.55})`;
            ctx.fillStyle = `rgba(255,80,60,${0.05 + th.k * 0.12})`;
            ctx.lineWidth = 2;
            Gfx.circle(ctx, s.x, s.y, th.r * cam.zoom);
            ctx.fill();
            ctx.stroke();
            Gfx.circle(ctx, s.x, s.y, th.r * cam.zoom * th.k);
            ctx.stroke();
            ctx.restore();
          }
          if (!th.off) continue;
        }
        const s = cam.toScreen(th.x, th.y);
        const dx = s.x - cx, dy = s.y - cy;
        // Where the ray from the screen centre leaves the inset frame.
        const tx = dx > 0 ? (DM.W - pad - cx) / dx : dx < 0 ? (pad - cx) / dx : Infinity;
        const ty = dy > 0 ? (bottom - cy) / dy : dy < 0 ? (top - cy) / dy : Infinity;
        const f = Math.min(tx, ty, 1);
        const ex = cx + dx * f, ey = cy + dy * f;
        th.sx = ex;
        th.sy = ey;
        const a = Math.atan2(dy, dx);
        const dist = U.dist(p.x, p.y, th.x, th.y);
        const near = U.clamp(1 - dist / 1200, 0.45, 1);
        ctx.save();
        ctx.translate(ex, ey);
        ctx.rotate(a);
        if (th.kind === 'last') {
          ctx.globalAlpha = 0.55 * Math.max(0.6, near);
          ctx.fillStyle = '#c8ccd2';
          ctx.strokeStyle = 'rgba(0,0,0,0.5)';
          ctx.lineWidth = 1.5;
          chevron(ctx, 8);
        } else if (th.kind === 'shell') {
          ctx.globalAlpha = near * (0.7 + Math.sin(this.t * 14) * 0.3);
          ctx.fillStyle = '#ff9a3c';
          ctx.strokeStyle = 'rgba(40,10,0,0.7)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(13, 0);
          ctx.lineTo(-7, -11);
          ctx.lineTo(-7, 11);
          ctx.closePath();
          ctx.stroke();
          ctx.fill();
        } else {
          // Pulses faster as the wind-up nears its end.
          const rate = 6 + th.k * 18;
          ctx.globalAlpha = near * (0.65 + Math.sin(this.t * rate) * 0.35);
          ctx.fillStyle = '#ff3a2a';
          ctx.strokeStyle = 'rgba(40,0,0,0.7)';
          ctx.lineWidth = 2;
          chevron(ctx, 13 + th.k * 3);
        }
        ctx.restore();
        drawn++;
      }
      this.threatsDrawn = drawn;
      return drawn;
    }

    renderCountdown(ctx) {
      const c = this.countdownState;
      if (!c || c.left <= -1) return;
      const s = Math.max(0, c.left);
      const str = `00:${String(Math.ceil(s)).padStart(2, '0')}`;
      const pulse = 1 + (1 - (s % 1)) * 0.06;
      ctx.save();
      ctx.translate(DM.W / 2, 92);
      ctx.scale(pulse, pulse);
      Gfx.text(ctx, str, 0, 0, { size: 56, color: s < 4 ? '#ff5a4a' : '#ffffff', align: 'center', weight: 700, spacing: 4, shadow: 'rgba(0,0,0,0.6)', font: F.display });
      ctx.restore();
      if (c.label) Gfx.text(ctx, c.label, DM.W / 2, 118, { size: 13, color: 'rgba(255,200,190,0.85)', align: 'center', spacing: 4 });
    }

    renderCaption(ctx) {
      const c = this.captions[0];
      if (!c) return;
      const a = Math.min(1, c.t * 3, (c.dur - c.t) * 2.5);
      if (a <= 0) return;
      const y = this.cineK > 0.5 ? 92 : 122;
      const style = c.style === 'paper' ? {} : { bg: '#dff2ff', border: '#0d2a44', color: '#0d2a44' };
      const h = Gfx.caption(ctx, c.text, DM.W / 2, y, 620, Object.assign({ alpha: a, chars: c.chars, size: 18 }, style));
      // A ▸ tab under the caption's corner: this one can be hurried along.
      if (c.skippable && c.t > 0.8) {
        ctx.font = Gfx.font(18, F.type);
        let w = 0;
        for (const l of Gfx.wrap(ctx, c.text, 620 - 28)) w = Math.max(w, ctx.measureText(l).width);
        const tx = DM.W / 2 + (w + 28) / 2 - 34, ty = y + h - 1;
        ctx.save();
        ctx.globalAlpha *= a;
        ctx.fillStyle = style.bg || DM.C.paper;
        ctx.strokeStyle = style.border || DM.C.ink;
        ctx.lineWidth = 2;
        ctx.fillRect(tx, ty, 30, 17);
        ctx.strokeRect(tx, ty, 30, 17);
        Gfx.text(ctx, '▸', tx + 15, ty + 13, { size: 14, color: style.border || DM.C.ink, align: 'center', alpha: 0.65 + Math.sin(this.t * 5) * 0.35 });
        ctx.restore();
      }
    }

    renderBanner(ctx) {
      const b = this.banners[0];
      if (!b) return;
      const a = Math.min(1, b.t * 2, (b.dur - b.t) * 2);
      ctx.save();
      ctx.globalAlpha = a;
      const y = DM.H / 2 - 30;
      const w = 520 + Math.min(1, b.t * 2) * 200;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(DM.W / 2 - w / 2, y - 62, w, b.sub ? 104 : 80);
      ctx.fillStyle = b.color;
      ctx.fillRect(DM.W / 2 - w / 2, y - 62, w, 2);
      ctx.fillRect(DM.W / 2 - w / 2, y + (b.sub ? 40 : 16), w, 2);
      Gfx.text(ctx, b.title, DM.W / 2, y, { size: 50, color: '#ffffff', align: 'center', weight: 700, spacing: 8 });
      if (b.sub) Gfx.text(ctx, b.sub, DM.W / 2, y + 28, { size: 16, color: b.color, align: 'center', spacing: 5 });
      ctx.restore();
    }

    renderHint(ctx, show) {
      const h = this.hintMsg;
      if (!h || !show) return;
      const a = Math.min(1, h.t * 3, (h.dur - h.t) * 2);
      const y = DM.H - 146;
      const w = Gfx.measure(ctx, h.text, { size: 17 }) + 40;
      ctx.save();
      ctx.globalAlpha = a;
      Gfx.panel(ctx, DM.W / 2 - w / 2, y - 22, w, 34, { accent: 'rgba(242,196,24,0.6)' });
      Gfx.text(ctx, h.text, DM.W / 2, y + 1, { size: 17, color: '#fff6d0', align: 'center' });
      ctx.restore();
    }

    renderToasts(ctx) {
      this.toasts.forEach((t, i) => {
        const a = Math.min(1, t.t * 4, (2.6 - t.t) * 2);
        Gfx.text(ctx, t.text, DM.W - 28, 96 + i * 26 - Math.min(10, t.t * 20), { size: 16, color: t.color, align: 'right', spacing: 2, alpha: a, shadow: 'rgba(0,0,0,0.6)' });
      });
    }

    renderPrompt(ctx, p, world) {
      const e = p.interactTarget;
      if (!e || (this.scene.dialog && this.scene.dialog.active)) return;
      const s = world.camera.toScreen(e.x, e.y - e.r - 30);
      const text = e.interact.label;
      const w = Gfx.measure(ctx, text, { size: 15 }) + 44;
      const y = s.y + Math.sin(this.t * 4) * 2;
      Gfx.panel(ctx, s.x - w / 2, y - 16, w, 28, { accent: 'rgba(242,196,24,0.8)' });
      ctx.fillStyle = DM.C.yellow;
      ctx.fillRect(s.x - w / 2 + 6, y - 11, 18, 18);
      Gfx.text(ctx, 'E', s.x - w / 2 + 15, y + 3, { size: 13, color: DM.C.ink, align: 'center', weight: 700 });
      Gfx.text(ctx, text, s.x - w / 2 + 32, y + 4, { size: 15, color: '#ffffff' });
    }

    renderMarker(ctx, world) {
      const m = this.marker;
      const s = world.camera.toScreen(m.x, m.y);
      const pad = 40;
      const on = s.x > pad && s.x < DM.W - pad && s.y > pad && s.y < DM.H - pad;
      if (on) {
        const y = s.y - 36 + Math.sin(this.t * 4) * 5;
        ctx.fillStyle = DM.C.yellow;
        ctx.beginPath();
        ctx.moveTo(s.x, y + 10);
        ctx.lineTo(s.x - 8, y);
        ctx.lineTo(s.x + 8, y);
        ctx.closePath();
        ctx.fill();
        if (m.label) Gfx.text(ctx, m.label, s.x, y - 8, { size: 12, color: DM.C.yellow, align: 'center', spacing: 2, shadow: 'rgba(0,0,0,0.7)' });
        return;
      }
      const cx = DM.W / 2, cy = DM.H / 2;
      const a = Math.atan2(s.y - cy, s.x - cx);
      const ex = U.clamp(cx + Math.cos(a) * 2000, pad, DM.W - pad), ey = U.clamp(cy + Math.sin(a) * 2000, pad + 50, DM.H - pad - 90);
      ctx.save();
      ctx.translate(ex, ey);
      ctx.rotate(a);
      ctx.fillStyle = DM.C.yellow;
      ctx.beginPath();
      ctx.moveTo(14, 0);
      ctx.lineTo(-6, -9);
      ctx.lineTo(-2, 0);
      ctx.lineTo(-6, 9);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  DM.HUD = HUD;
})();
</script>
<script>/* src/game/ui/feedback.js */
/*
 * Feedback: screen-space combat feedback. The Play scene calls
 * DM.Feedback.render(ctx, scene) once a frame, after the world and Temporal
 * Sight and before the vignette and HUD.
 *
 *   - Hit arcs: a red arc on a ring around Jon pointing at whatever hit him,
 *     plus a red flash at the screen edges (from player.hurtDirs / hurtFlash).
 *   - Decoherence: while the scene has failed, the colour drains out.
 *   - The tally: SPARED n · GONE n under the objective, whenever the chapter
 *     has people in it; the number that just changed pulses.
 *
 * It also plays the reassembly when a retry begins ('play:begin', retry).
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;

  const tallies = new WeakMap(); // scene -> tally state
  let edge = null;

  // Red edges, clear centre: drawn once at low resolution, stretched to fit.
  function edgeSprite() {
    if (edge) return edge;
    edge = document.createElement('canvas');
    edge.width = 256;
    edge.height = 144;
    const g = edge.getContext('2d');
    const grad = g.createRadialGradient(128, 72, 40, 128, 72, 150);
    grad.addColorStop(0, 'rgba(255,40,30,0)');
    grad.addColorStop(0.55, 'rgba(255,40,30,0.35)');
    grad.addColorStop(1, 'rgba(255,40,30,1)');
    g.fillStyle = grad;
    g.fillRect(0, 0, 256, 144);
    return edge;
  }

  // A person the ledger counts (Veidt and other bosses keep their own rules).
  function countable(e, world) {
    return e.human && e.team === 'enemy' && e instanceof DM.Enemies.Enemy && e !== world.boss && !('yielded' in e);
  }

  const Feedback = {
    render(ctx, scene) {
      const w = scene.world, p = scene.player;
      if (!w || !p) return;
      if (scene.failed) this.renderDecoherence(ctx, scene);
      else this.renderHurt(ctx, w, p);
      this.renderTally(ctx, scene);
    },

    renderHurt(ctx, w, p) {
      const now = w.realTime || 0;
      if (p.hurtDirs && p.hurtDirs.length && !p.hidden) {
        const s = w.camera.toScreen(p.x, p.y);
        const R = 70 * Math.max(1, w.camera.zoom * p.scale * 0.8);
        ctx.save();
        ctx.lineCap = 'round';
        for (const h of p.hurtDirs) {
          const left = h.t - (now - h.at);
          if (left <= 0) continue;
          const a = (left / 0.7) * Math.min(1, h.amt / 12);
          if (a < 0.02) continue;
          ctx.globalAlpha = a;
          ctx.strokeStyle = 'rgba(120,0,0,0.6)';
          ctx.lineWidth = 8;
          ctx.beginPath();
          ctx.arc(s.x, s.y, R, h.angle - 0.35, h.angle + 0.35);
          ctx.stroke();
          ctx.strokeStyle = '#ff4a3a';
          ctx.lineWidth = 4;
          ctx.stroke();
          ctx.strokeStyle = '#ffd0c0';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(s.x, s.y, R, h.angle - 0.12, h.angle + 0.12);
          ctx.stroke();
        }
        ctx.restore();
      }
      // FLASHING LIGHTS: REDUCED keeps it under the full-screen flash cap and
      // lets it fade half as long again (as HUD.flash does).
      const f = p.hurtFlash;
      if (f) {
        const S = DM.SettingsSchema;
        const reduced = !!(S && S.reducedFlashing && S.reducedFlashing());
        const cap = Math.min(0.35, S && S.flashCap ? S.flashCap() * 0.6 : 0.35);
        const dur = reduced ? 0.3 : 0.2;
        const age = now - f.at;
        if (age >= 0 && age < dur) {
          ctx.save();
          ctx.globalAlpha = Math.min(cap, f.amt / 40) * (1 - age / dur);
          ctx.drawImage(edgeSprite(), 0, 0, DM.W, DM.H);
          ctx.restore();
        }
      }
    },

    // The colour drains while Jon is coming apart (failT runs 1.8 -> 0).
    renderDecoherence(ctx, scene) {
      const k = U.clamp((1.8 - (scene.failT == null ? 0 : scene.failT)) / 0.7, 0, 1) * 0.8;
      if (k <= 0) return;
      ctx.save();
      ctx.globalCompositeOperation = 'saturation';
      ctx.globalAlpha = k;
      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, DM.W, DM.H);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = k * 0.25;
      ctx.fillStyle = '#0a1420';
      ctx.fillRect(0, 0, DM.W, DM.H);
      ctx.restore();
    },

    renderTally(ctx, scene) {
      const stats = scene.ctx && scene.ctx.stats;
      const hud = scene.hud;
      if (!stats || !hud) return;
      let st = tallies.get(scene);
      if (!st) {
        st = { spared: stats.spared, gone: stats.disintegrated, ps: 0, pg: 0, humans: false, checkT: -1, lastT: hud.t, y: 0, a: 0 };
        tallies.set(scene, st);
      }
      const dt = U.clamp(hud.t - st.lastT, 0, 0.1);
      st.lastT = hud.t;
      // Pulse whichever number went up (a retry that resets them just syncs).
      if (stats.spared !== st.spared) {
        if (stats.spared > st.spared) st.ps = 1;
        st.spared = stats.spared;
      }
      if (stats.disintegrated !== st.gone) {
        if (stats.disintegrated > st.gone) st.pg = 1;
        st.gone = stats.disintegrated;
      }
      st.ps = Math.max(0, st.ps - dt * 1.6);
      st.pg = Math.max(0, st.pg - dt * 1.6);
      if (hud.t - st.checkT > 0.5 || hud.t < st.checkT) {
        st.checkT = hud.t;
        const w = scene.world;
        st.humans = !!w && w.entities.some((e) => countable(e, w));
      }
      const show = (st.humans || st.spared + st.gone > 0) && !scene.failed && hud.cineK < 0.5 && !(scene.dialog && scene.dialog.active);
      st.a = U.damp(st.a, show ? 1 : 0, 10, dt);
      if (st.a < 0.02) return;
      const ty = hud.objective ? 108 : 50;
      st.y = st.y ? U.damp(st.y, ty, 10, dt) : ty;

      const o = { size: 13, spacing: 3, weight: 600 };
      const parts = [
        ['SPARED ', 'rgba(200,225,240,0.75)', 0],
        [String(st.spared), '#bff1ff', st.ps],
        ['   ·   GONE ', 'rgba(200,225,240,0.75)', 0],
        [String(st.gone), '#ffb27a', st.pg],
      ];
      const widths = parts.map(([txt]) => Gfx.measure(ctx, txt, o));
      const total = widths.reduce((a, b) => a + b, 0);
      ctx.save();
      ctx.globalAlpha *= st.a;
      ctx.fillStyle = 'rgba(4,8,16,0.5)';
      Gfx.rr(ctx, 20, st.y, total + 28, 26, 4);
      ctx.fill();
      let x = 34;
      const by = st.y + 18;
      parts.forEach(([txt, col, pulse], i) => {
        if (pulse > 0) {
          const sc = 1 + pulse * 0.45;
          ctx.save();
          ctx.translate(x + widths[i] / 2, by - 5);
          ctx.scale(sc, sc);
          Gfx.glow(ctx, 0, 0, 22, col === '#ffb27a' ? '#ff9a3c' : '#5fd4ff', pulse * 0.7);
          Gfx.text(ctx, txt, 0, 5, Object.assign({ color: '#ffffff', align: 'center' }, { size: o.size, spacing: o.spacing, weight: o.weight }));
          ctx.restore();
        } else Gfx.text(ctx, txt, x, by, Object.assign({ color: col }, o));
        x += widths[i];
      });
      ctx.restore();
    },
  };

  // REASSEMBLE: Jon's atoms rush back together at the checkpoint (as soon as the
  // fade-in clears, see DM.FX.Reassembly), and he gets a moment's grace before
  // anything can touch him. ('play:begin' comes from Play.begin.)
  DM.Events.on('play:begin', (e) => {
    if (!e || !e.retry || !e.scene) return;
    const w = e.scene.world, p = e.scene.player;
    if (!w || !p) return;
    p.invuln = Math.max(p.invuln || 0, 0.6);
    if (DM.FX && DM.FX.Reassembly) w.add(new DM.FX.Reassembly(p));
    else w.particles.implode(p.x, p.y, 160, 80, { life: 0.6, size: 3, color: '#bff1ff' });
  });

  DM.Feedback = Feedback;
})();
</script>

<script>/* src/game/scenes/title.js */
/*
 * Title screen (with a click-to-begin gate that unlocks audio), the New Game
 * confirmation and chapter select. Continue names where it leads; Chapter
 * Select can resume a chapter from its last checkpoint.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Input = DM.Input;
  const Engine = DM.Engine;
  const Save = DM.Save;
  const Scenes = (DM.Scenes = DM.Scenes || {});

  const STARS = Gfx.makeStars(7, 220, DM.W, DM.H);

  // Shared cosmic backdrop for menus.
  function backdrop(ctx, t, o = {}) {
    const g = ctx.createLinearGradient(0, 0, 0, DM.H);
    g.addColorStop(0, '#02040a');
    g.addColorStop(1, '#0b1a30');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, DM.W, DM.H);
    for (const s of STARS) {
      ctx.globalAlpha = s.a * (0.6 + Math.sin(t * 1.5 + s.tw) * 0.4);
      ctx.fillStyle = '#dfefff';
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;
    if (o.mars !== false) {
      const mx = 1060, my = 980, mr = 560;
      const mg = ctx.createRadialGradient(mx - 160, my - 260, 60, mx, my, mr);
      mg.addColorStop(0, '#e0784a');
      mg.addColorStop(0.55, '#a8401f');
      mg.addColorStop(1, '#3a120a');
      ctx.fillStyle = mg;
      Gfx.circle(ctx, mx, my, mr);
      ctx.fill();
      ctx.fillStyle = 'rgba(60,15,8,0.35)';
      for (const [cx, cy, r] of [[860, 560, 26], [1010, 520, 14], [1150, 600, 34], [930, 650, 18], [1240, 520, 20]]) {
        Gfx.ellipse(ctx, cx, cy, r, r * 0.6);
        ctx.fill();
      }
      Gfx.glow(ctx, mx, my - mr + 40, 380, '#ff7a4a', 0.12);
    }
  }
  Scenes.backdrop = backdrop;

  // 'waves2' -> 'Waves 2'. Stages may set a `label` to name themselves.
  function stageName(ch, stage) {
    const st = ch && ch.stages[stage];
    if (!st) return '';
    if (st.label) return st.label;
    const s = String(st.id).replace(/[_-]+/g, ' ').replace(/(\D)(\d)/g, '$1 $2');
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  // Where a saved point leads, for menus: 'Karnak · Veidt'.
  function whereText(cp) {
    const ch = cp && DM.Chapters.get(cp.chapter);
    if (!ch) return '';
    return `${ch.title}  ·  ${cp.stage ? stageName(ch, cp.stage) : 'from the beginning'}`;
  }
  const inRect = (m, r) => m.x >= r.x && m.x <= r.x + r.w && m.y >= r.y && m.y <= r.y + r.h;

  // The title menu: an item may carry a `sub` line, drawn small beneath its label.
  const SUB_H = 22;
  class TitleMenu extends DM.UI.Menu {
    rowRect(i) {
      const r = super.rowRect(i);
      for (let k = 0; k < i; k++) if (this.items[k].sub) r.y += SUB_H;
      return r;
    }
    render(ctx) {
      super.render(ctx);
      this.items.forEach((it, i) => {
        if (!it.sub) return;
        const r = this.rowRect(i);
        const sel = i === this.sel;
        Gfx.text(ctx, it.sub, r.x + 34, r.y + r.h + 10, { size: 14, color: sel ? 'rgba(191,241,255,0.85)' : 'rgba(200,225,240,0.5)', font: DM.FONTS.type });
      });
    }
  }

  class Title {
    constructor() {
      this.t = 0;
      this.cursor = 'pointer';
      this.gate = !(DM.Audio.ctx && DM.Audio.ctx.state === 'running');
      this.motes = [];
      for (let i = 0; i < 90; i++) this.motes.push({ a: U.rand(0, Math.PI * 2), r: U.rand(150, 520), s: U.rand(0.2, 0.7), z: U.rand(0.4, 1) });
      this.touchOnly = window.matchMedia && !window.matchMedia('(pointer: fine)').matches;
    }
    enter() {
      this.buildMenu();
      if (!this.gate) DM.Audio.music.play('title');
    }
    resume() {
      this.buildMenu();
    }
    buildMenu() {
      const items = [];
      const target = Save.continueTarget();
      const chapters = { label: 'CHAPTERS', action: () => Engine.push(new ChapterSelect()) };
      if (target) {
        const ch = DM.Chapters.get(target.chapter);
        items.push({ label: `CONTINUE  ·  ${ch.numeral}`, sub: whereText(target), action: () => this.continueGame() });
      } else if (Save.finished) {
        // The story is over: there is nothing to continue, so lead with replaying it.
        chapters.sub = 'The story is complete. Replay any chapter.';
        items.push(chapters);
      }
      items.push({ label: 'NEW GAME', action: () => this.newGame() });
      if (!items.includes(chapters)) items.push(chapters);
      if (DM.Bonus) items.push({ label: 'BONUS LEVELS', action: () => Engine.set(new Scenes.BonusMenu()) });
      items.push({ label: 'SETTINGS', action: () => Engine.push(new Scenes.Settings()) });
      items.push({ label: 'CONTROLS', action: () => Engine.push(new Scenes.Controls()) });
      const keep = this.menu ? this.menu.sel : 0;
      this.menu = new TitleMenu(items, { x: 84, y: 330, w: 400, itemH: 44, size: 24 });
      this.menu.sel = Math.min(keep, items.length - 1);
    }
    continueGame() {
      const cp = Save.continueTarget();
      const ch = cp && DM.Chapters.get(cp.chapter);
      if (!ch) return this.startNewGame();
      if (!cp.stage) Engine.fadeTo(() => Engine.set(new Scenes.Interlude(ch.id)));
      else Engine.fadeTo(() => Engine.set(new Scenes.Play(), { chapter: ch.id, stage: cp.stage, carry: cp.carry }));
    }
    // With progress saved, New Game asks first: it replaces the Continue point.
    newGame() {
      const t = Save.continueTarget();
      const ch = t && DM.Chapters.get(t.chapter);
      const progress = Save.data.reached > 0 || (ch && (t.stage > 0 || ch.index > 0));
      if (progress) Engine.push(new ConfirmNewGame(() => this.startNewGame()));
      else this.startNewGame();
    }
    startNewGame() {
      Save.startOver();
      Engine.fadeTo(() => Engine.set(new Scenes.Interlude(DM.Chapters.list[0].id)));
    }
    update(dt) {
      this.t += dt;
      for (const m of this.motes) m.a += 0.15 * m.s * dt;
      if (this.gate) {
        if (Input.anyPressed()) {
          Input.clearAll();
          Input.endFrame();
          DM.Audio.unlock();
          DM.Audio.music.play('title');
          this.gate = false;
          DM.Audio.play('ui_select');
        }
        return;
      }
      if (Input.pressed('mute')) DM.Audio.toggleMute();
      this.menu.update(dt);
    }
    render(ctx) {
      const t = this.t;
      backdrop(ctx, t);
      const hx = 900, hy = 300;
      for (const m of this.motes) {
        const r = m.r * (0.85 + Math.sin(t * m.s + m.a) * 0.15);
        const x = hx + Math.cos(m.a + t * 0.05 * m.s) * r, y = hy + Math.sin(m.a + t * 0.05 * m.s) * r * 0.55;
        Gfx.glow(ctx, x, y, 7 * m.z, '#5fd4ff', 0.6 * m.z);
      }
      Gfx.glow(ctx, hx, hy, 300, '#1b7fd0', 0.35);
      Gfx.glow(ctx, hx, hy, 140, '#5fd4ff', 0.3);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      Gfx.hydrogen(ctx, hx, hy, 120, 'rgba(170,235,255,0.9)', t * 0.6, 5);
      ctx.restore();
      Gfx.glow(ctx, hx + Math.cos(t * 0.6) * 120, hy + Math.sin(t * 0.6) * 120, 40, '#bff1ff', 0.8);
      Gfx.glow(ctx, hx, hy, 60, '#eefbff', 0.7);

      Gfx.clock(ctx, DM.W - 70, 70, 34, 12, { blood: true });

      Gfx.text(ctx, 'DR. MANHATTAN', 80, 214, { size: 80, color: '#eefbff', weight: 700, spacing: 8, shadow: 'rgba(27,127,208,0.6)', shadowOff: 4 });
      Gfx.text(ctx, "THE WATCHMAKER'S SON", 84, 256, { size: 23, color: DM.C.blue, spacing: 10 });
      Gfx.text(ctx, 'A WATCHMEN FAN GAME', 86, 288, { size: 12, color: 'rgba(200,225,240,0.5)', spacing: 5 });

      if (this.gate) {
        const a = 0.55 + Math.sin(t * 3) * 0.45;
        Gfx.text(ctx, this.touchOnly ? 'TAP TO BEGIN' : 'CLICK OR PRESS ANY KEY', 86, 400, { size: 24, color: `rgba(238,251,255,${a})`, spacing: 6 });
        Gfx.text(ctx, 'Sound on, if you can. The music is part of it.', 86, 432, { size: 15, color: 'rgba(200,225,240,0.5)', font: DM.FONTS.type });
        // Photosensitivity notice, before anything can flash.
        const reduced = DM.SettingsSchema.reducedFlashing();
        Gfx.text(ctx, reduced ? 'Contains flashing lights. Reduced flashing is on; change it in Settings.' : 'Contains flashing lights. Reduce them in Settings.', 86, 476, { size: 15, color: 'rgba(242,196,24,0.8)', font: DM.FONTS.type });
      } else this.menu.render(ctx);

      Gfx.text(ctx, `v${DM.VERSION}  ·  KEYBOARD & MOUSE  ·  PROGRESS SAVES AUTOMATICALLY${DM.DEV ? '  ·  DEV MODE' : ''}`, 86, DM.H - 30, { size: 11, color: 'rgba(200,225,240,0.4)', spacing: 2 });
      if (this.touchOnly) Gfx.text(ctx, 'This game needs a keyboard and mouse. Touch controls are on the roadmap.', 86, DM.H - 52, { size: 13, color: DM.C.yellow });
      Gfx.text(ctx, 'Quis custodiet ipsos custodes?', DM.W - 40, DM.H - 30, { size: 14, color: 'rgba(242,231,204,0.45)', align: 'right', font: DM.FONTS.type });
    }
  }

  // ---- New Game confirmation -------------------------------------------------
  class ConfirmNewGame {
    constructor(onConfirm) {
      this.onConfirm = onConfirm;
      this.opaque = false;
      this.cursor = 'pointer';
      this.t = 0;
    }
    enter() {
      this.where = whereText(Save.continueTarget());
      this.menu = new DM.UI.Menu([
        { label: 'START OVER', action: () => {
          Engine.pop();
          this.onConfirm();
        } },
        { label: 'CANCEL', action: () => Engine.pop() },
      ], { x: DM.W / 2, y: 374, w: 380, align: 'center', itemH: 52, size: 24, onBack: () => Engine.pop() });
      this.menu.sel = 1; // the safe choice is the default
    }
    update(dt) {
      this.t += dt;
      this.menu.update(dt);
    }
    render(ctx) {
      const k = U.ease.outCubic(Math.min(1, this.t * 4));
      ctx.fillStyle = `rgba(2,4,9,${0.82 * k})`;
      ctx.fillRect(0, 0, DM.W, DM.H);
      const w = 640, x = DM.W / 2 - w / 2;
      Gfx.panel(ctx, x, 200, w, 310, { accent: DM.C.yellow });
      Gfx.text(ctx, 'START A NEW GAME?', DM.W / 2, 262, { size: 38, color: '#eefbff', align: 'center', weight: 700, spacing: 8 });
      const lines = this.where
        ? [`Continue now leads to ${this.where}.`, 'Starting over replaces it. Chapters you reached stay unlocked.']
        : ['The story starts again from the Prologue.', 'Chapters you reached stay unlocked.'];
      lines.forEach((l, i) => Gfx.text(ctx, l, DM.W / 2, 304 + i * 24, { size: 15, color: 'rgba(220,238,255,0.75)', align: 'center', font: DM.FONTS.type }));
      this.menu.render(ctx);
    }
  }

  // ---- Chapter select --------------------------------------------------------------
  class ChapterSelect {
    constructor() {
      this.t = 0;
      this.cursor = 'pointer';
      this.sel = 0;
      this.sub = 0; // 0 = play from the start, 1 = resume from the chapter's checkpoint
      this.backRect = { x: 40, y: 36, w: 128, h: 40 };
    }
    enter() {
      const reached = DM.DEV ? 99 : Save.data.reached;
      const cps = Save.data.checkpoints || {};
      this.cards = DM.Chapters.list.map((c, i) => {
        const cp = cps[c.id];
        return { c, locked: i > reached, resume: i <= reached && cp && cp.stage > 0 ? cp : null };
      });
      this.sel = Math.min(reached, this.cards.length - 1);
      this.anyResume = this.cards.some((c) => c.resume);
    }
    rect(i) {
      const n = this.cards.length;
      const w = 182, gap = 14;
      const x0 = DM.W / 2 - (n * w + (n - 1) * gap) / 2;
      return { x: x0 + i * (w + gap), y: 190, w, h: 330 };
    }
    resumeRect(i) {
      const r = this.rect(i);
      return { x: r.x, y: r.y + r.h + 14, w: r.w, h: 46 };
    }
    pick(i) {
      const card = this.cards[i];
      if (!card || card.locked) {
        DM.Audio.play('fail');
        return;
      }
      DM.Audio.play('ui_select');
      Engine.fadeTo(() => Engine.set(new Scenes.Interlude(card.c.id)));
    }
    resume(i) {
      const card = this.cards[i];
      if (!card || card.locked || !card.resume) return this.pick(i);
      const cp = card.resume;
      DM.Audio.play('ui_select');
      Engine.fadeTo(() => Engine.set(new Scenes.Play(), { chapter: card.c.id, stage: cp.stage, carry: cp.carry }));
    }
    select(i, sub) {
      const card = this.cards[i];
      sub = card && card.resume ? sub : 0;
      if (i === this.sel && sub === this.sub) return;
      this.sel = i;
      this.sub = sub;
      DM.Audio.play('ui_move');
    }
    update(dt) {
      this.t += dt;
      const m = Input.mouse;
      let hover = -1, hoverSub = 0;
      this.cards.forEach((card, i) => {
        if (inRect(m, this.rect(i))) hover = i;
        else if (card.resume && inRect(m, this.resumeRect(i))) {
          hover = i;
          hoverSub = 1;
        }
      });
      this.hoverBack = inRect(m, this.backRect);
      if (m.moved && hover >= 0) this.select(hover, hoverSub);
      if (Input.clicked()) {
        Input.consume('confirm');
        if (hover >= 0) {
          if (hoverSub) this.resume(hover);
          else this.pick(hover);
        } else if (this.hoverBack) this.back();
        return;
      }
      const n = this.cards.length;
      const card = this.cards[this.sel];
      if (Input.pressed('menuRight')) this.select(Math.min(n - 1, this.sel + 1), 0);
      if (Input.pressed('menuLeft')) this.select(Math.max(0, this.sel - 1), 0);
      // Down/up walk the cards in reading order: a card, then its Resume button.
      if (Input.pressed('menuDown')) {
        if (card && card.resume && !this.sub) this.select(this.sel, 1);
        else this.select(Math.min(n - 1, this.sel + 1), 0);
      }
      if (Input.pressed('menuUp')) {
        if (this.sub) this.select(this.sel, 0);
        else this.select(Math.max(0, this.sel - 1), 0);
      }
      if (Input.pressed('confirm')) {
        if (this.sub) this.resume(this.sel);
        else this.pick(this.sel);
      } else if (Input.pressed('back')) this.back();
    }
    back() {
      DM.Audio.play('ui_back');
      Engine.pop();
    }
    render(ctx) {
      backdrop(ctx, this.t, { mars: false });
      Gfx.text(ctx, 'CHAPTERS', DM.W / 2, 110, { size: 44, color: '#eefbff', align: 'center', weight: 700, spacing: 10 });
      Gfx.text(ctx, 'The clock moves closer to midnight with every chapter.', DM.W / 2, 146, { size: 16, color: 'rgba(200,225,240,0.6)', align: 'center', font: DM.FONTS.type });
      const b = this.backRect;
      Gfx.panel(ctx, b.x, b.y, b.w, b.h, { fill: this.hoverBack ? 'rgba(95,212,255,0.16)' : DM.C.uiBg, accent: this.hoverBack ? '#eefbff' : DM.C.uiEdge });
      Gfx.text(ctx, '‹  BACK', b.x + b.w / 2, b.y + 26, { size: 17, color: this.hoverBack ? '#ffffff' : 'rgba(200,225,240,0.8)', align: 'center', spacing: 3, weight: 600 });
      this.cards.forEach((card, i) => {
        const r = this.rect(i);
        const c = card.c;
        const sel = i === this.sel;
        const lift = sel ? -8 : 0;
        ctx.save();
        ctx.translate(0, lift);
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(r.x + 6, r.y + 8, r.w, r.h);
        ctx.fillStyle = card.locked ? '#1a2230' : c.color;
        ctx.fillRect(r.x, r.y, r.w, 170);
        ctx.fillStyle = card.locked ? '#121822' : '#f1e7cc';
        ctx.fillRect(r.x, r.y + 170, r.w, r.h - 170);
        ctx.strokeStyle = sel && !this.sub ? '#eefbff' : DM.C.ink;
        ctx.lineWidth = sel && !this.sub ? 3 : 2;
        ctx.strokeRect(r.x, r.y, r.w, r.h);
        Gfx.clock(ctx, r.x + r.w / 2, r.y + 78, 46, c.clock, { blood: !card.locked, face: card.locked ? '#2a3240' : DM.C.paper });
        Gfx.text(ctx, c.numeral, r.x + r.w / 2, r.y + 156, { size: 14, color: card.locked ? '#55606e' : DM.C.ink, align: 'center', spacing: 3, weight: 600 });
        if (card.locked) {
          Gfx.text(ctx, 'LOCKED', r.x + r.w / 2, r.y + 230, { size: 18, color: '#55606e', align: 'center', spacing: 4 });
        } else {
          ctx.save();
          Gfx.paragraph(ctx, c.title.toUpperCase(), r.x + r.w / 2, r.y + 188, r.w - 24, 24, { size: 20, font: DM.FONTS.display, color: DM.C.ink, align: 'center', weight: 600 });
          ctx.restore();
          Gfx.text(ctx, c.date, r.x + r.w / 2, r.y + 270, { size: 13, color: '#5a4a3a', align: 'center', font: DM.FONTS.type });
          Gfx.text(ctx, c.place, r.x + r.w / 2, r.y + 289, { size: 12, color: '#5a4a3a', align: 'center', font: DM.FONTS.type });
          const done = Save.data.completed[c.id];
          if (done) Gfx.text(ctx, '✓ ' + U.fmtTime(done.time), r.x + r.w / 2, r.y + 316, { size: 13, color: '#2f6b3a', align: 'center', spacing: 2, weight: 600 });
        }
        ctx.restore();
        if (card.resume) {
          const rr = this.resumeRect(i);
          const on = sel && this.sub === 1;
          Gfx.panel(ctx, rr.x, rr.y, rr.w, rr.h, { fill: on ? 'rgba(95,212,255,0.2)' : DM.C.uiBg, accent: on ? '#eefbff' : DM.C.uiEdge });
          Gfx.text(ctx, '▸ RESUME', rr.x + rr.w / 2, rr.y + 20, { size: 15, color: on ? '#ffffff' : 'rgba(200,225,240,0.85)', align: 'center', spacing: 3, weight: 600 });
          Gfx.text(ctx, stageName(c, card.resume.stage), rr.x + rr.w / 2, rr.y + 37, { size: 12, color: on ? DM.C.blue : 'rgba(200,225,240,0.55)', align: 'center', font: DM.FONTS.type });
        }
      });
      const hint = '←  →  CHOOSE' + (this.anyResume ? '     ↓  RESUME' : '') + '     ENTER / CLICK  PLAY     ESC  BACK';
      Gfx.text(ctx, hint, DM.W / 2, 636, { size: 13, color: 'rgba(200,225,240,0.5)', align: 'center', spacing: 3 });
    }
  }

  Scenes.Title = Title;
  Scenes.ChapterSelect = ChapterSelect;
  Scenes.ConfirmNewGame = ConfirmNewGame;
})();
</script>
<script>/* src/game/scenes/interlude.js */
/*
 * Chapter interlude: a comic page. Nine-panel grid, the chapter's colour, the
 * Doomsday Clock, an epigraph, and Jon's narration typed out line by line.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Input = DM.Input;
  const Engine = DM.Engine;
  const F = DM.FONTS;
  const Scenes = (DM.Scenes = DM.Scenes || {});

  class Interlude {
    constructor(chapterId) {
      this.ch = DM.Chapters.get(chapterId);
      this.t = 0;
      this.cursor = 'pointer';
      this.line = 0;
      this.chars = 0;
      this.lines = this.ch.intro || [];
      this.left = false;
    }
    enter() {
      // The chapter's own opening track, calm, so the music carries on into play.
      DM.Audio.music.play(DM.AudioDirector ? DM.AudioDirector.trackFor(this.ch.id) : this.ch.introMusic || 'title', { intensity: 0 });
    }
    get finished() {
      return this.line >= this.lines.length;
    }
    update(dt) {
      this.t += dt;
      if (this.t < 0.6) return;
      if (!this.finished) {
        // Types at the TEXT SPEED setting, then holds each finished line a beat.
        const S = DM.SettingsSchema;
        const L = this.lines[this.line];
        if (this.chars < L.length) {
          const prev = Math.floor(this.chars);
          this.chars = Math.min(L.length, this.chars + dt * (S ? S.textCPS() : 48));
          if (Math.floor(this.chars) > prev && Math.floor(this.chars) % 3 === 0) DM.Audio.play('type');
          this.hold = 0;
        } else if ((this.hold = (this.hold || 0) + dt) >= 0.46 * (S ? S.readTime() : 1)) {
          this.line++;
          this.chars = 0;
          this.hold = 0;
        }
      }
      if (Input.pressed('confirm')) {
        Input.consume('confirm');
        if (!this.finished) {
          this.line = this.lines.length;
          this.chars = 0;
        } else this.begin();
      } else if (Input.pressed('back')) this.begin();
    }
    begin() {
      if (this.left) return;
      this.left = true;
      DM.Audio.play('ui_select');
      Engine.fadeTo(() => Engine.set(new Scenes.Play(), { chapter: this.ch.id, stage: 0 }), { out: 0.7, in: 0.6 });
    }
    render(ctx) {
      const ch = this.ch;
      const t = this.t;
      ctx.fillStyle = '#0b0a09';
      ctx.fillRect(0, 0, DM.W, DM.H);
      const gx = 40, gy = 30, gw = DM.W - 80, gh = DM.H - 60, gut = 12;
      const pw = (gw - gut * 2) / 3, ph = (gh - gut * 2) / 3;
      for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
        const k = U.clamp((t - (r * 3 + c) * 0.05) * 3, 0, 1);
        ctx.globalAlpha = k;
        ctx.fillStyle = U.mix(ch.color, '#000000', 0.15 + ((r + c) % 3) * 0.08);
        ctx.fillRect(gx + c * (pw + gut), gy + r * (ph + gut), pw, ph);
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(gx, gy, pw * 2 + gut, gh);

      Gfx.clock(ctx, gx + pw * 2 + gut * 2 + pw / 2, gy + ph * 1.5 + gut, 118, ch.clock, { blood: true });
      Gfx.text(ctx, `${ch.clock} MINUTES TO MIDNIGHT`, gx + pw * 2 + gut * 2 + pw / 2, gy + ph * 2.5 + gut * 2 + 10, { size: 15, color: DM.C.paper, align: 'center', spacing: 4 });

      const x = gx + 44;
      Gfx.text(ctx, ch.numeral, x, 104, { size: 20, color: DM.C.paper, spacing: 8, weight: 600 });
      Gfx.text(ctx, ch.title.toUpperCase(), x, 166, { size: 54, color: '#ffffff', weight: 700, spacing: 4, shadow: 'rgba(0,0,0,0.5)', shadowOff: 3 });
      Gfx.text(ctx, `${ch.date.toUpperCase()}  ·  ${ch.place.toUpperCase()}`, x, 200, { size: 16, color: DM.C.paper, spacing: 4 });

      let y = 250;
      for (let i = 0; i < this.lines.length; i++) {
        if (i > this.line) break;
        const chars = i < this.line ? Infinity : this.chars;
        const h = Gfx.paragraph(ctx, this.lines[i], x, y, pw * 2 - 70, 27, { size: 19, font: F.type, color: '#f6efdf', chars });
        y += h + 16;
      }

      if (ch.epigraph) {
        const ey = gy + gh - 96;
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(x - 14, ey - 12, pw * 2 - 50, 78);
        Gfx.paragraph(ctx, `“${ch.epigraph.text}”`, x, ey, pw * 2 - 80, 22, { size: 16, font: F.type, color: DM.C.paper });
        Gfx.text(ctx, '— ' + ch.epigraph.by, x + pw * 2 - 80, ey + 56, { size: 14, color: DM.C.paper, align: 'right', font: F.type });
      }

      if (this.finished && Math.sin(t * 4) > -0.4) Gfx.text(ctx, 'CLICK OR PRESS SPACE TO BEGIN', DM.W - 60, DM.H - 46, { size: 14, color: '#ffffff', align: 'right', spacing: 4 });
      else if (!this.finished) Gfx.text(ctx, 'SPACE TO SKIP', DM.W - 60, DM.H - 46, { size: 12, color: 'rgba(255,255,255,0.45)', align: 'right', spacing: 4 });
      Gfx.postFx(ctx, { vignette: 0, grain: 0.06 });
    }
  }

  Scenes.Interlude = Interlude;
})();
</script>
<script>/* src/game/scenes/play.js */
/*
 * Play scene: runs one chapter. Owns the world, player, HUD, dialogue and the
 * chapter script context. Handles pause, failure (decoherence), retry from
 * checkpoint, stats and chapter completion.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Input = DM.Input;
  const Engine = DM.Engine;
  const Save = DM.Save;
  const Scenes = (DM.Scenes = DM.Scenes || {});

  class Play {
    constructor() {
      this.debug = false;
      this.memo = {}; // ctx.memo / ctx.once: remembered across retries of this chapter
    }

    // A targeting reticle only once Jon has powers to aim.
    get cursor() {
      return this.player && this.player.form === 'human' ? 'pointer' : 'reticle';
    }

    enter(params) {
      this.offs = [
        DM.Events.on('enemy:down', (e) => {
          if (!e.human || !this.ctx) return;
          if (e.lethal) this.ctx.stats.disintegrated++;
          else this.ctx.stats.spared++;
        }),
        DM.Events.on('memory:found', (m) => {
          if (!this.ctx) return;
          this.ctx.stats.memories++;
          if (m.year != null && !this.ctx.foundMemories.includes(m.year)) this.ctx.foundMemories.push(m.year);
          this.hud.caption(`${m.year}. ${m.text}`, { dur: 6 + m.text.length * 0.03 });
        }),
        // Alt-tab, a notification or a hidden tab pauses the fight (Settings can turn this off).
        DM.Events.on('app:blur', () => this.focusLost()),
      ];
      this.begin(params.chapter, params.stage || 0, params.carry || null);
    }

    focusLost() {
      const s = Save.settings;
      if ((s && s.focusPause === false) || this.failed || !this.ctx || this.ctx.done) return;
      if (!Engine.stack.includes(this)) return;
      // Mid-fade (map change, retry): pause as soon as the new scene is up.
      if (Engine.fading) {
        clearTimeout(this.blurTimer);
        this.blurTimer = setTimeout(() => this.focusLost(), 120);
        return;
      }
      if (Engine.top() === this) Engine.push(new Scenes.Pause(this));
    }

    exit() {
      clearTimeout(this.blurTimer);
      for (const off of this.offs || []) off();
      if (this.ctx) this.ctx.dispose();
      DM.Audio.stopHums();
      DM.Audio.setMusicFilter(18000);
    }

    // Start (or restart) the chapter at `stage`. `carry` is the checkpoint
    // snapshot to resume with; `retry` is true for REASSEMBLE / restart.
    begin(chapterId, stage, carry, retry) {
      if (this.ctx) this.ctx.dispose();
      const ch = DM.Chapters.get(chapterId);
      this.chapter = ch;
      this.hud = new DM.HUD(this);
      this.dialog = new DM.Dialog();
      this.player = new DM.Player(0, 0);
      this.player.setForm(ch.form || 'manhattan');
      for (const id of (ch.startPowers || DM.Chapters.powersBefore(ch.index))) this.player.unlock(id);
      this.world = new DM.World({ w: DM.W, h: DM.H });
      this.failed = false;
      this.failT = 0;
      this.ctx = new DM.ChapterContext(this, ch);
      this.ctx.memo = this.memo;
      this.ctx.applyCarry(carry);
      this.ctx.start(stage);
      this.ctx.step(0);
      DM.Audio.stopHums();
      DM.Audio.setMusicFilter(18000);
      DM.Audio.music.play(ch.music);
      // Checkpoint stages record themselves (stageLoop); a fresh start records the
      // chapter start, which only moves Continue if it is not behind it.
      if (!stage) Save.checkpointAt(ch.id, 0, null);
      DM.Events.emit('play:begin', { scene: this, chapter: ch.id, stage, retry: !!retry });
    }

    setWorld(world) {
      const p = this.player;
      for (const st of Object.values(p.powers)) {
        st.target = null;
        st.hover = null;
        st.active = false;
        st.pending = [];
      }
      this.world = world;
      world.player = p;
      p.world = world;
      p.dead = false;
      const s = world.spawn || { x: world.w / 2, y: world.h / 2 };
      p.x = s.x;
      p.y = s.y;
      p.vx = p.vy = 0;
      // Hit arcs are timed on the old world's clock; a new world restarts it.
      p.hurtDirs = [];
      p.hurtFlash = null;
      if (s.facing != null) p.facing = s.facing;
      world.add(p);
      world.camera.snap(p.x, p.y);
      DM.Audio.stopHums();
    }

    update(dt) {
      if (Input.pressed('pause') && !this.failed && !Engine.fading) {
        Input.consume('pause');
        Input.consume('back');
        Engine.push(new Scenes.Pause(this));
        return;
      }
      if (Input.pressed('mute')) this.hud.toast(DM.Audio.toggleMute() ? 'SOUND OFF' : 'SOUND ON', '#bff1ff');
      if (DM.DEV) {
        if (Input.pressed('skip')) this.ctx.skipStage();
        if (Input.pressed('debug')) this.debug = !this.debug;
      }

      this.dialog.update(dt);
      const p = this.player;
      p.locked = this.ctx.locked || this.dialog.active;
      const w = this.world;
      w.mouse = w.camera.toWorld(Input.mouse.x, Input.mouse.y);
      w.ceasefire = p.locked || this.failed; // cutscenes, dialogue and decoherence are safe
      if (p.locked || p.form === 'human') {
        w.slowmo = false;
        w.timesight = false;
      }
      w.update(dt);
      this.ctx.step(dt);
      if (this.world !== w) return; // map changed this frame

      const cam = w.camera;
      const tgt = this.ctx.camTarget;
      if (tgt) cam.follow(tgt.x, tgt.y, dt, 3);
      else {
        const look = p.form === 'manhattan' && !p.locked ? 0.18 : 0;
        cam.follow(p.x + (w.mouse.x - p.x) * look, p.y + (w.mouse.y - p.y) * look, dt, 6);
      }
      this.hud.update(dt);

      if (p.down && !this.failed) {
        this.failed = true;
        this.failT = 1.8;
        if (this.chapter.bonus) DM.Bonus.death();
        else { Save.data.totals.decoherences++; Save.write(); }
        // Coming apart: a beat of freeze, then the world crawls while Jon's
        // atoms hang in the air (DM.Feedback drains the colour meanwhile).
        w.ceasefire = true;
        if (w.hitstop) w.hitstop(0.15);
        w.slowmoT = 1.2;
        w.slowmoTarget = 0.15;
        w.particles.burst(p.x, p.y, 120, { color: ['#7fe3ff', '#5fd4ff', '#ffffff'], speed: [40, 360], life: [0.9, 2.2], size: [1.5, 3.5], drag: 0.3 });
        p.hidden = true;
        DM.Audio.play('disintegrate');
      }
      if (this.failed) {
        this.failT -= dt;
        if (this.failT <= 0 && Engine.top() === this) Engine.push(new Scenes.GameOver(this));
      }
    }

    // Back to the last checkpoint with the stats it was reached with, so the
    // failed attempt's kills and spares are discarded but earlier ones are kept.
    retry() {
      const stage = this.ctx.checkpoint || 0;
      const carry = this.ctx.checkpointCarry;
      Engine.fadeTo(() => {
        while (Engine.top() !== this && Engine.stack.length > 1) Engine.pop();
        this.begin(this.chapter.id, stage, carry, true);
      });
    }

    completeChapter() {
      if (this.chapter.bonus) return DM.Bonus.complete(this);
      const ch = this.chapter;
      const st = this.ctx.stats;
      const next = DM.Chapters.next(ch.id);
      const d = Save.data;
      // Story choices a chapter declares in `persistFlags` travel to the ending.
      d.completed[ch.id] = { time: st.time, disintegrated: st.disintegrated, spared: st.spared, memories: st.memories, flags: this.ctx.persistedFlags() };
      d.reached = Math.max(d.reached, ch.index + 1);
      d.totals.disintegrated += st.disintegrated;
      d.totals.spared += st.spared;
      d.totals.memories += st.memories;
      Save.chapterDone(ch.id);
      Engine.push(new Scenes.ChapterComplete(this, st, next));
    }

    // The world (with its light layer and emissive pass), the weather, Temporal
    // Sight, combat feedback, the low-coherence edge, then the pre-composited
    // vignette and grain, and the HUD and dialogue above it all.
    render(ctx) {
      const w = this.world;
      w.render(ctx);
      // During the lockdown the light layer's beacons carry the alarm's red.
      if (w.tint && !(w.lighting && w.alarm)) {
        ctx.fillStyle = w.tint;
        ctx.fillRect(0, 0, DM.W, DM.H);
      }
      if (DM.Weather) DM.Weather.render(ctx, w, w.atmosphere);
      this.renderTimesight(ctx);
      if (DM.Feedback && DM.Feedback.render) DM.Feedback.render(ctx, this);
      const p = this.player;
      if (p.form === 'manhattan' && p.coherence < 35 && !p.down) {
        // Jon's edges come apart in blue light (steady with REDUCED flashing).
        const pulse = DM.SettingsSchema && DM.SettingsSchema.reducedFlashing() ? 0.85 : 0.7 + Math.sin(this.hud.t * 6) * 0.3;
        ctx.save();
        ctx.globalAlpha = (0.35 - p.coherence / 100) * 1.6 * pulse;
        ctx.globalCompositeOperation = 'lighter';
        Gfx.vignette(ctx, 1, '#2a8ad8');
        ctx.restore();
      }
      Gfx.postFx(ctx);
      const n = Engine.notice;
      if (n && !n.shown) {
        n.shown = true;
        this.hud.toast(n.text, '#bff1ff');
      }
      this.hud.render(ctx);
      this.dialog.render(ctx);
      if (this.debug) this.renderDebug(ctx);
    }

    // Temporal Sight: the world fades to an old photograph while Jon, his
    // duplicates, danger (enemy fire, hazards, telegraphs) and memories are
    // drawn again over it in full colour, with fading amber ghosts of where
    // enemies just were, and the clock ring around Jon.
    renderTimesight(ctx) {
      const w = this.world;
      // Sight's own fade (world.sightK): scripted slow motion is not Sight.
      const k = w.sightK || 0;
      if (k < 0.02) return;
      const p = this.player;
      ctx.save();
      ctx.globalAlpha = 0.85 * k;
      ctx.globalCompositeOperation = 'saturation';
      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, DM.W, DM.H);
      ctx.globalAlpha = 0.35 * k;
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = '#d9b46a';
      ctx.fillRect(0, 0, DM.W, DM.H);
      ctx.restore();

      ctx.save();
      w.camera.apply(ctx);
      if (w.ghosts) {
        ctx.fillStyle = '#f2b440';
        for (const [e, h] of w.ghosts) {
          if (e.dead) continue;
          for (let i = 0; i < h.length - 3; i += 3) {
            ctx.globalAlpha = (0.05 + 0.22 * (i / h.length)) * k; // older = fainter
            Gfx.circle(ctx, h[i], h[i + 1], e.r * 1.05);
            ctx.fill();
          }
        }
        ctx.globalAlpha = 1;
      }
      for (const e of w._keep || []) if (!e.dead) e.render(ctx, w);
      w.renderEmissive(ctx, w._vis || []);
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = k;
      const s = w.camera.toScreen(p.x, p.y);
      const R = 150 * w.camera.zoom * p.scale;
      ctx.strokeStyle = 'rgba(242,196,24,0.5)';
      ctx.lineWidth = 1.5;
      Gfx.circle(ctx, s.x, s.y, R);
      ctx.stroke();
      for (let i = 0; i < 60; i++) {
        const a = (i / 60) * Math.PI * 2;
        const l = i % 5 ? 5 : 12;
        Gfx.line(ctx, s.x + Math.cos(a) * R, s.y + Math.sin(a) * R, s.x + Math.cos(a) * (R - l), s.y + Math.sin(a) * (R - l));
      }
      const ht = this.hud.t;
      ctx.lineWidth = 2;
      Gfx.line(ctx, s.x, s.y, s.x + Math.cos(ht * 0.8 - 1.57) * R * 0.85, s.y + Math.sin(ht * 0.8 - 1.57) * R * 0.85);
      Gfx.line(ctx, s.x, s.y, s.x + Math.cos(-ht * 0.1 - 1.57) * R * 0.5, s.y + Math.sin(-ht * 0.1 - 1.57) * R * 0.5);
      ctx.restore();
      Gfx.text(ctx, 'TEMPORAL SIGHT', DM.W / 2, 150, { size: 13, color: 'rgba(242,196,24,0.8)', align: 'center', spacing: 6, alpha: k });
    }

    renderDebug(ctx) {
      const w = this.world, p = this.player;
      const st = Engine.stats;
      const lines = [
        `fps ${Math.round(Engine.fps)}  entities ${w.entities.length}  particles ${w.particles.list.length}`,
        `update ${st.updMs.toFixed(2)} ms  render ${st.renderMs.toFixed(2)} ms  frame gap ${st.gapMs.toFixed(1)} ms  quality ${Engine.qualityTier()} x${Engine.dpr.toFixed(2)}`,
        `map ${w.mapId || '-'}  lights ${w.lighting && DM.Lighting ? DM.Lighting.stats.lights : 0}  weather ${DM.Weather ? DM.Weather.stats.particles : 0}`,
        `chapter ${this.chapter.id}  stage ${this.ctx.stageIndex} (${this.chapter.stages[this.ctx.stageIndex] && this.chapter.stages[this.ctx.stageIndex].id})  checkpoint ${this.ctx.checkpoint}`,
        `player ${Math.round(p.x)},${Math.round(p.y)}  form ${p.form}  energy ${Math.round(p.energy)}  coherence ${Math.round(p.coherence)}`,
        `] skip stage   \` toggle debug`,
      ];
      const h = lines.length * 20 + 10;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(10, DM.H - 10 - h, 760, h);
      lines.forEach((l, i) => Gfx.text(ctx, l, 20, DM.H - h + 12 + i * 20, { size: 13, color: '#9fe8ff', font: DM.FONTS.type }));
    }
  }

  Scenes.Play = Play;
})();
</script>
<script>/* src/game/scenes/overlays.js */
/* Overlay scenes: pause, settings, controls, power unlock card, game over, chapter complete. */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Input = DM.Input;
  const Engine = DM.Engine;
  const Save = DM.Save;
  const Schema = DM.SettingsSchema;
  const F = DM.FONTS;
  const Scenes = (DM.Scenes = DM.Scenes || {});

  function dim(ctx, a = 0.7) {
    ctx.fillStyle = `rgba(2,4,9,${a})`;
    ctx.fillRect(0, 0, DM.W, DM.H);
  }

  function toTitle() {
    Engine.fadeTo(() => Engine.set(new Scenes.Title()));
  }

  // ---- Pause ------------------------------------------------------------------
  class Pause {
    constructor(play) {
      this.play = play;
      this.opaque = false;
      this.cursor = 'pointer';
      this.t = 0;
    }
    enter() {
      DM.Audio.stopHums();
      DM.Audio.setMusicFilter(1200);
      this.menu = new DM.UI.Menu([
        { label: 'RESUME', action: () => this.close() },
        { label: 'RESTART FROM CHECKPOINT', action: () => this.play.retry() },
        { label: 'SETTINGS', action: () => Engine.push(new Settings()) },
        { label: 'CONTROLS', action: () => Engine.push(new Controls()) },
        { label: 'QUIT TO TITLE', action: () => toTitle() },
      ], { x: DM.W / 2, y: 364, w: 420, align: 'center', itemH: 48, size: 24, onBack: () => this.close() });
    }
    close() {
      DM.Audio.setMusicFilter(this.play.world.timesight ? 650 : 18000);
      Engine.pop();
    }
    // What the player is doing and the last tip they were given (shown even if hints are ESSENTIAL).
    notes() {
      const hud = this.play.hud;
      const o = hud && hud.objective && !hud.objective.done ? hud.objective : null;
      let objective = null;
      if (o) {
        const prog = o.progress ? o.progress() : null;
        objective = o.text + (prog != null && prog !== '' ? `  ${prog}` : '');
      }
      const h = hud && hud.lastHint;
      const note = h && h.chapter === this.play.chapter.id ? h.text : null;
      return { objective, note };
    }
    update(dt) {
      this.t += dt;
      if (Input.pressed('pause') && !Input.pressed('back')) return this.close();
      this.menu.update(dt);
    }
    render(ctx) {
      dim(ctx, 0.8);
      Gfx.text(ctx, 'PAUSED', DM.W / 2, 146, { size: 56, color: '#eefbff', align: 'center', weight: 700, spacing: 12 });
      const ch = this.play.chapter;
      Gfx.text(ctx, `${ch.numeral} · ${ch.title.toUpperCase()}`, DM.W / 2, 178, { size: 15, color: DM.C.blue, align: 'center', spacing: 4 });
      this.renderNotes(ctx);
      this.menu.render(ctx);
    }
    renderNotes(ctx) {
      const { objective, note } = this.notes();
      if (!objective && !note) return;
      const w = 700, x = DM.W / 2 - w / 2, y = 204, pad = 22;
      const lines = note ? Math.min(3, Math.round(Gfx.paragraphHeight(ctx, note, w - pad * 2, 23, { size: 18, font: F.display }) / 23)) : 0;
      const h = (objective ? 56 : 0) + (note ? 30 + lines * 23 : 0) + 18;
      Gfx.panel(ctx, x, y, w, h, { accent: 'rgba(242,196,24,0.7)' });
      let cy = y + 26;
      if (objective) {
        Gfx.text(ctx, 'OBJECTIVE', x + pad, cy, { size: 11, color: DM.C.yellow, spacing: 3, weight: 600 });
        Gfx.text(ctx, objective, x + pad, cy + 24, { size: 19, color: '#ffffff' });
        cy += 56;
      }
      if (note) {
        Gfx.text(ctx, 'FIELD NOTE', x + pad, cy, { size: 11, color: DM.C.yellow, spacing: 3, weight: 600 });
        Gfx.text(ctx, 'H  RECALLS IT IN PLAY', x + w - pad, cy, { size: 10, color: 'rgba(200,225,240,0.5)', spacing: 2, align: 'right' });
        Gfx.paragraph(ctx, note, x + pad, cy + 8, w - pad * 2, 23, { size: 18, font: F.display, color: '#fff6d0' });
      }
    }
  }

  // ---- Settings -------------------------------------------------------------------
  // Rows come from DM.SettingsSchema, one tab per section. Q / E (or clicking a
  // tab, or ↑ to the tab row then ← →) switch sections.
  const MENU_Y = 186;
  const FOOT_Y = 552; // top of the description footer; rows always end above it

  class Settings {
    constructor() {
      this.opaque = false;
      this.cursor = 'pointer';
      this.tab = 0;
      this.tabFocus = false;
      this.armed = null;
      this.done = null;
      this.tabRects = [];
      this.t = 0;
    }
    enter() {
      Schema.sanitize(Save.settings);
      this.build();
    }
    item(e) {
      const it = { id: e.id, label: e.label, desc: () => Schema.describe(e.id) };
      if (e.type === 'action') {
        if (e.confirm) it.value = () => (this.armed === e.id ? 'PRESS AGAIN' : '');
        it.action = () => {
          if (e.confirm && this.armed !== e.id) {
            this.armed = e.id;
            return;
          }
          this.armed = null;
          const msg = e.action(this);
          if (msg) this.done = msg;
        };
        return it;
      }
      it.value = () => Schema.format(e.id);
      it.adjust = (dir) => Schema.step(e.id, dir);
      if (e.type === 'slider') {
        it.frac = () => (Schema.value(e.id) - e.min) / (e.max - e.min);
        it.setFrac = (f) => Schema.set(e.id, e.min + Math.round((f * (e.max - e.min)) / e.step) * e.step);
      }
      return it;
    }
    build() {
      const items = Schema.inSection(Schema.sections[this.tab]).map((e) => this.item(e));
      items.push({ label: 'BACK', action: () => this.close(), desc: () => '' });
