      // Rows shrink to fit if a section ever grows past the space above the footer.
      const itemH = Math.min(46, Math.floor((FOOT_Y - 8 - MENU_Y) / items.length));
      this.menu = new DM.UI.Menu(items, {
        x: DM.W / 2 - 330, y: MENU_Y, w: 660, itemH, size: Math.min(21, Math.round(itemH * 0.46)), valueW: 150,
        onBack: () => this.close(),
      });
    }
    switchTab(i) {
      const n = Schema.sections.length;
      const next = (i + n) % n;
      if (next === this.tab) return;
      this.tab = next;
      this.armed = null;
      this.build();
      DM.Audio.play('ui_move');
    }
    close() {
      Engine.pop();
    }
    tabAt(mx, my) {
      return this.tabRects.findIndex((r) => mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h);
    }
    update(dt) {
      this.t += dt;
      const m = Input.mouse;
      if (Input.pressed('tabNext') || Input.pressed('tabPrev')) {
        const dir = Input.pressed('tabNext') ? 1 : -1;
        for (const a of ['tabNext', 'tabPrev', 'confirm', 'interact']) Input.consume(a);
        this.switchTab(this.tab + dir);
        return;
      }
      if (Input.clicked() && this.tabAt(m.x, m.y) >= 0) {
        Input.consume('confirm');
        this.switchTab(this.tabAt(m.x, m.y));
        return;
      }
      const first = this.menu.items.findIndex((i) => !i.disabled);
      if (this.tabFocus) {
        if (m.moved && this.menu.hit(m.x, m.y) >= 0) this.tabFocus = false;
        else {
          if (Input.pressed('menuLeft')) this.switchTab(this.tab - 1);
          if (Input.pressed('menuRight')) this.switchTab(this.tab + 1);
          if (Input.pressed('menuDown') || Input.pressed('confirm')) {
            Input.consume('confirm');
            this.tabFocus = false;
            this.menu.sel = first;
            DM.Audio.play('ui_move');
          } else if (Input.pressed('menuUp')) {
            this.tabFocus = false;
            this.menu.sel = this.menu.items.length - 1;
            DM.Audio.play('ui_move');
          } else if (Input.pressed('back')) {
            Input.consume('back');
            DM.Audio.play('ui_back');
            this.close();
          }
          return;
        }
      }
      if (Input.pressed('menuUp') && this.menu.sel === first) {
        Input.consume('menuUp');
        this.tabFocus = true;
        DM.Audio.play('ui_move');
        return;
      }
      this.menu.update(dt);
      const cur = this.menu.items[this.menu.sel];
      if (!cur || cur.id !== this.armed) this.armed = null;
    }
    render(ctx) {
      dim(ctx, 0.92);
      if (Engine.top() !== this) return; // the controls list is open on top
      Gfx.text(ctx, 'SETTINGS', DM.W / 2, 100, { size: 44, color: '#eefbff', align: 'center', weight: 700, spacing: 10 });
      this.renderTabs(ctx);
      if (!this.tabFocus) this.menu.render(ctx);
      else {
        const sel = this.menu.sel;
        this.menu.sel = -1;
        this.menu.render(ctx);
        this.menu.sel = sel;
      }
      ctx.fillStyle = 'rgba(140,200,240,0.16)';
      ctx.fillRect(DM.W / 2 - 330, FOOT_Y, 660, 1);
      const it = this.menu.items[this.menu.sel];
      const desc = this.tabFocus ? '← →  to choose a section.' : it && it.desc ? it.desc() : '';
      if (desc) Gfx.paragraph(ctx, desc, DM.W / 2, FOOT_Y + 18, 720, 24, { size: 17, font: F.type, color: 'rgba(220,238,255,0.82)', align: 'center' });
      const note = this.done || (!Save.available ? 'This browser is blocking storage, so progress will not be saved.'
        : Save.readOnly ? 'This save is from a newer version of the game, so nothing will be saved here.'
        : 'Settings and progress are saved in this browser.');
      Gfx.text(ctx, note, DM.W / 2, 652, { size: 14, color: 'rgba(200,225,240,0.5)', align: 'center', font: F.type });
      Gfx.text(ctx, 'Q / E  SECTION     ↑ ↓  CHOOSE     ← →  CHANGE     ESC  BACK', DM.W / 2, 686, { size: 12, color: 'rgba(200,225,240,0.45)', align: 'center', spacing: 3 });
    }
    renderTabs(ctx) {
      const names = Schema.sections;
      const o = { size: 15, spacing: 3, weight: 600 };
      const gap = 44;
      const widths = names.map((n) => Gfx.measure(ctx, n, o));
      let x = DM.W / 2 - (widths.reduce((a, b) => a + b, 0) + gap * (names.length - 1)) / 2;
      const y = 148;
      this.tabRects = [];
      names.forEach((n, i) => {
        const w = widths[i];
        const on = i === this.tab;
        this.tabRects.push({ x: x - 10, y: y - 22, w: w + 20, h: 34 });
        if (on && this.tabFocus) {
          ctx.fillStyle = 'rgba(95,212,255,0.12)';
          ctx.fillRect(x - 10, y - 22, w + 20, 34);
        }
        Gfx.text(ctx, n, x, y, Object.assign({ color: on ? '#ffffff' : 'rgba(200,225,240,0.5)' }, o));
        if (on) {
          ctx.fillStyle = DM.C.blue;
          ctx.fillRect(x, y + 8, w, 2);
        }
        x += w + gap;
      });
    }
  }

  // ---- Controls -----------------------------------------------------------------
  function controlRows() {
    const tk = Input.bindings.telekinesis || [];
    const orC = tk.includes('KeyC') ? ' OR C' : '';
    const toggle = Schema.value('tkMode') === 'toggle';
    return [
      ['MOVE', 'W A S D  /  ARROW KEYS'],
      ['AIM', 'MOUSE'],
      ['INTERACT / TALK', 'E'],
      ['TELEKINESIS', toggle ? `CLICK${orC} TO LIFT, AGAIN TO THROW` : `HOLD LEFT CLICK${orC}, MOVE, RELEASE TO THROW`],
      ['DISINTEGRATE', 'Q  /  RIGHT CLICK  (TWO-FINGER CLICK ON A MAC)'],
      ['TELEPORT', 'SPACE'],
      ['DUPLICATE', 'R'],
      ['TEMPORAL SIGHT', 'HOLD F  /  SHIFT'],
      ['EXPAND', 'G'],
      ['LAST HINT', 'H'],
      ['ADVANCE DIALOGUE', 'E / SPACE / CLICK  (HOLD TO FAST-FORWARD)'],
      ['SKIP NARRATION', 'E / SPACE / CLICK, TWICE'],
      ['PAUSE', 'ESC / P'],
      ['MUTE', 'M'],
    ];
  }

  class Controls {
    constructor() {
      this.opaque = false;
      this.cursor = 'pointer';
    }
    update() {
      if (Input.pressed('back') || Input.pressed('confirm') || Input.pressed('pause')) {
        Input.consume('confirm');
        Input.consume('back');
        DM.Audio.play('ui_back');
        Engine.pop();
      }
    }
    render(ctx) {
      dim(ctx, 0.88);
      Gfx.text(ctx, 'CONTROLS', DM.W / 2, 100, { size: 44, color: '#eefbff', align: 'center', weight: 700, spacing: 10 });
      Gfx.text(ctx, 'Powers unlock as Jon changes. You start as a man.', DM.W / 2, 134, { size: 15, color: 'rgba(200,225,240,0.6)', align: 'center', font: F.type });
      controlRows().forEach(([a, b], i) => {
        const y = 184 + i * 31;
        Gfx.text(ctx, a, DM.W / 2 - 20, y, { size: 17, color: DM.C.blue, align: 'right', spacing: 2 });
        Gfx.text(ctx, b, DM.W / 2 + 20, y, { size: 17, color: '#ffffff', spacing: 1 });
      });
      Gfx.text(ctx, 'ESC / CLICK TO GO BACK', DM.W / 2, 660, { size: 13, color: 'rgba(200,225,240,0.5)', align: 'center', spacing: 3 });
    }
  }

  // ---- Power unlock card ---------------------------------------------------------
  class PowerUnlock {
    constructor(id, onClose) {
      this.def = DM.Powers.get(id);
      this.onClose = onClose;
      this.opaque = false;
      this.cursor = 'pointer';
      this.t = 0;
    }
    enter() {
      DM.Audio.play('unlock');
      DM.Audio.stopHums();
    }
    update(dt) {
      this.t += dt;
      if (this.t > 0.9 && (Input.pressed('confirm') || Input.pressed('interact'))) {
        Input.consume('confirm');
        Input.consume('interact');
        Input.clearAll();
        DM.Audio.play('ui_select');
        Engine.pop();
        if (this.onClose) this.onClose();
      }
    }
    render(ctx) {
      const d = this.def;
      const k = U.ease.outCubic(Math.min(1, this.t * 2));
      dim(ctx, 0.78 * k);
      const cx = DM.W / 2, cy = 300;
      Gfx.glow(ctx, cx, cy - 40, 260 * k, d.color, 0.35);
      ctx.save();
      ctx.translate(cx, cy - 40);
      ctx.scale(0.6 + k * 0.4, 0.6 + k * 0.4);
      Gfx.icon(ctx, d.id, 0, 0, 120, d.color, this.t);
      ctx.restore();
      Gfx.text(ctx, 'NEW POWER', cx, cy + 66, { size: 14, color: DM.C.yellow, align: 'center', spacing: 8, alpha: k });
      Gfx.text(ctx, d.name.toUpperCase(), cx, cy + 122, { size: 58, color: '#ffffff', align: 'center', weight: 700, spacing: 10, alpha: k });
      ctx.save();
      ctx.globalAlpha = k;
      Gfx.paragraph(ctx, d.desc, cx, cy + 146, 620, 26, { size: 19, font: F.type, color: '#dceeff', align: 'center' });
      const tipY = cy + 214;
      const tw = 700;
      Gfx.panel(ctx, cx - tw / 2, tipY - 8, tw, 82, { accent: d.color });
      Gfx.paragraph(ctx, d.tip, cx, tipY + 6, tw - 50, 25, { size: 19, font: F.display, color: '#ffffff', align: 'center' });
      ctx.restore();
      if (this.t > 0.9 && Math.sin(this.t * 4) > -0.4) Gfx.text(ctx, 'PRESS E / SPACE / CLICK', cx, DM.H - 40, { size: 13, color: 'rgba(255,255,255,0.7)', align: 'center', spacing: 4 });
    }
  }

  // ---- Game over (decoherence) ------------------------------------------------------
  class GameOver {
    constructor(play) {
      this.play = play;
      this.opaque = false;
      this.cursor = 'pointer';
      this.t = 0;
    }
    enter() {
      DM.Audio.stopHums();
      DM.Audio.setMusicFilter(500);
      // Three decoherences at one checkpoint: offer the gentler challenge, without nagging.
      this.offer = DM.Challenge.deaths(this.play) >= 3 && Schema.value('challenge') !== 'story' && !Schema.value('invulnerable');
      const items = [{ label: 'REASSEMBLE', action: () => this.play.retry() }];
      if (this.offer) {
        items.push({
          label: 'TRY STORY CHALLENGE',
          action: () => {
            Schema.set('challenge', 'story');
            this.play.retry();
          },
        });
      }
      items.push({ label: 'QUIT TO TITLE', action: () => toTitle() });
      this.menu = new DM.UI.Menu(items, { x: DM.W / 2, y: 400, w: 440, align: 'center', itemH: 52, size: 26 });
    }
    update(dt) {
      this.t += dt;
      if (this.t > 0.6) this.menu.update(dt);
    }
    render(ctx) {
      dim(ctx, Math.min(0.8, this.t));
      Gfx.text(ctx, 'DECOHERENCE', DM.W / 2, 270, { size: 64, color: '#bff1ff', align: 'center', weight: 700, spacing: 14 });
      Gfx.text(ctx, 'Your intrinsic field came apart. You have put yourself back together before.', DM.W / 2, 316, { size: 18, color: 'rgba(220,238,255,0.75)', align: 'center', font: F.type });
      if (this.t <= 0.6) return;
      this.menu.render(ctx);
      if (this.offer) {
        const y = this.menu.y + this.menu.items.length * this.menu.itemH + 30;
        Gfx.text(ctx, 'Story challenge: attacks hurt less and you recover faster. Change it any time in Settings.', DM.W / 2, y, { size: 15, color: 'rgba(200,225,240,0.6)', align: 'center', font: F.type });
      }
    }
  }

  // ---- Chapter complete ------------------------------------------------------------------
  class ChapterComplete {
    constructor(play, stats, next) {
      this.play = play;
      this.stats = Object.assign({}, stats);
      this.next = next;
      this.opaque = false;
      this.cursor = 'pointer';
      this.t = 0;
      this.leaving = false;
    }
    enter() {
      DM.Audio.stopHums();
      DM.Audio.play('success');
      DM.Challenge.clear(this.play.chapter.id);
    }
    rows() {
      const s = this.stats;
      const rows = [['TIME', U.fmtTime(s.time)]];
      if (s.disintegrated || s.spared) {
        rows.push(['DISINTEGRATED', String(s.disintegrated)]);
        rows.push(['SPARED', String(s.spared)]);
      }
      if (this.play.chapter.id === 'mars') rows.push(['MEMORIES', `${s.memories} / 6`]);
      // A neutral record of how it was played, never a grade.
      rows.push(['CHALLENGE', Schema.format('challenge') + (Schema.value('invulnerable') ? '  ·  INVULNERABLE' : '')]);
      return rows;
    }
    update(dt) {
      this.t += dt;
      if (this.t > 1 && !this.leaving && (Input.pressed('confirm') || Input.pressed('interact'))) {
        this.leaving = true;
        DM.Audio.play('ui_select');
        const next = this.next;
        Engine.fadeTo(() => Engine.set(next ? new Scenes.Interlude(next.id) : new Scenes.Ending()), { out: 0.8, in: 0.6 });
      }
    }
    render(ctx) {
      const ch = this.play.chapter;
      const k = U.ease.outCubic(Math.min(1, this.t * 1.5));
      dim(ctx, 0.8 * k);
      ctx.save();
      ctx.globalAlpha = k;
      Gfx.clock(ctx, DM.W / 2, 190, 58, ch.clock, { blood: true });
      Gfx.text(ctx, `${ch.numeral} COMPLETE`, DM.W / 2, 300, { size: 16, color: DM.C.yellow, align: 'center', spacing: 8 });
      Gfx.text(ctx, ch.title.toUpperCase(), DM.W / 2, 352, { size: 48, color: '#ffffff', align: 'center', weight: 700, spacing: 6 });
      this.rows().forEach(([a, b], i) => {
        const y = 410 + i * 32;
        Gfx.text(ctx, a, DM.W / 2 - 16, y, { size: 16, color: 'rgba(200,225,240,0.7)', align: 'right', spacing: 3 });
        Gfx.text(ctx, b, DM.W / 2 + 16, y, { size: 18, color: '#ffffff', spacing: 1 });
      });
      ctx.restore();
      if (this.t > 1 && Math.sin(this.t * 4) > -0.4) Gfx.text(ctx, this.next ? 'PRESS SPACE / CLICK TO CONTINUE' : 'PRESS SPACE / CLICK', DM.W / 2, DM.H - 60, { size: 14, color: 'rgba(255,255,255,0.8)', align: 'center', spacing: 4 });
    }
  }

  Scenes.Pause = Pause;
  Settings.FOOT_Y = FOOT_Y;
  Scenes.Settings = Settings;
  Scenes.Controls = Controls;
  Scenes.PowerUnlock = PowerUnlock;
  Scenes.GameOver = GameOver;
  Scenes.ChapterComplete = ChapterComplete;
})();
</script>
<script>/* src/game/scenes/minigames.js */
/*
 * Minigames run as overlay scenes. Chapter scripts start them with
 * `yield ctx.minigame(DM.Scenes.WatchRepair)`; they call done(result) when finished.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Input = DM.Input;
  const Engine = DM.Engine;
  const F = DM.FONTS;
  const Scenes = (DM.Scenes = DM.Scenes || {});

  function gear(ctx, x, y, r, teeth, rot, fill, stroke) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.beginPath();
    for (let i = 0; i < teeth * 2; i++) {
      const a = (i / (teeth * 2)) * Math.PI * 2;
      const rr = i % 2 ? r : r * 0.82;
      const a2 = a + Math.PI / (teeth * 2);
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      ctx.lineTo(Math.cos(a2) * rr, Math.sin(a2) * rr);
    }
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    if (stroke) {
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    Gfx.circle(ctx, 0, 0, r * 0.25);
    ctx.fill();
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      ctx.fillRect(Math.cos(a) * r * 0.5 - 2, Math.sin(a) * r * 0.5 - 2, 4, 4);
    }
    ctx.restore();
  }

  // Seat four gears in Janey's watch by pressing at the right moment.
  class WatchRepair {
    constructor(opts, done) {
      this.done = done;
      this.opaque = false;
      this.cursor = 'pointer';
      this.t = 0;
      this.step = 0;
      this.angle = -Math.PI / 2;
      this.speed = 2.0;
      this.dir = 1;
      this.zone = { a: U.rand(0, Math.PI * 2), w: 0.7 };
      this.missT = 0;
      this.hitT = 0;
      this.finished = false;
      this.endT = 0;
      this.spin = 0;
      this.gears = [
        { x: -50, y: -40, r: 46, teeth: 14 },
        { x: 45, y: -10, r: 34, teeth: 11 },
        { x: -10, y: 60, r: 30, teeth: 10 },
        { x: 70, y: 70, r: 22, teeth: 8 },
      ];
    }
    update(dt) {
      this.t += dt;
      this.missT = Math.max(0, this.missT - dt);
      this.hitT = Math.max(0, this.hitT - dt);
      if (this.finished) {
        this.spin += dt * 1.5;
        this.endT -= dt;
        if (Math.floor(this.t * 2) !== Math.floor((this.t - dt) * 2)) DM.Audio.play('tick', { alt: Math.floor(this.t * 2) % 2 });
        if (this.endT <= 0) {
          Engine.pop();
          this.done(true);
        }
        return;
      }
      this.angle += this.speed * this.dir * dt;
      if (this.t > 0.4 && (Input.pressed('confirm') || Input.pressed('interact'))) {
        Input.consume('confirm');
        Input.consume('interact');
        const d = Math.abs(U.wrapAngle(this.angle - this.zone.a));
        if (d < this.zone.w / 2) {
          this.step++;
          this.hitT = 0.35;
          DM.Audio.play('gear');
          if (this.step >= this.gears.length) {
            this.finished = true;
            this.endT = 2.4;
            DM.Audio.play('success');
          } else {
            this.speed *= 1.22;
            this.dir *= -1;
            this.zone.w *= 0.86;
            this.zone.a = U.rand(0, Math.PI * 2);
          }
        } else {
          this.missT = 0.4;
          DM.Audio.play('miss');
        }
      }
    }
    render(ctx) {
      ctx.fillStyle = 'rgba(8,6,4,0.86)';
      ctx.fillRect(0, 0, DM.W, DM.H);
      const cx = DM.W / 2, cy = 370;
      Gfx.text(ctx, "REPAIRING JANEY'S WATCH", cx, 92, { size: 30, color: DM.C.paper, align: 'center', weight: 600, spacing: 6 });
      Gfx.text(ctx, this.finished ? 'It runs.' : 'Press SPACE or CLICK when the pivot lines up with the gold jewel setting.', cx, 124, { size: 17, color: 'rgba(242,231,204,0.75)', align: 'center', font: F.type });

      const shake = this.missT > 0 ? Math.sin(this.t * 80) * 4 : 0;
      ctx.save();
      ctx.translate(cx + shake, cy);
      ctx.fillStyle = '#b8902e';
      Gfx.circle(ctx, 0, 0, 190);
      ctx.fill();
      ctx.fillStyle = '#e2c46a';
      Gfx.circle(ctx, 0, 0, 178);
      ctx.fill();
      ctx.fillStyle = '#2a2622';
      Gfx.circle(ctx, 0, 0, 160);
      ctx.fill();

      this.gears.forEach((g, i) => {
        const seated = i < this.step;
        if (seated) {
          const rot = (this.finished ? this.spin : this.t * 0.6) * (i % 2 ? -1 : 1) * (46 / g.r);
          gear(ctx, g.x, g.y, g.r, g.teeth, rot, i % 2 ? '#c9a24a' : '#d8b860', '#7a5a1a');
        } else {
          ctx.save();
          ctx.strokeStyle = i === this.step ? 'rgba(242,196,24,0.8)' : 'rgba(242,231,204,0.2)';
          ctx.setLineDash([4, 4]);
          ctx.lineWidth = 1.5;
          Gfx.circle(ctx, g.x, g.y, g.r);
          ctx.stroke();
          ctx.restore();
        }
      });
      ctx.fillStyle = '#c4302b';
      for (const [x, y] of [[-50, -40], [45, -10], [-10, 60], [70, 70]]) {
        Gfx.circle(ctx, x, y, 3.5);
        ctx.fill();
      }

      if (this.finished) {
        const k = Math.min(1, (2.4 - this.endT) * 1.5);
        ctx.globalAlpha = k;
        ctx.fillStyle = '#f6efdf';
        Gfx.circle(ctx, 0, 0, 160);
        ctx.fill();
        ctx.strokeStyle = DM.C.ink;
        ctx.lineWidth = 3;
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2;
          Gfx.line(ctx, Math.cos(a) * 130, Math.sin(a) * 130, Math.cos(a) * 148, Math.sin(a) * 148);
        }
        const sec = -Math.PI / 2 + this.spin * 2;
        ctx.lineWidth = 6;
        Gfx.line(ctx, 0, 0, Math.cos(-2.2) * 70, Math.sin(-2.2) * 70);
        ctx.lineWidth = 4;
        Gfx.line(ctx, 0, 0, Math.cos(-0.9) * 110, Math.sin(-0.9) * 110);
        ctx.strokeStyle = DM.C.blood;
        ctx.lineWidth = 1.5;
        Gfx.line(ctx, 0, 0, Math.cos(sec) * 130, Math.sin(sec) * 130);
        ctx.globalAlpha = 1;
      }
      ctx.restore();

      if (!this.finished) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.strokeStyle = 'rgba(242,231,204,0.18)';
        ctx.lineWidth = 10;
        Gfx.circle(ctx, 0, 0, 215);
        ctx.stroke();
        ctx.strokeStyle = this.hitT > 0 ? '#ffffff' : DM.C.yellow;
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.arc(0, 0, 215, this.zone.a - this.zone.w / 2, this.zone.a + this.zone.w / 2);
        ctx.stroke();
        const a = this.angle;
        ctx.fillStyle = this.missT > 0 ? DM.C.red : '#ffffff';
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 200, Math.sin(a) * 200);
        ctx.lineTo(Math.cos(a - 0.06) * 236, Math.sin(a - 0.06) * 236);
        ctx.lineTo(Math.cos(a + 0.06) * 236, Math.sin(a + 0.06) * 236);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      for (let i = 0; i < this.gears.length; i++) {
        ctx.fillStyle = i < this.step ? DM.C.yellow : 'rgba(242,231,204,0.2)';
        Gfx.circle(ctx, cx - 45 + i * 30, DM.H - 60, 7);
        ctx.fill();
      }
    }
  }

  Scenes.WatchRepair = WatchRepair;
})();
</script>
<script>/* src/game/scenes/ending.js */
/*
 * Ending: the clock reaches midnight. The closing narration changes with how
 * Jon treated people along the way (lives spared vs. disintegrated) — the
 * first hook for branching endings.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Input = DM.Input;
  const Engine = DM.Engine;
  const F = DM.FONTS;
  const Scenes = (DM.Scenes = DM.Scenes || {});

  function tally() {
    let killed = 0, spared = 0, memories = 0, time = 0;
    for (const id in DM.Save.data.completed) {
      const c = DM.Save.data.completed[id];
      killed += c.disintegrated || 0;
      spared += c.spared || 0;
      memories += c.memories || 0;
      time += c.time || 0;
    }
    return { killed, spared, memories, time };
  }

  class Ending {
    constructor() {
      this.t = 0;
      this.cursor = 'pointer';
      this.page = 0;
      this.pageT = 0;
      const s = (this.stats = tally());
      const detached = s.killed > Math.max(4, s.spared * 1.5);
      this.pages = [
        'Midnight. The clock in my mind stops, and does not start again.',
        'Adrian asks me whether he did the right thing. Whether it all worked out, in the end.',
        'I tell him there is no end. There is only the next moment, and the one after it, and all of them at once.',
        detached
          ? `${s.killed} people came apart at my touch. I remember each of them; I remember them still being alive. I am leaving this galaxy for one less complicated.`
          : `I chose to set ${s.spared} people down gently, when it would have been easier not to. Perhaps I am not finished with human beings. Perhaps I will make some of my own.`,
        'Somewhere, a watch is ticking. I can see every moment it will ever measure.',
      ];
    }
    enter() {
      DM.Audio.music.play(this.stats.killed > Math.max(4, this.stats.spared * 1.5) ? 'ending_cold' : 'ending'); // the same rule as the text
    }
    get onCredits() {
      return this.page >= this.pages.length;
    }
    update(dt) {
      this.t += dt;
      this.pageT += dt;
      const S = DM.SettingsSchema;
      const auto = !this.onCredits && this.pageT > (4.2 + this.pages[this.page].length * 0.045) * (S ? S.readTime() : 1);
      if (auto || (this.pageT > 0.6 && Input.pressed('confirm'))) {
        Input.consume('confirm');
        if (this.onCredits) {
          if (this.pageT > 1.5) Engine.fadeTo(() => Engine.set(new Scenes.Title()), { out: 1.2, in: 0.8 });
          return;
        }
        this.page++;
        this.pageT = 0;
        DM.Audio.play('tick');
      }
    }
    render(ctx) {
      ctx.fillStyle = '#05070c';
      ctx.fillRect(0, 0, DM.W, DM.H);
      const k = Math.min(1, this.page / this.pages.length);
      const minutes = Math.max(0, 1 - k);
      Gfx.glow(ctx, DM.W / 2, 220, 260, '#1b7fd0', 0.25);
      Gfx.clock(ctx, DM.W / 2, 220, 110, minutes, { blood: true });
      if (!this.onCredits) {
        const text = this.pages[this.page];
        const a = Math.min(1, this.pageT * 1.5);
        ctx.save();
        ctx.globalAlpha = a;
        const cps = DM.SettingsSchema ? DM.SettingsSchema.textCPS() : 45;
        Gfx.paragraph(ctx, text, DM.W / 2, 400, 760, 34, { size: 24, font: F.type, color: '#e8f6ff', align: 'center', chars: isFinite(cps) ? this.pageT * cps : Infinity });
        ctx.restore();
        Gfx.text(ctx, 'SPACE / CLICK', DM.W / 2, DM.H - 36, { size: 11, color: 'rgba(200,225,240,0.35)', align: 'center', spacing: 3 });
        return;
      }
      const a = Math.min(1, this.pageT);
      const s = this.stats;
      ctx.save();
      ctx.globalAlpha = a;
      Gfx.text(ctx, 'THE END', DM.W / 2, 410, { size: 64, color: '#ffffff', align: 'center', weight: 700, spacing: 16 });
      Gfx.text(ctx, 'OF THIS MOMENT', DM.W / 2, 446, { size: 16, color: DM.C.blue, align: 'center', spacing: 10 });
      const rows = [
        ['TOTAL TIME', U.fmtTime(s.time)],
        ['DISINTEGRATED', String(s.killed)],
        ['SPARED', String(s.spared)],
        ['MEMORIES RECOVERED', `${s.memories} / 6`],
      ];
      rows.forEach(([l, v], i) => {
        Gfx.text(ctx, l, DM.W / 2 - 14, 506 + i * 28, { size: 14, color: 'rgba(200,225,240,0.6)', align: 'right', spacing: 3 });
        Gfx.text(ctx, v, DM.W / 2 + 14, 506 + i * 28, { size: 16, color: '#ffffff' });
      });
      Gfx.text(ctx, 'A fan game inspired by Watchmen (Alan Moore, Dave Gibbons & John Higgins). Not affiliated with DC.', DM.W / 2, DM.H - 40, { size: 12, color: 'rgba(200,225,240,0.4)', align: 'center', font: F.type });
      ctx.restore();
    }
  }

  Scenes.Ending = Ending;
})();
</script>
<script>/* src/game/audiodirector.js */
/*
 * Audio director: turns what is happening into sound without any scene or
 * entity calling it. It ticks once per engine frame (it wraps DM.Engine.frame,
 * so the game keeps a single requestAnimationFrame chain), looks at the scene
 * stack (DM.Engine) and listens to game events:
 *   - the ambient bed for the current map (and zone), ducked under Temporal
 *     Sight and Pause, silent outside play;
 *   - music intensity from the threat around Jon, dialogue ducking, stage cues;
 *   - the spare/kill moment ('enemy:down'): 'ko' + 'spared', or 'unmade' and a
 *     dip in the music;
 *   - danger: heartbeat at low coherence, emitter hum, jamming static, a
 *     muffled world when Jon comes apart;
 *   - Temporal Sight: the effects slow and darken, a pocket watch ticks;
 *   - footsteps by surface.
 * Nothing here may throw into the game: each frame runs inside try/catch.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Audio = DM.Audio;
  const Input = DM.Input;

  const THREAT_RANGE = 900; // alerted enemies within this distance count
  const THREAT_FULL = 6; // this much weight is a full fight
  const BOSS_THREAT = 0.85;
  const TALK_THREAT = 0.35; // dialogue or a cutscene calms the score
  const HEART_LOW = 35; // coherence below which the heart is heard
  const HEART_CRITICAL = 15;
  const HEART_SLOW = 0.95; // seconds between beats
  const HEART_FAST = 0.6;
  const LOW_FILTER = 2500; // music caps while hurt, unmaking, decohered
  const DIP_FILTER = 900;
  const DIP_TIME = 0.6;
  const DOWN_FILTER = 400;
  const EMITTER_REACH = 1.6; // hum heard to jamR x this
  const ZONE_HYST = 40;
  const AMB_SIGHT = 0.4; // ambience level under Temporal Sight and Pause
  const AMB_PAUSE = 0.6;

  const Amb = () => DM.Ambience || { maps: {}, beds: {}, cues: {}, events: {} };

  // Threat weight per enemy: heavy machines count double, emitters not at all.
  function weightOf(e) {
    if (e.threatWeight != null) return e.threatWeight;
    const E = DM.Enemies || {};
    if (E.Emitter && e instanceof E.Emitter) return 0;
    if ((E.Tank && e instanceof E.Tank) || (E.Battery && e instanceof E.Battery) || (E.Behemoth && e instanceof E.Behemoth)) return 2;
    return 1;
  }

  const Director = {
    lastError: null,
    stageKey: null,
    cue: null, // track this director set for the current stage cue
    bed: null,
    stepSign: 0,
    stepCount: 0,
    beatT: 0,
    low: false,
    dipT: 0,
    sightHeld: false,
    caps: { low: null, dip: null, down: null },
    play: null,
    last: 0,

    // The first track of a chapter, so its interlude can start the music Play continues.
    trackFor(chapterId, stageIndex = 0) {
      const ch = DM.Chapters && DM.Chapters.get(chapterId);
      if (!ch) return 'title';
      const st = ch.stages && ch.stages[stageIndex];
      const cue = st && Amb().cues[`${ch.id}.${st.id}`];
      return cue || ch.introMusic || ch.music || 'title';
    },
    playScene() {
      const E = DM.Engine;
      const Play = DM.Scenes && DM.Scenes.Play;
      if (!E || !Play) return null;
      for (const s of E.stack) if (s instanceof Play) return s;
      return null;
    },
    stageKeyOf(play) {
      const ch = play.chapter;
      const st = ch && ch.stages && play.ctx && ch.stages[play.ctx.stageIndex];
      return ch && st ? `${ch.id}.${st.id}` : null;
    },
    // A stage with a cue plays its track; leaving it brings the chapter's track
    // back, unless a script has changed the music since.
    applyStage(play, force) {
      const key = this.stageKeyOf(play);
      if (key === this.stageKey && !force) return;
      this.stageKey = key;
      const M = Audio.music;
      const cue = key && Amb().cues[key];
      if (cue) {
        M.play(cue);
        this.cue = cue;
      } else if (this.cue) {
        if (M.wanted === this.cue && play.chapter.music) M.play(play.chapter.music);
        this.cue = null;
      }
    },

    // ---- per frame --------------------------------------------------------------
    frame(dt) {
      const E = DM.Engine;
      if (!E) return;
      const play = this.playScene();
      this.play = play;
      if (!play || !play.world || !play.player || !play.ctx) {
        this.idle();
        return;
      }
      const top = E.top();
      const live = top === play && !E.error;
      const w = play.world;
      const p = play.player;

      this.ambience(play, live);
      this.applyStage(play);

      if (live) {
        Audio.setTimeScale(w.timeScale == null ? 1 : w.timeScale);
        Audio.music.setIntensity(this.threat(play));
        Audio.duck((play.dialog && play.dialog.active) || (play.hud && play.hud.captions && play.hud.captions.length > 0));
        this.danger(play, dt);
        this.footsteps(play);
      } else {
        // Overlays (Pause, Game Over, the watch) stop the world: no live danger.
        Audio.setTimeScale(1);
        Audio.duck(false);
        this.stopDanger();
        this.low = false;
        this.caps.low = null;
      }

      if (this.dipT > 0) this.dipT -= dt;
      this.caps.dip = this.dipT > 0 ? DIP_FILTER : null;
      this.caps.down = p.down ? DOWN_FILTER : null;
      this.applyCaps();
    },
    idle() {
      Audio.ambience(null);
      Audio.setAmbienceDuck(1);
      Audio.setTimeScale(1);
      Audio.duck(false);
      this.stopDanger();
      this.caps.low = this.caps.dip = this.caps.down = null;
      this.dipT = 0;
      this.low = false;
      this.applyCaps();
      this.stageKey = null;
      this.cue = null;
      this.bed = null;
    },
    applyCaps() {
      let f = null;
      for (const k in this.caps) if (this.caps[k] && (f == null || this.caps[k] < f)) f = this.caps[k];
      Audio.setMusicCap(f, f === DOWN_FILTER ? 0.03 : 0.25);
    },

    // The bed for this map, or for the zone Jon is standing in.
    ambience(play, live) {
      const m = Amb().maps[play.ctx.mapName];
      const p = play.player;
      let bed = m ? m.bed : null;
      if (m && m.zones) {
        for (const z of m.zones) {
          const r = z.rect;
          const e = this.bed === z.bed ? ZONE_HYST : 0;
          if (r && p.x > r[0] - e && p.y > r[1] - e && p.x < r[2] + e && p.y < r[3] + e) {
            bed = z.bed;
            break;
          }
        }
      }
      this.bed = bed;
      Audio.ambience(bed);
      Audio.setAmbienceDuck(!live ? AMB_PAUSE : play.world.timesight ? AMB_SIGHT : 1);
    },

    // 0 calm .. 1 full fight.
    threat(play) {
      const w = play.world;
      const p = play.player;
      let sum = 0;
      for (const e of w.entities) {
        if (!e.alerted || e.dead || e.ko || e.yielded || e.team !== 'enemy') continue;
        if (U.dist(e.x, e.y, p.x, p.y) > THREAT_RANGE) continue;
        sum += weightOf(e);
      }
      let t = Math.min(1, sum / THREAT_FULL);
      if (w.boss && !w.boss.dead && !w.boss.yielded) t = Math.max(t, BOSS_THREAT);
      if ((play.dialog && play.dialog.active) || play.ctx.locked) t *= TALK_THREAT;
      return t;
    },

    danger(play, dt) {
      const w = play.world;
      const p = play.player;
      if (p.down || play.failed) {
        this.stopDanger();
        this.low = false;
        this.caps.low = null;
        return;
      }
      // Heartbeat.
      const low = p.form === 'manhattan' && p.coherence < HEART_LOW;
      if (low) {
        if (!this.low) this.beatT = 0;
        this.beatT -= dt;
        if (this.beatT <= 0) {
          Audio.play('beat');
          this.beatT = Math.max(0, this.beatT) + (p.coherence < HEART_CRITICAL ? HEART_FAST : HEART_SLOW);
        }
      }
      this.low = low;
      this.caps.low = low ? LOW_FILTER : null;

      // The nearest tachyon emitter hums, beating at 5.6 Hz, louder as Jon nears it.
      let best = null;
      let bd = Infinity;
      for (const e of w.entities) {
        if (!e.jamR || e.dead || e.ko) continue;
        const d = U.dist(e.x, e.y, p.x, p.y);
        if (d < bd) {
          bd = d;
          best = e;
        }
      }
      const reach = best ? best.jamR * EMITTER_REACH : 0;
      if (best && bd < reach) {
        const k = 1 - bd / reach;
        Audio.hum('emitter', true, { type: 'sawtooth', freq: 98, type2: 'sawtooth', freq2: 103.6, cutoff: 900, gain: 0.05 * k * k });
      } else Audio.hum('emitter', false);
      Audio.hum('static', p.jammed, { kind: 'noise', freq: 3500, q: 1.2, gate: 25, gain: 0.02 });

      // Temporal Sight pressed while jammed: it fails audibly.
      const held = Input.down('timesight');
      if (held && !this.sightHeld && p.jammed && p.has && p.has('timesight') && p.canUsePowers) Audio.play('jammed');
      this.sightHeld = held;

      Audio.hum('sight', !!w.timesight, { kind: 'sight' });
    },
    stopDanger() {
      Audio.hum('emitter', false);
      Audio.hum('static', false);
      Audio.hum('sight', false);
    },

    // A footstep each time the walk cycle crosses zero.
    footsteps(play) {
      const p = play.player;
      const s = Math.sin(p.walk || 0) >= 0 ? 1 : -1;
      if (p.moving && !p.down && !p.hidden && this.stepSign && s !== this.stepSign) {
        const m = Amb().maps[play.ctx.mapName];
        const surface = m && m.surface;
        if (surface && p.form === 'human') Audio.play('step', { surface });
        else if (surface && p.form === 'manhattan' && ++this.stepCount % 2 === 0) Audio.play('step', { surface, form: 'manhattan' });
      }
      this.stepSign = s;
    },

    // ---- events -----------------------------------------------------------------
    onDown(ev) {
      if (!ev || !ev.human) return;
      if (ev.lethal) {
        Audio.play('unmade');
        this.dipT = DIP_TIME;
        this.caps.dip = DIP_FILTER;
        this.applyCaps();
      } else {
        Audio.play('ko');
        Audio.play('spared');
      }
    },
    onBegin(e) {
      this.stageKey = null;
      this.cue = null;
      this.low = false;
      this.dipT = 0;
      this.caps.low = this.caps.dip = this.caps.down = null;
      this.stepSign = 0;
      this.applyCaps();
      // Straight away, so a stage cue cancels Play.begin's chapter track before it lands.
      if (e && e.scene && e.scene.ctx) this.applyStage(e.scene, true);
    },
  };

  const guard = (fn) => (arg) => {
    try {
      fn(arg);
    } catch (e) {
      Director.lastError = String((e && e.stack) || e);
    }
  };
  DM.Events.on('enemy:down', guard((ev) => Director.onDown(ev)));
  DM.Events.on('play:begin', guard((e) => Director.onBegin(e)));
  DM.Events.on('player:down', guard(() => {
    Director.stopDanger();
    Director.caps.down = DOWN_FILTER;
    Director.applyCaps();
  }));
  // Story events with a track of their own (Veidt yielding -> 'reflect').
  for (const name of Object.keys(Amb().events || {})) {
    DM.Events.on(name, guard(() => {
      const id = Amb().events[name];
      Audio.music.play(id);
      Director.cue = id;
    }));
  }

  function tick(ts) {
    const dt = Director.last ? Math.min(0.1, Math.max(0, (ts - Director.last) / 1000)) : 1 / 60;
    Director.last = ts;
    try {
      Director.frame(dt);
    } catch (e) {
      Director.lastError = String((e && e.stack) || e);
    }
  }
  // After each engine frame (update, render, input). A second rAF loop would
  // also work in a browser, but would double-step virtual displays in tests.
  const E = DM.Engine;
  if (E && typeof E.frame === 'function') {
    const frame = E.frame;
    E.frame = function (t) {
      frame.call(this, t);
      tick(t);
    };
  } else if (typeof requestAnimationFrame === 'function') {
    const loop = (t) => {
      requestAnimationFrame(loop);
      tick(t);
    };
    requestAnimationFrame(loop);
  }

  DM.AudioDirector = Director;
})();
</script>
<script>/* src/data/atmosphere.js */
/*
 * Atmosphere: how each map looks beyond its floor plan, keyed by map id
 * (world.mapId, set by ChapterContext.loadMap), so chapter files stay untouched.
 *
 *   shadow   colour multiplied under walls for their cast shadows
 *   light    darkness and lights (src/core/lighting.js); no ambient = daylight, free
 *   weather  ambient motion layers (src/core/weather.js)
 *   walls    wall kind -> { pattern, height, top, lit, dark } (surfaces in world.js);
 *            height scales the cast shadow (1 = DM.LIGHT_DIR, low walls 0.5)
 *
 * Positions below repeat a few things the chapter maps place (lamps, rooms, the
 * generator); they are presentation only, so a mismatch just looks odd.
 * Add a map: DM.Atmosphere.register('mymap', { light: {...}, weather: [...] }).
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;

  const reduced = () => !!(DM.SettingsSchema && DM.SettingsSchema.reducedFlashing());

  // Per-world scratch state for profiles (ramps, flashbulbs, cached entity refs).
  const scratch = (world) => world.atmo || (world.atmo = {});
  // A 0..1 value easing toward `on` at `rate` per second, in real time.
  function ramp(world, key, on, rate) {
    const s = scratch(world);
    const rt = world.realTime || 0;
    const r = s[key] || (s[key] = { v: 0, t: rt });
    r.v = U.approach(r.v, on ? 1 : 0, U.clamp(rt - r.t, 0, 0.1) * rate);
    r.t = rt;
    return r.v;
  }
  // The first live entity matching pred, remembered until it dies.
  function find(world, key, pred) {
    const s = scratch(world);
    const e = s[key];
    if (e && !e.dead && world.entities.includes(e)) return e;
    return (s[key] = world.entities.find((x) => !x.dead && pred(x)) || null);
  }
  function all(world, key, pred) {
    const s = scratch(world);
    if (!s[key] || s[key + 'N'] !== world.entities.length) {
      s[key] = world.entities.filter(pred);
      s[key + 'N'] = world.entities.length;
    }
    return s[key];
  }

  // ---- Pier 9 (superman.js buildPier) --------------------------------------------
  const PIER_LAMPS = [[200, 300], [200, 820], [900, 1120], [1420, 1060], [620, 560]];
  const WAREHOUSE = { x: 1000, y: 150, w: 1100, h: 750 };
  const WAREHOUSE_BULBS = [[1190, 250], [1380, 580], [1620, 330], [1600, 770], [1860, 700], [1900, 330]];
  let pierPuddles = null;
  // The puddles bakePier scatters, found by replaying its seeded generator.
  function puddles() {
    if (pierPuddles) return pierPuddles;
    const rnd = U.seeded(1966);
    for (let i = 0; i < 9000; i++) {
      rnd();
      rnd();
      rnd();
    }
    pierPuddles = [];
    for (let i = 0; i < 14; i++) {
      const x = rnd() * 2000, y = rnd() * 1100, rx = 30 + rnd() * 70;
      pierPuddles.push({ x, y, rx });
    }
    return pierPuddles;
  }

  // ---- Gila Flats (prologue.js buildGila) ------------------------------------------
  const GEN = { x: 1426, y: 520 };
  const BEACONS = [[1136, 44, 0], [1716, 996, Math.PI / 2], [560, 510, Math.PI]];
  const GILA_ROOMS = [[320, 230], [850, 250], [300, 800], [840, 800], [560, 510]];

  // ---- Studio (mars.js buildStudio) --------------------------------------------------
  const DESK = { x: 700, y: 300 };
  const SPOTS = [[430, 110], [700, 70], [970, 110]];

  // ---- Karnak (karnak.js buildKarnak) ------------------------------------------------
  const COURT = { x: 1300, y: 160, w: 1300, h: 1680 };
  const SANCTUM = { x: 1900, y: 500, w: 676, h: 1000 };
  const SUB = { x: 2470, y: 1000 };
  const TORCHES = [];
  for (let y = 580; y < 1460; y += 160) TORCHES.push([1938, y], [2538, y]);
  const BRAZIERS = [];
  for (let x = 1450; x < 1850; x += 260) for (const y of [300, 700, 1300, 1700]) BRAZIERS.push([x + 20, y + 20]);

  const DUST_WALLS = {
    sandbag: { pattern: 'sandbag', height: 0.5 },
    concrete: { pattern: 'concrete', height: 1.2 },
    rock: { pattern: 'rock', height: 1.1 },
  };

  const profiles = {
    // Prologue lab. Daylight until the lockdown alarm: then the room lights drop,
    // red beacons sweep the walls and the generator's glow builds.
    gila: {
      shadow: 'rgba(60,45,30,0.32)',
      light: {
        player: 0,
        ambient(world) {
          const k = ramp(world, 'alarm', world.alarm, 1.6);
          return k > 0.01 ? `rgba(30,4,8,${(0.74 * k).toFixed(3)})` : null;
        },
        lights(world, add, t) {
          const k = scratch(world).alarm ? scratch(world).alarm.v : 0;
          // Emergency lighting: dim pools in each room.
          for (const [x, y] of GILA_ROOMS) add(x, y, 300, { i: 0.42 * k });
          // Rotating beacons. They sweep rather than blink; REDUCED flashing slows them right down.
          const spin = reduced() ? 0.6 : 2.6;
          for (const [x, y, ph] of BEACONS) {
            const a = t * spin + ph;
            add(x, y, 640, { i: 0.95 * k, cone: a, spread: 0.34, color: '#ff2a1a', k: 0.62 * k });
            add(x, y, 640, { i: 0.95 * k, cone: a + Math.PI, spread: 0.34, color: '#ff2a1a', k: 0.62 * k });
            add(x, y, 50, { i: k, color: '#ff4a30', k: 0.6 * k });
          }
          const gen = find(world, 'gen', (e) => e.data && e.data.power != null && Math.abs(e.x - GEN.x) < 4 && Math.abs(e.y - GEN.y) < 4);
          const pw = gen ? Math.min(1.6, gen.data.power) : 0;
          add(GEN.x, GEN.y, 220 + pw * 320, { i: 0.65 + pw * 0.3, color: '#5fd4ff', k: 0.12 + pw * 0.3 });
          const p = world.player;
          if (p && !p.hidden) add(p.x, p.y, 110, { i: 0.4 * k }); // enough to keep Jon readable
        },
      },
      weather: [{ type: 'haze', n: 60, alpha: 0.045, color: '#fff0d0' }],
    },

    // Chapter I. Jon is the only light; every atom is a spark.
    void: {
      light: {
        ambient: 'rgba(0,2,10,0.74)',
        player: 1.3,
        lights(world, add) {
          const b = find(world, 'body', (e) => e.depositR != null && e.layers);
          if (b) add(b.x, b.y, 320, { i: 0.5, color: '#5fd4ff', k: 0.08 });
        },
      },
      weather: [{ type: 'stars', n: 160 }],
    },

    // Chapter II, Nevada: desert daylight, drifting dust.
    range: {
      shadow: 'rgba(120,70,30,0.4)',
      weather: [{ type: 'dust', color: '#f0dcb0', devilColor: '#d8b880', wind: 50 }],
      walls: { sandbag: DUST_WALLS.sandbag, concrete: DUST_WALLS.concrete },
    },

    // Chapter II, New York at night: sodium lamps, headlights, drizzle, and a
    // darker warehouse lit by a few bare bulbs.
    pier: {
      shadow: 'rgba(16,16,40,0.55)',
      light: {
        ambient: 'rgba(10,10,34,0.76)',
        zones: [{ x: WAREHOUSE.x, y: WAREHOUSE.y, w: WAREHOUSE.w, h: WAREHOUSE.h, ambient: 'rgba(5,5,14,0.82)' }],
        lights(world, add) {
          for (const [x, y] of PIER_LAMPS) add(x, y, 260, { color: '#ffbf60', k: 0.24, flicker: true });
          for (const [x, y] of WAREHOUSE_BULBS) add(x, y, 210, { i: 0.88, color: '#ffd9a0', k: 0.12, flicker: true });
          add(1425, 905, 190, { i: 0.75, color: '#ffd27a', k: 0.1 }); // spill from the loading door
          add(1000, 460, 130, { i: 0.55, color: '#ffd27a', k: 0.06 });
          const V = DM.Props && DM.Props.Vehicle;
          for (const v of all(world, 'sedans', (e) => V && e instanceof V && e.kind === 'sedan')) {
            if (v.dead || v.burnt || v.heldBy) continue;
            const c = Math.cos(v.rot), s = Math.sin(v.rot), f = v.r * 1.2;
            for (const side of [-1, 1]) {
              const hx = v.x + c * f - s * side * v.r * 0.42, hy = v.y + s * f + c * side * v.r * 0.42;
              add(hx, hy, 300, { i: 0.8, cone: v.rot, spread: 0.26, color: '#fff4d0', k: 0.05 });
            }
          }
        },
      },
      weather: [
        { type: 'drizzle', exclude: [WAREHOUSE], get puddles() { return puddles(); } },
        { type: 'haze', only: WAREHOUSE, n: 70, alpha: 0.06, shaftsAt: [0.3, 0.65] },
      ],
      walls: {
        brick: { pattern: 'brick', height: 1.2 },
        rust: { pattern: 'ribbed', height: 1.4 },
        navy: { pattern: 'ribbed', height: 1.4 },
        moss: { pattern: 'ribbed', height: 1.4 },
        shelf: { pattern: 'shelf', height: 1.1 },
      },
    },

    // Chapter III: the proving ground. Dust, dust devils and broken rock.
    proving: {
      shadow: 'rgba(120,70,30,0.42)',
      weather: [{ type: 'dust', color: '#f0d8a8', devilColor: '#c8a070', wind: 70 }],
      walls: DUST_WALLS,
    },

    // Chapter IV: a television studio, dark except for the stage and the flashbulbs.
    studio: {
      shadow: 'rgba(10,0,24,0.45)',
      light: {
        ambient: 'rgba(12,8,26,0.66)',
        lights(world, add, t) {
          for (const [x, y] of SPOTS) add(x, y, 400, { cone: U.angleTo(x, y, DESK.x, DESK.y + 40), spread: 0.3, color: '#fff0c8', k: 0.12 });
          add(700, 480, 380, { i: 0.45 });
          for (let i = 0; i < 5; i++) add(300 + i * 200, 40, 180, { i: 0.5, color: '#fff2d0', k: 0.05 });
          // Reporters' flashbulbs: a white pop of 0.08 s now and then (never with REDUCED flashing).
          if (reduced()) return;
          const s = scratch(world);
          const dt = U.clamp(t - (s.bulbT == null ? t : s.bulbT), 0, 0.1);
          s.bulbT = t;
          const bulbs = s.bulbs || (s.bulbs = new Map());
          const L = DM.LOOKS || {};
          for (const r of all(world, 'press', (e) => e.look && (e.look === L.reporter || e.look === L.reporter2))) {
            if (r.dead) continue;
            const until = bulbs.get(r) || 0;
            if (t < until) add(r.x + Math.cos(r.facing) * 12, r.y + Math.sin(r.facing) * 12, 190, { i: 1, color: '#ffffff', k: 0.5 });
            else if (Math.random() < dt * 0.35) bulbs.set(r, t + 0.08);
          }
        },
      },
      weather: [{ type: 'haze', n: 70, alpha: 0.075, tilt: 0.15, shaftsAt: [0.33, 0.5, 0.67] }],
    },

    // Chapter IV: Mars. Thin daylight, red dust, dust devils, cloud shadows.
    mars: {
      shadow: 'rgba(110,30,10,0.45)',
      weather: [{ type: 'dust', color: '#f4b888', devilColor: '#d08058', wind: 45, clouds: true, cloudColor: '#6e2c1a' }],
      walls: { rock: { pattern: 'rock', height: 1.3, top: '#8a3a1e', lit: '#c4683c', dark: '#56200e' } },
    },

    // Chapter V: Antarctic twilight and a blizzard outside; gold halls, braziers
    // and the purple light of the Subtractor inside.
    karnak: {
      shadow: 'rgba(80,100,160,0.36)',
      light: {
        ambient: 'rgba(34,48,96,0.32)',
        playerK: 0.16,
        zones: [
          { x: COURT.x, y: COURT.y, w: COURT.w, h: COURT.h, ambient: 'rgba(26,18,40,0.46)' },
          { x: SANCTUM.x, y: SANCTUM.y, w: SANCTUM.w, h: SANCTUM.h, ambient: 'rgba(16,6,32,0.66)' },
        ],
        lights(world, add) {
          for (const [x, y] of BRAZIERS) add(x, y, 150, { color: '#ffb84a', k: 0.2, flicker: true });
          for (const [x, y] of TORCHES) add(x, y, 130, { color: '#ffb84a', k: 0.22, flicker: true });
          const sub = find(world, 'sub', (e) => e.data && e.data.charge != null);
          const c = sub ? sub.data.charge : 0;
          add(SUB.x - 80, SUB.y, 220 + c * 380, { i: 0.75 + c * 0.25, color: '#c06bff', k: 0.18 + c * 0.4 });
          add(2250, 1000, 300, { i: 0.55, color: '#d4ad3a', k: 0.06 });
        },
      },
      weather: [
        { type: 'snow', exclude: [COURT] },
        { type: 'haze', only: COURT, n: 60, alpha: 0.05, color: '#ffe0b0' },
      ],
      walls: {
        ice: { pattern: 'ice', height: 1.1 },
        karnak: { pattern: 'gold', height: 1.5 },
        wall: { pattern: 'gold', height: 1.5 },
        pillar: { pattern: 'gold', height: 1.8 },
      },
    },
  };

  DM.Atmosphere = {
    profiles,
    get(id) {
      return (id && profiles[id]) || null;
    },
    register(id, profile) {
      profiles[id] = profile;
      return profile;
    },
    ramp,
  };
})();
</script>

<!-- chapters play in this order -->
<script>/* src/data/chapters/prologue.js */
/*
 * PROLOGUE — The Watchmaker's Son. Gila Flats, 1959.
 * Jon is still a man: walk, talk, repair Janey's watch, and go back for the coat.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const { Prop, Door } = DM.Props;
  const NPC = DM.NPC;

  const WALLS = {
    wall: { top: '#56656b', face: '#3b464b', edge: '#1d2427' },
    desk: { top: '#8a6a44', face: '#6a4f30', edge: '#3e2e1c', low: true },
    bench: { top: '#7d5d3a', face: '#5a4128', edge: '#33251a', low: true },
    console: { top: '#6f7f86', face: '#4b575c', edge: '#2a3235', low: true },
    cabinet: { top: '#7d8b72', face: '#5b6753', edge: '#2f362a' },
    counter: { top: '#d8d2c0', face: '#a39d8b', edge: '#5e594d', low: true },
  };
  const GEN = { x: 1426, y: 520 };
  const SHIRT = { body: '#9fb7c9', sleeve: '#9fb7c9' };

  function checker(g, x, y, w, h, s, a, b) {
    for (let yy = y; yy < y + h; yy += s) for (let xx = x; xx < x + w; xx += s) {
      g.fillStyle = (Math.round((xx - x) / s) + Math.round((yy - y) / s)) % 2 ? a : b;
      g.fillRect(xx, yy, Math.min(s, x + w - xx), Math.min(s, y + h - yy));
    }
  }

  function bakeFloor(g) {
    const rnd = U.seeded(59);
    g.fillStyle = '#2a2620';
    g.fillRect(0, 0, 1760, 1040);
    checker(g, 24, 440, 1092, 140, 35, '#d9d3bd', '#b9c4a8');
    g.fillStyle = '#b08658';
    g.fillRect(24, 24, 592, 416);
    g.strokeStyle = 'rgba(80,52,26,0.35)';
    g.lineWidth = 1.5;
    for (let y = 24; y < 440; y += 22) {
      g.beginPath(); g.moveTo(24, y); g.lineTo(616, y); g.stroke();
      for (let k = 0; k < 4; k++) {
        const x = 24 + rnd() * 592;
        g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 22); g.stroke();
      }
    }
    checker(g, 616, 24, 500, 416, 46, '#a3b4ab', '#93a59c');
    checker(g, 24, 580, 552, 436, 40, '#ebe3cb', '#b84a3a');
    g.fillStyle = '#7d6f5c';
    g.fillRect(576, 580, 540, 436);
    for (let i = 0; i < 2500; i++) {
      g.fillStyle = rnd() < 0.5 ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.04)';
      g.fillRect(576 + rnd() * 540, 580 + rnd() * 436, 2, 2);
    }
    // test chamber
    g.fillStyle = '#3e4950';
    g.fillRect(1116, 24, 620, 992);
    g.strokeStyle = 'rgba(0,0,0,0.25)';
    g.lineWidth = 2;
    for (let x = 1116; x < 1736; x += 62) { g.beginPath(); g.moveTo(x, 24); g.lineTo(x, 1016); g.stroke(); }
    for (let y = 24; y < 1016; y += 62) { g.beginPath(); g.moveTo(1116, y); g.lineTo(1736, y); g.stroke(); }
    for (const [r, c] of [[300, '#56646d'], [230, '#4a5860'], [150, '#56646d']]) {
      g.strokeStyle = c;
      g.lineWidth = 10;
      g.beginPath(); g.arc(GEN.x, GEN.y, r, 0, Math.PI * 2); g.stroke();
    }
    for (let i = 0; i < 9; i++) {
      g.fillStyle = i % 2 ? '#1d1d1d' : '#d8b02a';
      g.fillRect(1116 + i * 8, 440, 8, 140);
    }
    g.fillStyle = 'rgba(255,255,255,0.75)';
    g.font = '600 22px Oswald, Arial Narrow, sans-serif';
    g.fillText('TEST CHAMBER 3', 1500, 980);
  }

  // Shorthand for a flavour interactable that plays one or more dialogue lines.
  function flavor(ctx, x, y, label, lines, o = {}) {
    return ctx.add(new Prop({
      x, y, r: 4,
      draw: o.draw,
      interact: {
        label, range: o.range || 58, enabled: o.enabled,
        onInteract: () => ctx.fork(function* () { yield ctx.dialog(lines); }),
      },
    }));
  }

  function buildGila(ctx) {
    const W = ctx.newWorld({ w: 1760, h: 1040, bg: '#15120e', wallStyles: WALLS, zoom: 1.4 });
    const R = (ctx.refs = {});
    W.bake(bakeFloor);
    W.spawn = { x: 120, y: 510, facing: 0 };

    W.room(0, 0, 1760, 1040, { t: 24 });
    W.wall(24, 424, 216, 16); W.wall(330, 424, 270, 16); W.wall(600, 24, 16, 416);
    W.wall(616, 424, 184, 16); W.wall(890, 424, 210, 16);
    W.wall(1100, 24, 16, 96); W.wall(1100, 120, 16, 260, 'glass'); W.wall(1100, 380, 16, 60);
    W.wall(1100, 580, 16, 436);
    W.wall(24, 580, 216, 16); W.wall(330, 580, 230, 16); W.wall(560, 580, 16, 436);
    W.wall(576, 580, 204, 16); W.wall(870, 580, 230, 16);

    W.wall(44, 40, 240, 50, 'bench');
    W.wall(400, 200, 150, 64, 'desk');
    W.wall(28, 180, 36, 180, 'cabinet');
    W.wall(640, 40, 440, 36, 'console');
    W.wall(1050, 140, 36, 220, 'console');
    W.wall(80, 680, 130, 56, 'desk'); W.wall(80, 860, 130, 56, 'desk'); W.wall(270, 860, 130, 56, 'desk');
    W.wall(470, 640, 70, 300, 'counter');
    W.wall(600, 970, 480, 36, 'cabinet');
    W.wall(760, 760, 160, 64, 'desk');
    W.wall(1130, 230, 24, 110, 'console');

    R.door = W.add(new Door(W, 1100, 440, 16, 140, { open: true }));

    // Room signs, chalkboard, console lights.
    W.decals.push((g, world) => {
      const t = world.realTime || 0;
      g.fillStyle = '#2f4a3a';
      g.fillRect(330, 24, 220, 14);
      g.strokeStyle = 'rgba(240,240,230,0.7)';
      g.lineWidth = 1;
      for (let i = 0; i < 6; i++) Gfx.line(g, 340 + i * 34, 30, 360 + i * 34, 32);
      for (let i = 0; i < 18; i++) {
        const on = Math.sin(t * 2 + i * 1.7) > 0.2;
        g.fillStyle = on ? ['#ff5a4a', '#7bd88f', '#f2c418'][i % 3] : '#2a3235';
        g.fillRect(652 + i * 23, 52, 6, 6);
      }
      for (let i = 0; i < 8; i++) {
        const on = Math.sin(t * 3 + i) > 0;
        g.fillStyle = on ? '#7bd88f' : '#2a3235';
        g.fillRect(1062, 156 + i * 25, 6, 6);
      }
      const lbl = (s, x, y) => Gfx.text(g, s, x, y, { size: 13, color: 'rgba(30,30,30,0.55)', spacing: 3, weight: 600 });
      lbl('WORKSHOP', 470, 410);
      lbl('CONTROL', 920, 410);
      lbl('CANTEEN', 400, 1000);
      lbl('RECORDS', 960, 940);
    });

    // Workshop: workbench and flavour.
    R.bench = ctx.add(new Prop({
      x: 165, y: 108, r: 4,
      draw: (g) => {
        g.fillStyle = '#c9c2ae';
        g.fillRect(60, 50, 60, 26);
        g.fillStyle = '#d8b860';
        Gfx.circle(g, 160, 64, 9);
        g.fill();
        g.fillStyle = '#3a3a3a';
        g.fillRect(200, 56, 40, 6);
        g.fillRect(205, 68, 30, 4);
      },
      interact: {
        label: "Repair Janey's watch", range: 70,
        enabled: () => ctx.flags.hasWatch && !ctx.flags.repaired,
        onInteract: () => ctx.fork(function* () {
          ctx.lock(true);
          yield ctx.minigame(DM.Scenes.WatchRepair);
          ctx.flags.repaired = true;
          ctx.lock(false);
        }),
      },
    }));
    flavor(ctx, 440, 62, 'Read the chalkboard', [['jon', "Equations from Tuesday's seminar. Underneath, in my handwriting: 'What holds the shape of a thing together?'"]]);
    flavor(ctx, 476, 232, 'Look at the photograph', [['jon', 'A photograph from the carnival at Palisades Park. Janey is laughing at something I said. I cannot remember what it was.']], {
      draw: (g) => {
        g.fillStyle = '#f1e7cc';
        g.fillRect(464, 222, 26, 20);
        g.fillStyle = '#6b7a86';
        g.fillRect(467, 225, 20, 13);
      },
    });

    // Control room.
    R.wally = ctx.add(new NPC({
      x: 960, y: 250, look: 'wally', facing: 0,
      talk: () => ctx.fork(function* () {
        if (ctx.flags.lockdown) return;
        yield ctx.dialog(ctx.flags.calibrated
          ? [['wally', "Thanks, Jon. Glass says the test runs itself tonight. Fully automatic. Isn't that something?"]]
          : [['wally', "Jon! Glass is in a mood. Big test tonight."], ['wally', "Did you fix Janey's watch yet? Everyone knows you're sweet on her, you know."]]);
      }),
    }));
    R.glass = ctx.add(new NPC({
      x: 870, y: 330, look: 'glass', facing: 0,
      talk: () => ctx.fork(function* () {
        if (ctx.flags.lockdown) return;
        yield ctx.dialog([['glass', 'Intrinsic fields, Jon. Take away what holds a thing together and what is left? Nothing. Or everything. We are close to knowing which.']]);
      }),
    }));

    // Canteen.
    R.janey = ctx.add(new NPC({ x: 330, y: 770, look: 'janey', facing: -Math.PI / 2, talk: () => ctx.fork(janeyTalk) }));
    flavor(ctx, 505, 700, 'Pour a coffee', [['jon', 'The coffee at Gila Flats is famous. Not for good reasons.']]);
    flavor(ctx, 145, 708, 'Listen to the radio', [['jon', '"...the Soviet Premier said today that his country\'s rockets..." I turn it down.']], {
      draw: (g) => {
        g.fillStyle = '#6b3a24';
        g.fillRect(132, 696, 26, 16);
        g.fillStyle = '#e8d27a';
        g.fillRect(136, 700, 10, 8);
      },
    });

    // Records.
    flavor(ctx, 840, 792, 'Read the magazine', [['jon', "A copy of Time. The cover asks whether there will be a nuclear war. Somebody has answered in pencil: 'Probably.'"]], {
      draw: (g) => {
        g.fillStyle = '#c4302b';
        g.fillRect(826, 780, 26, 32);
        g.fillStyle = '#f1e7cc';
        g.fillRect(830, 790, 18, 18);
      },
    });
    flavor(ctx, 840, 950, 'Check the files', [['jon', 'Thirty years of intrinsic field research, alphabetised by Wally. Under W, he has filed his lunch.']]);

    // Test chamber: generator, calibration panel, coat hook, and lockdown flavour.
    R.gen = ctx.add(new Prop({
      x: GEN.x, y: GEN.y, r: 4, data: { power: 0 },
      draw: (g, e, world) => {
        const t = world.realTime || 0;
        const pw = e.data.power;
        g.save();
        g.translate(GEN.x, GEN.y);
        g.strokeStyle = '#8a969e';
        g.lineWidth = 6;
        Gfx.circle(g, 0, 0, 96);
        g.stroke();
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2 + t * (0.2 + pw * 3);
          g.fillStyle = '#5c6870';
          g.fillRect(Math.cos(a) * 96 - 9, Math.sin(a) * 96 - 9, 18, 18);
        }
        g.restore();
        Gfx.glow(g, GEN.x, GEN.y, 120 + pw * 260, '#5fd4ff', 0.12 + pw * 0.7);
        if (pw > 0.05) {
          g.save();
          g.globalCompositeOperation = 'lighter';
          g.strokeStyle = `rgba(160,230,255,${Math.min(1, pw)})`;
          g.lineWidth = 2;
          for (let i = 0; i < 3; i++) {
            Gfx.circle(g, GEN.x, GEN.y, ((t * 120 * (1 + pw) + i * 100) % 300) + 20);
            g.stroke();
          }
          g.restore();
        }
      },
    }));
    R.panel = ctx.add(new Prop({
      x: 1178, y: 285, r: 4,
      interact: {
        label: 'Calibrate the generator', range: 60,
        enabled: () => !ctx.flags.calibrated || ctx.flags.lockdown,
        onInteract: () => ctx.fork(function* () {
          if (ctx.flags.lockdown) {
            yield ctx.dialog([['jon', 'LOCKED OUT. The sequence is running itself, exactly as designed.']]);
            return;
          }
          if (!ctx.flags.repaired) {
            yield ctx.dialog([['jon', "Not yet. Wally hasn't run the pre-checks."]]);
            return;
          }
          ctx.lock(true);
          yield ctx.dialog([['jon', "It's warm in here. I hang my coat on the hook by the generator. Janey's watch is in the pocket."]]);
          ctx.flags.coatHung = true;
          Object.assign(ctx.player.look, SHIRT);
          DM.Audio.play('gear');
          yield ctx.wait(0.4);
          yield ctx.narrate('Calibration nominal. Field coherence: ninety-nine point nine seven percent.', { dur: 3.5 });
          ctx.flags.calibrated = true;
          ctx.lock(false);
        }),
      },
    }));
    R.coat = ctx.add(new Prop({
      x: 1700, y: 520, r: 4,
      draw: (g) => {
        g.fillStyle = '#3a3a3a';
        g.fillRect(1714, 512, 10, 16);
        if (!ctx.flags.coatHung || ctx.flags.gotCoat) return;
        g.fillStyle = '#ebe7dc';
        g.beginPath();
        g.moveTo(1716, 500); g.lineTo(1690, 506); g.lineTo(1682, 540); g.lineTo(1716, 544);
        g.closePath();
        g.fill();
        g.strokeStyle = '#b9b4a6';
        g.stroke();
      },
      interact: {
        label: 'Take your coat', range: 64,
        enabled: () => ctx.flags.needCoat && !ctx.flags.gotCoat,
        onInteract: () => {
          ctx.flags.gotCoat = true;
          ctx.player.look = Object.assign({}, DM.LOOKS.jon);
          DM.Audio.play('ui_select');
        },
      },
    }));
    flavor(ctx, 1132, 510, 'Try the door', [['jon', 'It does not move. It was designed not to.']], { enabled: () => ctx.flags.lockdown, range: 60 });
    flavor(ctx, 1136, 180, 'Look through the window', [['jon', 'Wally is shouting something. The glass is three inches thick.']], { enabled: () => ctx.flags.lockdown, range: 60 });

    return W;
  }

  function* janeyTalk(ctx) {
    const f = ctx.flags;
    if (f.lockdown) return;
    if (!f.metJaney) {
      yield ctx.dialog([
        ['janey', 'Jon! Look at this. Somebody stepped on it at the carnival. It\'s ruined.'],
        ['jon', 'May I? ...The balance wheel has come loose, and the crystal is cracked. It isn\'t ruined.'],
        ['janey', 'You can fix it? Really?'],
        ['jon', 'My father repaired watches. I still remember how. Give me an hour.'],
        ['janey', "You're sweet, Jon Osterman. Don't let anyone tell you otherwise."],
      ]);
      f.metJaney = true;
      f.hasWatch = true;
    } else if (!f.repaired) {
      yield ctx.dialog([['janey', "Take your time. It's only a watch."]]);
    } else if (!f.calibrated) {
      yield ctx.dialog([['jon', "It's fixed. I'll bring it by as soon as I've seen to the generator."], ['janey', 'Go on, then. Glass hates waiting.']]);
    } else if (!f.needCoat) {
      yield ctx.dialog([
        ['jon', 'Janey, your watch— '],
        ['jon', "...It's in my coat. I left my coat in the test chamber."],
        ['janey', "Then go and get it, silly. I'll be right here."],
      ]);
      f.needCoat = true;
    } else {
      yield ctx.dialog([['janey', "Go on. I'll wait."]]);
    }
  }

  DM.Chapters.register({
    id: 'prologue',
    numeral: 'PROLOGUE',
    title: "The Watchmaker's Son",
    date: 'August 1959',
    place: 'Gila Flats, Arizona',
    clock: 12,
    color: '#b8901e',
    music: 'prologue',
    form: 'human',
    epigraph: { text: 'If only I had known, I should have become a watchmaker.', by: 'Albert Einstein' },
    intro: [
      '1945. My father repairs watches. When the news comes from Hiroshima, he sweeps his gears into a box and tells me the future belongs to physics. I believe him.',
      '1959. I am thirty years old. I study intrinsic fields at Gila Flats, Arizona: the force that holds a thing in its shape.',
      'In a few days, that force will let go of me. Today, I am late for lunch.',
    ],
    maps: { gila: buildGila },
    stages: [
      {
        id: 'lunch',
        map: 'gila',
        run: function* (ctx) {
          // Jon can walk from the first frame; the scene-setting caption plays over it.
          ctx.lock(false);
          ctx.tutorial('Move with W A S D or the arrow keys. Press E to talk and interact.', 12);
          yield ctx.wait(0.6);
          yield ctx.narrate('Gila Flats Research Base. The desert holds its heat long after sundown. Janey said she would be in the canteen.');
          ctx.objective('Find Janey in the canteen');
          ctx.marker(ctx.refs.janey.x, ctx.refs.janey.y, 'JANEY');
          yield ctx.until(() => ctx.flags.metJaney && !ctx.scene.dialog.active);
          ctx.objectiveDone();
          ctx.marker(null);
          yield ctx.wait(1.2);
          ctx.objective('Repair the watch at your workbench');
          ctx.marker(ctx.refs.bench.x, ctx.refs.bench.y, 'WORKBENCH');
          yield ctx.until(() => ctx.flags.repaired);
          ctx.objectiveDone();
          ctx.marker(null);
          yield ctx.narrate('Gears, springs, a balance wheel. Everything in its place and its time. It is the last thing I will ever build with my hands.', { dur: 6 });
        },
        restore(ctx) {
          Object.assign(ctx.flags, { metJaney: true, hasWatch: true, repaired: true });
        },
      },
      {
        id: 'calibrate',
        checkpoint: true,
        run: function* (ctx) {
          yield ctx.wait(0.6);
          yield ctx.dialog([['wally', "Jon? It's Wally. Glass wants the field generator calibrated before tonight's test. Could you check the panel in the test chamber? Door's open.", { name: 'Wally Weaver — Intercom' }]]);
          ctx.objective('Calibrate the generator in the Test Chamber');
          ctx.marker(ctx.refs.panel.x, ctx.refs.panel.y, 'PANEL');
          yield ctx.until(() => ctx.flags.calibrated);
          ctx.objectiveDone();
          ctx.marker(null);
        },
        restore(ctx) {
          Object.assign(ctx.flags, { coatHung: true, calibrated: true });
          Object.assign(ctx.player.look, SHIRT);
        },
      },
      {
        id: 'coat',
        run: function* (ctx) {
          yield ctx.wait(1);
          ctx.objective('Bring Janey her watch');
          ctx.marker(ctx.refs.janey.x, ctx.refs.janey.y, 'JANEY');
          yield ctx.until(() => ctx.flags.needCoat && !ctx.scene.dialog.active);
          ctx.objectiveDone();
          yield ctx.wait(0.8);
          ctx.objective('Fetch your coat from the Test Chamber');
          ctx.marker(ctx.refs.coat.x, ctx.refs.coat.y, 'COAT');
          yield ctx.until(() => ctx.flags.gotCoat);
          ctx.marker(null);
        },
        restore(ctx) {
          Object.assign(ctx.flags, { needCoat: true, gotCoat: true });
          ctx.player.look = Object.assign({}, DM.LOOKS.jon);
        },
      },
      {
        id: 'accident',
        checkpoint: true,
        run: function* (ctx) {
          const R = ctx.refs, W = ctx.world, P = ctx.player;
          ctx.objective(null);
          if (ctx.startedHere) ctx.place(1600, 520, Math.PI);
          R.door.setOpen(false);
          W.camera.shake(0.5);
          ctx.flags.lockdown = true;
          ctx.music('tension');
          ctx.fork(function* () {
            W.alarm = true; // rotating beacons, drawn by the lighting layer
            while (!ctx.flags.flashed) {
              DM.Audio.play('alarm');
              // REDUCED flashing: a steady, dimmer red instead of a blinking one.
              const steady = DM.SettingsSchema.reducedFlashing();
              W.tint = steady ? 'rgba(255,40,30,0.065)' : 'rgba(255,40,30,0.13)';
              yield ctx.wait(0.42);
              if (!steady) W.tint = null;
              yield ctx.wait(0.43);
            }
            W.alarm = false;
            W.tint = null;
          });
          R.wally.walkTo(1074, 230);
          R.glass.walkTo(1074, 300);
          yield ctx.wait(0.9);
          yield ctx.dialog([
            ['wally', "Jon! The door— it's sealed! The time lock's engaged!"],
            ['glass', "The test program has started. It's automatic, Jon. It cannot be interrupted. I'm so sorry."],
            ['jon', 'Yes. I see.'],
          ]);
          ctx.objective('Find a way out');
          ctx.fork(function* () {
            yield ctx.wait(7);
            ctx.narrate("Janey's watch is ticking in my coat pocket. I fixed it this morning. It keeps perfect time.", { dur: 5.5 });
          });
          ctx.fork(function* () {
            const t0 = W.realTime;
            while (!ctx.flags.flashed) {
              R.gen.data.power = Math.min(1, (W.realTime - t0) / 16);
              yield;
            }
          });
          yield ctx.countdown(16, 'INTRINSIC FIELD GENERATOR ENGAGING');
          ctx.objective(null);
          ctx.lock(true);
          ctx.cinematic(true);
          DM.Audio.play('flash');
          R.gen.data.power = 1.6;
          for (let i = 0; i < 36; i++) {
            W.particles.implode(P.x, P.y, 220 - i * 4, 6, { life: 0.3, color: '#ffffff' });
            W.camera.shake(0.08);
            yield ctx.wait(0.05);
          }
          ctx.flash('#ffffff', 3.5);
          P.hidden = true;
          W.particles.burst(P.x, P.y, 260, { color: ['#7fe3ff', '#ffffff', '#ecc8a6', '#ebe7dc'], speed: [60, 620], life: [0.8, 2.6], size: [1.5, 4], drag: 1.2 });
          ctx.flags.flashed = true;
          yield ctx.wait(2.8);
          ctx.music('void');
          yield ctx.narrate('August 1959. I am taken apart.', { dur: 4 });
        },
      },
    ],
  });
})();
</script>
<script>/* src/data/chapters/reassembly.js */
/*
 * CHAPTER I — Reassembly. Gila Flats, 1959–1960.
 * Jon is a single point of awareness. Gather scattered atoms, bring them back
 * to the chamber, and rebuild a body one system at a time.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const { Atom, Vortex, BodyForm } = DM.Special;
  const C = { x: 1200, y: 1200 };

  const LAYERS = [
    { name: 'nervous system', quota: 30, carry: 20, pull: 85, vortices: 1, text: 'November 10th, 1959. A nervous system flickers in the test chamber for eleven seconds, then is gone. The guards are told it was a malfunction.' },
    { name: 'circulatory system', quota: 40, carry: 25, pull: 100, vortices: 2, text: 'December 1959. A circulatory system, beating around nothing. Somebody screams. They hang curtains over the observation window.' },
    { name: 'skeleton', quota: 45, carry: 30, pull: 115, vortices: 3, text: 'February 1960. A skeleton, partly muscled, takes two steps and falls apart. I am learning.' },
    { name: 'musculature', quota: 55, carry: 35, pull: 130, vortices: 4, text: 'March 1960. I have remembered everything but my skin. I decide on something simpler.' },
  ];

  function bakeVoid(g) {
    const rnd = U.seeded(1960);
    g.fillStyle = '#03050a';
    g.fillRect(0, 0, 2400, 2400);
    for (let i = 0; i < 40; i++) {
      const x = rnd() * 2400, y = rnd() * 2400, r = 100 + rnd() * 320;
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, `rgba(30,60,130,${0.05 + rnd() * 0.07})`);
      gr.addColorStop(1, 'rgba(30,60,130,0)');
      g.fillStyle = gr;
      g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    for (let i = 0; i < 1800; i++) {
      g.fillStyle = `rgba(200,230,255,${rnd() * 0.55})`;
      const s = rnd() * 1.8;
      g.fillRect(rnd() * 2400, rnd() * 2400, s, s);
    }
    g.strokeStyle = 'rgba(127,227,255,0.07)';
    g.lineWidth = 2;
    for (let k = -620; k <= 620; k += 62) {
      Gfx.line(g, C.x + k, C.y - 620, C.x + k, C.y + 620);
      Gfx.line(g, C.x - 620, C.y + k, C.x + 620, C.y + k);
    }
    for (const r of [300, 230]) {
      g.strokeStyle = 'rgba(127,227,255,0.1)';
      g.lineWidth = 8;
      Gfx.circle(g, C.x, C.y, r);
      g.stroke();
    }
  }

  function spawnCluster(W) {
    const a = U.rand(0, Math.PI * 2), d = U.rand(380, 1050);
    const cx = U.clamp(C.x + Math.cos(a) * d, 80, W.w - 80), cy = U.clamp(C.y + Math.sin(a) * d, 80, W.h - 80);
    const n = U.randInt(5, 9);
    for (let i = 0; i < n; i++) W.add(new Atom(cx + U.rand(-55, 55), cy + U.rand(-55, 55)));
  }

  function buildVoid(ctx) {
    const W = ctx.newWorld({ w: 2400, h: 2400, bg: '#03050a', zoom: 1.05 });
    W.bake(bakeVoid);
    W.spawn = { x: C.x, y: C.y + 260, facing: -Math.PI / 2 };
    const body = W.add(new BodyForm(C.x, C.y, { H: 260, depositR: 130 }));
    body.bank = 0;
    body.quota = 1;
    body.layerIndex = 0;
    ctx.refs = { body };
    for (let i = 0; i < 18; i++) spawnCluster(W);
    return W;
  }

  // Move atoms from Jon into the body while he is inside the chamber ring.
  function* depositLoop(ctx) {
    const body = ctx.refs.body;
    while (!ctx.flags.reassembled) {
      const P = ctx.player, W = ctx.world;
      if (P.form === 'awareness' && P.carry > 0 && !P.locked && U.dist(P.x, P.y, body.x, body.y) < body.depositR && body.bank < body.quota) {
        P.carry--;
        body.bank++;
        body.pulse = 0.35;
        body.layers[body.layerIndex] = Math.min(0.999, body.bank / body.quota);
        W.particles.emit(P.x, P.y, { vx: (body.x - P.x) * 2.4, vy: (body.y - 40 - P.y) * 2.4, life: 0.42, size: 3, size1: 1, color: '#bff1ff', drag: 0 });
        DM.Audio.play('deposit');
        yield ctx.wait(0.04);
      } else yield;
    }
  }

  function* spawner(ctx) {
    while (!ctx.flags.reassembled) {
      const W = ctx.world;
      let n = 0;
      for (const e of W.entities) if (e instanceof Atom) n++;
      if (n < 130) spawnCluster(W);
      yield ctx.wait(0.35);
    }
  }

  DM.Chapters.register({
    id: 'reassembly',
    numeral: 'CHAPTER I',
    title: 'Reassembly',
    date: 'November 1959',
    place: 'Gila Flats, Arizona',
    clock: 10,
    color: '#1b4f8a',
    music: 'void',
    introMusic: 'void',
    form: 'awareness',
    epigraph: { text: 'Nothing is lost, nothing is created, everything is transformed.', by: 'Antoine Lavoisier' },
    intro: [
      'There is no body to bury. They hold a funeral anyway. Wally helps carry an empty coffin.',
      'But a pattern does not stop being a pattern because it has been scattered. I am still here, in pieces, spread through the chamber.',
      'Slowly, I begin to remember what shape I used to be.',
    ],
    maps: { void: buildVoid },
    stages: [
      {
        id: 'gather',
        map: 'void',
        grants: ['coalesce'],
        run: function* (ctx) {
          const P = ctx.player, body = ctx.refs.body;
          ctx.setForm('awareness');
          ctx.lock(true);
          ctx.focus(C.x, C.y);
          yield ctx.wait(1.2);
          yield ctx.narrate('Nothing. And then less than nothing: a pattern, scattered across the chamber, remembering its own shape.');
          yield ctx.unlock('coalesce');
          ctx.focus(null);
          ctx.lock(false);
          ctx.hint('Drift near your atoms to gather them. Hold LEFT CLICK to widen your pull.', 9);
          ctx.fork(depositLoop);
          ctx.fork(spawner);
          ctx.fork(function* () {
            yield ctx.until(() => P.carry >= P.carryMax);
            ctx.hint('You cannot hold any more. Return to the chamber at the centre to rebuild yourself.', 8);
            ctx.marker(C.x, C.y + 130, 'CHAMBER');
            yield ctx.until(() => body.bank > 0);
            ctx.marker(null);
          });
          let warned = false;
          ctx.on('vortex:hit', () => {
            if (warned) return;
            warned = true;
            ctx.hint('Entropy. It tears loose whatever you are carrying. Keep clear of the dark.', 7);
          });

          for (let i = 0; i < LAYERS.length; i++) {
            const L = LAYERS[i];
            P.carryMax = L.carry;
            P.basePull = L.pull;
            body.layerIndex = i;
            body.bank = 0;
            body.quota = L.quota;
            let v = ctx.world.entities.filter((e) => e instanceof Vortex).length;
            for (; v < L.vortices; v++) {
              const a = U.rand(0, Math.PI * 2);
              ctx.add(new Vortex(C.x + Math.cos(a) * 750, C.y + Math.sin(a) * 750, { home: { x: C.x, y: C.y, r: 260 }, speed: 40 + i * 8 }));
            }
            ctx.objective(`Rebuild your ${L.name}`, () => `${body.bank}/${L.quota}`);
            yield ctx.until(() => body.bank >= L.quota);
            body.layers[i] = 1;
            ctx.objectiveDone();
            DM.Audio.play('layer');
            ctx.flash('#bff1ff', 0.6);
            ctx.world.camera.shake(0.25);
            ctx.narrate(L.text, { dur: 7 });
            yield ctx.wait(1.5);
          }

          ctx.flags.reassembled = true;
          ctx.lock(true);
          ctx.objective(null);
          const W = ctx.world;
          for (const e of W.entities) {
            if (e instanceof Vortex || e instanceof Atom) {
              W.particles.burst(e.x, e.y, 6, { color: ['#7fe3ff', '#ffffff'], speed: [20, 90], life: [0.3, 0.7], size: [1.5, 3] });
              e.dead = true;
            }
          }
          ctx.focus(body.x, body.y);
          const sx = P.x, sy = P.y;
          // Timed in seconds, not frames, so it plays the same at 60, 120 or 240 Hz.
          yield ctx.tween(1.15, (k) => {
            const e = U.ease.inOutCubic(k);
            P.x = U.lerp(sx, body.x, e);
            P.y = U.lerp(sy, body.y - 60, e);
          });
          P.hidden = true;
          DM.Audio.play('unlock');
          yield ctx.tween(1.25, (k) => (body.skin = k));
          ctx.flash('#dff7ff', 1.6);
          W.camera.shake(0.5);
          ctx.setForm('manhattan');
          body.dead = true;
          P.hidden = false;
          P.x = body.x;
          P.y = body.y;
          P.facing = Math.PI / 2;
          W.particles.burst(P.x, P.y, 120, { color: ['#7fe3ff', '#ffffff', '#5fd4ff'], speed: [80, 420], life: [0.5, 1.4], size: [1.5, 3.5], drag: 2 });
          yield ctx.wait(1.4);
          yield ctx.narrate('April 1960. I walk out of the test chamber.', { dur: 3.5 });
          yield ctx.banner('DR. MANHATTAN', 'GILA FLATS · APRIL 1960', { dur: 3.6 });
        },
        restore(ctx) {
          ctx.flags.reassembled = true;
          ctx.setForm('manhattan');
          ctx.player.hidden = false;
          if (ctx.refs.body) ctx.refs.body.dead = true;
          for (const e of ctx.world.entities) if (e instanceof Vortex || e instanceof Atom) e.dead = true;
          ctx.place(C.x, C.y, Math.PI / 2); // where the new body stood up
        },
      },
      {
        id: 'naming',
        checkpoint: true,
        run: function* (ctx) {
          ctx.lock(true);
          ctx.focus(null);
          yield ctx.wait(0.5);
          yield ctx.dialog([
            ['colonel', "Doctor... Osterman? Colonel Hart, Army liaison. The President's people asked me to tell you they've chosen a name for you."],
            ['colonel', "'Doctor Manhattan.' It's meant to make certain people in Moscow very nervous."],
            ['manhattan', 'Manhattan. After the bomb.'],
            ['colonel', "After what it stands for. We had a symbol drawn up, too. An atom, with the little orbits—"],
            ['manhattan', 'No. If I am to wear a symbol, it will be one I respect.'],
            ['manhattan', 'Hydrogen. One proton, one electron. The simplest thing there is.'],
          ]);
          yield ctx.narrate('I draw it on my forehead myself. It is the last decision I make for a long time that feels like mine.', { dur: 5.5 });
        },
      },
    ],
  });
})();
</script>
<script>/* src/data/chapters/superman.js */
/*
 * CHAPTER II — The Superman Exists. Nevada test range, 1960; New York, 1966.
 * Learn Telekinesis and Disintegration, then raid a mob warehouse. Thrown
 * gangsters are knocked out (spared); disintegrated ones are not.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const { Crate, Barrel, Vehicle, Prop, Zone, Dummy } = DM.Props;
  const { Gangster } = DM.Enemies;
  const NPC = DM.NPC;

  // ---- Test range ------------------------------------------------------------
  const RANGE_WALLS = {
    sandbag: { top: '#b49a64', face: '#8a7448', edge: '#5a4a2a', low: true },
    concrete: { top: '#b8b2a4', face: '#8a8478', edge: '#5a564e' },
  };

  function bakeRange(g) {
    const rnd = U.seeded(1960);
    g.fillStyle = '#cfa86c';
    g.fillRect(0, 0, 2000, 1300);
    for (let i = 0; i < 9000; i++) {
      g.fillStyle = rnd() < 0.5 ? 'rgba(120,80,40,0.08)' : 'rgba(255,240,200,0.08)';
      g.fillRect(rnd() * 2000, rnd() * 1300, 3, 3);
    }
    g.strokeStyle = 'rgba(255,240,210,0.25)';
    g.lineWidth = 3;
    for (let i = 0; i < 14; i++) {
      const y = rnd() * 1300;
      g.beginPath();
      g.moveTo(0, y);
