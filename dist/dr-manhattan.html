      g.bezierCurveTo(600, y + rnd() * 80 - 40, 1300, y + rnd() * 80 - 40, 2000, y + rnd() * 60 - 30);
      g.stroke();
    }
    g.strokeStyle = 'rgba(90,60,30,0.25)';
    g.lineWidth = 5;
    g.setLineDash([10, 8]);
    for (const off of [0, 22]) {
      g.beginPath();
      g.moveTo(300, 1300);
      g.bezierCurveTo(500, 900 + off, 900, 1000 + off, 1100, 600 + off);
      g.stroke();
    }
    g.setLineDash([]);
    g.fillStyle = '#a8a294';
    g.fillRect(120, 120, 340, 280);
    g.fillStyle = 'rgba(0,0,0,0.12)';
    g.font = '700 28px Oswald, Arial Narrow, sans-serif';
    g.fillText('U.S. ARMY · RANGE 4', 140, 390);
  }

  function buildRange(ctx) {
    const W = ctx.newWorld({ w: 2000, h: 1300, bg: '#b8945c', wallStyles: RANGE_WALLS, zoom: 1.25 });
    W.bake(bakeRange);
    W.spawn = { x: 500, y: 480, facing: 0 };
    W.room(0, 0, 2000, 1300, { t: 20, kind: 'concrete' });
    W.wall(150, 360, 280, 26, 'sandbag');
    W.wall(420, 150, 26, 236, 'sandbag');
    W.wall(160, 150, 110, 70, 'concrete');
    W.wall(980, 260, 30, 140, 'concrete');
    W.wall(1100, 900, 140, 30, 'concrete');
    W.wall(1260, 640, 30, 120, 'concrete');
    const R = (ctx.refs = {});
    ctx.add(new NPC({ x: 250, y: 290, look: 'colonel', facing: 0 }));
    ctx.add(new NPC({ x: 330, y: 300, look: 'glass', facing: 0 }));
    for (let i = 0; i < 7; i++) ctx.add(new Crate(620 + (i % 4) * 46 + U.rand(-6, 6), 560 + Math.floor(i / 4) * 52, { style: i % 3 ? 'wood' : 'metal' }));
    R.zone = ctx.add(new Zone(1460, 420, 110, { label: 'TARGET ZONE' }));
    R.jeep = ctx.add(new Vehicle(760, 960, { kind: 'jeep', hp: null, disintegratable: false, rot: -0.3 }));
    R.dummies = [
      [1560, 900], [1700, 1010], [1830, 860], [1640, 1160],
    ].map(([x, y]) => ctx.add(new Dummy(x, y)));
    R.dummies.push(
      ctx.add(new Dummy(1500, 1060, { rail: { dx: 0, dy: 90, speed: 1.2 } })),
      ctx.add(new Dummy(1760, 740, { rail: { dx: 110, dy: 0, speed: 1 } })),
      ctx.add(new Dummy(1890, 1110, { rail: { dx: 0, dy: 100, speed: 1.5 } })),
      ctx.add(new Dummy(1590, 760, { rail: { dx: 80, dy: 0, speed: 1.8 } })),
    );
    return W;
  }

  // ---- Pier 9 ----------------------------------------------------------------
  const PIER_WALLS = {
    brick: { top: '#6b3a2e', face: '#4a281f', edge: '#2a1712' },
    shelf: { top: '#5a5248', face: '#3e3830', edge: '#211d18' },
    rust: { top: '#8a3a26', face: '#62291b', edge: '#33150d' },
    navy: { top: '#2e4f7a', face: '#203856', edge: '#111e2e' },
    moss: { top: '#3b6b4a', face: '#294b34', edge: '#142519' },
    water: { top: 'rgba(0,0,0,0)', face: null, edge: null, low: true, flat: true },
    desk: { top: '#6a4f30', face: '#4e3a23', edge: '#2e2214', low: true },
  };

  function bakePier(g) {
    const rnd = U.seeded(1966);
    g.fillStyle = '#2b2d33';
    g.fillRect(0, 0, 2200, 1400);
    for (let i = 0; i < 9000; i++) {
      g.fillStyle = rnd() < 0.5 ? 'rgba(0,0,0,0.12)' : 'rgba(255,255,255,0.03)';
      g.fillRect(rnd() * 2200, rnd() * 1180, 3, 3);
    }
    for (let i = 0; i < 14; i++) {
      const x = rnd() * 2000, y = rnd() * 1100, rx = 30 + rnd() * 70;
      g.fillStyle = 'rgba(10,20,40,0.45)';
      Gfx.ellipse(g, x, y, rx, rx * 0.45);
      g.fill();
      g.strokeStyle = 'rgba(120,160,210,0.15)';
      g.stroke();
    }
    g.fillStyle = '#4a4844';
    g.fillRect(1000, 150, 1100, 750);
    for (let i = 0; i < 20; i++) {
      g.fillStyle = 'rgba(0,0,0,0.18)';
      Gfx.ellipse(g, 1050 + rnd() * 1000, 200 + rnd() * 650, 20 + rnd() * 50, 10 + rnd() * 25);
      g.fill();
    }
    g.fillStyle = '#4a3a2a';
    g.fillRect(0, 1180, 2200, 120);
    g.strokeStyle = 'rgba(0,0,0,0.35)';
    g.lineWidth = 2;
    for (let x = 0; x < 2200; x += 26) Gfx.line(g, x, 1180, x, 1300);
    g.fillStyle = '#0d1a2a';
    g.fillRect(0, 1300, 2200, 100);
    g.strokeStyle = 'rgba(120,170,220,0.18)';
    for (let i = 0; i < 40; i++) {
      const x = rnd() * 2200, y = 1310 + rnd() * 80;
      Gfx.line(g, x, y, x + 40 + rnd() * 60, y);
    }
    g.strokeStyle = 'rgba(240,220,120,0.5)';
    g.lineWidth = 4;
    g.setLineDash([30, 26]);
    Gfx.line(g, 0, 1100, 1000, 1100);
    g.setLineDash([]);
    g.save();
    g.translate(1560, 935);
    g.rotate(-0.03);
    g.font = '700 30px "Patrick Hand", "Trebuchet MS", sans-serif';
    g.fillStyle = 'rgba(230,60,50,0.85)';
    g.textAlign = 'center';
    g.fillText('WHO WATCHES THE WATCHMEN?', 0, 0);
    g.restore();
  }

  function buildPier(ctx) {
    const W = ctx.newWorld({ w: 2200, h: 1400, bg: '#16171b', wallStyles: PIER_WALLS, zoom: 1.3 });
    W.bake(bakePier);
    W.spawn = { x: 260, y: 1000, facing: 0 };
    W.room(0, 0, 2200, 1400, { t: 20, kind: 'brick' });
    W.wall(20, 1300, 2160, 80, 'water');
    W.room(1000, 150, 1100, 750, { t: 24, kind: 'brick', doors: [{ side: 'bottom', at: 350, w: 150 }, { side: 'left', at: 250, w: 120 }] });
    W.wall(1700, 174, 24, 126, 'brick');
    W.wall(1700, 380, 24, 100, 'brick');
    W.wall(1724, 456, 76, 24, 'brick');
    W.wall(1880, 456, 196, 24, 'brick');
    W.wall(1100, 300, 40, 220, 'shelf');
    W.wall(1250, 300, 40, 220, 'shelf');
    W.wall(1100, 640, 260, 36, 'shelf');
    W.wall(1460, 560, 36, 200, 'shelf');
    W.wall(1900, 200, 150, 60, 'desk');
    W.wall(500, 300, 240, 90, 'rust');
    W.wall(300, 600, 90, 240, 'navy');
    W.wall(700, 780, 240, 90, 'moss');
    W.wall(850, 430, 90, 200, 'rust');

    const lamps = [[200, 300], [200, 820], [900, 1120], [1420, 1060], [620, 560]];
    W.decals.push((g) => {
      for (const [x, y] of lamps) {
        g.fillStyle = 'rgba(255,220,140,0.06)';
        Gfx.circle(g, x, y, 170);
        g.fill();
      }
    });
    W.overlays.push((g, world) => {
      for (const [x, y] of lamps) {
        g.fillStyle = '#222';
        Gfx.circle(g, x, y, 6);
        g.fill();
        Gfx.glow(g, x, y, 60, '#ffd27a', 0.5 + Math.sin((world.realTime || 0) * 7 + x) * 0.03);
      }
    });

    ctx.add(new NPC({ x: 170, y: 1040, look: 'captain', facing: 0 }));
    ctx.add(new Vehicle(140, 930, { kind: 'sedan', paint: '#1d2b4f', mass: 6 }));
    ctx.add(new Vehicle(620, 1020, { kind: 'sedan', rot: 0.2 }));
    ctx.add(new Vehicle(1700, 1060, { kind: 'sedan', rot: -0.1 }));
    const crates = [[460, 470], [500, 470], [780, 560], [1020, 1000], [1080, 980], [1180, 420], [1600, 300], [1640, 320], [1560, 820], [1900, 700], [1960, 760], [1320, 820]];
    for (const [x, y] of crates) ctx.add(new Crate(x, y));
    for (const [x, y] of [[760, 700], [1390, 380], [1980, 620], [1820, 380]]) ctx.add(new Barrel(x, y));
    ctx.add(new Prop({
      x: 1975, y: 230, r: 4,
      draw: (g) => Gfx.smiley(g, 1975, 228, 8),
      interact: {
        label: 'Look at the badge', range: 60,
        onInteract: () => ctx.fork(function* () {
          yield ctx.dialog([['manhattan', 'A smiley-face badge, left on the desk. Somebody here has a sense of humour. I suspect I know who.']]);
        }),
      },
    }));
    return W;
  }

  function spawnGroup(ctx, list) {
    return list.map(([x, y, gun]) => ctx.add(new Gangster({ x, y, gun: gun || 'pistol', facing: U.rand(0, Math.PI * 2) })));
  }
  const down = (g) => g.filter((e) => e.neutralized).length;

  const YARD = [[700, 500], [460, 920], [980, 720], [620, 680]];
  const WAREHOUSE = [[1200, 560], [1380, 420], [1580, 700], [1650, 840], [1350, 760, 'tommy']];
  const OFFICE = [[1900, 300, 'tommy'], [2020, 400, 'tommy'], [1790, 230]];

  DM.Chapters.register({
    id: 'superman',
    numeral: 'CHAPTER II',
    title: 'The Superman Exists',
    date: '1960 – 1966',
    place: 'Nevada · New York',
    clock: 8,
    color: '#7a3b2e',
    music: 'action',
    form: 'manhattan',
    epigraph: { text: 'Now I am become Death, the destroyer of worlds.', by: 'J. Robert Oppenheimer, quoting the Bhagavad Gita' },
    intro: [
      'The Army gives me a name, a costume and a test range in the Nevada desert. I wear the costume for a while. It seems to make them comfortable.',
      'They want to know what I can do. Honestly, so do I.',
      'Within a year I am on the cover of every newspaper in the world. Within two, the Russians are building more bombs.',
    ],
    maps: { range: buildRange, pier: buildPier },
    stages: [
      {
        id: 'range',
        map: 'range',
        grants: ['telekinesis', 'disintegrate'],
        run: function* (ctx) {
          const R = ctx.refs;
          ctx.lock(true);
          yield ctx.wait(0.6);
          yield ctx.dialog([
            ['colonel', 'Doctor Manhattan. The Joint Chiefs are watching this on closed circuit. No pressure.'],
            ['glass', 'Jon, just... show them what you showed me. Gently, if you can.'],
          ]);
          yield ctx.unlock('telekinesis');
          ctx.lock(false);
          let crates = 0;
          R.zone.accept = (e) => e.tags.has('crate');
          R.zone.onAccept = () => crates++;
          ctx.objective('Throw crates into the target zone', () => `${crates}/5`);
          ctx.marker(R.zone.x, R.zone.y - R.zone.r, 'ZONE');
          ctx.fork(function* () {
            while (crates < 5) {
              let left = 0;
              for (const e of ctx.world.entities) if (e.tags.has('crate')) left++;
              if (left + crates < 5) ctx.add(new Crate(660 + U.rand(-40, 40), 600 + U.rand(-40, 40)));
              yield ctx.wait(1);
            }
          });
          yield ctx.until(() => crates >= 5);
          ctx.objectiveDone();
          ctx.marker(null);
          yield ctx.wait(1);
          yield ctx.dialog([['colonel', '...Now the jeep, Doctor. If you would.']]);
          let jeepIn = false;
          R.zone.accept = (e) => e === R.jeep;
          R.zone.onAccept = () => (jeepIn = true);
          ctx.objective('Lift the jeep into the target zone');
          ctx.hint('Heavier things move slower. Be patient with it.', 6);
          yield ctx.until(() => jeepIn);
          ctx.objectiveDone();
          yield ctx.wait(1);
          yield ctx.dialog([['colonel', 'Good God.'], ['glass', 'Show them the rest, Jon.']]);
          yield ctx.unlock('disintegrate');
          ctx.objective('Disintegrate the targets', () => `${R.dummies.filter((d) => d.dead).length}/${R.dummies.length}`);
          ctx.marker(1690, 860, 'TARGETS');
          yield ctx.until(() => R.dummies.every((d) => d.dead));
          ctx.objectiveDone();
          ctx.marker(null);
          ctx.lock(true);
          yield ctx.wait(1);
          yield ctx.dialog([
            ['glass', 'Do you understand what you just saw, Colonel? There is a superman now. And he works for the United States.'],
            ['colonel', 'I understand the Russians are about to have a very bad decade.'],
          ]);
        },
      },
      {
        id: 'yard',
        map: 'pier',
        checkpoint: true,
        run: function* (ctx) {
          ctx.lock(true);
          yield ctx.banner('NEW YORK', 'PIER 9 · 1966', { color: DM.C.yellow });
          if (ctx.startedHere || !ctx.flags.briefed) {
            yield ctx.dialog([
              ['captain', "Doctor Manhattan? Captain Rourke, NYPD. Moloch's people are running a counterfeit plant out of that warehouse. They've got my men pinned down."],
              ['captain', 'Do what you do. Just... try to leave somebody for me to arrest.'],
            ]);
            ctx.flags.briefed = true;
          }
          ctx.lock(false);
          ctx.hint('Thrown people are knocked out. Disintegrated people are gone. The choice is yours.', 9);
          const g = spawnGroup(ctx, YARD);
          ctx.objective('Clear the yard', () => `${down(g)}/${g.length}`);
          yield ctx.until(() => g.every((e) => e.neutralized));
          ctx.objectiveDone();
        },
      },
      {
        id: 'warehouse',
        checkpoint: true,
        run: function* (ctx) {
          const P = ctx.player;
          if (ctx.startedHere) ctx.place(980, 1020, -Math.PI / 2);
          yield ctx.wait(1);
          const g = spawnGroup(ctx, WAREHOUSE);
          ctx.objective('Clear the warehouse', () => `${down(g)}/${g.length}`);
          ctx.marker(1425, 900, 'WAREHOUSE');
          ctx.fork(function* () {
            yield ctx.until(() => P.y < 880 && P.x > 1000);
            ctx.marker(null);
          });
          yield ctx.until(() => g.every((e) => e.neutralized));
          ctx.objectiveDone();
          ctx.marker(null);
        },
      },
      {
        id: 'office',
        checkpoint: true,
        run: function* (ctx) {
          const P = ctx.player;
          if (ctx.startedHere) ctx.place(1420, 820, -Math.PI / 2);
          yield ctx.wait(0.8);
          const g = spawnGroup(ctx, OFFICE);
          ctx.objective('Clear the back office', () => `${down(g)}/${g.length}`);
          ctx.marker(1840, 480, 'OFFICE');
          ctx.fork(function* () {
            yield ctx.until(() => P.x > 1700 && P.y < 470);
            ctx.marker(null);
          });
          yield ctx.until(() => g.every((e) => e.neutralized));
          ctx.objectiveDone();
          ctx.marker(null);
        },
      },
      {
        id: 'aftermath',
        run: function* (ctx) {
          ctx.lock(true);
          yield ctx.wait(1);
          yield ctx.dialog([
            ['captain', "...That's the last of them. Nineteen years on the force, Doctor. I never saw anything like that.", { name: 'Captain Rourke — Radio' }],
            ['manhattan', 'Neither had I, until recently.'],
          ]);
          const s = ctx.stats;
          let line;
          if (s.disintegrated === 0) line = 'Every one of them will live to stand trial. It is a small thing. I notice that I wanted it.';
          else if (s.spared === 0) line = 'None of them will stand trial. I notice that I feel nothing about this. I notice that I notice.';
          else line = 'Some of them will stand trial. Some will not. It made no difference at all to my heart rate.';
          yield ctx.narrate(line, { dur: 6 });
          yield ctx.narrate('The next morning, every newspaper in America runs the same headline. They have found their superman.', { dur: 6 });
        },
      },
    ],
  });
})();
</script>
<script>/* src/data/chapters/deterrent.js */
/*
 * CHAPTER III — The Deterrent. Nevada Test Site, 1971–1977.
 * Teleport across a canyon and a minefield, then survive Operation Blue Fire:
 * waves of drones, tanks and missile batteries, and the Behemoth.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const { Crate, Barrel, Vehicle } = DM.Props;
  const { Drone, Tank, Battery, Behemoth } = DM.Enemies;
  const { Mine } = DM.Special;
  const NPC = DM.NPC;

  const WALLS = {
    concrete: { top: '#b8b2a4', face: '#8a8478', edge: '#5a564e' },
    sandbag: { top: '#a8905c', face: '#7e6a40', edge: '#4e4024', low: true },
    rock: { top: '#7a5a3a', face: '#5a4028', edge: '#3a2818' },
    chasm: {
      low: true,
      draw: (g, w) => {
        g.fillStyle = '#21160e';
        g.fillRect(w.x, w.y, w.w, w.h);
        g.fillStyle = '#0e0905';
        g.fillRect(w.x + w.w * 0.3, w.y, w.w * 0.4, w.h);
        g.fillStyle = '#9a7246';
        for (let y = w.y; y < w.y + w.h; y += 40) {
          const j = Math.sin(y * 0.13) * 8;
          g.fillRect(w.x - 6 + j, y, 10, 22);
          g.fillRect(w.x + w.w - 4 - j, y + 14, 10, 22);
        }
      },
    },
  };

  const CANYON = { x: 760, w: 110 };
  const POST = { x: 1450, y: 900 };

  // The minefield: a grid of cells, most of them mined. Three zig-zag lanes are
  // left clear (seeded, so every attempt is the same) with the mines beside them
  // pushed back, and a trodden path in the sand gives them away.
  const FIELD = { x: 930, y: 260, cols: 5, rows: 13, cw: 92, ch: 88 };
  const LANES = (() => {
    const rnd = U.seeded(1973);
    const cells = new Set();
    const paths = [];
    for (const start of [2, 6, 10]) {
      let r = U.clamp(start + Math.floor(rnd() * 3) - 1, 1, FIELD.rows - 2);
      const pts = [];
      for (let c = 0; c < FIELD.cols; c++) {
        cells.add(c + ',' + r);
        pts.push([c, r]);
        if (c === FIELD.cols - 1) break;
        let step = rnd() < 0.5 ? -1 : 1;
        if (r + step < 1 || r + step > FIELD.rows - 2) step = -step;
        for (let k = 1; k <= Math.abs(step); k++) {
          const rr = r + Math.sign(step) * k;
          cells.add(c + ',' + rr);
          pts.push([c, rr]);
        }
        r += step;
      }
      paths.push(pts);
    }
    return { cells, paths };
  })();
  const inLane = (c, r) => LANES.cells.has(c + ',' + r);
  // Centre of a cell's clear spot (mines sit in the top-left 50 x 40 of their cell).
  const cellCentre = (c, r) => ({ x: FIELD.x + c * FIELD.cw + 25, y: FIELD.y + r * FIELD.ch + 20 });

  function bakeProving(g) {
    const rnd = U.seeded(1971);
    g.fillStyle = '#c49a62';
    g.fillRect(0, 0, 2600, 1600);
    for (let i = 0; i < 12000; i++) {
      g.fillStyle = rnd() < 0.5 ? 'rgba(110,70,30,0.08)' : 'rgba(255,240,210,0.08)';
      g.fillRect(rnd() * 2600, rnd() * 1600, 3, 3);
    }
    for (let i = 0; i < 26; i++) {
      const x = 1450 + rnd() * 1100, y = rnd() * 1600, r = 30 + rnd() * 70;
      g.fillStyle = 'rgba(70,45,20,0.35)';
      Gfx.ellipse(g, x, y, r, r * 0.8);
      g.fill();
      g.strokeStyle = 'rgba(240,210,160,0.35)';
      g.lineWidth = 4;
      g.stroke();
    }
    for (let i = 0; i < 10; i++) {
      const x = 1500 + rnd() * 1000, y = rnd() * 1600;
      g.fillStyle = 'rgba(30,20,10,0.22)';
      Gfx.ellipse(g, x, y, 90 + rnd() * 60, 50 + rnd() * 40);
      g.fill();
    }
    g.fillStyle = 'rgba(150,40,30,0.12)';
    g.fillRect(900, 230, 420, 1140);
    g.strokeStyle = 'rgba(200,40,30,0.5)';
    g.setLineDash([16, 12]);
    g.lineWidth = 3;
    g.strokeRect(900, 230, 420, 1140);
    g.setLineDash([]);
    for (let y = 280; y < 1360; y += 180) {
      g.fillStyle = '#5a4028';
      g.fillRect(886, y, 6, 30);
      g.fillStyle = '#e8d27a';
      g.fillRect(866, y - 22, 46, 26);
      g.fillStyle = '#c4302b';
      g.font = '700 10px Oswald, Arial Narrow, sans-serif';
      g.fillText('DANGER', 870, y - 10);
      g.fillText('MINES', 874, y);
    }
    // Boot prints along the cleared lanes, and a survey stake at each end.
    for (const pts of LANES.paths) {
      for (let i = 0; i < pts.length; i++) {
        const a = cellCentre(pts[i][0], pts[i][1]);
        const b = i + 1 < pts.length ? cellCentre(pts[i + 1][0], pts[i + 1][1]) : { x: a.x + 80, y: a.y };
        const d = U.dist(a.x, a.y, b.x, b.y), ang = Math.atan2(b.y - a.y, b.x - a.x);
        for (let k = 0, n = 0; k < d; k += 13, n++) {
          const side = n % 2 ? 4 : -4;
          g.fillStyle = 'rgba(95,62,30,0.22)';
          Gfx.ellipse(g, a.x + Math.cos(ang) * k - Math.sin(ang) * side, a.y + Math.sin(ang) * k + Math.cos(ang) * side, 4, 2.4, ang);
          g.fill();
        }
      }
      const s0 = cellCentre(pts[0][0], pts[0][1]), s1 = cellCentre(pts[pts.length - 1][0], pts[pts.length - 1][1]);
      for (const [x, y] of [[s0.x - 70, s0.y], [s1.x + 70, s1.y]]) {
        g.fillStyle = '#5a4028';
        g.fillRect(x - 2, y - 18, 4, 22);
        g.fillStyle = '#f2ead8';
        g.fillRect(x + 2, y - 18, 12, 7);
      }
    }
    g.fillStyle = 'rgba(0,0,0,0.15)';
    g.font = '700 40px Oswald, Arial Narrow, sans-serif';
    g.fillText('AREA 7 · OPERATION BLUE FIRE', 1600, 80);
  }

  function buildProving(ctx) {
    const W = ctx.newWorld({ w: 2600, h: 1600, bg: '#a8824e', wallStyles: WALLS, zoom: 1.15 });
    W.bake(bakeProving);
    W.spawn = { x: 360, y: 800, facing: 0 };
    W.room(0, 0, 2600, 1600, { t: 20, kind: 'rock' });
    W.wall(CANYON.x, 20, CANYON.w, 1560, 'chasm');
    W.wall(1380, 640, 140, 110, 'concrete');
    W.wall(1360, 790, 70, 22, 'sandbag');
    W.wall(1480, 790, 70, 22, 'sandbag');
    for (const [x, y, w, h] of [[1800, 300, 120, 80], [2100, 1100, 160, 90], [1900, 780, 70, 140], [2300, 500, 100, 100], [1650, 1260, 140, 60], [2250, 1380, 90, 70], [300, 400, 120, 70], [420, 1200, 90, 110]]) W.wall(x, y, w, h, 'rock');

    const rnd = U.seeded(7);
    for (let c = 0; c < FIELD.cols; c++) {
      for (let r = 0; r < FIELD.rows; r++) {
        if (rnd() < 0.22) continue;
        let u = rnd() * 50, v = rnd() * 40;
        if (inLane(c, r)) continue;
        // Beside a lane, the mine sits at the far side of its cell.
        if (inLane(c + 1, r)) u = 0;
        else if (inLane(c - 1, r)) u = 50;
        if (inLane(c, r + 1)) v = 0;
        else if (inLane(c, r - 1)) v = 40;
        if (c === 0) u = Math.max(u, 40); // the canyon edge stays walkable, to pick a lane from
        ctx.add(new Mine(FIELD.x + c * FIELD.cw + u, FIELD.y + r * FIELD.ch + v));
      }
    }
    ctx.add(new NPC({ x: 1450, y: 840, look: 'general', facing: Math.PI / 2 }));
    for (const [x, y, k] of [[1700, 620, 'wreck'], [2000, 1010, 'wreck'], [2220, 300, 'wreck'], [560, 980, 'jeep']]) ctx.add(new Vehicle(x, y, { kind: k, mass: 6, hp: 300, rot: rnd() * 3 }));
    for (const [x, y] of [[1660, 900], [1700, 930], [2150, 700], [2400, 1300], [1980, 560], [1600, 420]]) ctx.add(new Crate(x, y, { style: 'metal' }));
    for (const [x, y] of [[1760, 1120], [2060, 460], [2380, 900]]) ctx.add(new Barrel(x, y));
    return W;
  }

  function edgeSpot(W, r) {
    for (let i = 0; i < 30; i++) {
      const x = U.rand(2360, 2540), y = U.rand(160, 1440);
      if (W.isFree(x, y, r)) return { x, y };
    }
    return { x: 2480, y: 800 };
  }

  function spawnWave(ctx, spec) {
    const W = ctx.world;
    const out = [];
    for (let i = 0; i < (spec.drones || 0); i++) {
      const p = edgeSpot(W, 14);
      out.push(ctx.add(new Drone({ x: p.x, y: p.y, sight: 2400, alerted: true })));
    }
    for (let i = 0; i < (spec.tanks || 0); i++) {
      const p = edgeSpot(W, 32);
      out.push(ctx.add(new Tank({ x: p.x, y: p.y, sight: 1800, needLos: false, facing: Math.PI })));
    }
    for (const [x, y] of spec.batteries || []) out.push(ctx.add(new Battery({ x, y })));
    for (const e of out) W.particles.burst(e.x, e.y, 14, { color: ['#e8d27a', '#ffffff'], speed: [40, 160], life: [0.2, 0.5], size: [2, 3] });
    return out;
  }

  function* runWaves(ctx, from, specs) {
    for (let i = 0; i < specs.length; i++) {
      const n = from + i;
      yield ctx.banner(`WAVE ${n}`, specs[i].title, { dur: 2.2, color: DM.C.orange });
      const enemies = spawnWave(ctx, specs[i]);
      ctx.objective('Break Operation Blue Fire', () => `Wave ${n}/5 · ${enemies.filter((e) => !e.dead).length} left`);
      if (specs[i].hint) ctx.hint(specs[i].hint, 8);
      yield ctx.until(() => enemies.every((e) => e.dead));
      ctx.objectiveDone();
      yield ctx.wait(1.6);
    }
  }

  DM.Chapters.register({
    id: 'deterrent',
    numeral: 'CHAPTER III',
    title: 'The Deterrent',
    date: '1971 – 1977',
    place: 'Nevada Test Site',
    clock: 5,
    color: '#5f6a2a',
    music: 'action',
    form: 'manhattan',
    epigraph: { text: 'I know not with what weapons World War III will be fought, but World War IV will be fought with sticks and stones.', by: 'Albert Einstein' },
    intro: [
      '1971. The war in Vietnam ends in a week. I am the reason. Whole units surrender to me personally; some of them try to touch me, as though I were a god.',
      'At home, the Soviets answer me with warheads. Every missile they build, they build because of me.',
      'The Pentagon wants proof that nothing on Earth can stop me. They will spend a great deal of money finding out.',
    ],
    maps: { proving: buildProving },
    // The minefield layout, for tests and tools: lane paths as [col, row] cells.
    minefield: { field: FIELD, lanes: LANES.paths, centre: cellCentre },
    stages: [
      {
        id: 'blink',
        map: 'proving',
        grants: ['teleport'],
        run: function* (ctx) {
          const P = ctx.player;
          ctx.lock(true);
          yield ctx.wait(0.6);
          yield ctx.dialog([
            ['general', 'Doctor. Operation Blue Fire: everything this country has, pointed at one man. Congress wants to know whether you can be stopped.'],
            ['manhattan', 'And if I can?'],
            ['general', 'Then I sleep better. Get across that canyon. We start when you reach my bunker.'],
          ]);
          yield ctx.unlock('teleport');
          ctx.lock(false);
          ctx.objective('Cross the canyon');
          ctx.marker(CANYON.x + CANYON.w + 60, 800, 'ACROSS');
          yield ctx.until(() => P.x > CANYON.x + CANYON.w + 10);
          ctx.objectiveDone();
          ctx.marker(POST.x, POST.y, 'COMMAND POST');
          yield ctx.wait(0.6);
          ctx.objective('Reach the command post');
          ctx.hint('A minefield. You could pick your way through. Or you could not walk at all.', 8);
          yield ctx.until(() => U.dist(P.x, P.y, POST.x, POST.y) < 90);
          ctx.objectiveDone();
          ctx.marker(null);
        },
      },
      {
        id: 'waves1',
        checkpoint: true,
        run: function* (ctx) {
          if (ctx.startedHere) ctx.place(1600, 900, 0);
          ctx.lock(true);
          yield ctx.dialog([['general', 'All units: weapons free. God help us all.']]);
          ctx.lock(false);
          yield* runWaves(ctx, 1, [
            { title: 'RECONNAISSANCE DRONES', drones: 6, hint: 'Throw things at them. Or throw them at things.' },
            { title: 'ARMOUR', drones: 4, tanks: 2, hint: 'Watch for red rings: that is where a shell will land.' },
          ]);
        },
      },
      {
        id: 'waves2',
        checkpoint: true,
        grants: ['duplicate'],
        run: function* (ctx) {
          if (ctx.startedHere) ctx.place(1600, 900, 0);
          ctx.lock(true);
          yield ctx.dialog([['general', 'Send in everything. Everything!']]);
          yield ctx.narrate('There are more of them than there are of me. That is easily corrected.', { dur: 4 });
          yield ctx.unlock('duplicate');
          ctx.lock(false);
          yield* runWaves(ctx, 3, [
            { title: 'COMBINED ARMS', drones: 7, tanks: 2, batteries: [[2350, 460]], hint: 'Grab a missile in flight and it is yours to throw back.' },
            { title: 'SATURATION', drones: 5, tanks: 3, batteries: [[2350, 1150], [2460, 760]] },
          ]);
        },
      },
      {
        id: 'behemoth',
        checkpoint: true,
        run: function* (ctx) {
          const W = ctx.world;
          if (ctx.startedHere) ctx.place(1600, 900, 0);
          ctx.lock(true);
          yield ctx.dialog([['general', 'Bring out the Behemoth. Four hundred tons of experimental armour. It cost more than the moon programme.']]);
          const b = ctx.add(new Behemoth({ x: 2420, y: 800, facing: Math.PI }));
          W.boss = b;
          ctx.focus(b.x, b.y);
          W.camera.shake(0.6);
          DM.Audio.play('explosion');
          yield ctx.wait(1.6);
          ctx.focus(null);
          ctx.lock(false);
          ctx.objective('Destroy the Behemoth');
          ctx.hint('Too heavy to lift. Throw its own missiles back at it, or get behind it: the engine at the rear has no armour.', 10);
          yield ctx.until(() => b.dead);
          ctx.clearHostiles(); // nothing still in the air lands on the victory
          W.boss = null;
          ctx.objectiveDone();
          yield ctx.wait(2);
        },
      },
      {
        id: 'outro',
        run: function* (ctx) {
          ctx.lock(true);
          yield ctx.dialog([
            ['general', '...Cease fire. Cease fire.'],
            ['general', "Doctor, I've just watched a billion dollars of hardware turn into weather."],
            ['manhattan', 'The Soviets were watching too.'],
            ['general', '...Yes. Yes, they were.'],
          ]);
          yield ctx.narrate('The Doomsday Clock moves forward. Every warhead they build, they build because of me.', { dur: 5.5 });
        },
      },
    ],
  });
})();
</script>
<script>/* src/data/chapters/mars.js */
/*
 * CHAPTER IV — The Watchmaker. A television studio, then Mars, 1985.
 * Leave Earth, unlock Temporal Sight and Expand, build the glass palace,
 * and find the memories hidden in time.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const { Prop } = DM.Props;
  const { Shard, Palace, Memory, Meteor } = DM.Special;
  const NPC = DM.NPC;
  const C = { x: 1200, y: 1200 };

  // ---- studio --------------------------------------------------------------------
  const STUDIO_WALLS = {
    wall: { top: '#2a2633', face: '#1c1924', edge: '#0d0b12' },
    seat: { top: '#5a2a3a', face: '#3e1d28', edge: '#1e0e14', low: true },
    desk: { top: '#2e3b5a', face: '#1f2840', edge: '#0e1320', low: true },
  };
  function bakeStudio(g) {
    g.fillStyle = '#1d1a24';
    g.fillRect(0, 0, 1400, 900);
    const gr = g.createRadialGradient(700, 330, 40, 700, 330, 420);
    gr.addColorStop(0, 'rgba(120,140,200,0.18)');
    gr.addColorStop(1, 'rgba(120,140,200,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, 1400, 900);
    g.fillStyle = '#2e2a3a';
    Gfx.rr(g, 440, 210, 520, 270, 30);
    g.fill();
    g.strokeStyle = '#7fa0e0';
    g.lineWidth = 3;
    g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.08)';
    g.font = '700 46px Oswald, Arial Narrow, sans-serif';
    g.textAlign = 'center';
    g.fillText('NOVA EXPRESS', 700, 140);
    g.textAlign = 'left';
    g.strokeStyle = 'rgba(0,0,0,0.5)';
    g.lineWidth = 3;
    for (let i = 0; i < 6; i++) {
      g.beginPath();
      g.moveTo(100 + i * 40, 880);
      g.bezierCurveTo(300 + i * 30, 700, 400, 650 - i * 10, 520, 560);
      g.stroke();
    }
  }
  function buildStudio(ctx) {
    const W = ctx.newWorld({ w: 1400, h: 900, bg: '#121018', wallStyles: STUDIO_WALLS, zoom: 1.35 });
    W.bake(bakeStudio);
    W.spawn = { x: 700, y: 400, facing: Math.PI / 2 };
    W.room(0, 0, 1400, 900, { t: 24 });
    W.wall(620, 240, 160, 40, 'desk');
    for (const y of [640, 710, 780]) {
      W.wall(180, y, 470, 26, 'seat');
      W.wall(750, y, 470, 26, 'seat');
    }
    const R = (ctx.refs = {});
    R.host = ctx.add(new NPC({ x: 700, y: 310, look: 'host', facing: Math.PI / 2 }));
    R.press = [
      [560, 520, 'reporter'], [840, 520, 'reporter2'], [700, 570, 'reporter'], [470, 440, 'reporter2'], [930, 440, 'reporter'],
    ].map(([x, y, look]) => ctx.add(new NPC({ x, y, look, facing: U.angleTo(x, y, 700, 400), lookAtPlayer: true, speed: 70 })));
    const cams = [[500, 600], [900, 600], [340, 360], [1060, 360]];
    W.overlays.push((g, world) => {
      const t = world.realTime || 0;
      for (const [x, y] of cams) {
        g.fillStyle = '#111';
        g.fillRect(x - 14, y - 10, 28, 20);
        g.fillStyle = '#333';
        g.fillRect(x - 6, y - 18, 12, 10);
        Gfx.glow(g, x, y - 14, 8, '#ff3a2a', Math.sin(t * 4 + x) > 0 ? 0.9 : 0.3);
      }
      for (let i = 0; i < 5; i++) Gfx.glow(g, 300 + i * 200, 40, 120, '#fff2d0', 0.12);
    });
    return W;
  }

  // ---- Mars ------------------------------------------------------------------------
  const MARS_WALLS = {
    rock: {
      draw: (g, w) => {
        g.fillStyle = '#5a2412';
        Gfx.rr(g, w.x, w.y, w.w, w.h, Math.min(w.w, w.h) * 0.45);
        g.fill();
        g.fillStyle = 'rgba(230,140,90,0.25)';
        Gfx.rr(g, w.x + 6, w.y + 4, w.w * 0.6, w.h * 0.4, Math.min(w.w, w.h) * 0.2);
        g.fill();
      },
    },
  };
  const ROCKS = [[500, 500, 120, 90], [1800, 400, 90, 140], [400, 1700, 160, 80], [1900, 1800, 100, 100], [1100, 300, 140, 60], [300, 1100, 70, 150], [2000, 1150, 80, 120], [1450, 2050, 120, 70]];
  const MEMORIES = [
    { x: 500, y: 900, year: 1945, text: 'My father throws his watch parts out of the window. They fall into the street like seeds. The future belongs to physics, he says.' },
    { x: 1900, y: 700, year: 1959, text: "Janey's watch, in pieces on my bench. Everything goes back together, if you understand it well enough. Almost everything." },
    { x: 820, y: 1900, year: 1963, text: 'A motel room in Arizona. Janey is getting older. I am not. We both pretend not to have noticed.' },
    { x: 1700, y: 1850, year: 1966, text: 'A room full of masked people who want to save the world. I am the only one who does not need a mask.' },
    { x: 2080, y: 1350, year: 1970, text: 'Laurie, sixteen, laughing at something I said. Janey sees me watching her, and understands before I do.' },
    { x: 1000, y: 520, year: 1977, text: 'Wally Weaver is buried. I stand at the graveside. I cannot tell if I am sad, or only remembering being sad.' },
  ];

  function bakeMars(g) {
    const rnd = U.seeded(1985);
    const gr = g.createRadialGradient(C.x, C.y, 100, C.x, C.y, 1700);
    gr.addColorStop(0, '#b9582f');
    gr.addColorStop(1, '#7e3219');
    g.fillStyle = gr;
    g.fillRect(0, 0, 2400, 2400);
    for (let i = 0; i < 14000; i++) {
      g.fillStyle = rnd() < 0.5 ? 'rgba(60,20,8,0.12)' : 'rgba(255,200,150,0.07)';
      g.fillRect(rnd() * 2400, rnd() * 2400, 3, 3);
    }
    g.strokeStyle = 'rgba(255,190,140,0.12)';
    g.lineWidth = 6;
    for (let i = 0; i < 22; i++) {
      const y = rnd() * 2400;
      g.beginPath();
      g.moveTo(0, y);
      g.bezierCurveTo(800, y + rnd() * 160 - 80, 1600, y + rnd() * 160 - 80, 2400, y + rnd() * 100 - 50);
      g.stroke();
    }
    for (let i = 0; i < 26; i++) {
      const x = rnd() * 2400, y = rnd() * 2400, r = 30 + rnd() * 110;
      if (U.dist(x, y, C.x, C.y) < 420) continue;
      g.fillStyle = 'rgba(80,25,10,0.4)';
      Gfx.ellipse(g, x, y, r, r * 0.85);
      g.fill();
      g.strokeStyle = 'rgba(240,150,100,0.35)';
      g.lineWidth = 5;
      g.beginPath();
      g.ellipse(x, y, r, r * 0.85, 0, Math.PI * 1.1, Math.PI * 2.1);
      g.stroke();
    }
  }

  function freeSpot(W, rMin, rMax, rad) {
    for (let i = 0; i < 60; i++) {
      const a = U.rand(0, Math.PI * 2), d = U.rand(rMin, rMax);
      const x = C.x + Math.cos(a) * d, y = C.y + Math.sin(a) * d;
      if (W.isFree(x, y, rad + 10)) return { x, y };
    }
    return { x: C.x + rMax, y: C.y };
  }

  function buildMars(ctx) {
    const W = ctx.newWorld({ w: 2400, h: 2400, bg: '#6e2c16', wallStyles: MARS_WALLS, zoom: 1.1 });
    W.bake(bakeMars);
    W.spawn = { x: C.x, y: C.y + 380, facing: -Math.PI / 2 };
    for (const [x, y, w, h] of ROCKS) W.wall(x, y, w, h, 'rock');
    const palace = W.add(new Palace(C.x, C.y));
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
      palace.addSlot(W, C.x + Math.cos(a) * 230, C.y + Math.sin(a) * 230, false);
    }
    for (let i = 0; i < 4; i++) {
      const a = Math.PI / 4 + (i * Math.PI) / 2;
      palace.addSlot(W, C.x + Math.cos(a) * 110, C.y + Math.sin(a) * 110, true);
    }
    for (let i = 0; i < 15; i++) {
      const p = freeSpot(W, 430, 1050, 14);
      W.add(new Shard(p.x, p.y, false));
    }
    for (let i = 0; i < 4; i++) {
      const p = freeSpot(W, 520, 880, 30);
      W.add(new Shard(p.x, p.y, true));
    }
    // Memories already found this run (carried by Retry/Continue) stay found.
    const found = ctx.foundMemories || [];
    for (const m of MEMORIES) if (!found.includes(m.year)) W.add(new Memory(m.x, m.y, m));
    W.overlays.push((g, world) => {
      const t = world.realTime || 0;
      const v = world.camera.view();
      g.save();
      g.globalAlpha = 0.18;
      g.strokeStyle = '#f0b080';
      g.lineWidth = 1;
      for (let i = 0; i < 26; i++) {
        const x = v.x0 + ((i * 197 + t * 140) % (v.x1 - v.x0 + 200)) - 100;
        const y = v.y0 + ((i * 113 + t * 20) % (v.y1 - v.y0));
        Gfx.line(g, x, y, x + 50, y + 6);
      }
      g.restore();
    });
    ctx.refs = { palace };
    return W;
  }

  function* meteorShower(ctx) {
    while (!ctx.flags.palaceDone) {
      yield ctx.wait(U.rand(3.2, 5.2));
      if (ctx.flags.palaceDone || ctx.locked) continue;
      const P = ctx.player;
      let x = P.x + U.rand(-260, 260), y = P.y + U.rand(-260, 260);
      if (U.chance(0.35)) {
        x = P.x + P.vx * 1.6;
        y = P.y + P.vy * 1.6;
      }
      x = U.clamp(x, 80, 2320);
      y = U.clamp(y, 80, 2320);
      if (U.dist(x, y, C.x, C.y) < 160) continue;
      ctx.add(new Meteor(x, y, { T: 2.6, radius: 70, dmg: 14 }));
    }
  }

  function fillSlots(ctx, big) {
    const W = ctx.world;
    const palace = ctx.refs.palace;
    const shards = W.entities.filter((e) => e instanceof Shard && e.big === big && !e.placed);
    for (const s of palace.slots) {
      if (s.big !== big || s.filled) continue;
      const sh = shards.pop();
      if (sh) s.fill(sh, null);
    }
  }

  DM.Chapters.register({
    id: 'mars',
    numeral: 'CHAPTER IV',
    title: 'The Watchmaker',
    date: 'October 1985',
    place: 'New York · Mars',
    clock: 3,
    color: '#a8432a',
    music: 'mars',
    form: 'manhattan',
    epigraph: { text: 'The distinction between past, present and future is only a stubbornly persistent illusion.', by: 'Albert Einstein' },
    intro: [
      'October 1985. A television studio in New York. The interviewer smiles at me as if we are friends.',
      'Then the questions start: about Wally, about Janey, about the cancers carried by the people who have stood closest to me.',
      'There are too many voices. There is too much light. I go somewhere quiet.',
    ],
    maps: { studio: buildStudio, mars: buildMars },
    stages: [
      {
        id: 'studio',
        map: 'studio',
        run: function* (ctx) {
          const P = ctx.player, R = ctx.refs, W = ctx.world;
          ctx.music('tension');
          ctx.lock(true);
          ctx.cinematic(true);
          yield ctx.wait(0.6);
          yield ctx.dialog([
            ['host', "...and we're back. Doctor Manhattan, thank you for joining us, live."],
            ['reporter', 'Doctor! Wally Weaver died of cancer in 1977. Your friend. Is it true he worked beside you every day?'],
            ['reporter2', 'Janey Slater has cancer too. She says you gave it to her. Is that true?'],
            ['reporter', 'How many others, Doctor? How many people have you hurt just by standing next to them?'],
            ['manhattan', 'Please. Stop.'],
            ['reporter2', "Is that a no, Doctor? Doctor! Look this way!"],
          ]);
          ctx.cinematic(false);
          const barks = ['Doctor!', 'Is it true?', 'Look this way!', 'Did you know?', 'Doctor Manhattan!', 'Answer the question!'];
          ctx.fork(function* () {
            while (!ctx.flags.left) {
              for (const r of R.press) {
                r.walkTo(P.x + U.rand(-70, 70), P.y + U.rand(-70, 70));
                if (U.chance(0.3)) W.bark(r, U.pick(barks), 1.2);
              }
              if (U.chance(0.6)) {
                ctx.flash('#ffffff', 0.25, { strobe: true });
                DM.Audio.play('tick');
              }
              yield ctx.wait(0.8);
            }
          });
          ctx.lock(false);
          const before = P.teleportedAt;
          ctx.objective('Leave');
          ctx.tutorial('Aim somewhere far away, then press SPACE to teleport.', 99);
          yield ctx.until(() => P.teleportedAt !== before);
          ctx.flags.left = true;
          ctx.hint(null);
          ctx.objective(null);
          ctx.lock(true);
          ctx.flash('#ffffff', 1.2);
          DM.Audio.play('teleport');
          yield ctx.wait(0.5);
        },
      },
      {
        id: 'palace',
        map: 'mars',
        checkpoint: true,
        grants: ['timesight'],
        run: function* (ctx) {
          const palace = ctx.refs.palace;
          ctx.music('mars');
          ctx.lock(true);
          yield ctx.wait(1);
          yield ctx.narrate('Mars. It is quiet here. Nobody is asking me anything.', { dur: 4 });
          yield ctx.narrate('I have begun to see time the way I see space: all of it at once, laid out in front of me.', { dur: 5 });
          yield ctx.unlock('timesight');
          ctx.lock(false);
          ctx.objective('Build the palace', () => `${palace.count(false)}/${palace.total(false)}`);
          ctx.hint('Lift crystals into the glowing slots. Meteors fall here: Temporal Sight shows you where.', 9);
          ctx.fork(meteorShower);
          ctx.fork(function* () {
            yield ctx.wait(30);
            if (ctx.stats.memories === 0) ctx.hint('Hold F somewhere quiet. There are moments hidden here, out of the corner of time.', 8);
          });
          yield ctx.until(() => palace.count(false) >= palace.total(false));
          ctx.objectiveDone();
        },
        restore(ctx) {
          fillSlots(ctx, false);
        },
      },
      {
        id: 'great',
        checkpoint: true,
        grants: ['expand'],
        run: function* (ctx) {
          const palace = ctx.refs.palace;
          if (ctx.startedHere) ctx.fork(meteorShower);
          ctx.lock(true);
          yield ctx.wait(0.8);
          yield ctx.narrate('The great crystals are too heavy to lift. For a man my size.', { dur: 4 });
          yield ctx.unlock('expand');
          ctx.lock(false);
          ctx.objective('Set the great crystals', () => `${palace.count(true)}/${palace.total(true)}`);
          ctx.hint('Press G to grow, then lift a great crystal into the centre before you shrink back.', 9);
          yield ctx.until(() => palace.count(true) >= palace.total(true));
          ctx.objectiveDone();
        },
        restore(ctx) {
          fillSlots(ctx, true);
        },
      },
      {
        id: 'laurie',
        run: function* (ctx) {
          const P = ctx.player, W = ctx.world, palace = ctx.refs.palace;
          ctx.flags.palaceDone = true;
          ctx.lock(true);
          ctx.focus(palace.x, palace.y);
          palace.risingT = 3;
          DM.Audio.play('unlock');
          W.camera.shake(0.4);
          yield ctx.wait(3.4);
          ctx.focus(null);
          const lx = U.clamp(P.x + 90, 60, W.w - 60), ly = P.y;
          W.particles.burst(lx, ly, 40, { color: ['#7fe3ff', '#ffffff'], speed: [40, 200], life: [0.3, 0.8], size: [1.5, 3] });
          DM.Audio.play('teleport');
          ctx.add(new NPC({ x: lx, y: ly, look: 'laurie', facing: Math.PI }));
          yield ctx.wait(0.8);
          yield ctx.dialog([
            ['laurie', "Jon. ...It's beautiful. It's also the loneliest thing I've ever seen."],
            ['laurie', "The world's about to end. You have to come back. You're the only one who can stop it."],
            ['manhattan', 'Why? Life on Earth is no more remarkable than the silence here.'],
            ['laurie', 'Then look at me. One person. Is that so unremarkable?'],
            ['manhattan', 'Thermodynamic miracles. Events so unlikely they are effectively impossible, like oxygen spontaneously becoming gold.'],
            ['manhattan', 'Every human life is one. I had forgotten. We will go back.'],
          ]);
        },
      },
    ],
  });
})();
</script>
<script>/* src/data/chapters/karnak.js */
/*
 * CHAPTER V — Karnak. Antarctica, November 1985.
 * Destroy the shielded tachyon emitters, survive the Intrinsic Field
 * Subtractor (by reassembling, again), then stop Adrian Veidt.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const { Prop, Door, Crate } = DM.Props;
  const { Drone, Turret, Emitter, Veidt } = DM.Enemies;
  const { Atom, BodyForm } = DM.Special;
  const NPC = DM.NPC;

  const WALLS = {
    ice: { top: '#bcd3e6', face: '#93b1cc', edge: '#6d8fae' },
    karnak: { top: '#c9a24a', face: '#8a6a22', edge: '#4e3a10' },
    pillar: { top: '#d8b860', face: '#9a7a2a', edge: '#5a4410' },
    wall: { top: '#c9a24a', face: '#8a6a22', edge: '#4e3a10' },
  };
  const SUB = { x: 2470, y: 1000 };
  const EMITTERS = [[420, 420], [950, 320], [520, 1580], [1050, 1420]];

  function bakeKarnak(g) {
    const rnd = U.seeded(1985);
    g.fillStyle = '#e6eef5';
    g.fillRect(0, 0, 2600, 2000);
    for (let i = 0; i < 12000; i++) {
      g.fillStyle = rnd() < 0.6 ? 'rgba(120,150,190,0.07)' : 'rgba(255,255,255,0.5)';
      g.fillRect(rnd() * 1300, rnd() * 2000, 3, 3);
    }
    g.strokeStyle = 'rgba(150,180,215,0.25)';
    g.lineWidth = 3;
    for (let i = 0; i < 30; i++) {
      const x = rnd() * 1300, y = rnd() * 2000;
      Gfx.line(g, x, y, x + 60 + rnd() * 120, y + rnd() * 10 - 5);
    }
    for (let i = 0; i < 12; i++) {
      g.fillStyle = 'rgba(170,215,240,0.35)';
      Gfx.ellipse(g, rnd() * 1200, rnd() * 2000, 60 + rnd() * 120, 30 + rnd() * 60, rnd() * 3);
      g.fill();
    }
    g.fillStyle = '#c9b27a';
    g.fillRect(1300, 160, 1300, 1680);
    g.strokeStyle = 'rgba(90,70,30,0.25)';
    g.lineWidth = 2;
    for (let x = 1300; x < 2600; x += 60) Gfx.line(g, x, 160, x, 1840);
    for (let y = 160; y < 1840; y += 60) Gfx.line(g, 1300, y, 2600, y);
    g.fillStyle = '#d8b860';
    g.fillRect(1340, 960, 560, 80);
    g.fillStyle = '#2e2440';
    g.fillRect(1900, 500, 650, 1000);
    g.strokeStyle = 'rgba(212,173,58,0.6)';
    g.lineWidth = 3;
    for (const r of [120, 200, 280]) {
      Gfx.circle(g, 2250, 1000, r);
      g.stroke();
    }
    g.fillStyle = 'rgba(212,173,58,0.5)';
    for (let i = 0; i < 40; i++) {
      const x = 1940 + i * 15;
      g.fillRect(x, 540, 6, 14);
      g.fillRect(x, 1446, 6, 14);
    }
    g.fillStyle = 'rgba(40,30,10,0.25)';
    g.font = '700 54px Oswald, Arial Narrow, sans-serif';
    g.fillText('KARNAK', 1420, 260);
  }

  function buildKarnak(ctx) {
    const W = ctx.newWorld({ w: 2600, h: 2000, bg: '#d6e2ec', wallStyles: WALLS, zoom: 1.2 });
    W.bake(bakeKarnak);
    W.spawn = { x: 150, y: 1000, facing: 0 };
    W.room(0, 0, 2600, 2000, { t: 20, kind: 'ice' });
    W.wall(1300, 160, 1300, 40, 'karnak');
    W.wall(1300, 1800, 1300, 40, 'karnak');
    W.wall(1300, 200, 40, 700, 'karnak');
    W.wall(1300, 1100, 40, 700, 'karnak');
    W.room(1900, 500, 676, 1000, { kind: 'karnak', t: 24, doors: [{ side: 'left', at: 440, w: 120 }] });
    for (let x = 1450; x < 1850; x += 130) {
      for (let y = 300; y < 1760; y += 200) {
        if (y > 820 && y < 1180) continue;
        W.wall(x, y, 40, 40, 'pillar');
      }
    }
    for (const [x, y, w, h] of [[300, 820, 200, 40], [780, 980, 40, 200], [200, 1300, 160, 40], [1000, 700, 140, 40], [640, 1180, 140, 40]]) W.wall(x, y, w, h, 'ice');

    const R = (ctx.refs = {});
    R.gate = W.add(new Door(W, 1300, 900, 40, 200, { color: '#b8902e', stripe: '#6f4aa6' }));
    R.emitters = EMITTERS.map(([x, y]) => W.add(new Emitter({ x, y })));
    R.turrets = [[620, 520], [1130, 440], [700, 1480], [1180, 1260]].map(([x, y]) => W.add(new Turret({ x, y })));
    R.drones = [[700, 900], [1100, 1050], [400, 1200]].map(([x, y]) => W.add(new Drone({ x, y, style: 'karnak', sight: 700 })));
    for (const [x, y] of [[260, 600], [300, 640], [880, 1100], [900, 640], [460, 1400], [1150, 900]]) W.add(new Crate(x, y, { style: 'metal' }));
    R.sub = W.add(new Prop({
      x: SUB.x, y: SUB.y, r: 4, data: { charge: 0 },
      draw: (g, e, world) => {
        const t = world.realTime || 0;
        const k = e.data.charge;
        g.fillStyle = '#2a2440';
        Gfx.circle(g, SUB.x, SUB.y, 54);
        g.fill();
        g.strokeStyle = '#d4ad3a';
        g.lineWidth = 6;
        Gfx.circle(g, SUB.x, SUB.y, 46);
        g.stroke();
        g.save();
        g.translate(SUB.x, SUB.y);
        g.rotate(t * (0.5 + k * 6));
        for (let i = 0; i < 6; i++) {
          g.rotate(Math.PI / 3);
          g.fillStyle = '#8a6a22';
          g.fillRect(30, -5, 22, 10);
        }
        g.restore();
        g.fillStyle = '#6f4aa6';
        g.fillRect(SUB.x - 80, SUB.y - 10, 40, 20);
        Gfx.glow(g, SUB.x - 80, SUB.y, 30 + k * 60, '#c06bff', 0.4 + k * 0.6);
      },
    }));
    R.veidtNpc = W.add(new NPC({ x: 2340, y: 1000, look: 'veidt', facing: Math.PI }));
    return W;
  }

  // The Intrinsic Field Subtractor beam.
  function beamOverlay(ctx) {
    return (g, world) => {
      const k = ctx.flags.beam || 0;
      if (k <= 0) return;
      const P = ctx.player;
      g.save();
      g.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 3; i++) {
        g.strokeStyle = i ? `rgba(192,107,255,${0.3 * k})` : `rgba(255,255,255,${0.9 * k})`;
        g.lineWidth = (i ? 18 - i * 4 : 4) * k;
        g.beginPath();
        g.moveTo(SUB.x - 80, SUB.y);
        for (let s = 1; s <= 12; s++) {
          const f = s / 12;
          g.lineTo(U.lerp(SUB.x - 80, P.x, f) + U.rand(-6, 6) * k, U.lerp(SUB.y, P.y, f) + U.rand(-6, 6) * k);
        }
        g.stroke();
      }
      g.restore();
    };
  }

  function* reassemble(ctx) {
    const P = ctx.player, W = ctx.world;
    const body = W.add(new BodyForm(P.x, P.y, { H: 170, depositR: 95 }));
    const quota = 30;
    let bank = 0;
    ctx.setForm('awareness');
    P.carry = 0;
    P.carryMax = 40;
    P.basePull = 120;
    P.y += 150;
    for (let i = 0; i < 46; i++) {
      const a = U.rand(0, Math.PI * 2), d = U.rand(170, 430);
      W.add(new Atom(U.clamp(body.x + Math.cos(a) * d, 1950, 2520), U.clamp(body.y + Math.sin(a) * d, 550, 1450)));
    }
    ctx.lock(false);
    ctx.objective('Reassemble', () => `${bank}/${quota}`);
    ctx.hint('You have done this before. Gather yourself, then return to the ring.', 8);
    while (bank < quota) {
      if (P.carry > 0 && U.dist(P.x, P.y, body.x, body.y) < body.depositR) {
        P.carry--;
        bank++;
        body.pulse = 0.35;
        const f = bank / quota;
        body.layers = [Math.min(1, f * 4), Math.min(1, Math.max(0, f * 4 - 1)), Math.min(1, Math.max(0, f * 4 - 2)), Math.min(1, Math.max(0, f * 4 - 3))];
        DM.Audio.play('deposit');
        yield ctx.wait(0.035);
      } else yield;
    }
    ctx.objectiveDone();
    ctx.lock(true);
    for (const e of W.entities) if (e instanceof Atom) e.dead = true;
    for (let k = 0; k <= 1; k += 0.05) {
      body.skin = k;
      yield ctx.wait(0.03);
    }
    ctx.flash('#dff7ff', 1.4);
    W.camera.shake(0.6);
    DM.Audio.play('expand');
    ctx.setForm('manhattan');
    P.x = body.x;
    P.y = body.y;
    body.dead = true;
    P.targetScale = 2.2;
    P.expandT = 4;
    W.camera.targetZoom = W.baseZoom * 0.8;
  }

  DM.Chapters.register({
    id: 'karnak',
    numeral: 'CHAPTER V',
    title: 'Karnak',
    date: 'November 1985',
    place: 'Antarctica',
    clock: 1,
    color: '#5b3a7a',
    music: 'finale',
    form: 'manhattan',
    epigraph: { text: 'Quis custodiet ipsos custodes? Who watches the watchmen?', by: 'Juvenal, Satires' },
    intro: [
      'November 1985. Laurie has persuaded me to look at the world again. When I try to look ahead, I see only static.',
      'Tachyons: a storm of them, pouring out of Antarctica, drowning my view of the future. Someone has gone to great lengths to hide from me.',
      'At the bottom of the world, behind a wall of ice, an old friend is waiting.',
    ],
    maps: { karnak: buildKarnak },
    stages: [
      {
        id: 'emitters',
        map: 'karnak',
        checkpoint: true,
        run: function* (ctx) {
          const R = ctx.refs, P = ctx.player;
          ctx.lock(true);
          yield ctx.wait(0.8);
          yield ctx.narrate('Antarctica. My future is white noise here. Somebody does not want to be seen.', { dur: 4.5 });
          ctx.lock(false);
          const left = () => R.emitters.filter((e) => !e.dead);
          ctx.objective('Destroy the tachyon emitters', () => `${4 - left().length}/4`);
          ctx.hint('Tachyon emitters jam Temporal Sight. Find them and take them apart.', 8);
          let told = false;
          ctx.on('shield:block', () => {
            if (told) return;
            told = true;
            ctx.tutorial('The shield stops anything thrown or fired from outside. It will not stop you. SPACE: teleport inside.', 10);
          });
          ctx.fork(function* () {
            while (left().length) {
              let best = null, bd = Infinity;
              for (const e of left()) {
                const d = U.dist(P.x, P.y, e.x, e.y);
                if (d < bd) {
                  bd = d;
                  best = e;
                }
              }
              if (best) ctx.marker(best.x, best.y - 40, 'EMITTER');
              yield ctx.wait(0.5);
            }
            ctx.marker(null);
          });
          yield ctx.until(() => left().length === 0);
          // The grid fed the defences: with it gone, they spark and go dark.
          const W = ctx.world;
          ctx.clearHostiles();
          for (const e of W.entities) if (e instanceof Turret || e instanceof Drone) e.powerDown(W);
          ctx.hint(null);
          ctx.objectiveDone();
          R.gate.setOpen(true);
          ctx.lock(true);
          yield ctx.wait(0.8);
          yield ctx.narrate('The static clears. I can see again. I see the next eleven minutes, and I do not like them.', { dur: 5 });
          ctx.lock(false);
        },
        restore(ctx) {
          const R = ctx.refs;
          for (const e of [...R.emitters, ...R.turrets, ...R.drones]) e.dead = true;
          R.gate.open = true;
          R.gate.k = 1;
          R.gate.wall.noCollide = true;
        },
      },
      {
        id: 'subtractor',
        checkpoint: true,
        run: function* (ctx) {
          const R = ctx.refs, P = ctx.player, W = ctx.world;
          if (ctx.startedHere) ctx.place(1200, 1000, 0);
          ctx.objective('Enter Karnak');
          ctx.marker(1960, 1000, 'SANCTUM');
          yield ctx.until(() => P.x > 1960);
          ctx.marker(null);
          ctx.objective(null);
          ctx.lock(true);
          ctx.cinematic(true);
          ctx.focus(2200, 1000);
          yield ctx.dialog([
            ['veidt', 'Jon. I hoped you would come. I prepared for it, in fact.'],
            ['manhattan', 'Adrian. The tachyons were yours.'],
            ['veidt', 'Of course. You see everything, so I gave you nothing to see. Forgive me. And forgive this.'],
          ]);
          W.overlays.push(beamOverlay(ctx));
          for (let k = 0; k <= 1; k += 0.04) {
            R.sub.data.charge = k;
            yield ctx.wait(0.03);
          }
          DM.Audio.play('zap');
          DM.Audio.play('flash');
          for (let k = 0; k <= 1; k += 0.1) {
            ctx.flags.beam = k;
            yield ctx.wait(0.02);
          }
          W.camera.shake(0.8);
          yield ctx.wait(0.8);
          ctx.flash('#ffffff', 1.6);
          W.particles.burst(P.x, P.y, 200, { color: ['#7fe3ff', '#5fd4ff', '#ffffff', '#c06bff'], speed: [80, 520], life: [0.6, 1.8], size: [1.5, 4], drag: 1.4 });
          ctx.flags.beam = 0;
          R.sub.data.charge = 0.2;
          P.hidden = true;
          yield ctx.wait(1.8);
          yield ctx.dialog([['veidt', "...It's done. I am sorry, Jon. Truly."]]);
          ctx.cinematic(false);
          ctx.focus(null);
          P.hidden = false;
          yield* reassemble(ctx);
          yield ctx.wait(0.6);
          W.particles.burst(SUB.x, SUB.y, 90, { color: ['#d4ad3a', '#6f4aa6', '#2a2440', '#c06bff'], speed: [40, 300], life: [0.5, 1.4], size: [2, 5], add: false });
          R.sub.dead = true;
          DM.Audio.play('disintegrate');
          yield ctx.dialog([
            ['manhattan', 'I am disappointed in you, Adrian. Reassembling myself was the first thing I ever learned.'],
            ['veidt', "...Then I'll simply have to be faster than you, won't I?"],
          ]);
        },
        restore(ctx) {
          if (ctx.refs.sub) ctx.refs.sub.dead = true;
        },
      },
      {
        id: 'veidt',
        checkpoint: true,
        run: function* (ctx) {
          const R = ctx.refs, P = ctx.player, W = ctx.world;
          if (ctx.startedHere) ctx.place(2050, 1000, 0);
          P.targetScale = 1;
          W.camera.targetZoom = W.baseZoom;
          const n = R.veidtNpc;
          const v = ctx.add(new Veidt({ x: n.x, y: n.y, facing: Math.PI }));
          n.dead = true;
          W.boss = v;
          ctx.lock(false);
          ctx.objective('Stop Adrian Veidt');
          ctx.hint('He is fast enough to dodge you. Slow time, pin him with copies, or catch him and throw him.', 10);
          yield ctx.until(() => v.yielded);
          ctx.clearHostiles();
          W.boss = null;
          ctx.objectiveDone();
          ctx.lock(true);
          for (const e of W.entities) if (e instanceof Drone) e.disintegrate(W);
          yield ctx.wait(1.2);
          yield ctx.dialog([
            ['veidt', "Enough. Enough! Jon, listen to me. It's already done. New York. Thirty-five minutes ago."],
            ['veidt', 'Half a city, so the rest of the world would stop pointing missiles at itself. Look at the broadcasts. They are shaking hands.'],
            ['manhattan', '...'],
            ['veidt', 'I did the right thing, didn\'t I? Tell me it all works out, in the end.'],
            ['manhattan', 'There is no end, Adrian. There is only the next moment.'],
          ]);
        },
      },
    ],
  });
})();
</script>

<script>/* src/game/bonus.js */
/* Optional adventures. Separate registry and save slot: never advance the main story. */
(function() {
  'use strict';
  const DM = window.DM, G = DM.Gfx, U = DM.U, E = DM.Engine, I = DM.Input;
  const KEY = 'dr-manhattan.bonus.v1';
  const copy = (v) => JSON.parse(JSON.stringify(v));
  const fresh = () => ({
    version: 1, checkpoints: {}, completed: {}, deaths: 0
  });
  const Bonus = {
    list: [], data: null, available: true,
    register(ch) {
      ch.bonus = true;
      ch.index = 0;
      ch.startPowers = [
        'telekinesis',
        'disintegrate',
        'teleport',
        'duplicate',
        'timesight',
        'expand'
      ];
      this.list.push(ch);
      DM.Chapters.byId[ch.id] = ch;
      return ch;
    },
    load() {
      if (this.data)
        return this.data;
      this.data = fresh();
      try {
        const d = JSON.parse(localStorage.getItem(KEY) || 'null');
        if (d && d.version === 1) {
          for (const ch of this.list) {
            const cp = d.checkpoints && d.checkpoints[ch.id];
            if (cp && Number.isInteger(cp.stage) && cp.stage >= 0 && cp.stage < ch.stages.length) {
              const stats = {}, flags = {}, src = cp.carry || {};
              for (const k of ['time', 'spared', 'disintegrated', 'memories'])
                stats[k] = Number.isFinite(src.stats && src.stats[k]) ? Math.max(0, src.stats[k]) : 0;
              for (const k of ch.persistFlags || [])
                if (src.flags && ['number', 'boolean', 'string'].includes(typeof src.flags[k]))
                  flags[k] = src.flags[k];
              this.data.checkpoints[ch.id] = {
                stage: cp.stage, carry: {
                  stats, flags, found: []
                }
              };
            }
            const c = d.completed && d.completed[ch.id];
            if (c && typeof c === 'object')
              this.data.completed[ch.id] = c;
          }
          this.data.deaths = Number.isFinite(d.deaths) ? Math.max(0, d.deaths) : 0;
        }
      }
      catch (_) {
        /* A corrupt/blocked bonus slot cannot damage the campaign. */
      }
      return this.data;
    },
    write() {
      try {
        localStorage.setItem(KEY, JSON.stringify(this.data));
      }
      catch (_) {
        this.available = false;
      }
    },
    checkpointAt(id, stage, carry) {
      this.load().checkpoints[id] = {
        stage, carry: carry ? copy(carry) : null
      };
      this.write();
    },
    death() {
      this.load().deaths++;
      this.write();
    },
    start(id, resume) {
      this.selectedId = id;
      const cp = resume && this.load().checkpoints[id];
      I.clearAll();
      if (cp)
        E.fadeTo(() => E.set(new DM.Scenes.Play(), {
          chapter: id, stage: cp.stage, carry: cp.carry
        }));
      else
        E.fadeTo(() => E.set(new DM.Scenes.Interlude(id)));
    },
    complete(play) {
      const record = {
        stats: copy(play.ctx.stats), flags: play.ctx.persistedFlags()
      };
      this.load().completed[play.chapter.id] = record;
      delete this.data.checkpoints[play.chapter.id];
      this.write();
      DM.Challenge.clear(play.chapter.id);
      E.push(play.chapter.bonusComplete ? new play.chapter.bonusComplete(play, record) : new BonusComplete(play, record));
    },
  };
  function city(ctx, t, x = 0, y = 0, w = DM.W, h = DM.H) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
    const sky = ctx.createLinearGradient(0, y, 0, y + h);
    sky.addColorStop(0, '#090e1b');
    sky.addColorStop(0.65, '#213044');
    sky.addColorStop(1, '#3f3831');
    ctx.fillStyle = sky;
    ctx.fillRect(x, y, w, h);
    const rnd = U.seeded(1976);
    for (let layer = 0; layer < 3; layer++) {
      for (let bx = x - 20; bx < x + w; bx += 58) {
        const bh = 55 + rnd() * (110 + layer * 55), by = y + h - bh + layer * 18;
        ctx.fillStyle = ['#25303a', '#17222e', '#0c1521'][layer];
        ctx.fillRect(bx, by, 54, bh);
        for (let wy = by + 12; wy < y + h; wy += 17)
          for (let wx = bx + 8; wx < bx + 48; wx += 12) {
            if (rnd() > 0.55) {
              ctx.fillStyle = rnd() > 0.8 ? '#698c9b' : '#a88c56';
              ctx.globalAlpha = 0.3 + rnd() * 0.35;
              ctx.fillRect(wx, wy, 4, 6);
            }
          }
        ctx.globalAlpha = 1;
      }
    }
    ctx.strokeStyle = 'rgba(166,199,221,0.19)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 85; i++) {
      const rx = x + ((i * 79.7 - t * 51) % w + w) % w, ry = y + ((i * 63.7 + t * 270) % h);
      G.line(ctx, rx, ry, rx - 8, ry + 18);
    }
    ctx.restore();
  }
  Bonus.city = city;
  // The selector uses the same canvas/menu widgets as the original game. Each
  // adventure owns its metadata and checkpoints; selecting one never starts it.
  class BonusMenu {
    constructor() {
      this.cursor = 'pointer';
      this.t = 0;
    }
    enter() {
      Bonus.load();
      this.selected = Math.max(0, Bonus.list.findIndex(c => c.id === Bonus.selectedId));
      if (!Bonus.selectedId)
        this.selected = Math.max(0, Bonus.list.length - 1);
      this.select(this.selected);
    }
    select(index) {
      this.selected = (index + Bonus.list.length) % Bonus.list.length;
      this.chapter = Bonus.list[this.selected];
      Bonus.selectedId = this.chapter.id;
      const ch = this.chapter, cp = Bonus.load().checkpoints[ch.id];
      const items = [];
      if (cp)
        items.push({
          label: 'RESUME ADVENTURE', action: () => Bonus.start(ch.id, true)
        });
      items.push({
        label: cp ? 'RESTART ADVENTURE' : 'PLAY ' + ch.title.toUpperCase(), action: () => Bonus.start(ch.id, false)
      });
      items.push({
        label: 'CONTROLS', action: () => E.push(new DM.Scenes.Controls())
      });
      items.push({
        label: 'BACK TO THE MAIN GAME', action: () => E.set(new DM.Scenes.Title())
      });
      this.menu = new DM.UI.Menu(items, {
        x: 85, y: 480, w: 620, itemH: 40, size: 21, accent: ch.menuAccent || '#e3ba68', onBack: () => E.set(new DM.Scenes.Title())
      });
      DM.Audio.music.play(ch.music || 'bonus_noir');
    }
    cardRect(i) {
      return {
        x: 67 + i * 582, y: 112, w: 564, h: 58
      };
    }
    update(dt) {
      this.t += dt;
      if (I.pressed('menuLeft')) {
        this.select(this.selected - 1);
        DM.Audio.play('ui_move');
      }
      if (I.pressed('menuRight')) {
        this.select(this.selected + 1);
        DM.Audio.play('ui_move');
      }
      if (I.clicked()) {
        const m = I.mouse;
        for (let j = 0; j < Bonus.list.length; j++) {
          const r = this.cardRect(j);
          if (m.x >= r.x && m.x <= r.x + r.w && m.y >= r.y && m.y <= r.y + r.h) {
            I.consume('confirm');
            this.select(j);
            DM.Audio.play('ui_select');
            return;
          }
        }
      }
      this.menu.update(dt);
      if (I.pressed('mute'))
        DM.Audio.toggleMute();
    }
    render(ctx) {
      const ch = this.chapter, second = ch.id !== 'last_broadcast', accent = ch.menuAccent || '#e3ba68';
      if (ch.menuBackdrop)
        ch.menuBackdrop(ctx, this.t);
      else
        city(ctx, this.t);
      ctx.fillStyle = 'rgba(3,7,14,0.84)';
      ctx.fillRect(44, 36, 1192, 650);
      ctx.strokeStyle = 'rgba(180,197,195,0.28)';
      ctx.strokeRect(44, 36, 1192, 650);
      G.text(ctx, 'BONUS LEVELS', 82, 82, {
        size: 20, spacing: 6, color: accent, weight: 600
      });
      G.text(ctx, 'CLICK AN ADVENTURE  ·  OR USE LEFT / RIGHT', 1194, 80, {
        size: 12, spacing: 1, align: 'right', color: '#a7b7c5'
      });
      Bonus.list.forEach((c, i) => {
        const r = this.cardRect(i), chosen = i === this.selected;
        ctx.fillStyle = chosen ? 'rgba(118,183,197,0.14)' : 'rgba(125,144,162,0.05)';
        ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.strokeStyle = chosen ? accent : 'rgba(151,167,181,0.28)';
        ctx.strokeRect(r.x, r.y, r.w, r.h);
        G.text(ctx, ('0' + (i + 1)).slice(-2), r.x + 19, r.y + 36, {
          size: 18, color: chosen ? accent : '#758999'
        });
        G.text(ctx, c.title.toUpperCase(), r.x + 60, r.y + 36, {
          size: 22, spacing: 2, weight: chosen ? 600 : 400, color: chosen ? '#f0eadc' : '#97aebb'
        });
        if (Bonus.data.completed[c.id])
          G.text(ctx, '✓', r.x + r.w - 25, r.y + 36, {
            size: 20, align: 'center', color: accent
          });
      });
      const title = ch.menuTitle || ['THE LAST', 'BROADCAST'];
      G.text(ctx, title[0], 86, 244, {
        size: 53, color: '#eee4cb', weight: 700, spacing: 3
      });
      G.text(ctx, title[1], 86, 303, {
        size: 53, color: '#eee4cb', weight: 700, spacing: 3
      });
      G.text(ctx, (ch.menuLocation || 'NEW YORK · 1976') + ' · A STANDALONE SIDE STORY', 89, 337, {
        size: 12, spacing: 1.6, color: '#b9c9d8'
      });
      G.paragraph(ctx, ch.menuSummary || 'A stolen transmitter. Three missing engineers. One voice promising to turn the whole ' +
        'city against itself.', 89, 362, 618, 24, {
        size: 18, font: DM.FONTS.type, color: '#e0ded6'
      });
      G.paragraph(ctx, ch.menuBrief || 'Join Nite Owl and Rorschach. Find the hostages, break the signal, and decide what the ' +
        'city gets to hear.', 89, 427, 618, 23, {
        size: 16, font: DM.FONTS.type, color: '#b7c9d5'
      });
      this.menu.render(ctx);
      const cast = ch.menuCast || ['niteowl', 'rorschach'];
      cast.forEach((id, i) => {
        G.portrait(ctx, 810 + i * 185, 218, 144, DM.LOOKS[id], this.t);
        G.text(ctx, (DM.LOOKS[id].name || id).toUpperCase(), 882 + i * 185, 392, {
          size: 15, align: 'center', spacing: 1.5, color: accent
        });
      });
      if (ch.menuEmblem)
        ch.menuEmblem(ctx, 978, 515, this.t);
      else
        G.hydrogen(ctx, 978, 515, 65, '#79d9fa', this.t * 0.3, 3);
      G.text(ctx, ch.menuTagline || 'SOME NIGHTS NEVER MAKE THE PAPERS.', 977, 629, {
        size: 11, align: 'center', spacing: 1.4, color: '#dad4c3'
      });
      G.text(ctx, 'ALL POWERS AVAILABLE · EACH ADVENTURE SAVES SEPARATELY', 88, 660, {
        size: 11, spacing: 1.5, color: '#b5ad99'
      });
      G.postFx(ctx);
    }
  }
  class BonusComplete {
    constructor(play, record) {
      this.play = play;
      this.record = record;
      this.t = 0;
      this.cursor = 'pointer';
    }
    enter() {
      DM.Audio.stopHums();
      DM.Audio.play('success');
      DM.Audio.music.play('reflect');
      this.menu = new DM.UI.Menu([
        {
          label: 'RETURN TO BONUS LEVELS', action: () => E.fadeTo(() => E.set(new BonusMenu()))
        },
        {
          label: 'PLAY AGAIN · TRY THE OTHER CHOICE', action: () => Bonus.start(this.play.chapter.id, false)
        },
      ], {
        x: DM.W / 2, y: 550, w: 590, align: 'center', size: 21, itemH: 48
      });
    }
    update(dt) {
      this.t += dt;
      if (this.t > 1)
        this.menu.update(dt);
    }
    render(ctx) {
      city(ctx, this.t);
      ctx.fillStyle = 'rgba(4,8,16,0.9)';
      ctx.fillRect(100, 55, 1080, 610);
      const f = this.record.flags, s = this.record.stats;
