      const t0 = performance.now();
      const cam = world.camera;
      const t = world.time || 0;
      const dt = U.clamp(t - st.time, 0, 0.1);
      st.time = t;
      const dx = st.camX == null ? 0 : (cam.x - st.camX) * cam.zoom;
      const dy = st.camY == null ? 0 : (cam.y - st.camY) * cam.zoom;
      st.camX = cam.x;
      st.camY = cam.y;
      let n = 0;
      for (const L of st.layers) {
        L.T.step(L, dt, t, dx, dy, world);
        // Clip to where the layer belongs: outdoors only, or one room only.
        let clip = null, skip = false;
        if (L.only) {
          const r = screenRect(cam, L.only);
          if (misses(r)) skip = true;
          else if (!covers(r)) clip = [r];
        }
        if (L.exclude && !skip) {
          const rs = L.exclude.map((e) => screenRect(cam, e)).filter((r) => !misses(r));
          if (rs.some(covers)) skip = true;
          else if (rs.length) clip = (clip || []).concat(rs.map((r) => Object.assign(r, { out: true })));
        }
        if (skip) continue;
        ctx.save();
        if (clip) {
          ctx.beginPath();
          const inside = clip.filter((r) => !r.out);
          if (inside.length) for (const r of inside) ctx.rect(r.x, r.y, r.w, r.h);
          else ctx.rect(0, 0, DM.W, DM.H);
          for (const r of clip) if (r.out) ctx.rect(r.x, r.y, r.w, r.h);
          ctx.clip('evenodd');
        }
        L.T.draw(ctx, L, world, t);
        ctx.restore();
        n += L.ps ? L.ps.length : 0;
      }
      Weather.stats.particles = n;
      Weather.stats.ms = performance.now() - t0;
      return true;
    },
  };

  DM.Weather = Weather;
})();
</script>

<script>/* src/game/entity.js */
/*
 * Entity: base class for everything that lives in a World.
 *
 * Physics flags:
 *   solid   — collides with walls
 *   body    — pushes against other bodies
 *   static  — never moved by physics
 *   selfMove— moves itself in update() (projectiles); the world won't integrate it
 *   flying  — ignores low walls and doesn't collide with ground bodies
 *   timeless— keeps (most of) its speed during Temporal Sight (the player, duplicates)
 * Gameplay flags:
 *   grabbable (telekinesis), disintegratable, hp (null = indestructible), team
 *   interact = { label, range, onInteract(entity, player), enabled() }
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  let nextId = 1;

  class Entity {
    constructor(o = {}) {
      this.id = nextId++;
      this.x = o.x || 0;
      this.y = o.y || 0;
      this.vx = o.vx || 0;
      this.vy = o.vy || 0;
      this.r = o.r == null ? 12 : o.r;
      this.mass = o.mass == null ? 1 : o.mass;
      this.friction = o.friction == null ? 6 : o.friction;
      this.bounce = o.bounce == null ? 0.25 : o.bounce;
      this.solid = o.solid == null ? true : o.solid;
      this.body = o.body == null ? true : o.body;
      this.static = !!o.static;
      this.flying = !!o.flying;
      this.team = o.team || 'neutral';
      this.hp = o.hp == null ? null : o.hp;
      this.maxHp = this.hp;
      this.grabbable = !!o.grabbable;
      this.disintegratable = o.disintegratable == null ? true : o.disintegratable;
      this.layer = o.layer == null ? 1 : o.layer;
      this.colors = o.colors || ['#ffffff', '#cccccc'];
      this.interact = o.interact || null;
      this.tags = new Set(o.tags || []);
      this.dead = false;
      this.age = 0;
      this.heldBy = null;
      this.thrown = 0;
      this.stun = 0;
      this.hitFlash = 0;
    }

    update(dt, world) {}
    render(ctx, world) {}

    get speed() {
      return Math.hypot(this.vx, this.vy);
    }

    damage(amount, source, kind) {
      if (this.hp == null || this.dead) return false;
      this.hp -= amount;
      this.hitFlash = 0.12;
      if (this.hp <= 0) {
        this.hp = 0;
        this.die(kind, source);
      }
      return true;
    }

    die(kind, source) {
      if (this.dead) return;
      this.dead = true;
      if (this.onDeath) this.onDeath(kind, source);
    }

    // Default: the thing comes apart from the side facing Jon (DM.FX.unbind,
    // coarse cells for crates, vehicles and machines). Small things such as
    // projectiles just scatter.
    disintegrate(world, source) {
      if (this.dead) return;
      const n = Math.min(110, 18 + this.r * 2.5);
      const big = this.r > 40;
      const unbound = !this.isProjectile && this.r >= 9 && DM.FX && DM.FX.unbind(world, this, { source, step: big ? 4 : 3, max: big ? 400 : 600 });
      if (!unbound) world.particles.burst(this.x, this.y, n, { color: this.colors, speed: [30, 280], life: [0.4, 1.3], size: [2, 4.5], drag: 2.5, add: false, radius: this.r });
      world.particles.burst(this.x, this.y, Math.round(n / (unbound ? 4 : 2)), { color: ['#bff1ff', '#5fd4ff'], speed: [60, 340], life: [0.3, 0.9], size: [1.5, 3], drag: 3 });
      this.wasDisintegrated = true;
      this.die('disintegrate', source);
    }

    // Called when this hits a wall/body hard while thrown.
    onImpact(speed, other, world) {
      if (this.hp == null) return;
      const m = other ? U.clamp(other.mass, 0.6, 6) : 1.4;
      // An expanded Jon's throws hit harder: the thrown object's impactMul applies to what it hits too.
      const hitBy = other && other.thrown > 0 && other.impactMul ? other.impactMul : 1;
      const dmg = (speed - 200) * 0.12 * m * (this.impactMul || 1) * hitBy;
      if (dmg <= 1) return;
      if (!this.damage(dmg, other, 'impact')) return;
      world.particles.burst(this.x, this.y, 8, { color: ['#d8d0c0', '#9a9080'], speed: [40, 160], life: [0.2, 0.5], size: [2, 3.5], add: false });
      DM.Audio.play('impact');
      world.camera.shake(Math.min(0.55, 0.15 + dmg / 180));
      if (dmg > 30 && world.hitstop) world.hitstop(0.03 + dmg / 2000);
    }

    impulse(ix, iy) {
      if (this.static) return;
      this.vx += ix / this.mass;
      this.vy += iy / this.mass;
    }

    distTo(e) {
      return U.dist(this.x, this.y, e.x, e.y);
    }
  }

  DM.Entity = Entity;
})();
</script>
<script>/* src/game/world.js */
/*
 * World: one playable map. Owns entities, walls, particles and the camera.
 *
 * Maps are built by chapter `maps` functions using the helpers here
 * (wall, room, bake, decal...). Walls are axis-aligned rects; their look comes
 * from WALL_STYLES (extendable per map via world.wallStyles).
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;

  // low: blocks movement but not shots/sight. seeThrough: blocks shots, not sight.
  const WALL_STYLES = {
    wall: { top: '#3d4552', face: '#262c35', edge: '#11151b' },
    glass: { top: 'rgba(150,215,255,0.22)', face: 'rgba(120,190,240,0.3)', edge: 'rgba(190,235,255,0.75)', seeThrough: true },
    low: { top: '#7a6a4c', face: '#54472f', edge: '#2e2619', low: true },
    door: { draw: () => {} },
  };

  class World {
    constructor(o = {}) {
      this.w = o.w || 2000;
      this.h = o.h || 2000;
      this.bg = o.bg || '#05070b';
      this.entities = [];
      this.walls = [];
      this.decals = []; // fn(ctx, world, view) drawn above the floor
      this.overlays = []; // fn(ctx, world, view) drawn above entities
      this.barks = [];
      this.particles = new DM.Particles(4000);
      this.camera = new DM.Camera();
      this.camera.bounds = { w: this.w, h: this.h };
      this.baseZoom = o.zoom || 1; // per-map camera zoom; Expand zooms out relative to it
      this.camera.zoom = this.camera.targetZoom = this.baseZoom;
      this.wallStyles = Object.assign({}, WALL_STYLES, o.wallStyles || {});
      this.time = 0;
      this.timeScale = 1;
      this.slowmo = false; // set by Temporal Sight
      this.timesight = false;
      this.mouse = { x: 0, y: 0 };
      this.player = null;
      this.boss = null;
      this.floorCanvas = null;
      this.floorLive = null;
      this.tint = null; // screen tint colour (rgba string)
      this._bodies = [];
      this._deferred = [];
    }

    // Run fn after this frame's entity updates (chain reactions, spawns from callbacks).
    defer(fn) {
      this._deferred.push(fn);
    }

    // ---- building ---------------------------------------------------------
    add(e) {
      e.world = this;
      this.entities.push(e);
      if (e.onAdd) e.onAdd(this);
      return e;
    }

    wall(x, y, w, h, kind = 'wall', extra) {
      const st = this.wallStyles[kind] || this.wallStyles.wall;
      const wl = Object.assign({ x, y, w, h, kind, low: !!st.low, seeThrough: !!st.seeThrough, noCollide: false }, extra || {});
      this.walls.push(wl);
      return wl;
    }

    // A rectangular room outline with door gaps.
    // doors: [{ side: 'top'|'bottom'|'left'|'right', at: offset along side, w: width }]
    room(x, y, w, h, o = {}) {
      const t = o.t || 16;
      const kind = o.kind || 'wall';
      const doors = o.doors || [];
      const side = (name, len, seg) => {
        const gaps = doors.filter((d) => d.side === name).map((d) => [d.at, d.at + d.w]).sort((a, b) => a[0] - b[0]);
        let cur = 0;
        for (const [g0, g1] of gaps) {
          if (g0 > cur) seg(cur, g0);
          cur = Math.max(cur, g1);
        }
        if (cur < len) seg(cur, len);
      };
      side('top', w, (a, b) => this.wall(x + a, y, b - a, t, kind));
      side('bottom', w, (a, b) => this.wall(x + a, y + h - t, b - a, t, kind));
      side('left', h, (a, b) => this.wall(x, y + a, t, b - a, kind));
      side('right', h, (a, b) => this.wall(x + w - t, y + a, t, b - a, kind));
    }

    // Pre-render the static floor once into an offscreen canvas.
    bake(drawFn) {
      const maxPx = 5.5e6;
      const s = Math.min(1, Math.sqrt(maxPx / (this.w * this.h)));
      const c = document.createElement('canvas');
      c.width = Math.ceil(this.w * s);
      c.height = Math.ceil(this.h * s);
      const g = c.getContext('2d');
      g.scale(s, s);
      drawFn(g, this.w, this.h);
      this.floorCanvas = c;
      this.floorScale = s;
    }

    bark(e, text, dur = 1.8) {
      this.barks = this.barks.filter((b) => b.e !== e);
      this.barks.push({ e, text, t: dur, dur });
    }

    // ---- queries ----------------------------------------------------------
    query(x, y, r, filter) {
      const out = [];
      for (const e of this.entities) {
        if (e.dead) continue;
        if (U.dist2(x, y, e.x, e.y) > (r + e.r) * (r + e.r)) continue;
        if (filter && !filter(e)) continue;
        out.push(e);
      }
      return out;
    }

    // Can a circle of radius r stand at (x, y)?
    isFree(x, y, r) {
      if (x < r || y < r || x > this.w - r || y > this.h - r) return false;
      for (const w of this.walls) {
        if (w.noCollide) continue;
        if (U.circleRect(x, y, r, w)) return false;
      }
      return true;
    }

    // Line of sight (low walls and glass don't block sight).
    los(x1, y1, x2, y2) {
      for (const w of this.walls) {
        if (w.noCollide || w.low || w.seeThrough) continue;
        if (U.segRect(x1, y1, x2, y2, w) >= 0) return false;
      }
      return true;
    }

    // First wall hit by a shot along the segment, as t in [0,1] or -1.
    shotHit(x1, y1, x2, y2) {
      let best = -1;
      for (const w of this.walls) {
        if (w.noCollide || w.low) continue;
        const t = U.segRect(x1, y1, x2, y2, w);
        if (t >= 0 && (best < 0 || t < best)) best = t;
      }
      return best;
    }

    // Damage + knockback in a radius. o.team: entities on this team are spared.
    explode(x, y, r, dmg, o = {}) {
      for (const e of this.entities) {
        if (e.dead || e === o.source) continue;
        if (o.team && e.team === o.team) continue;
        const d = U.dist(x, y, e.x, e.y);
        if (d > r + e.r) continue;
        const k = 1 - U.clamp(d / (r + e.r), 0, 1) * 0.6;
        if (e.hp != null || e.isPlayer || e.takesExplosions) e.damage(dmg * k, o.source || null, 'explosion');
        if (!e.static) {
          const n = U.norm(e.x - x, e.y - y);
          const f = (o.force || 520) * k;
          e.vx += (n.x * f) / Math.sqrt(e.mass);
          e.vy += (n.y * f) / Math.sqrt(e.mass);
        }
        if (e.onBlast) e.onBlast(x, y, r, this);
      }
      const P = this.particles;
      const fire = o.colors || ['#ffd27a', '#ff9a3c', '#ff5a2a', '#fff2c4'];
      P.burst(x, y, 26, { color: fire, speed: [40, r * 3.4], life: [0.2, 0.6], size: [4, 9], shape: 'glow', drag: 4 });
      P.burst(x, y, 14, { color: ['#2a2522', '#3a332e', '#1d1a18'], speed: [20, 90], life: [0.7, 1.5], size: [8, 15], size1: 24, shape: 'smoke', add: false, drag: 2, alpha: 0.7 });
      P.emit(x, y, { shape: 'ring', size: r * 0.3, size1: r * 1.1, life: 0.35, color: '#ffe2a8', drag: 0 });
      DM.Audio.play('explosion');
      // Felt in proportion to size, and less from the far side of the map.
      const near = U.clamp(1.25 - U.dist(x, y, this.camera.x, this.camera.y) / 900, 0.25, 1);
      this.camera.shake(Math.min(0.8, 0.45 * (r / 70)) * near);
      if (r >= 90 && near > 0.5) this.hitstop(0.05);
    }

    // Broadcast that a disintegration is about to land (bosses may dodge).
    emitCast(c) {
      for (const e of this.entities) if (!e.dead && e.onDisintegrateCast) e.onDisintegrateCast(c, this);
    }

    // ---- simulation -------------------------------------------------------
    // Hitstop: freeze the simulation for a few frames so a hit lands. Capped
    // at 0.2 s, never stacked (the longest request wins), and off when screen
    // shake is turned off in Settings.
    hitstop(t) {
      if (!(DM.Save.settings.shake > 0)) return;
      this.freezeT = Math.max(this.freezeT || 0, Math.min(t, 0.2));
    }

    update(dt) {
      this.realTime = (this.realTime || 0) + dt;
      if (this.freezeT > 0) {
        // Frozen: only the camera, speech bubbles and a trickle of particles move.
        // Jon still reads his controls (a zero-length step), so a key pressed
        // during the freeze is acted on instead of lost.
        this.freezeT -= dt;
        const p = this.player;
        if (p && !p.dead && this.entities.includes(p)) p.update(0, this);
        for (const b of this.barks) b.t -= dt;
        this.particles.update(dt * 0.15);
        this.camera.update(dt);
        return;
      }
      // Scripted slow motion (slowmoT seconds at slowmoTarget, real time) and
      // Temporal Sight (slowmoScale, default 0.28, never below sightFloor,
      // which a tachyon cloud raises): the slower one wins.
      // sightScale tracks Sight's share alone, for its screen overlay. Scripted
      // slow motion usually follows a hitstop, so it bites faster than Sight.
      if (this.slowmoT > 0) this.slowmoT -= dt;
      const sight = this.slowmo ? Math.max(this.slowmoScale == null ? 0.28 : this.slowmoScale, this.sightFloor || 0) : 1;
      const scripted = this.slowmoT > 0 ? (this.slowmoTarget == null ? 0.3 : this.slowmoTarget) : 1;
      const ts = Math.min(sight, scripted);
      this.timeScale = U.damp(this.timeScale, ts, scripted < sight && ts < this.timeScale ? 18 : 9, dt);
      this.sightScale = U.damp(this.sightScale == null ? 1 : this.sightScale, sight, 9, dt);
      const wdt = dt * this.timeScale;
      const pdt = dt * (this.slowmo ? 0.8 : 1);
      this.time += wdt;

      const list = this.entities;
      const n = list.length;
      for (let i = 0; i < n; i++) {
        const e = list[i];
        if (e.dead) continue;
        const edt = e.timeless ? pdt : wdt;
        e.age += edt;
        if (e.hitFlash > 0) e.hitFlash -= edt;
        if (e.thrown > 0) e.thrown -= edt;
        e.update(edt, this);
      }
      for (let i = 0; i < list.length; i++) {
        const e = list[i];
        if (e.dead || e.static || e.selfMove) continue;
        this.integrate(e, e.timeless ? pdt : wdt);
      }
      this.collideBodies();

      if (this._deferred.length) {
        const q = this._deferred;
        this._deferred = [];
        for (const fn of q) fn(this);
      }

      let anyDead = false;
      for (const e of list) if (e.dead) anyDead = true;
      if (anyDead) {
        this.entities = list.filter((e) => {
          if (e.dead && e.onRemove) e.onRemove(this);
          return !e.dead;
        });
      }

      for (const b of this.barks) b.t -= dt;
      this.barks = this.barks.filter((b) => b.t > 0 && !b.e.dead);
      this.particles.update(wdt);
      this.camera.update(dt);
    }

    integrate(e, dt) {
      if (!e.heldBy) {
        // Thrown things fly: ground friction is mostly off while `thrown` lasts.
        const f = Math.exp(-(e.thrown > 0 ? e.friction * 0.22 : e.friction) * dt);
        e.vx *= f;
        e.vy *= f;
      }
      const travel = (Math.abs(e.vx) + Math.abs(e.vy)) * dt;
      const steps = e.solid ? Math.min(6, Math.max(1, Math.ceil(travel / Math.max(4, e.r * 0.8)))) : 1;
      const sdt = dt / steps;
      for (let i = 0; i < steps; i++) {
        e.x += e.vx * sdt;
        e.y += e.vy * sdt;
        if (e.solid) this.collideWalls(e);
      }
      if (e.x < e.r) { e.x = e.r; if (e.vx < 0) e.vx *= -0.3; }
      if (e.y < e.r) { e.y = e.r; if (e.vy < 0) e.vy *= -0.3; }
      if (e.x > this.w - e.r) { e.x = this.w - e.r; if (e.vx > 0) e.vx *= -0.3; }
      if (e.y > this.h - e.r) { e.y = this.h - e.r; if (e.vy > 0) e.vy *= -0.3; }
    }

    collideWalls(e) {
      for (const w of this.walls) {
        if (w.noCollide) continue;
        if (e.flying && w.low) continue;
        if (e.x + e.r < w.x || e.x - e.r > w.x + w.w || e.y + e.r < w.y || e.y - e.r > w.y + w.h) continue;
        const hit = U.circleRect(e.x, e.y, e.r, w);
        if (!hit) continue;
        e.x += hit.nx * hit.depth;
        e.y += hit.ny * hit.depth;
        const vn = e.vx * hit.nx + e.vy * hit.ny;
        if (vn < 0) {
          if (e.onWall) e.onWall(-vn, w, this);
          if (e.thrown > 0 && -vn > 260) e.onImpact(-vn, null, this);
          const b = e.bounce;
          e.vx -= (1 + b) * vn * hit.nx;
          e.vy -= (1 + b) * vn * hit.ny;
        }
      }
    }

    collideBodies() {
      const B = this._bodies;
      B.length = 0;
      for (const e of this.entities) if (e.body && !e.dead) B.push(e);
      B.sort((a, b) => a.x - a.r - (b.x - b.r));
      for (let i = 0; i < B.length; i++) {
        const a = B[i];
        const ax1 = a.x + a.r;
        for (let j = i + 1; j < B.length; j++) {
          const b = B[j];
          if (b.x - b.r > ax1) break;
          if (a.flying !== b.flying) continue;
          const dx = b.x - a.x, dy = b.y - a.y;
          const rr = a.r + b.r;
          const d2 = dx * dx + dy * dy;
          if (d2 >= rr * rr) continue;
          const d = Math.sqrt(d2);
          const nx = d > 0.01 ? dx / d : 1, ny = d > 0.01 ? dy / d : 0;
          const ima = a.static ? 0 : 1 / a.mass, imb = b.static ? 0 : 1 / b.mass;
          const sum = ima + imb;
          if (sum === 0) continue;
          const overlap = rr - d;
          a.x -= nx * overlap * (ima / sum);
          a.y -= ny * overlap * (ima / sum);
          b.x += nx * overlap * (imb / sum);
          b.y += ny * overlap * (imb / sum);
          const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (rv < 0) {
            const sp = -rv;
            if ((a.thrown > 0 || b.thrown > 0) && sp > 240) {
              a.onImpact(sp, b, this);
              b.onImpact(sp, a, this);
            }
            const jn = (-1.2 * rv) / sum;
            a.vx -= jn * ima * nx;
            a.vy -= jn * ima * ny;
            b.vx += jn * imb * nx;
            b.vy += jn * imb * ny;
          }
        }
      }
    }

    // ---- rendering --------------------------------------------------------
    // The map's presentation (light, weather, wall surfaces) from src/data/atmosphere.js.
    get atmosphere() {
      return (DM.Atmosphere && DM.Atmosphere.get(this.mapId)) || null;
    }

    // Order: floor, decals, wall shadows, walls, entities, particles; then the
    // light layer (night and interior maps); then the emissive pass, which the
    // light never darkens: entities' renderEmissive (telegraphs), the player's
    // power effects and Temporal Sight's futures; then overlays and barks.
    //
    // world.lit is true while World draws that emissive pass itself (lighting
    // active, or Temporal Sight's colour pass): entities that define
    // renderEmissive call it from render() only while !world.lit.
    render(ctx) {
      const cam = this.camera;
      const view = cam.view();
      const atmo = this.atmosphere;
      const L = DM.Lighting;
      this.lighting = !!(atmo && L && L.active(this, atmo));
      const grade = this.updateSight() > 0.02; // Play.renderTimesight draws the colour pass
      this.lit = this.lighting || grade;
      ctx.save();
      cam.apply(ctx);

      ctx.fillStyle = this.bg;
      ctx.fillRect(view.x0 - 40, view.y0 - 40, view.x1 - view.x0 + 80, view.y1 - view.y0 + 80);
      if (this.floorCanvas) {
        const s = this.floorScale;
        const x0 = Math.max(0, view.x0), y0 = Math.max(0, view.y0);
        const x1 = Math.min(this.w, view.x1), y1 = Math.min(this.h, view.y1);
        if (x1 > x0 && y1 > y0) ctx.drawImage(this.floorCanvas, x0 * s, y0 * s, (x1 - x0) * s, (y1 - y0) * s, x0, y0, x1 - x0, y1 - y0);
      }
      if (this.floorLive) this.floorLive(ctx, this, view);
      for (const d of this.decals) d(ctx, this, view);

      this.renderWalls(ctx, view, atmo);

      const vis = (this._vis = this._vis || []);
      const keep = (this._keep = this._keep || []);
      vis.length = keep.length = 0;
      for (const e of this.entities) {
        if (e.dead) continue;
        const m = e.r + 120;
        if (e.x < view.x0 - m || e.x > view.x1 + m || e.y < view.y0 - m || e.y > view.y1 + m) continue;
        vis.push(e);
      }
      vis.sort((a, b) => a.layer - b.layer || a.y - b.y);
      for (const e of vis) {
        if (grade && World.keepsColour(e)) keep.push(e);
        else e.render(ctx, this);
      }
      if (grade) this.trackGhosts(vis);
      this.particles.render(ctx, view);

      if (this.lighting) {
        ctx.restore();
        L.render(ctx, this, atmo);
        ctx.save();
        cam.apply(ctx);
      }
      if (!grade) this.renderEmissive(ctx, vis);
      for (const o of this.overlays) o(ctx, this, view);

      for (const b of this.barks) {
        const a = Math.min(1, b.t * 3, (b.dur - b.t) * 8);
        Gfx.bubble(ctx, b.text, b.e.x, b.e.y - b.e.r - 8, { alpha: a });
      }
      ctx.restore();
    }

    // Telegraphs, power effects and futures: drawn above the light layer (and
    // in full colour during Temporal Sight). ctx is in world space.
    renderEmissive(ctx, vis = this._vis || []) {
      if (this.lit) for (const e of vis) if (e.renderEmissive && !e.dead) e.renderEmissive(ctx, this);
      if (this.player && this.player.renderFx) this.player.renderFx(ctx, this);
      if (this.timesight) for (const e of vis) if (e.renderFuture && !e.dead) e.renderFuture(ctx, this);
    }

    // 0..1: how far Temporal Sight's colour grade has faded in. Follows
    // world.timesight over about 0.3 s, in real time, frozen while paused.
    updateSight() {
      const rt = this.realTime || 0;
      const dt = U.clamp(rt - (this._sightRT == null ? rt : this._sightRT), 0, 0.1);
      this._sightRT = rt;
      this.sightK = U.damp(this.sightK || 0, this.timesight ? 1 : 0, 11, dt);
      if (this.sightK < 0.005 && !this.timesight) this.sightK = 0;
      return this.sightK;
    }

    // Where visible enemies were over the last 0.6 s (world time), for the
    // fading amber ghosts Temporal Sight shows.
    trackGhosts(vis) {
      const G = (this.ghosts = this.ghosts || new Map());
      const t = this.time;
      if (t - (this._ghostT || -1) < 0.1) return;
      this._ghostT = t;
      for (const e of vis) {
        if (e.team !== 'enemy' || e.static || e.isProjectile || e.ko || e.hidden) continue;
        let h = G.get(e);
        if (!h) G.set(e, (h = []));
        h.push(e.x, e.y, t);
        while (h.length > 18 || (h.length && t - h[2] > 0.6)) h.splice(0, 3);
      }
      for (const [e, h] of G) if (e.dead || !h.length || t - h[h.length - 1] > 0.6) G.delete(e);
    }

    // ---- walls ------------------------------------------------------------
    // Two passes over the visible walls: every cast shadow first (one path,
    // 'multiply', away from DM.LIGHT_DIR and scaled by the wall's height),
    // then the bodies with their surface pattern and one ink line.
    renderWalls(ctx, view, atmo) {
      const look = atmo && atmo.walls;
      const LD = DM.LIGHT_DIR;
      const list = (this._wallVis = this._wallVis || []);
      list.length = 0;
      for (const w of this.walls) {
        if (w.x > view.x1 || w.x + w.w + 30 < view.x0 || w.y > view.y1 || w.y + w.h + 30 < view.y0) continue;
        list.push(w);
      }
      let any = false;
      const sp = new Path2D();
      for (const w of list) {
        const st = this.wallStyles[w.kind] || this.wallStyles.wall;
        const a = look && look[w.kind];
        if (w.noShadow || w.draw || st.flat || st.seeThrough || (st.draw && !a) || (a && a.height === 0)) continue;
        const h = a && a.height != null ? a.height : st.height != null ? st.height : st.low ? 0.5 : 1;
        const dx = LD.x * h, dy = LD.y * h;
        const surf = a && a.pattern && DM.WallSurfaces[a.pattern];
        const outline = surf && surf.outline && sp.addPath && surf.outline(w);
        if (outline) {
          // Irregular shapes (rock) cast their own outline, swept along the light.
          sp.addPath(outline, new DOMMatrix([1, 0, 0, 1, dx, dy]));
          sp.addPath(outline, new DOMMatrix([1, 0, 0, 1, dx / 2, dy / 2]));
        } else {
          sp.moveTo(w.x, w.y);
          sp.lineTo(w.x + w.w, w.y);
          sp.lineTo(w.x + w.w + dx, w.y + dy);
          sp.lineTo(w.x + w.w + dx, w.y + w.h + dy);
          sp.lineTo(w.x + dx, w.y + w.h + dy);
          sp.lineTo(w.x, w.y + w.h);
          sp.closePath();
        }
        any = true;
      }
      if (any) {
        ctx.save();
        ctx.globalCompositeOperation = 'multiply';
        ctx.fillStyle = (atmo && atmo.shadow) || 'rgba(0,0,0,0.3)';
        ctx.fill(sp);
        ctx.restore();
      }
      for (const w of list) this.drawWall(ctx, w, look || null);
    }

    drawWall(ctx, w, look = (this.atmosphere || {}).walls) {
      const st = this.wallStyles[w.kind] || this.wallStyles.wall;
      if (w.draw) return w.draw(ctx, w, this);
      const a = look && look[w.kind];
      if (st.draw && !a) return st.draw(ctx, w, this);
      const surf = a && a.pattern && DM.WallSurfaces[a.pattern];
      if (surf && surf.body) {
        if (surf.body(ctx, w, st, a, this)) return; // drew its own outline
      } else {
        ctx.fillStyle = (a && a.top) || st.top;
        ctx.fillRect(w.x, w.y, w.w, w.h);
        if (surf) surf.overlay(ctx, w, st, a, this);
        if (st.face && w.h > 10 && !st.flat) {
          ctx.fillStyle = (a && a.face) || st.face;
          ctx.fillRect(w.x, w.y + w.h - Math.min(8, w.h * 0.35), w.w, Math.min(8, w.h * 0.35));
        }
      }
      if (st.edge || a) {
        // One comic ink line on everything solid; glass and water keep their edge.
        const ink = !(st.seeThrough || st.flat);
        const lw = ink ? (st.low ? 2 : 2.5) : 1.5;
        ctx.strokeStyle = ink ? DM.C.ink : st.edge;
        ctx.lineWidth = lw;
        ctx.strokeRect(w.x + lw / 2, w.y + lw / 2, w.w - lw, w.h - lw);
      }
    }

    // Kept in full colour by Temporal Sight's grade: Jon and what is not of
    // this moment (duplicates, afterimages), danger (enemy fire, hazards such
    // as meteors and mines) and the memories Sight reveals.
    static keepsColour(e) {
      if (e.isPlayer || e.isDuplicate || e.timeless || e.hazard) return true;
      if (e.isProjectile && e.team !== 'player') return true;
      const Sp = DM.Special;
      return !!(Sp && Sp.Memory && e instanceof Sp.Memory);
    }
  }

  // Light falls from the top left; shadows fall this far for a wall of height 1.
  DM.LIGHT_DIR = { x: 10, y: 14 };

  // ---- wall surfaces ----------------------------------------------------------
  // Procedural surface looks, picked per map and wall kind in atmosphere.js
  // (walls: { kind: { pattern, height, top, ... } }). overlay() draws over the
  // wall's base fill; body() replaces the whole wall and returns true if it drew
  // its own outline. Tiles are cached CanvasPatterns painted at twice world
  // resolution; per-wall detail is seeded by the wall's rect and cached on it.
  const tiles = new Map();
  function tile(ctx, key, w, h, paint) {
    let p = tiles.get(key);
    if (p) return p;
    const c = document.createElement('canvas');
    c.width = w * 2;
    c.height = h * 2;
    const g = c.getContext('2d');
    g.scale(2, 2);
    paint(g, w, h);
    p = ctx.createPattern(c, 'repeat');
    if (p.setTransform && typeof DOMMatrix === 'function') p.setTransform(new DOMMatrix([0.5, 0, 0, 0.5, 0, 0]));
    tiles.set(key, p);
    return p;
  }
  const seedOf = (w) => (Math.imul(w.x | 0, 73856093) ^ Math.imul(w.y | 0, 19349663) ^ Math.imul((w.w | 0) + 7, 83492791) ^ Math.imul((w.h | 0) + 3, 2654435761)) >>> 0;
  const deco = (w, key, make) => w['_' + key] || (w['_' + key] = make(U.seeded(seedOf(w))));
  const patternFill = (ctx, pat, w) => {
    ctx.fillStyle = pat;
    ctx.fillRect(w.x, w.y, w.w, w.h);
  };
  const along = (w) => w.w >= w.h; // long axis is horizontal

  // A faceted rock: the wall split into chunks along its long axis, each an
  // irregular polygon inset in the rect and fanned from an apex nudged towards
  // the light, its facets shaded by which way they face.
  function rockPaths(w, rnd) {
    const P = { lit: new Path2D(), mid: new Path2D(), dark: new Path2D(), ink: new Path2D() };
    const hz = along(w);
    const short = hz ? w.h : w.w, long = hz ? w.w : w.h;
    const n = Math.max(1, Math.round(long / Math.max(short * 2.2, 40)));
    const seg = long / n;
    for (let i = 0; i < n; i++) {
      const r = hz ? { x: w.x + i * seg - (i ? 3 : 0), y: w.y, w: seg + (i ? 3 : 0), h: w.h } : { x: w.x, y: w.y + i * seg - (i ? 3 : 0), w: w.w, h: seg + (i ? 3 : 0) };
      const ins = Math.min(r.w, r.h) * 0.16;
      const pts = [];
      const k = 3; // points per side
      const side = (x0, y0, x1, y1, nx, ny) => {
        for (let j = 0; j < k; j++) {
          const f = (j + rnd() * 0.6) / k, d = ins * (j === 0 ? 0.9 + rnd() * 0.6 : rnd());
          pts.push([x0 + (x1 - x0) * f + nx * d, y0 + (y1 - y0) * f + ny * d]);
        }
      };
      side(r.x, r.y, r.x + r.w, r.y, 0, 1);
      side(r.x + r.w, r.y, r.x + r.w, r.y + r.h, -1, 0);
      side(r.x + r.w, r.y + r.h, r.x, r.y + r.h, 0, -1);
      side(r.x, r.y + r.h, r.x, r.y, 1, 0);
      const ax = r.x + r.w * (0.42 + rnd() * 0.1), ay = r.y + r.h * (0.4 + rnd() * 0.1);
      P.ink.moveTo(pts[0][0], pts[0][1]);
      for (let j = 0; j < pts.length; j++) {
        const a = pts[j], b = pts[(j + 1) % pts.length];
        P.ink.lineTo(b[0], b[1]);
        // Facet normal (outward) against the light from the top left.
        const mx = (a[0] + b[0]) / 2 - ax, my = (a[1] + b[1]) / 2 - ay;
        const dot = (mx * -0.58 + my * -0.81) / (Math.hypot(mx, my) || 1);
        const path = dot > 0.2 ? P.lit : dot < -0.15 ? P.dark : P.mid;
        path.moveTo(ax, ay);
        path.lineTo(a[0], a[1]);
        path.lineTo(b[0], b[1]);
        path.closePath();
      }
      P.ink.closePath();
    }
    return P;
  }

  const Surfaces = {
    // Corrugated shipping containers: ribs across the long axis, a rust streak
    // or two, and the door end with its lock rods.
    ribbed: {
      overlay(ctx, w) {
        const hz = along(w);
        patternFill(ctx, tile(ctx, hz ? 'ribV' : 'ribH', 6, 6, (g) => {
          g.fillStyle = 'rgba(255,255,255,0.1)';
          if (hz) g.fillRect(0, 0, 1.5, 6);
          else g.fillRect(0, 0, 6, 1.5);
          g.fillStyle = 'rgba(0,0,0,0.26)';
          if (hz) g.fillRect(3, 0, 1.5, 6);
          else g.fillRect(0, 3, 6, 1.5);
        }), w);
        const d = deco(w, 'ribbed', (rnd) => ({
          end: rnd() < 0.5,
          rust: Array.from({ length: 2 + ((rnd() * 3) | 0) }, () => [rnd(), 0.05 + rnd() * 0.06, 0.3 + rnd() * 0.6]),
        }));
        const L = hz ? w.w : w.h, S = hz ? w.h : w.w;
        ctx.fillStyle = 'rgba(120,50,20,0.32)';
        for (const [f, wd, len] of d.rust) {
          if (hz) ctx.fillRect(w.x + f * (L - L * wd), w.y + 3, L * wd, S * len);
          else ctx.fillRect(w.x + 3, w.y + f * (L - L * wd), S * len, L * wd);
        }
        // door end: seam, frame and four lock rods
        const e = d.end ? 0 : L - 14;
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        if (hz) ctx.fillRect(w.x + e, w.y + 2, 14, w.h - 4);
        else ctx.fillRect(w.x + 2, w.y + e, w.w - 4, 14);
        ctx.strokeStyle = 'rgba(220,220,210,0.55)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
          const o = e + 2.5 + i * 3;
          if (hz) {
            ctx.moveTo(w.x + o, w.y + 4);
            ctx.lineTo(w.x + o, w.y + w.h - 4);
          } else {
            ctx.moveTo(w.x + 4, w.y + o);
            ctx.lineTo(w.x + w.w - 4, w.y + o);
          }
        }
        ctx.stroke();
      },
    },

    // Running-bond brickwork.
    brick: {
      overlay(ctx, w) {
        patternFill(ctx, tile(ctx, 'brick', 20, 10, (g) => {
          g.fillStyle = 'rgba(255,220,200,0.07)';
          g.fillRect(0, 0, 20, 1.2);
          g.fillRect(0, 5, 20, 1.2);
          g.fillStyle = 'rgba(0,0,0,0.32)';
          g.fillRect(0, 4, 20, 1);
          g.fillRect(0, 9, 20, 1);
          g.fillRect(9, 0, 1, 4);
          g.fillRect(19, 5, 1, 4);
        }), w);
      },
    },

    // Rows of rounded bags with seams.
    sandbag: {
      overlay(ctx, w) {
        patternFill(ctx, tile(ctx, along(w) ? 'bagH' : 'bagV', along(w) ? 18 : 11, along(w) ? 11 : 18, (g, tw, th) => {
          const bag = (x, y, bw, bh) => {
            g.fillStyle = 'rgba(255,245,220,0.16)';
            Gfx.rr(g, x + 1, y + 1, bw - 2, bh - 2, Math.min(bw, bh) * 0.45);
            g.fill();
            g.strokeStyle = 'rgba(40,30,15,0.38)';
            g.lineWidth = 0.8;
            g.stroke();
            g.fillStyle = 'rgba(0,0,0,0.12)';
            g.fillRect(x + bw * 0.25, y + bh - 3, bw * 0.5, 1.5);
          };
          if (tw > th) {
            bag(0, 0, 18, 5.5);
            bag(-9, 5.5, 18, 5.5);
            bag(9, 5.5, 18, 5.5);
          } else {
            bag(0, 0, 5.5, 18);
            bag(5.5, -9, 5.5, 18);
            bag(5.5, 9, 5.5, 18);
          }
        }), w);
      },
    },

    // Faceted rock: lit top left, dark bottom right.
    rock: {
      outline: (w) => deco(w, 'rock', (rnd) => rockPaths(w, rnd)).ink,
      body(ctx, w, st, a) {
        const P = deco(w, 'rock', (rnd) => rockPaths(w, rnd));
        const top = (a && a.top) || st.top || '#7a5a3a';
        ctx.fillStyle = top;
        ctx.fill(P.ink);
        ctx.fillStyle = (a && a.lit) || U.mix(top, '#fff4e0', 0.28);
        ctx.fill(P.lit);
        ctx.fillStyle = (a && a.dark) || U.mix(top, '#000000', 0.38);
        ctx.fill(P.dark);
        ctx.strokeStyle = 'rgba(0,0,0,0.18)';
        ctx.lineWidth = 1;
        ctx.stroke(P.lit);
        ctx.strokeStyle = DM.C.ink;
        ctx.lineWidth = 2.5;
        const join = ctx.lineJoin;
        ctx.lineJoin = 'round';
        ctx.stroke(P.ink);
        ctx.lineJoin = join;
        return true;
      },
    },

    // Ice: facet lines, a specular streak and cyan cracks.
    ice: {
      overlay(ctx, w) {
        const d = deco(w, 'ice', (rnd) => {
          const facets = new Path2D(), cracks = new Path2D();
          const hz = along(w), L = hz ? w.w : w.h, S = hz ? w.h : w.w;
          const pt = (u, v) => (hz ? [w.x + u, w.y + v] : [w.x + v, w.y + u]);
          for (let u = 10 + rnd() * 30; u < L - 6; u += 28 + rnd() * 40) {
            const a = pt(u, 0), b = pt(u + (rnd() - 0.5) * S * 1.4, S);
            facets.moveTo(a[0], a[1]);
            facets.lineTo(b[0], b[1]);
          }
          for (let c = 0; c < Math.max(1, L / 140); c++) {
            let u = rnd() * L, v = rnd() * S;
            let p = pt(u, v);
            cracks.moveTo(p[0], p[1]);
            for (let s = 0; s < 4; s++) {
              u = U.clamp(u + (rnd() - 0.3) * 22, 2, L - 2);
              v = U.clamp(v + (rnd() - 0.5) * S * 0.7, 2, S - 2);
              p = pt(u, v);
              cracks.lineTo(p[0], p[1]);
            }
          }
          return { facets, cracks, spec: rnd() };
        });
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 1.2;
        ctx.stroke(d.facets);
        ctx.strokeStyle = 'rgba(70,170,220,0.55)';
        ctx.lineWidth = 1;
        ctx.stroke(d.cracks);
        // specular streak near the lit edge
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        if (along(w)) ctx.fillRect(w.x + 4, w.y + 3, w.w - 8, Math.min(3, w.h * 0.15));
        else ctx.fillRect(w.x + 3, w.y + 4, Math.min(3, w.w * 0.15), w.h - 8);
      },
    },

    // Warehouse racking: boxes, sacks and barrels on the shelves.
    shelf: {
      overlay(ctx, w) {
        const hz = along(w), L = hz ? w.w : w.h, S = hz ? w.h : w.w;
        const d = deco(w, 'shelf', (rnd) => {
          const items = [];
          for (let u = 3; u < L - 8;) {
            const len = 8 + rnd() * 14;
            if (rnd() < 0.82) items.push({ u, len: Math.min(len, L - 3 - u), barrel: rnd() < 0.25, c: ['#7a5a36', '#8a6a40', '#5a5a48', '#6b3a2a', '#9a8a68'][(rnd() * 5) | 0], v: rnd() });
            u += len + 2;
          }
          return items;
        });
        for (const it of d) {
          const iw = it.len, ih = S * (0.55 + it.v * 0.25);
          const x = hz ? w.x + it.u : w.x + (S - ih) / 2, y = hz ? w.y + (S - ih) / 2 : w.y + it.u;
          const bw = hz ? iw : ih, bh = hz ? ih : iw;
          ctx.fillStyle = it.c;
          if (it.barrel) {
            Gfx.circle(ctx, x + bw / 2, y + bh / 2, Math.min(bw, bh) / 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.45)';
            ctx.lineWidth = 1;
            ctx.stroke();
          } else {
            ctx.fillRect(x, y, bw, bh);
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.fillRect(x, y, bw, 1.5);
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            if (hz) ctx.fillRect(x + bw / 2 - 0.5, y, 1, bh);
            else ctx.fillRect(x, y + bh / 2 - 0.5, bw, 1);
          }
        }
      },
    },

    // Karnak gold: a band of inlaid glyphs along the wall and a stepped rim.
    gold: {
      overlay(ctx, w) {
        const hz = along(w), S = hz ? w.h : w.w;
        ctx.strokeStyle = 'rgba(255,240,190,0.45)';
        ctx.lineWidth = 1.2;
        ctx.strokeRect(w.x + 4, w.y + 4, w.w - 8, w.h - 8);
        ctx.strokeStyle = 'rgba(80,55,10,0.4)';
        ctx.strokeRect(w.x + 7, w.y + 7, w.w - 14, w.h - 14);
        if (S < 22 || w.w === w.h) return;
        const band = hz ? { x: w.x + 8, y: w.y + S / 2 - 5, w: w.w - 16, h: 10 } : { x: w.x + S / 2 - 5, y: w.y + 8, w: 10, h: w.h - 16 };
        patternFill(ctx, tile(ctx, hz ? 'glyphH' : 'glyphV', hz ? 16 : 10, hz ? 10 : 16, (g, tw, th) => {
          g.fillStyle = 'rgba(70,45,5,0.55)';
          if (tw > th) {
            g.fillRect(2, 2, 2, 6);
            g.fillRect(5, 2, 4, 2);
            g.fillRect(7, 4, 2, 4);
            g.fillRect(11, 3, 3, 3);
          } else {
            g.fillRect(2, 2, 6, 2);
            g.fillRect(2, 5, 2, 4);
            g.fillRect(4, 7, 4, 2);
            g.fillRect(3, 11, 3, 3);
          }
        }), band);
      },
    },

    // Poured concrete: panel seams and a fine speckle.
    concrete: {
      overlay(ctx, w) {
        patternFill(ctx, tile(ctx, 'concrete', 32, 32, (g) => {
          const rnd = U.seeded(9);
          for (let i = 0; i < 26; i++) {
            g.fillStyle = rnd() < 0.5 ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.1)';
            g.fillRect(rnd() * 32, rnd() * 32, 1.2, 1.2);
          }
        }), w);
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        if (along(w)) for (let x = w.x + 40; x < w.x + w.w - 10; x += 40) ctx.fillRect(x, w.y, 1, w.h);
        else for (let y = w.y + 40; y < w.y + w.h - 10; y += 40) ctx.fillRect(w.x, y, w.w, 1);
      },
    },
  };

  DM.WallSurfaces = Surfaces;
  DM.World = World;
  DM.WALL_STYLES = WALL_STYLES;
})();
</script>
<script>/* src/game/entities/npc.js */
/*
 * Character looks (used for both top-down figures and dialogue portraits) and
 * the NPC entity. Add a cast member by adding a LOOKS entry; dialogue lines
 * refer to speakers by these keys.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;

  const LOOKS = {
    jon: { name: 'Jon Osterman', skin: '#ecc8a6', hair: '#3b2a1f', hairStyle: 'short', body: '#ebe7dc', sleeve: '#ebe7dc', legs: '#3a3f4b', bg: '#c4a964', collar: '#8aa1b4', color: '#cfe8ff' },
    manhattan: { name: 'Dr. Manhattan', manhattan: true, skin: '#7fd8ff', body: '#4fc0f2', hair: null, hairStyle: 'bald', bg: '#0c2740', color: '#7fe3ff' },
    janey: { name: 'Janey Slater', skin: '#f1cba9', hair: '#8c3a20', hairStyle: 'long', body: '#5d9384', sleeve: '#f1cba9', legs: '#5d9384', bg: '#d9b26a', color: '#ffd1a8' },
    wally: { name: 'Wally Weaver', skin: '#f0c9ab', hair: '#d6b05a', hairStyle: 'short', body: '#ebe7dc', sleeve: '#ebe7dc', legs: '#4b4339', size: 1.15, bg: '#8fb0a1', glasses: true, color: '#ffe6a0' },
    glass: { name: 'Prof. Milton Glass', skin: '#e2bd9c', hair: '#cfcac2', hairStyle: 'thin', glasses: true, body: '#5a554f', sleeve: '#5a554f', legs: '#3b3835', bg: '#a08e7c', color: '#e8dccb' },
    colonel: { name: 'Colonel Hart', skin: '#dcb08a', hair: '#555555', hat: '#4a5638', hatStyle: 'cap', hatBrim: '#2c3322', badge: '#d8b23a', body: '#5a6a44', sleeve: '#5a6a44', legs: '#4a5638', bg: '#8c9a6a', color: '#d7e3b0' },
    captain: { name: 'Captain Rourke', skin: '#e0b28e', hair: '#3a3a3a', hat: '#1d2b4f', hatStyle: 'cap', hatBrim: '#0f172d', badge: '#d8d8d8', body: '#22345e', sleeve: '#22345e', legs: '#1d2b4f', bg: '#5d7290', moustache: true, color: '#c8d6f0' },
    general: { name: 'General Brandt', skin: '#d9ab86', hair: '#bdbdbd', hat: '#3e4a30', hatStyle: 'cap', hatBrim: '#232a1a', badge: '#e8c54a', body: '#4d5b3a', sleeve: '#4d5b3a', legs: '#3e4a30', bg: '#9b8a5a', color: '#e6dfb0' },
    reporter: { name: 'Reporter', skin: '#e6bf9b', hair: '#5a3b26', hairStyle: 'short', body: '#7b5e3c', sleeve: '#7b5e3c', legs: '#3b3530', bg: '#a66b6b', color: '#f0c8c8' },
    reporter2: { name: 'Reporter', skin: '#d9a77f', hair: '#1f1a17', hairStyle: 'long', body: '#7a3b4a', sleeve: '#7a3b4a', legs: '#2b2427', bg: '#8b6b9a', color: '#f0c8e0' },
    host: { name: 'TV Host', skin: '#eac2a0', hair: '#6b4a2b', hairStyle: 'slick', body: '#2e3b5a', sleeve: '#2e3b5a', legs: '#1f2638', bg: '#4f6a8a', color: '#d0e0ff' },
    laurie: { name: 'Laurie Juspeczyk', skin: '#f2cfb0', hair: '#2b1a14', hairStyle: 'long', body: '#1c1c22', sleeve: '#1c1c22', legs: '#1c1c22', trim: '#f2c94c', bg: '#c7a2c2', color: '#ffd6f0' },
    veidt: { name: 'Adrian Veidt', skin: '#f0d0b2', hair: '#e7cf72', hairStyle: 'slick', body: '#6f4aa6', sleeve: '#6f4aa6', legs: '#3d2a5e', cape: '#d4ad3a', trim: '#d4ad3a', bg: '#d6b85a', collar: '#d4ad3a', color: '#f3e0a0' },
  };

  const GANG = {
    hats: ['#2d2620', '#3a2f28', '#262a30', '#4a3b2a', '#1f1f24'],
    // A step lighter than the asphalt so they read at night (contrast >= 1.7 on #2b2d33).
    suits: ['#55535c', '#665443', '#46596b', '#705c46', '#5f4b54'],
    skins: ['#e6bf9b', '#d9a77f', '#c98f66', '#f0c9ab', '#a8714c'],
  };
  LOOKS.randomGangster = () => {
    const suit = U.pick(GANG.suits);
    return { name: 'Gangster', skin: U.pick(GANG.skins), hat: U.pick(GANG.hats), hatBrim: '#17130f', body: suit, sleeve: suit, legs: '#1d1b1c', bg: '#6a5a4a' };
  };

  class NPC extends DM.Entity {
    constructor(o) {
      super({ x: o.x, y: o.y, r: 13, mass: 40, friction: 10, disintegratable: false, team: 'neutral' });
      this.look = typeof o.look === 'string' ? LOOKS[o.look] : o.look;
      this.facing = o.facing || 0;
      this.baseFacing = this.facing;
      this.walk = 0;
      this.moving = false;
      this.speedBase = o.speed || 120;
      this.lookAtPlayer = o.lookAtPlayer !== false;
      this.moveTarget = null;
      if (o.talk) {
        const first = (this.look.name || 'them').split(' ')[0];
        this.interact = { label: o.label || 'Talk to ' + first, range: o.range || 62, onInteract: o.talk, enabled: o.enabled };
      }
    }
    walkTo(x, y) {
      this.moveTarget = { x, y };
    }
    update(dt, world) {
      if (this.moveTarget) {
        const d = U.dist(this.x, this.y, this.moveTarget.x, this.moveTarget.y);
        if (d < 6) {
          this.moveTarget = null;
        } else {
          const n = U.norm(this.moveTarget.x - this.x, this.moveTarget.y - this.y);
          this.vx = U.damp(this.vx, n.x * this.speedBase, 8, dt);
          this.vy = U.damp(this.vy, n.y * this.speedBase, 8, dt);
          this.facing = U.dampAngle(this.facing, Math.atan2(n.y, n.x), 10, dt);
        }
      }
      this.moving = this.speed > 15;
      if (this.moving) this.walk += dt * this.speed * 0.09;
      if (!this.moveTarget) {
        const p = world.player;
        if (this.lookAtPlayer && p && !p.hidden && U.dist(this.x, this.y, p.x, p.y) < 180) this.facing = U.dampAngle(this.facing, U.angleTo(this.x, this.y, p.x, p.y), 6, dt);
        else this.facing = U.dampAngle(this.facing, this.baseFacing, 3, dt);
      }
    }
    render(ctx) {
      Gfx.figure(ctx, Object.assign({}, this.look, { x: this.x, y: this.y, angle: this.facing, walk: this.walk, moving: this.moving }));
    }
  }

  DM.LOOKS = LOOKS;
  DM.NPC = NPC;
})();
</script>
<script>/* src/game/entities/player.js */
/*
 * The player: Jon. One entity across the whole journey, with three forms:
 *   human     — Jon Osterman, 1959. Walks, talks, interacts.
 *   awareness — a lone hydrogen atom drifting through the void, gathering itself.
 *   manhattan — Dr. Manhattan. Uses whatever powers have been unlocked.
 *
 * Powers live in src/game/powers.js; the player just owns their per-power state
 * (this.powers[id]) and calls each power's update every frame.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Input = DM.Input;

  const SPEED = { human: 165, awareness: 250, manhattan: 215 };

  class Player extends DM.Entity {
    constructor(x, y) {
      super({ x, y, r: 13, mass: 3, friction: 9, team: 'player', disintegratable: false });
      this.isPlayer = true;
      this.timeless = true;
      this.targetable = true;
      this.form = 'human';
      this.look = Object.assign({}, DM.LOOKS.jon);
      this.facing = 0;
      this.walk = 0;
      this.moving = false;

      this.energy = 100;
      this.maxEnergy = 100;
      this.energyRegen = 20;
      this.coherence = 100;
      this.maxCoherence = 100;
      this.regenDelay = 0;

      this.baseR = 13;
      this.scale = 1;
      this.targetScale = 1;
      this.expandT = 0;

      this.powers = {};
      this.locked = false;
      this.hidden = false;
      this.down = false;
      this.invuln = 0;
      this.godMode = false;
      this.hurtT = 0;
      this.jamT = 0;
      this.speedMul = 1;
      this.noEnergyT = 0;

      // awareness form
      this.carry = 0;
      this.carryMax = 25;
      this.basePull = 85;
      this.pullRadius = 85;

      this.interactTarget = null;
    }

    get speedMax() {
      return (SPEED[this.form] || 200) * this.speedMul * (this.scale > 1.3 ? 0.9 : 1);
    }
    get canUsePowers() {
      return !this.locked && !this.down && this.form !== 'human';
    }
    get jammed() {
      return this.jamT > 0;
    }
    tkMaxMass() {
      return this.scale > 1.3 ? 40 : 9;
    }

    unlock(id) {
      if (!this.powers[id]) this.powers[id] = { cd: 0, active: false };
    }
    has(id) {
      return !!this.powers[id];
    }

    setForm(form) {
      this.form = form;
      if (form === 'awareness') {
        this.r = 10;
        this.baseR = 10;
      } else {
        this.baseR = 13;
      }
    }

    // Spend energy for a power; flashes the meter when short.
    spend(amount) {
      if (this.energy < amount) {
        this.noEnergyT = 0.4;
        DM.Audio.play('fail');
        return false;
      }
      this.energy -= amount;
      return true;
    }

    update(dt, world) {
      this.invuln = Math.max(0, this.invuln - dt);
      this.hurtT = Math.max(0, this.hurtT - dt);
      this.jamT = Math.max(0, this.jamT - dt);
      this.noEnergyT = Math.max(0, this.noEnergyT - dt);

      this.scale = U.damp(this.scale, this.targetScale, 6, dt);
      this.r = this.baseR * this.scale;
      this.mass = 3 * this.scale * this.scale;

      const ax = this.locked || this.down ? { x: 0, y: 0 } : Input.axis();
      const sp = this.speedMax;
      const accel = this.form === 'awareness' ? 4.5 : 14;
      this.vx = U.damp(this.vx, ax.x * sp, accel, dt);
      this.vy = U.damp(this.vy, ax.y * sp, accel, dt);
      const v = this.speed;
      this.moving = v > 20;
      if (this.moving) this.walk += dt * v * 0.09;

      if (this.form === 'human' || this.locked) {
        if (this.moving) this.facing = U.dampAngle(this.facing, Math.atan2(this.vy, this.vx), 12, dt);
      } else {
        this.facing = U.dampAngle(this.facing, U.angleTo(this.x, this.y, world.mouse.x, world.mouse.y), 14, dt);
      }

      // Channelled powers set this.drain and slow energy regen to their
      // channelRegen while active (telekinesis 0.5, Temporal Sight 0.4, Coalesce 0).
      this.drain = false;
      this.regenMul = 1;
      this.reticleFail = Math.max(0, (this.reticleFail || 0) - dt);
      for (const def of DM.Powers.list) {
        const st = this.powers[def.id];
        if (!st || !def.forms.includes(this.form)) continue;
        st.cd = Math.max(0, st.cd - dt);
        def.update(this, st, world, dt);
        if (st.active && def.channelRegen != null) this.regenMul = Math.min(this.regenMul, def.channelRegen);
      }
      if (this.drain && this.regenMul === 1) this.regenMul = 0; // a drain that declares no rate stops regen
      this.powerFrame = DM.Powers.frame; // powers saw this frame's presses (see Powers.latch)
      const regen = this.energyRegen * this.regenMul * (this.jammed ? 0.35 : 1);
      this.energy = U.clamp(this.energy + regen * dt, 0, this.maxEnergy);

      // coherenceRegen: recovery per second, set per challenge level (settings.js).
      if (this.regenDelay > 0) this.regenDelay -= dt;
      else if (!this.down) this.coherence = Math.min(this.maxCoherence, this.coherence + (this.coherenceRegen ?? 9) * dt);

      if (this.expandT > 0) {
        this.expandT -= dt;
        if (this.expandT <= 0) {
          this.targetScale = 1;
          world.camera.targetZoom = world.baseZoom;
        }
      }

      // Low coherence: Jon starts shedding particles.
      if (this.form === 'manhattan' && this.coherence < 35 && Math.random() < dt * 20) {
        world.particles.emit(this.x + U.rand(-10, 10), this.y + U.rand(-10, 10), { vx: U.rand(-40, 40), vy: U.rand(-40, 40), life: 0.6, size: 2.5, color: '#7fe3ff' });
      }

      this.updateInteraction(world);
    }

    updateInteraction(world) {
      this.interactTarget = null;
      if (this.locked || this.down) return;
      let best = null;
      let bd = Infinity;
      for (const e of world.entities) {
        const it = e.interact;
        if (!it || e.dead) continue;
        if (it.enabled && !it.enabled()) continue;
        const d = U.dist(this.x, this.y, e.x, e.y);
        if (d < (it.range || 60) && d < bd) {
          bd = d;
          best = e;
        }
      }
      this.interactTarget = best;
      if (best && Input.pressed('interact')) {
        Input.consume('interact');
        Input.consume('confirm');
        best.interact.onInteract(best, this);
      }
    }

    // Cutscenes and dialogue are safe (locked), and a brief invulnerability
    // after each hit stops one volley from landing all at once. damageMul and
    // regenDelayBase are challenge-level hooks; lastHit and hurtDirs feed the
    // Game Over tips and the directional hit arcs (DM.Feedback).
    damage(amount, source, kind) {
      if (this.locked || this.invuln > 0 || this.down || this.godMode || this.form === 'human') return false;
      if (this.scale > 1.4 && (kind === 'bullet' || kind === 'pulse')) amount *= 0.15;
      amount *= this.damageMul == null ? 1 : this.damageMul;
      this.coherence -= amount;
      this.regenDelay = this.regenDelayBase == null ? 2.6 : this.regenDelayBase;
      this.hurtT = 0.25;
      this.invuln = Math.max(this.invuln, 0.08);
      const w = this.world;
      const now = w ? w.realTime || 0 : 0;
      this.lastHit = { kind, by: source ? source.label || source.name || source.constructor.name : null, t: now };
      DM.Audio.play('hit');
      // Where it came from: against the incoming velocity, else from its position.
      let ang = null;
      if (source) {
        const sp = Math.hypot(source.vx || 0, source.vy || 0);
        if (sp > 60) ang = Math.atan2(-source.vy, -source.vx);
        else if (source.x != null && (source.x !== this.x || source.y !== this.y)) ang = Math.atan2(source.y - this.y, source.x - this.x);
      }
      this.hurtDirs = (this.hurtDirs || []).filter((h) => now - h.at < h.t);
      if (ang != null) {
        this.hurtDirs.push({ angle: ang, t: 0.7, amt: amount, at: now });
        if (this.hurtDirs.length > 6) this.hurtDirs.shift();
      }
      this.hurtFlash = { amt: amount, at: now };
      if (w) {
        w.camera.shake(Math.min(0.42, 0.18 + amount / 60));
        if (ang != null) w.camera.kick(-Math.cos(ang), -Math.sin(ang), 3);
        if (amount >= 10 && w.hitstop) w.hitstop(0.04);
      }
      if (this.coherence <= 0) {
        this.coherence = 0;
        this.down = true;
        this.vx = this.vy = 0;
        DM.Events.emit('player:down', this);
      }
      return true;
    }

    // Thrown objects never hurt their thrower.
    onImpact() {}

    render(ctx, world) {
      if (this.hidden) return;
      const t = this.age;
      if (this.form === 'human') {
        Gfx.figure(ctx, Object.assign({}, this.look, { x: this.x, y: this.y, angle: this.facing, walk: this.walk, moving: this.moving }));
      } else if (this.form === 'awareness') {
        ctx.save();
        ctx.strokeStyle = 'rgba(127,227,255,0.18)';
        ctx.setLineDash([4, 8]);
        ctx.lineDashOffset = -t * 20;
        ctx.lineWidth = 1.5;
        Gfx.circle(ctx, this.x, this.y, this.pullRadius);
        ctx.stroke();
        ctx.restore();
        Gfx.awareness(ctx, this.x, this.y, t, 1 + Math.min(0.6, this.carry / 60), this.invuln > 0 ? 0.5 + Math.sin(t * 40) * 0.3 : 1);
      } else {
        let alpha = 1;
        if (this.coherence < 35) alpha = 0.65 + Math.random() * 0.35;
        if (this.down) alpha = 0.4;
        Gfx.manhattan(ctx, { x: this.x, y: this.y, angle: this.facing, walk: this.walk, moving: this.moving, scale: this.scale, t, alpha, flash: this.hurtT * 3 });
      }
    }

    // Power effects drawn above entities (beams, reticles).
    renderFx(ctx, world) {
      if (this.hidden) return;
      for (const def of DM.Powers.list) {
        const st = this.powers[def.id];
        if (!st || !def.render || !def.forms.includes(this.form)) continue;
        def.render(ctx, this, st, world);
      }
    }
  }

  DM.Player = Player;
})();
</script>
<script>/* src/game/powers.js */
/*
 * Powers registry.
 *
 * A power is a plain definition object:
 *   id, name, action (Input action), forms (which player forms can use it),
 *   color, cost, cooldown, desc, tip (shown on the unlock card)
 *   update(player, state, world, dt)   — every frame while unlocked
 *   render(ctx, player, state, world)  — optional world-space effects
 *   channelRegen                       — optional: energy regen multiplier while
 *                                        state.active (a channelled power)
 *
 * Press-type powers (press: true) share one buffered input path instead of
 * reading Input.pressed themselves: they define
 *   blocked(player, state, world)      — why it cannot fire now, or null
 *   fire(player, state, world)         — cast it (energy is already affordable)
 *   onFail(player, state, world, why)  — optional extra failure feedback
 *
 * Per-player state lives in player.powers[id] = { cd, active, ... }.
 * The HUD shows every unlocked power for the current form, in registration
 * order. To add a power: register it here, then grant it from a chapter stage
 * (`grants: ['myPower']` + `yield ctx.unlock('myPower')`).
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Input = DM.Input;
  const Audio = DM.Audio;
  const TAU = Math.PI * 2;

  const Powers = { list: [], byId: {}, frame: 0 };
  Powers.register = (def) => {
    def.forms = def.forms || ['manhattan'];
    def.cost = def.cost || 0;
    def.cooldown = def.cooldown || 0;
    Powers.list.push(def);
    Powers.byId[def.id] = def;
    return def;
  };
  Powers.get = (id) => Powers.byId[id];

  // Clamp a point to within `range` of the player.
  function reach(p, x, y, range) {
    const dx = x - p.x, dy = y - p.y;
    const d = Math.hypot(dx, dy);
    if (d <= range) return { x, y, clamped: false };
    return { x: p.x + (dx / d) * range, y: p.y + (dy / d) * range, clamped: true };
  }

  // ---- Buffered presses ----------------------------------------------------
  // A press is remembered for BUFFER seconds, and a press made near the end of a
  // cooldown (within QUEUE) waits for it, so a key tapped a moment early still
  // casts. A press that expires unspent fails out loud: a 'fail' blip and a red
  // pulse on the reticle.
  const BUFFER = 0.15;
  const QUEUE = 0.5;

  function arm(s) {
    s.buf = BUFFER + (s.cd > 0 && s.cd <= QUEUE ? s.cd : 0);
  }

  function fail(p, why) {
    if (why === 'energy') p.noEnergyT = 0.4;
    p.reticleFail = 0.25;
    Audio.play('fail');
  }

  function pressUpdate(def, p, s, world, dt) {
    if (!p.canUsePowers) {
      s.buf = 0;
      return;
    }
    if (Input.pressed(def.action)) arm(s);
    if (!(s.buf > 0)) return;
    const why = def.blocked(p, s, world);
    if (!why) {
      s.buf = 0;
      def.fire(p, s, world);
      return;
    }
    s.buf -= dt;
    if (s.buf <= 0) {
      s.buf = 0;
      if (def.onFail) def.onFail(p, s, world, why);
      fail(p, why);
    }
  }

  // Frames where the world is frozen (hitstop) skip the player's update, so the
  // powers never see presses made during them. At the end of each frame, presses
  // the powers did not get to read are latched into their buffers instead.
  // Player.update stamps p.powerFrame; only a scene that was already on top last
  // frame counts, so the key that closes an overlay is not replayed into Jon.
  Powers.latch = (p) => {
    for (const def of Powers.list) {
      const s = p.powers[def.id];
      if (!s || !def.forms.includes(p.form) || !Input.pressed(def.action)) continue;
      if (def.press) arm(s);
      else s.latchPress = true;
    }
  };
  const endFrame = Input.endFrame;
  Input.endFrame = function () {
    const top = DM.Engine && DM.Engine.top();
    const p = top && top.player;
    if (p && p.powers && top === Powers.lastTop && p.world === top.world && p.powerFrame !== Powers.frame && p.canUsePowers) Powers.latch(p);
    Powers.lastTop = top;
    Powers.frame++;
    return endFrame.apply(this, arguments);
  };

  // ---- Coalesce (awareness form) -------------------------------------------
  Powers.register({
    id: 'coalesce',
    name: 'Coalesce',
    action: 'telekinesis',
    forms: ['awareness'],
    color: '#9fe8ff',
    channelRegen: 0,
    desc: 'Your scattered atoms drift toward you when you pass near them.',
    tip: 'Hold LEFT CLICK (or C) to widen your pull. Return to the chamber to rebuild yourself.',
    update(p, s, world, dt) {
      s.latchPress = false;
      s.active = p.canUsePowers && Input.down('telekinesis') && p.energy > 1;
      if (s.active) {
        p.drain = true;
        p.energy -= 20 * dt;
      }
      p.pullRadius = U.damp(p.pullRadius, p.basePull * (s.active ? 2.1 : 1), 8, dt);
    },
  });

  // ---- Telekinesis ---------------------------------------------------------
  // How a release reads: the fastest motion of the last `hist` seconds decides.
  // Faster than `flick` is a throw of at least throwV / sqrt(mass), bent toward
  // an enemy near its line. Slower is a gentle drop, so crates and crystals can
  // be set down in zones and slots, unless an enemy is right under the cursor,
  // in which case the object is thrown at them.
  const TK = {
    grabMin: 8, // energy needed to start a lift
    relock: 0.3, // seconds before the next lift after running dry
    hist: 0.12, // how far back a release looks for the throwing motion
    histToggle: 0.2, // toggle mode: a click lands a moment after the flick
    flick: 150,
    throwV: 800,
    aimRange: 650,
    aimCone: 0.32,
    dropAim: 110,
    settle: 2.5, // the grab point eases onto the cursor instead of snapping to it
    preview: 0.35, // seconds of flight drawn by the predicted path
  };
  const boosted = []; // things thrown while expanded: { e, mul } until they land

  function findGrab(world, p, mx, my, range) {
    let best = null, bd = Infinity;
    for (const e of world.entities) {
      if (!e.grabbable || e.dead || e === p) continue;
      if (e.heldBy && e.heldBy !== p) continue;
      const dm = U.dist(mx, my, e.x, e.y) - e.r;
      if (dm > 30) continue;
      if (U.dist(p.x, p.y, e.x, e.y) > range + e.r) continue;
      if (dm < bd) {
        bd = dm;
        best = e;
      }
    }
    return best;
  }

  // Someone worth throwing `held` at: an active enemy it can actually hit (crates
  // pass under flying drones; a thrown missile bursts next to anything).
  function isFoe(t, held) {
    if (t === held || t.team !== 'enemy' || t.dead || t.ko || t.isProjectile || t.yielded || t.hidden) return false;
    if (t.hazard || t.downT > 0) return false; // mines, and machines powering down
    return !!t.flying === !!held.flying || !!held.isProjectile;
  }

  // The enemy best lined up with a throw from e along (vx, vy), if any.
  function aimAssist(world, e, vx, vy) {
    const dir = Math.atan2(vy, vx);
    let best = null, bs = Infinity;
    for (const t of world.entities) {
      if (!isFoe(t, e)) continue;
      const d = U.dist(e.x, e.y, t.x, t.y);
      if (d > TK.aimRange || d < 1) continue;
      const ang = Math.abs(U.wrapAngle(U.angleTo(e.x, e.y, t.x, t.y) - dir));
      if (ang > TK.aimCone || !world.los(e.x, e.y, t.x, t.y)) continue;
      const score = ang / TK.aimCone + d / TK.aimRange;
      if (score < bs) {
        bs = score;
        best = t;
      }
    }
    return best;
  }

  // Velocity that meets t, leading its motion.
  function leadAt(e, t, speed) {
    const lt = U.dist(e.x, e.y, t.x, t.y) / speed;
    const n = U.norm(t.x + t.vx * lt - e.x, t.y + t.vy * lt - e.y);
    return { vx: n.x * speed, vy: n.y * speed };
  }

  // What letting go right now would do: { vx, vy, target } for a throw, or null
  // for a drop (the object keeps its own slow drift and stops with normal friction).
  function throwPlan(p, s, world, e) {
    const sq = Math.sqrt(Math.max(0.5, e.mass));
    const big = Math.max(1, p.scale * 0.8);
    const maxV = (1150 / sq) * big * 1.15;
    const minV = Math.min(maxV, (TK.throwV / sq) * big);
    const now = world.realTime || 0;
    const hist = DM.Save.settings.tkMode === 'toggle' ? TK.histToggle : TK.hist;
    let fast = null, fs = 0;
    for (const h of s.vHist) {
      if (now - h.t > hist) continue;
      const v = Math.hypot(h.vx, h.vy);
      if (v > fs) {
        fs = v;
        fast = h;
      }
    }
    if (fast && fs > TK.flick) {
      const sp = U.clamp(fs * 1.15, minV, maxV);
      const target = aimAssist(world, e, fast.vx, fast.vy);
      const v = target ? leadAt(e, target, sp) : { vx: (fast.vx / fs) * sp, vy: (fast.vy / fs) * sp };
      return { vx: v.vx, vy: v.vy, target };
    }
    const m = world.mouse;
    let target = null, bd = TK.dropAim;
    for (const t of world.entities) {
      if (!isFoe(t, e)) continue;
      const dm = U.dist(m.x, m.y, t.x, t.y) - t.r;
      if (dm > bd || U.dist(e.x, e.y, t.x, t.y) <= e.r || !world.los(e.x, e.y, t.x, t.y)) continue;
      bd = dm;
      target = t;
    }
    if (!target) return null;
    const v = leadAt(e, target, minV);
    return { vx: v.vx, vy: v.vy, target };
  }

  // why: 'release' (the player let go), 'starved' (out of energy) or 'lost'
  // (the object or the player can no longer take part).
  function tkRelease(p, s, world, why) {
    const e = s.target;
    s.target = null;
    s.active = false;
    s.latched = false;
    s.plan = null;
    Audio.hum('tk', false);
    if (!e) return;
    if (e.heldBy === p) {
      e.heldBy = null;
      const plan = why === 'release' ? throwPlan(p, s, world, e) : null;
      if (plan) {
        e.vx = plan.vx;
        e.vy = plan.vy;
        e.thrown = 1.0;
      } else e.thrown = 0; // set down: ordinary friction stops it where it was left
      if (e.team === 'enemy') e.stun = Math.max(e.stun, 0.9); // no mid-air recovery
      // Expanded, Jon throws with far more than his usual strength.
      if (plan && p.expandT > 0 && e.hp != null) {
        if (!boosted.some((b) => b.e === e)) boosted.push({ e, mul: e.impactMul });
        e.impactMul = 2;
      }
      if (e.onRelease) e.onRelease(p, world);
      if (why !== 'lost' && e.speed > 260) Audio.play('throw', { speed: e.speed });
    }
    if (why === 'starved') {
      s.relock = TK.relock;
      p.noEnergyT = 0.4;
      Audio.play('fizzle');
      world.particles.burst(e.x, e.y, 16, { color: ['#5fd4ff', '#bff1ff', '#2a6f99'], speed: [30, 140], life: [0.2, 0.5], size: [1.5, 3], shape: 'spark', drag: 4 });
    }
  }

  function tkGrab(p, s, world, e) {
    if (e.mass > p.tkMaxMass()) {
      fail(p, 'mass');
      world.bark(p, p.has('expand') ? 'Too massive. I need to be larger.' : 'Too massive.', 1.4);
      return;
    }
    if (s.relock > 0 || p.energy < TK.grabMin) {
      fail(p, 'energy');
      return;
    }
    const m = world.mouse;
    s.target = e;
    s.latched = true;
    s.vHist = [];
    s.offX = e.x - m.x;
    s.offY = e.y - m.y;
    s.lastE = p.energy;
    s.eRate = 0;
    e.heldBy = p;
    if (e.onGrab) e.onGrab(p, world);
    Audio.play('tk_grab');
  }

  Powers.register({
    id: 'telekinesis',
    name: 'Telekinesis',
    action: 'telekinesis',
    color: '#5fd4ff',
    channelRegen: 0.5,
    desc: 'Lift objects (and people) with your mind.',
    get tip() {
      return DM.Save.settings.tkMode === 'toggle'
        ? 'CLICK (or press C) on something to lift it, move the mouse to carry it, click again to let go. Let go while moving to throw. Thrown people are knocked out, not killed.'
        : 'HOLD LEFT CLICK (or C) on something to lift it, move the mouse to carry it. Let go while moving to throw. Thrown people are knocked out, not killed.';
    },
    range: 430,
    update(p, s, world, dt) {
      const m = world.mouse;
      const range = this.range * p.scale;
      const toggle = DM.Save.settings.tkMode === 'toggle';
      const pressed = Input.pressed('telekinesis') || !!s.latchPress;
      s.latchPress = false;
      s.relock = Math.max(0, (s.relock || 0) - dt);
      s.vHist = s.vHist || [];
      for (let i = boosted.length - 1; i >= 0; i--) {
        const b = boosted[i];
        if (b.e.dead || b.e.heldBy || b.e.thrown <= 0 || b.e.world !== world) {
          b.e.impactMul = b.mul;
          boosted.splice(i, 1);
        }
      }

      if (s.target) {
        const e = s.target;
        let why = null;
        if (e.dead || e.heldBy !== p || !e.grabbable || !p.canUsePowers) why = 'lost';
        else if (p.energy <= 0) why = 'starved';
        else if (toggle ? pressed : !Input.down('telekinesis')) why = 'release';
        if (why) {
          tkRelease(p, s, world, why);
          if (pressed) return; // in toggle mode, the press that threw does not also grab
        }
      }
      if (!s.target) {
        s.hover = p.canUsePowers ? findGrab(world, p, m.x, m.y, range) : null;
        if (!p.canUsePowers) s.grabBuf = 0;
        else if (pressed) s.grabBuf = BUFFER;
        if (s.grabBuf > 0) {
          // A press just before the cursor reaches something still lifts it.
          if (!toggle && !Input.down('telekinesis')) s.grabBuf = 0;
          else if (s.hover) {
            s.grabBuf = 0;
            tkGrab(p, s, world, s.hover);
          } else s.grabBuf -= dt;
        }
        if (!s.target) return;
      }

      const e = s.target;
      s.active = true;
      p.drain = true;
      p.energy -= (3 + e.mass * 1.1) * dt;
      // Remember how the object actually moved (after last frame's collisions),
      // so pressing it against a wall and letting go reads as a drop.
      const now = world.realTime || 0;
      s.vHist.push({ t: now, vx: e.vx, vy: e.vy });
      while (s.vHist.length > 1 && now - s.vHist[0].t > TK.histToggle) s.vHist.shift();
      const settle = Math.exp(-TK.settle * dt);
      s.offX *= settle;
      s.offY *= settle;
      const pt = reach(p, m.x + s.offX, m.y + s.offY, range);
      const sq = Math.sqrt(Math.max(0.5, e.mass));
      const maxV = (1150 / sq) * Math.max(1, p.scale * 0.8);
      let tvx = (pt.x - e.x) * 10, tvy = (pt.y - e.y) * 10;
      const tl = Math.hypot(tvx, tvy);
      if (tl > maxV) {
        tvx *= maxV / tl;
        tvy *= maxV / tl;
      }
      const resp = (16 / sq) * p.scale;
      e.vx = U.damp(e.vx, tvx, resp, dt);
      e.vy = U.damp(e.vy, tvy, resp, dt);
      e.thrown = Math.max(e.thrown, 0.15);
      s.plan = throwPlan(p, s, world, e);
      if (dt > 0) s.eRate = U.damp(s.eRate || 0, (p.energy - s.lastE) / dt, 6, dt);
      s.lastE = p.energy;
      Audio.hum('tk', true, { freq: 70, cutoff: 420, gain: 0.04, mod: Math.min(2, e.speed / 500) });
      if (Math.random() < dt * 30) world.particles.emit(e.x + U.rand(-e.r, e.r), e.y + U.rand(-e.r, e.r), { vx: U.rand(-20, 20), vy: U.rand(-20, 20), life: 0.5, size: 2, color: '#9fe8ff' });
    },
    render(ctx, p, s, world) {
      const t = world.realTime || 0;
      if (s.hover && !s.target) {
        const e = s.hover;
        const heavy = e.mass > p.tkMaxMass();
        ctx.save();
        ctx.strokeStyle = heavy ? 'rgba(255,120,100,0.6)' : 'rgba(127,227,255,0.65)';
        ctx.setLineDash([5, 5]);
        ctx.lineDashOffset = -t * 30;
        ctx.lineWidth = 1.5;
        Gfx.circle(ctx, e.x, e.y, e.r + 7);
        ctx.stroke();
        ctx.restore();
      }
      const e = s.target;
      if (!e) return;
      const hx = p.x + Math.cos(p.facing) * 14 * p.scale, hy = p.y + Math.sin(p.facing) * 14 * p.scale;
      const dx = e.x - hx, dy = e.y - hy;
      const d = Math.hypot(dx, dy) || 1;
      const nx = -dy / d, ny = dx / d;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let k = 0; k < 3; k++) {
        ctx.strokeStyle = k === 0 ? 'rgba(127,227,255,0.55)' : 'rgba(95,212,255,0.25)';
        ctx.lineWidth = k === 0 ? 2 : 5 - k;
        ctx.beginPath();
        for (let i = 0; i <= 18; i++) {
          const f = i / 18;
          const w = Math.sin(f * Math.PI) * Math.sin(t * 9 + f * 10 + k * 2) * (6 + k * 3);
          const x = hx + dx * f + nx * w, y = hy + dy * f + ny * w;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      ctx.restore();
      Gfx.glow(ctx, e.x, e.y, e.r * 2.6, '#5fd4ff', 0.55);
      ctx.save();
      ctx.strokeStyle = 'rgba(190,240,255,0.8)';
      ctx.lineWidth = 1.5;
      Gfx.circle(ctx, e.x, e.y, e.r + 5 + Math.sin(t * 8) * 1.5);
      ctx.stroke();
      // Hold time left, once it starts to matter.
      const left = s.eRate < -0.5 ? p.energy / -s.eRate : Infinity;
      if (left < 6) {
        ctx.strokeStyle = left < 1.5 ? 'rgba(255,120,90,0.95)' : 'rgba(190,240,255,0.7)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r + 11, -Math.PI / 2, -Math.PI / 2 + (left / 6) * TAU);
        ctx.stroke();
      }
      ctx.restore();
      if (s.plan) this.renderPlan(ctx, e, s.plan, world, t);
    },
    // Where a release would send it: a dotted path and a bracket on the target.
    renderPlan(ctx, e, plan, world, t) {
      const sp = Math.hypot(plan.vx, plan.vy);
      if (sp < 1) return;
      const k = e.friction * 0.22;
      const len = k > 0 ? (sp * (1 - Math.exp(-k * TK.preview))) / k : sp * TK.preview;
      const ux = plan.vx / sp, uy = plan.vy / sp;
      // The path ends where it meets the target, or the first wall in the way.
      let L = plan.target ? Math.min(len, U.dist(e.x, e.y, plan.target.x, plan.target.y) - plan.target.r) : len;
      for (const w of world.walls) {
        if (w.noCollide || (e.flying && w.low)) continue;
        const hit = U.segRect(e.x, e.y, e.x + ux * len, e.y + uy * len, w);
        if (hit >= 0) L = Math.min(L, hit * len);
      }
      ctx.save();
      ctx.fillStyle = plan.target ? 'rgba(255,190,160,0.9)' : 'rgba(190,240,255,0.85)';
      const step = 13;
      for (let q = e.r + 6 + ((t * 60) % step); q < L; q += step) {
        ctx.globalAlpha = 0.85 * (1 - q / (L + step));
        Gfx.circle(ctx, e.x + ux * q, e.y + uy * q, 2);
        ctx.fill();
      }
      ctx.restore();
      const g = plan.target;
      if (!g) return;
      const r = g.r + 7, c = Math.max(5, g.r * 0.45);
      ctx.save();
      ctx.strokeStyle = 'rgba(255,90,74,0.9)';
      ctx.lineWidth = 2;
      for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
        const x = g.x + sx * r, y = g.y + sy * r;
        ctx.beginPath();
        ctx.moveTo(x, y - sy * c);
        ctx.lineTo(x, y);
        ctx.lineTo(x - sx * c, y);
        ctx.stroke();
      }
      ctx.restore();
    },
  });

  // ---- Disintegrate --------------------------------------------------------
  Powers.register({
    id: 'disintegrate',
    name: 'Disintegrate',
    action: 'disintegrate',
    press: true,
    color: '#ffb27a',
    cost: 20,
    cooldown: 0.45,
    range: 520,
    desc: 'Undo the bonds that hold matter together. Permanent.',
    tip: 'Press Q or RIGHT CLICK to disintegrate whatever is under the cursor. Tougher things take several hits.',
    update(p, s, world, dt) {
      s.pending = s.pending || [];
      for (const b of s.pending) {
        b.t -= dt;
        if (b.t <= 0) this.resolve(p, b, world);
      }
      s.pending = s.pending.filter((b) => b.t > 0);
      pressUpdate(this, p, s, world, dt);
    },
    blocked(p, s) {
      if (s.cd > 0) return 'cooldown';
      if (p.energy < this.cost) return 'energy';
      return null;
    },
    fire(p, s, world) {
      p.spend(this.cost);
      s.cd = this.cooldown;
      const pt = reach(p, world.mouse.x, world.mouse.y, this.range * p.scale);
      const b = { x: pt.x, y: pt.y, t: 0.16, r: p.scale > 1.3 ? 80 : 50 };
      s.pending.push(b);
      world.particles.implode(b.x, b.y, b.r * 1.2, 14, { life: 0.16 });
      world.emitCast(b);
      Audio.play('dis_charge');
    },
    resolve(p, b, world) {
      let hits = 0, shoved = 0;
      for (const e of world.entities) {
        if (e.dead || e === p || e.team === 'player') continue;
        if (!e.disintegratable) continue;
        if (U.dist(b.x, b.y, e.x, e.y) > b.r + e.r * 0.6) continue;
        if (e.shieldR && U.dist(p.x, p.y, e.x, e.y) > e.shieldR) {
          if (e.onShieldBlock) e.onShieldBlock(world);
          continue;
        }
        hits++;
        if (e.hp == null || e.hp <= 70 || e.alwaysDisintegrate) e.disintegrate(world, p);
        else e.damage(70, p, 'disintegrate');
        // Whatever survives is shoved away from the blast.
        if (!e.dead && !e.static && !e.yielded) {
          let n = U.norm(e.x - b.x, e.y - b.y);
          if (n.l < 4) n = U.norm(e.x - p.x, e.y - p.y);
          const j = 220 * Math.sqrt(e.mass);
          e.impulse(n.x * j, n.y * j);
          shoved++;
        }
      }
      const P = world.particles;
      P.emit(b.x, b.y, { shape: 'ring', size: 6, size1: b.r * 1.3, life: 0.3, color: '#dff7ff', drag: 0 });
      P.burst(b.x, b.y, 18, { color: ['#ffffff', '#bff1ff', '#ffb27a'], speed: [80, 300], life: [0.15, 0.4], size: [1.5, 3], shape: 'spark', drag: 4 });
      Audio.play(hits ? 'disintegrate' : 'dis_miss');
      world.camera.shake(hits ? 0.35 : 0.12);
      if (hits && world.camera.kick) {
        const n = U.norm(b.x - p.x, b.y - p.y);
        world.camera.kick(n.x, n.y, 3);
      }
      // A beat of weight when something takes the blast and stays standing (kills get theirs from Enemy.die).
      if (shoved && world.hitstop) world.hitstop(0.04);
      DM.Events.emit('power:disintegrate', { x: b.x, y: b.y, hits });
    },
    render(ctx, p, s, world) {
      if (!p.canUsePowers) return;
      for (const b of s.pending || []) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255,220,190,0.9)';
        ctx.lineWidth = 2;
        Gfx.circle(ctx, b.x, b.y, b.r * (0.4 + b.t * 3));
        ctx.stroke();
        ctx.restore();
      }
      const pt = reach(p, world.mouse.x, world.mouse.y, this.range * p.scale);
      if (pt.clamped) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255,178,122,0.35)';
        ctx.setLineDash([3, 5]);
        Gfx.line(ctx, pt.x, pt.y, world.mouse.x, world.mouse.y);
        Gfx.circle(ctx, pt.x, pt.y, 6);
        ctx.stroke();
        ctx.restore();
      }
    },
  });

  // ---- Teleport -------------------------------------------------------------
  const TELE_NEAR = 60; // a cursor this close to Jon gives no direction to aim at
  const TELE_MIN = 20; // shorter hops than this are not worth taking

  // Walk back from (tx, ty) toward Jon until there is room to stand.
  function walkBack(p, world, tx, ty) {
    const dx = tx - p.x, dy = ty - p.y;
    const d = Math.hypot(dx, dy);
    for (let k = 0; k <= d; k += 10) {
      const f = (d - k) / (d || 1);
      const x = p.x + dx * f, y = p.y + dy * f;
      if (!world.isFree(x, y, p.r)) continue;
      if (U.dist(p.x, p.y, x, y) < TELE_MIN) return null;
      return { x, y, clamped: k > 0 };
    }
    return null;
  }

  // Where a teleport would land right now: { x, y, clamped } or null. The cursor,
  // clamped to range, walked back to the nearest free spot. With the cursor on
  // top of Jon, he goes full range the way he is moving or facing, turning
  // aside if that way is blocked.
  function teleportDest(p, world, range) {
    const m = world.mouse;
    if (U.dist(p.x, p.y, m.x, m.y) >= TELE_NEAR) {
      const pt = reach(p, m.x, m.y, range);
      const d = walkBack(p, world, pt.x, pt.y);
      if (d && pt.clamped) d.clamped = true;
      return d;
    }
    const a0 = p.speed > 20 ? Math.atan2(p.vy, p.vx) : p.facing;
    let best = null, bl = 0;
    for (const da of [0, 0.5, -0.5, 1, -1, 1.6, -1.6, 2.3, -2.3, Math.PI]) {
      const a = a0 + da;
      const d = walkBack(p, world, p.x + Math.cos(a) * range, p.y + Math.sin(a) * range);
      if (!d) continue;
      const l = U.dist(p.x, p.y, d.x, d.y);
      if (l > bl) {
        bl = l;
        best = d;
      }
      if (l >= range * 0.6) break;
    }
    if (best) best.clamped = true;
    return best;
  }
  Powers.teleportDest = teleportDest;

  Powers.register({
    id: 'teleport',
    name: 'Teleport',
    action: 'teleport',
    press: true,
    color: '#c9a7ff',
    cost: 16,
    cooldown: 0.5,
    range: 380,
