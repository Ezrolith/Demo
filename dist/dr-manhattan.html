<script>/* src/core/namespace.js */
/*
 * DR. MANHATTAN: THE WATCHMAKER'S SON
 * Global namespace.
 *
 * Every source file is a plain (non-module) script that attaches itself to
 * window.DM. That keeps the game runnable straight from file:// — just open
 * index.html — on any OS, with no server and no build step. Script load order
 * is declared once, in index.html.
 */
(function () {
  'use strict';
  const DM = (window.DM = window.DM || {});

  DM.VERSION = '0.1.0';

  // Logical resolution. The engine letterboxes this to any window size.
  DM.W = 1280;
  DM.H = 720;

  // Developer mode: add ?dev or #dev to the URL. Unlocks every chapter and
  // enables the debug overlay (` key) and stage skipping (] key).
  DM.DEV = /[?&#]dev\b/i.test(location.search + location.hash);

  DM.FONTS = {
    display: "'Oswald', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif",
    type: "'Special Elite', 'Courier New', Courier, monospace",
    hand: "'Patrick Hand', 'Trebuchet MS', 'Segoe UI', sans-serif",
  };

  // Shared palette. Chapter maps add their own colours on top of these.
  DM.C = {
    blue: '#5fd4ff',
    blueDeep: '#1b7fd0',
    blueGlow: '#7fe3ff',
    white: '#eefbff',
    paper: '#f1e7cc',
    ink: '#16120f',
    yellow: '#f2c418',
    blood: '#c4302b',
    red: '#ff5a4a',
    orange: '#ff9a3c',
    green: '#7bd88f',
    uiBg: 'rgba(6, 12, 22, 0.78)',
    uiEdge: 'rgba(95, 212, 255, 0.45)',
    dim: '#7f93a6',
  };
})();
</script>
<script>/* src/core/util.js */
/* Math, randomness, easing, colour and geometry helpers. */
(function () {
  'use strict';
  const DM = window.DM;
  const TAU = Math.PI * 2;

  const U = {
    TAU,
    clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
    lerp: (a, b, t) => a + (b - a) * t,
    invLerp: (a, b, v) => (b === a ? 0 : (v - a) / (b - a)),
    rand: (a = 0, b = 1) => a + Math.random() * (b - a),
    randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
    chance: (p) => Math.random() < p,
    pick: (arr) => arr[(Math.random() * arr.length) | 0],
    dist: (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay),
    dist2: (ax, ay, bx, by) => (bx - ax) * (bx - ax) + (by - ay) * (by - ay),
    angleTo: (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax),
    // Frame-rate independent exponential smoothing toward a target.
    damp: (a, b, lambda, dt) => a + (b - a) * (1 - Math.exp(-lambda * dt)),
    approach: (v, target, step) => (v < target ? Math.min(v + step, target) : Math.max(v - step, target)),
  };

  U.wrapAngle = (a) => {
    while (a > Math.PI) a -= TAU;
    while (a < -Math.PI) a += TAU;
    return a;
  };
  U.lerpAngle = (a, b, t) => a + U.wrapAngle(b - a) * t;
  U.dampAngle = (a, b, lambda, dt) => a + U.wrapAngle(b - a) * (1 - Math.exp(-lambda * dt));

  U.norm = (x, y) => {
    const l = Math.hypot(x, y);
    return l > 1e-9 ? { x: x / l, y: y / l, l } : { x: 0, y: 0, l: 0 };
  };

  U.ease = {
    inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    inCubic: (t) => t * t * t,
    inOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    outBack: (t) => {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    },
    outQuad: (t) => 1 - (1 - t) * (1 - t),
  };

  // ---- colour -------------------------------------------------------------
  const rgbCache = new Map();
  U.hexToRgb = (hex) => {
    let c = rgbCache.get(hex);
    if (c) return c;
    let h = hex.replace('#', '');
    if (h.length === 3) h = h.split('').map((ch) => ch + ch).join('');
    const n = parseInt(h, 16);
    c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    rgbCache.set(hex, c);
    return c;
  };
  U.rgba = (hex, a) => {
    const [r, g, b] = U.hexToRgb(hex);
    return `rgba(${r},${g},${b},${a})`;
  };
  U.mix = (hexA, hexB, t, a = 1) => {
    const A = U.hexToRgb(hexA), B = U.hexToRgb(hexB);
    const r = Math.round(A[0] + (B[0] - A[0]) * t);
    const g = Math.round(A[1] + (B[1] - A[1]) * t);
    const b = Math.round(A[2] + (B[2] - A[2]) * t);
    return `rgba(${r},${g},${b},${a})`;
  };

  // ---- geometry -----------------------------------------------------------
  // Circle vs axis-aligned rect. Returns push-out normal and depth, or null.
  U.circleRect = (cx, cy, r, R) => {
    const nx = U.clamp(cx, R.x, R.x + R.w);
    const ny = U.clamp(cy, R.y, R.y + R.h);
    const dx = cx - nx, dy = cy - ny;
    const d2 = dx * dx + dy * dy;
    if (d2 > r * r) return null;
    if (d2 > 1e-6) {
      const d = Math.sqrt(d2);
      return { nx: dx / d, ny: dy / d, depth: r - d };
    }
    const left = cx - R.x, right = R.x + R.w - cx, top = cy - R.y, bottom = R.y + R.h - cy;
    const m = Math.min(left, right, top, bottom);
    if (m === left) return { nx: -1, ny: 0, depth: left + r };
    if (m === right) return { nx: 1, ny: 0, depth: right + r };
    if (m === top) return { nx: 0, ny: -1, depth: top + r };
    return { nx: 0, ny: 1, depth: bottom + r };
  };

  // Segment vs rect (Liang–Barsky). Returns entry t in [0,1], or -1 for a miss.
  U.segRect = (x1, y1, x2, y2, R) => {
    let t0 = 0, t1 = 1;
    const dx = x2 - x1, dy = y2 - y1;
    const p = [-dx, dx, -dy, dy];
    const q = [x1 - R.x, R.x + R.w - x1, y1 - R.y, R.y + R.h - y1];
    for (let i = 0; i < 4; i++) {
      if (p[i] === 0) {
        if (q[i] < 0) return -1;
      } else {
        const t = q[i] / p[i];
        if (p[i] < 0) {
          if (t > t1) return -1;
          if (t > t0) t0 = t;
        } else {
          if (t < t0) return -1;
          if (t < t1) t1 = t;
        }
      }
    }
    return t0;
  };

  // Does segment (x1,y1)-(x2,y2) pass within r of point (cx,cy)?
  U.segCircle = (x1, y1, x2, y2, cx, cy, r) => {
    const dx = x2 - x1, dy = y2 - y1;
    const l2 = dx * dx + dy * dy;
    let t = l2 > 0 ? ((cx - x1) * dx + (cy - y1) * dy) / l2 : 0;
    t = U.clamp(t, 0, 1);
    const px = x1 + dx * t, py = y1 + dy * t;
    return (px - cx) * (px - cx) + (py - cy) * (py - cy) <= r * r;
  };

  U.pointInRect = (x, y, R) => x >= R.x && x <= R.x + R.w && y >= R.y && y <= R.y + R.h;

  // ---- misc ---------------------------------------------------------------
  U.fmtTime = (s) => {
    s = Math.max(0, Math.floor(s));
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  };

  U.roman = (n) => ['0', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'][n] || String(n);

  // Deterministic RNG (mulberry32) so baked backgrounds look the same every run.
  U.seeded = (seed) => {
    let a = seed >>> 0;
    return () => {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  DM.U = U;
})();
</script>
<script>/* src/core/events.js */
/* Tiny publish/subscribe bus. Used for stats, achievements-to-come and decoupled reactions. */
(function () {
  'use strict';
  const listeners = new Map();

  window.DM.Events = {
    // Returns an unsubscribe function.
    on(name, fn) {
      if (!listeners.has(name)) listeners.set(name, new Set());
      listeners.get(name).add(fn);
      return () => listeners.get(name) && listeners.get(name).delete(fn);
    },
    emit(name, data) {
      const set = listeners.get(name);
      if (set) for (const fn of [...set]) fn(data);
    },
    clear(name) {
      if (name) listeners.delete(name);
      else listeners.clear();
    },
  };
})();
</script>
<script>/* src/core/input.js */
/*
 * Input: keyboard + mouse (+ basic touch for menus), mapped to named actions.
 *
 * Game code never asks "is KeyQ down?" — it asks Input.pressed('disintegrate').
 * Rebinding, gamepad support or touch controls later only touch this file.
 *
 * Keys use KeyboardEvent.code (physical position), so WASD stays WASD on
 * AZERTY/Dvorak layouts. Mac specifics handled here:
 *   - Ctrl+click counts as right click, and game keys still work while Ctrl
 *     is held (Ctrl+letter is not a browser shortcut on macOS).
 *   - Releasing Cmd clears all keys (macOS swallows keyup while Cmd is held).
 * Losing focus (window blur, hidden tab) releases everything and emits the
 * DM.Events 'app:blur' event, which the Play scene turns into a pause.
 */
(function () {
  'use strict';
  const DM = window.DM;

  const BINDINGS = {
    up: ['KeyW', 'ArrowUp'],
    down: ['KeyS', 'ArrowDown'],
    left: ['KeyA', 'ArrowLeft'],
    right: ['KeyD', 'ArrowRight'],

    telekinesis: ['Mouse0', 'KeyC'],
    disintegrate: ['KeyQ', 'Mouse2'],
    teleport: ['Space'],
    duplicate: ['KeyR'],
    timesight: ['KeyF', 'ShiftLeft', 'ShiftRight'],
    expand: ['KeyG'],
    interact: ['KeyE', 'Enter'],
    hint: ['KeyH'],

    pause: ['Escape', 'KeyP'],
    confirm: ['Enter', 'Space', 'KeyE', 'Mouse0'],
    back: ['Escape', 'Backspace'],
    menuUp: ['KeyW', 'ArrowUp'],
    menuDown: ['KeyS', 'ArrowDown'],
    menuLeft: ['KeyA', 'ArrowLeft'],
    menuRight: ['KeyD', 'ArrowRight'],
    mute: ['KeyM'],

    debug: ['Backquote'],
    skip: ['BracketRight'],
  };

  // Human-readable labels used by the HUD and controls screen.
  const LABELS = {
    telekinesis: 'HOLD LEFT CLICK',
    disintegrate: 'Q / RIGHT CLICK',
    teleport: 'SPACE',
    duplicate: 'R',
    timesight: 'HOLD F / SHIFT',
    expand: 'G',
    interact: 'E',
  };
  const SHORT = {
    telekinesis: 'LMB',
    disintegrate: 'Q',
    teleport: 'SPC',
    duplicate: 'R',
    timesight: 'F',
    expand: 'G',
    interact: 'E',
  };

  const bound = new Set();
  for (const k in BINDINGS) for (const c of BINDINGS[k]) bound.add(c);

  const state = {};
  const get = (code) => state[code] || (state[code] = { down: false, pressed: false, released: false });

  const Input = {
    bindings: BINDINGS,
    labels: LABELS,
    short: SHORT,
    mouse: { x: DM.W / 2, y: DM.H / 2, moved: false, inside: true },
    touch: false,
    _any: false,
    _ctrlClick: false,

    init(canvas) {
      this.canvas = canvas;
      const press = (code) => {
        const s = get(code);
        if (!s.down) {
          s.down = true;
          s.pressed = true;
        }
        this._any = true;
      };
      const release = (code) => {
        const s = get(code);
        if (s.down) {
          s.down = false;
          s.released = true;
        }
      };
      this._press = press;
      this._release = release;

      const isMac = /Mac|iP(hone|ad)/.test(navigator.platform || navigator.userAgent || '');
      window.addEventListener('keydown', (e) => {
        // Leave browser/OS shortcuts (Cmd+R, Ctrl+F, Alt+Tab, F11...) alone. On a Mac,
        // Ctrl is held for Ctrl+click, so bound keys keep working with it.
        if (e.metaKey || e.altKey || (e.ctrlKey && !(isMac && bound.has(e.code)))) return;
        if (bound.has(e.code) || e.code === 'Tab') e.preventDefault();
        if (e.repeat) {
          // OS auto-repeat of a key that is still held: re-arm it after a clearAll()
          // (fades, closed cards, refocus) without creating a new press.
          get(e.code).down = true;
        } else press(e.code);
        DM.Audio && DM.Audio.unlock();
      });
      window.addEventListener('keyup', (e) => {
        release(e.code);
        if (e.key === 'Meta') this.clearAll();
      });
      const lostFocus = () => {
        this.clearAll();
        if (DM.Events) DM.Events.emit('app:blur');
      };
      window.addEventListener('blur', lostFocus);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) lostFocus();
      });

      canvas.addEventListener('mousedown', (e) => {
        e.preventDefault();
        if (canvas.focus) canvas.focus({ preventScroll: true });
        this.touch = false;
        this.updateMouse(e);
        let b = e.button;
        if (b === 0 && e.ctrlKey) {
          b = 2;
          this._ctrlClick = true;
        }
        press('Mouse' + b);
        DM.Audio && DM.Audio.unlock();
      });
      window.addEventListener('mouseup', (e) => {
        if (e.button === 0 && this._ctrlClick) {
          this._ctrlClick = false;
          release('Mouse2');
        }
        release('Mouse' + e.button);
      });
      window.addEventListener('mousemove', (e) => this.updateMouse(e));
      canvas.addEventListener('mouseleave', () => (this.mouse.inside = false));
      canvas.addEventListener('mouseenter', () => (this.mouse.inside = true));
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());

      // Touch: taps act as left clicks so menus work on tablets. Full touch
      // controls for gameplay are on the roadmap.
      const touchOpts = { passive: false };
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        this.touch = true;
        this.updateMouse(e.changedTouches[0]);
        press('Mouse0');
        DM.Audio && DM.Audio.unlock();
      }, touchOpts);
      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        this.updateMouse(e.changedTouches[0]);
      }, touchOpts);
      canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        release('Mouse0');
      }, touchOpts);
      canvas.addEventListener('touchcancel', () => release('Mouse0'), touchOpts);
    },

    updateMouse(e) {
      const p = DM.Engine.toLogical(e.clientX, e.clientY);
      this.mouse.x = p.x;
      this.mouse.y = p.y;
      this.mouse.moved = true;
      this.mouse.inside = true;
    },

    down(action) {
      const codes = BINDINGS[action];
      if (!codes) return false;
      for (const c of codes) if (state[c] && state[c].down) return true;
      return false;
    },
    pressed(action) {
      const codes = BINDINGS[action];
      if (!codes) return false;
      for (const c of codes) if (state[c] && state[c].pressed) return true;
      return false;
    },
    released(action) {
      const codes = BINDINGS[action];
      if (!codes) return false;
      for (const c of codes) if (state[c] && state[c].released) return true;
      return false;
    },
    // Mark an action's press as handled so nothing else reacts to it this frame.
    consume(action) {
      const codes = BINDINGS[action];
      if (codes) for (const c of codes) if (state[c]) state[c].pressed = false;
    },
    clicked() {
      return !!(state.Mouse0 && state.Mouse0.pressed);
    },
    anyPressed() {
      return this._any;
    },
    axis() {
      let x = 0, y = 0;
      if (this.down('left')) x -= 1;
      if (this.down('right')) x += 1;
      if (this.down('up')) y -= 1;
      if (this.down('down')) y += 1;
      if (x && y) {
        x *= Math.SQRT1_2;
        y *= Math.SQRT1_2;
      }
      return { x, y };
    },
    endFrame() {
      for (const k in state) {
        state[k].pressed = false;
        state[k].released = false;
      }
      this._any = false;
      this.mouse.moved = false;
    },
    clearAll() {
      for (const k in state) {
        if (state[k].down) state[k].released = true;
        state[k].down = false;
        state[k].pressed = false;
      }
    },
    // Test/automation hooks: simulate presses without real events.
    simulate(code, isDown) {
      if (isDown) this._press(code);
      else this._release(code);
    },
  };

  DM.Input = Input;
})();
</script>
<script>/* src/core/audio.js */
/*
 * Audio: every sound is synthesised with the Web Audio API, so the game ships
 * with zero audio files. Four parts:
 *   - SFX: named recipes built from tones and filtered noise (Audio.play).
 *   - Hums: sustained voices kept alive while a condition holds (Audio.hum).
 *   - Ambience: a looping bed of wind, drones and random events per place
 *     (Audio.ambience; the beds are data in src/data/ambience.js).
 *   - Music: a small step sequencer that plays minimalist, Philip Glass-style
 *     arpeggio tracks defined as data in src/data/music.js. Layers fade in and
 *     out with Music.intensity, and track changes land on the beat.
 *
 * Routing:  sfxBus -> sfxFilter (Temporal Sight muffles it) -> master
 *           uiBus (menus, typing, cues that must stay clear) -> master
 *           ambBus (bed; ducked under Sight and Pause) -> master
 *           musicBus -> duckGain (dialogue) -> musicFilter -> master
 *           master -> compressor -> speakers
 * Each bus has its own echo, so volume and mute reach the echo tails too.
 *
 * Browsers only allow sound after a user gesture, so Audio.unlock() is called
 * from the first click/keypress. Every call is a safe no-op before that, and
 * nothing in here may throw into the game.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const dbToGain = (db) => Math.pow(10, (db || 0) / 20);

  const MUSIC_OPEN = 18000; // the music lowpass when nothing muffles it
  const SFX_OPEN = 18000;
  const SFX_SIGHT_MIN = 1800; // the darkest Temporal Sight makes the effects
  const DUCK = 0.5; // music level under dialogue and captions

  // A short loop for the 'sight' hum: a pocket-watch tick and tock (3200 / 2600 Hz) at 1.25 Hz.
  function tickLoop(c) {
    const sr = c.sampleRate;
    const len = Math.round(sr * 1.6);
    const buf = c.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    for (const [at, f] of [[0, 3200], [0.8, 2600]]) {
      const i0 = Math.round(at * sr);
      const n = Math.round(0.03 * sr);
      for (let i = 0; i < n && i0 + i < len; i++) {
        const t = i / sr;
        d[i0 + i] = (Math.sin(2 * Math.PI * f * t) * 0.65 + (Math.random() * 2 - 1) * 0.35) * Math.exp(-t / 0.004);
      }
    }
    return buf;
  }

  // A feedback delay (0.36 s, filtered), returning its input node.
  function makeEcho(c, out, level) {
    const input = c.createGain();
    const delay = c.createDelay(1.0);
    delay.delayTime.value = 0.36;
    const fb = c.createGain();
    fb.gain.value = 0.32;
    const lp = c.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 2600;
    input.connect(delay);
    delay.connect(lp);
    lp.connect(fb);
    fb.connect(delay);
    const wet = c.createGain();
    wet.gain.value = level;
    lp.connect(wet);
    wet.connect(out);
    return input;
  }

  const Audio = {
    ctx: null,
    volumes: { music: 0.6, sfx: 0.8, ambience: null }, // ambience null: read Save.settings.ambience
    muted: false,
    last: {},
    hums: {},
    timeScale: 1, // the world's time scale, copied in by the audio director
    bendK: 1, // time scale applied to the recipe being played (1 for UI sounds)
    route: null, // destination override while a recipe plays (UI bus, an ambience voice)
    echoRoute: null,
    musicBase: MUSIC_OPEN, // what setMusicFilter asked for
    musicCap: null, // a ceiling from the director (low coherence, decoherence, a death)
    ambDuck: 1,
    ducked: false,
    amb: { id: null, live: false, voices: [], events: [] },

    unlock() {
      if (this.ctx) {
        if (this.ctx.state === 'suspended' && !document.hidden) this.ctx.resume().catch(() => {});
        return;
      }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        this.ctx = new AC();
        this.build();
      } catch (e) {
        this.ctx = null; // no sound, but the game goes on
        return;
      }
      this.applyVolumes();
      Music.attach(this);
      document.addEventListener('visibilitychange', () => {
        if (!this.ctx) return;
        if (document.hidden) this.ctx.suspend().catch(() => {});
        else this.ctx.resume().catch(() => {});
      });
    },

    build() {
      const c = this.ctx;
      this.master = c.createGain();
      this.master.gain.value = 0.9;
      const comp = c.createDynamicsCompressor();
      comp.threshold.value = -14;
      comp.ratio.value = 6;
      comp.attack.value = 0.003;
      comp.release.value = 0.25;
      this.master.connect(comp);
      comp.connect(c.destination);
      this.compressor = comp;

      // Music: track gains -> musicBus -> duck -> lowpass -> master.
      this.musicBus = c.createGain();
      this.duckGain = c.createGain();
      this.musicFilter = c.createBiquadFilter();
      this.musicFilter.type = 'lowpass';
      this.musicFilter.frequency.value = MUSIC_OPEN;
      this.musicBus.connect(this.duckGain);
      this.duckGain.connect(this.musicFilter);
      this.musicFilter.connect(this.master);
      // Tracks send to the echo before their volume, so it returns louder (x1.5)
      // into musicBus to match the old level at the default 60% music volume.
      this.echoSend = makeEcho(c, this.musicBus, 1.5);

      // Effects: sfxBus -> lowpass (Temporal Sight) -> master. UI skips the lowpass.
      this.sfxBus = c.createGain();
      this.sfxFilter = c.createBiquadFilter();
      this.sfxFilter.type = 'lowpass';
      this.sfxFilter.frequency.value = SFX_OPEN;
      this.sfxFilter.Q.value = 0.5;
      this.sfxF = SFX_OPEN;
      this.sfxBus.connect(this.sfxFilter);
      this.sfxFilter.connect(this.master);
      this.sfxEchoIn = makeEcho(c, this.sfxBus, 0.55);
      this.uiBus = c.createGain();
      this.uiBus.connect(this.master);

      // Ambience: ambBus -> master.
      this.ambBus = c.createGain();
      this.ambBus.gain.value = 0;
      this.ambBus.connect(this.master);
      this.ambEchoIn = makeEcho(c, this.ambBus, 0.55);

      const len = c.sampleRate;
      this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      // A longer, odd-length noise for the ambience beds, so the 1 s loop never shows.
      const alen = Math.round(c.sampleRate * 4.73);
      this.ambNoise = c.createBuffer(1, alen, c.sampleRate);
      const ad = this.ambNoise.getChannelData(0);
      for (let i = 0; i < alen; i++) ad[i] = Math.random() * 2 - 1;
    },

    // A node is usable only inside this context (tests render recipes into an
    // OfflineAudioContext through an object that inherits from this one).
    own(n) {
      return n && this.ctx && n.context === this.ctx ? n : null;
    },

    setVolumes(v) {
      Object.assign(this.volumes, v);
      this.applyVolumes();
    },
    ambienceVolume() {
      const v = this.volumes.ambience;
      if (typeof v === 'number') return v;
      const s = DM.Save && DM.Save.settings;
      return s && typeof s.ambience === 'number' ? s.ambience : 0.7;
    },
    applyVolumes() {
      if (!this.ctx) return;
      try {
        const t = this.ctx.currentTime;
        const m = this.muted ? 0 : 1;
        this.musicBus.gain.setTargetAtTime(this.volumes.music * 0.6 * m, t, 0.05);
        this.sfxBus.gain.setTargetAtTime(this.volumes.sfx * 0.9 * m, t, 0.05);
        this.uiBus.gain.setTargetAtTime(this.volumes.sfx * 0.9 * m, t, 0.05);
        // Independent of SOUND EFFECTS; 0.8 keeps the beds at the level they were tuned at.
        this.ambBus.gain.setTargetAtTime(this.ambienceVolume() * 0.8 * this.ambDuck * m, t, 0.3);
      } catch (e) {
        /* sound must never break the game */
      }
    },
    toggleMute() {
      this.muted = !this.muted;
      this.applyVolumes();
      return this.muted;
    },

    // The music lowpass is min(what setMusicFilter asked for, the director's cap):
    // Pause and Temporal Sight set the first, danger states the second, and
    // neither overwrites the other.
    setMusicFilter(freq, time = 0.25) {
      this.musicBase = freq;
      this.applyMusicFilter(time);
    },
    setMusicCap(freq, time = 0.25) {
      const f = freq || null;
      if (f === this.musicCap) return;
      this.musicCap = f;
      this.applyMusicFilter(time);
    },
    applyMusicFilter(time) {
      if (!this.ctx) return;
      const f = Math.min(this.musicBase, this.musicCap || MUSIC_OPEN);
      this.musicF = f;
      try {
        this.musicFilter.frequency.setTargetAtTime(f, this.ctx.currentTime, time);
      } catch (e) {
        /* ignore */
      }
    },
    // Music sits back while someone is talking.
    duck(on) {
      on = !!on;
      if (on === this.ducked) return;
      this.ducked = on;
      if (!this.ctx) return;
      try {
        this.duckGain.gain.setTargetAtTime(on ? DUCK : 1, this.ctx.currentTime, 0.25);
      } catch (e) {
        /* ignore */
      }
    },
    // Temporal Sight bends the effects: recipes play lower and longer (see
    // tone/noise), and the sfx lowpass closes to 18 kHz x k^2 (at least 1.8 kHz).
    setTimeScale(k) {
      k = clamp(k == null || !isFinite(k) ? 1 : k, 0.05, 1);
      this.timeScale = k;
      if (!this.ctx) return;
      const f = k > 0.97 ? SFX_OPEN : Math.max(SFX_SIGHT_MIN, SFX_OPEN * k * k);
      if (Math.abs(f - this.sfxF) <= this.sfxF * 0.02) return;
      this.sfxF = f;
      try {
        this.sfxFilter.frequency.setTargetAtTime(f, this.ctx.currentTime, 0.08);
      } catch (e) {
        /* ignore */
      }
    },
    setAmbienceDuck(k) {
      if (Math.abs(k - this.ambDuck) < 0.01) return;
      this.ambDuck = k;
      this.applyVolumes();
    },

    // ---- primitives -------------------------------------------------------
    // tone({ freq, freqEnd, dur, gain, type, attack, delay, detune, filter, echo, am, dest })
    tone(o) {
      const c = this.ctx;
      const k = this.bendK;
      const pm = k < 0.995 ? 0.55 + 0.45 * k : 1; // pitch under Temporal Sight
      const tm = k < 0.995 ? 1 / (0.5 + 0.5 * k) : 1; // and length
      const t0 = c.currentTime + (o.delay || 0) * tm;
      const dur = (o.dur || 0.2) * tm;
      const osc = c.createOscillator();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime((o.freq || 440) * pm, t0);
      if (o.freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.freqEnd * pm), t0 + dur);
      if (o.detune) osc.detune.value = o.detune;
      const g = c.createGain();
      const peak = Math.max(0.0002, o.gain == null ? 0.2 : o.gain);
      const a = o.attack == null ? 0.005 : o.attack;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + Math.max(dur, a + 0.01));
      let node = osc;
      if (o.filter) {
        const f = c.createBiquadFilter();
        f.type = o.filter.type || 'lowpass';
        f.frequency.setValueAtTime(o.filter.freq || 2000, t0);
        if (o.filter.freqEnd) f.frequency.exponentialRampToValueAtTime(Math.max(10, o.filter.freqEnd), t0 + dur);
        f.Q.value = o.filter.q || 0.7;
        osc.connect(f);
        node = f;
      }
      if (o.am) {
        // Amplitude modulation (a cricket's trill): a square LFO gates the tone.
        const lfo = c.createOscillator();
        lfo.type = o.am.type || 'square';
        lfo.frequency.value = o.am.rate || 28;
        const depth = c.createGain();
        depth.gain.value = 0.5;
        const gate = c.createGain();
        gate.gain.value = 0.5;
        lfo.connect(depth);
        depth.connect(gate.gain);
        node.connect(gate);
        node = gate;
        lfo.start(t0);
        lfo.stop(t0 + dur + 0.05);
      }
      node.connect(g);
      g.connect(o.dest || this.route || this.sfxBus);
      this.sendEcho(g, o.echo);
      osc.start(t0);
      osc.stop(t0 + Math.max(dur, a + 0.01) + 0.05);
    },
    // noise({ dur, gain, ftype, freq, freqEnd, q, attack, delay, echo, dest })
    noise(o) {
      const c = this.ctx;
      const k = this.bendK;
      const fm = k < 0.995 ? 0.6 + 0.4 * k : 1;
      const tm = k < 0.995 ? 1 / (0.5 + 0.5 * k) : 1;
      const t0 = c.currentTime + (o.delay || 0) * tm;
      const dur = (o.dur || 0.2) * tm;
      const src = c.createBufferSource();
      src.buffer = this.noiseBuf;
      src.loop = true;
      const f = c.createBiquadFilter();
      f.type = o.ftype || 'lowpass';
      f.frequency.setValueAtTime((o.freq || 3000) * fm, t0);
      if (o.freqEnd) f.frequency.exponentialRampToValueAtTime(Math.max(10, o.freqEnd * fm), t0 + dur);
      f.Q.value = o.q || 0.8;
      const g = c.createGain();
      const peak = Math.max(0.0002, o.gain == null ? 0.2 : o.gain);
      const a = o.attack == null ? 0.003 : o.attack;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + Math.max(dur, a + 0.01));
      src.connect(f);
      f.connect(g);
      g.connect(o.dest || this.route || this.sfxBus);
      this.sendEcho(g, o.echo);
      src.start(t0, Math.random() * 0.5);
      src.stop(t0 + Math.max(dur, a + 0.01) + 0.05);
    },
    sendEcho(g, amount) {
      if (!amount) return;
      const e = this.own(this.echoRoute || this.sfxEchoIn);
      if (!e) return;
      const s = this.ctx.createGain();
      s.gain.value = amount;
      g.connect(s);
      s.connect(e);
    },

    play(name, opts) {
      const c = this.ctx;
      if (!c || this.muted || c.state !== 'running') return;
      const def = SFX[name];
      if (!def) return;
      const now = c.currentTime;
      const gap = def.gap == null ? 0.02 : def.gap;
      const last = this.last[name];
      if (last != null && now - last < gap) return;
      this.last[name] = now;
      const o = opts || {};
      const ui = !!(def.ui || o.ui);
      this.bendK = ui ? 1 : clamp(this.timeScale || 1, 0.05, 1);
      this.route = ui ? this.own(this.uiBus) : null;
      try {
        def.fn(this, o);
      } catch (e) {
        /* sound must never break the game */
      } finally {
        this.bendK = 1;
        this.route = null;
      }
    },
    // New recipes from other modules: Audio.define('name', { gap, ui, fn(audio, opts) }).
    define(name, def) {
      if (typeof def === 'function') def = { fn: def };
      if (name && def && typeof def.fn === 'function') SFX[name] = def;
      return this;
    },
    has(name) {
      return !!SFX[name];
    },

    // ---- hums ---------------------------------------------------------------
    // Sustained sounds (telekinesis, danger, Temporal Sight). Call every frame
    // with on=true; repeated calls update freq / freq2 / gain / mod live.
    //   kind 'tone' (default): o.type osc at o.freq + o.type2 osc at o.freq2 -> lowpass o.cutoff
    //   kind 'noise': filtered noise (o.freq, o.q), gated by a square LFO at o.gate Hz
    //   kind 'sight': a 55 Hz sine with slow vibrato and a ticking pocket watch (on the UI bus)
    hum(id, on, o = {}) {
      if (!this.ctx) return;
      try {
        this.humNow(id, on, o);
      } catch (e) {
        /* sound must never break the game */
      }
    },
    humNow(id, on, o) {
      let h = this.hums[id];
      const c = this.ctx;
      const now = c.currentTime;
      if (on && !h) {
        h = this.hums[id] = this.buildHum(o);
        h.g.gain.setTargetAtTime(Math.max(0.0001, h.gain), now, 0.08);
      } else if (!on && h) {
        h.g.gain.setTargetAtTime(0.0001, now, 0.06);
        for (const s of h.srcs) s.stop(now + 0.4);
        delete this.hums[id];
        return;
      }
      if (!on || !h) return;
      if (o.freq != null && h.osc && Math.abs(o.freq - h.freq) > h.freq * 0.005) {
        h.freq = o.freq;
        h.osc.frequency.setTargetAtTime(o.freq, now, 0.05);
      }
      if (o.freq2 != null && h.osc2 && Math.abs(o.freq2 - h.freq2) > h.freq2 * 0.005) {
        h.freq2 = o.freq2;
        h.osc2.frequency.setTargetAtTime(o.freq2, now, 0.05);
      }
      if (o.gain != null && Math.abs(o.gain - h.gain) > Math.max(0.0004, h.gain * 0.03)) {
        h.gain = o.gain;
        h.g.gain.setTargetAtTime(Math.max(0.0001, o.gain), now, 0.08);
      }
      if (o.mod != null && h.f) {
        const f = h.cutoff * (1 + o.mod);
        if (Math.abs(f - h.fNow) > h.fNow * 0.01) {
          h.fNow = f;
          h.f.frequency.setTargetAtTime(f, now, 0.05);
        }
      }
    },
    buildHum(o) {
      const c = this.ctx;
      const g = c.createGain();
      g.gain.value = 0.0001;
      const h = { g, srcs: [], kind: o.kind || 'tone' };
      if (h.kind === 'sight') {
        h.gain = o.gain == null ? 1 : o.gain;
        const osc = c.createOscillator();
        osc.frequency.value = 55;
        const vib = c.createOscillator();
        vib.frequency.value = 0.3;
        const vd = c.createGain();
        vd.gain.value = 2.5;
        vib.connect(vd);
        vd.connect(osc.frequency);
        const dg = c.createGain();
        dg.gain.value = 0.03;
        osc.connect(dg);
        dg.connect(g);
        const tick = c.createBufferSource();
        tick.buffer = this.sightTicks || (this.sightTicks = tickLoop(c));
        tick.loop = true;
        const tg = c.createGain();
        tg.gain.value = 0.08;
        tick.connect(tg);
        tg.connect(g);
        g.connect(this.uiBus || this.sfxBus);
        h.srcs.push(osc, vib, tick);
      } else if (h.kind === 'noise') {
        h.gain = o.gain != null ? o.gain : 0.02;
        const src = c.createBufferSource();
        src.buffer = this.noiseBuf;
        src.loop = true;
        const f = c.createBiquadFilter();
        f.type = o.ftype || 'bandpass';
        f.frequency.value = o.freq || 3500;
        f.Q.value = o.q || 1.2;
        const gate = c.createGain();
        gate.gain.value = 0.5;
        const lfo = c.createOscillator();
        lfo.type = 'square';
        lfo.frequency.value = o.gate || 25;
        const depth = c.createGain();
        depth.gain.value = 0.5;
        lfo.connect(depth);
        depth.connect(gate.gain);
        src.connect(f);
        f.connect(gate);
        gate.connect(g);
        g.connect(this.sfxBus);
        h.srcs.push(src, lfo);
      } else {
        h.gain = o.gain != null ? o.gain : 0.05;
        h.freq = o.freq || 80;
        h.freq2 = o.freq2 || h.freq * 1.501;
        const osc = c.createOscillator();
        osc.type = o.type || 'sawtooth';
        osc.frequency.value = h.freq;
        const osc2 = c.createOscillator();
        osc2.type = o.type2 || 'sine';
        osc2.frequency.value = h.freq2;
        const f = c.createBiquadFilter();
        f.type = 'lowpass';
        f.frequency.value = o.cutoff || 500;
        f.Q.value = 4;
        osc.connect(f);
        osc2.connect(f);
        f.connect(g);
        g.connect(this.sfxBus);
        Object.assign(h, { osc, osc2, f, cutoff: o.cutoff || 500, fNow: o.cutoff || 500 });
        h.srcs.push(osc, osc2);
      }
      for (const s of h.srcs) s.start();
      return h;
    },
    stopHums() {
      for (const id of Object.keys(this.hums)) this.hum(id, false);
    },

    // ---- ambience -----------------------------------------------------------
    // Crossfade to the bed `id` from DM.Ambience.beds (null = silence). Safe to
    // call every frame; before unlock it only records the wish.
    ambience(id, fade = 1.5) {
      id = id || null;
      const a = this.amb;
      if (a.id === id && (a.live || !id || !this.ctx)) return;
      const next = { id, live: false, voices: [], events: [] };
      try {
        if (a.live) this.ambRelease(a);
        this.amb = next;
        const bed = id && DM.Ambience && DM.Ambience.beds[id];
        if (!bed || !this.ctx) return;
        for (const L of bed.layers || []) this.ambLayer(next, L, fade);
        next.live = true;
        if (!this.ambTimer) this.ambTimer = setInterval(() => this.ambTick(), 250);
      } catch (e) {
        this.amb = next;
      }
    },
    ambRelease(a) {
      const now = this.ctx.currentTime;
      a.live = false;
      a.events.length = 0;
      for (const v of a.voices) {
        v.out.gain.setTargetAtTime(0.0001, now, 0.5);
        for (const s of v.srcs) s.stop(now + 3);
        setTimeout(() => v.out.disconnect(), 3500);
      }
    },
    ambLayer(a, L, fade) {
      const c = this.ctx;
      const now = c.currentTime;
      const out = c.createGain();
      out.gain.setValueAtTime(0.0001, now);
      out.gain.setTargetAtTime(1, now, Math.max(0.05, fade / 3));
      out.connect(this.ambBus);
      const v = { out, srcs: [] };
      a.voices.push(v);
      const lfoTo = (lfo, param, base) => {
        // A slow sine LFO on gain and/or filter frequency (+-depth of the base value).
        const osc = c.createOscillator();
        osc.frequency.value = lfo.rate * rand(0.85, 1.15);
        for (const [p, b, depth] of param) {
          if (!depth) continue;
          const dg = c.createGain();
          dg.gain.value = b * depth;
          osc.connect(dg);
          dg.connect(p);
        }
        osc.start(now);
        v.srcs.push(osc);
        return osc;
      };
      if (L.kind === 'wind') {
        const src = c.createBufferSource();
        src.buffer = this.ambNoise || this.noiseBuf;
        src.loop = true;
        src.playbackRate.value = rand(0.92, 1.08);
        const f = c.createBiquadFilter();
        f.type = L.ftype || 'bandpass';
        f.frequency.value = L.freq || 450;
        f.Q.value = L.q || 0.7;
        const g = c.createGain();
        g.gain.value = L.gain || 0.01;
        src.connect(f);
        f.connect(g);
        g.connect(out);
        src.start(now, rand(0, 4));
        v.srcs.push(src);
        if (L.lfo) lfoTo(L.lfo, [[g.gain, L.gain || 0.01, L.lfo.depth], [f.frequency, L.freq || 450, L.lfo.fdepth]]);
        if (L.lfo2) lfoTo(L.lfo2, [[g.gain, L.gain || 0.01, L.lfo2.depth], [f.frequency, L.freq || 450, L.lfo2.fdepth]]);
      } else if (L.kind === 'drone') {
        const f = c.createBiquadFilter();
        f.type = 'lowpass';
        f.frequency.value = L.cutoff || 800;
        const g = c.createGain();
        g.gain.value = L.gain || 0.01;
        f.connect(g);
        g.connect(out);
        for (const O of L.oscs || []) {
          const osc = c.createOscillator();
          osc.type = O.wave || 'sine';
          osc.frequency.value = O.f;
          if (O.detune) osc.detune.value = O.detune;
          const og = c.createGain();
          og.gain.value = O.g == null ? 1 : O.g;
          osc.connect(og);
          og.connect(f);
          osc.start(now);
          v.srcs.push(osc);
        }
        if (L.lfo) lfoTo(L.lfo, [[g.gain, L.gain || 0.01, L.lfo.depth]]);
      } else if (L.kind === 'events') {
        const g = c.createGain();
        g.gain.value = L.gain == null ? 1 : L.gain;
        g.connect(out);
        const first = L.first || L.every || [2, 5];
        a.events.push({ L, dest: g, next: now + rand(first[0], first[1]) });
      }
    },
    // Random one-shots for the current bed, scheduled a little ahead.
    ambTick() {
      const c = this.ctx;
      const a = this.amb;
      if (!c || c.state !== 'running' || !a.live || this.muted) return;
      const now = c.currentTime;
      for (const ev of a.events) {
        if (ev.next > now + 0.3) continue;
        if (ev.next < now - 1) ev.next = now; // the tab slept: no backlog
        const def = SFX[ev.L.sound];
        if (def) {
          this.route = ev.dest;
          this.echoRoute = this.ambEchoIn;
          this.bendK = 1;
          try {
            def.fn(this, Object.assign({ delay: Math.max(0, ev.next - now) }, ev.L.opts));
          } catch (e) {
            /* ignore */
          } finally {
            this.route = null;
            this.echoRoute = null;
          }
        }
        ev.next += rand(ev.L.every[0], ev.L.every[1]);
      }
    },
  };

  // ---- SFX recipes --------------------------------------------------------
  // { gap: min seconds between plays, ui: true = never bent by Temporal Sight
  //   and routed past the sfx lowpass, fn(audio, opts) }
  const d0 = (o) => o.delay || 0; // ambience events pass their scheduled offset

  // Footsteps by surface; v scales gain, p scales pitch (both randomised per step).
  const STEPS = {
    concrete(a, v, p) {
      a.noise({ dur: 0.035, gain: 0.07 * v, ftype: 'bandpass', freq: 1400 * p, q: 1.5 });
      a.tone({ freq: 140 * p, freqEnd: 90 * p, dur: 0.04, gain: 0.05 * v, type: 'sine' });
    },
    sand(a, v, p) {
      a.noise({ dur: 0.07, gain: 0.07 * v, ftype: 'lowpass', freq: 900 * p, attack: 0.008 });
    },
    snow(a, v, p) {
      for (let i = 0; i < 3; i++) a.noise({ dur: 0.022, gain: 0.05 * v, ftype: 'bandpass', freq: 2500 * p * rand(0.9, 1.1), q: 1.6, delay: i * 0.028 + rand(0, 0.008) });
    },
    wood(a, v, p) {
      a.tone({ freq: 220 * p, dur: 0.03, gain: 0.04 * v, type: 'triangle' });
      a.noise({ dur: 0.04, gain: 0.06 * v, ftype: 'bandpass', freq: 700 * p, q: 1.4 });
    },
    dust(a, v, p) {
      a.noise({ dur: 0.06, gain: 0.05 * v, ftype: 'lowpass', freq: 600 * p, attack: 0.006 });
    },
  };

  // ---- music sequencer ----------------------------------------------------
  const FADE = 0.15; // intensity width over which a gated layer fades in
  const smooth = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
  // How much of a layer plays at intensity I (layers with min / max fade in / out).
  function layerWeight(L, I) {
    let w = 1;
    if (L.min != null) w *= smooth((I - (L.min - FADE)) / FADE);
    if (L.max != null) w *= 1 - smooth((I - L.max) / FADE);
    return w;
  }

  const Music = {
    audio: null,
    track: null,
    trackId: null,
    queued: undefined, // requested before the audio unlocked
    switchTo: null, // { id, step } a change waiting for the old track's next beat
    intensity: 0, // smoothed (rate 1.5 up, 0.8 down); read at bar starts
    target: 0,
    barI: 0,
    attach(audio) {
      this.audio = audio;
      if (this.queued !== undefined) {
        const q = this.queued;
        this.queued = undefined;
        this.play(q, { at: 'now' });
      }
    },
    // The track that is playing or about to.
    get wanted() {
      return this.switchTo ? this.switchTo.id : this.trackId;
    },
    // play(id, { at: 'beat' | 'bar' | 'now', intensity }): changes land on the old
    // track's beat grid; asking again for the old track before then cancels it.
    play(id, o = {}) {
      id = id || null;
      if (o.intensity != null) this.setIntensity(o.intensity, true);
      const c = this.audio && this.audio.ctx;
      if (!c) {
        this.queued = id;
        return;
      }
      try {
        if (this.switchTo) {
          if (this.switchTo.id === id) return;
          if (id === this.trackId) {
            this.switchTo = null;
            return;
          }
        } else if (id === this.trackId) return;
        const at = o.at || 'beat';
        if (this.track && at !== 'now' && c.state === 'running' && this.next > c.currentTime - 0.3) {
          const tr = this.track;
          const unit = (tr.div || 4) * (at === 'bar' ? tr.beats || 4 : 1);
          this.switchTo = { id, step: this.step + ((unit - (this.step % unit)) % unit) };
          return;
        }
        this.start(id, c.currentTime + 0.15, o.fade);
      } catch (e) {
        /* music must never break the game */
      }
    },
    stop() {
      this.play(null);
    },
    setIntensity(v, snap) {
      this.target = clamp(+v || 0, 0, 1);
      if (snap) this.intensity = this.barI = this.target;
    },
    start(id, t, fade) {
      const c = this.audio.ctx;
      this.switchTo = null;
      if (this.gain) {
        const old = this.gain;
        old.gain.setTargetAtTime(0.0001, t, 0.3);
        setTimeout(() => old.disconnect(), 4000 + Math.max(0, t - c.currentTime) * 1000);
      }
      const hadTrack = !!this.track;
      this.trackId = id;
      this.track = id ? DM.MusicTracks[id] || null : null;
      this.gain = null;
      if (!this.track) return;
      this.gain = c.createGain();
      this.gain.gain.setValueAtTime(0.0001, c.currentTime);
      this.gain.gain.setTargetAtTime(dbToGain(this.track.level), t, fade || (hadTrack ? 0.2 : 0.7));
      this.gain.connect(this.audio.musicBus);
      const send = c.createGain();
      send.gain.value = this.track.echo == null ? 0.35 : this.track.echo;
      this.gain.connect(send);
      send.connect(this.audio.echoSend);
      this.step = 0;
      this.next = t;
      this.barI = this.intensity;
      if (!this.timer) this.timer = setInterval(() => this.schedule(), 30);
    },
    schedule() {
      const c = this.audio && this.audio.ctx;
      if (!c || c.state !== 'running') return;
      try {
        const now = c.currentTime;
        const dt = Math.min(0.25, Math.max(0, now - (this.lastT == null ? now : this.lastT)));
        this.lastT = now;
        const rate = this.target > this.intensity ? 1.5 : 0.8;
        this.intensity += (this.target - this.intensity) * (1 - Math.exp(-rate * dt));
        if (!this.track) return;
        if (this.next < now - 0.3) this.next = now + 0.05;
        while (this.track && this.next < now + 0.2) {
          if (this.switchTo && this.step >= this.switchTo.step) {
            this.start(this.switchTo.id, this.next);
            continue;
          }
          const tr = this.track;
          const spStep = 60 / tr.bpm / (tr.div || 4);
          this.playStep(this.step, this.next, spStep);
          this.next += spStep;
          this.step++;
        }
      } catch (e) {
        /* ignore */
      }
    },
    playStep(step, t, spStep) {
      const tr = this.track;
      const perBar = (tr.div || 4) * (tr.beats || 4);
      const bpc = tr.barsPerChord || 1;
      const bar = Math.floor(step / perBar);
      const sib = step % perBar;
      const chord = tr.prog[Math.floor(bar / bpc) % tr.prog.length];
      const chordStart = sib === 0 && bar % bpc === 0;
      if (sib === 0) this.barI = this.intensity;
      for (const L of tr.layers) {
        if (L.from && bar < L.from) continue;
        const w = L.min != null || L.max != null ? layerWeight(L, this.barI) : 1;
        if (w < 0.02) continue;
        if (L.kind === 'arp') {
          const every = L.every || 1;
          if (sib % every) continue;
          const idx = Math.floor(step / every);
          const pi = L.pattern[idx % L.pattern.length];
          if (pi == null || pi < 0) continue;
          const n = chord[pi % chord.length] + 12 * Math.floor(pi / chord.length) + (L.oct || 0);
          this.note(n, t, spStep * every * (L.len || 1.6), L, w);
        } else if (L.kind === 'pad') {
          if (!chordStart) continue;
          const dur = spStep * perBar * bpc;
          for (const n of chord) this.note(n + (L.oct || 0), t, dur, L, w);
        } else if (L.kind === 'bass') {
          const every = L.every || perBar;
          if (sib % every === 0) this.note(chord[0] + (L.oct == null ? -12 : L.oct), t, spStep * every * 0.95, L, w);
        } else if (L.kind === 'tick') {
          const every = L.every || tr.div || 4;
          if (sib % every === 0) this.click(t, L, (sib / every) % 2, w);
        } else if (L.kind === 'kick') {
          if (L.pattern[sib % L.pattern.length]) this.kick(t, L, w);
        } else if (L.kind === 'snare') {
          if (L.pattern[sib % L.pattern.length]) this.snare(t, L, w);
        }
      }
    },
    note(m, t, dur, L, w = 1) {
      const c = this.audio.ctx;
      const osc = c.createOscillator();
      osc.type = L.wave || 'triangle';
      osc.frequency.value = mtof(m);
      if (L.detune) osc.detune.value = (Math.random() - 0.5) * L.detune;
      const g = c.createGain();
      const a = L.attack == null ? 0.01 : L.attack;
      const peak = Math.max(0.0002, (L.gain == null ? 0.05 : L.gain) * w);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(a + 0.03, dur));
      let node = osc;
      if (L.cutoff) {
        const f = c.createBiquadFilter();
        f.type = 'lowpass';
        f.frequency.value = L.cutoff;
        osc.connect(f);
        node = f;
      }
      node.connect(g);
      g.connect(this.gain);
      osc.start(t);
      osc.stop(t + Math.max(a + 0.03, dur) + 0.1);
    },
    click(t, L, alt, w = 1) {
      const c = this.audio.ctx;
      const src = c.createBufferSource();
      src.buffer = this.audio.noiseBuf;
      const f = c.createBiquadFilter();
      f.type = 'bandpass';
      f.frequency.value = alt ? 3000 : 4200;
      f.Q.value = 7;
      const g = c.createGain();
      g.gain.setValueAtTime(Math.max(0.0002, (L.gain || 0.08) * w), t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.035);
      src.connect(f);
      f.connect(g);
      g.connect(this.gain);
      src.start(t, Math.random() * 0.5);
      src.stop(t + 0.05);
    },
    // A soft drum: a sine drop to 50 Hz (audible on small speakers) and a 2 ms click.
    kick(t, L, w = 1) {
      const c = this.audio.ctx;
      const lv = (L.gain || 0.2) * w;
      const osc = c.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(110, t);
      osc.frequency.exponentialRampToValueAtTime(50, t + 0.18);
      const g = c.createGain();
      g.gain.setValueAtTime(Math.max(0.0002, lv), t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
      osc.connect(g);
      g.connect(this.gain);
      osc.start(t);
      osc.stop(t + 0.3);
      const src = c.createBufferSource();
      src.buffer = this.audio.noiseBuf;
      const f = c.createBiquadFilter();
      f.type = 'highpass';
      f.frequency.value = 2000;
      const cg = c.createGain();
      cg.gain.setValueAtTime(Math.max(0.0002, lv * 0.25), t);
      cg.gain.exponentialRampToValueAtTime(0.0001, t + 0.004);
      src.connect(f);
      f.connect(cg);
      cg.connect(this.gain);
      src.start(t, Math.random() * 0.5);
      src.stop(t + 0.01);
    },
    snare(t, L, w = 1) {
      const c = this.audio.ctx;
      const src = c.createBufferSource();
      src.buffer = this.audio.noiseBuf;
      const f = c.createBiquadFilter();
      f.type = 'bandpass';
      f.frequency.value = 1800;
      f.Q.value = 0.8;
      const g = c.createGain();
      g.gain.setValueAtTime(Math.max(0.0002, (L.gain || 0.06) * w), t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
      src.connect(f);
      f.connect(g);
      g.connect(this.gain);
      src.start(t, Math.random() * 0.5);
      src.stop(t + 0.14);
    },
  };

  Audio.music = Music;
  Audio.recipes = SFX;
  Audio.layerWeight = layerWeight;
  DM.Audio = Audio;
})();
</script>

<script>/* src/data/ambience.js */
/*
 * Ambience, as data: the sound of each place, what Jon's feet sound like on
 * it, and which music each story beat calls for. Read by the audio director
 * (src/game/audiodirector.js); the beds are built by Audio.ambience().
 *
 * maps[mapName]   { bed, surface, zones }
 *   bed      the bed id played on that map
 *   surface  footstep sound: 'concrete' | 'sand' | 'snow' | 'wood' | 'dust' (null = none)
 *   zones    [{ bed, rect: [x0, y0, x1, y1] }]: a different bed while Jon is
 *            inside the rect (first match wins; 40 px of hysteresis at the edge)
 *
 * beds[id].layers, each one of
 *   wind    filtered noise: { ftype, freq, q, gain, lfo: { rate, depth, fdepth }, lfo2 }
 *           (depth swings the gain and fdepth the filter, as fractions of their base)
 *   drone   oscillators into a lowpass: { oscs: [{ f, wave, g, detune }], cutoff, gain, lfo }
 *   events  a recipe from audio.js every [min, max] seconds: { sound, every, first, gain }
 *
 * cues['chapter.stage'] = track: music for a story beat. It plays when the stage
 * starts (or the chapter is retried there); when a later stage has no cue, the
 * chapter's own track returns, unless a script changed the music meanwhile.
 * events['event:name'] = track: music on a DM.Events event.
 */
(function () {
  'use strict';

  // Shared layers.
  const DESERT_DAY = [
    { kind: 'wind', ftype: 'bandpass', freq: 350, q: 0.7, gain: 0.022, lfo: { rate: 0.1, depth: 0.5, fdepth: 0.3 } },
    { kind: 'wind', ftype: 'bandpass', freq: 1300, q: 1.2, gain: 0.004, lfo: { rate: 0.06, depth: 0.7, fdepth: 0.25 } },
  ];

  window.DM.Ambience = {

      mars: { bed: 'mars', surface: 'dust' },
      karnak: { bed: 'karnak', surface: 'snow', zones: [{ bed: 'sanctum', rect: [1960, 0, 99999, 99999] }] },

    beds: {

        ],
      },
      // Mars: thin, high wind sweeping slowly, and crystal pings.
      mars: {
        layers: [
          { kind: 'wind', ftype: 'bandpass', freq: 1550, q: 2.5, gain: 0.01, lfo: { rate: 0.04, depth: 0.4, fdepth: 0.42 } },
          { kind: 'wind', ftype: 'lowpass', freq: 220, q: 0.7, gain: 0.006, lfo: { rate: 0.03, depth: 0.5 } },
          { kind: 'events', sound: 'amb_crystal', every: [3, 7], first: [1, 3] },
        ],
      },
      // Karnak: an Antarctic gale with a whistle in it.
      karnak: {
        layers: [
          { kind: 'wind', ftype: 'lowpass', freq: 500, q: 0.7, gain: 0.035, lfo: { rate: 0.15, depth: 0.6, fdepth: 0.3 }, lfo2: { rate: 0.037, depth: 0.3 } },
          { kind: 'wind', ftype: 'bandpass', freq: 1800, q: 5, gain: 0.008, lfo: { rate: 0.07, depth: 0.5, fdepth: 0.33 } },
        ],
      },
      // Inside Karnak's sanctum: the gale muffled by walls, a machine hum.
      sanctum: {
        layers: [
          { kind: 'drone', oscs: [{ f: 50, wave: 'sawtooth' }, { f: 100, wave: 'sine', g: 0.9 }, { f: 150, wave: 'sine', g: 0.2 }], cutoff: 340, gain: 0.012 },
          { kind: 'wind', ftype: 'lowpass', freq: 250, q: 0.7, gain: 0.01, lfo: { rate: 0.15, depth: 0.5 } },
        ],
      },
    },

    cues: {
      'prologue.accident': 'tension', // the script asks for it too, but a retry would otherwise restart the calm track
      'superman.range': 'range',
      'superman.aftermath': 'reflect',
      'deterrent.outro': 'reflect',
      'mars.studio': 'tension',
    },
    events: {
      'veidt:yield': 'reflect',
    },
  };
})();
</script>
<script>/* src/core/settings.js */
/*
 * Settings schema: every player-facing option, declared once.
 *
 * save.js builds its default settings from this list and the Settings screen
 * generates its rows from it, so adding an option is one entry here.
 *
 * Entry fields:
 *   id, section, label, desc       desc may be a function of the current value
 *   type 'slider'                  number in min..max, moved in `step`s (bar + %)
 *   type 'choice'                  one of options: [[value, 'LABEL'], ...]
 *   type 'toggle'                  true / false, shown ON / OFF
 *   type 'action'                  a button: action(scene); `confirm` asks twice
 *   def                            default, or a function returning it
 *   apply(value)                   runs after the player changes it
 *   coerce(raw)                    maps a legacy saved value (undefined = use def)
 *   transient + get() / set(v)     live state that is never saved (fullscreen)
 *
 * Also here: the challenge levels (DM.CHALLENGE), applied to the player on
 * every 'play:begin', and the death count behind the Game Over offer.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;

  const SECTIONS = ['AUDIO', 'DISPLAY & ACCESSIBILITY', 'GAMEPLAY', 'CONTROLS'];

  // Damage taken, seconds before coherence recovers, and recovery per second.
  // Player.damage reads damageMul / regenDelayBase; Player.update reads coherenceRegen.
  // Story is tuned so standing idle lasts at least twice as long as Normal even in
  // Operation Blue Fire, whose waves open quietly and then converge (0.45 managed 1.4x).
  const CHALLENGE = {
    story: { label: 'STORY', dmg: 0.3, regenDelay: 1.2, regen: 18 },
    normal: { label: 'NORMAL', dmg: 1, regenDelay: 2.6, regen: 9 },
    hard: { label: 'HARD', dmg: 1.35, regenDelay: 3.2, regen: 7 },
  };

  // Typewriter speeds (characters per second) and caption read-time multipliers.
  const TEXT_CPS = { slow: 30, normal: 55, fast: 110, instant: Infinity };
  const READ_TIME = { slow: 1.5, normal: 1, fast: 1, instant: 1 };

  function prefersReducedMotion() {
    try {
      return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    } catch (e) {
      return false;
    }
  }

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function toggleFullscreen() {
    try {
      if (isFullscreen()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else {
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req) {
          const r = req.call(el);
          if (r && r.catch) r.catch(() => {});
        }
      }
    } catch (e) {
      /* fullscreen is optional */
    }
  }

  function applyVolumes() {
    const s = DM.Save.settings;
    DM.Audio.setVolumes({ music: s.music, sfx: s.sfx, ambience: s.ambience });
  }

  function playScene() {
    const Play = DM.Scenes && DM.Scenes.Play;
    return (DM.Engine && Play && DM.Engine.stack.find((s) => s instanceof Play)) || null;
  }

  // ---- the schema ----------------------------------------------------------------
  const Schema = [
    // AUDIO
    {
      id: 'music', section: 'AUDIO', label: 'MUSIC', type: 'slider', min: 0, max: 1, step: 0.1, def: 0.6,
      desc: 'The score.', apply: applyVolumes,
    },
    {
      id: 'sfx', section: 'AUDIO', label: 'SOUND EFFECTS', type: 'slider', min: 0, max: 1, step: 0.1, def: 0.8,
      desc: 'Powers, impacts, voices and the interface.',
      apply() {
        applyVolumes();
        DM.Audio.play('ui_select');
      },
    },
    {
      id: 'ambience', section: 'AUDIO', label: 'AMBIENCE', type: 'slider', min: 0, max: 1, step: 0.1, def: 0.7,
      desc: 'Wind, machines and crowds: the sound of each place.', apply: applyVolumes,
    },

    // DISPLAY & ACCESSIBILITY
    {
      id: 'flashing', section: 'DISPLAY & ACCESSIBILITY', label: 'FLASHING LIGHTS', type: 'choice',
      options: [['full', 'FULL'], ['reduced', 'REDUCED']],
      def: () => (prefersReducedMotion() ? 'reduced' : 'full'),
      desc: (v) => (v === 'reduced'
        ? 'Full-screen flashes become a soft, dim fade. Strobing camera flashes and blinking alarms are removed.'
        : 'Bright full-screen flashes, camera flashbulbs and blinking alarm lights, as designed.'),
    },
    {
      id: 'shake', section: 'DISPLAY & ACCESSIBILITY', label: 'SCREEN SHAKE', type: 'choice',
      options: [[0, 'OFF'], [0.5, '50%'], [1, '100%']],
      def: () => (prefersReducedMotion() ? 0.5 : 1),
      coerce: (v) => (typeof v === 'boolean' ? (v ? 1 : 0) : undefined),
      desc: 'How hard the camera shakes on impacts and explosions.',
    },
    {
      id: 'grain', section: 'DISPLAY & ACCESSIBILITY', label: 'FILM GRAIN', type: 'toggle', def: true,
      desc: 'A fine grain over the picture, like old film stock.',
    },
    {
      id: 'quality', section: 'DISPLAY & ACCESSIBILITY', label: 'QUALITY', type: 'choice',
      options: [['high', 'HIGH'], ['balanced', 'BALANCED'], ['low', 'LOW']], def: 'high',
      desc: 'Render resolution. Lower it if the game stutters on this machine.',
      apply() {
        const E = DM.Engine;
        if (!E || !E.canvas) return;
        // A choice made here replaces any automatic drop from the frame governor.
        if (E.governor) {
          E.governor.drop = 0;
          E.governor.slow = 0;
          E.governor.grace = 3;
        }
        E.resize();
      },
    },
    {
      id: 'fx', section: 'DISPLAY & ACCESSIBILITY', label: 'AMBIENT EFFECTS', type: 'choice',
      options: [['full', 'FULL'], ['reduced', 'REDUCED'], ['off', 'OFF']], def: () => (prefersReducedMotion() ? 'reduced' : 'full'),
      desc: 'Snow, dust, drizzle and haze drifting through each place.',
    },
    {
      id: 'fullscreen', section: 'DISPLAY & ACCESSIBILITY', label: 'FULLSCREEN', type: 'toggle', transient: true,
      get: isFullscreen, set: toggleFullscreen,
      desc: 'Fill the whole screen. Esc leaves fullscreen.',
    },

    // GAMEPLAY
    {
      id: 'challenge', section: 'GAMEPLAY', label: 'CHALLENGE', type: 'choice',
      options: [['story', 'STORY'], ['normal', 'NORMAL'], ['hard', 'HARD']], def: 'normal',
      desc: (v) => ({
        story: 'STORY: attacks hurt a third as much and you pull yourself together quickly.',
        normal: 'NORMAL: the fights as designed.',
        hard: 'HARD: attacks hurt more and you take longer to recover.',
      })[v],
      apply: () => Challenge.applyNow(),
    },
    {
      id: 'invulnerable', section: 'GAMEPLAY', label: 'INVULNERABILITY', type: 'toggle', def: false,
      desc: 'Assist: nothing can hurt you. Play the story at your own pace.',
      apply: () => Challenge.applyNow(),
    },
    {
      id: 'hints', section: 'GAMEPLAY', label: 'HINTS', type: 'choice',
      options: [['all', 'ALL'], ['essential', 'ESSENTIAL']], def: 'all',
      coerce: (v) => (v === true ? 'all' : v === false ? 'essential' : undefined),
      desc: (v) => (v === 'essential'
        ? 'Only instructions you need to progress. Press H in play to recall the last tip.'
        : 'Tips and tactics as you go. Press H in play to see the last one again.'),
    },
    {
      id: 'textSpeed', section: 'GAMEPLAY', label: 'TEXT SPEED', type: 'choice',
      options: [['slow', 'SLOW'], ['normal', 'NORMAL'], ['fast', 'FAST'], ['instant', 'INSTANT']], def: 'normal',
      desc: (v) => (v === 'slow'
        ? 'Dialogue types out slowly and narration stays on screen half as long again.'
        : 'How fast dialogue and narration type out. Hold E / SPACE / CLICK to fast-forward a conversation.'),
    },
    {
      id: 'focusPause', section: 'GAMEPLAY', label: 'PAUSE WHEN UNFOCUSED', type: 'toggle', def: true,
      desc: 'Pause automatically when you switch to another window or tab.',
    },
    {
      id: 'reset', section: 'GAMEPLAY', label: 'RESET PROGRESS', type: 'action', confirm: true,
      desc: 'Erase chapters, checkpoints and the tally of lives. Settings are kept.',
      // Only from the title: a chapter still running would write its progress back.
      get hidden() {
        return !!(DM.Engine && DM.Scenes && DM.Scenes.Play && DM.Engine.stack.some((sc) => sc instanceof DM.Scenes.Play));
      },
      action() {
        DM.Save.reset();
        return 'Progress reset.';
      },
    },

    // CONTROLS
    {
      id: 'tkMode', section: 'CONTROLS', label: 'TELEKINESIS', type: 'choice',
      options: [['hold', 'HOLD'], ['toggle', 'TOGGLE']], def: 'hold',
      desc: (v) => (v === 'toggle'
        ? 'TOGGLE: click to lift, click again to throw. Kinder on a trackpad.'
        : 'HOLD: keep the button down to carry, release to throw.'),
    },
    {
      id: 'controls', section: 'CONTROLS', label: 'CONTROLS LIST', type: 'action',
      desc: 'Every key and button, including the Mac trackpad equivalents.',
      action() {
        DM.Engine.push(new DM.Scenes.Controls());
      },
    },
  ];

  const byId = Object.create(null);
  const index = () => {
    for (const k in byId) delete byId[k];
    for (const e of Schema) byId[e.id] = e;
  };
  index();

  const stored = (e) => e.type !== 'action' && !e.transient;
  const resolveDef = (e) => (typeof e.def === 'function' ? e.def() : e.def);

  // A valid value for entry e, from whatever was saved (old saves, hand edits, junk).
  function clean(e, raw) {
    if (raw === undefined || raw === null) return resolveDef(e);
    if (e.coerce) {
      const c = e.coerce(raw);
      if (c !== undefined) raw = c;
    }
    if (e.type === 'slider') {
      if (typeof raw !== 'number' || !isFinite(raw)) return resolveDef(e);
      const v = U.clamp(raw, e.min, e.max);
      return Number((Math.round((v - e.min) / e.step) * e.step + e.min).toFixed(6)); // 0.3, not 0.30000000000000004
    }
    if (e.type === 'toggle') return typeof raw === 'boolean' ? raw : resolveDef(e);
    if (e.type === 'choice') {
      if (e.options.some((o) => o[0] === raw)) return raw;
      // Numeric choices snap to the nearest option (an old 0.8 shake becomes 100%).
      if (typeof raw === 'number' && isFinite(raw) && typeof e.options[0][0] === 'number') {
        let best = e.options[0][0];
        for (const [v] of e.options) if (Math.abs(v - raw) < Math.abs(best - raw)) best = v;
        return best;
      }
      return resolveDef(e);
    }
    return raw;
  }

  Object.assign(Schema, {
    sections: SECTIONS,

    get(id) {
      if (!byId[id]) index(); // picks up entries pushed after load
      return byId[id] || null;
    },
    inSection(name) {
      return Schema.filter((e) => e.section === name && !e.hidden);
    },

    // Fresh settings object: every stored entry at its default.
    defaults() {
      const s = {};
      for (const e of Schema) if (stored(e)) s[e.id] = resolveDef(e);
      return s;
    },
    // Repairs a settings object in place (and returns it): every entry valid,
    // legacy values mapped, unknown keys left alone for newer or older builds.
    sanitize(s) {
      if (!s || typeof s !== 'object' || Array.isArray(s)) return Schema.defaults();
      for (const e of Schema) if (stored(e)) s[e.id] = clean(e, s[e.id]);
      return s;
    },

    // Current, always-valid value of an option.
    value(id) {
      const e = Schema.get(id);
      if (!e) return DM.Save ? DM.Save.settings[id] : undefined;
      if (e.transient) return e.get();
      return clean(e, DM.Save ? DM.Save.settings[id] : undefined);
    },
    set(id, v) {
      const e = Schema.get(id);
      if (!e || e.type === 'action') return;
      if (e.transient) {
        if (v !== e.get()) e.set(v);
        return;
      }
      const s = DM.Save.settings;
      s[id] = clean(e, v);
      DM.Save.write();
      if (e.apply) e.apply(s[id]);
    },
    // Keyboard / arrow step: sliders move and stop at the ends, choices wrap, toggles flip.
    step(id, dir) {
      const e = Schema.get(id);
      if (!e) return;
      const v = Schema.value(id);
      if (e.type === 'slider') Schema.set(id, U.clamp(v + dir * e.step, e.min, e.max));
      else if (e.type === 'toggle') Schema.set(id, !v);
      else if (e.type === 'choice') {
        const n = e.options.length;
        const i = Math.max(0, e.options.findIndex((o) => o[0] === v));
        Schema.set(id, e.options[(i + dir + n) % n][0]);
      }
    },
    format(id) {
      const e = Schema.get(id);
      const v = Schema.value(id);
      if (e.type === 'slider') return `${Math.round(((v - e.min) / (e.max - e.min)) * 100)}%`;
      if (e.type === 'toggle') return v ? 'ON' : 'OFF';
      if (e.type === 'choice') {
        const o = e.options.find((o) => o[0] === v);
        return o ? o[1] : String(v);
      }
      return '';
    },
    describe(id) {
      const e = Schema.get(id);
      if (!e || !e.desc) return '';
      return typeof e.desc === 'function' ? e.desc(e.type === 'action' ? null : Schema.value(id)) || '' : e.desc;
    },

    // ---- helpers the rest of the game reads -------------------------------------
    reducedMotion: prefersReducedMotion,
    reducedFlashing() {
      return Schema.value('flashing') === 'reduced';
    },
    // Highest alpha a full-screen flash may reach.
    flashCap() {
      return Schema.reducedFlashing() ? 0.25 : 1;
    },
    textCPS() {
      return TEXT_CPS[Schema.value('textSpeed')] || TEXT_CPS.normal;
    },
    readTime() {
      return READ_TIME[Schema.value('textSpeed')] || 1;
    },
    hintsAll() {
      return Schema.value('hints') !== 'essential';
    },
  });

  // ---- challenge ------------------------------------------------------------------
  const deaths = {};
  const deathKey = (play) => `${play.chapter.id}:${(play.ctx && play.ctx.checkpoint) || 0}`;

  const Challenge = {
    levels: CHALLENGE,
    current() {
      return CHALLENGE[Schema.value('challenge')] || CHALLENGE.normal;
    },
    applyTo(player) {
      if (!player) return;
      const c = Challenge.current();
      player.damageMul = c.dmg;
      player.regenDelayBase = c.regenDelay;
      player.coherenceRegen = c.regen;
      player.godMode = !!Schema.value('invulnerable');
    },
    // Settings changed mid-chapter (from Pause): the running attempt follows at once.
    applyNow() {
      const play = playScene();
      if (play) Challenge.applyTo(play.player);
    },
    // Decoherences since this chapter's current checkpoint was reached (this session).
    deaths(play) {
      return (play && play.chapter && deaths[deathKey(play)]) || 0;
    },
    clear(chapterId) {
      for (const k in deaths) if (k.startsWith(chapterId + ':')) delete deaths[k];
    },
  };

  DM.Events.on('play:begin', (e) => Challenge.applyTo(e && e.scene && e.scene.player));
  DM.Events.on('player:down', (p) => {
    const play = playScene();
    if (!play || play.player !== p) return;
    const k = deathKey(play);
    deaths[k] = (deaths[k] || 0) + 1;
  });

  // Package F's Play.begin announces every attempt with 'play:begin'. A build
  // whose Play.begin does not gets the same event from this wrapper, so the
  // challenge always applies; once begin() emits it, the wrapper stays silent.
  function announceBegin() {
    const Play = DM.Scenes && DM.Scenes.Play;
    if (!Play || Play.prototype.begin.announced) return;
    const begin = Play.prototype.begin;
    Play.prototype.begin = function (chapterId, stage) {
      let heard = false;
      const off = DM.Events.on('play:begin', () => (heard = true));
      const retry = this.begunChapter === chapterId;
      try {
        begin.apply(this, arguments);
      } finally {
        off();
      }
      this.begunChapter = chapterId;
      if (!heard) DM.Events.emit('play:begin', { scene: this, chapter: this.chapter, stage: stage || 0, retry });
    };
    Play.prototype.begin.announced = true;
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', announceBegin);
  else setTimeout(announceBegin, 0);

  // Actions the Settings and HUD use, registered only if input.js does not already
  // bind them (package B adds 'hint' to BINDINGS).
  const B = DM.Input && DM.Input.bindings;
  if (B) {
    if (!B.hint) B.hint = ['KeyH'];
    if (!B.tabPrev) B.tabPrev = ['KeyQ', 'PageUp'];
    if (!B.tabNext) B.tabNext = ['KeyE', 'PageDown', 'Tab'];
  }

  DM.CHALLENGE = CHALLENGE;
  DM.TEXT_CPS = TEXT_CPS;
  DM.Challenge = Challenge;
  DM.SettingsSchema = Schema;
})();
</script>
<script>/* src/core/save.js */
/*
 * Save data in localStorage, versioned so future updates can migrate old saves
 * instead of wiping them. Storage can be unavailable (private windows, blocked
 * site data) — every access is wrapped so the game still runs, just without
 * persistence. Whatever is stored is migrated, then sanitized, so a hand-edited,
 * stale or half-written save can never stop the game from booting.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const KEY = 'dr-manhattan.save';
  const CURRENT = 2;

  const defaults = () => ({
    version: CURRENT,
    reached: 0, // furthest chapter index the player may start
    completed: {}, // chapterId -> stats (+ persisted story flags) of the last completion
    checkpoint: null, // { chapter, stage, carry } — the furthest point reached; powers "Continue"
    checkpoints: {}, // chapterId -> { stage, carry } — latest mid-chapter checkpoint (Chapter Select "Resume")
    seen: { unlocks: {} }, // things shown once per save (power unlock cards)
    totals: { disintegrated: 0, spared: 0, decoherences: 0, memories: 0 },
    settings: DM.SettingsSchema.defaults(), // one entry per option in settings.js
  });

  // migrations[n] upgrades a save object from version n to n + 1.
  const migrations = {
    // v2: per-chapter checkpoints, stats carried with checkpoints, seen unlock cards.
    1(d) {
      const cp = d.checkpoint;
      d.checkpoints = {};
      if (cp && typeof cp === 'object' && cp.chapter && cp.stage > 0) d.checkpoints[cp.chapter] = { stage: cp.stage, carry: null };
      // Powers granted in chapters already finished have had their cards shown.
      const unlocks = {};
      const Ch = DM.Chapters;
      const reached = Math.floor(Number(d.reached)) || 0;
      if (Ch) for (const c of Ch.list.slice(0, reached)) for (const st of c.stages) for (const g of st.grants || []) unlocks[g] = true;
      d.seen = { unlocks };
      d.version = 2;
      return d;
    },
  };

  function merge(base, over) {
    for (const k in over) {
      if (k === '__proto__' || k === 'constructor' || k === 'prototype') continue;
      const v = over[k];
      if (v && typeof v === 'object' && !Array.isArray(v) && base[k] && typeof base[k] === 'object') merge(base[k], v);
      else base[k] = v;
    }
    return base;
  }

  const isObj = (v) => !!v && typeof v === 'object' && !Array.isArray(v);
  const num = (v, def, lo = -Infinity, hi = Infinity) => {
    const n = typeof v === 'number' ? v : typeof v === 'string' && v.trim() !== '' ? Number(v) : NaN;
    return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : def;
  };
  const STAT_KEYS = ['time', 'disintegrated', 'spared', 'memories'];

  // { stats, found, flags } snapshot taken when a checkpoint is entered.
  function cleanCarry(c) {
    if (!isObj(c)) return null;
    const stats = {};
    for (const k of STAT_KEYS) stats[k] = num(isObj(c.stats) ? c.stats[k] : 0, 0, 0);
    const found = Array.isArray(c.found) ? c.found.filter((y) => Number.isFinite(y)) : [];
    return { stats, found, flags: cleanFlags(c.flags) };
  }
  function cleanFlags(f) {
    const out = {};
    if (isObj(f)) for (const k in f) if (['boolean', 'number', 'string'].includes(typeof f[k])) out[k] = f[k];
    return out;
  }
  // A checkpoint is only kept if its chapter still exists and the stage is in range
  // (content updates can remove stages; a stale save must not crash Continue).
  function cleanCheckpoint(chapter, stage, carry) {
    const ch = DM.Chapters && DM.Chapters.get(chapter);
    if (!ch) return null;
    const s = num(stage, NaN);
    if (!Number.isInteger(s) || s < 0 || s >= ch.stages.length) return null;
    return { chapter, stage: s, carry: cleanCarry(carry) };
  }

  // Settings: the schema (src/core/settings.js) owns the rules when it is loaded;
  // otherwise clamp the basics so a bad value can never break boot.
  function cleanSettings(s, def) {
    const out = Object.assign({}, def, isObj(s) ? s : {});
    if (DM.SettingsSchema && DM.SettingsSchema.sanitize) {
      try {
        const r = DM.SettingsSchema.sanitize(out);
        return isObj(r) ? r : out;
      } catch (e) {
        console.warn('Settings schema could not sanitize the saved settings', e);
      }
    }
    out.music = num(out.music, def.music, 0, 1);
    out.sfx = num(out.sfx, def.sfx, 0, 1);
    out.shake = num(out.shake, def.shake, 0, 1);
    out.hints = typeof out.hints === 'boolean' ? out.hints : def.hints !== false;
    if ('focusPause' in out && typeof out.focusPause !== 'boolean') out.focusPause = out.focusPause !== 'false' && !!out.focusPause;
    return out;
  }

  // Coerce a merged save into the shape the game expects. Never throws on bad data.
  function sanitize(d) {
    const def = defaults();
    if (!isObj(d)) return def;
    d.settings = cleanSettings(d.settings, def.settings);
    const nChapters = DM.Chapters ? DM.Chapters.list.length : 99;
    d.reached = Math.floor(num(d.reached, 0, 0, nChapters));

    const completed = {};
    if (isObj(d.completed)) {
      for (const id in d.completed) {
        const c = d.completed[id];
        if (!isObj(c)) continue;
        const rec = {};
        for (const k of STAT_KEYS) rec[k] = num(c[k], 0, 0);
        if (c.flags !== undefined) rec.flags = cleanFlags(c.flags);
        completed[id] = rec;
      }
    }
    d.completed = completed;

    const totals = {};
    for (const k in def.totals) totals[k] = num(isObj(d.totals) ? d.totals[k] : 0, 0, 0);
    d.totals = totals;

    const cp = d.checkpoint;
    d.checkpoint = isObj(cp) ? cleanCheckpoint(cp.chapter, cp.stage, cp.carry) : null;
    const cps = {};
    if (isObj(d.checkpoints)) {
      for (const id in d.checkpoints) {
        const c = d.checkpoints[id];
        const ok = isObj(c) && cleanCheckpoint(id, c.stage, c.carry);
        if (ok && ok.stage > 0) cps[id] = { stage: ok.stage, carry: ok.carry };
      }
    }
    d.checkpoints = cps;

    const unlocks = {};
    if (isObj(d.seen) && isObj(d.seen.unlocks)) for (const k in d.seen.unlocks) if (d.seen.unlocks[k]) unlocks[k] = true;
    d.seen = Object.assign(isObj(d.seen) ? d.seen : {}, { unlocks });
    return d;
  }

  const Save = {
    data: defaults(),
    available: true, // false when the browser refuses storage
    readOnly: false, // true when the stored save comes from a newer version of the game
    defaults,
    sanitize,
    get settings() {
      return this.data.settings;
    },
    load() {
      let raw = null;
      try {
        raw = localStorage.getItem(KEY);
      } catch (e) {
        this.available = false;
        this.data = defaults();
        return this.data;
      }
      if (!raw) {
        this.data = sanitize(defaults());
        return this.data;
      }
      let d;
      try {
        d = JSON.parse(raw);
      } catch (e) {
        d = undefined;
      }
      if (!isObj(d)) {
        // Unreadable: keep a copy for recovery, then start fresh. Storage still works.
        console.warn('Save data was unreadable; a copy was kept under ' + KEY + '.corrupt');
        try {
          localStorage.setItem(KEY + '.corrupt', raw);
        } catch (e) {
          /* best effort */
        }
        this.data = sanitize(defaults());
        return this.data;
      }
      try {
        let v = Math.floor(num(d.version, 1, 1));
        if (v > CURRENT) {
          // A newer build wrote this. Play with it, but never down-convert it on disk.
          this.readOnly = true;
          console.warn(`Save is from a newer version (v${v}); progress will not be written this session.`);
        }
        d.version = v;
        while (d.version < CURRENT && migrations[d.version]) d = migrations[d.version](d);
        const keep = d.version;
        this.data = sanitize(merge(defaults(), d));
        this.data.version = this.readOnly ? keep : CURRENT;
      } catch (e) {
        console.warn('Save data could not be migrated; starting fresh', e);
        try {
          localStorage.setItem(KEY + '.corrupt', raw);
        } catch (err) {
          /* best effort */
        }
        this.data = sanitize(defaults());
      }
      return this.data;
    },
    write() {
      if (this.readOnly) return;
      try {
        localStorage.setItem(KEY, JSON.stringify(this.data));
      } catch (e) {
        this.available = false;
      }
    },
    reset() {
      const s = this.data.settings;
      this.data = defaults();
      this.data.settings = s;
      this.write();
    },
    hasProgress() {
      return !!this.data.checkpoint || this.data.reached > 0;
    },

    // ---- checkpoints --------------------------------------------------------
    // Would (chapterId, stage) be at or beyond the current Continue point?
    isForward(chapterId, stage) {
      const cur = this.data.checkpoint;
      const b = cur && DM.Chapters.get(cur.chapter);
      if (!b) return true;
      const a = DM.Chapters.get(chapterId);
      if (!a) return false;
      return a.index > b.index || (a.index === b.index && stage >= cur.stage);
    },
    // A checkpoint stage was entered. The chapter's own slot always moves to it
    // (Chapter Select resumes there); Continue only ever moves forward, so
    // replaying an earlier chapter never loses the furthest point.
    checkpointAt(chapterId, stage, carry) {
      if (DM.Chapters.get(chapterId)?.bonus) return DM.Bonus.checkpointAt(chapterId, stage, carry);
      const c = carry || null;
      if (stage > 0) this.data.checkpoints[chapterId] = { stage, carry: c };
