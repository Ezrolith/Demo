      const w = 182, gap = 14;
      const x0 = DM.W / 2 - (n * w + (n - 1) * gap) / 2;
      return { x: x0 + i * (w + gap), y: 190, w, h: 330 };
    }
    pick(i) {
      const card = this.cards[i];
      if (!card || card.locked) {
        DM.Audio.play('fail');
        return;
      }
      DM.Audio.play('ui_select');
      Engine.fadeTo(() => Engine.set(new Scenes.Interlude(card.c.id)));
    }
    update(dt) {
      this.t += dt;
      const m = Input.mouse;
      let hover = -1;
      this.cards.forEach((_, i) => {
        const r = this.rect(i);
        if (m.x >= r.x && m.x <= r.x + r.w && m.y >= r.y && m.y <= r.y + r.h) hover = i;
      });
      if (m.moved && hover >= 0 && hover !== this.sel) {
        this.sel = hover;
        DM.Audio.play('ui_move');
      }
      if (Input.clicked()) {
        Input.consume('confirm');
        if (hover >= 0) this.pick(hover);
        else if (m.y > 560) this.back();
        return;
      }
      if (Input.pressed('menuRight') || Input.pressed('menuDown')) {
        this.sel = Math.min(this.cards.length - 1, this.sel + 1);
        DM.Audio.play('ui_move');
      }
      if (Input.pressed('menuLeft') || Input.pressed('menuUp')) {
        this.sel = Math.max(0, this.sel - 1);
        DM.Audio.play('ui_move');
      }
      if (Input.pressed('confirm')) this.pick(this.sel);
      else if (Input.pressed('back')) this.back();
    }
    back() {
      DM.Audio.play('ui_back');
      Engine.pop();
    }
    render(ctx) {
      backdrop(ctx, this.t, { mars: false });
      Gfx.text(ctx, 'CHAPTERS', DM.W / 2, 110, { size: 44, color: '#eefbff', align: 'center', weight: 700, spacing: 10 });
      Gfx.text(ctx, 'The clock moves closer to midnight with every chapter.', DM.W / 2, 146, { size: 16, color: 'rgba(200,225,240,0.6)', align: 'center', font: DM.FONTS.type });
      this.cards.forEach((card, i) => {
        const r = this.rect(i);
        const c = card.c;
        const sel = i === this.sel;
        const lift = sel ? -8 : 0;
        ctx.save();
        ctx.translate(0, lift);
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(r.x + 6, r.y + 8, r.w, r.h);
        ctx.fillStyle = card.locked ? '#1a2230' : c.color;
        ctx.fillRect(r.x, r.y, r.w, 170);
        ctx.fillStyle = card.locked ? '#121822' : '#f1e7cc';
        ctx.fillRect(r.x, r.y + 170, r.w, r.h - 170);
        ctx.strokeStyle = sel ? '#eefbff' : DM.C.ink;
        ctx.lineWidth = sel ? 3 : 2;
        ctx.strokeRect(r.x, r.y, r.w, r.h);
        Gfx.clock(ctx, r.x + r.w / 2, r.y + 78, 46, c.clock, { blood: !card.locked, face: card.locked ? '#2a3240' : DM.C.paper });
        Gfx.text(ctx, c.numeral, r.x + r.w / 2, r.y + 156, { size: 14, color: card.locked ? '#55606e' : DM.C.ink, align: 'center', spacing: 3, weight: 600 });
        if (card.locked) {
          Gfx.text(ctx, 'LOCKED', r.x + r.w / 2, r.y + 230, { size: 18, color: '#55606e', align: 'center', spacing: 4 });
        } else {
          ctx.save();
          Gfx.paragraph(ctx, c.title.toUpperCase(), r.x + r.w / 2, r.y + 188, r.w - 24, 24, { size: 20, font: DM.FONTS.display, color: DM.C.ink, align: 'center', weight: 600 });
          ctx.restore();
          Gfx.text(ctx, c.date, r.x + r.w / 2, r.y + 270, { size: 13, color: '#5a4a3a', align: 'center', font: DM.FONTS.type });
          Gfx.text(ctx, c.place, r.x + r.w / 2, r.y + 289, { size: 12, color: '#5a4a3a', align: 'center', font: DM.FONTS.type });
          const done = Save.data.completed[c.id];
          if (done) Gfx.text(ctx, '✓ ' + U.fmtTime(done.time), r.x + r.w / 2, r.y + 316, { size: 13, color: '#2f6b3a', align: 'center', spacing: 2, weight: 600 });
        }
        ctx.restore();
      });
      Gfx.text(ctx, '←  →  CHOOSE     ENTER / CLICK  PLAY     ESC  BACK', DM.W / 2, 600, { size: 13, color: 'rgba(200,225,240,0.5)', align: 'center', spacing: 3 });
    }
  }

  Scenes.Title = Title;
  Scenes.ChapterSelect = ChapterSelect;
})();
</script>
<script>/* src/game/scenes/interlude.js */
/*
 * Chapter interlude: a comic page. Nine-panel grid, the chapter's colour, the
 * Doomsday Clock, an epigraph, and Jon's narration typed out line by line.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Input = DM.Input;
  const Engine = DM.Engine;
  const F = DM.FONTS;
  const Scenes = (DM.Scenes = DM.Scenes || {});

  class Interlude {
    constructor(chapterId) {
      this.ch = DM.Chapters.get(chapterId);
      this.t = 0;
      this.cursor = 'pointer';
      this.line = 0;
      this.chars = 0;
      this.lines = this.ch.intro || [];
      this.left = false;
    }
    enter() {
      DM.Audio.music.play(this.ch.introMusic || 'title');
    }
    get finished() {
      return this.line >= this.lines.length;
    }
    update(dt) {
      this.t += dt;
      if (this.t < 0.6) return;
      if (!this.finished) {
        const L = this.lines[this.line];
        const prev = Math.floor(this.chars);
        this.chars += dt * 48;
        if (Math.floor(this.chars) > prev && Math.floor(this.chars) % 3 === 0) DM.Audio.play('type');
        if (this.chars >= L.length + 22) {
          this.line++;
          this.chars = 0;
        }
      }
      if (Input.pressed('confirm')) {
        Input.consume('confirm');
        if (!this.finished) {
          this.line = this.lines.length;
          this.chars = 0;
        } else this.begin();
      } else if (Input.pressed('back')) this.begin();
    }
    begin() {
      if (this.left) return;
      this.left = true;
      DM.Audio.play('ui_select');
      Engine.fadeTo(() => Engine.set(new Scenes.Play(), { chapter: this.ch.id, stage: 0 }), { out: 0.7, in: 0.6 });
    }
    render(ctx) {
      const ch = this.ch;
      const t = this.t;
      ctx.fillStyle = '#0b0a09';
      ctx.fillRect(0, 0, DM.W, DM.H);
      const gx = 40, gy = 30, gw = DM.W - 80, gh = DM.H - 60, gut = 12;
      const pw = (gw - gut * 2) / 3, ph = (gh - gut * 2) / 3;
      for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
        const k = U.clamp((t - (r * 3 + c) * 0.05) * 3, 0, 1);
        ctx.globalAlpha = k;
        ctx.fillStyle = U.mix(ch.color, '#000000', 0.15 + ((r + c) % 3) * 0.08);
        ctx.fillRect(gx + c * (pw + gut), gy + r * (ph + gut), pw, ph);
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(gx, gy, pw * 2 + gut, gh);

      Gfx.clock(ctx, gx + pw * 2 + gut * 2 + pw / 2, gy + ph * 1.5 + gut, 118, ch.clock, { blood: true });
      Gfx.text(ctx, `${ch.clock} MINUTES TO MIDNIGHT`, gx + pw * 2 + gut * 2 + pw / 2, gy + ph * 2.5 + gut * 2 + 10, { size: 15, color: DM.C.paper, align: 'center', spacing: 4 });

      const x = gx + 44;
      Gfx.text(ctx, ch.numeral, x, 104, { size: 20, color: DM.C.paper, spacing: 8, weight: 600 });
      Gfx.text(ctx, ch.title.toUpperCase(), x, 166, { size: 54, color: '#ffffff', weight: 700, spacing: 4, shadow: 'rgba(0,0,0,0.5)', shadowOff: 3 });
      Gfx.text(ctx, `${ch.date.toUpperCase()}  ·  ${ch.place.toUpperCase()}`, x, 200, { size: 16, color: DM.C.paper, spacing: 4 });

      let y = 250;
      for (let i = 0; i < this.lines.length; i++) {
        if (i > this.line) break;
        const chars = i < this.line ? Infinity : this.chars;
        const h = Gfx.paragraph(ctx, this.lines[i], x, y, pw * 2 - 70, 27, { size: 19, font: F.type, color: '#f6efdf', chars });
        y += h + 16;
      }

      if (ch.epigraph) {
        const ey = gy + gh - 96;
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(x - 14, ey - 12, pw * 2 - 50, 78);
        Gfx.paragraph(ctx, `“${ch.epigraph.text}”`, x, ey, pw * 2 - 80, 22, { size: 16, font: F.type, color: DM.C.paper });
        Gfx.text(ctx, '— ' + ch.epigraph.by, x + pw * 2 - 80, ey + 56, { size: 14, color: DM.C.paper, align: 'right', font: F.type });
      }

      if (this.finished && Math.sin(t * 4) > -0.4) Gfx.text(ctx, 'CLICK OR PRESS SPACE TO BEGIN', DM.W - 60, DM.H - 46, { size: 14, color: '#ffffff', align: 'right', spacing: 4 });
      else if (!this.finished) Gfx.text(ctx, 'SPACE TO SKIP', DM.W - 60, DM.H - 46, { size: 12, color: 'rgba(255,255,255,0.45)', align: 'right', spacing: 4 });
      Gfx.grain(ctx, 0.06);
    }
  }

  Scenes.Interlude = Interlude;
})();
</script>
<script>/* src/game/scenes/play.js */
/*
 * Play scene: runs one chapter. Owns the world, player, HUD, dialogue and the
 * chapter script context. Handles pause, failure (decoherence), retry from
 * checkpoint, stats and chapter completion.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Input = DM.Input;
  const Engine = DM.Engine;
  const Save = DM.Save;
  const Scenes = (DM.Scenes = DM.Scenes || {});

  class Play {
    constructor() {
      this.debug = false;
    }

    // A targeting reticle only once Jon has powers to aim.
    get cursor() {
      return this.player && this.player.form === 'human' ? 'pointer' : 'reticle';
    }

    enter(params) {
      this.offs = [
        DM.Events.on('enemy:down', (e) => {
          if (!e.human || !this.ctx) return;
          if (e.lethal) this.ctx.stats.disintegrated++;
          else this.ctx.stats.spared++;
        }),
        DM.Events.on('memory:found', (m) => {
          if (!this.ctx) return;
          this.ctx.stats.memories++;
          this.hud.caption(`${m.year}. ${m.text}`, { dur: 6 + m.text.length * 0.03 });
        }),
      ];
      this.begin(params.chapter, params.stage || 0);
    }

    exit() {
      for (const off of this.offs || []) off();
      if (this.ctx) this.ctx.dispose();
      DM.Audio.stopHums();
      DM.Audio.setMusicFilter(18000);
    }

    begin(chapterId, stage) {
      if (this.ctx) this.ctx.dispose();
      const ch = DM.Chapters.get(chapterId);
      this.chapter = ch;
      this.hud = new DM.HUD(this);
      this.dialog = new DM.Dialog();
      this.player = new DM.Player(0, 0);
      this.player.setForm(ch.form || 'manhattan');
      for (const id of DM.Chapters.powersBefore(ch.index)) this.player.unlock(id);
      this.world = new DM.World({ w: DM.W, h: DM.H });
      this.failed = false;
      this.failT = 0;
      this.ctx = new DM.ChapterContext(this, ch);
      this.ctx.start(stage);
      this.ctx.step(0);
      DM.Audio.stopHums();
      DM.Audio.setMusicFilter(18000);
      DM.Audio.music.play(ch.music);
      Save.data.checkpoint = { chapter: ch.id, stage: this.ctx.checkpoint || stage };
      Save.write();
    }

    setWorld(world) {
      const p = this.player;
      for (const st of Object.values(p.powers)) {
        st.target = null;
        st.hover = null;
        st.active = false;
        st.pending = [];
      }
      this.world = world;
      world.player = p;
      p.world = world;
      p.dead = false;
      const s = world.spawn || { x: world.w / 2, y: world.h / 2 };
      p.x = s.x;
      p.y = s.y;
      p.vx = p.vy = 0;
      if (s.facing != null) p.facing = s.facing;
      world.add(p);
      world.camera.snap(p.x, p.y);
      DM.Audio.stopHums();
    }

    update(dt) {
      if (Input.pressed('pause') && !this.failed && !Engine.fading) {
        Input.consume('pause');
        Input.consume('back');
        Engine.push(new Scenes.Pause(this));
        return;
      }
      if (Input.pressed('mute')) this.hud.toast(DM.Audio.toggleMute() ? 'SOUND OFF' : 'SOUND ON', '#bff1ff');
      if (DM.DEV) {
        if (Input.pressed('skip')) this.ctx.skipStage();
        if (Input.pressed('debug')) this.debug = !this.debug;
      }

      this.dialog.update(dt);
      const p = this.player;
      p.locked = this.ctx.locked || this.dialog.active;
      const w = this.world;
      w.mouse = w.camera.toWorld(Input.mouse.x, Input.mouse.y);
      w.ceasefire = p.locked; // cutscenes and dialogue are safe
      if (p.locked || p.form === 'human') {
        w.slowmo = false;
        w.timesight = false;
      }
      w.update(dt);
      this.ctx.step(dt);
      if (this.world !== w) return; // map changed this frame

      const cam = w.camera;
      const tgt = this.ctx.camTarget;
      if (tgt) cam.follow(tgt.x, tgt.y, dt, 3);
      else {
        const look = p.form === 'manhattan' && !p.locked ? 0.18 : 0;
        cam.follow(p.x + (w.mouse.x - p.x) * look, p.y + (w.mouse.y - p.y) * look, dt, 6);
      }
      this.hud.update(dt);

      if (p.down && !this.failed) {
        this.failed = true;
        this.failT = 1.8;
        Save.data.totals.decoherences++;
        Save.write();
        w.particles.burst(p.x, p.y, 120, { color: ['#7fe3ff', '#5fd4ff', '#ffffff'], speed: [40, 360], life: [0.6, 1.6], size: [1.5, 3.5], drag: 1.5 });
        p.hidden = true;
        DM.Audio.play('disintegrate');
      }
      if (this.failed) {
        this.failT -= dt;
        if (this.failT <= 0 && Engine.top() === this) Engine.push(new Scenes.GameOver(this));
      }
    }

    retry() {
      const stage = this.ctx.checkpoint || 0;
      Engine.fadeTo(() => {
        while (Engine.top() !== this && Engine.stack.length > 1) Engine.pop();
        this.begin(this.chapter.id, stage);
      });
    }

    completeChapter() {
      const ch = this.chapter;
      const st = this.ctx.stats;
      const next = DM.Chapters.next(ch.id);
      const d = Save.data;
      d.completed[ch.id] = { time: st.time, disintegrated: st.disintegrated, spared: st.spared, memories: st.memories };
      d.reached = Math.max(d.reached, ch.index + 1);
      d.totals.disintegrated += st.disintegrated;
      d.totals.spared += st.spared;
      d.totals.memories += st.memories;
      d.checkpoint = next ? { chapter: next.id, stage: 0 } : null;
      Save.write();
      Engine.push(new Scenes.ChapterComplete(this, st, next));
    }

    render(ctx) {
      const w = this.world;
      w.render(ctx);
      if (w.tint) {
        ctx.fillStyle = w.tint;
        ctx.fillRect(0, 0, DM.W, DM.H);
      }
      this.renderTimesight(ctx);
      const p = this.player;
      if (p.form === 'manhattan' && p.coherence < 35 && !p.down) {
        ctx.save();
        ctx.globalAlpha = (0.35 - p.coherence / 100) * 2 * (0.7 + Math.sin(this.hud.t * 6) * 0.3);
        ctx.globalCompositeOperation = 'lighter';
        Gfx.vignette(ctx, 1);
        ctx.restore();
      }
      Gfx.vignette(ctx, 0.55);
      this.hud.render(ctx);
      this.dialog.render(ctx);
      Gfx.grain(ctx, 0.035);
      if (this.debug) this.renderDebug(ctx);
    }

    renderTimesight(ctx) {
      const w = this.world;
      const k = U.clamp((1 - w.timeScale) / 0.72, 0, 1);
      if (k < 0.02) return;
      const p = this.player;
      ctx.save();
      ctx.globalAlpha = k;
      ctx.fillStyle = 'rgba(242,196,24,0.07)';
      ctx.fillRect(0, 0, DM.W, DM.H);
      const s = w.camera.toScreen(p.x, p.y);
      const R = 150 * w.camera.zoom * p.scale;
      ctx.strokeStyle = 'rgba(242,196,24,0.5)';
      ctx.lineWidth = 1.5;
      Gfx.circle(ctx, s.x, s.y, R);
      ctx.stroke();
      for (let i = 0; i < 60; i++) {
        const a = (i / 60) * Math.PI * 2;
        const l = i % 5 ? 5 : 12;
        Gfx.line(ctx, s.x + Math.cos(a) * R, s.y + Math.sin(a) * R, s.x + Math.cos(a) * (R - l), s.y + Math.sin(a) * (R - l));
      }
      const ht = this.hud.t;
      ctx.lineWidth = 2;
      Gfx.line(ctx, s.x, s.y, s.x + Math.cos(ht * 0.8 - 1.57) * R * 0.85, s.y + Math.sin(ht * 0.8 - 1.57) * R * 0.85);
      Gfx.line(ctx, s.x, s.y, s.x + Math.cos(-ht * 0.1 - 1.57) * R * 0.5, s.y + Math.sin(-ht * 0.1 - 1.57) * R * 0.5);
      ctx.restore();
      Gfx.text(ctx, 'TEMPORAL SIGHT', DM.W / 2, 150, { size: 13, color: 'rgba(242,196,24,0.8)', align: 'center', spacing: 6, alpha: k });
    }

    renderDebug(ctx) {
      const w = this.world, p = this.player;
      const lines = [
        `fps ${Math.round(Engine.fps)}  entities ${w.entities.length}  particles ${w.particles.list.length}`,
        `chapter ${this.chapter.id}  stage ${this.ctx.stageIndex} (${this.chapter.stages[this.ctx.stageIndex] && this.chapter.stages[this.ctx.stageIndex].id})  checkpoint ${this.ctx.checkpoint}`,
        `player ${Math.round(p.x)},${Math.round(p.y)}  form ${p.form}  energy ${Math.round(p.energy)}  coherence ${Math.round(p.coherence)}`,
        `] skip stage   \` toggle debug`,
      ];
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(10, DM.H - 100, 560, 90);
      lines.forEach((l, i) => Gfx.text(ctx, l, 20, DM.H - 78 + i * 20, { size: 13, color: '#9fe8ff', font: DM.FONTS.type }));
    }
  }

  Scenes.Play = Play;
})();
</script>
<script>/* src/game/scenes/overlays.js */
/* Overlay scenes: pause, settings, controls, power unlock card, game over, chapter complete. */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Input = DM.Input;
  const Engine = DM.Engine;
  const Save = DM.Save;
  const F = DM.FONTS;
  const Scenes = (DM.Scenes = DM.Scenes || {});

  function dim(ctx, a = 0.7) {
    ctx.fillStyle = `rgba(2,4,9,${a})`;
    ctx.fillRect(0, 0, DM.W, DM.H);
  }

  function toTitle() {
    Engine.fadeTo(() => Engine.set(new Scenes.Title()));
  }

  // ---- Pause ------------------------------------------------------------------
  class Pause {
    constructor(play) {
      this.play = play;
      this.opaque = false;
      this.cursor = 'pointer';
      this.t = 0;
    }
    enter() {
      DM.Audio.stopHums();
      DM.Audio.setMusicFilter(1200);
      this.menu = new DM.UI.Menu([
        { label: 'RESUME', action: () => this.close() },
        { label: 'RESTART FROM CHECKPOINT', action: () => this.play.retry() },
        { label: 'SETTINGS', action: () => Engine.push(new Settings()) },
        { label: 'CONTROLS', action: () => Engine.push(new Controls()) },
        { label: 'QUIT TO TITLE', action: () => toTitle() },
      ], { x: DM.W / 2, y: 300, w: 420, align: 'center', itemH: 50, size: 24, onBack: () => this.close() });
    }
    close() {
      DM.Audio.setMusicFilter(this.play.world.timesight ? 650 : 18000);
      Engine.pop();
    }
    update(dt) {
      this.t += dt;
      if (Input.pressed('pause') && !Input.pressed('back')) return this.close();
      this.menu.update(dt);
    }
    render(ctx) {
      dim(ctx, 0.72);
      Gfx.text(ctx, 'PAUSED', DM.W / 2, 230, { size: 56, color: '#eefbff', align: 'center', weight: 700, spacing: 12 });
      const ch = this.play.chapter;
      Gfx.text(ctx, `${ch.numeral} · ${ch.title.toUpperCase()}`, DM.W / 2, 262, { size: 15, color: DM.C.blue, align: 'center', spacing: 4 });
      this.menu.render(ctx);
    }
  }

  // ---- Settings -------------------------------------------------------------------
  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function toggleFullscreen() {
    try {
      if (isFullscreen()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else {
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req) {
          const r = req.call(el);
          if (r && r.catch) r.catch(() => {});
        }
      }
    } catch (e) {
      /* fullscreen is optional */
    }
  }

  class Settings {
    constructor() {
      this.opaque = false;
      this.cursor = 'pointer';
      this.resetArmed = false;
    }
    enter() {
      const s = Save.settings;
      const pct = (v) => `${Math.round(v * 100)}%`;
      const vol = (key) => (dir) => {
        s[key] = U.clamp(Math.round((s[key] + dir * 0.1) * 10) / 10, 0, 1);
        DM.Audio.setVolumes({ music: s.music, sfx: s.sfx });
        Save.write();
        if (key === 'sfx') DM.Audio.play('ui_select');
      };
      this.menu = new DM.UI.Menu([
        { label: 'MUSIC', value: () => pct(s.music), adjust: vol('music') },
        { label: 'SOUND EFFECTS', value: () => pct(s.sfx), adjust: vol('sfx') },
        { label: 'SCREEN SHAKE', value: () => (s.shake ? 'ON' : 'OFF'), adjust: () => { s.shake = s.shake ? 0 : 1; Save.write(); } },
        { label: 'HINTS', value: () => (s.hints !== false ? 'ON' : 'OFF'), adjust: () => { s.hints = s.hints === false; Save.write(); } },
        { label: 'FULLSCREEN', value: () => (isFullscreen() ? 'ON' : 'OFF'), adjust: () => toggleFullscreen() },
        { label: 'RESET PROGRESS', value: () => (this.resetArmed ? 'PRESS AGAIN' : ''), action: () => this.reset() },
        { label: 'BACK', action: () => Engine.pop() },
      ], { x: DM.W / 2 - 280, y: 220, w: 560, itemH: 50, size: 22, onBack: () => Engine.pop() });
    }
    reset() {
      if (!this.resetArmed) {
        this.resetArmed = true;
        return;
      }
      Save.reset();
      this.resetArmed = false;
      this.done = 'Progress reset.';
    }
    update(dt) {
      if (this.menu.items[this.menu.sel].label !== 'RESET PROGRESS') this.resetArmed = false;
      this.menu.update(dt);
    }
    render(ctx) {
      dim(ctx, 0.85);
      Gfx.text(ctx, 'SETTINGS', DM.W / 2, 170, { size: 44, color: '#eefbff', align: 'center', weight: 700, spacing: 10 });
      this.menu.render(ctx);
      const note = this.done || (Save.available ? 'Settings and progress are saved in this browser.' : 'This browser is blocking storage, so progress will not be saved.');
      Gfx.text(ctx, note, DM.W / 2, 610, { size: 14, color: 'rgba(200,225,240,0.55)', align: 'center', font: F.type });
    }
  }

  // ---- Controls -----------------------------------------------------------------
  const CONTROL_ROWS = [
    ['MOVE', 'W A S D  /  ARROW KEYS'],
    ['AIM', 'MOUSE'],
    ['INTERACT / TALK', 'E'],
    ['TELEKINESIS', 'HOLD LEFT CLICK, MOVE, RELEASE TO THROW'],
    ['DISINTEGRATE', 'Q  /  RIGHT CLICK  (CTRL+CLICK ON MAC)'],
    ['TELEPORT', 'SPACE'],
    ['DUPLICATE', 'R'],
    ['TEMPORAL SIGHT', 'HOLD F  /  SHIFT'],
    ['EXPAND', 'G'],
    ['ADVANCE DIALOGUE', 'SPACE / CLICK / E'],
    ['PAUSE', 'ESC / P'],
    ['MUTE', 'M'],
  ];

  class Controls {
    constructor() {
      this.opaque = false;
      this.cursor = 'pointer';
    }
    update() {
      if (Input.pressed('back') || Input.pressed('confirm') || Input.pressed('pause')) {
        Input.consume('confirm');
        Input.consume('back');
        DM.Audio.play('ui_back');
        Engine.pop();
      }
    }
    render(ctx) {
      dim(ctx, 0.88);
      Gfx.text(ctx, 'CONTROLS', DM.W / 2, 110, { size: 44, color: '#eefbff', align: 'center', weight: 700, spacing: 10 });
      Gfx.text(ctx, 'Powers unlock as Jon changes. You start as a man.', DM.W / 2, 144, { size: 15, color: 'rgba(200,225,240,0.6)', align: 'center', font: F.type });
      CONTROL_ROWS.forEach(([a, b], i) => {
        const y = 196 + i * 34;
        Gfx.text(ctx, a, DM.W / 2 - 20, y, { size: 17, color: DM.C.blue, align: 'right', spacing: 2 });
        Gfx.text(ctx, b, DM.W / 2 + 20, y, { size: 17, color: '#ffffff', spacing: 1 });
      });
      Gfx.text(ctx, 'ESC / CLICK TO GO BACK', DM.W / 2, 640, { size: 13, color: 'rgba(200,225,240,0.5)', align: 'center', spacing: 3 });
    }
  }

  // ---- Power unlock card ---------------------------------------------------------
  class PowerUnlock {
    constructor(id, onClose) {
      this.def = DM.Powers.get(id);
      this.onClose = onClose;
      this.opaque = false;
      this.cursor = 'pointer';
      this.t = 0;
    }
    enter() {
      DM.Audio.play('unlock');
      DM.Audio.stopHums();
    }
    update(dt) {
      this.t += dt;
      if (this.t > 0.9 && (Input.pressed('confirm') || Input.pressed('interact'))) {
        Input.consume('confirm');
        Input.consume('interact');
        Input.clearAll();
        DM.Audio.play('ui_select');
        Engine.pop();
        if (this.onClose) this.onClose();
      }
    }
    render(ctx) {
      const d = this.def;
      const k = U.ease.outCubic(Math.min(1, this.t * 2));
      dim(ctx, 0.78 * k);
      const cx = DM.W / 2, cy = 300;
      Gfx.glow(ctx, cx, cy - 40, 260 * k, d.color, 0.35);
      ctx.save();
      ctx.translate(cx, cy - 40);
      ctx.scale(0.6 + k * 0.4, 0.6 + k * 0.4);
      Gfx.icon(ctx, d.id, 0, 0, 120, d.color, this.t);
      ctx.restore();
      Gfx.text(ctx, 'NEW POWER', cx, cy + 66, { size: 14, color: DM.C.yellow, align: 'center', spacing: 8, alpha: k });
      Gfx.text(ctx, d.name.toUpperCase(), cx, cy + 122, { size: 58, color: '#ffffff', align: 'center', weight: 700, spacing: 10, alpha: k });
      ctx.save();
      ctx.globalAlpha = k;
      Gfx.paragraph(ctx, d.desc, cx, cy + 146, 620, 26, { size: 19, font: F.type, color: '#dceeff', align: 'center' });
      const tipY = cy + 214;
      const tw = 700;
      Gfx.panel(ctx, cx - tw / 2, tipY - 8, tw, 82, { accent: d.color });
      Gfx.paragraph(ctx, d.tip, cx, tipY + 6, tw - 50, 25, { size: 19, font: F.display, color: '#ffffff', align: 'center' });
      ctx.restore();
      if (this.t > 0.9 && Math.sin(this.t * 4) > -0.4) Gfx.text(ctx, 'PRESS E / SPACE / CLICK', cx, DM.H - 40, { size: 13, color: 'rgba(255,255,255,0.7)', align: 'center', spacing: 4 });
    }
  }

  // ---- Game over (decoherence) ------------------------------------------------------
  class GameOver {
    constructor(play) {
      this.play = play;
      this.opaque = false;
      this.cursor = 'pointer';
      this.t = 0;
    }
    enter() {
      DM.Audio.stopHums();
      DM.Audio.setMusicFilter(500);
      this.menu = new DM.UI.Menu([
        { label: 'REASSEMBLE', action: () => this.play.retry() },
        { label: 'QUIT TO TITLE', action: () => toTitle() },
      ], { x: DM.W / 2, y: 400, w: 380, align: 'center', itemH: 52, size: 26 });
    }
    update(dt) {
      this.t += dt;
      if (this.t > 0.6) this.menu.update(dt);
    }
    render(ctx) {
      dim(ctx, Math.min(0.8, this.t));
      Gfx.text(ctx, 'DECOHERENCE', DM.W / 2, 270, { size: 64, color: '#bff1ff', align: 'center', weight: 700, spacing: 14 });
      Gfx.text(ctx, 'Your intrinsic field came apart. You have put yourself back together before.', DM.W / 2, 316, { size: 18, color: 'rgba(220,238,255,0.75)', align: 'center', font: F.type });
      if (this.t > 0.6) this.menu.render(ctx);
    }
  }

  // ---- Chapter complete ------------------------------------------------------------------
  class ChapterComplete {
    constructor(play, stats, next) {
      this.play = play;
      this.stats = Object.assign({}, stats);
      this.next = next;
      this.opaque = false;
      this.cursor = 'pointer';
      this.t = 0;
      this.leaving = false;
    }
    enter() {
      DM.Audio.stopHums();
      DM.Audio.play('success');
    }
    update(dt) {
      this.t += dt;
      if (this.t > 1 && !this.leaving && (Input.pressed('confirm') || Input.pressed('interact'))) {
        this.leaving = true;
        DM.Audio.play('ui_select');
        const next = this.next;
        Engine.fadeTo(() => Engine.set(next ? new Scenes.Interlude(next.id) : new Scenes.Ending()), { out: 0.8, in: 0.6 });
      }
    }
    render(ctx) {
      const ch = this.play.chapter;
      const k = U.ease.outCubic(Math.min(1, this.t * 1.5));
      dim(ctx, 0.8 * k);
      ctx.save();
      ctx.globalAlpha = k;
      Gfx.clock(ctx, DM.W / 2, 190, 58, ch.clock, { blood: true });
      Gfx.text(ctx, `${ch.numeral} COMPLETE`, DM.W / 2, 300, { size: 16, color: DM.C.yellow, align: 'center', spacing: 8 });
      Gfx.text(ctx, ch.title.toUpperCase(), DM.W / 2, 352, { size: 48, color: '#ffffff', align: 'center', weight: 700, spacing: 6 });
      const s = this.stats;
      const rows = [['TIME', U.fmtTime(s.time)]];
      if (s.disintegrated || s.spared) {
        rows.push(['DISINTEGRATED', String(s.disintegrated)]);
        rows.push(['SPARED', String(s.spared)]);
      }
      if (ch.id === 'mars') rows.push(['MEMORIES', `${s.memories} / 6`]);
      rows.forEach(([a, b], i) => {
        const y = 410 + i * 32;
        Gfx.text(ctx, a, DM.W / 2 - 16, y, { size: 16, color: 'rgba(200,225,240,0.7)', align: 'right', spacing: 3 });
        Gfx.text(ctx, b, DM.W / 2 + 16, y, { size: 18, color: '#ffffff', spacing: 1 });
      });
      ctx.restore();
      if (this.t > 1 && Math.sin(this.t * 4) > -0.4) Gfx.text(ctx, this.next ? 'PRESS SPACE / CLICK TO CONTINUE' : 'PRESS SPACE / CLICK', DM.W / 2, DM.H - 60, { size: 14, color: 'rgba(255,255,255,0.8)', align: 'center', spacing: 4 });
    }
  }

  Scenes.Pause = Pause;
  Scenes.Settings = Settings;
  Scenes.Controls = Controls;
  Scenes.PowerUnlock = PowerUnlock;
  Scenes.GameOver = GameOver;
  Scenes.ChapterComplete = ChapterComplete;
})();
</script>
<script>/* src/game/scenes/minigames.js */
/*
 * Minigames run as overlay scenes. Chapter scripts start them with
 * `yield ctx.minigame(DM.Scenes.WatchRepair)`; they call done(result) when finished.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Input = DM.Input;
  const Engine = DM.Engine;
  const F = DM.FONTS;
  const Scenes = (DM.Scenes = DM.Scenes || {});

  function gear(ctx, x, y, r, teeth, rot, fill, stroke) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.beginPath();
    for (let i = 0; i < teeth * 2; i++) {
      const a = (i / (teeth * 2)) * Math.PI * 2;
      const rr = i % 2 ? r : r * 0.82;
      const a2 = a + Math.PI / (teeth * 2);
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      ctx.lineTo(Math.cos(a2) * rr, Math.sin(a2) * rr);
    }
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    if (stroke) {
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    Gfx.circle(ctx, 0, 0, r * 0.25);
    ctx.fill();
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      ctx.fillRect(Math.cos(a) * r * 0.5 - 2, Math.sin(a) * r * 0.5 - 2, 4, 4);
    }
    ctx.restore();
  }

  // Seat four gears in Janey's watch by pressing at the right moment.
  class WatchRepair {
    constructor(opts, done) {
      this.done = done;
      this.opaque = false;
      this.cursor = 'pointer';
      this.t = 0;
      this.step = 0;
      this.angle = -Math.PI / 2;
      this.speed = 2.0;
      this.dir = 1;
      this.zone = { a: U.rand(0, Math.PI * 2), w: 0.7 };
      this.missT = 0;
      this.hitT = 0;
      this.finished = false;
      this.endT = 0;
      this.spin = 0;
      this.gears = [
        { x: -50, y: -40, r: 46, teeth: 14 },
        { x: 45, y: -10, r: 34, teeth: 11 },
        { x: -10, y: 60, r: 30, teeth: 10 },
        { x: 70, y: 70, r: 22, teeth: 8 },
      ];
    }
    update(dt) {
      this.t += dt;
      this.missT = Math.max(0, this.missT - dt);
      this.hitT = Math.max(0, this.hitT - dt);
      if (this.finished) {
        this.spin += dt * 1.5;
        this.endT -= dt;
        if (Math.floor(this.t * 2) !== Math.floor((this.t - dt) * 2)) DM.Audio.play('tick', { alt: Math.floor(this.t * 2) % 2 });
        if (this.endT <= 0) {
          Engine.pop();
          this.done(true);
        }
        return;
      }
      this.angle += this.speed * this.dir * dt;
      if (this.t > 0.4 && (Input.pressed('confirm') || Input.pressed('interact'))) {
        Input.consume('confirm');
        Input.consume('interact');
        const d = Math.abs(U.wrapAngle(this.angle - this.zone.a));
        if (d < this.zone.w / 2) {
          this.step++;
          this.hitT = 0.35;
          DM.Audio.play('gear');
          if (this.step >= this.gears.length) {
            this.finished = true;
            this.endT = 2.4;
            DM.Audio.play('success');
          } else {
            this.speed *= 1.22;
            this.dir *= -1;
            this.zone.w *= 0.86;
            this.zone.a = U.rand(0, Math.PI * 2);
          }
        } else {
          this.missT = 0.4;
          DM.Audio.play('miss');
        }
      }
    }
    render(ctx) {
      ctx.fillStyle = 'rgba(8,6,4,0.86)';
      ctx.fillRect(0, 0, DM.W, DM.H);
      const cx = DM.W / 2, cy = 370;
      Gfx.text(ctx, "REPAIRING JANEY'S WATCH", cx, 92, { size: 30, color: DM.C.paper, align: 'center', weight: 600, spacing: 6 });
      Gfx.text(ctx, this.finished ? 'It runs.' : 'Press SPACE or CLICK when the pivot lines up with the gold jewel setting.', cx, 124, { size: 17, color: 'rgba(242,231,204,0.75)', align: 'center', font: F.type });

      const shake = this.missT > 0 ? Math.sin(this.t * 80) * 4 : 0;
      ctx.save();
      ctx.translate(cx + shake, cy);
      ctx.fillStyle = '#b8902e';
      Gfx.circle(ctx, 0, 0, 190);
      ctx.fill();
      ctx.fillStyle = '#e2c46a';
      Gfx.circle(ctx, 0, 0, 178);
      ctx.fill();
      ctx.fillStyle = '#2a2622';
      Gfx.circle(ctx, 0, 0, 160);
      ctx.fill();

      this.gears.forEach((g, i) => {
        const seated = i < this.step;
        if (seated) {
          const rot = (this.finished ? this.spin : this.t * 0.6) * (i % 2 ? -1 : 1) * (46 / g.r);
          gear(ctx, g.x, g.y, g.r, g.teeth, rot, i % 2 ? '#c9a24a' : '#d8b860', '#7a5a1a');
        } else {
          ctx.save();
          ctx.strokeStyle = i === this.step ? 'rgba(242,196,24,0.8)' : 'rgba(242,231,204,0.2)';
          ctx.setLineDash([4, 4]);
          ctx.lineWidth = 1.5;
          Gfx.circle(ctx, g.x, g.y, g.r);
          ctx.stroke();
          ctx.restore();
        }
      });
      ctx.fillStyle = '#c4302b';
      for (const [x, y] of [[-50, -40], [45, -10], [-10, 60], [70, 70]]) {
        Gfx.circle(ctx, x, y, 3.5);
        ctx.fill();
      }

      if (this.finished) {
        const k = Math.min(1, (2.4 - this.endT) * 1.5);
        ctx.globalAlpha = k;
        ctx.fillStyle = '#f6efdf';
        Gfx.circle(ctx, 0, 0, 160);
        ctx.fill();
        ctx.strokeStyle = DM.C.ink;
        ctx.lineWidth = 3;
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2;
          Gfx.line(ctx, Math.cos(a) * 130, Math.sin(a) * 130, Math.cos(a) * 148, Math.sin(a) * 148);
        }
        const sec = -Math.PI / 2 + this.spin * 2;
        ctx.lineWidth = 6;
        Gfx.line(ctx, 0, 0, Math.cos(-2.2) * 70, Math.sin(-2.2) * 70);
        ctx.lineWidth = 4;
        Gfx.line(ctx, 0, 0, Math.cos(-0.9) * 110, Math.sin(-0.9) * 110);
        ctx.strokeStyle = DM.C.blood;
        ctx.lineWidth = 1.5;
        Gfx.line(ctx, 0, 0, Math.cos(sec) * 130, Math.sin(sec) * 130);
        ctx.globalAlpha = 1;
      }
      ctx.restore();

      if (!this.finished) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.strokeStyle = 'rgba(242,231,204,0.18)';
        ctx.lineWidth = 10;
        Gfx.circle(ctx, 0, 0, 215);
        ctx.stroke();
        ctx.strokeStyle = this.hitT > 0 ? '#ffffff' : DM.C.yellow;
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.arc(0, 0, 215, this.zone.a - this.zone.w / 2, this.zone.a + this.zone.w / 2);
        ctx.stroke();
        const a = this.angle;
        ctx.fillStyle = this.missT > 0 ? DM.C.red : '#ffffff';
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 200, Math.sin(a) * 200);
        ctx.lineTo(Math.cos(a - 0.06) * 236, Math.sin(a - 0.06) * 236);
        ctx.lineTo(Math.cos(a + 0.06) * 236, Math.sin(a + 0.06) * 236);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      for (let i = 0; i < this.gears.length; i++) {
        ctx.fillStyle = i < this.step ? DM.C.yellow : 'rgba(242,231,204,0.2)';
        Gfx.circle(ctx, cx - 45 + i * 30, DM.H - 60, 7);
        ctx.fill();
      }
    }
  }

  Scenes.WatchRepair = WatchRepair;
})();
</script>
<script>/* src/game/scenes/ending.js */
/*
 * Ending: the clock reaches midnight. The closing narration changes with how
 * Jon treated people along the way (lives spared vs. disintegrated) — the
 * first hook for branching endings.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Input = DM.Input;
  const Engine = DM.Engine;
  const F = DM.FONTS;
  const Scenes = (DM.Scenes = DM.Scenes || {});

  function tally() {
    let killed = 0, spared = 0, memories = 0, time = 0;
    for (const id in DM.Save.data.completed) {
      const c = DM.Save.data.completed[id];
      killed += c.disintegrated || 0;
      spared += c.spared || 0;
      memories += c.memories || 0;
      time += c.time || 0;
    }
    return { killed, spared, memories, time };
  }

  class Ending {
    constructor() {
      this.t = 0;
      this.cursor = 'pointer';
      this.page = 0;
      this.pageT = 0;
      const s = (this.stats = tally());
      const detached = s.killed > Math.max(4, s.spared * 1.5);
      this.pages = [
        'Midnight. The clock in my mind stops, and does not start again.',
        'Adrian asks me whether he did the right thing. Whether it all worked out, in the end.',
        'I tell him there is no end. There is only the next moment, and the one after it, and all of them at once.',
        detached
          ? `${s.killed} people came apart at my touch. I remember each of them; I remember them still being alive. I am leaving this galaxy for one less complicated.`
          : `I chose to set ${s.spared} people down gently, when it would have been easier not to. Perhaps I am not finished with human beings. Perhaps I will make some of my own.`,
        'Somewhere, a watch is ticking. I can see every moment it will ever measure.',
      ];
    }
    enter() {
      DM.Audio.music.play('ending');
    }
    get onCredits() {
      return this.page >= this.pages.length;
    }
    update(dt) {
      this.t += dt;
      this.pageT += dt;
      const auto = !this.onCredits && this.pageT > 4.2 + this.pages[this.page].length * 0.045;
      if (auto || (this.pageT > 0.6 && Input.pressed('confirm'))) {
        Input.consume('confirm');
        if (this.onCredits) {
          if (this.pageT > 1.5) Engine.fadeTo(() => Engine.set(new Scenes.Title()), { out: 1.2, in: 0.8 });
          return;
        }
        this.page++;
        this.pageT = 0;
        DM.Audio.play('tick');
      }
    }
    render(ctx) {
      ctx.fillStyle = '#05070c';
      ctx.fillRect(0, 0, DM.W, DM.H);
      const k = Math.min(1, this.page / this.pages.length);
      const minutes = Math.max(0, 1 - k);
      Gfx.glow(ctx, DM.W / 2, 220, 260, '#1b7fd0', 0.25);
      Gfx.clock(ctx, DM.W / 2, 220, 110, minutes, { blood: true });
      if (!this.onCredits) {
        const text = this.pages[this.page];
        const a = Math.min(1, this.pageT * 1.5);
        ctx.save();
        ctx.globalAlpha = a;
        Gfx.paragraph(ctx, text, DM.W / 2, 400, 760, 34, { size: 24, font: F.type, color: '#e8f6ff', align: 'center', chars: this.pageT * 45 });
        ctx.restore();
        Gfx.text(ctx, 'SPACE / CLICK', DM.W / 2, DM.H - 36, { size: 11, color: 'rgba(200,225,240,0.35)', align: 'center', spacing: 3 });
        return;
      }
      const a = Math.min(1, this.pageT);
      const s = this.stats;
      ctx.save();
      ctx.globalAlpha = a;
      Gfx.text(ctx, 'THE END', DM.W / 2, 410, { size: 64, color: '#ffffff', align: 'center', weight: 700, spacing: 16 });
      Gfx.text(ctx, 'OF THIS MOMENT', DM.W / 2, 446, { size: 16, color: DM.C.blue, align: 'center', spacing: 10 });
      const rows = [
        ['TOTAL TIME', U.fmtTime(s.time)],
        ['DISINTEGRATED', String(s.killed)],
        ['SPARED', String(s.spared)],
        ['MEMORIES RECOVERED', `${s.memories} / 6`],
      ];
      rows.forEach(([l, v], i) => {
        Gfx.text(ctx, l, DM.W / 2 - 14, 506 + i * 28, { size: 14, color: 'rgba(200,225,240,0.6)', align: 'right', spacing: 3 });
        Gfx.text(ctx, v, DM.W / 2 + 14, 506 + i * 28, { size: 16, color: '#ffffff' });
      });
      Gfx.text(ctx, 'A fan game inspired by Watchmen (Alan Moore, Dave Gibbons & John Higgins). Not affiliated with DC.', DM.W / 2, DM.H - 40, { size: 12, color: 'rgba(200,225,240,0.4)', align: 'center', font: F.type });
      ctx.restore();
    }
  }

  Scenes.Ending = Ending;
})();
</script>

<script>/* src/data/chapters/prologue.js */
/*
 * PROLOGUE — The Watchmaker's Son. Gila Flats, 1959.
 * Jon is still a man: walk, talk, repair Janey's watch, and go back for the coat.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const { Prop, Door } = DM.Props;
  const NPC = DM.NPC;

  const WALLS = {
    wall: { top: '#56656b', face: '#3b464b', edge: '#1d2427' },
    desk: { top: '#8a6a44', face: '#6a4f30', edge: '#3e2e1c', low: true },
    bench: { top: '#7d5d3a', face: '#5a4128', edge: '#33251a', low: true },
    console: { top: '#6f7f86', face: '#4b575c', edge: '#2a3235', low: true },
    cabinet: { top: '#7d8b72', face: '#5b6753', edge: '#2f362a' },
    counter: { top: '#d8d2c0', face: '#a39d8b', edge: '#5e594d', low: true },
  };
  const GEN = { x: 1426, y: 520 };
  const SHIRT = { body: '#9fb7c9', sleeve: '#9fb7c9' };

  function checker(g, x, y, w, h, s, a, b) {
    for (let yy = y; yy < y + h; yy += s) for (let xx = x; xx < x + w; xx += s) {
      g.fillStyle = (Math.round((xx - x) / s) + Math.round((yy - y) / s)) % 2 ? a : b;
      g.fillRect(xx, yy, Math.min(s, x + w - xx), Math.min(s, y + h - yy));
    }
  }

  function bakeFloor(g) {
    const rnd = U.seeded(59);
    g.fillStyle = '#2a2620';
    g.fillRect(0, 0, 1760, 1040);
    checker(g, 24, 440, 1092, 140, 35, '#d9d3bd', '#b9c4a8');
    g.fillStyle = '#b08658';
    g.fillRect(24, 24, 592, 416);
    g.strokeStyle = 'rgba(80,52,26,0.35)';
    g.lineWidth = 1.5;
    for (let y = 24; y < 440; y += 22) {
      g.beginPath(); g.moveTo(24, y); g.lineTo(616, y); g.stroke();
      for (let k = 0; k < 4; k++) {
        const x = 24 + rnd() * 592;
        g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 22); g.stroke();
      }
    }
    checker(g, 616, 24, 500, 416, 46, '#a3b4ab', '#93a59c');
    checker(g, 24, 580, 552, 436, 40, '#ebe3cb', '#b84a3a');
    g.fillStyle = '#7d6f5c';
    g.fillRect(576, 580, 540, 436);
    for (let i = 0; i < 2500; i++) {
      g.fillStyle = rnd() < 0.5 ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.04)';
      g.fillRect(576 + rnd() * 540, 580 + rnd() * 436, 2, 2);
    }
    // test chamber
    g.fillStyle = '#3e4950';
    g.fillRect(1116, 24, 620, 992);
    g.strokeStyle = 'rgba(0,0,0,0.25)';
    g.lineWidth = 2;
    for (let x = 1116; x < 1736; x += 62) { g.beginPath(); g.moveTo(x, 24); g.lineTo(x, 1016); g.stroke(); }
    for (let y = 24; y < 1016; y += 62) { g.beginPath(); g.moveTo(1116, y); g.lineTo(1736, y); g.stroke(); }
    for (const [r, c] of [[300, '#56646d'], [230, '#4a5860'], [150, '#56646d']]) {
      g.strokeStyle = c;
      g.lineWidth = 10;
      g.beginPath(); g.arc(GEN.x, GEN.y, r, 0, Math.PI * 2); g.stroke();
    }
    for (let i = 0; i < 9; i++) {
      g.fillStyle = i % 2 ? '#1d1d1d' : '#d8b02a';
      g.fillRect(1116 + i * 8, 440, 8, 140);
    }
    g.fillStyle = 'rgba(255,255,255,0.75)';
    g.font = '600 22px Oswald, Arial Narrow, sans-serif';
    g.fillText('TEST CHAMBER 3', 1500, 980);
  }

  // Shorthand for a flavour interactable that plays one or more dialogue lines.
  function flavor(ctx, x, y, label, lines, o = {}) {
    return ctx.add(new Prop({
      x, y, r: 4,
      draw: o.draw,
      interact: {
        label, range: o.range || 58, enabled: o.enabled,
        onInteract: () => ctx.fork(function* () { yield ctx.dialog(lines); }),
      },
    }));
  }

  function buildGila(ctx) {
    const W = ctx.newWorld({ w: 1760, h: 1040, bg: '#15120e', wallStyles: WALLS, zoom: 1.4 });
    const R = (ctx.refs = {});
    W.bake(bakeFloor);
    W.spawn = { x: 120, y: 510, facing: 0 };

    W.room(0, 0, 1760, 1040, { t: 24 });
    W.wall(24, 424, 216, 16); W.wall(330, 424, 270, 16); W.wall(600, 24, 16, 416);
    W.wall(616, 424, 184, 16); W.wall(890, 424, 210, 16);
    W.wall(1100, 24, 16, 96); W.wall(1100, 120, 16, 260, 'glass'); W.wall(1100, 380, 16, 60);
    W.wall(1100, 580, 16, 436);
    W.wall(24, 580, 216, 16); W.wall(330, 580, 230, 16); W.wall(560, 580, 16, 436);
    W.wall(576, 580, 204, 16); W.wall(870, 580, 230, 16);

    W.wall(44, 40, 240, 50, 'bench');
    W.wall(400, 200, 150, 64, 'desk');
    W.wall(28, 180, 36, 180, 'cabinet');
    W.wall(640, 40, 440, 36, 'console');
    W.wall(1050, 140, 36, 220, 'console');
    W.wall(80, 680, 130, 56, 'desk'); W.wall(80, 860, 130, 56, 'desk'); W.wall(270, 860, 130, 56, 'desk');
    W.wall(470, 640, 70, 300, 'counter');
    W.wall(600, 970, 480, 36, 'cabinet');
    W.wall(760, 760, 160, 64, 'desk');
    W.wall(1130, 230, 24, 110, 'console');

    R.door = W.add(new Door(W, 1100, 440, 16, 140, { open: true }));

    // Room signs, chalkboard, console lights.
    W.decals.push((g, world) => {
      const t = world.realTime || 0;
      g.fillStyle = '#2f4a3a';
      g.fillRect(330, 24, 220, 14);
      g.strokeStyle = 'rgba(240,240,230,0.7)';
      g.lineWidth = 1;
      for (let i = 0; i < 6; i++) Gfx.line(g, 340 + i * 34, 30, 360 + i * 34, 32);
      for (let i = 0; i < 18; i++) {
        const on = Math.sin(t * 2 + i * 1.7) > 0.2;
        g.fillStyle = on ? ['#ff5a4a', '#7bd88f', '#f2c418'][i % 3] : '#2a3235';
        g.fillRect(652 + i * 23, 52, 6, 6);
      }
      for (let i = 0; i < 8; i++) {
        const on = Math.sin(t * 3 + i) > 0;
        g.fillStyle = on ? '#7bd88f' : '#2a3235';
        g.fillRect(1062, 156 + i * 25, 6, 6);
      }
      const lbl = (s, x, y) => Gfx.text(g, s, x, y, { size: 13, color: 'rgba(30,30,30,0.55)', spacing: 3, weight: 600 });
      lbl('WORKSHOP', 470, 410);
      lbl('CONTROL', 920, 410);
      lbl('CANTEEN', 400, 1000);
      lbl('RECORDS', 960, 940);
    });

    // Workshop: workbench and flavour.
    R.bench = ctx.add(new Prop({
      x: 165, y: 108, r: 4,
      draw: (g) => {
        g.fillStyle = '#c9c2ae';
        g.fillRect(60, 50, 60, 26);
        g.fillStyle = '#d8b860';
        Gfx.circle(g, 160, 64, 9);
        g.fill();
        g.fillStyle = '#3a3a3a';
        g.fillRect(200, 56, 40, 6);
        g.fillRect(205, 68, 30, 4);
      },
      interact: {
        label: "Repair Janey's watch", range: 70,
        enabled: () => ctx.flags.hasWatch && !ctx.flags.repaired,
        onInteract: () => ctx.fork(function* () {
          ctx.lock(true);
          yield ctx.minigame(DM.Scenes.WatchRepair);
          ctx.flags.repaired = true;
          ctx.lock(false);
        }),
      },
    }));
    flavor(ctx, 440, 62, 'Read the chalkboard', [['jon', "Equations from Tuesday's seminar. Underneath, in my handwriting: 'What holds the shape of a thing together?'"]]);
    flavor(ctx, 476, 232, 'Look at the photograph', [['jon', 'A photograph from the carnival at Palisades Park. Janey is laughing at something I said. I cannot remember what it was.']], {
      draw: (g) => {
        g.fillStyle = '#f1e7cc';
        g.fillRect(464, 222, 26, 20);
        g.fillStyle = '#6b7a86';
        g.fillRect(467, 225, 20, 13);
      },
    });

    // Control room.
    R.wally = ctx.add(new NPC({
      x: 960, y: 250, look: 'wally', facing: 0,
      talk: () => ctx.fork(function* () {
        if (ctx.flags.lockdown) return;
        yield ctx.dialog(ctx.flags.calibrated
          ? [['wally', "Thanks, Jon. Glass says the test runs itself tonight. Fully automatic. Isn't that something?"]]
          : [['wally', "Jon! Glass is in a mood. Big test tonight."], ['wally', "Did you fix Janey's watch yet? Everyone knows you're sweet on her, you know."]]);
      }),
    }));
    R.glass = ctx.add(new NPC({
      x: 870, y: 330, look: 'glass', facing: 0,
      talk: () => ctx.fork(function* () {
        if (ctx.flags.lockdown) return;
        yield ctx.dialog([['glass', 'Intrinsic fields, Jon. Take away what holds a thing together and what is left? Nothing. Or everything. We are close to knowing which.']]);
      }),
    }));

    // Canteen.
    R.janey = ctx.add(new NPC({ x: 330, y: 770, look: 'janey', facing: -Math.PI / 2, talk: () => ctx.fork(janeyTalk) }));
    flavor(ctx, 505, 700, 'Pour a coffee', [['jon', 'The coffee at Gila Flats is famous. Not for good reasons.']]);
    flavor(ctx, 145, 708, 'Listen to the radio', [['jon', '"...the Soviet Premier said today that his country\'s rockets..." I turn it down.']], {
      draw: (g) => {
        g.fillStyle = '#6b3a24';
        g.fillRect(132, 696, 26, 16);
        g.fillStyle = '#e8d27a';
        g.fillRect(136, 700, 10, 8);
      },
    });

    // Records.
    flavor(ctx, 840, 792, 'Read the magazine', [['jon', "A copy of Time. The cover asks whether there will be a nuclear war. Somebody has answered in pencil: 'Probably.'"]], {
      draw: (g) => {
        g.fillStyle = '#c4302b';
        g.fillRect(826, 780, 26, 32);
        g.fillStyle = '#f1e7cc';
        g.fillRect(830, 790, 18, 18);
      },
    });
    flavor(ctx, 840, 950, 'Check the files', [['jon', 'Thirty years of intrinsic field research, alphabetised by Wally. Under W, he has filed his lunch.']]);

    // Test chamber: generator, calibration panel, coat hook, and lockdown flavour.
    R.gen = ctx.add(new Prop({
      x: GEN.x, y: GEN.y, r: 4, data: { power: 0 },
      draw: (g, e, world) => {
        const t = world.realTime || 0;
        const pw = e.data.power;
        g.save();
        g.translate(GEN.x, GEN.y);
        g.strokeStyle = '#8a969e';
        g.lineWidth = 6;
        Gfx.circle(g, 0, 0, 96);
        g.stroke();
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2 + t * (0.2 + pw * 3);
          g.fillStyle = '#5c6870';
          g.fillRect(Math.cos(a) * 96 - 9, Math.sin(a) * 96 - 9, 18, 18);
        }
        g.restore();
        Gfx.glow(g, GEN.x, GEN.y, 120 + pw * 260, '#5fd4ff', 0.12 + pw * 0.7);
        if (pw > 0.05) {
          g.save();
          g.globalCompositeOperation = 'lighter';
          g.strokeStyle = `rgba(160,230,255,${Math.min(1, pw)})`;
          g.lineWidth = 2;
          for (let i = 0; i < 3; i++) {
            Gfx.circle(g, GEN.x, GEN.y, ((t * 120 * (1 + pw) + i * 100) % 300) + 20);
            g.stroke();
          }
          g.restore();
        }
      },
    }));
    R.panel = ctx.add(new Prop({
      x: 1178, y: 285, r: 4,
      interact: {
        label: 'Calibrate the generator', range: 60,
        enabled: () => !ctx.flags.calibrated || ctx.flags.lockdown,
        onInteract: () => ctx.fork(function* () {
          if (ctx.flags.lockdown) {
            yield ctx.dialog([['jon', 'LOCKED OUT. The sequence is running itself, exactly as designed.']]);
            return;
          }
          if (!ctx.flags.repaired) {
            yield ctx.dialog([['jon', "Not yet. Wally hasn't run the pre-checks."]]);
            return;
          }
          ctx.lock(true);
          yield ctx.dialog([['jon', "It's warm in here. I hang my coat on the hook by the generator. Janey's watch is in the pocket."]]);
          ctx.flags.coatHung = true;
          Object.assign(ctx.player.look, SHIRT);
          DM.Audio.play('gear');
          yield ctx.wait(0.4);
          yield ctx.narrate('Calibration nominal. Field coherence: ninety-nine point nine seven percent.', { dur: 3.5 });
          ctx.flags.calibrated = true;
          ctx.lock(false);
        }),
      },
    }));
    R.coat = ctx.add(new Prop({
      x: 1700, y: 520, r: 4,
      draw: (g) => {
        g.fillStyle = '#3a3a3a';
        g.fillRect(1714, 512, 10, 16);
        if (!ctx.flags.coatHung || ctx.flags.gotCoat) return;
        g.fillStyle = '#ebe7dc';
        g.beginPath();
        g.moveTo(1716, 500); g.lineTo(1690, 506); g.lineTo(1682, 540); g.lineTo(1716, 544);
        g.closePath();
        g.fill();
        g.strokeStyle = '#b9b4a6';
        g.stroke();
      },
      interact: {
        label: 'Take your coat', range: 64,
        enabled: () => ctx.flags.needCoat && !ctx.flags.gotCoat,
        onInteract: () => {
          ctx.flags.gotCoat = true;
          ctx.player.look = Object.assign({}, DM.LOOKS.jon);
          DM.Audio.play('ui_select');
        },
      },
    }));
    flavor(ctx, 1132, 510, 'Try the door', [['jon', 'It does not move. It was designed not to.']], { enabled: () => ctx.flags.lockdown, range: 60 });
    flavor(ctx, 1136, 180, 'Look through the window', [['jon', 'Wally is shouting something. The glass is three inches thick.']], { enabled: () => ctx.flags.lockdown, range: 60 });

    return W;
  }

  function* janeyTalk(ctx) {
    const f = ctx.flags;
    if (f.lockdown) return;
    if (!f.metJaney) {
      yield ctx.dialog([
        ['janey', 'Jon! Look at this. Somebody stepped on it at the carnival. It\'s ruined.'],
        ['jon', 'May I? ...The balance wheel has come loose, and the crystal is cracked. It isn\'t ruined.'],
        ['janey', 'You can fix it? Really?'],
        ['jon', 'My father repaired watches. I still remember how. Give me an hour.'],
        ['janey', "You're sweet, Jon Osterman. Don't let anyone tell you otherwise."],
      ]);
      f.metJaney = true;
      f.hasWatch = true;
    } else if (!f.repaired) {
      yield ctx.dialog([['janey', "Take your time. It's only a watch."]]);
    } else if (!f.calibrated) {
      yield ctx.dialog([['jon', "It's fixed. I'll bring it by as soon as I've seen to the generator."], ['janey', 'Go on, then. Glass hates waiting.']]);
    } else if (!f.needCoat) {
      yield ctx.dialog([
        ['jon', 'Janey, your watch— '],
        ['jon', "...It's in my coat. I left my coat in the test chamber."],
        ['janey', "Then go and get it, silly. I'll be right here."],
      ]);
      f.needCoat = true;
    } else {
      yield ctx.dialog([['janey', "Go on. I'll wait."]]);
    }
  }

  DM.Chapters.register({
    id: 'prologue',
    numeral: 'PROLOGUE',
    title: "The Watchmaker's Son",
    date: 'August 1959',
    place: 'Gila Flats, Arizona',
    clock: 12,
    color: '#b8901e',
    music: 'prologue',
    form: 'human',
    epigraph: { text: 'If only I had known, I should have become a watchmaker.', by: 'Albert Einstein' },
    intro: [
      '1945. My father repairs watches. When the news comes from Hiroshima, he sweeps his gears into a box and tells me the future belongs to physics. I believe him.',
      '1959. I am thirty years old. I study intrinsic fields at Gila Flats, Arizona: the force that holds a thing in its shape.',
      'In a few days, that force will let go of me. Today, I am late for lunch.',
    ],
    maps: { gila: buildGila },
    stages: [
      {
        id: 'lunch',
        map: 'gila',
        run: function* (ctx) {
          ctx.lock(true);
          yield ctx.wait(0.6);
          yield ctx.narrate('Gila Flats Research Base. The desert holds its heat long after sundown. Janey said she would be in the canteen.');
          ctx.lock(false);
          ctx.hint('Move with W A S D or the arrow keys. Press E to talk and interact.', 9);
          ctx.objective('Find Janey in the canteen');
          ctx.marker(ctx.refs.janey.x, ctx.refs.janey.y, 'JANEY');
          yield ctx.until(() => ctx.flags.metJaney && !ctx.scene.dialog.active);
          ctx.objectiveDone();
          ctx.marker(null);
          yield ctx.wait(1.2);
          ctx.objective('Repair the watch at your workbench');
          ctx.marker(ctx.refs.bench.x, ctx.refs.bench.y, 'WORKBENCH');
          yield ctx.until(() => ctx.flags.repaired);
          ctx.objectiveDone();
          ctx.marker(null);
          yield ctx.narrate('Gears, springs, a balance wheel. Everything in its place and its time. It is the last thing I will ever build with my hands.', { dur: 6 });
        },
        restore(ctx) {
          Object.assign(ctx.flags, { metJaney: true, hasWatch: true, repaired: true });
        },
      },
      {
        id: 'calibrate',
        run: function* (ctx) {
          yield ctx.wait(0.6);
          yield ctx.dialog([['wally', "Jon? It's Wally. Glass wants the field generator calibrated before tonight's test. Could you check the panel in the test chamber? Door's open.", { name: 'Wally Weaver — Intercom' }]]);
          ctx.objective('Calibrate the generator in the Test Chamber');
          ctx.marker(ctx.refs.panel.x, ctx.refs.panel.y, 'PANEL');
          yield ctx.until(() => ctx.flags.calibrated);
          ctx.objectiveDone();
          ctx.marker(null);
        },
        restore(ctx) {
          Object.assign(ctx.flags, { coatHung: true, calibrated: true });
          Object.assign(ctx.player.look, SHIRT);
        },
      },
      {
        id: 'coat',
        run: function* (ctx) {
          yield ctx.wait(1);
          ctx.objective('Bring Janey her watch');
          ctx.marker(ctx.refs.janey.x, ctx.refs.janey.y, 'JANEY');
          yield ctx.until(() => ctx.flags.needCoat && !ctx.scene.dialog.active);
          ctx.objectiveDone();
          yield ctx.wait(0.8);
          ctx.objective('Fetch your coat from the Test Chamber');
          ctx.marker(ctx.refs.coat.x, ctx.refs.coat.y, 'COAT');
          yield ctx.until(() => ctx.flags.gotCoat);
          ctx.marker(null);
        },
        restore(ctx) {
          Object.assign(ctx.flags, { needCoat: true, gotCoat: true });
          ctx.player.look = Object.assign({}, DM.LOOKS.jon);
        },
      },
      {
        id: 'accident',
        run: function* (ctx) {
          const R = ctx.refs, W = ctx.world, P = ctx.player;
          ctx.objective(null);
          if (ctx.startedHere) ctx.place(1600, 520, Math.PI);
          R.door.setOpen(false);
          W.camera.shake(0.5);
          ctx.flags.lockdown = true;
          ctx.music('tension');
          ctx.fork(function* () {
            while (!ctx.flags.flashed) {
              DM.Audio.play('alarm');
              W.tint = 'rgba(255,40,30,0.13)';
              yield ctx.wait(0.42);
              W.tint = null;
              yield ctx.wait(0.43);
            }
            W.tint = null;
          });
          R.wally.walkTo(1074, 230);
          R.glass.walkTo(1074, 300);
          yield ctx.wait(0.9);
          yield ctx.dialog([
            ['wally', "Jon! The door— it's sealed! The time lock's engaged!"],
            ['glass', "The test program has started. It's automatic, Jon. It cannot be interrupted. I'm so sorry."],
            ['jon', 'Yes. I see.'],
          ]);
          ctx.objective('Find a way out');
          ctx.fork(function* () {
            yield ctx.wait(7);
            ctx.narrate("Janey's watch is ticking in my coat pocket. I fixed it this morning. It keeps perfect time.", { dur: 5.5 });
          });
          ctx.fork(function* () {
            const t0 = W.realTime;
            while (!ctx.flags.flashed) {
              R.gen.data.power = Math.min(1, (W.realTime - t0) / 16);
              yield;
            }
          });
          yield ctx.countdown(16, 'INTRINSIC FIELD GENERATOR ENGAGING');
          ctx.objective(null);
          ctx.lock(true);
          ctx.cinematic(true);
          DM.Audio.play('flash');
          R.gen.data.power = 1.6;
          for (let i = 0; i < 36; i++) {
            W.particles.implode(P.x, P.y, 220 - i * 4, 6, { life: 0.3, color: '#ffffff' });
            W.camera.shake(0.08);
            yield ctx.wait(0.05);
          }
          ctx.flash('#ffffff', 3.5);
          P.hidden = true;
          W.particles.burst(P.x, P.y, 260, { color: ['#7fe3ff', '#ffffff', '#ecc8a6', '#ebe7dc'], speed: [60, 620], life: [0.8, 2.6], size: [1.5, 4], drag: 1.2 });
          ctx.flags.flashed = true;
          yield ctx.wait(2.8);
          ctx.music('void');
          yield ctx.narrate('August 1959. I am taken apart.', { dur: 4 });
        },
      },
    ],
  });
})();
</script>
<script>/* src/data/chapters/reassembly.js */
/*
 * CHAPTER I — Reassembly. Gila Flats, 1959–1960.
 * Jon is a single point of awareness. Gather scattered atoms, bring them back
 * to the chamber, and rebuild a body one system at a time.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const { Atom, Vortex, BodyForm } = DM.Special;
  const C = { x: 1200, y: 1200 };

  const LAYERS = [
    { name: 'nervous system', quota: 30, carry: 20, pull: 85, vortices: 1, text: 'November 10th, 1959. A nervous system flickers in the test chamber for eleven seconds, then is gone. The guards are told it was a malfunction.' },
    { name: 'circulatory system', quota: 40, carry: 25, pull: 100, vortices: 2, text: 'December 1959. A circulatory system, beating around nothing. Somebody screams. They hang curtains over the observation window.' },
    { name: 'skeleton', quota: 45, carry: 30, pull: 115, vortices: 3, text: 'February 1960. A skeleton, partly muscled, takes two steps and falls apart. I am learning.' },
    { name: 'musculature', quota: 55, carry: 35, pull: 130, vortices: 4, text: 'March 1960. I have remembered everything but my skin. I decide on something simpler.' },
  ];

  function bakeVoid(g) {
    const rnd = U.seeded(1960);
    g.fillStyle = '#03050a';
    g.fillRect(0, 0, 2400, 2400);
    for (let i = 0; i < 40; i++) {
      const x = rnd() * 2400, y = rnd() * 2400, r = 100 + rnd() * 320;
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, `rgba(30,60,130,${0.05 + rnd() * 0.07})`);
      gr.addColorStop(1, 'rgba(30,60,130,0)');
      g.fillStyle = gr;
      g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    for (let i = 0; i < 1800; i++) {
      g.fillStyle = `rgba(200,230,255,${rnd() * 0.55})`;
      const s = rnd() * 1.8;
      g.fillRect(rnd() * 2400, rnd() * 2400, s, s);
    }
    g.strokeStyle = 'rgba(127,227,255,0.07)';
    g.lineWidth = 2;
    for (let k = -620; k <= 620; k += 62) {
      Gfx.line(g, C.x + k, C.y - 620, C.x + k, C.y + 620);
      Gfx.line(g, C.x - 620, C.y + k, C.x + 620, C.y + k);
    }
    for (const r of [300, 230]) {
      g.strokeStyle = 'rgba(127,227,255,0.1)';
      g.lineWidth = 8;
      Gfx.circle(g, C.x, C.y, r);
      g.stroke();
    }
  }

  function spawnCluster(W) {
    const a = U.rand(0, Math.PI * 2), d = U.rand(380, 1050);
    const cx = U.clamp(C.x + Math.cos(a) * d, 80, W.w - 80), cy = U.clamp(C.y + Math.sin(a) * d, 80, W.h - 80);
    const n = U.randInt(5, 9);
    for (let i = 0; i < n; i++) W.add(new Atom(cx + U.rand(-55, 55), cy + U.rand(-55, 55)));
  }

  function buildVoid(ctx) {
    const W = ctx.newWorld({ w: 2400, h: 2400, bg: '#03050a', zoom: 1.05 });
    W.bake(bakeVoid);
    W.spawn = { x: C.x, y: C.y + 260, facing: -Math.PI / 2 };
    const body = W.add(new BodyForm(C.x, C.y, { H: 260, depositR: 130 }));
    body.bank = 0;
    body.quota = 1;
    body.layerIndex = 0;
    ctx.refs = { body };
    for (let i = 0; i < 18; i++) spawnCluster(W);
    return W;
  }

  // Move atoms from Jon into the body while he is inside the chamber ring.
  function* depositLoop(ctx) {
    const body = ctx.refs.body;
    while (!ctx.flags.reassembled) {
      const P = ctx.player, W = ctx.world;
      if (P.form === 'awareness' && P.carry > 0 && !P.locked && U.dist(P.x, P.y, body.x, body.y) < body.depositR && body.bank < body.quota) {
        P.carry--;
        body.bank++;
        body.pulse = 0.35;
        body.layers[body.layerIndex] = Math.min(0.999, body.bank / body.quota);
        W.particles.emit(P.x, P.y, { vx: (body.x - P.x) * 2.4, vy: (body.y - 40 - P.y) * 2.4, life: 0.42, size: 3, size1: 1, color: '#bff1ff', drag: 0 });
        DM.Audio.play('deposit');
        yield ctx.wait(0.04);
      } else yield;
    }
  }

  function* spawner(ctx) {
    while (!ctx.flags.reassembled) {
      const W = ctx.world;
      let n = 0;
      for (const e of W.entities) if (e instanceof Atom) n++;
      if (n < 130) spawnCluster(W);
      yield ctx.wait(0.35);
    }
  }

  DM.Chapters.register({
    id: 'reassembly',
    numeral: 'CHAPTER I',
    title: 'Reassembly',
    date: 'November 1959',
    place: 'Gila Flats, Arizona',
    clock: 10,
    color: '#1b4f8a',
    music: 'void',
    introMusic: 'void',
    form: 'awareness',
    epigraph: { text: 'Nothing is lost, nothing is created, everything is transformed.', by: 'Antoine Lavoisier' },
    intro: [
      'There is no body to bury. They hold a funeral anyway. Wally helps carry an empty coffin.',
      'But a pattern does not stop being a pattern because it has been scattered. I am still here, in pieces, spread through the chamber.',
      'Slowly, I begin to remember what shape I used to be.',
    ],
    maps: { void: buildVoid },
    stages: [
      {
        id: 'gather',
        map: 'void',
        grants: ['coalesce'],
        run: function* (ctx) {
          const P = ctx.player, body = ctx.refs.body;
          ctx.setForm('awareness');
          ctx.lock(true);
          ctx.focus(C.x, C.y);
          yield ctx.wait(1.2);
          yield ctx.narrate('Nothing. And then less than nothing: a pattern, scattered across the chamber, remembering its own shape.');
          yield ctx.unlock('coalesce');
          ctx.focus(null);
          ctx.lock(false);
          ctx.hint('Drift near your atoms to gather them. Hold LEFT CLICK to widen your pull.', 9);
          ctx.fork(depositLoop);
          ctx.fork(spawner);
          ctx.fork(function* () {
            yield ctx.until(() => P.carry >= P.carryMax);
            ctx.hint('You cannot hold any more. Return to the chamber at the centre to rebuild yourself.', 8);
            ctx.marker(C.x, C.y + 130, 'CHAMBER');
            yield ctx.until(() => body.bank > 0);
            ctx.marker(null);
          });
          let warned = false;
          ctx.on('vortex:hit', () => {
            if (warned) return;
            warned = true;
            ctx.hint('Entropy. It tears loose whatever you are carrying. Keep clear of the dark.', 7);
          });

          for (let i = 0; i < LAYERS.length; i++) {
            const L = LAYERS[i];
            P.carryMax = L.carry;
            P.basePull = L.pull;
            body.layerIndex = i;
            body.bank = 0;
            body.quota = L.quota;
            let v = ctx.world.entities.filter((e) => e instanceof Vortex).length;
            for (; v < L.vortices; v++) {
              const a = U.rand(0, Math.PI * 2);
              ctx.add(new Vortex(C.x + Math.cos(a) * 750, C.y + Math.sin(a) * 750, { home: { x: C.x, y: C.y, r: 260 }, speed: 40 + i * 8 }));
            }
            ctx.objective(`Rebuild your ${L.name}`, () => `${body.bank}/${L.quota}`);
            yield ctx.until(() => body.bank >= L.quota);
            body.layers[i] = 1;
            ctx.objectiveDone();
            DM.Audio.play('layer');
            ctx.flash('#bff1ff', 0.6);
            ctx.world.camera.shake(0.25);
            ctx.narrate(L.text, { dur: 7 });
            yield ctx.wait(1.5);
          }

          ctx.flags.reassembled = true;
          ctx.lock(true);
          ctx.objective(null);
          const W = ctx.world;
          for (const e of W.entities) {
            if (e instanceof Vortex || e instanceof Atom) {
              W.particles.burst(e.x, e.y, 6, { color: ['#7fe3ff', '#ffffff'], speed: [20, 90], life: [0.3, 0.7], size: [1.5, 3] });
              e.dead = true;
            }
          }
          ctx.focus(body.x, body.y);
          const sx = P.x, sy = P.y;
          for (let k = 0; k < 1; k += 1 / 70) {
            const e = U.ease.inOutCubic(k);
            P.x = U.lerp(sx, body.x, e);
            P.y = U.lerp(sy, body.y - 60, e);
            yield;
          }
          P.hidden = true;
          DM.Audio.play('unlock');
          for (let k = 0; k <= 1; k += 0.025) {
            body.skin = k;
            yield ctx.wait(0.03);
          }
          ctx.flash('#dff7ff', 1.6);
          W.camera.shake(0.5);
          ctx.setForm('manhattan');
          body.dead = true;
          P.hidden = false;
          P.x = body.x;
          P.y = body.y;
          P.facing = Math.PI / 2;
          W.particles.burst(P.x, P.y, 120, { color: ['#7fe3ff', '#ffffff', '#5fd4ff'], speed: [80, 420], life: [0.5, 1.4], size: [1.5, 3.5], drag: 2 });
          yield ctx.wait(1.4);
          yield ctx.narrate('April 1960. I walk out of the test chamber.', { dur: 3.5 });
          yield ctx.banner('DR. MANHATTAN', 'GILA FLATS · APRIL 1960', { dur: 3.6 });
        },
        restore(ctx) {
          ctx.flags.reassembled = true;
          ctx.setForm('manhattan');
          ctx.player.hidden = false;
          if (ctx.refs.body) ctx.refs.body.dead = true;
          for (const e of ctx.world.entities) if (e instanceof Vortex || e instanceof Atom) e.dead = true;
        },
      },
      {
        id: 'naming',
        run: function* (ctx) {
          ctx.lock(true);
          ctx.focus(null);
          yield ctx.wait(0.5);
          yield ctx.dialog([
            ['colonel', "Doctor... Osterman? Colonel Hart, Army liaison. The President's people asked me to tell you they've chosen a name for you."],
            ['colonel', "'Doctor Manhattan.' It's meant to make certain people in Moscow very nervous."],
            ['manhattan', 'Manhattan. After the bomb.'],
            ['colonel', "After what it stands for. We had a symbol drawn up, too. An atom, with the little orbits—"],
            ['manhattan', 'No. If I am to wear a symbol, it will be one I respect.'],
            ['manhattan', 'Hydrogen. One proton, one electron. The simplest thing there is.'],
          ]);
          yield ctx.narrate('I draw it on my forehead myself. It is the last decision I make for a long time that feels like mine.', { dur: 5.5 });
        },
      },
    ],
  });
})();
</script>
<script>/* src/data/chapters/superman.js */
/*

(function () {

  function bakeRange(g) {

      g.bezierCurveTo(600, y + rnd() * 80 - 40, 1300, y + rnd() * 80 - 40, 2000, y + rnd() * 60 - 30);

    g.strokeStyle = 'rgba(90,60,30,0.25)';

      g.moveTo(300, 1300);
      g.bezierCurveTo(500, 900 + off, 900, 1000 + off, 1100, 600 + off);

    g.fillRect(120, 120, 340, 280);
    g.fillStyle = 'rgba(0,0,0,0.12)';

    const R = (ctx.refs = {});

    R.dummies = [
      [1560, 900], [1700, 1010], [1830, 860], [1640, 1160],

    R.dummies.push(
      ctx.add(new Dummy(1500, 1060, { rail: { dx: 0, dy: 90, speed: 1.2 } })),

    navy: { top: '#2e4f7a', face: '#203856', edge: '#111e2e' },
    moss: { top: '#3b6b4a', face: '#294b34', edge: '#142519' },
    water: { top: 'rgba(0,0,0,0)', face: null, edge: null, low: true, flat: true },

  function bakePier(g) {

    g.fillStyle = '#2b2d33';
    g.fillRect(0, 0, 2200, 1400);
    for (let i = 0; i < 9000; i++) {

      g.fillRect(rnd() * 2200, rnd() * 1180, 3, 3);

    }
    g.fillStyle = '#4a4844';
    g.fillRect(1000, 150, 1100, 750);
    for (let i = 0; i < 20; i++) {
      g.fillStyle = 'rgba(0,0,0,0.18)';

    }
    g.fillStyle = '#4a3a2a';
    g.fillRect(0, 1180, 2200, 120);

    g.fillStyle = '#0d1a2a';
    g.fillRect(0, 1300, 2200, 100);

    for (let i = 0; i < 40; i++) {

    g.strokeStyle = 'rgba(240,220,120,0.5)';
    g.lineWidth = 4;

  function buildPier(ctx) {

    W.room(0, 0, 2200, 1400, { t: 20, kind: 'brick' });
    W.wall(20, 1300, 2160, 80, 'water');
    W.room(1000, 150, 1100, 750, { t: 24, kind: 'brick', doors: [{ side: 'bottom', at: 350, w: 150 }, { side: 'left', at: 250, w: 120 }] });
    W.wall(1700, 174, 24, 126, 'brick');
    W.wall(1700, 380, 24, 100, 'brick');
    W.wall(1724, 456, 76, 24, 'brick');
    W.wall(1880, 456, 196, 24, 'brick');
    W.wall(1100, 300, 40, 220, 'shelf');
    W.wall(1250, 300, 40, 220, 'shelf');
    W.wall(1100, 640, 260, 36, 'shelf');
    W.wall(1460, 560, 36, 200, 'shelf');
    W.wall(1900, 200, 150, 60, 'desk');
    W.wall(500, 300, 240, 90, 'rust');
    W.wall(300, 600, 90, 240, 'navy');
    W.wall(700, 780, 240, 90, 'moss');
    W.wall(850, 430, 90, 200, 'rust');

    const lamps = [[200, 300], [200, 820], [900, 1120], [1420, 1060], [620, 560]];
    W.decals.push((g) => {
      for (const [x, y] of lamps) {
        g.fillStyle = 'rgba(255,220,140,0.06)';
        Gfx.circle(g, x, y, 170);
        g.fill();
      }
    });
    W.overlays.push((g, world) => {
      for (const [x, y] of lamps) {
        g.fillStyle = '#222';
        Gfx.circle(g, x, y, 6);
        g.fill();
        Gfx.glow(g, x, y, 60, '#ffd27a', 0.5 + Math.sin((world.realTime || 0) * 7 + x) * 0.03);

    ctx.add(new NPC({ x: 170, y: 1040, look: 'captain', facing: 0 }));
    ctx.add(new Vehicle(140, 930, { kind: 'sedan', paint: '#1d2b4f', mass: 6 }));
    ctx.add(new Vehicle(620, 1020, { kind: 'sedan', rot: 0.2 }));
    ctx.add(new Vehicle(1700, 1060, { kind: 'sedan', rot: -0.1 }));
    const crates = [[460, 470], [500, 470], [780, 560], [1020, 1000], [1080, 980], [1180, 420], [1600, 300], [1640, 320], [1560, 820], [1900, 700], [1960, 760], [1320, 820]];
    for (const [x, y] of crates) ctx.add(new Crate(x, y));
    for (const [x, y] of [[760, 700], [1390, 380], [1980, 620], [1820, 380]]) ctx.add(new Barrel(x, y));
    ctx.add(new Prop({
      x: 1975, y: 230, r: 4,
      draw: (g) => Gfx.smiley(g, 1975, 228, 8),
      interact: {
        label: 'Look at the badge', range: 60,
        onInteract: () => ctx.fork(function* () {
          yield ctx.dialog([['manhattan', 'A smiley-face badge, left on the desk. Somebody here has a sense of humour. I suspect I know who.']]);

  function spawnGroup(ctx, list) {
    return list.map(([x, y, gun]) => ctx.add(new Gangster({ x, y, gun: gun || 'pistol', facing: U.rand(0, Math.PI * 2) })));
  }
  const down = (g) => g.filter((e) => e.neutralized).length;

  const YARD = [[700, 500], [460, 920], [980, 720], [620, 680]];
  const WAREHOUSE = [[1200, 560], [1380, 420], [1580, 700], [1650, 840], [1350, 760, 'tommy']];
  const OFFICE = [[1900, 300, 'tommy'], [2020, 400, 'tommy'], [1790, 230]];

  DM.Chapters.register({
    id: 'superman',
    numeral: 'CHAPTER II',
    title: 'The Superman Exists',
    date: '1960 – 1966',
    place: 'Nevada · New York',
    clock: 8,
    color: '#7a3b2e',
    music: 'action',
    form: 'manhattan',
    epigraph: { text: 'Now I am become Death, the destroyer of worlds.', by: 'J. Robert Oppenheimer, quoting the Bhagavad Gita' },
    intro: [
      'The Army gives me a name, a costume and a test range in the Nevada desert. I wear the costume for a while. It seems to make them comfortable.',

              ['captain', 'Do what you do. Just... try to leave somebody for me to arrest.'],
            ]);

          ctx.hint('Thrown people are knocked out. Disintegrated people are gone. The choice is yours.', 9);

          ctx.objective('Clear the yard', () => `${down(g)}/${g.length}`);
          yield ctx.until(() => g.every((e) => e.neutralized));
          ctx.objectiveDone();
        },
      },
      {
        id: 'warehouse',
        checkpoint: true,
        run: function* (ctx) {
          const P = ctx.player;
          if (ctx.startedHere) ctx.place(980, 1020, -Math.PI / 2);
          yield ctx.wait(1);
          const g = spawnGroup(ctx, WAREHOUSE);
          ctx.objective('Clear the warehouse', () => `${down(g)}/${g.length}`);
          ctx.marker(1425, 900, 'WAREHOUSE');
          ctx.fork(function* () {
            yield ctx.until(() => P.y < 880 && P.x > 1000);
            ctx.marker(null);
          });
          yield ctx.until(() => g.every((e) => e.neutralized));
          ctx.objectiveDone();
          ctx.marker(null);
        },
      },
      {
        id: 'office',
        checkpoint: true,
        run: function* (ctx) {
          const P = ctx.player;
          if (ctx.startedHere) ctx.place(1420, 820, -Math.PI / 2);
          yield ctx.wait(0.8);
          const g = spawnGroup(ctx, OFFICE);
          ctx.objective('Clear the back office', () => `${down(g)}/${g.length}`);
          ctx.marker(1840, 480, 'OFFICE');
          ctx.fork(function* () {
            yield ctx.until(() => P.x > 1700 && P.y < 470);
            ctx.marker(null);
          });
          yield ctx.until(() => g.every((e) => e.neutralized));
          ctx.objectiveDone();
          ctx.marker(null);
        },
      },
      {
        id: 'aftermath',
        run: function* (ctx) {
          ctx.lock(true);
          yield ctx.wait(1);
          yield ctx.dialog([
            ['captain', "...That's the last of them. Nineteen years on the force, Doctor. I never saw anything like that.", { name: 'Captain Rourke — Radio' }],
            ['manhattan', 'Neither had I, until recently.'],
          ]);
          const s = ctx.stats;
          let line;
          if (s.disintegrated === 0) line = 'Every one of them will live to stand trial. It is a small thing. I notice that I wanted it.';
          else if (s.spared === 0) line = 'None of them will stand trial. I notice that I feel nothing about this. I notice that I notice.';
          else line = 'Some of them will stand trial. Some will not. It made no difference at all to my heart rate.';
          yield ctx.narrate(line, { dur: 6 });
          yield ctx.narrate('The next morning, every newspaper in America runs the same headline. They have found their superman.', { dur: 6 });
        },
      },
    ],
  });
})();
</script>

/*
 * CHAPTER III — The Deterrent. Nevada Test Site, 1971–1977.
 * Teleport across a canyon and a minefield, then survive Operation Blue Fire:
 * waves of drones, tanks and missile batteries, and the Behemoth.

(function () {

  const DM = window.DM;
  const U = DM.U;

      low: true,
      draw: (g, w) => {
        g.fillStyle = '#21160e';

        g.fillRect(w.x + w.w * 0.3, w.y, w.w * 0.4, w.h);

    g.fillRect(900, 230, 420, 1140);
    g.strokeStyle = 'rgba(200,40,30,0.5)';
    g.setLineDash([16, 12]);
    g.lineWidth = 3;
    g.strokeRect(900, 230, 420, 1140);
    g.setLineDash([]);
    for (let y = 280; y < 1360; y += 180) {
      g.fillStyle = '#5a4028';
      g.fillRect(886, y, 6, 30);
