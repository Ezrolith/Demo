      side('right', h, (a, b) => this.wall(x + w - t, y + a, t, b - a, kind));
    }

    // Pre-render the static floor once into an offscreen canvas.
    bake(drawFn) {
      const maxPx = 5.5e6;
      const s = Math.min(1, Math.sqrt(maxPx / (this.w * this.h)));
      const c = document.createElement('canvas');
      c.width = Math.ceil(this.w * s);
      c.height = Math.ceil(this.h * s);
      const g = c.getContext('2d');
      g.scale(s, s);
      drawFn(g, this.w, this.h);
      this.floorCanvas = c;
      this.floorScale = s;
    }

    bark(e, text, dur = 1.8) {
      this.barks = this.barks.filter((b) => b.e !== e);
      this.barks.push({ e, text, t: dur, dur });
    }

    // ---- queries ----------------------------------------------------------
    query(x, y, r, filter) {
      const out = [];
      for (const e of this.entities) {
        if (e.dead) continue;
        if (U.dist2(x, y, e.x, e.y) > (r + e.r) * (r + e.r)) continue;
        if (filter && !filter(e)) continue;
        out.push(e);
      }
      return out;
    }

    // Can a circle of radius r stand at (x, y)?
    isFree(x, y, r) {
      if (x < r || y < r || x > this.w - r || y > this.h - r) return false;
      for (const w of this.walls) {
        if (w.noCollide) continue;
        if (U.circleRect(x, y, r, w)) return false;
      }
      return true;
    }

    // Line of sight (low walls and glass don't block sight).
    los(x1, y1, x2, y2) {
      for (const w of this.walls) {
        if (w.noCollide || w.low || w.seeThrough) continue;
        if (U.segRect(x1, y1, x2, y2, w) >= 0) return false;
      }
      return true;
    }

    // First wall hit by a shot along the segment, as t in [0,1] or -1.
    shotHit(x1, y1, x2, y2) {
      let best = -1;
      for (const w of this.walls) {
        if (w.noCollide || w.low) continue;
        const t = U.segRect(x1, y1, x2, y2, w);
        if (t >= 0 && (best < 0 || t < best)) best = t;
      }
      return best;
    }

    // Damage + knockback in a radius. o.team: entities on this team are spared.
    explode(x, y, r, dmg, o = {}) {
      for (const e of this.entities) {
        if (e.dead || e === o.source) continue;
        if (o.team && e.team === o.team) continue;
        const d = U.dist(x, y, e.x, e.y);
        if (d > r + e.r) continue;
        const k = 1 - U.clamp(d / (r + e.r), 0, 1) * 0.6;
        if (e.hp != null || e.isPlayer || e.takesExplosions) e.damage(dmg * k, o.source || null, 'explosion');
        if (!e.static) {
          const n = U.norm(e.x - x, e.y - y);
          const f = (o.force || 520) * k;
          e.vx += (n.x * f) / Math.sqrt(e.mass);
          e.vy += (n.y * f) / Math.sqrt(e.mass);
        }
        if (e.onBlast) e.onBlast(x, y, r, this);
      }
      const P = this.particles;
      const fire = o.colors || ['#ffd27a', '#ff9a3c', '#ff5a2a', '#fff2c4'];
      P.burst(x, y, 26, { color: fire, speed: [40, r * 3.4], life: [0.2, 0.6], size: [4, 9], shape: 'glow', drag: 4 });
      P.burst(x, y, 14, { color: ['#2a2522', '#3a332e', '#1d1a18'], speed: [20, 90], life: [0.7, 1.5], size: [8, 15], size1: 24, shape: 'smoke', add: false, drag: 2, alpha: 0.7 });
      P.emit(x, y, { shape: 'ring', size: r * 0.3, size1: r * 1.1, life: 0.35, color: '#ffe2a8', drag: 0 });
      DM.Audio.play('explosion');
      this.camera.shake(Math.min(0.7, 0.3 * (r / 70)));
    }

    // Broadcast that a disintegration is about to land (bosses may dodge).
    emitCast(c) {
      for (const e of this.entities) if (!e.dead && e.onDisintegrateCast) e.onDisintegrateCast(c, this);
    }

    // ---- simulation -------------------------------------------------------
    update(dt) {
      this.timeScale = U.damp(this.timeScale, this.slowmo ? 0.28 : 1, 9, dt);
      const wdt = dt * this.timeScale;
      const pdt = dt * (this.slowmo ? 0.8 : 1);
      this.time += wdt;
      this.realTime = (this.realTime || 0) + dt;

      const list = this.entities;
      const n = list.length;
      for (let i = 0; i < n; i++) {
        const e = list[i];
        if (e.dead) continue;
        const edt = e.timeless ? pdt : wdt;
        e.age += edt;
        if (e.hitFlash > 0) e.hitFlash -= edt;
        if (e.thrown > 0) e.thrown -= edt;
        e.update(edt, this);
      }
      for (let i = 0; i < list.length; i++) {
        const e = list[i];
        if (e.dead || e.static || e.selfMove) continue;
        this.integrate(e, e.timeless ? pdt : wdt);
      }
      this.collideBodies();

      if (this._deferred.length) {
        const q = this._deferred;
        this._deferred = [];
        for (const fn of q) fn(this);
      }

      let anyDead = false;
      for (const e of list) if (e.dead) anyDead = true;
      if (anyDead) {
        this.entities = list.filter((e) => {
          if (e.dead && e.onRemove) e.onRemove(this);
          return !e.dead;
        });
      }

      for (const b of this.barks) b.t -= dt;
      this.barks = this.barks.filter((b) => b.t > 0 && !b.e.dead);
      this.particles.update(wdt);
      this.camera.update(dt);
    }

    integrate(e, dt) {
      if (!e.heldBy) {
        // Thrown things fly: ground friction is mostly off while `thrown` lasts.
        const f = Math.exp(-(e.thrown > 0 ? e.friction * 0.22 : e.friction) * dt);
        e.vx *= f;
        e.vy *= f;
      }
      const travel = (Math.abs(e.vx) + Math.abs(e.vy)) * dt;
      const steps = e.solid ? Math.min(6, Math.max(1, Math.ceil(travel / Math.max(4, e.r * 0.8)))) : 1;
      const sdt = dt / steps;
      for (let i = 0; i < steps; i++) {
        e.x += e.vx * sdt;
        e.y += e.vy * sdt;
        if (e.solid) this.collideWalls(e);
      }
      if (e.x < e.r) { e.x = e.r; if (e.vx < 0) e.vx *= -0.3; }
      if (e.y < e.r) { e.y = e.r; if (e.vy < 0) e.vy *= -0.3; }
      if (e.x > this.w - e.r) { e.x = this.w - e.r; if (e.vx > 0) e.vx *= -0.3; }
      if (e.y > this.h - e.r) { e.y = this.h - e.r; if (e.vy > 0) e.vy *= -0.3; }
    }

    collideWalls(e) {
      for (const w of this.walls) {
        if (w.noCollide) continue;
        if (e.flying && w.low) continue;
        if (e.x + e.r < w.x || e.x - e.r > w.x + w.w || e.y + e.r < w.y || e.y - e.r > w.y + w.h) continue;
        const hit = U.circleRect(e.x, e.y, e.r, w);
        if (!hit) continue;
        e.x += hit.nx * hit.depth;
        e.y += hit.ny * hit.depth;
        const vn = e.vx * hit.nx + e.vy * hit.ny;
        if (vn < 0) {
          if (e.onWall) e.onWall(-vn, w, this);
          if (e.thrown > 0 && -vn > 260) e.onImpact(-vn, null, this);
          const b = e.bounce;
          e.vx -= (1 + b) * vn * hit.nx;
          e.vy -= (1 + b) * vn * hit.ny;
        }
      }
    }

    collideBodies() {
      const B = this._bodies;
      B.length = 0;
      for (const e of this.entities) if (e.body && !e.dead) B.push(e);
      B.sort((a, b) => a.x - a.r - (b.x - b.r));
      for (let i = 0; i < B.length; i++) {
        const a = B[i];
        const ax1 = a.x + a.r;
        for (let j = i + 1; j < B.length; j++) {
          const b = B[j];
          if (b.x - b.r > ax1) break;
          if (a.flying !== b.flying) continue;
          const dx = b.x - a.x, dy = b.y - a.y;
          const rr = a.r + b.r;
          const d2 = dx * dx + dy * dy;
          if (d2 >= rr * rr) continue;
          const d = Math.sqrt(d2);
          const nx = d > 0.01 ? dx / d : 1, ny = d > 0.01 ? dy / d : 0;
          const ima = a.static ? 0 : 1 / a.mass, imb = b.static ? 0 : 1 / b.mass;
          const sum = ima + imb;
          if (sum === 0) continue;
          const overlap = rr - d;
          a.x -= nx * overlap * (ima / sum);
          a.y -= ny * overlap * (ima / sum);
          b.x += nx * overlap * (imb / sum);
          b.y += ny * overlap * (imb / sum);
          const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (rv < 0) {
            const sp = -rv;
            if ((a.thrown > 0 || b.thrown > 0) && sp > 240) {
              a.onImpact(sp, b, this);
              b.onImpact(sp, a, this);
            }
            const jn = (-1.2 * rv) / sum;
            a.vx -= jn * ima * nx;
            a.vy -= jn * ima * ny;
            b.vx += jn * imb * nx;
            b.vy += jn * imb * ny;
          }
        }
      }
    }

    // ---- rendering --------------------------------------------------------
    render(ctx) {
      const cam = this.camera;
      const view = cam.view();
      ctx.save();
      cam.apply(ctx);

      ctx.fillStyle = this.bg;
      ctx.fillRect(view.x0 - 40, view.y0 - 40, view.x1 - view.x0 + 80, view.y1 - view.y0 + 80);
      if (this.floorCanvas) {
        const s = this.floorScale;
        const x0 = Math.max(0, view.x0), y0 = Math.max(0, view.y0);
        const x1 = Math.min(this.w, view.x1), y1 = Math.min(this.h, view.y1);
        if (x1 > x0 && y1 > y0) ctx.drawImage(this.floorCanvas, x0 * s, y0 * s, (x1 - x0) * s, (y1 - y0) * s, x0, y0, x1 - x0, y1 - y0);
      }
      if (this.floorLive) this.floorLive(ctx, this, view);
      for (const d of this.decals) d(ctx, this, view);

      for (const w of this.walls) {
        if (w.x > view.x1 || w.x + w.w < view.x0 || w.y > view.y1 || w.y + w.h < view.y0) continue;
        this.drawWall(ctx, w);
      }

      const vis = [];
      for (const e of this.entities) {
        if (e.dead) continue;
        const m = e.r + 120;
        if (e.x < view.x0 - m || e.x > view.x1 + m || e.y < view.y0 - m || e.y > view.y1 + m) continue;
        vis.push(e);
      }
      vis.sort((a, b) => a.layer - b.layer || a.y - b.y);
      for (const e of vis) e.render(ctx, this);

      if (this.timesight) for (const e of vis) if (e.renderFuture) e.renderFuture(ctx, this);
      if (this.player && this.player.renderFx) this.player.renderFx(ctx, this);
      this.particles.render(ctx, view);
      for (const o of this.overlays) o(ctx, this, view);

      for (const b of this.barks) {
        const a = Math.min(1, b.t * 3, (b.dur - b.t) * 8);
        Gfx.bubble(ctx, b.text, b.e.x, b.e.y - b.e.r - 8, { alpha: a });
      }
      ctx.restore();
    }

    drawWall(ctx, w) {
      const st = this.wallStyles[w.kind] || this.wallStyles.wall;
      if (w.draw) return w.draw(ctx, w, this);
      if (st.draw) return st.draw(ctx, w, this);
      ctx.fillStyle = st.top;
      ctx.fillRect(w.x, w.y, w.w, w.h);
      if (st.face && w.h > 10 && !st.flat) {
        ctx.fillStyle = st.face;
        ctx.fillRect(w.x, w.y + w.h - Math.min(8, w.h * 0.35), w.w, Math.min(8, w.h * 0.35));
      }
      if (st.edge) {
        ctx.strokeStyle = st.edge;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(w.x + 0.75, w.y + 0.75, w.w - 1.5, w.h - 1.5);
      }
    }
  }

  DM.World = World;
  DM.WALL_STYLES = WALL_STYLES;
})();
</script>
<script>/* src/game/entities/npc.js */
/*
 * Character looks (used for both top-down figures and dialogue portraits) and
 * the NPC entity. Add a cast member by adding a LOOKS entry; dialogue lines
 * refer to speakers by these keys.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;

  const LOOKS = {
    jon: { name: 'Jon Osterman', skin: '#ecc8a6', hair: '#3b2a1f', hairStyle: 'short', body: '#ebe7dc', sleeve: '#ebe7dc', legs: '#3a3f4b', bg: '#c4a964', collar: '#8aa1b4', color: '#cfe8ff' },
    manhattan: { name: 'Dr. Manhattan', manhattan: true, skin: '#7fd8ff', body: '#4fc0f2', hair: null, hairStyle: 'bald', bg: '#0c2740', color: '#7fe3ff' },
    janey: { name: 'Janey Slater', skin: '#f1cba9', hair: '#8c3a20', hairStyle: 'long', body: '#5d9384', sleeve: '#f1cba9', legs: '#5d9384', bg: '#d9b26a', color: '#ffd1a8' },
    wally: { name: 'Wally Weaver', skin: '#f0c9ab', hair: '#d6b05a', hairStyle: 'short', body: '#ebe7dc', sleeve: '#ebe7dc', legs: '#4b4339', size: 1.15, bg: '#8fb0a1', glasses: true, color: '#ffe6a0' },
    glass: { name: 'Prof. Milton Glass', skin: '#e2bd9c', hair: '#cfcac2', hairStyle: 'thin', glasses: true, body: '#5a554f', sleeve: '#5a554f', legs: '#3b3835', bg: '#a08e7c', color: '#e8dccb' },
    colonel: { name: 'Colonel Hart', skin: '#dcb08a', hair: '#555555', hat: '#4a5638', hatStyle: 'cap', hatBrim: '#2c3322', badge: '#d8b23a', body: '#5a6a44', sleeve: '#5a6a44', legs: '#4a5638', bg: '#8c9a6a', color: '#d7e3b0' },
    captain: { name: 'Captain Rourke', skin: '#e0b28e', hair: '#3a3a3a', hat: '#1d2b4f', hatStyle: 'cap', hatBrim: '#0f172d', badge: '#d8d8d8', body: '#22345e', sleeve: '#22345e', legs: '#1d2b4f', bg: '#5d7290', moustache: true, color: '#c8d6f0' },
    general: { name: 'General Brandt', skin: '#d9ab86', hair: '#bdbdbd', hat: '#3e4a30', hatStyle: 'cap', hatBrim: '#232a1a', badge: '#e8c54a', body: '#4d5b3a', sleeve: '#4d5b3a', legs: '#3e4a30', bg: '#9b8a5a', color: '#e6dfb0' },
    reporter: { name: 'Reporter', skin: '#e6bf9b', hair: '#5a3b26', hairStyle: 'short', body: '#7b5e3c', sleeve: '#7b5e3c', legs: '#3b3530', bg: '#a66b6b', color: '#f0c8c8' },
    reporter2: { name: 'Reporter', skin: '#d9a77f', hair: '#1f1a17', hairStyle: 'long', body: '#7a3b4a', sleeve: '#7a3b4a', legs: '#2b2427', bg: '#8b6b9a', color: '#f0c8e0' },
    host: { name: 'TV Host', skin: '#eac2a0', hair: '#6b4a2b', hairStyle: 'slick', body: '#2e3b5a', sleeve: '#2e3b5a', legs: '#1f2638', bg: '#4f6a8a', color: '#d0e0ff' },
    laurie: { name: 'Laurie Juspeczyk', skin: '#f2cfb0', hair: '#2b1a14', hairStyle: 'long', body: '#1c1c22', sleeve: '#1c1c22', legs: '#1c1c22', trim: '#f2c94c', bg: '#c7a2c2', color: '#ffd6f0' },
    veidt: { name: 'Adrian Veidt', skin: '#f0d0b2', hair: '#e7cf72', hairStyle: 'slick', body: '#6f4aa6', sleeve: '#6f4aa6', legs: '#3d2a5e', cape: '#d4ad3a', trim: '#d4ad3a', bg: '#d6b85a', collar: '#d4ad3a', color: '#f3e0a0' },
  };

  const GANG = {
    hats: ['#2d2620', '#3a2f28', '#262a30', '#4a3b2a', '#1f1f24'],
    suits: ['#3b3a3f', '#4b3f36', '#2f3a45', '#5a4a3a', '#43363b'],
    skins: ['#e6bf9b', '#d9a77f', '#c98f66', '#f0c9ab', '#a8714c'],
  };
  LOOKS.randomGangster = () => {
    const suit = U.pick(GANG.suits);
    return { name: 'Gangster', skin: U.pick(GANG.skins), hat: U.pick(GANG.hats), hatBrim: '#17130f', body: suit, sleeve: suit, legs: '#1d1b1c', bg: '#6a5a4a' };
  };

  class NPC extends DM.Entity {
    constructor(o) {
      super({ x: o.x, y: o.y, r: 13, mass: 40, friction: 10, disintegratable: false, team: 'neutral' });
      this.look = typeof o.look === 'string' ? LOOKS[o.look] : o.look;
      this.facing = o.facing || 0;
      this.baseFacing = this.facing;
      this.walk = 0;
      this.moving = false;
      this.speedBase = o.speed || 120;
      this.lookAtPlayer = o.lookAtPlayer !== false;
      this.moveTarget = null;
      if (o.talk) {
        const first = (this.look.name || 'them').split(' ')[0];
        this.interact = { label: o.label || 'Talk to ' + first, range: o.range || 62, onInteract: o.talk, enabled: o.enabled };
      }
    }
    walkTo(x, y) {
      this.moveTarget = { x, y };
    }
    update(dt, world) {
      if (this.moveTarget) {
        const d = U.dist(this.x, this.y, this.moveTarget.x, this.moveTarget.y);
        if (d < 6) {
          this.moveTarget = null;
        } else {
          const n = U.norm(this.moveTarget.x - this.x, this.moveTarget.y - this.y);
          this.vx = U.damp(this.vx, n.x * this.speedBase, 8, dt);
          this.vy = U.damp(this.vy, n.y * this.speedBase, 8, dt);
          this.facing = U.dampAngle(this.facing, Math.atan2(n.y, n.x), 10, dt);
        }
      }
      this.moving = this.speed > 15;
      if (this.moving) this.walk += dt * this.speed * 0.09;
      if (!this.moveTarget) {
        const p = world.player;
        if (this.lookAtPlayer && p && !p.hidden && U.dist(this.x, this.y, p.x, p.y) < 180) this.facing = U.dampAngle(this.facing, U.angleTo(this.x, this.y, p.x, p.y), 6, dt);
        else this.facing = U.dampAngle(this.facing, this.baseFacing, 3, dt);
      }
    }
    render(ctx) {
      Gfx.figure(ctx, Object.assign({}, this.look, { x: this.x, y: this.y, angle: this.facing, walk: this.walk, moving: this.moving }));
    }
  }

  DM.LOOKS = LOOKS;
  DM.NPC = NPC;
})();
</script>
<script>/* src/game/entities/player.js */
/*
 * The player: Jon. One entity across the whole journey, with three forms:
 *   human     — Jon Osterman, 1959. Walks, talks, interacts.
 *   awareness — a lone hydrogen atom drifting through the void, gathering itself.
 *   manhattan — Dr. Manhattan. Uses whatever powers have been unlocked.
 *
 * Powers live in src/game/powers.js; the player just owns their per-power state
 * (this.powers[id]) and calls each power's update every frame.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Input = DM.Input;

  const SPEED = { human: 165, awareness: 250, manhattan: 215 };

  class Player extends DM.Entity {
    constructor(x, y) {
      super({ x, y, r: 13, mass: 3, friction: 9, team: 'player', disintegratable: false });
      this.isPlayer = true;
      this.timeless = true;
      this.targetable = true;
      this.form = 'human';
      this.look = Object.assign({}, DM.LOOKS.jon);
      this.facing = 0;
      this.walk = 0;
      this.moving = false;

      this.energy = 100;
      this.maxEnergy = 100;
      this.energyRegen = 20;
      this.coherence = 100;
      this.maxCoherence = 100;
      this.regenDelay = 0;

      this.baseR = 13;
      this.scale = 1;
      this.targetScale = 1;
      this.expandT = 0;

      this.powers = {};
      this.locked = false;
      this.hidden = false;
      this.down = false;
      this.invuln = 0;
      this.godMode = false;
      this.hurtT = 0;
      this.jamT = 0;
      this.speedMul = 1;
      this.noEnergyT = 0;

      // awareness form
      this.carry = 0;
      this.carryMax = 25;
      this.basePull = 85;
      this.pullRadius = 85;

      this.interactTarget = null;
    }

    get speedMax() {
      return (SPEED[this.form] || 200) * this.speedMul * (this.scale > 1.3 ? 0.9 : 1);
    }
    get canUsePowers() {
      return !this.locked && !this.down && this.form !== 'human';
    }
    get jammed() {
      return this.jamT > 0;
    }
    tkMaxMass() {
      return this.scale > 1.3 ? 40 : 9;
    }

    unlock(id) {
      if (!this.powers[id]) this.powers[id] = { cd: 0, active: false };
    }
    has(id) {
      return !!this.powers[id];
    }

    setForm(form) {
      this.form = form;
      if (form === 'awareness') {
        this.r = 10;
        this.baseR = 10;
      } else {
        this.baseR = 13;
      }
    }

    // Spend energy for a power; flashes the meter when short.
    spend(amount) {
      if (this.energy < amount) {
        this.noEnergyT = 0.4;
        DM.Audio.play('fail');
        return false;
      }
      this.energy -= amount;
      return true;
    }

    update(dt, world) {
      this.invuln = Math.max(0, this.invuln - dt);
      this.hurtT = Math.max(0, this.hurtT - dt);
      this.jamT = Math.max(0, this.jamT - dt);
      this.noEnergyT = Math.max(0, this.noEnergyT - dt);

      this.scale = U.damp(this.scale, this.targetScale, 6, dt);
      this.r = this.baseR * this.scale;
      this.mass = 3 * this.scale * this.scale;

      const ax = this.locked || this.down ? { x: 0, y: 0 } : Input.axis();
      const sp = this.speedMax;
      const accel = this.form === 'awareness' ? 4.5 : 14;
      this.vx = U.damp(this.vx, ax.x * sp, accel, dt);
      this.vy = U.damp(this.vy, ax.y * sp, accel, dt);
      const v = this.speed;
      this.moving = v > 20;
      if (this.moving) this.walk += dt * v * 0.09;

      if (this.form === 'human' || this.locked) {
        if (this.moving) this.facing = U.dampAngle(this.facing, Math.atan2(this.vy, this.vx), 12, dt);
      } else {
        this.facing = U.dampAngle(this.facing, U.angleTo(this.x, this.y, world.mouse.x, world.mouse.y), 14, dt);
      }

      this.drain = false;
      for (const def of DM.Powers.list) {
        const st = this.powers[def.id];
        if (!st || !def.forms.includes(this.form)) continue;
        st.cd = Math.max(0, st.cd - dt);
        def.update(this, st, world, dt);
      }
      if (!this.drain) this.energy = Math.min(this.maxEnergy, this.energy + this.energyRegen * (this.jammed ? 0.35 : 1) * dt);
      this.energy = Math.max(0, this.energy);

      if (this.regenDelay > 0) this.regenDelay -= dt;
      else if (!this.down) this.coherence = Math.min(this.maxCoherence, this.coherence + 9 * dt);

      if (this.expandT > 0) {
        this.expandT -= dt;
        if (this.expandT <= 0) {
          this.targetScale = 1;
          world.camera.targetZoom = world.baseZoom;
        }
      }

      // Low coherence: Jon starts shedding particles.
      if (this.form === 'manhattan' && this.coherence < 35 && Math.random() < dt * 20) {
        world.particles.emit(this.x + U.rand(-10, 10), this.y + U.rand(-10, 10), { vx: U.rand(-40, 40), vy: U.rand(-40, 40), life: 0.6, size: 2.5, color: '#7fe3ff' });
      }

      this.updateInteraction(world);
    }

    updateInteraction(world) {
      this.interactTarget = null;
      if (this.locked || this.down) return;
      let best = null;
      let bd = Infinity;
      for (const e of world.entities) {
        const it = e.interact;
        if (!it || e.dead) continue;
        if (it.enabled && !it.enabled()) continue;
        const d = U.dist(this.x, this.y, e.x, e.y);
        if (d < (it.range || 60) && d < bd) {
          bd = d;
          best = e;
        }
      }
      this.interactTarget = best;
      if (best && Input.pressed('interact')) {
        Input.consume('interact');
        Input.consume('confirm');
        best.interact.onInteract(best, this);
      }
    }

    damage(amount, source, kind) {
      if (this.invuln > 0 || this.down || this.godMode || this.form === 'human') return false;
      if (this.scale > 1.4 && (kind === 'bullet' || kind === 'pulse')) amount *= 0.15;
      this.coherence -= amount;
      this.regenDelay = 2.6;
      this.hurtT = 0.25;
      DM.Audio.play('hit');
      if (this.world) this.world.camera.shake(Math.min(0.5, 0.12 + amount / 80));
      if (this.coherence <= 0) {
        this.coherence = 0;
        this.down = true;
        this.vx = this.vy = 0;
        DM.Events.emit('player:down', this);
      }
      return true;
    }

    // Thrown objects never hurt their thrower.
    onImpact() {}

    render(ctx, world) {
      if (this.hidden) return;
      const t = this.age;
      if (this.form === 'human') {
        Gfx.figure(ctx, Object.assign({}, this.look, { x: this.x, y: this.y, angle: this.facing, walk: this.walk, moving: this.moving }));
      } else if (this.form === 'awareness') {
        ctx.save();
        ctx.strokeStyle = 'rgba(127,227,255,0.18)';
        ctx.setLineDash([4, 8]);
        ctx.lineDashOffset = -t * 20;
        ctx.lineWidth = 1.5;
        Gfx.circle(ctx, this.x, this.y, this.pullRadius);
        ctx.stroke();
        ctx.restore();
        Gfx.awareness(ctx, this.x, this.y, t, 1 + Math.min(0.6, this.carry / 60), this.invuln > 0 ? 0.5 + Math.sin(t * 40) * 0.3 : 1);
      } else {
        let alpha = 1;
        if (this.coherence < 35) alpha = 0.65 + Math.random() * 0.35;
        if (this.down) alpha = 0.4;
        Gfx.manhattan(ctx, { x: this.x, y: this.y, angle: this.facing, walk: this.walk, moving: this.moving, scale: this.scale, t, alpha, flash: this.hurtT * 3 });
      }
    }

    // Power effects drawn above entities (beams, reticles).
    renderFx(ctx, world) {
      if (this.hidden) return;
      for (const def of DM.Powers.list) {
        const st = this.powers[def.id];
        if (!st || !def.render || !def.forms.includes(this.form)) continue;
        def.render(ctx, this, st, world);
      }
    }
  }

  DM.Player = Player;
})();
</script>
<script>/* src/game/powers.js */
/*
 * Powers registry.
 *
 * A power is a plain definition object:
 *   id, name, action (Input action), forms (which player forms can use it),
 *   color, cost, cooldown, desc, tip (shown on the unlock card)
 *   update(player, state, world, dt)   — every frame while unlocked
 *   render(ctx, player, state, world)  — optional world-space effects
 *
 * Per-player state lives in player.powers[id] = { cd, active, ... }.
 * The HUD shows every unlocked power for the current form, in registration
 * order. To add a power: register it here, then grant it from a chapter stage
 * (`grants: ['myPower']` + `yield ctx.unlock('myPower')`).
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Input = DM.Input;
  const Audio = DM.Audio;

  const Powers = { list: [], byId: {} };
  Powers.register = (def) => {
    def.forms = def.forms || ['manhattan'];
    def.cost = def.cost || 0;
    def.cooldown = def.cooldown || 0;
    Powers.list.push(def);
    Powers.byId[def.id] = def;
    return def;
  };
  Powers.get = (id) => Powers.byId[id];

  // Clamp a point to within `range` of the player.
  function reach(p, x, y, range) {
    const dx = x - p.x, dy = y - p.y;
    const d = Math.hypot(dx, dy);
    if (d <= range) return { x, y, clamped: false };
    return { x: p.x + (dx / d) * range, y: p.y + (dy / d) * range, clamped: true };
  }

  // ---- Coalesce (awareness form) -------------------------------------------
  Powers.register({
    id: 'coalesce',
    name: 'Coalesce',
    action: 'telekinesis',
    forms: ['awareness'],
    color: '#9fe8ff',
    desc: 'Your scattered atoms drift toward you when you pass near them.',
    tip: 'Hold LEFT CLICK to widen your pull. Return to the chamber to rebuild yourself.',
    update(p, s, world, dt) {
      s.active = p.canUsePowers && Input.down('telekinesis') && p.energy > 1;
      if (s.active) {
        p.drain = true;
        p.energy -= 20 * dt;
      }
      p.pullRadius = U.damp(p.pullRadius, p.basePull * (s.active ? 2.1 : 1), 8, dt);
    },
  });

  // ---- Telekinesis ---------------------------------------------------------
  function findGrab(world, p, mx, my, range) {
    let best = null, bd = Infinity;
    for (const e of world.entities) {
      if (!e.grabbable || e.dead || e === p) continue;
      if (e.heldBy && e.heldBy !== p) continue;
      const dm = U.dist(mx, my, e.x, e.y) - e.r;
      if (dm > 30) continue;
      if (U.dist(p.x, p.y, e.x, e.y) > range + e.r) continue;
      if (dm < bd) {
        bd = dm;
        best = e;
      }
    }
    return best;
  }
  function tkRelease(p, s, world, quiet) {
    const e = s.target;
    s.target = null;
    s.active = false;
    Audio.hum('tk', false);
    if (!e) return;
    if (e.heldBy === p) {
      e.heldBy = null;
      e.thrown = 1.0;
      e.vx *= 1.15;
      e.vy *= 1.15;
      if (e.team === 'enemy') e.stun = Math.max(e.stun, 0.9); // no mid-air recovery
      if (e.onRelease) e.onRelease(p, world);
      if (!quiet && e.speed > 260) Audio.play('throw');
    }
  }

  Powers.register({
    id: 'telekinesis',
    name: 'Telekinesis',
    action: 'telekinesis',
    color: '#5fd4ff',
    desc: 'Lift objects (and people) with your mind.',
    tip: 'HOLD LEFT CLICK on something to lift it. Move the mouse to carry it. Flick and let go to throw. Thrown people are knocked out, not killed.',
    range: 430,
    update(p, s, world, dt) {
      const m = world.mouse;
      const range = this.range * p.scale;
      if (s.target && (s.target.dead || s.target.heldBy !== p || !s.target.grabbable || !Input.down('telekinesis') || !p.canUsePowers || p.energy <= 0)) {
        tkRelease(p, s, world);
      }
      if (!s.target) {
        s.hover = p.canUsePowers ? findGrab(world, p, m.x, m.y, range) : null;
        if (p.canUsePowers && Input.pressed('telekinesis') && s.hover) {
          const e = s.hover;
          if (e.mass > p.tkMaxMass()) {
            Audio.play('fail');
            world.bark(p, p.has('expand') ? 'Too massive. I need to be larger.' : 'Too massive.', 1.4);
          } else {
            s.target = e;
            e.heldBy = p;
            if (e.onGrab) e.onGrab(p, world);
            Audio.play('tk_grab');
          }
        }
        return;
      }
      const e = s.target;
      s.active = true;
      p.drain = true;
      p.energy -= (3 + e.mass * 1.1) * dt;
      const pt = reach(p, m.x, m.y, range);
      const sq = Math.sqrt(Math.max(0.5, e.mass));
      const maxV = (1150 / sq) * Math.max(1, p.scale * 0.8);
      let tvx = (pt.x - e.x) * 10, tvy = (pt.y - e.y) * 10;
      const tl = Math.hypot(tvx, tvy);
      if (tl > maxV) {
        tvx *= maxV / tl;
        tvy *= maxV / tl;
      }
      const resp = (16 / sq) * p.scale;
      e.vx = U.damp(e.vx, tvx, resp, dt);
      e.vy = U.damp(e.vy, tvy, resp, dt);
      e.thrown = Math.max(e.thrown, 0.15);
      Audio.hum('tk', true, { freq: 70, cutoff: 420, gain: 0.04, mod: Math.min(2, e.speed / 500) });
      if (Math.random() < dt * 30) world.particles.emit(e.x + U.rand(-e.r, e.r), e.y + U.rand(-e.r, e.r), { vx: U.rand(-20, 20), vy: U.rand(-20, 20), life: 0.5, size: 2, color: '#9fe8ff' });
    },
    render(ctx, p, s, world) {
      const t = world.realTime || 0;
      if (s.hover && !s.target) {
        const e = s.hover;
        const heavy = e.mass > p.tkMaxMass();
        ctx.save();
        ctx.strokeStyle = heavy ? 'rgba(255,120,100,0.6)' : 'rgba(127,227,255,0.65)';
        ctx.setLineDash([5, 5]);
        ctx.lineDashOffset = -t * 30;
        ctx.lineWidth = 1.5;
        Gfx.circle(ctx, e.x, e.y, e.r + 7);
        ctx.stroke();
        ctx.restore();
      }
      const e = s.target;
      if (!e) return;
      const hx = p.x + Math.cos(p.facing) * 14 * p.scale, hy = p.y + Math.sin(p.facing) * 14 * p.scale;
      const dx = e.x - hx, dy = e.y - hy;
      const d = Math.hypot(dx, dy) || 1;
      const nx = -dy / d, ny = dx / d;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let k = 0; k < 3; k++) {
        ctx.strokeStyle = k === 0 ? 'rgba(127,227,255,0.55)' : 'rgba(95,212,255,0.25)';
        ctx.lineWidth = k === 0 ? 2 : 5 - k;
        ctx.beginPath();
        for (let i = 0; i <= 18; i++) {
          const f = i / 18;
          const w = Math.sin(f * Math.PI) * Math.sin(t * 9 + f * 10 + k * 2) * (6 + k * 3);
          const x = hx + dx * f + nx * w, y = hy + dy * f + ny * w;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      ctx.restore();
      Gfx.glow(ctx, e.x, e.y, e.r * 2.6, '#5fd4ff', 0.55);
      ctx.save();
      ctx.strokeStyle = 'rgba(190,240,255,0.8)';
      ctx.lineWidth = 1.5;
      Gfx.circle(ctx, e.x, e.y, e.r + 5 + Math.sin(t * 8) * 1.5);
      ctx.stroke();
      ctx.restore();
    },
  });

  // ---- Disintegrate --------------------------------------------------------
  Powers.register({
    id: 'disintegrate',
    name: 'Disintegrate',
    action: 'disintegrate',
    color: '#ffb27a',
    cost: 20,
    cooldown: 0.45,
    range: 520,
    desc: 'Undo the bonds that hold matter together. Permanent.',
    tip: 'Press Q or RIGHT CLICK to disintegrate whatever is under the cursor. Tougher things take several hits.',
    update(p, s, world, dt) {
      s.pending = s.pending || [];
      for (const b of s.pending) {
        b.t -= dt;
        if (b.t <= 0) this.resolve(p, b, world);
      }
      s.pending = s.pending.filter((b) => b.t > 0);
      if (!p.canUsePowers || !Input.pressed('disintegrate') || s.cd > 0) return;
      if (!p.spend(this.cost)) return;
      s.cd = this.cooldown;
      const pt = reach(p, world.mouse.x, world.mouse.y, this.range * p.scale);
      const b = { x: pt.x, y: pt.y, t: 0.16, r: p.scale > 1.3 ? 80 : 50 };
      s.pending.push(b);
      world.particles.implode(b.x, b.y, b.r * 1.2, 14, { life: 0.16 });
      world.emitCast(b);
      Audio.play('dis_charge');
    },
    resolve(p, b, world) {
      let hits = 0;
      for (const e of world.entities) {
        if (e.dead || e === p || e.team === 'player') continue;
        if (!e.disintegratable) continue;
        if (U.dist(b.x, b.y, e.x, e.y) > b.r + e.r * 0.6) continue;
        if (e.shieldR && U.dist(p.x, p.y, e.x, e.y) > e.shieldR) {
          if (e.onShieldBlock) e.onShieldBlock(world);
          continue;
        }
        hits++;
        if (e.hp == null || e.hp <= 70 || e.alwaysDisintegrate) e.disintegrate(world, p);
        else e.damage(70, p, 'disintegrate');
      }
      const P = world.particles;
      P.emit(b.x, b.y, { shape: 'ring', size: 6, size1: b.r * 1.3, life: 0.3, color: '#dff7ff', drag: 0 });
      P.burst(b.x, b.y, 18, { color: ['#ffffff', '#bff1ff', '#ffb27a'], speed: [80, 300], life: [0.15, 0.4], size: [1.5, 3], shape: 'spark', drag: 4 });
      Audio.play('disintegrate');
      world.camera.shake(hits ? 0.22 : 0.08);
      DM.Events.emit('power:disintegrate', { x: b.x, y: b.y, hits });
    },
    render(ctx, p, s, world) {
      if (!p.canUsePowers) return;
      for (const b of s.pending || []) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255,220,190,0.9)';
        ctx.lineWidth = 2;
        Gfx.circle(ctx, b.x, b.y, b.r * (0.4 + b.t * 3));
        ctx.stroke();
        ctx.restore();
      }
      const pt = reach(p, world.mouse.x, world.mouse.y, this.range * p.scale);
      if (pt.clamped) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255,178,122,0.35)';
        ctx.setLineDash([3, 5]);
        Gfx.line(ctx, pt.x, pt.y, world.mouse.x, world.mouse.y);
        Gfx.circle(ctx, pt.x, pt.y, 6);
        ctx.stroke();
        ctx.restore();
      }
    },
  });

  // ---- Teleport -------------------------------------------------------------
  Powers.register({
    id: 'teleport',
    name: 'Teleport',
    action: 'teleport',
    color: '#c9a7ff',
    cost: 16,
    cooldown: 0.5,
    range: 380,
    desc: 'Be somewhere else. Walls, chasms and shields do not apply.',
    tip: 'Press SPACE to teleport to the cursor (within range).',
    update(p, s, world, dt) {
      if (!p.canUsePowers || !Input.pressed('teleport') || s.cd > 0) return;
      const pt = reach(p, world.mouse.x, world.mouse.y, this.range * p.scale);
      const dx = pt.x - p.x, dy = pt.y - p.y;
      const d = Math.hypot(dx, dy);
      let dest = null;
      for (let k = 0; k <= d; k += 10) {
        const f = (d - k) / (d || 1);
        const x = p.x + dx * f, y = p.y + dy * f;
        if (world.isFree(x, y, p.r)) {
          dest = { x, y };
          break;
        }
      }
      if (!dest || U.dist(p.x, p.y, dest.x, dest.y) < 20) {
        Audio.play('fail');
        return;
      }
      if (!p.spend(this.cost)) return;
      s.cd = this.cooldown;
      const from = { x: p.x, y: p.y };
      world.add(new DM.Special.Afterimage(p));
      world.particles.burst(p.x, p.y, 22, { color: ['#7fe3ff', '#c9a7ff', '#ffffff'], speed: [30, 160], life: [0.3, 0.7], size: [1.5, 3] });
      p.x = dest.x;
      p.y = dest.y;
      p.vx *= 0.3;
      p.vy *= 0.3;
      p.invuln = Math.max(p.invuln, 0.35);
      p.teleportedAt = world.realTime;
      world.particles.emit(p.x, p.y, { shape: 'ring', size: 4, size1: 40 * p.scale, life: 0.3, color: '#c9a7ff', drag: 0 });
      world.particles.burst(p.x, p.y, 18, { color: ['#7fe3ff', '#ffffff'], speed: [60, 220], life: [0.2, 0.5], size: [1.5, 3] });
      Audio.play('teleport');
      DM.Events.emit('player:teleport', { from, to: dest });
    },
  });

  // ---- Quantum Duplication ---------------------------------------------------
  Powers.register({
    id: 'duplicate',
    name: 'Duplicate',
    action: 'duplicate',
    color: '#7bd88f',
    cost: 50,
    cooldown: 9,
    desc: 'Divide your attention. And yourself.',
    tip: 'Press R to split off two copies of yourself. They hunt nearby threats for a few seconds.',
    update(p, s, world, dt) {
      if (!p.canUsePowers || !Input.pressed('duplicate')) return;
      if (s.cd > 0) {
        Audio.play('fail');
        return;
      }
      if (!p.spend(this.cost)) return;
      s.cd = this.cooldown;
      const mine = world.entities.filter((e) => e.isDuplicate && !e.dead);
      while (mine.length > 2) mine.shift().expire(world);
      for (const side of [-1, 1]) {
        const a = p.facing + side * 1.9;
        let x = p.x + Math.cos(a) * 42, y = p.y + Math.sin(a) * 42;
        if (!world.isFree(x, y, 12)) {
          x = p.x;
          y = p.y;
        }
        world.add(new DM.Special.Duplicate(p, x, y, 10));
        world.particles.burst(x, y, 16, { color: ['#7fe3ff', '#7bd88f', '#ffffff'], speed: [40, 180], life: [0.2, 0.6], size: [1.5, 3] });
      }
      Audio.play('duplicate');
    },
  });

  // ---- Temporal Sight -------------------------------------------------------
  Powers.register({
    id: 'timesight',
    name: 'Temporal Sight',
    action: 'timesight',
    color: '#f2c418',
    desc: 'See every moment at once. The world slows; what is about to happen becomes visible.',
    tip: 'HOLD F or SHIFT. Time slows, incoming danger is marked and hidden memories appear. Drains energy.',
    update(p, s, world, dt) {
      const want = p.canUsePowers && Input.down('timesight') && p.energy > 0.5 && !p.jammed;
      if (want !== s.active) {
        s.active = want;
        Audio.play(want ? 'timesight_on' : 'timesight_off');
        Audio.setMusicFilter(want ? 650 : 18000);
        if (!want && p.jammed && Input.down('timesight')) world.bark(p, 'Tachyons. I cannot see.', 1.4);
      }
      world.slowmo = s.active;
      world.timesight = s.active;
      if (s.active) {
        p.drain = true;
        p.energy -= 12 * dt;
      }
    },
  });

  // ---- Expand ---------------------------------------------------------------
  Powers.register({
    id: 'expand',
    name: 'Expand',
    action: 'expand',
    color: '#ff8fb8',
    cost: 55,
    cooldown: 16,
    desc: 'Mass is a matter of opinion. Grow, briefly, to the size of a building.',
    tip: 'Press G to grow for a few seconds: a shockwave, triple strength, bullets barely register, and you can lift the heaviest things.',
    update(p, s, world, dt) {
      if (!p.canUsePowers || !Input.pressed('expand')) return;
      if (s.cd > 0 || p.expandT > 0) {
        Audio.play('fail');
        return;
      }
      if (!p.spend(this.cost)) return;
      s.cd = this.cooldown;
      p.expandT = 7;
      p.targetScale = 2.2;
      world.camera.targetZoom = world.baseZoom * 0.8;
      for (const e of world.entities) {
        if (e === p || e.dead || e.static || e.team === 'player') continue;
        const d = U.dist(p.x, p.y, e.x, e.y);
        if (d > 260) continue;
        const n = U.norm(e.x - p.x, e.y - p.y);
        const k = 1 - d / 260;
        e.vx += (n.x * 900 * k) / Math.sqrt(e.mass);
        e.vy += (n.y * 900 * k) / Math.sqrt(e.mass);
        if (e.team === 'enemy') {
          e.stun = Math.max(e.stun, 1.2);
          e.thrown = 0.6;
        }
        if (e.isProjectile) e.die('blocked');
      }
      world.particles.emit(p.x, p.y, { shape: 'ring', size: 20, size1: 270, life: 0.45, color: '#ff8fb8', drag: 0 });
      world.particles.burst(p.x, p.y, 40, { color: ['#7fe3ff', '#ff8fb8', '#ffffff'], speed: [200, 520], life: [0.3, 0.7], size: [2, 4], shape: 'spark', drag: 3 });
      world.camera.shake(0.6);
      Audio.play('expand');
    },
  });

  DM.Powers = Powers;
})();
</script>
<script>/* src/game/entities/props.js */
/* Props: crates, barrels, vehicles, doors, target zones, training dummies, and generic set dressing. */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Entity = DM.Entity;

  // Rotation that follows motion, so thrown boxes tumble.
  function tumble(e, dt) {
    e.rot = (e.rot || 0) + (e.vx * 0.004 - e.vy * 0.002) * dt * 60 * 0.15;
  }

  class Crate extends Entity {
    constructor(x, y, o = {}) {
      super(Object.assign({ x, y, r: 15, mass: 1.5, friction: 5, hp: 60, grabbable: true, colors: ['#a07a4a', '#7a5a34', '#c49a62'], tags: ['crate'] }, o));
      this.rot = U.rand(0, Math.PI);
      this.style = o.style || 'wood';
    }
    update(dt) {
      tumble(this, dt);
    }
    onDeath(kind) {
      if (kind !== 'disintegrate' && this.world) this.world.particles.burst(this.x, this.y, 16, { color: this.colors, speed: [60, 220], life: [0.4, 0.9], size: [3, 6], shape: 'shard', vr: 12, add: false, drag: 3 });
    }
    render(ctx) {
      const s = this.r * 1.75;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(-s / 2 + 3, -s / 2 + 4, s, s);
      ctx.rotate(this.rot);
      if (this.style === 'metal') {
        ctx.fillStyle = '#5d6b4a';
        ctx.fillRect(-s / 2, -s / 2, s, s);
        ctx.strokeStyle = '#3a4430';
        ctx.lineWidth = 2;
        ctx.strokeRect(-s / 2 + 3, -s / 2 + 3, s - 6, s - 6);
        ctx.fillStyle = '#e8d27a';
        ctx.fillRect(-s / 4, -2, s / 2, 4);
      } else {
        ctx.fillStyle = '#a57d4b';
        ctx.fillRect(-s / 2, -s / 2, s, s);
        ctx.strokeStyle = '#6e5130';
        ctx.lineWidth = 2;
        ctx.strokeRect(-s / 2 + 1, -s / 2 + 1, s - 2, s - 2);
        Gfx.line(ctx, -s / 2, -s / 2, s / 2, s / 2);
        Gfx.line(ctx, -s / 2, s / 2, s / 2, -s / 2);
      }
      if (this.hitFlash > 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillRect(-s / 2, -s / 2, s, s);
      }
      ctx.restore();
    }
  }

  class Barrel extends Entity {
    constructor(x, y, o = {}) {
      super(Object.assign({ x, y, r: 12, mass: 1.2, friction: 4, hp: 25, grabbable: true, colors: ['#b8402e', '#7a2a1e', '#e0c060'] }, o));
    }
    onDeath(kind) {
      if (kind === 'disintegrate' || !this.world) return;
      this.world.defer((w) => w.explode(this.x, this.y, 85, 45, { source: this }));
    }
    render(ctx) {
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      Gfx.circle(ctx, this.x + 3, this.y + 4, this.r);
      ctx.fill();
      ctx.fillStyle = this.hitFlash > 0 ? '#ffd0c0' : '#b8402e';
      Gfx.circle(ctx, this.x, this.y, this.r);
      ctx.fill();
      ctx.strokeStyle = '#6e2318';
      ctx.lineWidth = 2;
      Gfx.circle(ctx, this.x, this.y, this.r * 0.65);
      ctx.stroke();
      ctx.fillStyle = '#f2c418';
      ctx.font = Gfx.font(9, DM.FONTS.display, 700);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('!', this.x, this.y + 1);
    }
  }

  // Vehicles: jeep / sedan / wreck. Heavy, grabbable, great for throwing.
  class Vehicle extends Entity {
    constructor(x, y, o = {}) {
      super(Object.assign({ x, y, r: 26, mass: 5, friction: 4, hp: 400, grabbable: true, colors: ['#556b3a', '#3a4a28', '#222'] }, o));
      this.rot = o.rot || 0;
      this.kind = o.kind || 'jeep';
      this.paint = o.paint || (this.kind === 'sedan' ? U.pick(['#7a2e2e', '#2e4a7a', '#2f2f33', '#6b6b4a']) : '#556b3a');
      this.burnt = this.kind === 'wreck';
    }
    update(dt) {
      if (this.speed > 30) this.rot = U.dampAngle(this.rot, Math.atan2(this.vy, this.vx), 2, dt);
      if (this.heldBy) this.rot += dt * 0.6;
    }
    onDeath(kind) {
      if (kind !== 'disintegrate' && this.world) this.world.defer((w) => w.explode(this.x, this.y, 90, 30, { source: this }));
    }
    render(ctx) {
      const L = this.r * 2.4, W = this.r * 1.35;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(-L / 2 + 4, -W / 2 + 5, L, W);
      ctx.rotate(this.rot);
      ctx.fillStyle = '#151515';
      for (const sx of [-1, 1]) for (const sy of [-1, 1]) ctx.fillRect(sx * L * 0.3 - 6, sy * W * 0.5 - 4, 12, 8);
      ctx.fillStyle = this.burnt ? '#3a332c' : this.paint;
      Gfx.rr(ctx, -L / 2, -W / 2, L, W, 6);
      ctx.fill();
      ctx.fillStyle = this.burnt ? '#241f1b' : 'rgba(0,0,0,0.25)';
      ctx.fillRect(-L * 0.1, -W / 2 + 3, L * 0.32, W - 6);
      ctx.fillStyle = this.burnt ? '#1b1815' : 'rgba(170,210,230,0.55)';
      ctx.fillRect(L * 0.18, -W / 2 + 4, 6, W - 8);
      if (this.kind === 'jeep') {
        ctx.fillStyle = '#e8e2c8';
        Gfx.circle(ctx, -L * 0.25, 0, 5);
        ctx.fill();
      }
      if (this.hitFlash > 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.fillRect(-L / 2, -W / 2, L, W);
      }
      ctx.restore();
    }
  }

  // Generic set dressing or interactable. Pass draw(ctx, e, world).
  class Prop extends Entity {
    constructor(o) {
      super(Object.assign({ r: 14, static: true, body: false, solid: false, disintegratable: false, layer: 0 }, o));
      this.drawFn = o.draw || null;
      this.data = o.data || {};
    }
    render(ctx, world) {
      if (this.drawFn) this.drawFn(ctx, this, world);
    }
  }

  // A sliding door that toggles a wall rect.
  class Door extends Entity {
    constructor(world, x, y, w, h, o = {}) {
      super({ x: x + w / 2, y: y + h / 2, r: 4, static: true, body: false, solid: false, disintegratable: false, layer: 1 });
      this.rect = { x, y, w, h };
      this.wall = world.wall(x, y, w, h, 'door');
      this.open = !!o.open;
      this.k = this.open ? 1 : 0;
      this.vertical = h > w;
      this.color = o.color || '#8a929c';
      this.stripe = o.stripe || '#f2c418';
      this.wall.noCollide = this.open;
    }
    setOpen(v) {
      if (v === this.open) return;
      this.open = v;
      DM.Audio.play('door');
    }
    update(dt) {
      this.k = U.approach(this.k, this.open ? 1 : 0, dt * 2.6);
      this.wall.noCollide = this.k > 0.55;
    }
    render(ctx) {
      const R = this.rect;
      const k = this.k;
      ctx.save();
      ctx.fillStyle = '#1a1d22';
      ctx.fillRect(R.x, R.y, R.w, R.h);
      ctx.fillStyle = this.color;
      if (this.vertical) {
        const half = (R.h / 2) * (1 - k);
        ctx.fillRect(R.x, R.y, R.w, half);
        ctx.fillRect(R.x, R.y + R.h - half, R.w, half);
        ctx.fillStyle = this.stripe;
        if (half > 4) {
          ctx.fillRect(R.x, R.y + half - 4, R.w, 3);
          ctx.fillRect(R.x, R.y + R.h - half + 1, R.w, 3);
        }
      } else {
        const half = (R.w / 2) * (1 - k);
        ctx.fillRect(R.x, R.y, half, R.h);
        ctx.fillRect(R.x + R.w - half, R.y, half, R.h);
        ctx.fillStyle = this.stripe;
        if (half > 4) {
          ctx.fillRect(R.x + half - 4, R.y, 3, R.h);
          ctx.fillRect(R.x + R.w - half + 1, R.y, 3, R.h);
        }
      }
      ctx.restore();
    }
  }

  // A marked area that absorbs accepted entities (crates in the test range).
  class Zone extends Entity {
    constructor(x, y, r, o = {}) {
      super({ x, y, r, static: true, body: false, solid: false, disintegratable: false, layer: 0 });
      this.accept = o.accept || (() => false);
      this.onAccept = o.onAccept || null;
      this.label = o.label || 'TARGET ZONE';
      this.color = o.color || '#f2c418';
      this.pulse = 0;
    }
    update(dt, world) {
      this.pulse = Math.max(0, this.pulse - dt);
      for (const e of world.entities) {
        if (e.dead || e.heldBy || !this.accept(e)) continue;
        if (U.dist(this.x, this.y, e.x, e.y) > this.r - e.r * 0.3) continue;
        e.dead = true;
        this.pulse = 0.6;
        world.particles.burst(e.x, e.y, 30, { color: ['#f2c418', '#ffffff', '#7fe3ff'], speed: [60, 260], life: [0.3, 0.8], size: [2, 4] });
        world.particles.emit(this.x, this.y, { shape: 'ring', size: 10, size1: this.r * 1.2, life: 0.4, color: '#f2c418', drag: 0 });
        DM.Audio.play('objective');
        if (this.onAccept) this.onAccept(e);
      }
    }
    render(ctx, world) {
      const t = world.realTime || 0;
      ctx.save();
      ctx.fillStyle = U.rgba(this.color, 0.08 + this.pulse * 0.3);
      Gfx.circle(ctx, this.x, this.y, this.r);
      ctx.fill();
      ctx.strokeStyle = U.rgba(this.color, 0.85);
      ctx.lineWidth = 3;
      ctx.setLineDash([14, 10]);
      ctx.lineDashOffset = -t * 20;
      Gfx.circle(ctx, this.x, this.y, this.r);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.lineWidth = 1.5;
      Gfx.circle(ctx, this.x, this.y, this.r * 0.5);
      ctx.stroke();
      ctx.restore();
      Gfx.text(ctx, this.label, this.x, this.y + this.r + 18, { size: 13, align: 'center', color: U.rgba(this.color, 0.9), spacing: 2, weight: 600 });
    }
  }

  // Training target. Optional rail movement.
  class Dummy extends Entity {
    constructor(x, y, o = {}) {
      super({ x, y, r: 15, static: true, body: true, hp: 1, team: 'target', colors: ['#e8e2d0', '#c4302b', '#6b5a40'], layer: 1 });
      this.baseX = x;
      this.baseY = y;
      this.rail = o.rail || null; // { dx, dy, speed }
      this.phase = U.rand(0, 6);
    }
    update(dt) {
      if (!this.rail) return;
      this.phase += dt * this.rail.speed;
      const s = Math.sin(this.phase);
      this.x = this.baseX + this.rail.dx * s;
      this.y = this.baseY + this.rail.dy * s;
    }
    render(ctx) {
      if (this.rail) {
        ctx.strokeStyle = 'rgba(40,30,20,0.4)';
        ctx.lineWidth = 3;
        Gfx.line(ctx, this.baseX - this.rail.dx, this.baseY - this.rail.dy, this.baseX + this.rail.dx, this.baseY + this.rail.dy);
      }
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      Gfx.circle(ctx, this.x + 3, this.y + 4, this.r);
      ctx.fill();
      const cols = ['#e8e2d0', '#c4302b', '#e8e2d0', '#c4302b'];
      for (let i = 0; i < 4; i++) {
        ctx.fillStyle = cols[i];
        Gfx.circle(ctx, this.x, this.y, this.r * (1 - i * 0.24));
        ctx.fill();
      }
    }
  }

  DM.Props = { Crate, Barrel, Vehicle, Prop, Door, Zone, Dummy };
})();
</script>
<script>/* src/game/entities/projectiles.js */
/* Projectiles: bullets, energy bolts, artillery shells, homing missiles, tachyon discs. */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Entity = DM.Entity;

  // Fast straight shot. Moves itself with a swept segment test so it never tunnels.
  class Bullet extends Entity {
    constructor(o) {
      super({ x: o.x, y: o.y, vx: o.vx, vy: o.vy, r: o.r || 3, body: false, solid: false, layer: 2, disintegratable: true, team: o.team || 'enemy' });
      this.selfMove = true;
      this.isProjectile = true;
      this.dmg = o.dmg == null ? 6 : o.dmg;
      this.life = o.life || 1.8;
      this.color = o.color || '#ffd27a';
      this.kind = o.kind || 'bullet';
      this.width = o.width || 2;
    }
    update(dt, world) {
      this.life -= dt;
      if (this.life <= 0) return this.die('expire');
      const nx = this.x + this.vx * dt, ny = this.y + this.vy * dt;
      const t = world.shotHit(this.x, this.y, nx, ny);
      if (t >= 0) {
        const hx = this.x + (nx - this.x) * t, hy = this.y + (ny - this.y) * t;
        world.particles.burst(hx, hy, 5, { color: [this.color, '#ffffff'], speed: [40, 160], life: [0.1, 0.25], size: [1, 2], shape: 'spark' });
        return this.die('wall');
      }
      for (const e of world.entities) {
        if (e.dead || e === this || e.team === this.team || e.isProjectile || !e.body) continue;
        if (e.hp == null && !e.isPlayer && !e.blocksShots) continue;
        if (e.ko) continue;
        if (!U.segCircle(this.x, this.y, nx, ny, e.x, e.y, e.r + this.r)) continue;
        if (e.shieldR && U.dist(this.x, this.y, e.x, e.y) > e.shieldR - 2) continue;
        e.damage(this.dmg, this, this.kind);
        world.particles.burst(this.x, this.y, 6, { color: [this.color, '#ffffff'], speed: [40, 180], life: [0.1, 0.3], size: [1, 2.5], shape: 'spark' });
        return this.die('hit');
      }
      this.x = nx;
      this.y = ny;
    }
    render(ctx) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = this.color;
      ctx.lineWidth = this.width;
      ctx.lineCap = 'round';
      Gfx.line(ctx, this.x - this.vx * 0.025, this.y - this.vy * 0.025, this.x, this.y);
      ctx.restore();
    }
    renderFuture(ctx, world) {
      const nx = this.x + this.vx * 1.2, ny = this.y + this.vy * 1.2;
      const t = world.shotHit(this.x, this.y, nx, ny);
      const ex = t >= 0 ? this.x + (nx - this.x) * t : nx, ey = t >= 0 ? this.y + (ny - this.y) * t : ny;
      ctx.save();
      ctx.strokeStyle = 'rgba(255,90,74,0.35)';
      ctx.setLineDash([4, 6]);
      Gfx.line(ctx, this.x, this.y, ex, ey);
      ctx.restore();
    }
  }

  // Energy bolt fired by Dr. Manhattan's duplicates.
  class Bolt extends Bullet {
    constructor(o) {
      super(Object.assign({ color: '#7fe3ff', team: 'player', dmg: 18, r: 4, width: 3, kind: 'bolt', life: 1.4 }, o));
    }
    render(ctx) {
      super.render(ctx);
      Gfx.glow(ctx, this.x, this.y, 12, '#5fd4ff', 0.8);
    }
  }

  // Artillery shell: lobbed at a ground point, marked with a warning ring.
  class Shell extends Entity {
    constructor(o) {
      super({ x: o.x, y: o.y, r: 6, body: false, solid: false, layer: 3, disintegratable: true, team: o.team || 'enemy' });
      this.selfMove = true;
      this.isProjectile = true;
      this.sx = o.x;
      this.sy = o.y;
      this.tx = o.tx;
      this.ty = o.ty;
      this.T = o.T || 1.1;
      this.t = 0;
      this.dmg = o.dmg || 18;
      this.radius = o.radius || 70;
      this.h = 0;
    }
    update(dt, world) {
      this.t += dt;
      const k = Math.min(1, this.t / this.T);
      this.x = U.lerp(this.sx, this.tx, k);
      this.y = U.lerp(this.sy, this.ty, k);
      this.h = Math.sin(k * Math.PI) * Math.min(220, U.dist(this.sx, this.sy, this.tx, this.ty) * 0.45);
      if (k >= 1) {
        this.dead = true;
        world.explode(this.tx, this.ty, this.radius, this.dmg, { team: this.team });
      }
    }
    render(ctx) {
      const k = Math.min(1, this.t / this.T);
      ctx.save();
      ctx.strokeStyle = `rgba(255,80,60,${0.25 + k * 0.6})`;
      ctx.fillStyle = `rgba(255,80,60,${0.05 + k * 0.12})`;
      ctx.lineWidth = 2;
      Gfx.circle(ctx, this.tx, this.ty, this.radius);
      ctx.fill();
      ctx.stroke();
      Gfx.circle(ctx, this.tx, this.ty, this.radius * k);
      ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      Gfx.ellipse(ctx, this.x, this.y, 6, 4);
      ctx.fill();
      ctx.fillStyle = '#3a3a30';
      Gfx.circle(ctx, this.x, this.y - this.h, 6);
      ctx.fill();
      ctx.restore();
      Gfx.glow(ctx, this.x, this.y - this.h, 14, '#ff9a3c', 0.6);
    }
  }

  // Homing missile. Grab it with telekinesis and it's yours.
  class Missile extends Entity {
    constructor(o) {
      super({ x: o.x, y: o.y, r: 8, mass: 0.5, friction: 0, bounce: 0, team: 'enemy', grabbable: true, hp: 1, layer: 2, colors: ['#d8d8d0', '#ff9a3c'] });
      this.isProjectile = true;
      this.angle = o.angle || 0;
      this.speedBase = o.speed || 250;
      this.turn = o.turn || 2.1;
      this.life = o.life || 8;
      this.vx = Math.cos(this.angle) * this.speedBase;
      this.vy = Math.sin(this.angle) * this.speedBase;
      this.body = false;
    }
    onGrab() {
      this.team = 'player';
    }
    update(dt, world) {
      this.life -= dt;
      if (this.life <= 0) return this.boom(world);
      if (this.heldBy || this.team === 'player') {
        this.body = !this.heldBy;
        if (this.speed > 40) this.angle = Math.atan2(this.vy, this.vx);
        if (!this.heldBy) {
          for (const e of world.entities) {
            if (e.dead || e.team !== 'enemy' || e === this || e.isProjectile || e.ko) continue;
            if (U.dist(this.x, this.y, e.x, e.y) < e.r + this.r + 4) return this.boom(world);
          }
        }
        return;
      }
      let target = null, bd = 900;
      for (const e of world.entities) {
        if (e.dead || e.team !== 'player' || !e.targetable) continue;
        const d = U.dist(this.x, this.y, e.x, e.y);
        if (d < bd) {
          bd = d;
          target = e;
        }
      }
      if (target) {
        const want = U.angleTo(this.x, this.y, target.x, target.y);
        const diff = U.wrapAngle(want - this.angle);
        this.angle += U.clamp(diff, -this.turn * dt, this.turn * dt);
        if (bd < target.r + this.r + 2) return this.boom(world);
      }
      this.vx = Math.cos(this.angle) * this.speedBase;
      this.vy = Math.sin(this.angle) * this.speedBase;
      if (Math.random() < dt * 40) world.particles.emit(this.x - Math.cos(this.angle) * 10, this.y - Math.sin(this.angle) * 10, { vx: U.rand(-20, 20), vy: U.rand(-20, 20), life: 0.5, size: 4, size1: 9, color: '#9a948a', add: false, shape: 'smoke', alpha: 0.5 });
    }
    onWall(speed, w, world) {
      this.boom(world);
    }
    onImpact(speed, other, world) {
      this.boom(world);
    }
    damage() {
      this.boom(this.world);
      return true;
    }
    boom(world) {
      if (this.dead) return;
      this.dead = true;
      const mine = this.team === 'player';
      world.explode(this.x, this.y, mine ? 75 : 60, mine ? 90 : 16, { team: this.team, source: this });
    }
    render(ctx) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      ctx.fillStyle = this.team === 'player' ? '#cfefff' : '#d8d8d0';
      ctx.fillRect(-10, -3.5, 18, 7);
      ctx.fillStyle = '#c4302b';
      ctx.beginPath();
      ctx.moveTo(8, -3.5);
      ctx.lineTo(13, 0);
      ctx.lineTo(8, 3.5);
      ctx.fill();
      ctx.fillStyle = '#555';
      ctx.fillRect(-10, -6, 4, 12);
      ctx.restore();
      if (!this.heldBy) Gfx.glow(ctx, this.x - Math.cos(this.angle) * 11, this.y - Math.sin(this.angle) * 11, 12, '#ff9a3c', 0.8);
    }
    renderFuture(ctx) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,154,60,0.4)';
      ctx.setLineDash([3, 5]);
      Gfx.line(ctx, this.x, this.y, this.x + this.vx * 1.2, this.y + this.vy * 1.2);
      ctx.restore();
    }
  }

  // Veidt's tachyon disc: leaves a cloud that blinds Temporal Sight.
  class TachyonDisc extends Entity {
    constructor(o) {
      super({ x: o.x, y: o.y, r: 6, body: false, solid: false, layer: 2, disintegratable: true, team: 'enemy' });
      this.selfMove = true;
      this.isProjectile = true;
      this.tx = o.tx;
      this.ty = o.ty;
      const n = U.norm(o.tx - o.x, o.ty - o.y);
      this.vx = n.x * 480;
      this.vy = n.y * 480;
      this.travel = n.l;
      this.spin = 0;
    }
    update(dt, world) {
      this.spin += dt * 20;
      const step = Math.hypot(this.vx, this.vy) * dt;
      const nx = this.x + this.vx * dt, ny = this.y + this.vy * dt;
      this.travel -= step;
      const p = world.player;
      if (p && !p.dead && U.segCircle(this.x, this.y, nx, ny, p.x, p.y, p.r + 6)) {
        p.damage(8, this, 'disc');
        p.jamT = Math.max(p.jamT, 2);
        return this.burst(world);
      }
      if (this.travel <= 0 || world.shotHit(this.x, this.y, nx, ny) >= 0) return this.burst(world);
      this.x = nx;
      this.y = ny;
    }
    burst(world) {
      this.dead = true;
      world.add(new DM.Special.TachyonCloud(this.x, this.y));
      DM.Audio.play('zap');
    }
    render(ctx) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.spin);
      ctx.fillStyle = '#d4ad3a';
      Gfx.ellipse(ctx, 0, 0, 8, 4);
      ctx.fill();
      ctx.restore();
      Gfx.glow(ctx, this.x, this.y, 16, '#c06bff', 0.7);
    }
  }

  DM.Proj = { Bullet, Bolt, Shell, Missile, TachyonDisc };
})();
</script>
<script>/* src/game/entities/enemies.js */
/*
 * Enemies. All share the Enemy base: targeting, stun/held handling, and the
 * lethal/non-lethal split (humans knocked out by impacts are "spared";
 * disintegrated ones are not — the game tracks both).
 *
 * To add an enemy: extend Enemy, implement think(dt, world) and render(ctx, world).
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Audio = DM.Audio;
  const Events = DM.Events;
  const { Bullet, Shell, Missile, TachyonDisc } = DM.Proj;

  class Enemy extends DM.Entity {
    constructor(o = {}) {
      super(Object.assign({ team: 'enemy', grabbable: true, r: 12, mass: 1.2, friction: 7, hp: 40 }, o));
      this.human = o.human !== false;
      this.facing = o.facing || 0;
      this.walk = 0;
      this.sight = o.sight || 620;
      this.target = null;
      this.retarget = 0;
      this.alerted = !!o.alerted;
      this.fireCd = U.rand(0.8, 1.8);
      this.aim = 0;
      this.ko = false;
      this.strafeDir = U.chance(0.5) ? 1 : -1;
      this.strafeT = U.rand(1, 3);
      this.needLos = o.needLos !== false;
    }
    get active() {
      return !this.dead && !this.ko;
    }
    acquire(world) {
      let best = null, bd = this.sight;
      for (const e of world.entities) {
        if (e.dead || e.team !== 'player' || !e.targetable || e.hidden || e.down) continue;
        const d = U.dist(this.x, this.y, e.x, e.y);
        if (d >= bd) continue;
        if (this.needLos && !world.los(this.x, this.y, e.x, e.y)) continue;
        best = e;
        bd = d;
      }
      return best;
    }
    update(dt, world) {
      if (this.ko) return;
      if (this.heldBy) {
        this.stun = Math.max(this.stun, 0.5);
        this.aim = 0;
        if (this.onHeld) this.onHeld(dt, world);
        return;
      }
      if (this.stun > 0) {
        this.stun -= dt;
        this.aim = 0;
        return;
      }
      if (world.ceasefire) {
        this.aim = 0;
        this.burst = 0;
        this.vx = U.damp(this.vx, 0, 6, dt);
        this.vy = U.damp(this.vy, 0, 6, dt);
        return;
      }
      this.retarget -= dt;
      if (this.retarget <= 0) {
        this.retarget = 0.25;
        const t = this.acquire(world);
        if (t && !this.alerted && this.onAlert) this.onAlert(world);
        if (t) this.alerted = true;
        this.target = t;
      }
      this.think(dt, world);
    }
    think() {}
    steer(tx, ty, speed, dt, k = 6) {
      const n = U.norm(tx - this.x, ty - this.y);
      this.vx = U.damp(this.vx, n.x * speed, k, dt);
      this.vy = U.damp(this.vy, n.y * speed, k, dt);
    }
    die(kind, source) {
      if (this.human && kind === 'impact') {
        this.ko = true;
        this.body = false;
        this.layer = 0;
        this.grabbable = false;
        this.disintegratable = false;
        this.hp = 0;
        this.aim = 0;
        Events.emit('enemy:down', { enemy: this, lethal: false, kind, human: true });
        return;
      }
      if (this.dead) return;
      super.die(kind, source);
      Events.emit('enemy:down', { enemy: this, lethal: true, kind, human: this.human });
    }
    get neutralized() {
      return this.dead || this.ko;
    }
  }

  // ---- 1960s mob ------------------------------------------------------------
  const ALERT_BARKS = ["It's the blue guy!", 'Holy— it\'s him!', 'Shoot him! Shoot!', 'Nobody said nothin\' about HIM!', 'Light him up!'];
  const HELD_BARKS = ['Put me down!', 'Whoa— WHOA!', 'Mama!', 'This ain\'t natural!'];

  class Gangster extends Enemy {
    constructor(o = {}) {
      super(Object.assign({ hp: 40, colors: ['#2e2a28', '#d9b08c', '#8a2d2a', '#4b4038'] }, o));
      this.look = o.look || DM.LOOKS.randomGangster();
      this.gun = o.gun || 'pistol';
      this.range = this.gun === 'tommy' ? [150, 280] : [180, 340];
      this.speedBase = this.gun === 'tommy' ? 90 : 105;
      this.aimTime = this.gun === 'tommy' ? 0.7 : 0.45;
      this.burst = 0;
      this.burstT = 0;
      this.heldBarked = false;
      if (this.gun === 'tommy') {
        this.hp = this.maxHp = 60;
        this.mass = 1.5;
      }
    }
    onAlert(world) {
      if (Math.random() < 0.6) world.bark(this, U.pick(ALERT_BARKS));
    }
    onHeld(dt, world) {
      this.facing += dt * 9;
      if (!this.heldBarked) {
        this.heldBarked = true;
        world.bark(this, U.pick(HELD_BARKS), 1.4);
      }
    }
    think(dt, world) {
      this.heldBarked = false;
      const t = this.target;
      this.walk += dt * this.speed * 0.09;
      if (!t) {
        if (this.alerted && this.lastSeen && U.dist(this.x, this.y, this.lastSeen.x, this.lastSeen.y) > 30) this.steer(this.lastSeen.x, this.lastSeen.y, this.speedBase * 0.8, dt);
        else {
          this.vx = U.damp(this.vx, 0, 5, dt);
          this.vy = U.damp(this.vy, 0, 5, dt);
        }
        return;
      }
      this.lastSeen = { x: t.x, y: t.y };
      const d = U.dist(this.x, this.y, t.x, t.y);
      const ang = U.angleTo(this.x, this.y, t.x, t.y);
      this.facing = U.dampAngle(this.facing, ang, 10, dt);
      this.strafeT -= dt;
      if (this.strafeT <= 0) {
        this.strafeDir *= -1;
        this.strafeT = U.rand(1.2, 2.8);
      }
      const nx = Math.cos(ang), ny = Math.sin(ang);
      let mx = -ny * this.strafeDir * 0.7, my = nx * this.strafeDir * 0.7;
      if (d > this.range[1]) {
        mx += nx;
        my += ny;
      } else if (d < this.range[0]) {
        mx -= nx;
        my -= ny;
      }
      const n = U.norm(mx, my);
      const sp = this.aim > 0 || this.burst > 0 ? this.speedBase * 0.25 : this.speedBase;
      this.vx = U.damp(this.vx, n.x * sp, 6, dt);
      this.vy = U.damp(this.vy, n.y * sp, 6, dt);

      if (this.burst > 0) {
        this.burstT -= dt;
        if (this.burstT <= 0) {
          this.fireOne(world, t, 0.13);
          this.burst--;
          this.burstT = 0.09;
        }
        return;
      }
      if (this.aim > 0) {
        this.aim -= dt;
        if (this.aim <= 0) this.fire(world, t);
        return;
      }
      this.fireCd -= dt;
      if (this.fireCd <= 0) this.aim = this.aimTime;
    }
    fire(world, t) {
      if (this.gun === 'tommy') {
        this.burst = 6;
        this.burstT = 0;
        this.fireCd = U.rand(2.4, 3.2);
      } else {
        this.fireOne(world, t, 0.05);
        this.fireCd = U.rand(1.3, 2.1);
      }
    }
    fireOne(world, t, spread) {
      const a = U.angleTo(this.x, this.y, t.x + t.vx * 0.12, t.y + t.vy * 0.12) + U.rand(-spread, spread);
      const mx = this.x + Math.cos(a) * 20, my = this.y + Math.sin(a) * 20;
      world.add(new Bullet({ x: mx, y: my, vx: Math.cos(a) * 560, vy: Math.sin(a) * 560, team: 'enemy', dmg: this.gun === 'tommy' ? 4 : 6 }));
      world.particles.burst(mx, my, 4, { color: ['#fff2c4', '#ffd27a'], speed: [60, 160], life: [0.05, 0.12], size: [2, 4], angle: a, spread: 0.6 });
      Audio.play('shot');
    }
    render(ctx, world) {
      if (this.ko) {
        Gfx.figure(ctx, Object.assign({}, this.look, { x: this.x, y: this.y, angle: this.facing + 1.2, alpha: 0.85 }));
        const t = world.realTime || 0;
        ctx.fillStyle = '#f2c418';
        for (let i = 0; i < 3; i++) {
          const a = t * 3 + (i * Math.PI * 2) / 3;
          Gfx.circle(ctx, this.x + Math.cos(a) * 10, this.y - 4 + Math.sin(a) * 4, 1.8);
          ctx.fill();
        }
        return;
      }
      if (this.aim > 0 && this.target) {
        const k = 1 - this.aim / this.aimTime;
        ctx.save();
        ctx.strokeStyle = `rgba(255,70,50,${0.15 + k * 0.5})`;
        ctx.lineWidth = 1;
        ctx.setLineDash([6, 6]);
        Gfx.line(ctx, this.x, this.y, this.x + Math.cos(this.facing) * 160, this.y + Math.sin(this.facing) * 160);
        ctx.restore();
      }
      Gfx.figure(ctx, Object.assign({}, this.look, {
        x: this.x, y: this.y, angle: this.facing, walk: this.walk, moving: this.speed > 20,
        aim: !!this.target || this.aim > 0, gun: this.gun, flash: this.hitFlash > 0 ? 0.7 : 0,
      }));
    }
  }

  // ---- machines (Chapter III / V) ---------------------------------------------
  class Machine extends Enemy {
    constructor(o) {
      super(Object.assign({ human: false }, o));
      this.boomR = o.boomR || 50;
      this.boomDmg = o.boomDmg || 8;
    }
    onDeath(kind) {
      if (!this.world) return;
      const w = this.world;
      if (kind === 'disintegrate') return;
      w.defer(() => w.explode(this.x, this.y, this.boomR, this.boomDmg, { team: 'enemy' }));
    }
  }

  class Drone extends Machine {
    constructor(o = {}) {
      super(Object.assign({ hp: 30, r: 13, mass: 0.8, friction: 3, flying: true, needLos: false, colors: ['#6b7a4a', '#2b2f24', '#ffcc66'] }, o));
      this.style = o.style || 'army';
      if (this.style === 'karnak') this.colors = ['#d4ad3a', '#6f4aa6', '#c06bff'];
      this.orbit = U.rand(150, 230);
      this.orbitDir = U.chance(0.5) ? 1 : -1;
      this.speedBase = o.speed || 190;
      this.spin = U.rand(0, 6);
      this.phi = null;
      this.aimTime = 0.35;
    }
    think(dt, world) {
      this.spin += dt * 30;
      const t = this.target;
      if (!t) {
        this.vx = U.damp(this.vx, 0, 2, dt);
        this.vy = U.damp(this.vy, 0, 2, dt);
        return;
      }
      if (this.phi == null) this.phi = U.angleTo(t.x, t.y, this.x, this.y);
      this.phi += this.orbitDir * dt * 0.9;
      this.steer(t.x + Math.cos(this.phi) * this.orbit, t.y + Math.sin(this.phi) * this.orbit, this.speedBase, dt, 3);
      this.facing = U.dampAngle(this.facing, U.angleTo(this.x, this.y, t.x, t.y), 8, dt);
      if (this.aim > 0) {
        this.aim -= dt;
        if (this.aim <= 0) {
          const a = this.facing;
          const col = this.style === 'karnak' ? '#c06bff' : '#ffcf5a';
          world.add(new Bullet({ x: this.x + Math.cos(a) * 14, y: this.y + Math.sin(a) * 14, vx: Math.cos(a) * 430, vy: Math.sin(a) * 430, team: 'enemy', dmg: 5, color: col, kind: 'pulse', width: 3, r: 4 }));
          Audio.play('pulse');
          this.fireCd = U.rand(1.4, 2.1);
        }
        return;
      }
      this.fireCd -= dt;
      if (this.fireCd <= 0 && world.los(this.x, this.y, t.x, t.y)) this.aim = this.aimTime;
    }
    render(ctx, world) {
      const k = this.style === 'karnak';
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      Gfx.ellipse(ctx, this.x + 10, this.y + 18, 13, 8);
      ctx.fill();
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.facing);
      ctx.strokeStyle = k ? '#8a6a1a' : '#2b2f24';
      ctx.lineWidth = 3;
      Gfx.line(ctx, -11, -11, 11, 11);
      Gfx.line(ctx, -11, 11, 11, -11);
      for (const [sx, sy] of [[-11, -11], [11, 11], [-11, 11], [11, -11]]) {
        ctx.fillStyle = 'rgba(200,200,200,0.18)';
        Gfx.circle(ctx, sx, sy, 7);
        ctx.fill();
        ctx.strokeStyle = 'rgba(230,230,230,0.5)';
        ctx.lineWidth = 1.2;
        Gfx.line(ctx, sx + Math.cos(this.spin) * 6, sy + Math.sin(this.spin) * 6, sx - Math.cos(this.spin) * 6, sy - Math.sin(this.spin) * 6);
      }
      ctx.fillStyle = this.hitFlash > 0 ? '#ffffff' : k ? '#d4ad3a' : '#5d6b4a';
      Gfx.circle(ctx, 0, 0, 9);
      ctx.fill();
      ctx.fillStyle = k ? '#6f4aa6' : '#3a4430';
      Gfx.circle(ctx, 0, 0, 5);
      ctx.fill();
      ctx.restore();
      const eye = k ? '#c06bff' : '#ff5a4a';
      Gfx.glow(ctx, this.x + Math.cos(this.facing) * 7, this.y + Math.sin(this.facing) * 7, this.aim > 0 ? 18 : 9, eye, 0.9);
    }

  class Tank extends Machine {
    constructor(o = {}) {
      super(Object.assign({ hp: 240, r: 28, mass: 8, friction: 4, boomR: 95, boomDmg: 25, colors: ['#5d6b4a', '#3a4430', '#2b2b2b'] }, o));
      this.turret = this.facing;
      this.hullA = this.facing;
      this.speedBase = 55;
      this.range = [240, 430];
      this.fireCd = U.rand(1.8, 3.2);
      this.aimTime = 0.9;
      this.tread = 0;
    }
    think(dt, world) {
      const t = this.target;
      if (!t) return;
      const d = U.dist(this.x, this.y, t.x, t.y);
      const ang = U.angleTo(this.x, this.y, t.x, t.y);
      let dir = 0;
      if (d > this.range[1]) dir = 1;
      else if (d < this.range[0]) dir = -1;
      if (dir) {
        const a = dir > 0 ? ang : ang + Math.PI;
        this.hullA = U.dampAngle(this.hullA, a, 1.5, dt);
        this.vx = U.damp(this.vx, Math.cos(this.hullA) * this.speedBase, 3, dt);
        this.vy = U.damp(this.vy, Math.sin(this.hullA) * this.speedBase, 3, dt);
        this.tread += dt * 30;
      }
      const diff = U.wrapAngle(ang - this.turret);
      this.turret += U.clamp(diff, -1.6 * dt, 1.6 * dt);
      if (this.aim > 0) {
        this.aim -= dt;
        if (this.aim <= 0) this.fire(world, t);
        return;
      }
      this.fireCd -= dt;
      if (this.fireCd <= 0 && Math.abs(diff) < 0.3) this.aim = this.aimTime;
    }
    fire(world, t) {
      const mx = this.x + Math.cos(this.turret) * 40, my = this.y + Math.sin(this.turret) * 40;
      const lead = 0.9;
      world.add(new Shell({ x: mx, y: my, tx: t.x + t.vx * lead, ty: t.y + t.vy * lead, T: 1.15, dmg: 18, radius: 70, team: 'enemy' }));
      world.particles.burst(mx, my, 10, { color: ['#fff2c4', '#ffd27a', '#9a948a'], speed: [60, 200], life: [0.1, 0.35], size: [3, 6], angle: this.turret, spread: 0.7 });
      Audio.play('shot');
      world.camera.shake(0.08);
      this.fireCd = U.rand(3, 4);
    }
    render(ctx) {
      const L = this.r * 2.3, W = this.r * 1.7;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(-L / 2 + 5, -W / 2 + 6, L, W);
      ctx.rotate(this.hullA);
      ctx.fillStyle = '#222';
      ctx.fillRect(-L / 2, -W / 2, L, 9);
      ctx.fillRect(-L / 2, W / 2 - 9, L, 9);
      ctx.strokeStyle = '#444';
      ctx.lineWidth = 1;
      for (let i = 0; i < 9; i++) {
        const x = -L / 2 + ((i * 8 + this.tread) % L);
        Gfx.line(ctx, x, -W / 2, x, -W / 2 + 9);
        Gfx.line(ctx, x, W / 2 - 9, x, W / 2);
      }
      ctx.fillStyle = this.hitFlash > 0 ? '#c8d0b8' : '#5d6b4a';
      ctx.fillRect(-L / 2 + 4, -W / 2 + 7, L - 8, W - 14);
      ctx.restore();
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.turret);
      ctx.fillStyle = '#3a4430';
      ctx.fillRect(4, -3.5, 36, 7);
      ctx.fillStyle = this.hitFlash > 0 ? '#d8e0c8' : '#6d7b56';
      Gfx.circle(ctx, 0, 0, 14);
      ctx.fill();
      ctx.fillStyle = '#e8d27a';
      ctx.fillRect(-4, -2, 8, 4);
      ctx.restore();
      if (this.aim > 0) Gfx.glow(ctx, this.x + Math.cos(this.turret) * 40, this.y + Math.sin(this.turret) * 40, 18 + (1 - this.aim / this.aimTime) * 14, '#ff9a3c', 0.9);
    }

  // Chapter III boss: an experimental super-heavy tank.
  class Behemoth extends Machine {
    constructor(o = {}) {
      super(Object.assign({ hp: 1300, r: 60, mass: 80, friction: 5, boomR: 160, boomDmg: 30, sight: 1400, needLos: false, grabbable: false, colors: ['#4d5a3a', '#2b2b2b', '#c4302b', '#e8d27a'] }, o));
      this.name = 'M-1 "BEHEMOTH"';
      this.turret = this.facing;
      this.hullA = this.facing;
      this.speedBase = 34;
      this.cycle = 0;
      this.actT = 2.5;
      this.mgT = 0;
      this.mgShots = 0;
      this.tread = 0;
    }
    think(dt, world) {
      const t = this.target;
      if (!t) return;
      const phase = this.hp < this.maxHp * 0.33 ? 3 : this.hp < this.maxHp * 0.66 ? 2 : 1;
      const ang = U.angleTo(this.x, this.y, t.x, t.y);
      const d = U.dist(this.x, this.y, t.x, t.y);
      if (d > 300) {
        this.hullA = U.dampAngle(this.hullA, ang, 0.8, dt);
        this.vx = U.damp(this.vx, Math.cos(this.hullA) * this.speedBase * (1 + phase * 0.15), 2, dt);
        this.vy = U.damp(this.vy, Math.sin(this.hullA) * this.speedBase * (1 + phase * 0.15), 2, dt);
        this.tread += dt * 20;
      }
      this.turret = U.dampAngle(this.turret, ang, 1.6, dt);
      if (this.mgShots > 0) {
        this.mgT -= dt;
        if (this.mgT <= 0) {
          this.mgShots--;
          this.mgT = 0.07;
          const a = this.turret + U.rand(-0.15, 0.15);
          const sx = this.x + Math.cos(this.turret + 0.6) * 44, sy = this.y + Math.sin(this.turret + 0.6) * 44;
          world.add(new Bullet({ x: sx, y: sy, vx: Math.cos(a) * 600, vy: Math.sin(a) * 600, team: 'enemy', dmg: 4 }));
          Audio.play('shot');
        }
      }
      this.actT -= dt;
      if (this.actT > 0) return;
      const act = this.cycle++ % 3;
      if (act === 0) {
        for (let i = -1; i <= 1; i++) {
          const ox = Math.cos(ang + Math.PI / 2) * i * 90, oy = Math.sin(ang + Math.PI / 2) * i * 90;
          world.add(new Shell({ x: this.x + Math.cos(this.turret) * 70, y: this.y + Math.sin(this.turret) * 70, tx: t.x + ox + t.vx * 0.6, ty: t.y + oy + t.vy * 0.6, T: 1.3, dmg: 20, radius: 75 }));
        }
        Audio.play('explosion');
        world.camera.shake(0.2);
      } else if (act === 1) {
        for (const side of [-1, 1]) world.add(new Missile({ x: this.x + Math.cos(this.hullA + side * 1.6) * 50, y: this.y + Math.sin(this.hullA + side * 1.6) * 50, angle: this.hullA + side * 1.2, speed: 230 }));
        if (phase >= 2) world.add(new Missile({ x: this.x - Math.cos(this.hullA) * 60, y: this.y - Math.sin(this.hullA) * 60, angle: this.hullA + Math.PI, speed: 230 }));
        Audio.play('whoosh');
      } else {
        this.mgShots = 10 + phase * 4;
      }
      this.actT = Math.max(1.4, 3.2 - phase * 0.5);
    }
    render(ctx) {
      const L = this.r * 2.4, W = this.r * 1.8;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(-L / 2 + 8, -W / 2 + 10, L, W);
      ctx.rotate(this.hullA);
      ctx.fillStyle = '#1d1d1d';
      ctx.fillRect(-L / 2, -W / 2, L, 18);
      ctx.fillRect(-L / 2, W / 2 - 18, L, 18);
      ctx.strokeStyle = '#3a3a3a';
      for (let i = 0; i < 14; i++) {
        const x = -L / 2 + ((i * 11 + this.tread) % L);
        Gfx.line(ctx, x, -W / 2, x, -W / 2 + 18);
        Gfx.line(ctx, x, W / 2 - 18, x, W / 2);
      }
      ctx.fillStyle = this.hitFlash > 0 ? '#c8d0b8' : '#4d5a3a';
      ctx.fillRect(-L / 2 + 6, -W / 2 + 14, L - 12, W - 28);
      ctx.fillStyle = '#3a4430';
      for (const s of [-1, 1]) ctx.fillRect(-20, s * (W / 2 - 34) - 10, 40, 20);
      ctx.fillStyle = '#c4302b';
      ctx.fillRect(-L / 2 + 10, -4, 18, 8);
      ctx.restore();
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.turret);
      ctx.fillStyle = '#2b3322';
      ctx.fillRect(10, -12, 72, 8);
      ctx.fillRect(10, 4, 72, 8);
      ctx.fillStyle = this.hitFlash > 0 ? '#d8e0c8' : '#5d6b4a';
      Gfx.circle(ctx, 0, 0, 30);
      ctx.fill();
