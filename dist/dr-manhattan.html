      ctx.fillStyle = `rgba(111,74,166,${0.08 + this.flash * 0.2})`;
      ctx.fill();
      ctx.restore();
    }
  }

  // ---- Adrian Veidt -------------------------------------------------------------
  // A duel with readable rules. While his guard is up he slips every Disintegrate
  // aimed at him (a gold afterimage marks the dodge). A gold ring shows when it is
  // down: stunned or held (telekinesis), pinned by a copy, mid-dash or recovering
  // after a dash of his own, winded after three quick dodges, committed at the end
  // of a disc wind-up, and most of the time while Jon watches through Temporal Sight.
  const VEIDT = {
    hp: 1000,
    speed: 230,
    orbitR: [200, 300],
    dashSpeed: 760,
    dashT: 0.35,
    dodgeReach: 70, // casts landing within c.r + this of him are dodged
    dodgeDist: 150,
    evadeT: 0.25, // i-frames against disintegrate once he commits to a dodge (real time:
    // under Temporal Sight even his dodge is too slow)
    recoverT: 0.8, // guard down after a dash of his own (breaking free, escaping a slam,
    // repositioning in phase 2), but not after a dodge
    streak: 3, // dodges in quick succession (within streakSpan s, no hit between) wind him...
    streakSpan: 1.8,
    fatigueT: 2, // ...for up to this long (until the first hit lands), orbiting slower
    fatigueSpeed: 0.55,
    fatigueCooldown: 8, // before he can be winded again (he also starts the duel rested)
    windupOpen: 0.24, // committed (guard down) for the end of a disc wind-up...
    windupSpeed: 2.2, // ...but stepping fast into the throw: lead him
    sightPeriod: 1, // under Temporal Sight his guard is down for 80% of each (real-time)
    sightGuard: 0.2, // period, up for the rest
    reposition: [4, 5.5], // phase 2: he dashes to a new spot this often (and recovers after)
    pinR: 110, // a Duplicate this close pins him
    impactMul: 1,
    boltMul: 0.6,
    breakFree: 0.7, // seconds he can be held (longer if Jon is expanded)
    breakFreeBig: 1.5,
    slamStun: 1.1,
    slamRecover: 1.8, // cannot be grabbed again this soon after a slam (nor mid-dash)
    discCd: [3.2, 2.4], // phase 1 / phase 2
    discWindup: 0.3,
    discRange: 520,
    meleeDmg: 20,
    meleeCd: 0.7,
    phase2: 0.5,
    summon: 18, // phase 2: two drones, and two more this often once they are gone
  };
  const VEIDT_DODGE = ['Too slow, Jon.', 'I have studied you.', 'Predictable.', 'You telegraph everything.'];
  const VEIDT_FREE = ['Not like that.', 'I caught a bullet once, Jon.', 'Unhand me.'];

  // Gold afterimage left where Veidt stood when he dodged.
  class Echo extends DM.Entity {
    constructor(v) {
      super({ x: v.x, y: v.y, r: 1, static: true, body: false, solid: false, layer: 1, disintegratable: false });
      this.look = v.look;
      this.facing = v.facing;
      this.life = 0.4;
    }
    update(dt) {
      this.life -= dt;
      if (this.life <= 0) this.dead = true;
    }
    render(ctx) {
      const a = Math.max(0, this.life / 0.4);
      Gfx.figure(ctx, Object.assign({}, this.look, { x: this.x, y: this.y, angle: this.facing, alpha: 0.45 * a, noShadow: true, body: '#d4ad3a', sleeve: '#d4ad3a', legs: '#a8862a', skin: '#ffe6a0', cape: null, ink: 'rgba(120,90,20,0.6)' }));
    }
  }

  class Veidt extends Enemy {
    constructor(o = {}) {
      super(Object.assign({ hp: VEIDT.hp, r: 13, mass: 1.6, friction: 8, human: true, needLos: false, colors: ['#6f4aa6', '#d4ad3a', '#f0d0b2'] }, o));
      this.look = DM.LOOKS.veidt;
      this.name = 'ADRIAN VEIDT';
      this.phaseMarks = [VEIDT.phase2];
      this.state = 'strafe';
      this.stateT = 3;
      this.discCd = 2.5;
      this.strikeCd = 0;
      this.heldT = 0;
      this.summonT = 0;
      this.repositionT = VEIDT.reposition[1];
      this.orbitR = 240;
      this.orbitDir = 1;
      this.phi = null;
      this.speedBase = VEIDT.speed;
      this.yielded = false;
      this.dashT = 0;
      this.dashTarget = null;
      this.aimTime = VEIDT.discWindup;
      this.evadeUntil = -1;
      this.recoverT = 0;
      this.fatigueT = 0;
      this.dodges = []; // times of the dodges in the current streak
      this.slamT = 0;
      this.fatigueCdT = VEIDT.fatigueCooldown;
      this.pinned = false;
      this.disHits = 0;
      this.pendingEvade = null;
    }
    // Out of reach of telekinesis mid-dash, and for a while after a slam.
    get grabbable() {
      return !!this._grab && this.state !== 'dash' && !(this.slamT > 0);
    }
    set grabbable(v) {
      this._grab = v;
    }
    // Why his guard is down right now (null: it is up and he will dodge).
    guardDown(world) {
      if (this.heldBy || this.stun > 0) return 'stunned';
      if (this.pinned) return 'pinned';
      if (this.state === 'dash') return 'dashing';
      if (this.recoverT > 0) return 'recovering';
      if (this.fatigueT > 0) return 'winded';
      if (this.aim > 0 && this.aim <= VEIDT.windupOpen) return 'throwing';
      if (world.timesight && (world.realTime || 0) % VEIDT.sightPeriod < VEIDT.sightPeriod - VEIDT.sightGuard) return 'seen';
      return null;
    }
    disintegrate(world, source) {
      this.damage(70, source, 'disintegrate');
    }
    damage(amount, source, kind) {
      if (this.yielded || this.dead) return false;
      if (kind === 'disintegrate' && this.world && (this.world.realTime || 0) < this.evadeUntil) return false;
      if (kind === 'impact') amount *= VEIDT.impactMul;
      if (kind === 'bolt') amount *= VEIDT.boltMul;
      this.hp -= amount;
      this.hitFlash = 0.15;
      this.dodges.length = 0;
      if (this.fatigueT > 0) this.fatigueT = 0.001; // a hit snaps him out of it
      if (kind === 'disintegrate') {
        this.disHits++;
        // Never caught mid-boast.
        if (this.world) this.world.barks = this.world.barks.filter((b) => !(b.e === this && VEIDT_DODGE.includes(b.text)));
      }
      if (this.hp <= 1) this.yieldNow();
      return true;
    }
    die() {
      this.yieldNow();
    }
    onImpact(speed, other, world) {
      const dmg = (speed - 200) * 0.12 * (other ? U.clamp(other.mass, 0.6, 6) : 1.4);
      if (dmg <= 1) return;
      if (this.slamT > VEIDT.slamRecover - 0.5) return; // one slam per throw, no pinball off the walls
      this.damage(dmg, other, 'impact');
      this.thrown = 0;
      this.stun = Math.max(this.stun, VEIDT.slamStun);
      // No slam-to-slam stun-lock: he cannot be caught again straight away, and
      // he gets clear the moment he is back on his feet.
      this.slamT = VEIDT.slamRecover;
      this.escapePending = true;
      world.particles.burst(this.x, this.y, 10, { color: ['#d4ad3a', '#ffffff'], speed: [60, 200], life: [0.2, 0.5], size: [2, 3.5] });
      Audio.play('impact');
      world.camera.shake(0.25);
    }
    yieldNow() {
      if (this.yielded) return;
      this.yielded = true;
      this.hp = 0;
      this.aim = 0;
      this.grabbable = false;
      this.disintegratable = false;
      this.heldBy = null;
      this.vx = this.vy = 0;
      if (this.world && this.world.hitstop) this.world.hitstop(0.25);
      Events.emit('veidt:yield', this);
    }
    onHeld(dt, world) {
      this.heldT += dt;
      const limit = this.heldBy && this.heldBy.scale > 1.3 ? VEIDT.breakFreeBig : VEIDT.breakFree;
      if (this.heldT > limit) {
        const p = this.heldBy;
        this.heldBy = null;
        this.heldT = 0;
        this.stun = 0;
        this.thrown = 0;
        world.bark(this, U.pick(VEIDT_FREE), 1.6);
        const n = U.norm(this.x - p.x, this.y - p.y);
        const o = this.openSpot(n.x || 1, n.y, 200);
        this.dash(o.x, o.y);
      }
    }
    // A spot `dist` away, as close to direction (nx, ny) as walls allow.
    openSpot(nx, ny, dist) {
      const w = this.world;
      let best = null;
      for (const da of [0, 0.5, -0.5, 1, -1, 1.6, -1.6, 2.4, -2.4]) {
        const a = Math.atan2(ny, nx) + da;
        // How far along this line he can get before a wall (in quarters).
        let clear = 0;
        for (let k = 1; k <= 4; k++) {
          const x = this.x + (Math.cos(a) * dist * k) / 4, y = this.y + (Math.sin(a) * dist * k) / 4;
          if (!w.isFree(x, y, this.r) || w.shotHit(this.x, this.y, x, y) >= 0) break;
          clear = k;
        }
        const score = clear * 10 - Math.abs(da);
        if (!best || score > best.score) best = { x: this.x + (Math.cos(a) * dist * Math.max(clear, 0.5)) / 4, y: this.y + (Math.sin(a) * dist * Math.max(clear, 0.5)) / 4, score };
        if (clear === 4) break;
      }
      return best;
    }
    // Dashes start at full speed; afterwards he needs a moment (recoverT).
    dash(x, y, dodge) {
      this.state = 'dash';
      this.dashIsDodge = !!dodge;
      this.dashT = VEIDT.dashT;
      const w = this.world;
      this.dashTarget = { x: U.clamp(x, 60, w.w - 60), y: U.clamp(y, 60, w.h - 60) };
      const n = U.norm(this.dashTarget.x - this.x, this.dashTarget.y - this.y);
      if (n.l) {
        this.vx = n.x * VEIDT.dashSpeed;
        this.vy = n.y * VEIDT.dashSpeed;
      }
    }
    onDisintegrateCast(c, world) {
      if (this.yielded) return;
      if (U.dist(this.x, this.y, c.x, c.y) > c.r + VEIDT.dodgeReach) return;
      if (this.guardDown(world)) return;
      let n = U.norm(this.x - c.x, this.y - c.y);
      if (!n.l) n = { x: Math.cos(this.facing + Math.PI / 2), y: Math.sin(this.facing + Math.PI / 2) };
      // A diagonal sidestep, to whichever side has room.
      const side = U.chance(0.5) ? 1 : -1;
      const best = this.openSpot(n.x - n.y * side, n.y + n.x * side, VEIDT.dodgeDist * 1.41);
      world.add(new Echo(this));
      this.dash(best.x, best.y, true);
      this.evadeUntil = (world.realTime || 0) + VEIDT.evadeT;
      this.pendingEvade = { c, hits: this.disHits, t: 0 };
      const ds = this.dodges;
      ds.push(this.age);
      while (ds.length > VEIDT.streak) ds.shift();
      if (ds.length >= VEIDT.streak && ds[ds.length - 1] - ds[0] <= VEIDT.streakSpan && !(this.fatigueCdT > 0)) this.fatiguePending = true;
      Audio.play('veidt_dodge');
    }
    update(dt, world) {
      if (this.yielded) {
        this.vx = U.damp(this.vx, 0, 8, dt);
        this.vy = U.damp(this.vy, 0, 8, dt);
        return;
      }
      // Letting go and grabbing again does not reset his struggle.
      if (!this.heldBy) this.heldT = Math.max(0, this.heldT - dt * 0.5);
      this.slamT = Math.max(0, this.slamT - dt);
      // 'Too slow' only when the dodge really took him out of harm's way.
      const pe = this.pendingEvade;
      if (pe) {
        pe.t += dt;
        if (pe.c.t <= 0 || pe.t > 0.6) {
          if (pe.c.t <= 0 && this.disHits === pe.hits) world.bark(this, U.pick(VEIDT_DODGE), 1.3);
          this.pendingEvade = null;
        }
      }
      super.update(dt, world);
    }
    think(dt, world) {
      const p = world.player;
      if (!p) return;
      this.walk += dt * this.speed * 0.09;
      this.discCd -= dt;
      this.strikeCd -= dt;
      this.summonT -= dt;
      this.recoverT = Math.max(0, this.recoverT - dt);
      if (this.fatigueT > 0 && (this.fatigueT -= dt) <= 0) this.fatigueCdT = VEIDT.fatigueCooldown;
      this.fatigueT = Math.max(0, this.fatigueT);
      this.fatigueCdT = Math.max(0, (this.fatigueCdT || 0) - dt);
      const phase = this.hp < this.maxHp * VEIDT.phase2 ? 2 : 1;

      if (this.escapePending) {
        this.escapePending = false;
        const n = U.norm(this.x - p.x, this.y - p.y);
        const side = U.chance(0.5) ? 1 : -1;
        const o = this.openSpot((n.x || 1) - n.y * side * 0.6, n.y + n.x * side * 0.6, 220);
        this.dash(o.x, o.y);
      }
      if (this.state === 'dash') {
        this.dashT -= dt;
        this.steer(this.dashTarget.x, this.dashTarget.y, VEIDT.dashSpeed, dt, 14);
        if (Math.random() < dt * 60) world.particles.emit(this.x, this.y, { life: 0.3, size: 10, size1: 4, color: '#6f4aa6', add: false, shape: 'smoke', alpha: 0.35, drag: 0 });
        if (this.dashT <= 0 || U.dist(this.x, this.y, this.dashTarget.x, this.dashTarget.y) < 12) {
          this.state = 'strafe';
          this.recoverT = this.dashIsDodge ? 0 : VEIDT.recoverT;
          if (this.fatiguePending) {
            this.fatiguePending = false;
            this.dodges.length = 0;
            this.fatigueT = VEIDT.fatigueT;
          }
        }
        return;
      }

      let dup = null, dd = VEIDT.pinR;
      for (const e of world.entities) {
        if (!e.isDuplicate || e.dead) continue;
        const d = U.dist(this.x, this.y, e.x, e.y);
        if (d < dd) {
          dd = d;
          dup = e;
        }
      }
      this.pinned = !!dup;
      if (dup) {
        this.state = 'melee';
        this.aim = 0;
        this.facing = U.dampAngle(this.facing, U.angleTo(this.x, this.y, dup.x, dup.y), 14, dt);
        if (dd > this.r + dup.r + 4) this.steer(dup.x, dup.y, 300, dt, 10);
        else if (this.strikeCd <= 0) {
          this.strikeCd = VEIDT.meleeCd;
          dup.damage(VEIDT.meleeDmg, this, 'strike');
          world.particles.burst(dup.x, dup.y, 8, { color: ['#ffffff', '#7fe3ff'], speed: [80, 200], life: [0.1, 0.3], size: [2, 3], shape: 'spark' });
          Audio.play('impact');
        }
        return;
      }
      if (this.state === 'melee') this.state = 'strafe';

      const slow = (this.fatigueT > 0 ? VEIDT.fatigueSpeed : 1) * (this.aim > 0 ? VEIDT.windupSpeed : 1);
      if (this.phi == null) this.phi = U.angleTo(p.x, p.y, this.x, this.y);
      this.phi += this.orbitDir * dt * (0.7 + phase * 0.3) * slow;
      const sp = this.speedBase * (phase === 2 ? 1.2 : 1) * slow;
      this.steer(p.x + Math.cos(this.phi) * this.orbitR, p.y + Math.sin(this.phi) * this.orbitR, sp, dt, this.aim > 0 ? 10 : 5);
      this.facing = U.dampAngle(this.facing, U.angleTo(this.x, this.y, p.x, p.y), 10, dt);

      // Tachyon disc: a short wind-up (arm raised, a glint at his hand), then the throw.
      if (this.aim > 0) {
        this.aim -= dt;
        if (this.aim <= 0) {
          const tx = p.x + p.vx * 0.4, ty = p.y + p.vy * 0.4;
          const a = U.angleTo(this.x, this.y, tx, ty);
          const h = this.handPos();
          world.add(new TachyonDisc({ x: h.x, y: h.y, tx: h.x + Math.cos(a) * 100, ty: h.y + Math.sin(a) * 100, range: VEIDT.discRange }));
          Audio.play('whoosh');
        }
      } else if (this.discCd <= 0) {
        this.discCd = VEIDT.discCd[phase - 1];
        this.aim = this.aimTime;
      }
      if (phase === 2 && this.summonT <= 0) {
        this.summonT = VEIDT.summon;
        const drones = world.entities.filter((e) => e instanceof Drone && e.active).length;
        if (!drones) {
          for (const s of [-1, 1]) world.add(new Drone({ x: U.clamp(this.x + s * 300, 80, world.w - 80), y: U.clamp(this.y - 200, 80, world.h - 80), style: 'karnak', alerted: true }));
          world.bark(this, 'You are not the only one with help.', 2);
        }
      }
      // Phase 2: faster, and he takes a new position with a dash every few
      // seconds, each one followed by a moment's recovery.
      if (phase === 2 && (this.repositionT -= dt) <= 0 && !(this.aim > 0)) {
        this.repositionT = U.rand(VEIDT.reposition[0], VEIDT.reposition[1]);
        this.phi += this.orbitDir * U.rand(0.9, 1.4);
        const r = U.rand(VEIDT.orbitR[0], VEIDT.orbitR[1]);
        this.dash(p.x + Math.cos(this.phi) * r, p.y + Math.sin(this.phi) * r);
      }
      this.stateT -= dt;
      if (this.stateT <= 0) {
        this.stateT = U.rand(2.2, 4);
        if (U.chance(0.4)) this.orbitDir *= -1;
        this.orbitR = U.rand(VEIDT.orbitR[0], VEIDT.orbitR[1]);
      }
    }
    handPos() {
      return { x: this.x + Math.cos(this.facing) * 12 - Math.sin(this.facing) * 5, y: this.y + Math.sin(this.facing) * 12 + Math.cos(this.facing) * 5 };
    }
    render(ctx, world) {
      if (this.yielded) {
        Gfx.figure(ctx, Object.assign({}, this.look, { x: this.x, y: this.y, angle: this.facing, scale: 0.9 }));
        return;
      }
      Gfx.figure(ctx, Object.assign({}, this.look, {
        x: this.x, y: this.y, angle: this.facing, walk: this.walk, moving: this.speed > 20,
        carry: this.state === 'melee' || this.aim > 0, flash: this.hitFlash > 0 ? 0.7 : 0,
      }));
      if (!world.lit) this.renderEmissive(ctx, world);
    }
    renderEmissive(ctx, world) {
      if (this.yielded || this.dead) return;
      const t = world.realTime || 0;
      if (this.aim > 0) {
        const k = 1 - this.aim / this.aimTime;
        const h = this.handPos();
        Gfx.glow(ctx, h.x, h.y, 10 + k * 14, '#ffd86a', 0.7 + k * 0.3);
        star(ctx, h.x, h.y, t * 6, 8 + k * 10, '#fff6c8', 0.6 + k * 0.4);
      }
      const why = this.guardDown(world);
      if (why && why !== 'dashing') {
        ctx.save();
        ctx.strokeStyle = `rgba(242,196,24,${0.55 + Math.sin(t * 10) * 0.2})`;
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.lineDashOffset = -t * 20;
        Gfx.circle(ctx, this.x, this.y, this.r + 10);
        ctx.stroke();
        ctx.restore();
      }
    }
    renderFuture(ctx) {
      if (this.state === 'dash' && this.dashTarget) {
        ctx.save();
        ctx.globalAlpha = 0.45;
        Gfx.figure(ctx, Object.assign({}, this.look, { x: this.dashTarget.x, y: this.dashTarget.y, angle: this.facing, noShadow: true }));
        ctx.restore();
      }
      if (this.phi != null && this.world.player) {
        const p = this.world.player;
        const fa = this.phi + this.orbitDir * 1.2;
        ctx.save();
        ctx.strokeStyle = 'rgba(242,196,24,0.45)';
        ctx.setLineDash([4, 6]);
        ctx.beginPath();
        ctx.arc(p.x, p.y, this.orbitR, this.phi, fa, this.orbitDir < 0);
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  DM.Enemies = { Enemy, Gangster, Machine, Drone, Tank, Battery, Behemoth, Turret, Emitter, Veidt, TUNING: { DRONE, TANK, BATTERY, BEHEMOTH, VEIDT } };
})();
</script>
<script>/* src/game/entities/special.js */
/*
 * Chapter-specific entities: the reassembly (atoms, entropy, the body), Mars
 * (crystal shards, palace slots, memories, meteors), and power effects
 * (duplicates, afterimages, tachyon clouds), plus mines.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Audio = DM.Audio;
  const Entity = DM.Entity;
  const TAU = Math.PI * 2;

  // ---- Reassembly ---------------------------------------------------------------
  class Atom extends Entity {
    constructor(x, y, o = {}) {
      super({ x, y, r: 4, body: false, solid: false, layer: 2, disintegratable: false, mass: 0.1, friction: 1.6 });
      this.seed = Math.random() * 100;
      this.color = U.pick(['#9fe8ff', '#5fd4ff', '#ffffff', '#bfe9ff']);
      if (o.vx) {
        this.vx = o.vx;
        this.vy = o.vy;
      }
    }
    update(dt, world) {
      this.vx += Math.cos(this.age * 0.7 + this.seed) * 10 * dt;
      this.vy += Math.sin(this.age * 0.6 + this.seed * 1.3) * 10 * dt;
      const p = world.player;
      if (!p || p.form !== 'awareness' || p.locked) return;
      const d = U.dist(this.x, this.y, p.x, p.y);
      if (d > p.pullRadius || p.carry >= p.carryMax) return;
      const n = U.norm(p.x - this.x, p.y - this.y);
      const k = (1 - d / p.pullRadius) * 1100 + 160;
      this.vx += n.x * k * dt;
      this.vy += n.y * k * dt;
      if (d < p.r + 6) {
        this.dead = true;
        p.carry++;
        Audio.play('atom', { i: p.carry });
        world.particles.burst(this.x, this.y, 4, { color: ['#ffffff', '#7fe3ff'], speed: [20, 80], life: [0.2, 0.4], size: [1.5, 2.5] });
        DM.Events.emit('atom:absorbed', p.carry);
      }
    }
    render(ctx, world) {
      const tw = 0.7 + Math.sin(this.age * 5 + this.seed) * 0.3;
      Gfx.glow(ctx, this.x, this.y, 12, '#5fd4ff', 0.55 * tw);
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x - 1.6, this.y - 1.6, 3.2, 3.2);
    }
  }

  // Entropy: wandering dark vortices that tear loose atoms back out of you.
  class Vortex extends Entity {
    constructor(x, y, o = {}) {
      super({ x, y, r: o.r || 48, body: false, solid: false, layer: 0, disintegratable: false, friction: 0.8 });
      this.speedBase = o.speed || 45;
      this.wander = U.rand(0, TAU);
      this.cool = 0;
      this.home = o.home || null; // stay out of this circle {x, y, r}
      this.spin = U.rand(0, TAU);
    }
    update(dt, world) {
      this.cool -= dt;
      this.spin += dt * 2.2;
      const p = world.player;
      this.wander += U.rand(-1.2, 1.2) * dt;
      let a = this.wander;
      if (p) a = U.lerpAngle(this.wander, U.angleTo(this.x, this.y, p.x, p.y), 0.3);
      let tx = Math.cos(a) * this.speedBase, ty = Math.sin(a) * this.speedBase;
      if (this.home) {
        const d = U.dist(this.x, this.y, this.home.x, this.home.y);
        if (d < this.home.r) {
          const n = U.norm(this.x - this.home.x, this.y - this.home.y);
          tx = n.x * 90;
          ty = n.y * 90;
          this.wander = Math.atan2(n.y, n.x);
        }
      }
      this.vx = U.damp(this.vx, tx, 1.5, dt);
      this.vy = U.damp(this.vy, ty, 1.5, dt);
      for (const e of world.entities) {
        if (!(e instanceof Atom)) continue;
        const d = U.dist(this.x, this.y, e.x, e.y);
        if (d > 200 || d < 1) continue;
        const n = U.norm(this.x - e.x, this.y - e.y);
        e.vx += n.x * 120 * (1 - d / 200) * dt;
        e.vy += n.y * 120 * (1 - d / 200) * dt;
        if (d < 10) e.dead = true;
      }
      if (!p || p.form !== 'awareness' || p.locked) return;
      const d = U.dist(this.x, this.y, p.x, p.y);
      if (d < 210) {
        const n = U.norm(this.x - p.x, this.y - p.y);
        p.vx += n.x * 240 * (1 - d / 210) * dt;
        p.vy += n.y * 240 * (1 - d / 210) * dt;
      }
      if (d < this.r * 0.6 && this.cool <= 0 && p.invuln <= 0) {
        const lost = Math.ceil(p.carry * 0.4);
        p.carry -= lost;
        for (let i = 0; i < lost; i++) {
          const ang = U.rand(0, TAU);
          const sp = U.rand(160, 360);
          world.add(new Atom(p.x, p.y, { vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp }));
        }
        const n = U.norm(p.x - this.x, p.y - this.y);
        p.vx = (n.l ? n.x : 1) * 520;
        p.vy = (n.l ? n.y : 0) * 520;
        p.invuln = 1.2;
        this.cool = 1.5;
        Audio.play('hit');
        world.camera.shake(0.35);
        DM.Events.emit('vortex:hit', lost);
      }
    }
    render(ctx, world) {
      const r = this.r;
      ctx.save();
      ctx.translate(this.x, this.y);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2.2);
      g.addColorStop(0, 'rgba(0,0,0,0.95)');
      g.addColorStop(0.35, 'rgba(25,6,30,0.75)');
      g.addColorStop(1, 'rgba(25,6,30,0)');
      ctx.fillStyle = g;
      Gfx.circle(ctx, 0, 0, r * 2.2);
      ctx.fill();
      ctx.lineWidth = 2;
      for (let i = 0; i < 5; i++) {
        ctx.strokeStyle = i % 2 ? 'rgba(160,40,90,0.55)' : 'rgba(90,40,140,0.55)';
        ctx.beginPath();
        for (let k = 0; k <= 24; k++) {
          const f = k / 24;
          const a = this.spin + (i * TAU) / 5 + f * 3.4;
          const rr = r * 1.9 * (1 - f) + 4;
          if (k === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
          else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
        }
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // The body Jon rebuilds, drawn front-on as an anatomical figure, layer by layer.
  // layers: [nervous, circulatory, skeleton, muscle] each 0..1; skin 0..1.
  class BodyForm extends Entity {
    constructor(x, y, o = {}) {
      super({ x, y, r: 60, static: true, body: false, solid: false, layer: 0, disintegratable: false });
      this.H = o.H || 260;
      this.layers = [0, 0, 0, 0];
      this.skin = 0;
      this.depositR = o.depositR || 120;
      this.ring = o.ring !== false;
      this.pulse = 0;
      const rnd = U.seeded(1959);
      this.branches = [];
      for (let i = 0; i < 40; i++) this.branches.push({ seg: (rnd() * 8) | 0, f: rnd(), len: 0.02 + rnd() * 0.03, side: rnd() < 0.5 ? -1 : 1 });
    }
    update(dt) {
      this.pulse = Math.max(0, this.pulse - dt);
    }
    render(ctx, world) {
      const t = world.realTime || 0;
      const X = this.x, Y = this.y, H = this.H;
      if (this.ring) {
        ctx.save();
        ctx.strokeStyle = `rgba(127,227,255,${0.25 + this.pulse})`;
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 8]);
        ctx.lineDashOffset = t * 12;
        Gfx.circle(ctx, X, Y, this.depositR);
        ctx.stroke();
        ctx.setLineDash([2, 10]);
        ctx.lineDashOffset = -t * 20;
        Gfx.circle(ctx, X, Y, this.depositR * 1.35);
        ctx.stroke();
        ctx.restore();
        Gfx.glow(ctx, X, Y, this.depositR * 1.4, '#1b7fd0', 0.25 + this.pulse * 0.6);
      }
      const P = (u, v) => [X + u * H, Y + v * H];
      const K = {
        head: [0, -0.4], neck: [0, -0.33], sL: [-0.12, -0.3], sR: [0.12, -0.3], eL: [-0.16, -0.14], eR: [0.16, -0.14],
        wL: [-0.18, 0.01], wR: [0.18, 0.01], hL: [-0.19, 0.06], hR: [0.19, 0.06], hipL: [-0.065, 0.02], hipR: [0.065, 0.02],
        kL: [-0.075, 0.24], kR: [0.075, 0.24], aL: [-0.08, 0.44], aR: [0.08, 0.44], fL: [-0.105, 0.47], fR: [0.105, 0.47], pel: [0, 0.01],
      };
      const limbs = [
        ['sL', 'eL'], ['eL', 'wL'], ['sR', 'eR'], ['eR', 'wR'], ['hipL', 'kL'], ['kL', 'aL'], ['hipR', 'kR'], ['kR', 'aR'],
      ];
      const seg = (a, b) => {
        const A = P(...K[a]), B = P(...K[b]);
        ctx.beginPath();
        ctx.moveTo(A[0], A[1]);
        ctx.lineTo(B[0], B[1]);
        ctx.stroke();
      };
      const fl = (v) => (v >= 1 ? 1 : v * (0.55 + Math.random() * 0.45));
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // skeleton
      const sk = fl(this.layers[2]);
      if (sk > 0) {
        ctx.globalAlpha = sk;
        ctx.strokeStyle = '#efe7d2';
        ctx.fillStyle = '#efe7d2';
        ctx.lineWidth = H * 0.016;
        for (const [a, b] of limbs) seg(a, b);
        for (const k of ['eL', 'eR', 'kL', 'kR', 'wL', 'wR', 'aL', 'aR', 'sL', 'sR']) {
          const p = P(...K[k]);
          Gfx.circle(ctx, p[0], p[1], H * 0.013);
          ctx.fill();
        }
        ctx.lineWidth = H * 0.007;
        seg('sL', 'neck');
        seg('sR', 'neck');
        for (let i = 0; i < 16; i++) {
          const p = P(0, -0.33 + i * 0.021);
          ctx.fillRect(p[0] - H * 0.008, p[1] - H * 0.006, H * 0.016, H * 0.012);
        }
        for (let i = 0; i < 7; i++) {
          const y = -0.285 + i * 0.026;
          for (const s of [-1, 1]) {
            const A = P(0, y), C = P(s * 0.11, y - 0.005), B = P(s * 0.075, y + 0.04);
            ctx.beginPath();
            ctx.moveTo(A[0], A[1]);
            ctx.quadraticCurveTo(C[0], C[1], B[0], B[1]);
            ctx.stroke();
          }
        }
        ctx.lineWidth = H * 0.01;
        for (const s of [-1, 1]) {
          const A = P(0, -0.005), C = P(s * 0.11, -0.03), B = P(s * 0.06, 0.05);
          ctx.beginPath();
          ctx.moveTo(A[0], A[1]);
          ctx.quadraticCurveTo(C[0], C[1], B[0], B[1]);
          ctx.stroke();
        }
        const hd = P(...K.head);
        ctx.lineWidth = H * 0.012;
        Gfx.circle(ctx, hd[0], hd[1], H * 0.057);
        ctx.stroke();
        ctx.fillStyle = '#2a2622';
        Gfx.circle(ctx, hd[0] - H * 0.02, hd[1], H * 0.012);
        ctx.fill();
        Gfx.circle(ctx, hd[0] + H * 0.02, hd[1], H * 0.012);
        ctx.fill();
      }

      // nervous system
      const nv = fl(this.layers[0]);
      if (nv > 0) {
        ctx.globalAlpha = nv;
        ctx.strokeStyle = '#fff1c1';
        ctx.lineWidth = H * 0.005;
        const hd = P(...K.head);
        Gfx.ellipse(ctx, hd[0], hd[1] - H * 0.006, H * 0.05, H * 0.044);
        ctx.stroke();
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.arc(hd[0] + (i - 1.5) * H * 0.02, hd[1] - H * 0.01, H * 0.015, 0, Math.PI);
          ctx.stroke();
        }
        seg('neck', 'pel');
        for (const [a, b] of limbs) seg(a, b);
        seg('neck', 'sL');
        seg('neck', 'sR');
        seg('pel', 'hipL');
        seg('pel', 'hipR');
        for (let i = 0; i < 8; i++) {
          const y = -0.29 + i * 0.035;
          for (const s of [-1, 1]) {
            const A = P(0, y), B = P(s * 0.075, y + 0.015);
            ctx.beginPath();
            ctx.moveTo(A[0], A[1]);
            ctx.lineTo(B[0], B[1]);
            ctx.stroke();
          }
        }
        ctx.lineWidth = H * 0.003;
        for (const b of this.branches) {
          const [a, c] = limbs[b.seg];
          const A = K[a], C = K[c];
          const u = U.lerp(A[0], C[0], b.f), v = U.lerp(A[1], C[1], b.f);
          const p0 = P(u, v), p1 = P(u + b.side * b.len, v + b.len * 0.6);
          Gfx.line(ctx, p0[0], p0[1], p1[0], p1[1]);
        }
        Gfx.glow(ctx, hd[0], hd[1], H * 0.12, '#fff1c1', 0.35 * nv);
      }

      // circulatory system
      const cv = fl(this.layers[1]);
      if (cv > 0) {
        ctx.globalAlpha = cv;
        ctx.lineWidth = H * 0.006;
        for (const [col, off] of [['#d8473f', 0.008], ['#4a6fd8', -0.008]]) {
          ctx.strokeStyle = col;
          ctx.save();
          ctx.translate(off * H, 0);
          seg('neck', 'pel');
          for (const [a, b] of limbs) seg(a, b);
          seg('neck', 'sL');
          seg('neck', 'sR');
          seg('pel', 'hipL');
          seg('pel', 'hipR');
          seg('neck', 'head');
          ctx.restore();
        }
        const hp = P(0.02, -0.21);
        const beat = 1 + Math.max(0, Math.sin(t * 7)) * 0.15;
        ctx.fillStyle = '#d8473f';
        Gfx.ellipse(ctx, hp[0], hp[1], H * 0.026 * beat, H * 0.03 * beat, 0.4);
        ctx.fill();
      }

      // musculature
      const mv = fl(this.layers[3]);
      if (mv > 0) {
        ctx.globalAlpha = mv * 0.75;
        ctx.fillStyle = '#b8423a';
        for (const [a, b] of limbs) {
          const A = P(...K[a]), B = P(...K[b]);
          const len = Math.hypot(B[0] - A[0], B[1] - A[1]);
          const thick = b.startsWith('k') || b.startsWith('e') ? 0.034 : 0.027;
          Gfx.ellipse(ctx, (A[0] + B[0]) / 2, (A[1] + B[1]) / 2, len / 2 + H * 0.01, H * thick, Math.atan2(B[1] - A[1], B[0] - A[0]));
          ctx.fill();
        }
        for (const s of [-1, 1]) {
          const pc = P(s * 0.047, -0.255);
          Gfx.ellipse(ctx, pc[0], pc[1], H * 0.05, H * 0.034);
          ctx.fill();
          const dl = P(s * 0.125, -0.29);
          Gfx.circle(ctx, dl[0], dl[1], H * 0.03);
          ctx.fill();
          for (let i = 0; i < 3; i++) {
            const ab = P(s * 0.022, -0.19 + i * 0.045);
            Gfx.rr(ctx, ab[0] - H * 0.018, ab[1] - H * 0.018, H * 0.036, H * 0.036, H * 0.01);
            ctx.fill();
          }
        }
        ctx.strokeStyle = 'rgba(255,190,170,0.35)';
        ctx.lineWidth = 1;
        for (const [a, b] of limbs) seg(a, b);
      }

      // skin: the blue man
      if (this.skin > 0) {
        ctx.globalAlpha = this.skin;
        ctx.strokeStyle = '#55c6f4';
        ctx.fillStyle = '#55c6f4';
        ctx.lineWidth = H * 0.055;
        for (const [a, b] of limbs) seg(a, b);
        ctx.lineWidth = H * 0.05;
        seg('sL', 'sR');
        seg('hipL', 'hipR');
        const to = P(0, -0.15);
        Gfx.ellipse(ctx, to[0], to[1], H * 0.105, H * 0.17);
        ctx.fill();
        const hd = P(...K.head);
        Gfx.circle(ctx, hd[0], hd[1], H * 0.064);
        ctx.fill();
        ctx.globalAlpha = this.skin;
        Gfx.hydrogen(ctx, hd[0], hd[1] - H * 0.022, H * 0.022, '#eafcff', t, 1.5);
        Gfx.glow(ctx, X, Y - H * 0.05, H * 0.75, '#2fa8ff', 0.6 * this.skin);
      }
      ctx.restore();
    }
  }

  // ---- Mars -----------------------------------------------------------------------
  class Shard extends Entity {
    constructor(x, y, big = false) {
      super({ x, y, r: big ? 26 : 12, mass: big ? 20 : 1.2, friction: 3, grabbable: true, disintegratable: false, layer: 1, colors: ['#cfefff', '#7fe3ff'] });
      this.big = big;
      this.rot = U.rand(0, TAU);
      this.placed = false;
      const n = big ? 7 : 5;
      this.verts = [];
      for (let i = 0; i < n; i++) {
        const a = (i / n) * TAU + U.rand(-0.2, 0.2);
        const rr = this.r * U.rand(0.75, 1.25);
        this.verts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
      }
    }
    update(dt) {
      if (!this.placed) this.rot += (this.vx - this.vy) * 0.0006 * dt * 60;
    }
    onBlast(x, y, r, world) {
      if (this.heldBy) this.heldBy = null;
    }
    render(ctx, world) {
      const t = world.realTime || 0;
      ctx.save();
      ctx.translate(this.x, this.y);
      if (!this.placed) {
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        Gfx.ellipse(ctx, 4, 6, this.r, this.r * 0.7);
        ctx.fill();
      }
      ctx.rotate(this.rot);
      ctx.beginPath();
      this.verts.forEach(([vx, vy], i) => (i ? ctx.lineTo(vx, vy) : ctx.moveTo(vx, vy)));
      ctx.closePath();
      ctx.fillStyle = this.placed ? 'rgba(190,240,255,0.55)' : 'rgba(170,230,255,0.38)';
      ctx.fill();
      ctx.strokeStyle = '#e6fbff';
      ctx.lineWidth = this.big ? 2.5 : 1.5;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(this.verts[0][0], this.verts[0][1]);
      ctx.lineTo(0, 0);
      ctx.lineTo(this.verts[2][0], this.verts[2][1]);
      ctx.strokeStyle = 'rgba(230,251,255,0.5)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
      Gfx.glow(ctx, this.x, this.y, this.r * 2.4, '#7fe3ff', this.placed ? 0.6 : 0.3 + Math.sin(t * 3 + this.id) * 0.08);
    }
  }

  class Slot extends Entity {
    constructor(x, y, big, palace) {
      super({ x, y, r: big ? 26 : 12, static: true, body: false, solid: false, layer: 0, disintegratable: false });
      this.big = big;
      this.palace = palace;
      this.filled = null;
      this.rot = U.rand(0, TAU);
    }
    update(dt, world) {
      if (this.filled) return;
      for (const e of world.entities) {
        if (!(e instanceof Shard) || e.placed || e.dead || e.big !== this.big) continue;
        if (U.dist(this.x, this.y, e.x, e.y) > (this.big ? 44 : 30)) continue;
        this.fill(e, world);
        break;
      }
    }
    fill(e, world) {
      e.placed = true;
      e.static = true;
      e.body = false;
      e.grabbable = false;
      e.heldBy = null;
      e.x = this.x;
      e.y = this.y;
      e.vx = e.vy = 0;
      e.rot = this.rot;
      this.filled = e;
      Audio.play('snap');
      if (world) {
        world.particles.burst(this.x, this.y, 24, { color: ['#ffffff', '#7fe3ff', '#f2c418'], speed: [40, 200], life: [0.3, 0.8], size: [1.5, 3] });
        world.particles.emit(this.x, this.y, { shape: 'ring', size: 6, size1: 60, life: 0.4, color: '#bff1ff', drag: 0 });
      }
      if (this.palace) this.palace.onFill(this);
    }
    render(ctx, world) {
      if (this.filled) return;
      const t = world.realTime || 0;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rot + t * 0.3);
      ctx.strokeStyle = `rgba(242,196,24,${0.45 + Math.sin(t * 3) * 0.2})`;
      ctx.setLineDash([4, 4]);
      ctx.lineWidth = 1.5;
      const r = this.r * 1.1;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * TAU;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }
  }

  // The glass palace: a clockwork blueprint that fills in as slots are filled.
  class Palace extends Entity {
    constructor(x, y) {
      super({ x, y, r: 320, static: true, body: false, solid: false, layer: 0, disintegratable: false });
      this.slots = [];
      this.rise = 0;
      this.risingT = 0;
      this.onFillCb = null;
    }
    addSlot(world, x, y, big) {
      const s = world.add(new Slot(x, y, big, this));
      this.slots.push(s);
      return s;
    }
    count(big) {
      return this.slots.filter((s) => s.big === big && s.filled).length;
    }
    total(big) {
      return this.slots.filter((s) => s.big === big).length;
    }
    onFill(slot) {
      if (this.onFillCb) this.onFillCb(slot);
    }
    update(dt) {
      if (this.risingT > 0) this.rise = Math.min(1, this.rise + dt / this.risingT);
    }
    render(ctx, world) {
      const t = world.realTime || 0;
      const filled = this.slots.filter((s) => s.filled).length / Math.max(1, this.slots.length);
      const a = 0.18 + filled * 0.5;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.strokeStyle = `rgba(160,225,255,${a})`;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([8, 8]);
      ctx.lineDashOffset = t * 8;
      Gfx.circle(ctx, 0, 0, 300);
      ctx.stroke();
      ctx.setLineDash([]);
      Gfx.circle(ctx, 0, 0, 230);
      ctx.stroke();
      Gfx.circle(ctx, 0, 0, 110);
      ctx.stroke();
      for (const s of this.slots) {
        if (s.big) continue;
        ctx.strokeStyle = s.filled ? 'rgba(200,245,255,0.7)' : `rgba(160,225,255,${a * 0.7})`;
        Gfx.line(ctx, 0, 0, s.x - this.x, s.y - this.y);
      }
      ctx.rotate(t * 0.05);
      ctx.strokeStyle = `rgba(242,196,24,${0.2 + filled * 0.4})`;
      for (let i = 0; i < 48; i++) {
        const ang = (i / 48) * TAU;
        Gfx.line(ctx, Math.cos(ang) * 296, Math.sin(ang) * 296, Math.cos(ang) * (i % 4 ? 286 : 276), Math.sin(ang) * (i % 4 ? 286 : 276));
      }
      ctx.restore();
      if (this.rise > 0) {
        const k = U.ease.outCubic(this.rise);
        Gfx.glow(ctx, this.x, this.y, 420 * k, '#7fe3ff', 0.45 * k);
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.globalAlpha = k;
        for (let ring = 0; ring < 3; ring++) {
          const R = 70 + ring * 70;
          const n = 6 + ring * 3;
          ctx.rotate(t * 0.04 * (ring % 2 ? -1 : 1));
          for (let i = 0; i < n; i++) {
            const ang = (i / n) * TAU;
            const h = (40 - ring * 8) * k;
            ctx.save();
            ctx.translate(Math.cos(ang) * R, Math.sin(ang) * R);
            ctx.rotate(ang);
            ctx.beginPath();
            ctx.moveTo(-h * 0.4, -h * 0.25);
            ctx.lineTo(h, 0);
            ctx.lineTo(-h * 0.4, h * 0.25);
            ctx.closePath();
            ctx.fillStyle = 'rgba(190,240,255,0.35)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(230,251,255,0.8)';
            ctx.lineWidth = 1.2;
            ctx.stroke();
            ctx.restore();
          }
        }
        ctx.restore();
        Gfx.hydrogen(ctx, this.x, this.y, 36 * k, 'rgba(230,251,255,0.9)', t, 3);
      }
    }
  }

  // A moment from Jon's life, visible only to Temporal Sight.
  class Memory extends Entity {
    constructor(x, y, o) {
      super({ x, y, r: 16, static: true, body: false, solid: false, layer: 2, disintegratable: false });
      this.year = o.year;
      this.text = o.text;
      this.rot = U.rand(-0.3, 0.3);
    }
    update(dt, world) {
      const p = world.player;
      if (!p || !world.timesight) return;
      if (U.dist(this.x, this.y, p.x, p.y) < 34 + p.r) {
        this.dead = true;
        Audio.play('memory');
        world.particles.burst(this.x, this.y, 30, { color: ['#f2c418', '#ffffff', '#7fe3ff'], speed: [40, 200], life: [0.4, 1], size: [1.5, 3] });
        DM.Events.emit('memory:found', this);
      }
    }
    render(ctx, world) {
      const t = world.realTime || 0;
      // Temporal Sight's own fade, not any slow motion (decoherence, clouds).
      const vis = U.clamp(world.sightK || 0, 0, 1);
      if (vis < 0.05) {
        if (Math.sin(t * 2 + this.id) > 0.92) Gfx.glow(ctx, this.x, this.y, 10, '#f2c418', 0.35);
        return;
      }
      ctx.save();
      ctx.globalAlpha = vis;
      ctx.translate(this.x, this.y + Math.sin(t * 2 + this.id) * 3);
      ctx.rotate(this.rot);
      Gfx.glow(ctx, 0, 0, 46, '#f2c418', 0.45);
      ctx.fillStyle = '#f1e7cc';
      ctx.fillRect(-17, -21, 34, 40);
      ctx.fillStyle = '#4a5560';
      ctx.fillRect(-13, -17, 26, 24);
      ctx.fillStyle = '#16120f';
      ctx.font = Gfx.font(9, DM.FONTS.type);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(this.year), 0, 13);
      ctx.restore();
    }
  }

  class Meteor extends Entity {
    constructor(x, y, o = {}) {
      super({ x, y, r: 70, static: true, body: false, solid: false, layer: 3, disintegratable: false });
      this.hazard = true; // stays in colour under Temporal Sight's grade
      this.T = o.T || 2.6;
      this.t = 0;
      this.radius = o.radius || 70;
      this.dmg = o.dmg || 14;
      this.whistled = false;
    }
    update(dt, world) {
      this.t += dt;
      if (!this.whistled && this.T - this.t < 0.9) {
        this.whistled = true;
        Audio.play('meteor');
      }
      if (this.t >= this.T) {
        this.dead = true;
        world.explode(this.x, this.y, this.radius, this.dmg, { team: 'hazard', colors: ['#ffd27a', '#ff9a3c', '#c2552f', '#fff2c4'], force: 700 });
        const cx = this.x, cy = this.y, cr = this.radius * 0.55;
        world.decals.push((c) => {
          c.fillStyle = 'rgba(60,20,10,0.35)';
          Gfx.circle(c, cx, cy, cr);
          c.fill();
        });
      }
    }
    render(ctx, world) {
      const k = this.t / this.T;
      const late = this.T - this.t < 0.75;
      if (world.timesight || late) {
        ctx.save();
        ctx.strokeStyle = `rgba(255,90,60,${0.35 + k * 0.5})`;
        ctx.fillStyle = `rgba(255,90,60,${0.05 + k * 0.15})`;
        ctx.lineWidth = 2;
        Gfx.circle(ctx, this.x, this.y, this.radius);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
      if (world.timesight) {
        ctx.save();
        ctx.strokeStyle = 'rgba(242,196,24,0.4)';
        ctx.setLineDash([5, 6]);
        Gfx.line(ctx, this.x + 360, this.y - 700, this.x, this.y);
        ctx.restore();
      }
      if (late) {
        const f = 1 - (this.T - this.t) / 0.75;
        const mx = this.x + (1 - f) * 360, my = this.y - (1 - f) * 700;
        Gfx.glow(ctx, mx, my, 40, '#ff9a3c', 0.9);
        ctx.fillStyle = '#3a2418';
        Gfx.circle(ctx, mx, my, 9);
        ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        Gfx.circle(ctx, this.x, this.y, 10 + f * 20);
        ctx.fill();
      }
    }
  }

  // ---- shared ------------------------------------------------------------------------
  // Land mine. Readable rather than instant: stepping close arms a 0.6 s fuse
  // (a beep and a red ring that grows to the blast radius), so a walker can back
  // off. Anything heavy or thrown sets it off too: a tank rolling over it, a
  // crate flung across the field.
  const MINE = { trigger: 30, fuse: 0.6, r: 80, dmg: 18, heavy: 4 };

  class Mine extends Entity {
    constructor(x, y) {
      super({ x, y, r: 10, static: true, body: false, solid: false, hp: 1, layer: 0, team: 'enemy', colors: ['#3a3a30', '#c4302b'] });
      this.trig = -1;
      this.hazard = true; // drawn in colour through Temporal Sight's grade
    }
    triggeredBy(e) {
      if (e.dead || e === this || e.flying || e.static || e.isProjectile || e.heldBy || e instanceof Mine) return false;
      return e.team === 'player' || e.thrown > 0 || e.mass >= MINE.heavy;
    }
    arm() {
      if (this.trig >= 0) return;
      this.trig = MINE.fuse;
      Audio.play('ui_move');
    }
    update(dt, world) {
      if (this.trig >= 0) {
        this.trig -= dt;
        if (this.trig < 0) {
          this.dead = true;
          world.explode(this.x, this.y, MINE.r, MINE.dmg, { team: 'enemy' });
        }
        return;
      }
      for (const e of world.entities) {
        if (!this.triggeredBy(e)) continue;
        if (U.dist(this.x, this.y, e.x, e.y) < MINE.trigger + e.r) {
          this.arm();
          break;
        }
      }
    }
    // Made safe (the operation is over): no blast.
    defuse(world) {
      if (this.dead) return;
      this.dead = true;
      world.particles.burst(this.x, this.y, 6, { color: ['#9a948a', '#6a645a'], speed: [10, 50], life: [0.3, 0.7], size: [3, 6], shape: 'smoke', add: false, alpha: 0.5 });
    }
    onDeath(kind) {
      if (kind !== 'disintegrate' && this.world && this.trig < 0) {
        const w = this.world;
        w.defer(() => w.explode(this.x, this.y, MINE.r, MINE.dmg, { team: 'enemy' }));
      }
    }
    render(ctx, world) {
      ctx.save();
      ctx.globalAlpha = world.timesight ? 1 : 0.8;
      ctx.fillStyle = '#3a3a30';
      Gfx.circle(ctx, this.x, this.y, 9);
      ctx.fill();
      ctx.strokeStyle = '#1d1d18';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
      if (!world.lit) this.renderEmissive(ctx, world);
    }
    renderEmissive(ctx, world) {
      if (this.dead) return;
      const t = world.realTime || 0;
      if (this.trig >= 0) {
        // Armed: a fast blink and a ring growing out to the blast radius.
        const k = 1 - this.trig / MINE.fuse;
        if (Math.sin(t * (20 + k * 30)) > -0.3) Gfx.glow(ctx, this.x, this.y, 20 + k * 10, '#ff3a2a', 1);
        ctx.save();
        ctx.strokeStyle = `rgba(255,70,50,${0.35 + k * 0.5})`;
        ctx.fillStyle = `rgba(255,70,50,${0.05 + k * 0.1})`;
        ctx.lineWidth = 2;
        Gfx.circle(ctx, this.x, this.y, 10 + (MINE.r - 10) * k);
        ctx.fill();
        ctx.stroke();
        ctx.setLineDash([4, 5]);
        ctx.strokeStyle = 'rgba(255,70,50,0.35)';
        Gfx.circle(ctx, this.x, this.y, MINE.r);
        ctx.stroke();
        ctx.restore();
        return;
      }
      if (Math.sin(t * 6 + this.id) > 0.6) Gfx.glow(ctx, this.x, this.y, 9, '#ff3a2a', world.timesight ? 1 : 0.8);
      if (world.timesight) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255,90,60,0.35)';
        ctx.setLineDash([3, 4]);
        Gfx.circle(ctx, this.x, this.y, MINE.r);
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  class Duplicate extends Entity {
    constructor(owner, x, y, life) {
      super({ x, y, r: 12, mass: 2.5, friction: 9, team: 'player', hp: 60, disintegratable: false });
      this.isDuplicate = true;
      this.timeless = true;
      this.targetable = true;
      this.owner = owner;
      this.life = life;
      this.maxLife = life;
      this.fireCd = U.rand(0.2, 0.6);
      this.facing = owner.facing;
      this.walk = 0;
      this.offset = U.rand(0, TAU);
    }
    expire(world) {
      if (this.dead) return;
      this.dead = true;
      world.particles.burst(this.x, this.y, 18, { color: ['#7fe3ff', '#ffffff'], speed: [30, 140], life: [0.3, 0.7], size: [1.5, 3] });
    }
    die() {
      this.expire(this.world);
    }
    onImpact() {}
    update(dt, world) {
      this.life -= dt;
      if (this.life <= 0) return this.expire(world);
      let target = null, bd = 560;
      for (const e of world.entities) {
        if (e.dead || e.team !== 'enemy' || e.ko || e.isProjectile || e.yielded) continue;
        const d = U.dist(this.x, this.y, e.x, e.y);
        if (d < bd) {
          bd = d;
          target = e;
        }
      }
      let tx, ty;
      if (target) {
        const n = U.norm(this.x - target.x, this.y - target.y);
        const keep = target instanceof DM.Enemies.Veidt ? 0 : 150;
        tx = target.x + n.x * keep;
        ty = target.y + n.y * keep;
        this.facing = U.dampAngle(this.facing, U.angleTo(this.x, this.y, target.x, target.y), 12, dt);
        this.fireCd -= dt;
        if (this.fireCd <= 0 && world.los(this.x, this.y, target.x, target.y)) {
          this.fireCd = 0.75;
          const a = U.angleTo(this.x, this.y, target.x, target.y);
          world.add(new DM.Proj.Bolt({ x: this.x + Math.cos(a) * 14, y: this.y + Math.sin(a) * 14, vx: Math.cos(a) * 640, vy: Math.sin(a) * 640 }));
          DM.Audio.play('bolt');
        }
      } else {
        const o = this.owner;
        this.offset += dt * 0.8;
        tx = o.x + Math.cos(this.offset) * 60;
        ty = o.y + Math.sin(this.offset) * 60;
        this.facing = U.dampAngle(this.facing, o.facing, 6, dt);
      }
      const n = U.norm(tx - this.x, ty - this.y);
      const sp = Math.min(260, n.l * 4);
      this.vx = U.damp(this.vx, n.x * sp, 8, dt);
      this.vy = U.damp(this.vy, n.y * sp, 8, dt);
      if (this.speed > 20) this.walk += dt * this.speed * 0.09;
    }
    render(ctx, world) {
      const fade = Math.min(1, this.life / 1.2);
      Gfx.manhattan(ctx, { x: this.x, y: this.y, angle: this.facing, walk: this.walk, moving: this.speed > 20, t: this.age, alpha: (0.55 + Math.random() * 0.12) * fade });
    }
  }

  class Afterimage extends Entity {
    constructor(p) {
      super({ x: p.x, y: p.y, r: 1, static: true, body: false, solid: false, layer: 1, disintegratable: false });
      this.timeless = true;
      this.facing = p.facing;
      this.scale = p.scale;
      this.life = 0.5;
    }
    update(dt) {
      this.life -= dt;
      if (this.life <= 0) this.dead = true;
    }
    render(ctx) {
      Gfx.manhattan(ctx, { x: this.x, y: this.y, angle: this.facing, scale: this.scale, alpha: (this.life / 0.5) * 0.45, t: this.age });
    }
  }

  // Left by Veidt's discs. Standing in one clouds Temporal Sight (it still
  // works, but time slows less); only the emitters' jamming blinds it.
  const CLOUD = { r: 60, life: 3 };

  class TachyonCloud extends Entity {
    constructor(x, y) {
      super({ x, y, r: CLOUD.r, static: true, body: false, solid: false, layer: 0, disintegratable: false });
      this.life = CLOUD.life;
      this.hazard = true; // stays in colour under Temporal Sight's grade
    }
    update(dt, world) {
      this.life -= dt;
      if (this.life <= 0) this.dead = true;
      const p = world.player;
      if (p && U.dist(p.x, p.y, this.x, this.y) < this.r) p.sightJamT = Math.max(p.sightJamT || 0, 0.2);
      if (Math.random() < dt * 25) {
        const a = U.rand(0, TAU), r = U.rand(0, this.r);
        world.particles.emit(this.x + Math.cos(a) * r, this.y + Math.sin(a) * r, { life: 0.3, size: 2, color: U.pick(['#c06bff', '#ffffff', '#6f4aa6']) });
      }
    }
    render(ctx) {
      const a = Math.min(1, this.life);
      Gfx.glow(ctx, this.x, this.y, this.r * 1.3, '#6f4aa6', 0.35 * a);
      ctx.save();
      ctx.strokeStyle = `rgba(192,107,255,${0.35 * a})`;
      ctx.setLineDash([3, 6]);
      Gfx.circle(ctx, this.x, this.y, this.r);
      ctx.stroke();
      ctx.restore();
    }
  }

  DM.Special = { Atom, Vortex, BodyForm, Shard, Slot, Palace, Memory, Meteor, Mine, Duplicate, Afterimage, TachyonCloud };
})();
</script>
<script>/* src/game/entities/fx.js */
/*
 * FX: the spare/kill moment, made visible.
 *
 *   FX.unbind(world, e, o)  lethal. e comes apart cell by cell, starting from
 *                           the side facing Jon: hot light and drifting ash,
 *                           with a brief blue ghost of the whole shape.
 *   FX.knockout(world, e)   non-lethal. The gun skids away, a white ring, and
 *                           a small 'spared' tag floats up.
 *
 * unbind() snapshots e.render (or o.draw) into one shared offscreen canvas and
 * samples it into coloured cells. Pass o.key to cache the cells (gangsters key
 * on their look), so repeat kills cost no snapshot at all.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Entity = DM.Entity;
  const TAU = Math.PI * 2;

  // ---- snapshots ------------------------------------------------------------
  let scratch = null;
  let sctx = null;
  const cache = new Map();

  function scratchFor(size) {
    if (!scratch) {
      scratch = document.createElement('canvas');
      scratch.width = scratch.height = 64;
      sctx = scratch.getContext('2d', { willReadFrequently: true });
    }
    if (scratch.width < size) {
      scratch.width = scratch.height = Math.ceil(size / 32) * 32;
      sctx = scratch.getContext('2d', { willReadFrequently: true });
    }
    return sctx;
  }

  // Opaque pixels (alpha > 110 skips drop shadows and soft glows) at one
  // cell per `step` px, as offsets from the centre plus a colour group.
  function sample(data, size, half, step) {
    const xs = [], ys = [], gi = [];
    const groups = new Map();
    for (let y = 0; y < size; y += step) {
      for (let x = 0; x < size; x += step) {
        const i = (y * size + x) * 4;
        if (data[i + 3] <= 110) continue;
        const q = ((data[i] >> 4) << 8) | ((data[i + 1] >> 4) << 4) | (data[i + 2] >> 4);
        let g = groups.get(q);
        if (g == null) {
          g = groups.size;
          groups.set(q, g);
        }
        xs.push(x - half + step / 2);
        ys.push(y - half + step / 2);
        gi.push(g);
      }
    }
    return { xs, ys, gi, groups };
  }

  function snapshot(e, world, o) {
    if (o.key && cache.has(o.key)) return cache.get(o.key);
    const half = Math.ceil(U.clamp(e.r * 1.6 + 14, 24, 160));
    const size = half * 2;
    const g = scratchFor(size);
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.clearRect(0, 0, size, size);
    g.save();
    if (o.draw) {
      g.translate(half, half);
      o.draw(g);
    } else {
      g.translate(half - e.x, half - e.y);
      e.render(g, world);
    }
    g.restore();
    const data = g.getImageData(0, 0, size, size).data;
    const max = o.max || 600;
    let step = o.step || 2;
    let s = sample(data, size, half, step);
    while (s.xs.length > max && step < 10) s = sample(data, size, half, ++step);
    if (!s.xs.length) return null;
    const colors = [], ash = [];
    for (const [q] of s.groups) {
      const hex = '#' + [q >> 8, (q >> 4) & 15, q & 15].map((v) => ((v << 4) | 8).toString(16).padStart(2, '0')).join('');
      colors.push(hex);
      ash.push(U.mix(hex, '#17130f', 0.55));
    }
    // Cells sorted by colour, so each colour is one path (gStart[g]..gStart[g+1]).
    const n = s.xs.length;
    const order = Array.from({ length: n }, (_, i) => i).sort((a, b) => s.gi[a] - s.gi[b]);
    const snap = { n, step, colors, ash, xs: new Float32Array(n), ys: new Float32Array(n), gi: new Uint16Array(n), gStart: new Uint16Array(colors.length + 1) };
    order.forEach((j, i) => {
      snap.xs[i] = s.xs[j];
      snap.ys[i] = s.ys[j];
      snap.gi[i] = s.gi[j];
    });
    for (let i = n - 1; i >= 0; i--) snap.gStart[snap.gi[i]] = i;
    snap.gStart[colors.length] = n;
    if (o.key) {
      if (cache.size > 96) cache.clear();
      cache.set(o.key, snap);
    }
    return snap;
  }

  // ---- the unbinding (lethal) -----------------------------------------------------
  class Unbinding extends Entity {
    constructor(e, snap, o) {
      super({ x: e.x, y: e.y, r: e.r, static: true, body: false, solid: false, disintegratable: false, layer: e.layer, team: 'neutral' });
      this.snap = snap;
      this.ang = o.angle || 0;
      this.ca = Math.cos(this.ang);
      this.sa = Math.sin(this.ang);
      // Sweep from the side facing the source (Jon) to the far side.
      let dir = o.source && (o.source.x !== e.x || o.source.y !== e.y) ? U.norm(o.source.x - e.x, o.source.y - e.y) : null;
      if (!dir) {
        const a = U.rand(0, TAU);
        dir = { x: Math.cos(a), y: Math.sin(a) };
      }
      this.away = { x: -dir.x, y: -dir.y };
      const n = snap.n;
      const proj = new Float32Array(n);
      let lo = Infinity, hi = -Infinity;
      for (let i = 0; i < n; i++) {
        const wx = snap.xs[i] * this.ca - snap.ys[i] * this.sa;
        const wy = snap.xs[i] * this.sa + snap.ys[i] * this.ca;
        const p = wx * dir.x + wy * dir.y;
        proj[i] = p;
        if (p < lo) lo = p;
        if (p > hi) hi = p;
      }
      const span = Math.max(1, hi - lo);
      this.delay = new Float32Array(n);
      for (let i = 0; i < n; i++) this.delay[i] = U.clamp(0.05 + ((hi - proj[i]) / span) * 0.5 + U.rand(-0.035, 0.035), 0.03, 0.6);
      this.gone = new Uint8Array(n);
      this.left = n;
      this.t = 0;
    }
    update(dt, world) {
      this.t += dt;
      const S = this.snap, P = world.particles;
      const st = S.step;
      for (let i = 0; i < S.n; i++) {
        if (this.gone[i] || this.delay[i] > this.t) continue;
        this.gone[i] = 1;
        this.left--;
        const x = this.x + S.xs[i] * this.ca - S.ys[i] * this.sa;
        const y = this.y + S.xs[i] * this.sa + S.ys[i] * this.ca;
        const ax = this.away.x, ay = this.away.y;
        if (Math.random() < 0.4) {
          const v = U.rand(40, 150);
          P.emit(x, y, { vx: ax * v + U.rand(-50, 50), vy: ay * v + U.rand(-50, 50), life: U.rand(0.25, 0.6), size: st * 1.1, size1: 0.3, color: Math.random() < 0.5 ? '#bff1ff' : '#ffffff', drag: 2.5 });
        } else {
          const v = U.rand(8, 40);
          P.emit(x, y, { vx: ax * v + U.rand(-14, 14), vy: ay * v - U.rand(18, 46), life: U.rand(0.7, 1.4), size: st, size1: st * 0.4, color: S.ash[S.gi[i]], add: false, alpha: 0.9, drag: 1.2, g: -22 });
        }
      }
      if (!this.left && this.t > 0.35) this.dead = true;
    }
    render(ctx) {
      const S = this.snap, st = S.step, h = st / 2;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.ang);
      // What is still bound, in its own colours, one path per colour.
      for (let g = 0; g < S.colors.length; g++) {
        ctx.beginPath();
        let any = false;
        for (let i = S.gStart[g]; i < S.gStart[g + 1]; i++) {
          if (this.gone[i]) continue;
          ctx.rect(S.xs[i] - h, S.ys[i] - h, st + 0.4, st + 0.4);
          any = true;
        }
        if (any) {
          ctx.fillStyle = S.colors[g];
          ctx.fill();
        }
      }
      ctx.globalCompositeOperation = 'lighter';
      // The edge about to let go burns white-blue.
      ctx.beginPath();
      for (let i = 0; i < S.n; i++) {
        if (this.gone[i] || this.delay[i] - this.t > 0.07) continue;
        ctx.rect(S.xs[i] - h, S.ys[i] - h, st, st);
      }
      ctx.fillStyle = 'rgba(191,241,255,0.85)';
      ctx.fill();
      // A blue ghost of the whole shape, swelling and fading over 0.3 s.
      if (this.t < 0.3) {
        const k = this.t / 0.3;
        ctx.scale(1 + k * 0.35, 1 + k * 0.35);
        ctx.globalAlpha = (1 - k) * 0.4;
        ctx.beginPath();
        for (let i = 0; i < S.n; i++) ctx.rect(S.xs[i] - h, S.ys[i] - h, st, st);
        ctx.fillStyle = '#5fd4ff';
        ctx.fill();
      }
      ctx.restore();
    }
  }

  // ---- the knockout (spared) ---------------------------------------------------
  class DroppedGun extends Entity {
    constructor(x, y, o = {}) {
      super({ x, y, vx: o.vx, vy: o.vy, r: 4, mass: 0.4, friction: 6, bounce: 0.3, body: false, solid: true, disintegratable: false, layer: 0, team: 'neutral' });
      this.gun = o.gun || 'pistol';
      this.rot = o.rot || 0;
      this.spin = U.rand(-14, 14);
    }
    update(dt) {
      this.rot += this.spin * dt * Math.min(1, this.speed / 120);
    }
    render(ctx) {
      const L = this.gun === 'tommy' ? 17 : 10;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rot);
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(-L / 2 + 1.5, -1.8 + 2, L, 3.6);
      ctx.fillStyle = '#17171a';
      ctx.fillRect(-L / 2, -1.8, L, 3.6);
      ctx.fillRect(-L / 2 + 1, 0, 3, 5); // grip
      if (this.gun === 'tommy') {
        Gfx.circle(ctx, 1, 0, 3.6);
        ctx.fill();
      }
      ctx.fillStyle = 'rgba(190,200,215,0.55)'; // a glint so it reads on dark asphalt
      ctx.fillRect(-L / 2, -1.8, L, 1);
      ctx.restore();
    }
  }

  class FloatText extends Entity {
    constructor(x, y, text, o = {}) {
      super({ x, y, r: 1, static: true, body: false, solid: false, disintegratable: false, layer: 5, team: 'neutral' });
      this.text = text;
      this.dur = this.life = o.dur || 1.2;
      this.color = o.color || '#e6f6ff';
    }
    update(dt) {
      this.life -= dt;
      if (this.life <= 0) this.dead = true;
    }
    // Drawn above the light layer and Sight's grade, so a "spared" reads at night.
    render(ctx, world) {
      if (!world.lit) this.renderEmissive(ctx);
    }
    renderEmissive(ctx) {
      const k = 1 - this.life / this.dur;
      const a = Math.min(1, k * 8) * (1 - k * k);
      if (a <= 0.01) return;
      ctx.save();
      ctx.globalAlpha *= a;
      Gfx.text(ctx, this.text, this.x, this.y - k * 16, { size: 13, font: DM.FONTS.type, color: this.color, align: 'center', stroke: 'rgba(8,12,20,0.85)', strokeWidth: 3, spacing: 1 });
      ctx.restore();
    }
  }

  // ---- the reassembly (retry) ----------------------------------------------------
  // Jon's atoms rush back together where he stands. It waits for the retry's
  // fade-in to clear (so it is seen), and nothing can touch him meanwhile.
  class Reassembly extends Entity {
    constructor(p) {
      super({ x: p.x, y: p.y, r: 1, static: true, body: false, solid: false, disintegratable: false, layer: 5, team: 'neutral' });
      this.p = p;
      this.t = 0;
    }
    update(dt, world) {
      const p = this.p;
      const fade = DM.Engine && DM.Engine.fade ? DM.Engine.fade.a : 0;
      this.t += dt;
      p.invuln = Math.max(p.invuln || 0, 0.6);
      if (fade > 0.3 && this.t < 1) return;
      world.particles.implode(p.x, p.y, 160, 80, { life: 0.6, size: 3, color: '#bff1ff' });
      world.particles.emit(p.x, p.y, { shape: 'ring', size: 150, size1: 6, life: 0.6, color: '#7fe3ff', drag: 0, alpha: 0.8 });
      this.dead = true;
    }
  }

  const FX = {
    Unbinding,
    DroppedGun,
    FloatText,
    Reassembly,
    snapshot,
    // Returns true if the unbinding was spawned (false: draw nothing new).
    unbind(world, e, o = {}) {
      try {
        const snap = snapshot(e, world, o);
        if (!snap) return false;
        world.add(new Unbinding(e, snap, o));
        if (typeof world.stamp === 'function') {
          // Iteration 2: a faint ash silhouette left on the floor.
          const a = o.angle || 0;
          world.stamp((g) => {
            g.save();
            g.translate(e.x, e.y);
            g.rotate(a);
            g.fillStyle = 'rgba(22,19,16,0.3)';
            g.beginPath();
            for (let i = 0; i < snap.n; i += 2) g.rect(snap.xs[i] - snap.step, snap.ys[i] - snap.step, snap.step * 2, snap.step * 2);
            g.fill();
            g.restore();
          });
        }
        return true;
      } catch (err) {
        return false;
      }
    },
    knockout(world, e, o = {}) {
      const P = world.particles;
      P.emit(e.x, e.y, { shape: 'ring', size: 8, size1: 34, life: 0.45, color: '#ffffff', drag: 0, alpha: 0.85 });
      if (o.gun) {
        const sp = Math.hypot(e.vx, e.vy);
        const base = sp > 40 ? Math.atan2(e.vy, e.vx) : (e.facing || 0);
        const a = base + U.rand(-0.9, 0.9);
        const v = U.rand(30, 60) * 6; // slides 30-60 px at friction 6
        const gx = e.x + Math.cos(e.facing || 0) * 12, gy = e.y + Math.sin(e.facing || 0) * 12;
        world.add(new DroppedGun(gx, gy, { gun: o.gun, vx: Math.cos(a) * v, vy: Math.sin(a) * v, rot: e.facing || 0 }));
      }
      world.add(new FloatText(e.x, e.y - e.r - 14, o.text || 'spared'));
    },
  };

  DM.FX = FX;
})();
</script>
<script>/* src/game/chapters.js */
/*
 * Chapter registry.
 *
 * A chapter is data + scripts (see src/data/chapters/*.js):
 *   id, numeral, title, date, place, clock (minutes to midnight), color,
 *   music, form ('human' | 'awareness' | 'manhattan'),
 *   epigraph { text, by }, intro [narration lines],
 *   maps { name(ctx) -> World },            // world builders; set world.spawn
 *   stages [{ id, map, checkpoint, grants, run*(ctx), restore(ctx) }]
 *
 * Chapters play in registration order. Powers carry forward: a chapter starts
 * with every power granted by the stages of all earlier chapters.
 */
(function () {
  'use strict';
  const DM = window.DM;

  const Chapters = { list: [], byId: {} };

  Chapters.register = (def) => {
    def.index = Chapters.list.length;
    def.stages = def.stages || [];
    Chapters.list.push(def);
    Chapters.byId[def.id] = def;
    return def;
  };
  Chapters.get = (id) => Chapters.byId[id];
  Chapters.next = (id) => {
    const c = Chapters.byId[id];
    return c ? Chapters.list[c.index + 1] || null : null;
  };
  Chapters.powersBefore = (index) => {
    const set = new Set();
    for (let i = 0; i < index; i++) for (const st of Chapters.list[i].stages) for (const g of st.grants || []) set.add(g);
    return [...set];
  };

  DM.Chapters = Chapters;
})();
</script>
<script>/* src/game/script.js */
/*
 * ChapterContext: the scripting API chapters are written against.
 *
 * Stage scripts are generator functions. Yield a "waiter" to pause until it is
 * done; yield nothing to wait one frame:
 *
 *   run: function* (ctx) {
 *     yield ctx.dialog([['janey', 'Jon! My watch...']]);
 *     ctx.objective('Repair the watch');
 *     yield ctx.until(() => ctx.flags.repaired);
 *     yield ctx.unlock('telekinesis');
 *   }
 *
 * ctx.fork(fn*) runs a side script in parallel (NPC conversations, spawners).
 * Stages marked `checkpoint: true` are where a retry restarts from; a stage's
 * `restore(ctx)` re-applies its lasting effects when a later checkpoint loads.
 * Entering a checkpoint snapshots the "carry" (stats, Mars memories found, the
 * chapter's persistFlags), so Retry and Continue keep what the player earned.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const ONE_FRAME = { update: () => true };

  class ChapterContext {
    constructor(scene, chapter) {
      this.scene = scene;
      this.chapter = chapter;
      this.flags = {};
      this.threads = [];
      this.locked = false;
      this.checkpoint = 0;
      this.stageIndex = 0;
      this.mapName = null;
      this.camTarget = null;
      this.skipRequested = false;
      this.done = false;
      this.stats = { time: 0, disintegrated: 0, spared: 0, memories: 0 };
      this.foundMemories = []; // years of the Mars memories found so far this run
      this.carry = null; // the snapshot this attempt resumed from (see applyCarry)
      this.checkpointCarry = null; // the snapshot taken on entering the current checkpoint
      this.memo = {}; // survives retries of the same chapter (Play passes its own)
      this.refs = {};
      this.offs = [];
    }

    // Resume with what the player had earned when the checkpoint was reached.
    applyCarry(carry) {
      if (!carry) return;
      this.carry = carry;
      if (carry.stats) for (const k in this.stats) if (Number.isFinite(carry.stats[k])) this.stats[k] = carry.stats[k];
      if (Array.isArray(carry.found)) this.foundMemories = carry.found.slice();
      if (carry.flags) Object.assign(this.flags, carry.flags);
    }
    snapshot() {
      return { stats: Object.assign({}, this.stats), found: this.foundMemories.slice(), flags: this.persistedFlags() };
    }
    // The story flags the chapter declares in `persistFlags`: carried through
    // checkpoints and saved with the chapter's completion for the ending.
    persistedFlags() {
      const out = {};
      for (const k of this.chapter.persistFlags || []) if (k in this.flags) out[k] = this.flags[k];
      return out;
    }

    // Subscribe to a DM.Events event for the life of this attempt.
    on(name, fn) {
      this.offs.push(DM.Events.on(name, fn));
    }
    dispose() {
      for (const off of this.offs) off();
      this.offs = [];
      this.threads = [];
    }

    // While a map is being built, ctx.world (and ctx.add) target the new world.
    get world() {
      return this._building || this.scene.world;
    }
    get player() {
      return this.scene.player;
    }
    get hud() {
      return this.scene.hud;
    }

    // ---- thread runner ----------------------------------------------------
    start(fromStage) {
      this.threads = [];
      this.spawn(this.stageLoop(fromStage));
    }
    spawn(gen) {
      const th = { gen, waiter: null, done: false };
      this.threads.push(th);
      return th;
    }
    fork(fn) {
      return this.spawn(fn(this));
    }
    step(dt) {
      if (!this.done) this.stats.time += dt;
      if (this.skipRequested && this.threads[0]) this.threads[0].waiter = null;
      for (const th of this.threads.slice()) this.stepThread(th, dt);
      this.threads = this.threads.filter((t) => !t.done);
    }
    stepThread(th, dt) {
      if (th.done) return;
      if (th.waiter) {
        if (!th.waiter.update(dt)) return;
        th.waiter = null;
      }
      for (let guard = 0; guard < 500; guard++) {
        const r = th.gen.next();
        if (r.done) {
          th.done = true;
          return;
        }
        const w = r.value;
        if (!w || typeof w.update !== 'function') {
          th.waiter = ONE_FRAME;
          return;
        }
        if (!w.update(0)) {
          th.waiter = w;
          return;
        }
      }
      throw new Error('Chapter script ran 500 steps without waiting — missing a yield?');
    }

    // True while running the stage this attempt started from (a fresh start or a checkpoint retry).
    get startedHere() {
      return this.stageIndex === this.startStage;
    }

    *stageLoop(from) {
      this.startStage = from;
      const stages = this.chapter.stages;
      for (let i = 0; i < from; i++) for (const id of stages[i].grants || []) this.player.unlock(id);
      // A stage without its own `map` plays on the most recent earlier stage's map.
      const mapFor = (i) => {
        for (let k = i; k >= 0; k--) if (stages[k].map) return stages[k].map;
        return null;
      };
      for (let i = from; i < stages.length; i++) {
        const st = stages[i];
        this.stageIndex = i;
        const map = mapFor(i);
        if (map && map !== this.mapName) yield this.loadMap(map, i === from);
        if (i === from) for (let k = 0; k < from; k++) if (stages[k].restore) stages[k].restore(this);
        if (st.checkpoint) {
          this.checkpoint = i;
          this.checkpointCarry = this.snapshot();
          DM.Save.checkpointAt(this.chapter.id, i, this.checkpointCarry);
        }
        yield* this.runStage(st);
      }
      yield* this.finish();
    }

    *runStage(st) {
      this.skipRequested = false;
      const gen = st.run(this);
      while (true) {
        if (this.skipRequested) {
          this.cleanupSkip(st);
          return;
        }
        const r = gen.next();
        if (r.done) return;
        yield r.value;
      }
    }

    // Developer skip (] in dev mode): jump to the end state of the current stage.
    skipStage() {
      this.skipRequested = true;
    }
    cleanupSkip(st) {
      this.scene.dialog.close();
      this.hud.clearTransient();
      this.hud.setObjective(null);
      this.hud.marker = null;
      this.lock(false);
      this.camTarget = null;
      for (const id of st.grants || []) this.player.unlock(id);
      if (st.restore) st.restore(this);
      this.threads = this.threads.filter((t) => t === this.threads[0]);
    }

    *finish() {
      this.done = true;
      this.lock(true);
      this.hud.setObjective(null);
      yield this.wait(0.4);
      this.scene.completeChapter();
    }

    // ---- waiters ------------------------------------------------------------
    wait(t) {
      let e = 0;
      return { update: (dt) => (e += dt) >= t };
    }
    until(fn) {
      return { update: () => !!fn() };
    }
    dialog(lines) {
      const d = this.scene.dialog;
      d.open(lines);
      return { update: () => !d.active };
    }
    // Narration caption. Returned waiter resolves when it has faded.
    narrate(text, o = {}) {
      const c = this.hud.caption(text, o);
      return { update: () => c.gone };
    }
    banner(title, sub, o = {}) {
      const b = this.hud.banner(title, sub, o);
      return { update: () => b.gone };
    }
    // A power's card is shown once per save; afterwards (retries, replays) a
    // toast names the power and its key and the script carries straight on.
    unlock(id) {
      this.player.unlock(id);
      const seen = DM.Save.data.seen && DM.Save.data.seen.unlocks;
      const def = DM.Powers.get(id);
      if (seen && seen[id] && def) {
        const key = DM.Input.short[def.action];
        this.hud.toast(def.name.toUpperCase() + (key ? '  ·  ' + key : ''), def.color);
        return { update: () => true };
      }
      let closed = false;
      DM.Engine.push(new DM.Scenes.PowerUnlock(id, () => {
        closed = true;
        if (seen) {
          seen[id] = true;
          DM.Save.write();
        }
      }));
      return { update: () => closed };
    }
    // Calls fn(k) every frame with k going 0 -> 1 over `dur` seconds of real time
    // (frame-rate independent); resolves once fn(1) has run.
    tween(dur, fn) {
      let e = 0;
      return {
        update: (dt) => {
          e += dt;
          const k = dur > 0 ? Math.min(1, e / dur) : 1;
          fn(k);
          return k >= 1;
        },
      };
    }
    // True the first time `key` is asked about in this chapter, false on every
    // retry after that: for briefings that should not repeat.
    once(key) {
      if (this.memo[key]) return false;
      this.memo[key] = true;
      return true;
    }
    minigame(SceneClass, opts) {
      let result = null;
      DM.Engine.push(new SceneClass(opts || {}, (r) => (result = r == null ? true : r)));
      return { update: () => result !== null };
    }
    countdown(seconds, label) {
      const c = this.hud.startCountdown(seconds, label);
      return { update: () => c.left <= 0 };
    }
    // Map builders call this to create their World, so ctx.add() lands in it.
    newWorld(opts) {
      this._building = new DM.World(opts);
      return this._building;
    }
    loadMap(name, instant) {
      const build = () => {
        let world;
        try {
          world = this.chapter.maps[name](this);
        } finally {
          this._building = null;
        }
        this.mapName = name;
        world.mapId = name; // keys the map's light, weather and walls (src/data/atmosphere.js)
        this.scene.setWorld(world);
      };
      if (instant) {
        build();
        return null;
      }
      let built = false;
      DM.Engine.fadeTo(() => {
        build();
        built = true;
      }, { out: 0.5, in: 0.6 });
      return { update: () => built };
    }

    // ---- actions ------------------------------------------------------------
    // Cutscene lock. Locking also clears hostile shots in flight, so nothing
    // lands on Jon while he cannot act.
    lock(on) {
      this.locked = on;
      if (on) {
        DM.Audio.hum('tk', false);
        this.clearHostiles();
      }
    }
    // Fizzle every enemy projectile in the world (bullets, shells, missiles,
    // discs). Thrown-back missiles belong to the player and are left alone.
    clearHostiles() {
      const W = this.scene.world;
      if (!W) return 0;
      let n = 0;
      for (const e of W.entities.slice()) {
        if (e.dead || !e.isProjectile || e.team === 'player') continue;
        W.particles.burst(e.x, e.y, 6, { color: ['#bff1ff', '#ffffff'], speed: [30, 140], life: [0.15, 0.4], size: [1, 2.5], shape: 'spark' });
        e.die('fizzle');
        n++;
      }
      return n;
    }
    add(e) {
      return this.world.add(e);
    }
    objective(text, progress) {
      this.hud.setObjective(text, progress);
    }
    objectiveDone() {
      this.hud.completeObjective();
    }
    hint(text, dur) {
      this.hud.hint(text, dur);
    }
    // An instruction the player needs to progress: shown even with HINTS on ESSENTIAL.
    tutorial(text, dur) {
      this.hud.hint(text, dur, { essential: true });
    }
    toast(text, color) {
      this.hud.toast(text, color);
    }
    marker(x, y, label) {
      this.hud.marker = x == null ? null : { x, y, label };
    }
    flash(color = '#ffffff', dur = 0.6, o) {
      this.hud.flash(color, dur, o);
    }
    cinematic(on) {
      this.hud.cinematic = on;
    }
    focus(x, y) {
      this.camTarget = x == null ? null : { x, y };
    }
    place(x, y, facing) {
      const p = this.player;
      p.x = x;
      p.y = y;
      p.vx = p.vy = 0;
      if (facing != null) p.facing = facing;
      this.world.camera.snap(x, y);
    }
    music(id) {
      DM.Audio.music.play(id);
    }
    setForm(form) {
      this.player.setForm(form);
      if (form === 'human') this.player.look = Object.assign({}, DM.LOOKS.jon);
    }
  }

  DM.ChapterContext = ChapterContext;
})();
</script>

<script>/* src/game/ui/widgets.js */
/*
 * Menu: a vertical list driven by keyboard (W/S/arrows + Enter/Space) and mouse.
 * Items: { label, action(), disabled, value() -> string, adjust(dir), desc }.
 * Items with `adjust` are sliders/choices/toggles: left/right change them. With
 * the mouse, the ‹ and › glyphs step down/up and a click anywhere else on the
 * row steps forward. Sliders also give `frac()` (0..1, drawn as a bar) and
 * `setFrac(f)`, so clicking the bar sets the value directly.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const Gfx = DM.Gfx;
  const Input = DM.Input;
  const Audio = DM.Audio;

  const BAR_W = 150;
  const inside = (x, z) => !!z && x >= z[0] && x <= z[1];

  class Menu {
    constructor(items, o = {}) {
      this.items = items;
      this.x = o.x || 100;
      this.y = o.y || 300;
      this.w = o.w || 340;
      this.itemH = o.itemH || 46;
      this.size = o.size || 24;
      this.align = o.align || 'left';
      this.onBack = o.onBack || null;
      this.accent = o.accent || DM.C.blue;
      this.valueW = o.valueW || 120; // width of the value column between ‹ and ›
      this.sel = Math.max(0, items.findIndex((i) => !i.disabled));
      this.t = 0;
    }
    rowRect(i) {
      const x = this.align === 'center' ? this.x - this.w / 2 : this.x;
      return { x, y: this.y + i * this.itemH, w: this.w, h: this.itemH };
    }
    hit(mx, my) {
      for (let i = 0; i < this.items.length; i++) {
        const r = this.rowRect(i);
        if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) return i;
      }
      return -1;
    }
    // Horizontal hit zones of an adjustable row: the two glyphs and the slider bar.
    zones(i) {
      const r = this.rowRect(i);
      const right = r.x + r.w - 16;
      const gw = this.size * 0.8;
      const lx = right - gw - 8 - this.valueW - 8; // right edge of the ‹ glyph
      const z = { left: [lx - gw - 10, lx + 6], right: [right - gw - 6, right + 12], value: [lx + 8, right - gw - 8] };
      if (this.items[i].frac) z.bar = [lx - gw - 14 - BAR_W, lx - gw - 14];
      return z;
    }
    move(dir) {
      const n = this.items.length;
      for (let k = 1; k <= n; k++) {
        const i = (this.sel + dir * k + n * 4) % n;
        if (!this.items[i].disabled) {
          this.sel = i;
          Audio.play('ui_move');
          return;
        }
      }
    }
    update(dt) {
      this.t += dt;
      const m = Input.mouse;
      if (m.moved) {
        const i = this.hit(m.x, m.y);
        if (i >= 0 && !this.items[i].disabled && i !== this.sel) {
          this.sel = i;
          Audio.play('ui_move');
        }
      }
      if (Input.clicked()) {
        const i = this.hit(m.x, m.y);
        Input.consume('confirm');
        if (i >= 0) {
          this.sel = i;
          this.click(i, m.x);
        }
        return;
      }
      if (Input.pressed('menuDown')) this.move(1);
      if (Input.pressed('menuUp')) this.move(-1);
      const it = this.items[this.sel];
      if (it && it.adjust && !it.disabled) {
        if (Input.pressed('menuLeft')) {
          it.adjust(-1);
          Audio.play('ui_move');
        }
        if (Input.pressed('menuRight')) {
          it.adjust(1);
          Audio.play('ui_move');
        }
      }
      if (Input.pressed('confirm')) {
        Input.consume('confirm');
        this.activate(this.sel, 1);
