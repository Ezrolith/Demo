  // Tachyon emitter: jams Temporal Sight, shielded against anything from outside.
  class Emitter extends Machine {
    constructor(o = {}) {
      super(Object.assign({ hp: 140, r: 22, mass: 99, static: true, grabbable: false, boomR: 70, boomDmg: 10, colors: ['#d4ad3a', '#6f4aa6', '#c06bff', '#ffffff'] }, o));
      this.shieldR = 125;
      this.jamR = 330;
      this.inside = new Set();
      this.flash = 0;
      this.arcs = [];
    }
    update(dt, world) {
      this.flash = Math.max(0, this.flash - dt);
      const p = world.player;
      if (p && U.dist(this.x, this.y, p.x, p.y) < this.jamR) p.jamT = Math.max(p.jamT, 0.2);
      for (const e of world.entities) {
        if (e.dead || e === this || e.static) continue;
        const d = U.dist(this.x, this.y, e.x, e.y);
        const inside = this.inside.has(e.id);
        if (d < this.shieldR) {
          if (inside) continue;
          if (e.isPlayer && (world.realTime || 0) - (e.teleportedAt == null ? -9 : e.teleportedAt) < 0.2) {
            this.inside.add(e.id);
            continue;
          }
          if (e.isProjectile) {
            if (e.boom) e.boom(world);
            else e.die('blocked');
            this.onShieldBlock(world);
            continue;
          }
          const n = U.norm(e.x - this.x, e.y - this.y);
          const nx = n.l ? n.x : 1, ny = n.l ? n.y : 0;
          e.x = this.x + nx * (this.shieldR + 1);
          e.y = this.y + ny * (this.shieldR + 1);
          const vn = e.vx * nx + e.vy * ny;
          if (vn < 0) {
            e.vx -= 1.6 * vn * nx;
            e.vy -= 1.6 * vn * ny;
            if (vn < -120) this.onShieldBlock(world);
          }
        } else if (inside && d > this.shieldR + e.r) this.inside.delete(e.id);
      }
      if (Math.random() < dt * 8) this.arcs.push({ a: U.rand(0, Math.PI * 2), t: 0.12 });
      for (const a of this.arcs) a.t -= dt;
      this.arcs = this.arcs.filter((a) => a.t > 0);
    }
    onShieldBlock(world) {
      this.flash = 0.4;
      Audio.play('shield');
      DM.Events.emit('shield:block', this);
    }
    onDeath(kind) {
      super.onDeath('explosion');
      Audio.play('zap');
      if (this.world) this.world.particles.burst(this.x, this.y, 50, { color: this.colors, speed: [80, 360], life: [0.3, 1], size: [2, 4], shape: 'spark' });
      DM.Events.emit('emitter:down', this);
    }
    render(ctx, world) {
      const t = world.realTime || 0;
      ctx.save();
      ctx.strokeStyle = 'rgba(111,74,166,0.3)';
      ctx.setLineDash([2, 10]);
      ctx.lineDashOffset = t * 15;
      ctx.lineWidth = 2;
      Gfx.circle(ctx, this.x, this.y, this.jamR);
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      Gfx.circle(ctx, this.x + 4, this.y + 6, 26);
      ctx.fill();
      ctx.fillStyle = '#2a2440';
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        ctx.lineTo(this.x + Math.cos(a) * 28, this.y + Math.sin(a) * 28);
      }
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = this.hitFlash > 0 ? '#ffffff' : '#d4ad3a';
      Gfx.circle(ctx, this.x, this.y, 15);
      ctx.fill();
      Gfx.glow(ctx, this.x, this.y, 26 + Math.sin(t * 6) * 4, '#c06bff', 0.9);
      ctx.save();
      ctx.strokeStyle = 'rgba(140,70,220,0.85)';
      ctx.lineWidth = 1.5;
      for (const a of this.arcs) {
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        let px = this.x, py = this.y;
        for (let i = 1; i <= 5; i++) {
          const r = (this.shieldR * i) / 5;
          px = this.x + Math.cos(a.a + U.rand(-0.15, 0.15)) * r;
          py = this.y + Math.sin(a.a + U.rand(-0.15, 0.15)) * r;
          ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
      ctx.restore();
      // Drawn without additive blending so the shield still reads against snow.
      ctx.save();
      ctx.strokeStyle = `rgba(111,74,166,${Math.min(1, 0.55 + this.flash)})`;
      ctx.lineWidth = 3 + this.flash * 6;
      ctx.setLineDash([12, 6]);
      ctx.lineDashOffset = -t * 30;
      Gfx.circle(ctx, this.x, this.y, this.shieldR);
      ctx.stroke();
      ctx.fillStyle = `rgba(111,74,166,${0.08 + this.flash * 0.2})`;
      ctx.fill();
      ctx.restore();
    }
  }

      this.damage(70, source, 'disintegrate');
    }
    damage(amount, source, kind) {
      if (this.yielded || this.dead) return false;
      if (kind === 'impact') amount *= 1.7;
      if (kind === 'bolt') amount *= 0.6;
      this.hp -= amount;
      this.hitFlash = 0.15;
      if (this.hp <= 1) this.yieldNow();
      return true;
    }
    die() {
      this.yieldNow();
    }
    onImpact(speed, other, world) {
      const dmg = (speed - 200) * 0.12 * (other ? U.clamp(other.mass, 0.6, 6) : 1.4);
      if (dmg <= 1) return;
      this.damage(dmg, other, 'impact');
      this.stun = Math.max(this.stun, 1.1);
      world.particles.burst(this.x, this.y, 10, { color: ['#d4ad3a', '#ffffff'], speed: [60, 200], life: [0.2, 0.5], size: [2, 3.5] });
      Audio.play('impact');
      world.camera.shake(0.25);
    }
    yieldNow() {
      if (this.yielded) return;
      this.yielded = true;
      this.hp = 0;
      this.grabbable = false;
      this.disintegratable = false;
      this.heldBy = null;
      this.vx = this.vy = 0;
      Events.emit('veidt:yield', this);
    }
    onHeld(dt, world) {
      this.heldT += dt;
      const limit = this.heldBy && this.heldBy.scale > 1.3 ? 3 : 1.5;
      if (this.heldT > limit) {
        const p = this.heldBy;
        this.heldBy = null;
        this.heldT = 0;
        this.stun = 0;
        this.thrown = 0;
        world.bark(this, U.pick(VEIDT_FREE), 1.6);
        const n = U.norm(this.x - p.x, this.y - p.y);
        this.dash(this.x + n.x * 200, this.y + n.y * 200);
      }
    }
    dash(x, y) {
      this.state = 'dash';
      this.dashT = 0.35;
      this.dashTarget = { x: U.clamp(x, 60, this.world.w - 60), y: U.clamp(y, 60, this.world.h - 60) };
    }
    onDisintegrateCast(c, world) {
      if (this.yielded || this.heldBy || this.stun > 0 || this.dodgeCd > 0 || this.state === 'melee') return;
      if (U.dist(this.x, this.y, c.x, c.y) > c.r + 70) return;
      const chance = world.timesight ? 0.2 : 0.85;
      if (Math.random() > chance) return;
      let n = U.norm(this.x - c.x, this.y - c.y);
      if (!n.l) n = { x: 1, y: 0 };
      const side = U.chance(0.5) ? 1 : -1;
      this.dash(this.x + (n.x - n.y * side) * 150, this.y + (n.y + n.x * side) * 150);
      this.dodgeCd = 0.6;
      world.bark(this, U.pick(VEIDT_DODGE), 1.3);
    }
    update(dt, world) {
      if (this.yielded) {
        this.vx = U.damp(this.vx, 0, 8, dt);
        this.vy = U.damp(this.vy, 0, 8, dt);
        return;
      }
      if (!this.heldBy) this.heldT = 0;
      super.update(dt, world);
    }
    think(dt, world) {
      const p = world.player;
      if (!p) return;
      this.walk += dt * this.speed * 0.09;
      this.dodgeCd -= dt;
      this.discCd -= dt;
      this.strikeCd -= dt;
      this.summonT -= dt;
      const phase = this.hp < this.maxHp * 0.5 ? 2 : 1;

      if (this.state === 'dash') {
        this.dashT -= dt;
        this.steer(this.dashTarget.x, this.dashTarget.y, 760, dt, 14);
        if (Math.random() < dt * 60) world.particles.emit(this.x, this.y, { life: 0.3, size: 10, size1: 4, color: '#6f4aa6', add: false, shape: 'smoke', alpha: 0.35, drag: 0 });
        if (this.dashT <= 0 || U.dist(this.x, this.y, this.dashTarget.x, this.dashTarget.y) < 12) this.state = 'strafe';
        return;
      }

      let dup = null, dd = 110;
      for (const e of world.entities) {
        if (!e.isDuplicate || e.dead) continue;
        const d = U.dist(this.x, this.y, e.x, e.y);
        if (d < dd) {
          dd = d;
          dup = e;
        }
      }
      if (dup) {
        this.state = 'melee';
        this.facing = U.dampAngle(this.facing, U.angleTo(this.x, this.y, dup.x, dup.y), 14, dt);
        if (dd > this.r + dup.r + 4) this.steer(dup.x, dup.y, 300, dt, 10);
        else if (this.strikeCd <= 0) {
          this.strikeCd = 0.45;
          dup.damage(30, this, 'strike');
          world.particles.burst(dup.x, dup.y, 8, { color: ['#ffffff', '#7fe3ff'], speed: [80, 200], life: [0.1, 0.3], size: [2, 3], shape: 'spark' });
          Audio.play('impact');
        }
        return;
      }
      if (this.state === 'melee') this.state = 'strafe';

      if (this.phi == null) this.phi = U.angleTo(p.x, p.y, this.x, this.y);
      this.phi += this.orbitDir * dt * (0.7 + phase * 0.3);
      const sp = this.speedBase * (phase === 2 ? 1.2 : 1);
      this.steer(p.x + Math.cos(this.phi) * this.orbitR, p.y + Math.sin(this.phi) * this.orbitR, sp, dt, 5);
      this.facing = U.dampAngle(this.facing, U.angleTo(this.x, this.y, p.x, p.y), 10, dt);

      if (this.discCd <= 0) {
        this.discCd = phase === 2 ? 1.6 : 2.4;
        world.add(new TachyonDisc({ x: this.x, y: this.y, tx: p.x + p.vx * 0.4, ty: p.y + p.vy * 0.4 }));
        Audio.play('whoosh');
      }
      if (phase === 2 && this.summonT <= 0) {
        this.summonT = 14;
        const drones = world.entities.filter((e) => e instanceof Drone && !e.dead).length;
        if (drones < 4) {
          for (const s of [-1, 1]) world.add(new Drone({ x: U.clamp(this.x + s * 300, 80, world.w - 80), y: U.clamp(this.y - 200, 80, world.h - 80), style: 'karnak', alerted: true }));
          world.bark(this, 'You are not the only one with help.', 2);
        }
      }
      this.stateT -= dt;
      if (this.stateT <= 0) {
        this.stateT = U.rand(2.2, 4);
        if (U.chance(0.4)) this.orbitDir *= -1;
        this.orbitR = U.rand(200, 300);
      }
    }
    render(ctx, world) {
      if (this.yielded) {
        Gfx.figure(ctx, Object.assign({}, this.look, { x: this.x, y: this.y, angle: this.facing, scale: 0.9 }));
        return;
      }
      Gfx.figure(ctx, Object.assign({}, this.look, {
        x: this.x, y: this.y, angle: this.facing, walk: this.walk, moving: this.speed > 20,
        carry: this.state === 'melee', flash: this.hitFlash > 0 ? 0.7 : 0,
      }));
    }
    renderFuture(ctx) {
      if (this.state === 'dash' && this.dashTarget) {
        ctx.save();
        ctx.globalAlpha = 0.45;
        Gfx.figure(ctx, Object.assign({}, this.look, { x: this.dashTarget.x, y: this.dashTarget.y, angle: this.facing, noShadow: true }));
        ctx.restore();
      }
      if (this.phi != null && this.world.player) {
        const p = this.world.player;
        const fa = this.phi + this.orbitDir * 1.2;
        ctx.save();
        ctx.strokeStyle = 'rgba(242,196,24,0.45)';
        ctx.setLineDash([4, 6]);
        ctx.beginPath();
        ctx.arc(p.x, p.y, this.orbitR, this.phi, fa, this.orbitDir < 0);
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  DM.Enemies = { Enemy, Gangster, Machine, Drone, Tank, Battery, Behemoth, Turret, Emitter, Veidt };
})();
</script>
<script>/* src/game/entities/special.js */
/*
 * Chapter-specific entities: the reassembly (atoms, entropy, the body), Mars
 * (crystal shards, palace slots, memories, meteors), and power effects
 * (duplicates, afterimages, tachyon clouds), plus mines.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Audio = DM.Audio;
  const Entity = DM.Entity;
  const TAU = Math.PI * 2;

  // ---- Reassembly ---------------------------------------------------------------
  class Atom extends Entity {
    constructor(x, y, o = {}) {
      super({ x, y, r: 4, body: false, solid: false, layer: 2, disintegratable: false, mass: 0.1, friction: 1.6 });
      this.seed = Math.random() * 100;
      this.color = U.pick(['#9fe8ff', '#5fd4ff', '#ffffff', '#bfe9ff']);
      if (o.vx) {
        this.vx = o.vx;
        this.vy = o.vy;
      }
    }
    update(dt, world) {
      this.vx += Math.cos(this.age * 0.7 + this.seed) * 10 * dt;
      this.vy += Math.sin(this.age * 0.6 + this.seed * 1.3) * 10 * dt;
      const p = world.player;
      if (!p || p.form !== 'awareness' || p.locked) return;
      const d = U.dist(this.x, this.y, p.x, p.y);
      if (d > p.pullRadius || p.carry >= p.carryMax) return;
      const n = U.norm(p.x - this.x, p.y - this.y);
      const k = (1 - d / p.pullRadius) * 1100 + 160;
      this.vx += n.x * k * dt;
      this.vy += n.y * k * dt;
      if (d < p.r + 6) {
        this.dead = true;
        p.carry++;
        Audio.play('atom', { i: p.carry });
        world.particles.burst(this.x, this.y, 4, { color: ['#ffffff', '#7fe3ff'], speed: [20, 80], life: [0.2, 0.4], size: [1.5, 2.5] });
        DM.Events.emit('atom:absorbed', p.carry);
      }
    }
    render(ctx, world) {
      const tw = 0.7 + Math.sin(this.age * 5 + this.seed) * 0.3;
      Gfx.glow(ctx, this.x, this.y, 12, '#5fd4ff', 0.55 * tw);
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x - 1.6, this.y - 1.6, 3.2, 3.2);
    }
  }

  // Entropy: wandering dark vortices that tear loose atoms back out of you.
  class Vortex extends Entity {
    constructor(x, y, o = {}) {
      super({ x, y, r: o.r || 48, body: false, solid: false, layer: 0, disintegratable: false, friction: 0.8 });
      this.speedBase = o.speed || 45;
      this.wander = U.rand(0, TAU);
      this.cool = 0;
      this.home = o.home || null; // stay out of this circle {x, y, r}
      this.spin = U.rand(0, TAU);
    }
    update(dt, world) {
      this.cool -= dt;
      this.spin += dt * 2.2;
      const p = world.player;
      this.wander += U.rand(-1.2, 1.2) * dt;
      let a = this.wander;
      if (p) a = U.lerpAngle(this.wander, U.angleTo(this.x, this.y, p.x, p.y), 0.3);
      let tx = Math.cos(a) * this.speedBase, ty = Math.sin(a) * this.speedBase;
      if (this.home) {
        const d = U.dist(this.x, this.y, this.home.x, this.home.y);
        if (d < this.home.r) {
          const n = U.norm(this.x - this.home.x, this.y - this.home.y);
          tx = n.x * 90;
          ty = n.y * 90;
          this.wander = Math.atan2(n.y, n.x);
        }
      }
      this.vx = U.damp(this.vx, tx, 1.5, dt);
      this.vy = U.damp(this.vy, ty, 1.5, dt);
      for (const e of world.entities) {
        if (!(e instanceof Atom)) continue;
        const d = U.dist(this.x, this.y, e.x, e.y);
        if (d > 200 || d < 1) continue;
        const n = U.norm(this.x - e.x, this.y - e.y);
        e.vx += n.x * 120 * (1 - d / 200) * dt;
        e.vy += n.y * 120 * (1 - d / 200) * dt;
        if (d < 10) e.dead = true;
      }
      if (!p || p.form !== 'awareness' || p.locked) return;
      const d = U.dist(this.x, this.y, p.x, p.y);
      if (d < 210) {
        const n = U.norm(this.x - p.x, this.y - p.y);
        p.vx += n.x * 240 * (1 - d / 210) * dt;
        p.vy += n.y * 240 * (1 - d / 210) * dt;
      }
      if (d < this.r * 0.6 && this.cool <= 0 && p.invuln <= 0) {
        const lost = Math.ceil(p.carry * 0.4);
        p.carry -= lost;
        for (let i = 0; i < lost; i++) {
          const ang = U.rand(0, TAU);
          const sp = U.rand(160, 360);
          world.add(new Atom(p.x, p.y, { vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp }));
        }
        const n = U.norm(p.x - this.x, p.y - this.y);
        p.vx = (n.l ? n.x : 1) * 520;
        p.vy = (n.l ? n.y : 0) * 520;
        p.invuln = 1.2;
        this.cool = 1.5;
        Audio.play('hit');
        world.camera.shake(0.35);
        DM.Events.emit('vortex:hit', lost);
      }
    }
    render(ctx, world) {
      const r = this.r;
      ctx.save();
      ctx.translate(this.x, this.y);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2.2);
      g.addColorStop(0, 'rgba(0,0,0,0.95)');
      g.addColorStop(0.35, 'rgba(25,6,30,0.75)');
      g.addColorStop(1, 'rgba(25,6,30,0)');
      ctx.fillStyle = g;
      Gfx.circle(ctx, 0, 0, r * 2.2);
      ctx.fill();
      ctx.lineWidth = 2;
      for (let i = 0; i < 5; i++) {
        ctx.strokeStyle = i % 2 ? 'rgba(160,40,90,0.55)' : 'rgba(90,40,140,0.55)';
        ctx.beginPath();
        for (let k = 0; k <= 24; k++) {
          const f = k / 24;
          const a = this.spin + (i * TAU) / 5 + f * 3.4;
          const rr = r * 1.9 * (1 - f) + 4;
          if (k === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
          else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
        }
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // The body Jon rebuilds, drawn front-on as an anatomical figure, layer by layer.
  // layers: [nervous, circulatory, skeleton, muscle] each 0..1; skin 0..1.
  class BodyForm extends Entity {
    constructor(x, y, o = {}) {
      super({ x, y, r: 60, static: true, body: false, solid: false, layer: 0, disintegratable: false });
      this.H = o.H || 260;
      this.layers = [0, 0, 0, 0];
      this.skin = 0;
      this.depositR = o.depositR || 120;
      this.ring = o.ring !== false;
      this.pulse = 0;
      const rnd = U.seeded(1959);
      this.branches = [];
      for (let i = 0; i < 40; i++) this.branches.push({ seg: (rnd() * 8) | 0, f: rnd(), len: 0.02 + rnd() * 0.03, side: rnd() < 0.5 ? -1 : 1 });
    }
    update(dt) {
      this.pulse = Math.max(0, this.pulse - dt);
    }
    render(ctx, world) {
      const t = world.realTime || 0;
      const X = this.x, Y = this.y, H = this.H;
      if (this.ring) {
        ctx.save();
        ctx.strokeStyle = `rgba(127,227,255,${0.25 + this.pulse})`;
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 8]);
        ctx.lineDashOffset = t * 12;
        Gfx.circle(ctx, X, Y, this.depositR);
        ctx.stroke();
        ctx.setLineDash([2, 10]);
        ctx.lineDashOffset = -t * 20;
        Gfx.circle(ctx, X, Y, this.depositR * 1.35);
        ctx.stroke();
        ctx.restore();
        Gfx.glow(ctx, X, Y, this.depositR * 1.4, '#1b7fd0', 0.25 + this.pulse * 0.6);
      }
      const P = (u, v) => [X + u * H, Y + v * H];
      const K = {
        head: [0, -0.4], neck: [0, -0.33], sL: [-0.12, -0.3], sR: [0.12, -0.3], eL: [-0.16, -0.14], eR: [0.16, -0.14],
        wL: [-0.18, 0.01], wR: [0.18, 0.01], hL: [-0.19, 0.06], hR: [0.19, 0.06], hipL: [-0.065, 0.02], hipR: [0.065, 0.02],
        kL: [-0.075, 0.24], kR: [0.075, 0.24], aL: [-0.08, 0.44], aR: [0.08, 0.44], fL: [-0.105, 0.47], fR: [0.105, 0.47], pel: [0, 0.01],
      };
      const limbs = [
        ['sL', 'eL'], ['eL', 'wL'], ['sR', 'eR'], ['eR', 'wR'], ['hipL', 'kL'], ['kL', 'aL'], ['hipR', 'kR'], ['kR', 'aR'],
      ];
      const seg = (a, b) => {
        const A = P(...K[a]), B = P(...K[b]);
        ctx.beginPath();
        ctx.moveTo(A[0], A[1]);
        ctx.lineTo(B[0], B[1]);
        ctx.stroke();
      };
      const fl = (v) => (v >= 1 ? 1 : v * (0.55 + Math.random() * 0.45));
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // skeleton
      const sk = fl(this.layers[2]);
      if (sk > 0) {
        ctx.globalAlpha = sk;
        ctx.strokeStyle = '#efe7d2';
        ctx.fillStyle = '#efe7d2';
        ctx.lineWidth = H * 0.016;
        for (const [a, b] of limbs) seg(a, b);
        for (const k of ['eL', 'eR', 'kL', 'kR', 'wL', 'wR', 'aL', 'aR', 'sL', 'sR']) {
          const p = P(...K[k]);
          Gfx.circle(ctx, p[0], p[1], H * 0.013);
          ctx.fill();
        }
        ctx.lineWidth = H * 0.007;
        seg('sL', 'neck');
        seg('sR', 'neck');
        for (let i = 0; i < 16; i++) {
          const p = P(0, -0.33 + i * 0.021);
          ctx.fillRect(p[0] - H * 0.008, p[1] - H * 0.006, H * 0.016, H * 0.012);
        }
        for (let i = 0; i < 7; i++) {
          const y = -0.285 + i * 0.026;
          for (const s of [-1, 1]) {
            const A = P(0, y), C = P(s * 0.11, y - 0.005), B = P(s * 0.075, y + 0.04);
            ctx.beginPath();
            ctx.moveTo(A[0], A[1]);
            ctx.quadraticCurveTo(C[0], C[1], B[0], B[1]);
            ctx.stroke();
          }
        }
        ctx.lineWidth = H * 0.01;
        for (const s of [-1, 1]) {
          const A = P(0, -0.005), C = P(s * 0.11, -0.03), B = P(s * 0.06, 0.05);
          ctx.beginPath();
          ctx.moveTo(A[0], A[1]);
          ctx.quadraticCurveTo(C[0], C[1], B[0], B[1]);
          ctx.stroke();
        }
        const hd = P(...K.head);
        ctx.lineWidth = H * 0.012;
        Gfx.circle(ctx, hd[0], hd[1], H * 0.057);
        ctx.stroke();
        ctx.fillStyle = '#2a2622';
        Gfx.circle(ctx, hd[0] - H * 0.02, hd[1], H * 0.012);
        ctx.fill();
        Gfx.circle(ctx, hd[0] + H * 0.02, hd[1], H * 0.012);
        ctx.fill();
      }

      // nervous system
      const nv = fl(this.layers[0]);
      if (nv > 0) {
        ctx.globalAlpha = nv;
        ctx.strokeStyle = '#fff1c1';
        ctx.lineWidth = H * 0.005;
        const hd = P(...K.head);
        Gfx.ellipse(ctx, hd[0], hd[1] - H * 0.006, H * 0.05, H * 0.044);
        ctx.stroke();
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.arc(hd[0] + (i - 1.5) * H * 0.02, hd[1] - H * 0.01, H * 0.015, 0, Math.PI);
          ctx.stroke();
        }
        seg('neck', 'pel');
        for (const [a, b] of limbs) seg(a, b);
        seg('neck', 'sL');
        seg('neck', 'sR');
        seg('pel', 'hipL');
        seg('pel', 'hipR');
        for (let i = 0; i < 8; i++) {
          const y = -0.29 + i * 0.035;
          for (const s of [-1, 1]) {
            const A = P(0, y), B = P(s * 0.075, y + 0.015);
            ctx.beginPath();
            ctx.moveTo(A[0], A[1]);
            ctx.lineTo(B[0], B[1]);
            ctx.stroke();
          }
        }
        ctx.lineWidth = H * 0.003;
        for (const b of this.branches) {
          const [a, c] = limbs[b.seg];
          const A = K[a], C = K[c];
          const u = U.lerp(A[0], C[0], b.f), v = U.lerp(A[1], C[1], b.f);
          const p0 = P(u, v), p1 = P(u + b.side * b.len, v + b.len * 0.6);
          Gfx.line(ctx, p0[0], p0[1], p1[0], p1[1]);
        }
        Gfx.glow(ctx, hd[0], hd[1], H * 0.12, '#fff1c1', 0.35 * nv);
      }

      // circulatory system
      const cv = fl(this.layers[1]);
      if (cv > 0) {
        ctx.globalAlpha = cv;
        ctx.lineWidth = H * 0.006;
        for (const [col, off] of [['#d8473f', 0.008], ['#4a6fd8', -0.008]]) {
          ctx.strokeStyle = col;
          ctx.save();
          ctx.translate(off * H, 0);
          seg('neck', 'pel');
          for (const [a, b] of limbs) seg(a, b);
          seg('neck', 'sL');
          seg('neck', 'sR');
          seg('pel', 'hipL');
          seg('pel', 'hipR');
          seg('neck', 'head');
          ctx.restore();
        }
        const hp = P(0.02, -0.21);
        const beat = 1 + Math.max(0, Math.sin(t * 7)) * 0.15;
        ctx.fillStyle = '#d8473f';
        Gfx.ellipse(ctx, hp[0], hp[1], H * 0.026 * beat, H * 0.03 * beat, 0.4);
        ctx.fill();
      }

      // musculature
      const mv = fl(this.layers[3]);
      if (mv > 0) {
        ctx.globalAlpha = mv * 0.75;
        ctx.fillStyle = '#b8423a';
        for (const [a, b] of limbs) {
          const A = P(...K[a]), B = P(...K[b]);
          const len = Math.hypot(B[0] - A[0], B[1] - A[1]);
          const thick = b.startsWith('k') || b.startsWith('e') ? 0.034 : 0.027;
          Gfx.ellipse(ctx, (A[0] + B[0]) / 2, (A[1] + B[1]) / 2, len / 2 + H * 0.01, H * thick, Math.atan2(B[1] - A[1], B[0] - A[0]));
          ctx.fill();
        }
        for (const s of [-1, 1]) {
          const pc = P(s * 0.047, -0.255);
          Gfx.ellipse(ctx, pc[0], pc[1], H * 0.05, H * 0.034);
          ctx.fill();
          const dl = P(s * 0.125, -0.29);
          Gfx.circle(ctx, dl[0], dl[1], H * 0.03);
          ctx.fill();
          for (let i = 0; i < 3; i++) {
            const ab = P(s * 0.022, -0.19 + i * 0.045);
            Gfx.rr(ctx, ab[0] - H * 0.018, ab[1] - H * 0.018, H * 0.036, H * 0.036, H * 0.01);
            ctx.fill();
          }
        }
        ctx.strokeStyle = 'rgba(255,190,170,0.35)';
        ctx.lineWidth = 1;
        for (const [a, b] of limbs) seg(a, b);
      }

      // skin: the blue man
      if (this.skin > 0) {
        ctx.globalAlpha = this.skin;
        ctx.strokeStyle = '#55c6f4';
        ctx.fillStyle = '#55c6f4';
        ctx.lineWidth = H * 0.055;
        for (const [a, b] of limbs) seg(a, b);
        ctx.lineWidth = H * 0.05;
        seg('sL', 'sR');
        seg('hipL', 'hipR');
        const to = P(0, -0.15);
        Gfx.ellipse(ctx, to[0], to[1], H * 0.105, H * 0.17);
        ctx.fill();
        const hd = P(...K.head);
        Gfx.circle(ctx, hd[0], hd[1], H * 0.064);
        ctx.fill();
        ctx.globalAlpha = this.skin;
        Gfx.hydrogen(ctx, hd[0], hd[1] - H * 0.022, H * 0.022, '#eafcff', t, 1.5);
        Gfx.glow(ctx, X, Y - H * 0.05, H * 0.75, '#2fa8ff', 0.6 * this.skin);
      }
      ctx.restore();
    }
  }

  // ---- Mars -----------------------------------------------------------------------
  class Shard extends Entity {
    constructor(x, y, big = false) {
      super({ x, y, r: big ? 26 : 12, mass: big ? 20 : 1.2, friction: 3, grabbable: true, disintegratable: false, layer: 1, colors: ['#cfefff', '#7fe3ff'] });
      this.big = big;
      this.rot = U.rand(0, TAU);
      this.placed = false;
      const n = big ? 7 : 5;
      this.verts = [];
      for (let i = 0; i < n; i++) {
        const a = (i / n) * TAU + U.rand(-0.2, 0.2);
        const rr = this.r * U.rand(0.75, 1.25);
        this.verts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
      }
    }
    update(dt) {
      if (!this.placed) this.rot += (this.vx - this.vy) * 0.0006 * dt * 60;
    }
    onBlast(x, y, r, world) {
      if (this.heldBy) this.heldBy = null;
    }
    render(ctx, world) {
      const t = world.realTime || 0;
      ctx.save();
      ctx.translate(this.x, this.y);
      if (!this.placed) {
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        Gfx.ellipse(ctx, 4, 6, this.r, this.r * 0.7);
        ctx.fill();
      }
      ctx.rotate(this.rot);
      ctx.beginPath();
      this.verts.forEach(([vx, vy], i) => (i ? ctx.lineTo(vx, vy) : ctx.moveTo(vx, vy)));
      ctx.closePath();
      ctx.fillStyle = this.placed ? 'rgba(190,240,255,0.55)' : 'rgba(170,230,255,0.38)';
      ctx.fill();
      ctx.strokeStyle = '#e6fbff';
      ctx.lineWidth = this.big ? 2.5 : 1.5;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(this.verts[0][0], this.verts[0][1]);
      ctx.lineTo(0, 0);
      ctx.lineTo(this.verts[2][0], this.verts[2][1]);
      ctx.strokeStyle = 'rgba(230,251,255,0.5)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
      Gfx.glow(ctx, this.x, this.y, this.r * 2.4, '#7fe3ff', this.placed ? 0.6 : 0.3 + Math.sin(t * 3 + this.id) * 0.08);
    }
  }

  class Slot extends Entity {
    constructor(x, y, big, palace) {
      super({ x, y, r: big ? 26 : 12, static: true, body: false, solid: false, layer: 0, disintegratable: false });
      this.big = big;
      this.palace = palace;
      this.filled = null;
      this.rot = U.rand(0, TAU);
    }
    update(dt, world) {
      if (this.filled) return;
      for (const e of world.entities) {
        if (!(e instanceof Shard) || e.placed || e.dead || e.big !== this.big) continue;
        if (U.dist(this.x, this.y, e.x, e.y) > (this.big ? 44 : 30)) continue;
        this.fill(e, world);
        break;
      }
    }
    fill(e, world) {
      e.placed = true;
      e.static = true;
      e.body = false;
      e.grabbable = false;
      e.heldBy = null;
      e.x = this.x;
      e.y = this.y;
      e.vx = e.vy = 0;
      e.rot = this.rot;
      this.filled = e;
      Audio.play('snap');
      if (world) {
        world.particles.burst(this.x, this.y, 24, { color: ['#ffffff', '#7fe3ff', '#f2c418'], speed: [40, 200], life: [0.3, 0.8], size: [1.5, 3] });
        world.particles.emit(this.x, this.y, { shape: 'ring', size: 6, size1: 60, life: 0.4, color: '#bff1ff', drag: 0 });
      }
      if (this.palace) this.palace.onFill(this);
    }
    render(ctx, world) {
      if (this.filled) return;
      const t = world.realTime || 0;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rot + t * 0.3);
      ctx.strokeStyle = `rgba(242,196,24,${0.45 + Math.sin(t * 3) * 0.2})`;
      ctx.setLineDash([4, 4]);
      ctx.lineWidth = 1.5;
      const r = this.r * 1.1;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * TAU;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }
  }

  // The glass palace: a clockwork blueprint that fills in as slots are filled.
  class Palace extends Entity {
    constructor(x, y) {
      super({ x, y, r: 320, static: true, body: false, solid: false, layer: 0, disintegratable: false });
      this.slots = [];
      this.rise = 0;
      this.risingT = 0;
      this.onFillCb = null;
    }
    addSlot(world, x, y, big) {
      const s = world.add(new Slot(x, y, big, this));
      this.slots.push(s);
      return s;
    }
    count(big) {
      return this.slots.filter((s) => s.big === big && s.filled).length;
    }
    total(big) {
      return this.slots.filter((s) => s.big === big).length;
    }
    onFill(slot) {
      if (this.onFillCb) this.onFillCb(slot);
    }
    update(dt) {
      if (this.risingT > 0) this.rise = Math.min(1, this.rise + dt / this.risingT);
    }
    render(ctx, world) {
      const t = world.realTime || 0;
      const filled = this.slots.filter((s) => s.filled).length / Math.max(1, this.slots.length);
      const a = 0.18 + filled * 0.5;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.strokeStyle = `rgba(160,225,255,${a})`;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([8, 8]);
      ctx.lineDashOffset = t * 8;
      Gfx.circle(ctx, 0, 0, 300);
      ctx.stroke();
      ctx.setLineDash([]);
      Gfx.circle(ctx, 0, 0, 230);
      ctx.stroke();
      Gfx.circle(ctx, 0, 0, 110);
      ctx.stroke();
      for (const s of this.slots) {
        if (s.big) continue;
        ctx.strokeStyle = s.filled ? 'rgba(200,245,255,0.7)' : `rgba(160,225,255,${a * 0.7})`;
        Gfx.line(ctx, 0, 0, s.x - this.x, s.y - this.y);
      }
      ctx.rotate(t * 0.05);
      ctx.strokeStyle = `rgba(242,196,24,${0.2 + filled * 0.4})`;
      for (let i = 0; i < 48; i++) {
        const ang = (i / 48) * TAU;
        Gfx.line(ctx, Math.cos(ang) * 296, Math.sin(ang) * 296, Math.cos(ang) * (i % 4 ? 286 : 276), Math.sin(ang) * (i % 4 ? 286 : 276));
      }
      ctx.restore();
      if (this.rise > 0) {
        const k = U.ease.outCubic(this.rise);
        Gfx.glow(ctx, this.x, this.y, 420 * k, '#7fe3ff', 0.45 * k);
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.globalAlpha = k;
        for (let ring = 0; ring < 3; ring++) {
          const R = 70 + ring * 70;
          const n = 6 + ring * 3;
          ctx.rotate(t * 0.04 * (ring % 2 ? -1 : 1));
          for (let i = 0; i < n; i++) {
            const ang = (i / n) * TAU;
            const h = (40 - ring * 8) * k;
            ctx.save();
            ctx.translate(Math.cos(ang) * R, Math.sin(ang) * R);
            ctx.rotate(ang);
            ctx.beginPath();
            ctx.moveTo(-h * 0.4, -h * 0.25);
            ctx.lineTo(h, 0);
            ctx.lineTo(-h * 0.4, h * 0.25);
            ctx.closePath();
            ctx.fillStyle = 'rgba(190,240,255,0.35)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(230,251,255,0.8)';
            ctx.lineWidth = 1.2;
            ctx.stroke();
            ctx.restore();
          }
        }
        ctx.restore();
        Gfx.hydrogen(ctx, this.x, this.y, 36 * k, 'rgba(230,251,255,0.9)', t, 3);
      }
    }
  }

  // A moment from Jon's life, visible only to Temporal Sight.
  class Memory extends Entity {
    constructor(x, y, o) {
      super({ x, y, r: 16, static: true, body: false, solid: false, layer: 2, disintegratable: false });
      this.year = o.year;
      this.text = o.text;
      this.rot = U.rand(-0.3, 0.3);
    }
    update(dt, world) {
      const p = world.player;
      if (!p || !world.timesight) return;
      if (U.dist(this.x, this.y, p.x, p.y) < 34 + p.r) {
        this.dead = true;
        Audio.play('memory');
        world.particles.burst(this.x, this.y, 30, { color: ['#f2c418', '#ffffff', '#7fe3ff'], speed: [40, 200], life: [0.4, 1], size: [1.5, 3] });
        DM.Events.emit('memory:found', this);
      }
    }
    render(ctx, world) {
      const t = world.realTime || 0;
      const vis = U.clamp((1 - world.timeScale) / 0.7, 0, 1);
      if (vis < 0.05) {
        if (Math.sin(t * 2 + this.id) > 0.92) Gfx.glow(ctx, this.x, this.y, 10, '#f2c418', 0.35);
        return;
      }
      ctx.save();
      ctx.globalAlpha = vis;
      ctx.translate(this.x, this.y + Math.sin(t * 2 + this.id) * 3);
      ctx.rotate(this.rot);
      Gfx.glow(ctx, 0, 0, 46, '#f2c418', 0.45);
      ctx.fillStyle = '#f1e7cc';
      ctx.fillRect(-17, -21, 34, 40);
      ctx.fillStyle = '#4a5560';
      ctx.fillRect(-13, -17, 26, 24);
      ctx.fillStyle = '#16120f';
      ctx.font = Gfx.font(9, DM.FONTS.type);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(this.year), 0, 13);
      ctx.restore();
    }
  }

  class Meteor extends Entity {
    constructor(x, y, o = {}) {
      super({ x, y, r: 70, static: true, body: false, solid: false, layer: 3, disintegratable: false });
      this.T = o.T || 2.6;
      this.t = 0;
      this.radius = o.radius || 70;
      this.dmg = o.dmg || 14;
      this.whistled = false;
    }
    update(dt, world) {
      this.t += dt;
      if (!this.whistled && this.T - this.t < 0.9) {
        this.whistled = true;
        Audio.play('meteor');
      }
      if (this.t >= this.T) {
        this.dead = true;
        world.explode(this.x, this.y, this.radius, this.dmg, { team: 'hazard', colors: ['#ffd27a', '#ff9a3c', '#c2552f', '#fff2c4'], force: 700 });
        const cx = this.x, cy = this.y, cr = this.radius * 0.55;
        world.decals.push((c) => {
          c.fillStyle = 'rgba(60,20,10,0.35)';
          Gfx.circle(c, cx, cy, cr);
          c.fill();
        });
      }
    }
    render(ctx, world) {
      const k = this.t / this.T;
      const late = this.T - this.t < 0.75;
      if (world.timesight || late) {
        ctx.save();
        ctx.strokeStyle = `rgba(255,90,60,${0.35 + k * 0.5})`;
        ctx.fillStyle = `rgba(255,90,60,${0.05 + k * 0.15})`;
        ctx.lineWidth = 2;
        Gfx.circle(ctx, this.x, this.y, this.radius);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
      if (world.timesight) {
        ctx.save();
        ctx.strokeStyle = 'rgba(242,196,24,0.4)';
        ctx.setLineDash([5, 6]);
        Gfx.line(ctx, this.x + 360, this.y - 700, this.x, this.y);
        ctx.restore();
      }
      if (late) {
        const f = 1 - (this.T - this.t) / 0.75;
        const mx = this.x + (1 - f) * 360, my = this.y - (1 - f) * 700;
        Gfx.glow(ctx, mx, my, 40, '#ff9a3c', 0.9);
        ctx.fillStyle = '#3a2418';
        Gfx.circle(ctx, mx, my, 9);
        ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        Gfx.circle(ctx, this.x, this.y, 10 + f * 20);
        ctx.fill();
      }
    }
  }

  // ---- shared ------------------------------------------------------------------------
  class Mine extends Entity {
    constructor(x, y) {
      super({ x, y, r: 10, static: true, body: false, solid: false, hp: 1, layer: 0, team: 'enemy', colors: ['#3a3a30', '#c4302b'] });
      this.trig = -1;
    }
    update(dt, world) {
      if (this.trig >= 0) {
        this.trig -= dt;
        if (this.trig < 0) {
          this.dead = true;
          world.explode(this.x, this.y, 80, 28, { team: 'enemy' });
        }
        return;
      }
      for (const e of world.entities) {
        if (e.team !== 'player' || e.dead || e.flying) continue;
        if (U.dist(this.x, this.y, e.x, e.y) < 36 + e.r) {
          this.trig = 0.3;
          Audio.play('ui_move');
          break;
        }
      }
    }
    onDeath(kind) {
      if (kind !== 'disintegrate' && this.world && this.trig < 0) {
        const w = this.world;
        w.defer(() => w.explode(this.x, this.y, 80, 28, { team: 'enemy' }));
      }
    }
    render(ctx, world) {
      const t = world.realTime || 0;
      const vis = world.timesight ? 1 : 0.55;
      ctx.save();
      ctx.globalAlpha = vis;
      ctx.fillStyle = '#3a3a30';
      Gfx.circle(ctx, this.x, this.y, 9);
      ctx.fill();
      ctx.strokeStyle = '#1d1d18';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
      const blink = this.trig >= 0 || Math.sin(t * 6 + this.id) > 0.6;
      if (blink) Gfx.glow(ctx, this.x, this.y, this.trig >= 0 ? 24 : 9, '#ff3a2a', world.timesight ? 1 : 0.7);
      if (world.timesight) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255,90,60,0.35)';
        ctx.setLineDash([3, 4]);
        Gfx.circle(ctx, this.x, this.y, 80);
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  class Duplicate extends Entity {
    constructor(owner, x, y, life) {
      super({ x, y, r: 12, mass: 2.5, friction: 9, team: 'player', hp: 60, disintegratable: false });
      this.isDuplicate = true;
      this.timeless = true;
      this.targetable = true;
      this.owner = owner;
      this.life = life;
      this.maxLife = life;
      this.fireCd = U.rand(0.2, 0.6);
      this.facing = owner.facing;
      this.walk = 0;
      this.offset = U.rand(0, TAU);
    }
    expire(world) {
      if (this.dead) return;
      this.dead = true;
      world.particles.burst(this.x, this.y, 18, { color: ['#7fe3ff', '#ffffff'], speed: [30, 140], life: [0.3, 0.7], size: [1.5, 3] });
    }
    die() {
      this.expire(this.world);
    }
    onImpact() {}
    update(dt, world) {
      this.life -= dt;
      if (this.life <= 0) return this.expire(world);
      let target = null, bd = 560;
      for (const e of world.entities) {
        if (e.dead || e.team !== 'enemy' || e.ko || e.isProjectile || e.yielded) continue;
        const d = U.dist(this.x, this.y, e.x, e.y);
        if (d < bd) {
          bd = d;
          target = e;
        }
      }
      let tx, ty;
      if (target) {
        const n = U.norm(this.x - target.x, this.y - target.y);
        const keep = target instanceof DM.Enemies.Veidt ? 0 : 150;
        tx = target.x + n.x * keep;
        ty = target.y + n.y * keep;
        this.facing = U.dampAngle(this.facing, U.angleTo(this.x, this.y, target.x, target.y), 12, dt);
        this.fireCd -= dt;
        if (this.fireCd <= 0 && world.los(this.x, this.y, target.x, target.y)) {
          this.fireCd = 0.75;
          const a = U.angleTo(this.x, this.y, target.x, target.y);
          world.add(new DM.Proj.Bolt({ x: this.x + Math.cos(a) * 14, y: this.y + Math.sin(a) * 14, vx: Math.cos(a) * 640, vy: Math.sin(a) * 640 }));
          DM.Audio.play('bolt');
        }
      } else {
        const o = this.owner;
        this.offset += dt * 0.8;
        tx = o.x + Math.cos(this.offset) * 60;
        ty = o.y + Math.sin(this.offset) * 60;
        this.facing = U.dampAngle(this.facing, o.facing, 6, dt);
      }
      const n = U.norm(tx - this.x, ty - this.y);
      const sp = Math.min(260, n.l * 4);
      this.vx = U.damp(this.vx, n.x * sp, 8, dt);
      this.vy = U.damp(this.vy, n.y * sp, 8, dt);
      if (this.speed > 20) this.walk += dt * this.speed * 0.09;
    }
    render(ctx, world) {
      const fade = Math.min(1, this.life / 1.2);
      Gfx.manhattan(ctx, { x: this.x, y: this.y, angle: this.facing, walk: this.walk, moving: this.speed > 20, t: this.age, alpha: (0.55 + Math.random() * 0.12) * fade });
    }
  }

  class Afterimage extends Entity {
    constructor(p) {
      super({ x: p.x, y: p.y, r: 1, static: true, body: false, solid: false, layer: 1, disintegratable: false });
      this.timeless = true;
      this.facing = p.facing;
      this.scale = p.scale;
      this.life = 0.5;
    }
    update(dt) {
      this.life -= dt;
      if (this.life <= 0) this.dead = true;
    }
    render(ctx) {
      Gfx.manhattan(ctx, { x: this.x, y: this.y, angle: this.facing, scale: this.scale, alpha: (this.life / 0.5) * 0.45, t: this.age });
    }
  }

  class TachyonCloud extends Entity {
    constructor(x, y) {
      super({ x, y, r: 90, static: true, body: false, solid: false, layer: 0, disintegratable: false });
      this.life = 5;
    }
    update(dt, world) {
      this.life -= dt;
      if (this.life <= 0) this.dead = true;
      const p = world.player;
      if (p && U.dist(p.x, p.y, this.x, this.y) < this.r) p.jamT = Math.max(p.jamT, 0.2);
      if (Math.random() < dt * 25) {
        const a = U.rand(0, TAU), r = U.rand(0, this.r);
        world.particles.emit(this.x + Math.cos(a) * r, this.y + Math.sin(a) * r, { life: 0.3, size: 2, color: U.pick(['#c06bff', '#ffffff', '#6f4aa6']) });
      }
    }
    render(ctx) {
      const a = Math.min(1, this.life);
      Gfx.glow(ctx, this.x, this.y, this.r * 1.3, '#6f4aa6', 0.35 * a);
      ctx.save();
      ctx.strokeStyle = `rgba(192,107,255,${0.35 * a})`;
      ctx.setLineDash([3, 6]);
      Gfx.circle(ctx, this.x, this.y, this.r);
      ctx.stroke();
      ctx.restore();
    }
  }

  DM.Special = { Atom, Vortex, BodyForm, Shard, Slot, Palace, Memory, Meteor, Mine, Duplicate, Afterimage, TachyonCloud };
})();
</script>
<script>/* src/game/chapters.js */
/*
 * Chapter registry.
 *
 * A chapter is data + scripts (see src/data/chapters/*.js):
 *   id, numeral, title, date, place, clock (minutes to midnight), color,
 *   music, form ('human' | 'awareness' | 'manhattan'),
 *   epigraph { text, by }, intro [narration lines],
 *   maps { name(ctx) -> World },            // world builders; set world.spawn
 *   stages [{ id, map, checkpoint, grants, run*(ctx), restore(ctx) }]
 *
 * Chapters play in registration order. Powers carry forward: a chapter starts
 * with every power granted by the stages of all earlier chapters.
 */
(function () {
  'use strict';
  const DM = window.DM;

  const Chapters = { list: [], byId: {} };

  Chapters.register = (def) => {
    def.index = Chapters.list.length;
    def.stages = def.stages || [];
    Chapters.list.push(def);
    Chapters.byId[def.id] = def;
    return def;
  };
  Chapters.get = (id) => Chapters.byId[id];
  Chapters.next = (id) => {
    const c = Chapters.byId[id];
    return c ? Chapters.list[c.index + 1] || null : null;
  };
  Chapters.powersBefore = (index) => {
    const set = new Set();
    for (let i = 0; i < index; i++) for (const st of Chapters.list[i].stages) for (const g of st.grants || []) set.add(g);
    return [...set];
  };

  DM.Chapters = Chapters;
})();
</script>
<script>/* src/game/script.js */
/*
 * ChapterContext: the scripting API chapters are written against.
 *
 * Stage scripts are generator functions. Yield a "waiter" to pause until it is
 * done; yield nothing to wait one frame:
 *
 *   run: function* (ctx) {
 *     yield ctx.dialog([['janey', 'Jon! My watch...']]);
 *     ctx.objective('Repair the watch');
 *     yield ctx.until(() => ctx.flags.repaired);
 *     yield ctx.unlock('telekinesis');
 *   }
 *
 * ctx.fork(fn*) runs a side script in parallel (NPC conversations, spawners).
 * Stages marked `checkpoint: true` are where a retry restarts from; a stage's
 * `restore(ctx)` re-applies its lasting effects when a later checkpoint loads.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const ONE_FRAME = { update: () => true };

  class ChapterContext {
    constructor(scene, chapter) {
      this.scene = scene;
      this.chapter = chapter;
      this.flags = {};
      this.threads = [];
      this.locked = false;
      this.checkpoint = 0;
      this.stageIndex = 0;
      this.mapName = null;
      this.camTarget = null;
      this.skipRequested = false;
      this.done = false;
      this.stats = { time: 0, disintegrated: 0, spared: 0, memories: 0 };
      this.refs = {};
      this.offs = [];
    }

    // Subscribe to a DM.Events event for the life of this attempt.
    on(name, fn) {
      this.offs.push(DM.Events.on(name, fn));
    }
    dispose() {
      for (const off of this.offs) off();
      this.offs = [];
      this.threads = [];
    }

    // While a map is being built, ctx.world (and ctx.add) target the new world.
    get world() {
      return this._building || this.scene.world;
    }
    get player() {
      return this.scene.player;
    }
    get hud() {
      return this.scene.hud;
    }

    // ---- thread runner ----------------------------------------------------
    start(fromStage) {
      this.threads = [];
      this.spawn(this.stageLoop(fromStage));
    }
    spawn(gen) {
      const th = { gen, waiter: null, done: false };
      this.threads.push(th);
      return th;
    }
    fork(fn) {
      return this.spawn(fn(this));
    }
    step(dt) {
      if (!this.done) this.stats.time += dt;
      if (this.skipRequested && this.threads[0]) this.threads[0].waiter = null;
      for (const th of this.threads.slice()) this.stepThread(th, dt);
      this.threads = this.threads.filter((t) => !t.done);
    }
    stepThread(th, dt) {
      if (th.done) return;
      if (th.waiter) {
        if (!th.waiter.update(dt)) return;
        th.waiter = null;
      }
      for (let guard = 0; guard < 500; guard++) {
        const r = th.gen.next();
        if (r.done) {
          th.done = true;
          return;
        }
        const w = r.value;
        if (!w || typeof w.update !== 'function') {
          th.waiter = ONE_FRAME;
          return;
        }
        if (!w.update(0)) {
          th.waiter = w;
          return;
        }
      }
      throw new Error('Chapter script ran 500 steps without waiting — missing a yield?');
    }

    // True while running the stage this attempt started from (a fresh start or a checkpoint retry).
    get startedHere() {
      return this.stageIndex === this.startStage;
    }

    *stageLoop(from) {
      this.startStage = from;
      const stages = this.chapter.stages;
      for (let i = 0; i < from; i++) for (const id of stages[i].grants || []) this.player.unlock(id);
      // A stage without its own `map` plays on the most recent earlier stage's map.
      const mapFor = (i) => {
        for (let k = i; k >= 0; k--) if (stages[k].map) return stages[k].map;
        return null;
      };
      for (let i = from; i < stages.length; i++) {
        const st = stages[i];
        this.stageIndex = i;
        const map = mapFor(i);
        if (map && map !== this.mapName) yield this.loadMap(map, i === from);
        if (i === from) for (let k = 0; k < from; k++) if (stages[k].restore) stages[k].restore(this);
        if (st.checkpoint) {
          this.checkpoint = i;
          DM.Save.data.checkpoint = { chapter: this.chapter.id, stage: i };
          DM.Save.write();
        }
        yield* this.runStage(st);
      }
      yield* this.finish();
    }

    *runStage(st) {
      this.skipRequested = false;
      const gen = st.run(this);
      while (true) {
        if (this.skipRequested) {
          this.cleanupSkip(st);
          return;
        }
        const r = gen.next();
        if (r.done) return;
        yield r.value;
      }
    }

    // Developer skip (] in dev mode): jump to the end state of the current stage.
    skipStage() {
      this.skipRequested = true;
    }
    cleanupSkip(st) {
      this.scene.dialog.close();
      this.hud.clearTransient();
      this.hud.setObjective(null);
      this.hud.marker = null;
      this.lock(false);
      this.camTarget = null;
      for (const id of st.grants || []) this.player.unlock(id);
      if (st.restore) st.restore(this);
      this.threads = this.threads.filter((t) => t === this.threads[0]);
    }

    *finish() {
      this.done = true;
      this.lock(true);
      this.hud.setObjective(null);
      yield this.wait(0.4);
      this.scene.completeChapter();
    }

    // ---- waiters ------------------------------------------------------------
    wait(t) {
      let e = 0;
      return { update: (dt) => (e += dt) >= t };
    }
    until(fn) {
      return { update: () => !!fn() };
    }
    dialog(lines) {
      const d = this.scene.dialog;
      d.open(lines);
      return { update: () => !d.active };
    }
    // Narration caption. Returned waiter resolves when it has faded.
    narrate(text, o = {}) {
      const c = this.hud.caption(text, o);
      return { update: () => c.gone };
    }
    banner(title, sub, o = {}) {
      const b = this.hud.banner(title, sub, o);
      return { update: () => b.gone };
    }
    unlock(id) {
      this.player.unlock(id);
      let closed = false;
      DM.Engine.push(new DM.Scenes.PowerUnlock(id, () => (closed = true)));
      return { update: () => closed };
    }
    minigame(SceneClass, opts) {
      let result = null;
      DM.Engine.push(new SceneClass(opts || {}, (r) => (result = r == null ? true : r)));
      return { update: () => result !== null };
    }
    countdown(seconds, label) {
      const c = this.hud.startCountdown(seconds, label);
      return { update: () => c.left <= 0 };
    }
    // Map builders call this to create their World, so ctx.add() lands in it.
    newWorld(opts) {
      this._building = new DM.World(opts);
      return this._building;
    }
    loadMap(name, instant) {
      const build = () => {
        let world;
        try {
          world = this.chapter.maps[name](this);
        } finally {
          this._building = null;
        }
        this.mapName = name;
        this.scene.setWorld(world);
      };
      if (instant) {
        build();
        return null;
      }
      let built = false;
      DM.Engine.fadeTo(() => {
        build();
        built = true;
      }, { out: 0.5, in: 0.6 });
      return { update: () => built };
    }

    // ---- actions ------------------------------------------------------------
    lock(on) {
      this.locked = on;
      if (on) DM.Audio.hum('tk', false);
    }
    add(e) {
      return this.world.add(e);
    }
    objective(text, progress) {
      this.hud.setObjective(text, progress);
    }
    objectiveDone() {
      this.hud.completeObjective();
    }
    hint(text, dur) {
      this.hud.hint(text, dur);
    }
    toast(text, color) {
      this.hud.toast(text, color);
    }
    marker(x, y, label) {
      this.hud.marker = x == null ? null : { x, y, label };
    }
    flash(color = '#ffffff', dur = 0.6) {
      this.hud.flash(color, dur);
    }
    cinematic(on) {
      this.hud.cinematic = on;
    }
    focus(x, y) {
      this.camTarget = x == null ? null : { x, y };
    }
    place(x, y, facing) {
      const p = this.player;
      p.x = x;
      p.y = y;
      p.vx = p.vy = 0;
      if (facing != null) p.facing = facing;
      this.world.camera.snap(x, y);
    }
    music(id) {
      DM.Audio.music.play(id);
    }
    setForm(form) {
      this.player.setForm(form);
      if (form === 'human') this.player.look = Object.assign({}, DM.LOOKS.jon);
    }
  }

  DM.ChapterContext = ChapterContext;
})();
</script>

<script>/* src/game/ui/widgets.js */
/*
 * Menu: a vertical list driven by keyboard (W/S/arrows + Enter/Space) and mouse.
 * Items: { label, action(), disabled, value() -> string, adjust(dir) }.
 * Items with `adjust` are sliders/toggles: left/right or clicking changes them.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const Gfx = DM.Gfx;
  const Input = DM.Input;
  const Audio = DM.Audio;

  class Menu {
    constructor(items, o = {}) {
      this.items = items;
      this.x = o.x || 100;
      this.y = o.y || 300;
      this.w = o.w || 340;
      this.itemH = o.itemH || 46;
      this.size = o.size || 24;
      this.align = o.align || 'left';
      this.onBack = o.onBack || null;
      this.accent = o.accent || DM.C.blue;
      this.sel = Math.max(0, items.findIndex((i) => !i.disabled));
      this.t = 0;
    }
    rowRect(i) {
      const x = this.align === 'center' ? this.x - this.w / 2 : this.x;
      return { x, y: this.y + i * this.itemH, w: this.w, h: this.itemH };
    }
    hit(mx, my) {
      for (let i = 0; i < this.items.length; i++) {
        const r = this.rowRect(i);
        if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) return i;
      }
      return -1;
    }
    move(dir) {
      const n = this.items.length;
      for (let k = 1; k <= n; k++) {
        const i = (this.sel + dir * k + n * 4) % n;
        if (!this.items[i].disabled) {
          this.sel = i;
          Audio.play('ui_move');
          return;
        }
      }
    }
    update(dt) {
      this.t += dt;
      const m = Input.mouse;
      if (m.moved) {
        const i = this.hit(m.x, m.y);
        if (i >= 0 && !this.items[i].disabled && i !== this.sel) {
          this.sel = i;
          Audio.play('ui_move');
        }
      }
      if (Input.clicked()) {
        const i = this.hit(m.x, m.y);
        Input.consume('confirm');
        if (i >= 0) {
          this.sel = i;
          const r = this.rowRect(i);
          this.activate(i, m.x < r.x + r.w * 0.55 ? -1 : 1);
        }
        return;
      }
      if (Input.pressed('menuDown')) this.move(1);
      if (Input.pressed('menuUp')) this.move(-1);
      const it = this.items[this.sel];
      if (it && it.adjust) {
        if (Input.pressed('menuLeft')) {
          it.adjust(-1);
          Audio.play('ui_move');
        }
        if (Input.pressed('menuRight')) {
          it.adjust(1);
          Audio.play('ui_move');
        }
      }
      if (Input.pressed('confirm')) {
        Input.consume('confirm');
        this.activate(this.sel, 1);
      } else if (this.onBack && Input.pressed('back')) {
        Input.consume('back');
        Audio.play('ui_back');
        this.onBack();
      }
    }
    activate(i, dir) {
      const it = this.items[i];
      if (!it || it.disabled) return;
      if (it.adjust) {
        it.adjust(dir);
        Audio.play('ui_move');
      } else if (it.action) {
        Audio.play('ui_select');
        it.action();
      }
    }
    render(ctx) {
      for (let i = 0; i < this.items.length; i++) {
        const it = this.items[i];
        const r = this.rowRect(i);
        const sel = i === this.sel && !it.disabled;
        const cy = r.y + r.h / 2 + this.size * 0.36;
        const tx = this.align === 'center' ? r.x + r.w / 2 : r.x + 34;
        if (sel) {
          ctx.fillStyle = 'rgba(95,212,255,0.08)';
          ctx.fillRect(r.x, r.y + 4, r.w, r.h - 8);
          ctx.fillStyle = this.accent;
          ctx.fillRect(r.x, r.y + 4, 3, r.h - 8);
          if (this.align !== 'center') Gfx.hydrogen(ctx, r.x + 17, r.y + r.h / 2, 7, this.accent, this.t * 3, 1.5);
        }
        const color = it.disabled ? 'rgba(160,180,200,0.3)' : sel ? '#ffffff' : 'rgba(200,225,240,0.72)';
        Gfx.text(ctx, it.label, tx, cy, { size: this.size, color, align: this.align === 'center' ? 'center' : 'left', spacing: 2, weight: sel ? 600 : 400 });
        if (it.value) {
          const v = it.value();
          const vx = r.x + r.w - 16;
          Gfx.text(ctx, (it.adjust ? '‹  ' : '') + v + (it.adjust ? '  ›' : ''), vx, cy, { size: this.size * 0.8, color: sel ? this.accent : 'rgba(200,225,240,0.6)', align: 'right', spacing: 1 });
        }
      }
    }
  }

  DM.UI = { Menu };
})();
</script>
<script>/* src/game/ui/dialog.js */
/*
 * Dialogue box with portraits and a typewriter reveal.
 * Lines: 'plain narration' | ['speaker', 'text'] | ['speaker', 'text', { name: 'Override' }]
 * Speakers are keys of DM.LOOKS. Dr. Manhattan's lines get his blue box.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const Gfx = DM.Gfx;
  const Input = DM.Input;
  const Audio = DM.Audio;
  const F = DM.FONTS;

  const CPS = 55; // characters per second

  class Dialog {
    constructor() {
      this.active = false;
      this.lines = [];
      this.i = 0;
      this.chars = 0;
      this.t = 0;
    }
    normalize(l) {
      if (typeof l === 'string') return { who: null, text: l };
      if (Array.isArray(l)) return Object.assign({ who: l[0], text: l[1] }, l[2] || {});
      return l;
    }
    open(lines) {
      this.lines = lines.map((l) => this.normalize(l));
      this.i = 0;
      this.chars = 0;
      this.t = 0;
      this.cool = 0.2;
      this.active = this.lines.length > 0;
    }
    close() {
      this.active = false;
    }
    get line() {
      return this.lines[this.i];
    }
    update(dt) {
      if (!this.active) return;
      this.t += dt;
      this.cool -= dt;
      const line = this.line;
      const prev = Math.floor(this.chars);
      this.chars = Math.min(line.text.length, this.chars + dt * CPS);
      const now = Math.floor(this.chars);
      if (now > prev && now < line.text.length && now % 2 === 0 && line.text[now] !== ' ') Audio.play('type');
      const go = Input.pressed('confirm') || Input.pressed('interact');
      if (this.cool <= 0 && go) {
        Input.consume('confirm');
        Input.consume('interact');
        Input.consume('teleport');
        Input.consume('telekinesis');
        if (this.chars < line.text.length) this.chars = line.text.length;
        else {
          this.i++;
          this.chars = 0;
          this.cool = 0.12;
          if (this.i >= this.lines.length) this.active = false;
          else Audio.play('ui_move');
        }
      }
    }
    render(ctx) {
      if (!this.active) return;
      const line = this.line;
      const look = line.who ? DM.LOOKS[line.who] : null;
      const x = 150, y = 528, w = DM.W - 300, h = 150;
      const done = this.chars >= line.text.length;

      if (!look) {
        Gfx.caption(ctx, line.text, DM.W / 2, y + 20, w - 120, { chars: this.chars, size: 19 });
      } else {
        const mh = look.manhattan;
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(x + 6, y + 6, w, h);
        ctx.fillStyle = mh ? '#0d2a44' : '#fbf8ef';
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = mh ? '#7fe3ff' : DM.C.ink;
        ctx.lineWidth = 2.5;
        ctx.strokeRect(x, y, w, h);
        Gfx.portrait(ctx, x + 18, y + 18, h - 36, look, this.t, !done);
        const name = line.name || look.name;
        const tx = x + h + 6;
        Gfx.text(ctx, name.toUpperCase(), tx, y + 34, { size: 15, color: mh ? '#7fe3ff' : '#8a3b22', spacing: 2, weight: 600 });
        Gfx.paragraph(ctx, line.text, tx, y + 46, w - h - 40, 29, { size: 23, font: F.hand, color: mh ? '#d8f6ff' : DM.C.ink, chars: this.chars });
      }
      if (done && Math.sin(this.t * 6) > -0.3) {
        Gfx.text(ctx, '▼', x + w - 22, y + h - 14, { size: 14, color: look && look.manhattan ? '#7fe3ff' : '#8a3b22', align: 'center' });
      }
      Gfx.text(ctx, 'SPACE / CLICK', x + w, y + h + 20, { size: 11, color: 'rgba(200,225,240,0.45)', align: 'right', spacing: 2 });
    }
  }

  DM.Dialog = Dialog;
})();
</script>
<script>/* src/game/ui/hud.js */
/*
 * HUD: objective, captions, banners, hints, power slots, meters, boss bar,
 * countdowns, objective markers, interaction prompts, flashes and fades.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Input = DM.Input;
  const F = DM.FONTS;

  // Soft dark backing so HUD text stays readable on bright maps (snow, desert).
  function backing(ctx, x, y, w, h) {
    ctx.fillStyle = 'rgba(4,8,16,0.5)';
    Gfx.rr(ctx, x, y, w, h, 4);
    ctx.fill();
  }

  class HUD {
    constructor(scene) {
      this.scene = scene;
      this.objective = null;
      this.captions = [];
      this.banners = [];
      this.toasts = [];
      this.hintMsg = null;
      this.flashA = 0;
      this.flashColor = '#fff';
      this.flashDur = 0.6;
      this.cinematic = false;
      this.cineK = 0;
      this.countdownState = null;
      this.marker = null;
      this.t = 0;
    }

    // ---- API used by chapter scripts ----------------------------------------
    setObjective(text, progress) {
      if (!text) {
        this.objective = null;
        return;
      }
      this.objective = { text, progress: progress || null, t: 0, done: false };
      DM.Audio.play('objective');
    }
    completeObjective() {
      if (this.objective && !this.objective.done) {
        const o = this.objective;
        if (o.progress) {
          const v = o.progress();
          o.progress = () => v;
        }
        this.objective.done = true;
        this.objective.doneT = 0;
        DM.Audio.play('success');
      }
    }
    caption(text, o = {}) {
      const c = { text, t: 0, dur: o.dur || 2.6 + text.length * 0.05, style: o.style || 'jon', gone: false };
      this.captions.push(c);
      return c;
    }
    banner(title, sub, o = {}) {
      const b = { title, sub, t: 0, dur: o.dur || 3.2, color: o.color || DM.C.blue, gone: false };
      this.banners.push(b);
      return b;
    }
    hint(text, dur = 7) {
      if (DM.Save.settings.hints === false) return;
      this.hintMsg = text ? { text, t: 0, dur } : null;
    }
    toast(text, color) {
      this.toasts.push({ text, color: color || DM.C.yellow, t: 0 });
    }
    flash(color, dur) {
      this.flashColor = color;
      this.flashDur = dur;
      this.flashA = 1;
    }
    startCountdown(seconds, label) {
      this.countdownState = { left: seconds, total: seconds, label: label || '' };
      return this.countdownState;
    }
    clearTransient() {
      this.captions = [];
      this.banners = [];
      this.hintMsg = null;
      this.countdownState = null;
      this.cinematic = false;
    }

    update(dt) {
      this.t += dt;
      if (this.objective) {
        this.objective.t += dt;
        if (this.objective.done) {
          this.objective.doneT += dt;
          if (this.objective.doneT > 2.2) this.objective = null;
        }
      }
      if (this.captions.length) {
        const c = this.captions[0];
        c.t += dt;
        if (c.t >= c.dur) {
          c.gone = true;
          this.captions.shift();
        }
      }
      if (this.banners.length) {
        const b = this.banners[0];
        b.t += dt;
        if (b.t >= b.dur) {
          b.gone = true;
          this.banners.shift();
        }
      }
      if (this.hintMsg) {
        this.hintMsg.t += dt;
        if (this.hintMsg.t > this.hintMsg.dur) this.hintMsg = null;
      }
      for (const t of this.toasts) t.t += dt;
      this.toasts = this.toasts.filter((t) => t.t < 2.6);
      this.flashA = Math.max(0, this.flashA - dt / this.flashDur);
      this.cineK = U.damp(this.cineK, this.cinematic ? 1 : 0, 6, dt);
      if (this.countdownState && this.countdownState.left > 0) {
        const before = Math.ceil(this.countdownState.left);
        this.countdownState.left -= dt;
        const after = Math.ceil(this.countdownState.left);
        if (after !== before && after >= 0) DM.Audio.play('tick', { alt: after % 2 });
      }
    }

    // ---- rendering -------------------------------------------------------------
    render(ctx) {
      const scene = this.scene;
      const p = scene.player;
      const world = scene.world;
      const showGameHud = this.cineK < 0.5 && !(scene.dialog && scene.dialog.active);

      if (p && world) this.renderPrompt(ctx, p, world);
      if (this.marker && world) this.renderMarker(ctx, world);

      if (this.cineK > 0.01) {
        const bh = 70 * this.cineK;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, DM.W, bh);
        ctx.fillRect(0, DM.H - bh, DM.W, bh);
      }

      if (showGameHud) {
        this.renderTopLeft(ctx);
        if (p) {
          this.renderTopRight(ctx, p);
          this.renderPowers(ctx, p);
        }
        if (world && world.boss && !world.boss.dead) this.renderBoss(ctx, world.boss);
      }
      this.renderCountdown(ctx);
      this.renderCaption(ctx);
      this.renderBanner(ctx);
      this.renderHint(ctx, showGameHud);
      this.renderToasts(ctx);

      if (this.flashA > 0) {
        ctx.globalAlpha = this.flashA;
        ctx.fillStyle = this.flashColor;
        ctx.fillRect(0, 0, DM.W, DM.H);
        ctx.globalAlpha = 1;
      }
    }

    renderTopLeft(ctx) {
      const ch = this.scene.chapter;
      if (!ch) return;
      const label = `${ch.numeral}  ·  ${ch.date.toUpperCase()}  ·  ${ch.place.toUpperCase()}`;
      backing(ctx, 18, 18, Gfx.measure(ctx, label, { size: 13, spacing: 2 }) + 20, 26);
      Gfx.text(ctx, label, 28, 36, { size: 13, color: 'rgba(200,225,240,0.75)', spacing: 2, shadow: 'rgba(0,0,0,0.6)' });
      const o = this.objective;
      if (!o) return;
      const a = o.done ? Math.max(0, 1 - Math.max(0, o.doneT - 1.4) / 0.8) : Math.min(1, o.t * 4);
      ctx.save();
      ctx.globalAlpha = a;
      const prog = o.progress ? o.progress() : null;
      const text = o.text + (prog != null && prog !== '' ? `  ${prog}` : '');
      const w = Math.max(260, Gfx.measure(ctx, text, { size: 19, weight: 400 }) + 60);
      Gfx.panel(ctx, 20, 48, w, 52, { accent: o.done ? 'rgba(123,216,143,0.8)' : 'rgba(242,196,24,0.7)' });
      Gfx.text(ctx, o.done ? 'OBJECTIVE COMPLETE' : 'OBJECTIVE', 36, 66, { size: 11, color: o.done ? DM.C.green : DM.C.yellow, spacing: 3, weight: 600 });
      Gfx.text(ctx, text, 36, 89, { size: 19, color: o.done ? 'rgba(200,225,240,0.6)' : '#ffffff' });
      if (o.done) {
        ctx.strokeStyle = 'rgba(123,216,143,0.8)';
        ctx.lineWidth = 2;
        const tw = Gfx.measure(ctx, text, { size: 19 });
        Gfx.line(ctx, 36, 83, 36 + tw * Math.min(1, o.doneT * 3), 83);
      }
      ctx.restore();
    }

    renderTopRight(ctx, p) {
      const ch = this.scene.chapter;
      const x = DM.W - 28;
      if (p.form !== 'human') backing(ctx, x - 48 - 220 - 12, 16, 220 + 24, 42);
      if (ch) Gfx.clock(ctx, x - 18, 40, 18, ch.clock, { blood: true });
      if (p.form === 'manhattan') {
        const w = 220;
        const bx = x - 48 - w;
        Gfx.text(ctx, 'COHERENCE', bx, 33, { size: 11, color: 'rgba(200,225,240,0.75)', spacing: 3 });
        const frac = p.coherence / p.maxCoherence;
        const col = frac < 0.35 ? (Math.sin(this.t * 10) > 0 ? '#ff5a4a' : '#ff9a8a') : '#bff1ff';
        Gfx.bar(ctx, bx, 40, w, 9, frac, col, { segments: 10 });
      } else if (p.form === 'awareness') {
        const w = 220;
        const bx = x - 48 - w;
        Gfx.text(ctx, 'GATHERED ATOMS', bx, 33, { size: 11, color: 'rgba(200,225,240,0.75)', spacing: 3 });
        Gfx.text(ctx, `${p.carry} / ${p.carryMax}`, bx + w, 33, { size: 12, color: p.carry >= p.carryMax ? DM.C.yellow : '#bff1ff', align: 'right', spacing: 1 });
        Gfx.bar(ctx, bx, 40, w, 9, p.carry / p.carryMax, p.carry >= p.carryMax ? DM.C.yellow : '#7fe3ff', { segments: 5 });
      }
    }

    renderPowers(ctx, p) {
      const defs = DM.Powers.list.filter((d) => p.powers[d.id] && d.forms.includes(p.form));
      if (!defs.length) return;
      const size = 58, gap = 10;
      const total = defs.length * size + (defs.length - 1) * gap;
      const x0 = DM.W / 2 - total / 2;
      const y0 = DM.H - size - 26;
      const bw = Math.max(total, 300);
      const eLow = p.noEnergyT > 0;
      backing(ctx, DM.W / 2 - bw / 2 - 12, y0 - 34, bw + 24, size + 46);
      Gfx.text(ctx, 'INTRINSIC FIELD', DM.W / 2 - bw / 2, y0 - 16, { size: 10, color: eLow ? '#ff5a4a' : 'rgba(200,225,240,0.65)', spacing: 3 });
      Gfx.bar(ctx, DM.W / 2 - bw / 2, y0 - 11, bw, 5, p.energy / p.maxEnergy, eLow ? '#ff5a4a' : '#5fd4ff');
      defs.forEach((d, i) => {
        const st = p.powers[d.id];
        const x = x0 + i * (size + gap);
        const ready = st.cd <= 0 && p.energy >= d.cost && !(d.id === 'timesight' && p.jammed);
        const active = st.active || (d.id === 'telekinesis' && st.target) || (d.id === 'expand' && p.expandT > 0);
        ctx.fillStyle = active ? 'rgba(95,212,255,0.25)' : 'rgba(6,12,22,0.8)';
        ctx.fillRect(x, y0, size, size);
        ctx.strokeStyle = active ? d.color : ready ? 'rgba(160,210,240,0.35)' : 'rgba(160,210,240,0.12)';
        ctx.lineWidth = active ? 2 : 1;
        ctx.strokeRect(x + 0.5, y0 + 0.5, size - 1, size - 1);
        Gfx.icon(ctx, d.id, x + size / 2, y0 + size / 2 - 5, 30, ready || active ? d.color : 'rgba(150,170,190,0.4)', this.t);
        if (st.cd > 0 && d.cooldown > 0) {
          const k = st.cd / d.cooldown;
          ctx.fillStyle = 'rgba(0,0,0,0.55)';
          ctx.fillRect(x, y0 + size * (1 - k), size, size * k);
        }
        if (active) Gfx.glow(ctx, x + size / 2, y0 + size / 2, size * 0.9, d.color, 0.25);
        Gfx.text(ctx, Input.short[d.action] || '', x + size / 2, y0 + size - 6, { size: 11, color: 'rgba(230,245,255,0.85)', align: 'center', spacing: 1, weight: 600 });
      });
      if (p.jammed) Gfx.text(ctx, 'TACHYON INTERFERENCE', DM.W / 2 + bw / 2, y0 - 16, { size: 11, color: '#d9a6ff', align: 'right', spacing: 3 });
    }

    renderBoss(ctx, boss) {
      const w = 460;
      const x = DM.W / 2 - w / 2, y = 30;
      backing(ctx, x - 12, 8, w + 24, 38);
      Gfx.text(ctx, boss.name || 'TARGET', DM.W / 2, y - 6, { size: 13, color: '#ffd9a0', align: 'center', spacing: 4, weight: 600 });
      Gfx.bar(ctx, x, y, w, 8, Math.max(0, boss.hp) / boss.maxHp, '#ff9a3c', { segments: 20 });
    }

    renderCountdown(ctx) {
      const c = this.countdownState;
      if (!c || c.left <= -1) return;
      const s = Math.max(0, c.left);
      const str = `00:${String(Math.ceil(s)).padStart(2, '0')}`;
      const pulse = 1 + (1 - (s % 1)) * 0.06;
      ctx.save();
      ctx.translate(DM.W / 2, 92);
      ctx.scale(pulse, pulse);
      Gfx.text(ctx, str, 0, 0, { size: 56, color: s < 4 ? '#ff5a4a' : '#ffffff', align: 'center', weight: 700, spacing: 4, shadow: 'rgba(0,0,0,0.6)', font: F.display });
      ctx.restore();
      if (c.label) Gfx.text(ctx, c.label, DM.W / 2, 118, { size: 13, color: 'rgba(255,200,190,0.85)', align: 'center', spacing: 4 });
    }

    renderCaption(ctx) {
      const c = this.captions[0];
      if (!c) return;
      const a = Math.min(1, c.t * 3, (c.dur - c.t) * 2.5);
      const y = this.cineK > 0.5 ? 92 : 122;
      const style = c.style === 'paper' ? {} : { bg: '#dff2ff', border: '#0d2a44', color: '#0d2a44' };
      Gfx.caption(ctx, c.text, DM.W / 2, y, 620, Object.assign({ alpha: a, chars: c.t * 70, size: 18 }, style));
    }

    renderBanner(ctx) {
      const b = this.banners[0];
      if (!b) return;
      const a = Math.min(1, b.t * 2, (b.dur - b.t) * 2);
      ctx.save();
      ctx.globalAlpha = a;
      const y = DM.H / 2 - 30;
      const w = 520 + Math.min(1, b.t * 2) * 200;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(DM.W / 2 - w / 2, y - 62, w, b.sub ? 104 : 80);
      ctx.fillStyle = b.color;
      ctx.fillRect(DM.W / 2 - w / 2, y - 62, w, 2);
      ctx.fillRect(DM.W / 2 - w / 2, y + (b.sub ? 40 : 16), w, 2);
      Gfx.text(ctx, b.title, DM.W / 2, y, { size: 50, color: '#ffffff', align: 'center', weight: 700, spacing: 8 });
      if (b.sub) Gfx.text(ctx, b.sub, DM.W / 2, y + 28, { size: 16, color: b.color, align: 'center', spacing: 5 });
      ctx.restore();
    }

    renderHint(ctx, show) {
      const h = this.hintMsg;
      if (!h || !show) return;
      const a = Math.min(1, h.t * 3, (h.dur - h.t) * 2);
      const y = DM.H - 146;
      const w = Gfx.measure(ctx, h.text, { size: 17 }) + 40;
      ctx.save();
      ctx.globalAlpha = a;
      Gfx.panel(ctx, DM.W / 2 - w / 2, y - 22, w, 34, { accent: 'rgba(242,196,24,0.6)' });
      Gfx.text(ctx, h.text, DM.W / 2, y + 1, { size: 17, color: '#fff6d0', align: 'center' });
      ctx.restore();
    }

    renderToasts(ctx) {
      this.toasts.forEach((t, i) => {
        const a = Math.min(1, t.t * 4, (2.6 - t.t) * 2);
        Gfx.text(ctx, t.text, DM.W - 28, 96 + i * 26 - Math.min(10, t.t * 20), { size: 16, color: t.color, align: 'right', spacing: 2, alpha: a, shadow: 'rgba(0,0,0,0.6)' });
      });
    }

    renderPrompt(ctx, p, world) {
      const e = p.interactTarget;
      if (!e || (this.scene.dialog && this.scene.dialog.active)) return;
      const s = world.camera.toScreen(e.x, e.y - e.r - 30);
      const text = e.interact.label;
      const w = Gfx.measure(ctx, text, { size: 15 }) + 44;
      const y = s.y + Math.sin(this.t * 4) * 2;
      Gfx.panel(ctx, s.x - w / 2, y - 16, w, 28, { accent: 'rgba(242,196,24,0.8)' });
      ctx.fillStyle = DM.C.yellow;
      ctx.fillRect(s.x - w / 2 + 6, y - 11, 18, 18);
      Gfx.text(ctx, 'E', s.x - w / 2 + 15, y + 3, { size: 13, color: DM.C.ink, align: 'center', weight: 700 });
      Gfx.text(ctx, text, s.x - w / 2 + 32, y + 4, { size: 15, color: '#ffffff' });
    }

    renderMarker(ctx, world) {
      const m = this.marker;
      const s = world.camera.toScreen(m.x, m.y);
      const pad = 40;
      const on = s.x > pad && s.x < DM.W - pad && s.y > pad && s.y < DM.H - pad;
      if (on) {
        const y = s.y - 36 + Math.sin(this.t * 4) * 5;
        ctx.fillStyle = DM.C.yellow;
        ctx.beginPath();
        ctx.moveTo(s.x, y + 10);
        ctx.lineTo(s.x - 8, y);
        ctx.lineTo(s.x + 8, y);
        ctx.closePath();
        ctx.fill();
        if (m.label) Gfx.text(ctx, m.label, s.x, y - 8, { size: 12, color: DM.C.yellow, align: 'center', spacing: 2, shadow: 'rgba(0,0,0,0.7)' });
        return;
      }
      const cx = DM.W / 2, cy = DM.H / 2;
      const a = Math.atan2(s.y - cy, s.x - cx);
      const ex = U.clamp(cx + Math.cos(a) * 2000, pad, DM.W - pad), ey = U.clamp(cy + Math.sin(a) * 2000, pad + 50, DM.H - pad - 90);
      ctx.save();
      ctx.translate(ex, ey);
      ctx.rotate(a);
      ctx.fillStyle = DM.C.yellow;
      ctx.beginPath();
      ctx.moveTo(14, 0);
      ctx.lineTo(-6, -9);
      ctx.lineTo(-2, 0);
      ctx.lineTo(-6, 9);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  DM.HUD = HUD;
})();
</script>

<script>/* src/game/scenes/title.js */
/* Title screen (with a click-to-begin gate that unlocks audio) and chapter select. */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const Input = DM.Input;
  const Engine = DM.Engine;
  const Save = DM.Save;
  const Scenes = (DM.Scenes = DM.Scenes || {});

  const STARS = Gfx.makeStars(7, 220, DM.W, DM.H);

  // Shared cosmic backdrop for menus.
  function backdrop(ctx, t, o = {}) {
    const g = ctx.createLinearGradient(0, 0, 0, DM.H);
    g.addColorStop(0, '#02040a');
    g.addColorStop(1, '#0b1a30');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, DM.W, DM.H);
    for (const s of STARS) {
      ctx.globalAlpha = s.a * (0.6 + Math.sin(t * 1.5 + s.tw) * 0.4);
      ctx.fillStyle = '#dfefff';
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;
    if (o.mars !== false) {
      const mx = 1060, my = 980, mr = 560;
      const mg = ctx.createRadialGradient(mx - 160, my - 260, 60, mx, my, mr);
      mg.addColorStop(0, '#e0784a');
      mg.addColorStop(0.55, '#a8401f');
      mg.addColorStop(1, '#3a120a');
      ctx.fillStyle = mg;
      Gfx.circle(ctx, mx, my, mr);
      ctx.fill();
      ctx.fillStyle = 'rgba(60,15,8,0.35)';
      for (const [cx, cy, r] of [[860, 560, 26], [1010, 520, 14], [1150, 600, 34], [930, 650, 18], [1240, 520, 20]]) {
        Gfx.ellipse(ctx, cx, cy, r, r * 0.6);
        ctx.fill();
      }
      Gfx.glow(ctx, mx, my - mr + 40, 380, '#ff7a4a', 0.12);
    }
  }
  Scenes.backdrop = backdrop;

  class Title {
    constructor() {
      this.t = 0;
      this.cursor = 'pointer';
      this.gate = !(DM.Audio.ctx && DM.Audio.ctx.state === 'running');
      this.motes = [];
      for (let i = 0; i < 90; i++) this.motes.push({ a: U.rand(0, Math.PI * 2), r: U.rand(150, 520), s: U.rand(0.2, 0.7), z: U.rand(0.4, 1) });
      this.touchOnly = window.matchMedia && !window.matchMedia('(pointer: fine)').matches;
    }
    enter() {
      this.buildMenu();
      if (!this.gate) DM.Audio.music.play('title');
    }
    resume() {
      this.buildMenu();
    }
    buildMenu() {
      const items = [];
      if (Save.hasProgress()) items.push({ label: 'CONTINUE', action: () => this.continueGame() });
      items.push({ label: 'NEW GAME', action: () => Engine.fadeTo(() => Engine.set(new Scenes.Interlude('prologue'))) });
      items.push({ label: 'CHAPTERS', action: () => Engine.push(new ChapterSelect()) });
      items.push({ label: 'SETTINGS', action: () => Engine.push(new Scenes.Settings()) });
      items.push({ label: 'CONTROLS', action: () => Engine.push(new Scenes.Controls()) });
      const keep = this.menu ? this.menu.sel : 0;
      this.menu = new DM.UI.Menu(items, { x: 84, y: 340, w: 360, itemH: 50, size: 25 });
      this.menu.sel = Math.min(keep, items.length - 1);
    }
    continueGame() {
      const cp = Save.data.checkpoint;
      const ch = cp && DM.Chapters.get(cp.chapter);
      if (!ch) return Engine.fadeTo(() => Engine.set(new Scenes.Interlude('prologue')));
      if (!cp.stage) Engine.fadeTo(() => Engine.set(new Scenes.Interlude(ch.id)));
      else Engine.fadeTo(() => Engine.set(new Scenes.Play(), { chapter: ch.id, stage: cp.stage }));
    }
    update(dt) {
      this.t += dt;
      if (this.gate) {
        if (Input.anyPressed()) {
          Input.clearAll();
          Input.endFrame();
          DM.Audio.unlock();
          DM.Audio.music.play('title');
          this.gate = false;
          DM.Audio.play('ui_select');
        }
        return;
      }
      if (Input.pressed('mute')) DM.Audio.toggleMute();
      this.menu.update(dt);
    }
    render(ctx) {
      const t = this.t;
      backdrop(ctx, t);
      const hx = 900, hy = 300;
      for (const m of this.motes) {
        m.a += 0.0025 * m.s * 60 * (1 / 60);
        const r = m.r * (0.85 + Math.sin(t * m.s + m.a) * 0.15);
        const x = hx + Math.cos(m.a + t * 0.05 * m.s) * r, y = hy + Math.sin(m.a + t * 0.05 * m.s) * r * 0.55;
        Gfx.glow(ctx, x, y, 7 * m.z, '#5fd4ff', 0.6 * m.z);
      }
      Gfx.glow(ctx, hx, hy, 300, '#1b7fd0', 0.35);
      Gfx.glow(ctx, hx, hy, 140, '#5fd4ff', 0.3);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      Gfx.hydrogen(ctx, hx, hy, 120, 'rgba(170,235,255,0.9)', t * 0.6, 5);
      ctx.restore();
      Gfx.glow(ctx, hx + Math.cos(t * 0.6) * 120, hy + Math.sin(t * 0.6) * 120, 40, '#bff1ff', 0.8);
      Gfx.glow(ctx, hx, hy, 60, '#eefbff', 0.7);

      Gfx.clock(ctx, DM.W - 70, 70, 34, 12, { blood: true });

      Gfx.text(ctx, 'DR. MANHATTAN', 80, 214, { size: 80, color: '#eefbff', weight: 700, spacing: 8, shadow: 'rgba(27,127,208,0.6)', shadowOff: 4 });
      Gfx.text(ctx, "THE WATCHMAKER'S SON", 84, 256, { size: 23, color: DM.C.blue, spacing: 10 });
      Gfx.text(ctx, 'A WATCHMEN FAN GAME', 86, 288, { size: 12, color: 'rgba(200,225,240,0.5)', spacing: 5 });

      if (this.gate) {
        const a = 0.55 + Math.sin(t * 3) * 0.45;
        Gfx.text(ctx, this.touchOnly ? 'TAP TO BEGIN' : 'CLICK OR PRESS ANY KEY', 86, 400, { size: 24, color: `rgba(238,251,255,${a})`, spacing: 6 });
        Gfx.text(ctx, 'Sound on, if you can. The music is part of it.', 86, 432, { size: 15, color: 'rgba(200,225,240,0.5)', font: DM.FONTS.type });
      } else this.menu.render(ctx);

      Gfx.text(ctx, `v${DM.VERSION}  ·  KEYBOARD & MOUSE  ·  PROGRESS SAVES AUTOMATICALLY${DM.DEV ? '  ·  DEV MODE' : ''}`, 86, DM.H - 30, { size: 11, color: 'rgba(200,225,240,0.4)', spacing: 2 });
      if (this.touchOnly) Gfx.text(ctx, 'This game needs a keyboard and mouse. Touch controls are on the roadmap.', 86, DM.H - 52, { size: 13, color: DM.C.yellow });
      Gfx.text(ctx, 'Quis custodiet ipsos custodes?', DM.W - 40, DM.H - 30, { size: 14, color: 'rgba(242,231,204,0.45)', align: 'right', font: DM.FONTS.type });
    }
  }

  class ChapterSelect {
    constructor() {
      this.t = 0;
      this.cursor = 'pointer';
      this.sel = 0;
    }
    enter() {
      const reached = DM.DEV ? 99 : Save.data.reached;
      this.cards = DM.Chapters.list.map((c, i) => ({ c, locked: i > reached }));
      this.sel = Math.min(reached, this.cards.length - 1);
    }
    rect(i) {
      const n = this.cards.length;
