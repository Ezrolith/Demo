<!-- build:scripts — load order matters; tools/build.mjs inlines these into dist/ -->
<script>/* src/core/namespace.js */
/*
 * DR. MANHATTAN: THE WATCHMAKER'S SON
 * Global namespace.
 *
 * Every source file is a plain (non-module) script that attaches itself to
 * window.DM. That keeps the game runnable straight from file:// — just open
 * index.html — on any OS, with no server and no build step. Script load order
 * is declared once, in index.html.
 */
(function () {
  'use strict';
  const DM = (window.DM = window.DM || {});

  DM.VERSION = '0.1.0';

  // Logical resolution. The engine letterboxes this to any window size.
  DM.W = 1280;
  DM.H = 720;

  // Developer mode: add ?dev or #dev to the URL. Unlocks every chapter and
  // enables the debug overlay (` key) and stage skipping (] key).
  DM.DEV = /[?&#]dev\b/i.test(location.search + location.hash);

  DM.FONTS = {
    display: "'Oswald', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif",
    type: "'Special Elite', 'Courier New', Courier, monospace",
    hand: "'Patrick Hand', 'Trebuchet MS', 'Segoe UI', sans-serif",
  };

  // Shared palette. Chapter maps add their own colours on top of these.
  DM.C = {
    blue: '#5fd4ff',
    blueDeep: '#1b7fd0',
    blueGlow: '#7fe3ff',
    white: '#eefbff',
    paper: '#f1e7cc',
    ink: '#16120f',
    yellow: '#f2c418',
    blood: '#c4302b',
    red: '#ff5a4a',
    orange: '#ff9a3c',
    green: '#7bd88f',
    uiBg: 'rgba(6, 12, 22, 0.78)',
    uiEdge: 'rgba(95, 212, 255, 0.45)',
    dim: '#7f93a6',
  };
})();
</script>
<script>/* src/core/util.js */
/* Math, randomness, easing, colour and geometry helpers. */
(function () {
  'use strict';
  const DM = window.DM;
  const TAU = Math.PI * 2;

  const U = {
    TAU,
    clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
    lerp: (a, b, t) => a + (b - a) * t,
    invLerp: (a, b, v) => (b === a ? 0 : (v - a) / (b - a)),
    rand: (a = 0, b = 1) => a + Math.random() * (b - a),
    randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
    chance: (p) => Math.random() < p,
    pick: (arr) => arr[(Math.random() * arr.length) | 0],
    dist: (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay),
    dist2: (ax, ay, bx, by) => (bx - ax) * (bx - ax) + (by - ay) * (by - ay),
    angleTo: (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax),
    // Frame-rate independent exponential smoothing toward a target.
    damp: (a, b, lambda, dt) => a + (b - a) * (1 - Math.exp(-lambda * dt)),
    approach: (v, target, step) => (v < target ? Math.min(v + step, target) : Math.max(v - step, target)),
  };

  U.wrapAngle = (a) => {
    while (a > Math.PI) a -= TAU;
    while (a < -Math.PI) a += TAU;
    return a;
  };
  U.lerpAngle = (a, b, t) => a + U.wrapAngle(b - a) * t;
  U.dampAngle = (a, b, lambda, dt) => a + U.wrapAngle(b - a) * (1 - Math.exp(-lambda * dt));

  U.norm = (x, y) => {
    const l = Math.hypot(x, y);
    return l > 1e-9 ? { x: x / l, y: y / l, l } : { x: 0, y: 0, l: 0 };
  };

  U.ease = {
    inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    inCubic: (t) => t * t * t,
    inOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    outBack: (t) => {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    },
    outQuad: (t) => 1 - (1 - t) * (1 - t),
  };

  // ---- colour -------------------------------------------------------------
  const rgbCache = new Map();
  U.hexToRgb = (hex) => {
    let c = rgbCache.get(hex);
    if (c) return c;
    let h = hex.replace('#', '');
    if (h.length === 3) h = h.split('').map((ch) => ch + ch).join('');
    const n = parseInt(h, 16);
    c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    rgbCache.set(hex, c);
    return c;
  };
  U.rgba = (hex, a) => {
    const [r, g, b] = U.hexToRgb(hex);
    return `rgba(${r},${g},${b},${a})`;
  };
  U.mix = (hexA, hexB, t, a = 1) => {
    const A = U.hexToRgb(hexA), B = U.hexToRgb(hexB);
    const r = Math.round(A[0] + (B[0] - A[0]) * t);
    const g = Math.round(A[1] + (B[1] - A[1]) * t);
    const b = Math.round(A[2] + (B[2] - A[2]) * t);
    return `rgba(${r},${g},${b},${a})`;
  };

  // ---- geometry -----------------------------------------------------------
  // Circle vs axis-aligned rect. Returns push-out normal and depth, or null.
  U.circleRect = (cx, cy, r, R) => {
    const nx = U.clamp(cx, R.x, R.x + R.w);
    const ny = U.clamp(cy, R.y, R.y + R.h);
    const dx = cx - nx, dy = cy - ny;
    const d2 = dx * dx + dy * dy;
    if (d2 > r * r) return null;
    if (d2 > 1e-6) {
      const d = Math.sqrt(d2);
      return { nx: dx / d, ny: dy / d, depth: r - d };
    }
    const left = cx - R.x, right = R.x + R.w - cx, top = cy - R.y, bottom = R.y + R.h - cy;
    const m = Math.min(left, right, top, bottom);
    if (m === left) return { nx: -1, ny: 0, depth: left + r };
    if (m === right) return { nx: 1, ny: 0, depth: right + r };
    if (m === top) return { nx: 0, ny: -1, depth: top + r };
    return { nx: 0, ny: 1, depth: bottom + r };
  };

  // Segment vs rect (Liang–Barsky). Returns entry t in [0,1], or -1 for a miss.
  U.segRect = (x1, y1, x2, y2, R) => {
    let t0 = 0, t1 = 1;
    const dx = x2 - x1, dy = y2 - y1;
    const p = [-dx, dx, -dy, dy];
    const q = [x1 - R.x, R.x + R.w - x1, y1 - R.y, R.y + R.h - y1];
    for (let i = 0; i < 4; i++) {
      if (p[i] === 0) {
        if (q[i] < 0) return -1;
      } else {
        const t = q[i] / p[i];
        if (p[i] < 0) {
          if (t > t1) return -1;
          if (t > t0) t0 = t;
        } else {
          if (t < t0) return -1;
          if (t < t1) t1 = t;
        }
      }
    }
    return t0;
  };

  // Does segment (x1,y1)-(x2,y2) pass within r of point (cx,cy)?
  U.segCircle = (x1, y1, x2, y2, cx, cy, r) => {
    const dx = x2 - x1, dy = y2 - y1;
    const l2 = dx * dx + dy * dy;
    let t = l2 > 0 ? ((cx - x1) * dx + (cy - y1) * dy) / l2 : 0;
    t = U.clamp(t, 0, 1);
    const px = x1 + dx * t, py = y1 + dy * t;
    return (px - cx) * (px - cx) + (py - cy) * (py - cy) <= r * r;
  };

  U.pointInRect = (x, y, R) => x >= R.x && x <= R.x + R.w && y >= R.y && y <= R.y + R.h;

  // ---- misc ---------------------------------------------------------------
  U.fmtTime = (s) => {
    s = Math.max(0, Math.floor(s));
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  };

  U.roman = (n) => ['0', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'][n] || String(n);

  // Deterministic RNG (mulberry32) so baked backgrounds look the same every run.
  U.seeded = (seed) => {
    let a = seed >>> 0;
    return () => {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  DM.U = U;
})();
</script>
<script>/* src/core/events.js */
/* Tiny publish/subscribe bus. Used for stats, achievements-to-come and decoupled reactions. */
(function () {
  'use strict';
  const listeners = new Map();

  window.DM.Events = {
    // Returns an unsubscribe function.
    on(name, fn) {
      if (!listeners.has(name)) listeners.set(name, new Set());
      listeners.get(name).add(fn);
      return () => listeners.get(name) && listeners.get(name).delete(fn);
    },
    emit(name, data) {
      const set = listeners.get(name);
      if (set) for (const fn of [...set]) fn(data);
    },
    clear(name) {
      if (name) listeners.delete(name);
      else listeners.clear();
    },
  };
})();
</script>
<script>/* src/core/input.js */
/*
 * Input: keyboard + mouse (+ basic touch for menus), mapped to named actions.
 *
 * Game code never asks "is KeyQ down?" — it asks Input.pressed('disintegrate').
 * Rebinding, gamepad support or touch controls later only touch this file.
 *
 * Keys use KeyboardEvent.code (physical position), so WASD stays WASD on
 * AZERTY/Dvorak layouts. Mac specifics handled here:
 *   - Ctrl+click counts as right click.
 *   - Releasing Cmd clears all keys (macOS swallows keyup while Cmd is held).
 */
(function () {
  'use strict';
  const DM = window.DM;

  const BINDINGS = {
    up: ['KeyW', 'ArrowUp'],
    down: ['KeyS', 'ArrowDown'],
    left: ['KeyA', 'ArrowLeft'],
    right: ['KeyD', 'ArrowRight'],

    telekinesis: ['Mouse0'],
    disintegrate: ['KeyQ', 'Mouse2'],
    teleport: ['Space'],
    duplicate: ['KeyR'],
    timesight: ['KeyF', 'ShiftLeft', 'ShiftRight'],
    expand: ['KeyG'],
    interact: ['KeyE', 'Enter'],

    pause: ['Escape', 'KeyP'],
    confirm: ['Enter', 'Space', 'KeyE', 'Mouse0'],
    back: ['Escape', 'Backspace'],
    menuUp: ['KeyW', 'ArrowUp'],
    menuDown: ['KeyS', 'ArrowDown'],
    menuLeft: ['KeyA', 'ArrowLeft'],
    menuRight: ['KeyD', 'ArrowRight'],
    mute: ['KeyM'],

    debug: ['Backquote'],
    skip: ['BracketRight'],
  };

  // Human-readable labels used by the HUD and controls screen.
  const LABELS = {
    telekinesis: 'HOLD LEFT CLICK',
    disintegrate: 'Q / RIGHT CLICK',
    teleport: 'SPACE',
    duplicate: 'R',
    timesight: 'HOLD F / SHIFT',
    expand: 'G',
    interact: 'E',
  };
  const SHORT = {
    telekinesis: 'LMB',
    disintegrate: 'Q',
    teleport: 'SPC',
    duplicate: 'R',
    timesight: 'F',
    expand: 'G',
    interact: 'E',
  };

  const bound = new Set();
  for (const k in BINDINGS) for (const c of BINDINGS[k]) bound.add(c);

  const state = {};
  const get = (code) => state[code] || (state[code] = { down: false, pressed: false, released: false });

  const Input = {
    bindings: BINDINGS,
    labels: LABELS,
    short: SHORT,
    mouse: { x: DM.W / 2, y: DM.H / 2, moved: false, inside: true },
    touch: false,
    _any: false,
    _ctrlClick: false,

    init(canvas) {
      this.canvas = canvas;
      const press = (code) => {
        const s = get(code);
        if (!s.down) {
          s.down = true;
          s.pressed = true;
        }
        this._any = true;
      };
      const release = (code) => {
        const s = get(code);
        if (s.down) {
          s.down = false;
          s.released = true;
        }
      };
      this._press = press;
      this._release = release;

      window.addEventListener('keydown', (e) => {
        // Leave browser/OS shortcuts (Cmd+R, Ctrl+F, Alt+Tab, F11...) alone.
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        if (bound.has(e.code) || e.code === 'Tab') e.preventDefault();
        if (!e.repeat) press(e.code);
        DM.Audio && DM.Audio.unlock();
      });
      window.addEventListener('keyup', (e) => {
        release(e.code);
        if (e.key === 'Meta') this.clearAll();
      });
      window.addEventListener('blur', () => this.clearAll());
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) this.clearAll();
      });

      canvas.addEventListener('mousedown', (e) => {
        e.preventDefault();
        if (canvas.focus) canvas.focus({ preventScroll: true });
        this.touch = false;
        this.updateMouse(e);
        let b = e.button;
        if (b === 0 && e.ctrlKey) {
          b = 2;
          this._ctrlClick = true;
        }
        press('Mouse' + b);
        DM.Audio && DM.Audio.unlock();
      });
      window.addEventListener('mouseup', (e) => {
        if (e.button === 0 && this._ctrlClick) {
          this._ctrlClick = false;
          release('Mouse2');
        }
        release('Mouse' + e.button);
      });
      window.addEventListener('mousemove', (e) => this.updateMouse(e));
      canvas.addEventListener('mouseleave', () => (this.mouse.inside = false));
      canvas.addEventListener('mouseenter', () => (this.mouse.inside = true));
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());

      // Touch: taps act as left clicks so menus work on tablets. Full touch
      // controls for gameplay are on the roadmap.
      const touchOpts = { passive: false };
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        this.touch = true;
        this.updateMouse(e.changedTouches[0]);
        press('Mouse0');
        DM.Audio && DM.Audio.unlock();
      }, touchOpts);
      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        this.updateMouse(e.changedTouches[0]);
      }, touchOpts);
      canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        release('Mouse0');
      }, touchOpts);
    },

    updateMouse(e) {
      const p = DM.Engine.toLogical(e.clientX, e.clientY);
      this.mouse.x = p.x;
      this.mouse.y = p.y;
      this.mouse.moved = true;
      this.mouse.inside = true;
    },

    down(action) {
      const codes = BINDINGS[action];
      if (!codes) return false;
      for (const c of codes) if (state[c] && state[c].down) return true;
      return false;
    },
    pressed(action) {
      const codes = BINDINGS[action];
      if (!codes) return false;
      for (const c of codes) if (state[c] && state[c].pressed) return true;
      return false;
    },
    released(action) {
      const codes = BINDINGS[action];
      if (!codes) return false;
      for (const c of codes) if (state[c] && state[c].released) return true;
      return false;
    },
    // Mark an action's press as handled so nothing else reacts to it this frame.
    consume(action) {
      const codes = BINDINGS[action];
      if (codes) for (const c of codes) if (state[c]) state[c].pressed = false;
    },
    clicked() {
      return !!(state.Mouse0 && state.Mouse0.pressed);
    },
    anyPressed() {
      return this._any;
    },
    axis() {
      let x = 0, y = 0;
      if (this.down('left')) x -= 1;
      if (this.down('right')) x += 1;
      if (this.down('up')) y -= 1;
      if (this.down('down')) y += 1;
      if (x && y) {
        x *= Math.SQRT1_2;
        y *= Math.SQRT1_2;
      }
      return { x, y };
    },
    endFrame() {
      for (const k in state) {
        state[k].pressed = false;
        state[k].released = false;
      }
      this._any = false;
      this.mouse.moved = false;
    },
    clearAll() {
      for (const k in state) {
        if (state[k].down) state[k].released = true;
        state[k].down = false;
        state[k].pressed = false;
      }
    },
    // Test/automation hooks: simulate presses without real events.
    simulate(code, isDown) {
      if (isDown) this._press(code);
      else this._release(code);
    },
  };

  DM.Input = Input;
})();
</script>
<script>/* src/core/audio.js */
/*
 * Audio: every sound is synthesised with the Web Audio API, so the game ships
 * with zero audio files. Two parts:
 *   - SFX: named recipes built from tones and filtered noise.
 *   - Music: a small step sequencer that plays minimalist, Philip Glass-style
 *     arpeggio tracks defined as data in src/data/music.js.
 *
 * Browsers only allow sound after a user gesture, so Audio.unlock() is called
 * from the first click/keypress. Every call is a safe no-op before that.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  const Audio = {
    ctx: null,
    volumes: { music: 0.6, sfx: 0.8 },
    muted: false,
    last: {},
    hums: {},

    unlock() {
      if (this.ctx) {
        if (this.ctx.state === 'suspended' && !document.hidden) this.ctx.resume().catch(() => {});
        return;
      }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        this.ctx = new AC();
      } catch (e) {
        return;
      }
      const c = this.ctx;

      this.master = c.createGain();
      this.master.gain.value = 0.9;
      const comp = c.createDynamicsCompressor();
      comp.threshold.value = -14;
      comp.ratio.value = 6;
      comp.attack.value = 0.003;
      comp.release.value = 0.25;
      this.master.connect(comp);
      comp.connect(c.destination);

      // Music bus: gain -> lowpass (Temporal Sight muffles it) -> master
      this.musicBus = c.createGain();
      this.musicFilter = c.createBiquadFilter();
      this.musicFilter.type = 'lowpass';
      this.musicFilter.frequency.value = 18000;
      this.musicBus.connect(this.musicFilter);
      this.musicFilter.connect(this.master);

      // Feedback echo for space
      this.echoSend = c.createGain();
      const echo = c.createDelay(1.0);
      echo.delayTime.value = 0.36;
      const fb = c.createGain();
      fb.gain.value = 0.32;
      const ef = c.createBiquadFilter();
      ef.type = 'lowpass';
      ef.frequency.value = 2600;
      this.echoSend.connect(echo);
      echo.connect(ef);
      ef.connect(fb);
      fb.connect(echo);
      const echoOut = c.createGain();
      echoOut.gain.value = 0.55;
      ef.connect(echoOut);
      echoOut.connect(this.musicFilter);

      this.sfxBus = c.createGain();
      this.sfxBus.connect(this.master);

      const len = c.sampleRate;
      this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

      this.applyVolumes();
      Music.attach(this);

      document.addEventListener('visibilitychange', () => {
        if (!this.ctx) return;
        if (document.hidden) this.ctx.suspend().catch(() => {});
        else this.ctx.resume().catch(() => {});
      });
    },

    setVolumes(v) {
      Object.assign(this.volumes, v);
      this.applyVolumes();
    },
    applyVolumes() {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const m = this.muted ? 0 : 1;
      this.musicBus.gain.setTargetAtTime(this.volumes.music * 0.6 * m, t, 0.05);
      this.sfxBus.gain.setTargetAtTime(this.volumes.sfx * 0.9 * m, t, 0.05);
    },
    toggleMute() {
      this.muted = !this.muted;
      this.applyVolumes();
      return this.muted;
    },
    setMusicFilter(freq, time = 0.25) {
      if (!this.ctx) return;
      this.musicFilter.frequency.setTargetAtTime(freq, this.ctx.currentTime, time);
    },

    // ---- primitives -------------------------------------------------------
    tone(o) {
      const c = this.ctx;
      const t0 = c.currentTime + (o.delay || 0);
      const dur = o.dur || 0.2;
      const osc = c.createOscillator();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(o.freq || 440, t0);
      if (o.freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.freqEnd), t0 + dur);
      if (o.detune) osc.detune.value = o.detune;
      const g = c.createGain();
      const peak = o.gain == null ? 0.2 : o.gain;
      const a = o.attack == null ? 0.005 : o.attack;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + Math.max(dur, a + 0.01));
      let node = osc;
      if (o.filter) {
        const f = c.createBiquadFilter();
        f.type = o.filter.type || 'lowpass';
        f.frequency.setValueAtTime(o.filter.freq || 2000, t0);
        if (o.filter.freqEnd) f.frequency.exponentialRampToValueAtTime(o.filter.freqEnd, t0 + dur);
        f.Q.value = o.filter.q || 0.7;
        osc.connect(f);
        node = f;
      }
      node.connect(g);
      g.connect(o.dest || this.sfxBus);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    },
    noise(o) {
      const c = this.ctx;
      const t0 = c.currentTime + (o.delay || 0);
      const dur = o.dur || 0.2;
      const src = c.createBufferSource();
      src.buffer = this.noiseBuf;
      src.loop = true;
      const f = c.createBiquadFilter();
      f.type = o.ftype || 'lowpass';
      f.frequency.setValueAtTime(o.freq || 3000, t0);
      if (o.freqEnd) f.frequency.exponentialRampToValueAtTime(o.freqEnd, t0 + dur);
      f.Q.value = o.q || 0.8;
      const g = c.createGain();
      const peak = o.gain == null ? 0.2 : o.gain;
      const a = o.attack == null ? 0.003 : o.attack;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + Math.max(dur, a + 0.01));
      src.connect(f);
      f.connect(g);
      g.connect(o.dest || this.sfxBus);
      src.start(t0, Math.random() * 0.5);
      src.stop(t0 + dur + 0.05);
    },

    play(name, opts) {
      if (!this.ctx || this.muted || this.ctx.state !== 'running') return;
      const def = SFX[name];
      if (!def) return;
      const now = this.ctx.currentTime;
      const gap = def.gap == null ? 0.02 : def.gap;
      if (this.last[name] && now - this.last[name] < gap) return;
      this.last[name] = now;
      try {
        def.fn(this, opts || {});
      } catch (e) {
        /* sound must never break the game */
      }
    },

    // Sustained sounds (telekinesis hum, alarms). Call every frame with on=true.
    hum(id, on, o = {}) {
      if (!this.ctx) return;
      let h = this.hums[id];
      const c = this.ctx;
      if (on && !h) {
        const osc = c.createOscillator();
        osc.type = o.type || 'sawtooth';
        osc.frequency.value = o.freq || 80;
        const osc2 = c.createOscillator();
        osc2.type = 'sine';
        osc2.frequency.value = (o.freq || 80) * 1.501;
        const f = c.createBiquadFilter();
        f.type = 'lowpass';
        f.frequency.value = o.cutoff || 500;
        f.Q.value = 4;
        const g = c.createGain();
        g.gain.value = 0.0001;
        g.gain.setTargetAtTime(o.gain || 0.05, c.currentTime, 0.08);
        osc.connect(f);
        osc2.connect(f);
        f.connect(g);
        g.connect(this.sfxBus);
        osc.start();
        osc2.start();
        h = this.hums[id] = { osc, osc2, f, g, cutoff: o.cutoff || 500 };
      } else if (!on && h) {
        h.g.gain.setTargetAtTime(0.0001, c.currentTime, 0.06);
        h.osc.stop(c.currentTime + 0.4);
        h.osc2.stop(c.currentTime + 0.4);
        delete this.hums[id];
      }
      if (on && h && o.mod != null) h.f.frequency.setTargetAtTime(h.cutoff * (1 + o.mod), c.currentTime, 0.05);
    },
    stopHums() {
      for (const id of Object.keys(this.hums)) this.hum(id, false);
    },
  };

  // ---- SFX recipes --------------------------------------------------------
  const SFX = {
    ui_move: { gap: 0.03, fn: (a) => a.tone({ freq: 880, dur: 0.06, gain: 0.05, type: 'triangle' }) },

      },
    },
    timesight_on: {
      fn: (a) => {
        a.tone({ freq: 420, freqEnd: 55, dur: 0.8, gain: 0.12, type: 'sine' });
        a.noise({ dur: 0.6, gain: 0.05, ftype: 'lowpass', freq: 2400, freqEnd: 200 });
      },
    },
    timesight_off: { fn: (a) => a.tone({ freq: 70, freqEnd: 380, dur: 0.35, gain: 0.08, type: 'sine' }) },
    expand: {
      fn: (a) => {
        a.tone({ freq: 90, freqEnd: 28, dur: 1.3, gain: 0.3, type: 'sine' });

      },
    },
    shot: {
      gap: 0.035,
      fn: (a) => {

      },
    },
    pulse: { gap: 0.04, fn: (a) => a.tone({ freq: 900, freqEnd: 280, dur: 0.12, gain: 0.05, type: 'square', filter: { freq: 2200 } }) },
    bolt: { gap: 0.04, fn: (a) => a.tone({ freq: 1600, freqEnd: 500, dur: 0.12, gain: 0.04, type: 'triangle' }) },
    hit: {
      gap: 0.06,
      fn: (a) => {

      fn: (a) => {

      fn: (a) => {
        [45, 52, 57, 61, 64, 69].forEach((n, i) => a.tone({ freq: mtof(n), dur: 2.6, gain: 0.07, type: 'sine', attack: 0.25, delay: i * 0.07 }));
        a.noise({ dur: 2, gain: 0.04, ftype: 'highpass', freq: 6000, attack: 0.5 });
      },
    },
    flash: {
      fn: (a) => {
        a.noise({ dur: 3, gain: 0.35, ftype: 'lowpass', freq: 9000, freqEnd: 150, attack: 0.8 });

      },
    },
    meteor: { gap: 0.2, fn: (a) => a.tone({ freq: 2400, freqEnd: 260, dur: 0.9, gain: 0.04, type: 'sine' }) },

    gear: {
      gap: 0.03,
      fn: (a) => {
        a.noise({ dur: 0.04, gain: 0.12, ftype: 'bandpass', freq: 2600, q: 5 });
        a.tone({ freq: 1900, dur: 0.06, gain: 0.04, type: 'triangle' });
      },
    },
    miss: { gap: 0.15, fn: (a) => a.tone({ freq: 160, dur: 0.18, gain: 0.07, type: 'square', filter: { freq: 700 } }) },
    zap: {
      gap: 0.1,
      fn: (a) => {
        a.noise({ dur: 0.7, gain: 0.25, ftype: 'bandpass', freq: 2000, freqEnd: 300, q: 1.5 });
        a.tone({ freq: 900, freqEnd: 90, dur: 0.6, gain: 0.1, type: 'sawtooth', filter: { freq: 2500 } });
      },
    },
    snap: { gap: 0.05, fn: (a) => [79, 86].forEach((n, i) => a.tone({ freq: mtof(n), dur: 0.5, gain: 0.05, type: 'sine', delay: i * 0.06 })) },
    memory: { gap: 0.2, fn: (a) => [72, 76, 79, 84].forEach((n, i) => a.tone({ freq: mtof(n), dur: 1.1, gain: 0.045, type: 'sine', delay: i * 0.12 })) },
    whoosh: { gap: 0.1, fn: (a) => a.noise({ dur: 0.5, gain: 0.1, ftype: 'bandpass', freq: 300, freqEnd: 1600, q: 0.8 }) },
  };

  // ---- music sequencer ----------------------------------------------------
  const Music = {
    audio: null,
    track: null,
    trackId: null,
    pending: null,
    attach(audio) {
      this.audio = audio;
      if (this.pending !== null) {
        const p = this.pending;
        this.pending = null;
        this.play(p);
      }
    },
    play(id) {
      if (!this.audio || !this.audio.ctx) {
        this.pending = id;
        return;
      }
      if (id === this.trackId) return;
      const c = this.audio.ctx;
      if (this.gain) {
        const old = this.gain;
        old.gain.setTargetAtTime(0.0001, c.currentTime, 0.5);
        setTimeout(() => old.disconnect(), 4000);
      }
      this.trackId = id;
      this.track = id ? DM.MusicTracks[id] : null;
      this.gain = null;
      if (!this.track) return;
      this.gain = c.createGain();
      this.gain.gain.value = 0.0001;
      this.gain.gain.setTargetAtTime(1, c.currentTime + 0.1, 0.7);
      this.gain.connect(this.audio.musicBus);
      const send = c.createGain();
      send.gain.value = this.track.echo == null ? 0.35 : this.track.echo;
      this.gain.connect(send);
      send.connect(this.audio.echoSend);
      this.step = 0;
      this.next = c.currentTime + 0.15;
      if (!this.timer) this.timer = setInterval(() => this.schedule(), 30);
    },
    stop() {
      this.play(null);
    },
    schedule() {
      const c = this.audio && this.audio.ctx;
      if (!c || !this.track || c.state !== 'running') return;
      const tr = this.track;
      const spStep = 60 / tr.bpm / (tr.div || 4);
      if (this.next < c.currentTime - 0.3) this.next = c.currentTime + 0.05;
      while (this.next < c.currentTime + 0.2) {
        this.playStep(this.step, this.next, spStep);
        this.next += spStep;
        this.step++;
      }
    },
    playStep(step, t, spStep) {
      const tr = this.track;
      const perBar = (tr.div || 4) * (tr.beats || 4);
      const bpc = tr.barsPerChord || 1;
      const bar = Math.floor(step / perBar);
      const sib = step % perBar;
      const chord = tr.prog[Math.floor(bar / bpc) % tr.prog.length];
      const chordStart = sib === 0 && bar % bpc === 0;
      for (const L of tr.layers) {
        if (L.from && bar < L.from) continue;
        if (L.kind === 'arp') {
          const every = L.every || 1;
          if (sib % every) continue;
          const idx = Math.floor(step / every);
          const pi = L.pattern[idx % L.pattern.length];
          if (pi == null || pi < 0) continue;
          const n = chord[pi % chord.length] + 12 * Math.floor(pi / chord.length) + (L.oct || 0);
          this.note(n, t, spStep * every * (L.len || 1.6), L);
        } else if (L.kind === 'pad') {
          if (!chordStart) continue;
          const dur = spStep * perBar * bpc;
          for (const n of chord) this.note(n + (L.oct || 0), t, dur, L);
        } else if (L.kind === 'bass') {
          const every = L.every || perBar;
          if (sib % every === 0) this.note(chord[0] + (L.oct == null ? -12 : L.oct), t, spStep * every * 0.95, L);
        } else if (L.kind === 'tick') {
          const every = L.every || tr.div || 4;
          if (sib % every === 0) this.click(t, L, (sib / every) % 2);
        } else if (L.kind === 'kick') {
          if (L.pattern[sib % L.pattern.length]) this.kick(t, L);
        }
      }
    },
    note(m, t, dur, L) {
      const c = this.audio.ctx;
      const osc = c.createOscillator();
      osc.type = L.wave || 'triangle';
      osc.frequency.value = mtof(m);
      if (L.detune) osc.detune.value = (Math.random() - 0.5) * L.detune;
      const g = c.createGain();
      const a = L.attack == null ? 0.01 : L.attack;
      const peak = L.gain == null ? 0.05 : L.gain;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(a + 0.03, dur));
      let node = osc;
      if (L.cutoff) {
        const f = c.createBiquadFilter();
        f.type = 'lowpass';
        f.frequency.value = L.cutoff;
        osc.connect(f);
        node = f;
      }
      node.connect(g);
      g.connect(this.gain);
      osc.start(t);
      osc.stop(t + dur + 0.1);
    },
    click(t, L, alt) {
      const c = this.audio.ctx;
      const src = c.createBufferSource();
      src.buffer = this.audio.noiseBuf;
      const f = c.createBiquadFilter();
      f.type = 'bandpass';
      f.frequency.value = alt ? 3000 : 4200;
      f.Q.value = 7;
      const g = c.createGain();
      g.gain.setValueAtTime(L.gain || 0.08, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.035);
      src.connect(f);
      f.connect(g);
      g.connect(this.gain);
      src.start(t, Math.random() * 0.5);
      src.stop(t + 0.05);
    },
    kick(t, L) {
      const c = this.audio.ctx;
      const osc = c.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(110, t);
      osc.frequency.exponentialRampToValueAtTime(38, t + 0.18);
      const g = c.createGain();
      g.gain.setValueAtTime(L.gain || 0.2, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
      osc.connect(g);
      g.connect(this.gain);
      osc.start(t);
      osc.stop(t + 0.3);
    },
  };

  Audio.music = Music;
  DM.Audio = Audio;
})();
</script>

      layers: [
        { kind: 'pad', wave: 'sine', gain: 0.03, attack: 2 },
        { kind: 'arp', wave: 'sine', gain: 0.026, every: 2, pattern: [0, 1, 2, 3, 4, 3, 2, 1], oct: 12, len: 3 },
      ],
    },
  };
})();
</script>
<script>/* src/core/save.js */
/*
 * Save data in localStorage, versioned so future updates can migrate old saves
 * instead of wiping them. Storage can be unavailable (private windows, blocked
 * site data) — every access is wrapped so the game still runs, just without
 * persistence.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const KEY = 'dr-manhattan.save';
  const CURRENT = 1;

  const defaults = () => ({
    version: CURRENT,
    reached: 0, // furthest chapter index the player may start
    completed: {}, // chapterId -> stats of best/last completion
    checkpoint: null, // { chapter, stage } — powers "Continue"
    totals: { disintegrated: 0, spared: 0, decoherences: 0, memories: 0 },
    settings: { music: 0.6, sfx: 0.8, shake: 1, hints: true },
  });

  // migrations[n] upgrades a save object from version n to n + 1.
  const migrations = {};

  function merge(base, over) {
    for (const k in over) {
      const v = over[k];
      if (v && typeof v === 'object' && !Array.isArray(v) && base[k] && typeof base[k] === 'object') merge(base[k], v);
      else base[k] = v;
    }
    return base;
  }

  const Save = {
    data: defaults(),
    available: true,
    get settings() {
      return this.data.settings;
    },
    load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) {
          let d = JSON.parse(raw);
          while (d.version < CURRENT && migrations[d.version]) d = migrations[d.version](d);
          this.data = merge(defaults(), d);
          this.data.version = CURRENT;
        }
      } catch (e) {
        this.available = false;
        this.data = defaults();
      }
      return this.data;
    },
    write() {
      try {
        localStorage.setItem(KEY, JSON.stringify(this.data));
      } catch (e) {
        this.available = false;
      }
    },
    reset() {
      const s = this.data.settings;
      this.data = defaults();
      this.data.settings = s;
      this.write();
    },
    hasProgress() {
      return !!this.data.checkpoint || this.data.reached > 0;
    },
  };

  DM.Save = Save;
})();
</script>
<script>/* src/core/gfx.js */
/*
 * Gfx: procedural drawing. There are no image assets — characters, symbols,
 * portraits and icons are all drawn here, which keeps the game a handful of
 * text files and makes restyling cheap.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const F = DM.FONTS;
  const TAU = Math.PI * 2;
  const Gfx = {};

  // ---- primitives ---------------------------------------------------------
  Gfx.circle = (ctx, x, y, r) => {
    ctx.beginPath();
    ctx.arc(x, y, Math.max(0, r), 0, TAU);
  };
  Gfx.ellipse = (ctx, x, y, rx, ry, rot = 0) => {
    ctx.beginPath();
    ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, TAU);
  };
  Gfx.rr = (ctx, x, y, w, h, r) => {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  };
  Gfx.line = (ctx, x1, y1, x2, y2) => {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  };

  // ---- glow sprites (cached radial gradients, drawn additively) -----------
  const glowCache = new Map();
  Gfx.glowSprite = (color, radius) => {
    const r = Math.max(4, Math.ceil(radius / 4) * 4);
    const key = color + r;
    let c = glowCache.get(key);
    if (c) return c;
    if (glowCache.size > 600) glowCache.clear();
    c = document.createElement('canvas');
    c.width = c.height = r * 2;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(r, r, 0, r, r, r);
    grad.addColorStop(0, U.rgba(color, 1));
    grad.addColorStop(0.22, U.rgba(color, 0.55));
    grad.addColorStop(0.55, U.rgba(color, 0.16));
    grad.addColorStop(1, U.rgba(color, 0));
    g.fillStyle = grad;
    g.fillRect(0, 0, r * 2, r * 2);
    glowCache.set(key, c);
    return c;
  };
  Gfx.glow = (ctx, x, y, radius, color, alpha = 1) => {
    if (alpha <= 0.003 || radius <= 0) return;
    const s = Gfx.glowSprite(color, radius);
    const op = ctx.globalCompositeOperation;
    const a = ctx.globalAlpha;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a * Math.min(1, alpha);
    ctx.drawImage(s, x - radius, y - radius, radius * 2, radius * 2);
    ctx.globalCompositeOperation = op;
    ctx.globalAlpha = a;
  };

  // ---- text ---------------------------------------------------------------
  Gfx.font = (size, family = F.display, weight = 400) => `${weight} ${size}px ${family}`;
  const hasSpacing = (ctx) => 'letterSpacing' in ctx;

  Gfx.text = (ctx, str, x, y, o = {}) => {
    ctx.font = Gfx.font(o.size || 16, o.font || F.display, o.weight || 400);
    ctx.textAlign = o.align || 'left';
    ctx.textBaseline = o.baseline || 'alphabetic';
    if (hasSpacing(ctx)) ctx.letterSpacing = (o.spacing || 0) + 'px';
    if (o.alpha != null) ctx.globalAlpha *= o.alpha;
    if (o.shadow) {
      ctx.fillStyle = o.shadow;
      ctx.fillText(str, x + (o.shadowOff || 2), y + (o.shadowOff || 2));
    }
    if (o.stroke) {
      ctx.strokeStyle = o.stroke;
      ctx.lineWidth = o.strokeWidth || 3;
      ctx.lineJoin = 'round';
      ctx.strokeText(str, x, y);
    }
    ctx.fillStyle = o.color || '#fff';
    ctx.fillText(str, x, y);
    if (o.alpha != null) ctx.globalAlpha /= o.alpha;
    if (hasSpacing(ctx)) ctx.letterSpacing = '0px';
  };

  Gfx.measure = (ctx, str, o = {}) => {
    ctx.font = Gfx.font(o.size || 16, o.font || F.display, o.weight || 400);
    if (hasSpacing(ctx)) ctx.letterSpacing = (o.spacing || 0) + 'px';
    const w = ctx.measureText(str).width;
    if (hasSpacing(ctx)) ctx.letterSpacing = '0px';
    return w;
  };

  const wrapCache = new Map();
  Gfx.wrap = (ctx, text, maxW) => {
    const key = ctx.font + '|' + maxW + '|' + text;
    let lines = wrapCache.get(key);
    if (lines) return lines;
    lines = [];
    for (const para of String(text).split('\n')) {
      const words = para.split(' ');
      let line = '';
      for (const w of words) {
        const test = line ? line + ' ' + w : w;
        if (ctx.measureText(test).width > maxW && line) {
          lines.push(line);
          line = w;
        } else line = test;
      }
      lines.push(line);
    }
    if (wrapCache.size > 600) wrapCache.clear();
    wrapCache.set(key, lines);
    return lines;
  };

  // Wrapped text. `chars` reveals only the first N characters (typewriter effect).
  Gfx.paragraph = (ctx, text, x, y, maxW, lh, o = {}) => {
    ctx.font = Gfx.font(o.size || 18, o.font || F.hand, o.weight || 400);
    ctx.textAlign = o.align || 'left';
    ctx.textBaseline = 'top';
    if (hasSpacing(ctx)) ctx.letterSpacing = '0px';
    ctx.fillStyle = o.color || '#fff';
    const lines = Gfx.wrap(ctx, text, maxW);
    let remaining = o.chars == null ? Infinity : o.chars;
    for (let i = 0; i < lines.length; i++) {
      if (remaining <= 0) break;
      let ln = lines[i];
      if (ln.length > remaining) ln = ln.slice(0, Math.max(0, Math.floor(remaining)));
      ctx.fillText(ln, x, y + i * lh);
      remaining -= lines[i].length + 1;
    }
    return lines.length * lh;
  };
  Gfx.paragraphHeight = (ctx, text, maxW, lh, o = {}) => {
    ctx.font = Gfx.font(o.size || 18, o.font || F.hand, o.weight || 400);
    return Gfx.wrap(ctx, text, maxW).length * lh;
  };

  // ---- UI pieces ----------------------------------------------------------
  Gfx.panel = (ctx, x, y, w, h, o = {}) => {
    ctx.fillStyle = o.fill || DM.C.uiBg;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = o.edge || 'rgba(140, 200, 240, 0.18)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    // corner brackets
    const c = o.accent || DM.C.uiEdge;
    const k = Math.min(10, w / 4, h / 4);
    ctx.strokeStyle = c;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y + k); ctx.lineTo(x, y); ctx.lineTo(x + k, y);
    ctx.moveTo(x + w - k, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + k);
    ctx.moveTo(x + w, y + h - k); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - k, y + h);
    ctx.moveTo(x + k, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - k);
    ctx.stroke();
  };

  Gfx.bar = (ctx, x, y, w, h, frac, color, o = {}) => {
    ctx.fillStyle = o.bg || 'rgba(255,255,255,0.08)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w * U.clamp(frac, 0, 1), h);
    if (o.segments) {
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      for (let i = 1; i < o.segments; i++) ctx.fillRect(x + (w * i) / o.segments - 1, y, 2, h);
    }
  };

  // Watchmen-style narration caption: paper box, ink border, typewriter text.
  Gfx.caption = (ctx, text, cx, y, maxW, o = {}) => {
    const pad = 14;
    const size = o.size || 17;
    const lh = Math.round(size * 1.35);
    ctx.font = Gfx.font(size, F.type);
    const lines = Gfx.wrap(ctx, text, maxW - pad * 2);
    let w = 0;
    for (const l of lines) w = Math.max(w, ctx.measureText(l).width);
    w += pad * 2;
    const h = lines.length * lh + pad * 2 - (lh - size);
    const x = cx - w / 2;
    ctx.save();
    if (o.alpha != null) ctx.globalAlpha *= o.alpha;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(x + 4, y + 4, w, h);
    ctx.fillStyle = o.bg || DM.C.paper;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = o.border || DM.C.ink;
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);
    Gfx.paragraph(ctx, text, x + pad, y + pad, maxW - pad * 2, lh, { size, font: F.type, color: o.color || DM.C.ink, chars: o.chars });
    ctx.restore();
    return h;
  };

  // Comic speech bubble with a tail pointing down at (x, y).
  Gfx.bubble = (ctx, text, x, y, o = {}) => {
    const size = o.size || 15;
    ctx.font = Gfx.font(size, F.hand);
    const w = Math.min(220, ctx.measureText(text).width) + 16;
    const lines = Gfx.wrap(ctx, text, w - 16);
    const h = lines.length * (size + 2) + 10;
    const bx = x - w / 2, by = y - h - 12;
    ctx.save();
    if (o.alpha != null) ctx.globalAlpha *= o.alpha;
    ctx.fillStyle = o.bg || '#fbf8ef';
    ctx.strokeStyle = DM.C.ink;
    ctx.lineWidth = 1.5;
    Gfx.rr(ctx, bx, by, w, h, 8);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - 6, by + h - 1);
    ctx.lineTo(x, y - 2);
    ctx.lineTo(x + 6, by + h - 1);
    ctx.fill();
    ctx.stroke();
    ctx.fillRect(x - 5, by + h - 3, 10, 3);
    Gfx.paragraph(ctx, text, x, by + 5, w - 16, size + 2, { size, font: F.hand, color: DM.C.ink, align: 'center' });
    ctx.restore();
  };

  // ---- Watchmen motifs ----------------------------------------------------
  // The hydrogen atom: Jon's chosen symbol.
  Gfx.hydrogen = (ctx, x, y, r, color, t = 0, lw) => {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = lw || Math.max(1, r * 0.14);
    Gfx.circle(ctx, x, y, r);
    ctx.stroke();
    Gfx.circle(ctx, x, y, r * 0.24);
    ctx.fill();
    Gfx.circle(ctx, x + Math.cos(t) * r, y + Math.sin(t) * r, r * 0.17);
    ctx.fill();
    ctx.restore();
  };

  // The Doomsday Clock. `minutes` = minutes to midnight.
  Gfx.clock = (ctx, x, y, r, minutes, o = {}) => {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = o.face || DM.C.paper;
    Gfx.circle(ctx, 0, 0, r);
    ctx.fill();
    ctx.strokeStyle = o.rim || DM.C.ink;
    ctx.lineWidth = Math.max(1.5, r * 0.08);
    ctx.stroke();
    ctx.lineCap = 'round';
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * TAU;
      ctx.lineWidth = i === 0 ? r * 0.08 : r * 0.04;
      Gfx.line(ctx, Math.cos(a) * r * 0.74, Math.sin(a) * r * 0.74, Math.cos(a) * r * 0.88, Math.sin(a) * r * 0.88);
    }
    const mA = -Math.PI / 2 - (minutes / 60) * TAU;
    const hA = -Math.PI / 2 - (minutes / 720) * TAU;
    ctx.strokeStyle = o.hands || DM.C.ink;
    ctx.lineWidth = r * 0.1;
    Gfx.line(ctx, 0, 0, Math.cos(hA) * r * 0.48, Math.sin(hA) * r * 0.48);
    ctx.lineWidth = r * 0.06;
    Gfx.line(ctx, 0, 0, Math.cos(mA) * r * 0.78, Math.sin(mA) * r * 0.78);
    ctx.fillStyle = o.hands || DM.C.ink;
    Gfx.circle(ctx, 0, 0, r * 0.08);
    ctx.fill();
    if (o.blood) {
      ctx.fillStyle = DM.C.blood;
      const bx = r * 0.28, by = -r * 0.55;
      Gfx.circle(ctx, bx, by, r * 0.13);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(bx - r * 0.06, by);
      ctx.quadraticCurveTo(bx - r * 0.02, by + r * 0.5, bx + r * 0.02, by + r * 0.62);
      ctx.quadraticCurveTo(bx + r * 0.08, by + r * 0.3, bx + r * 0.12, by);
      ctx.fill();
    }
    ctx.restore();
  };

  // The smiley badge. A small nod; used as an easter egg prop.
  Gfx.smiley = (ctx, x, y, r) => {
    ctx.save();
    ctx.fillStyle = DM.C.yellow;
    Gfx.circle(ctx, x, y, r);
    ctx.fill();
    ctx.strokeStyle = DM.C.ink;
    ctx.lineWidth = r * 0.08;
    ctx.stroke();
    ctx.fillStyle = DM.C.ink;
    Gfx.ellipse(ctx, x - r * 0.33, y - r * 0.25, r * 0.1, r * 0.2);
    ctx.fill();
    Gfx.ellipse(ctx, x + r * 0.33, y - r * 0.25, r * 0.1, r * 0.2);
    ctx.fill();
    ctx.lineWidth = r * 0.09;
    ctx.beginPath();
    ctx.arc(x, y + r * 0.05, r * 0.55, 0.2 * Math.PI, 0.8 * Math.PI);
    ctx.stroke();
    ctx.fillStyle = DM.C.blood;
    ctx.beginPath();
    ctx.moveTo(x + r * 0.15, y - r * 0.9);
    ctx.quadraticCurveTo(x + r * 0.05, y - r * 0.2, x + r * 0.32, y + r * 0.1);
    ctx.quadraticCurveTo(x + r * 0.45, y - r * 0.35, x + r * 0.45, y - r * 0.8);
    ctx.fill();
    ctx.restore();
  };

  // ---- characters (top-down) ----------------------------------------------
  // `o` = a look (see DM.LOOKS) plus x, y, angle, walk, moving, scale, alpha,
  // aim (arms forward), gun ('pistol' | 'tommy'), flash (0..1 white hit flash).
  Gfx.figure = (ctx, o) => {
    const s = (o.scale || 1) * (o.size || 1);
    ctx.save();
    ctx.translate(o.x, o.y);
    if (o.alpha != null) ctx.globalAlpha *= o.alpha;
    if (!o.noShadow) {
      ctx.fillStyle = 'rgba(0,0,0,0.26)';
      Gfx.ellipse(ctx, 3 * s, 4 * s, 14 * s, 11 * s);
      ctx.fill();
    }
    ctx.rotate(o.angle || 0);
    ctx.scale(s, s);
    const sw = o.moving ? Math.sin(o.walk || 0) : 0;
    const armsFwd = o.aim || o.carry;
    // Comic-book ink line around each shape keeps figures readable on any floor.
    const ink = o.ink === false ? null : o.ink || 'rgba(16,12,10,0.6)';
    ctx.strokeStyle = ink || 'transparent';
    ctx.lineWidth = 1.4;
    ctx.lineJoin = 'round';
    const paint = (color) => {
      ctx.fillStyle = color;
      ctx.fill();
      if (ink) ctx.stroke();
    };

    if (o.cape) {
      ctx.beginPath();
      ctx.moveTo(-1, -13);
      ctx.quadraticCurveTo(-24 - Math.abs(sw) * 4, 0, -1, 13);
      ctx.closePath();
      paint(o.cape);
    }
    Gfx.ellipse(ctx, sw * 7, -5, 6.5, 4);
    paint(o.legs || '#333');
    Gfx.ellipse(ctx, -sw * 7, 5, 6.5, 4);
    paint(o.legs || '#333');

    const sleeve = o.sleeve || o.body || '#777';
    if (armsFwd) {
      Gfx.circle(ctx, 8, -8, 4.1);
      paint(sleeve);
      Gfx.circle(ctx, 8, 8, 4.1);
      paint(sleeve);
    } else {
      Gfx.circle(ctx, -sw * 6 + 1, -12, 4.2);
      paint(sleeve);
      Gfx.circle(ctx, sw * 6 + 1, 12, 4.2);
      paint(sleeve);
    }
    Gfx.ellipse(ctx, 0, 0, 8.5, 12.5);
    paint(o.body || '#777');
    if (o.trim) {
      ctx.fillStyle = o.trim;
      ctx.fillRect(-1.5, -10, 3, 20);
    }
    const skin = o.skin || '#e0b896';
    ctx.fillStyle = skin;
    if (armsFwd) {
      Gfx.circle(ctx, 12.5, -5, 2.7);
      ctx.fill();
      Gfx.circle(ctx, 12.5, 5, 2.7);
      ctx.fill();
    } else {
      Gfx.circle(ctx, -sw * 6 + 4.5, -12.5, 2.6);
      ctx.fill();
      Gfx.circle(ctx, sw * 6 + 4.5, 12.5, 2.6);
      ctx.fill();
    }
    if (o.gun) {
      ctx.fillStyle = '#17171a';
      ctx.fillRect(12, -1.8, o.gun === 'tommy' ? 17 : 10, 3.6);
      if (o.gun === 'tommy') {
        Gfx.circle(ctx, 18, 0, 3.6);
        ctx.fill();
      }
    }

    // head
    Gfx.circle(ctx, 1, 0, 7.2);
    paint(skin);
    if (o.hairStyle === 'long' && o.hair) {
      Gfx.ellipse(ctx, -5, 0, 7, 8.5);
      paint(o.hair);
    }
    if (o.hat) {
      const brim = o.hatBrim || o.hat;
      if (o.hatStyle === 'cap') {
        Gfx.circle(ctx, 0.5, 0, 7.8);
        paint(brim);
        Gfx.ellipse(ctx, 7.5, 0, 3.6, 6.2);
        paint(brim);
      } else {
        Gfx.circle(ctx, 0, 0, 10.5);
        paint(brim);
        Gfx.circle(ctx, 0, 0, 6.8);
        paint(o.hat);
      }
    } else if (o.hair && o.hairStyle !== 'bald') {
      ctx.beginPath();
      ctx.arc(0.5, 0, 7.6, Math.PI * 0.36, Math.PI * 1.64);
      ctx.closePath();
      ctx.fillStyle = o.hair;
      ctx.fill();
    }
    if (o.glasses) {
      ctx.strokeStyle = 'rgba(20,20,20,0.85)';
      ctx.lineWidth = 1.2;
      Gfx.line(ctx, 7.6, -4, 7.6, 4);
    }
    if (o.mark) Gfx.hydrogen(ctx, 1, 0, 3.4, o.mark, o.markT || 0, 0.9);
    if (o.flash) {
      ctx.fillStyle = `rgba(255,255,255,${o.flash})`;
      Gfx.ellipse(ctx, 0, 0, 9, 13);
      ctx.fill();
      Gfx.circle(ctx, 1, 0, 7.6);
      ctx.fill();
    }
    ctx.restore();
  };

  Gfx.MANHATTAN_LOOK = { skin: '#8fe1ff', body: '#55c6f4', sleeve: '#55c6f4', legs: '#3aa6dc', hair: null, ink: '#0b3558' };

  Gfx.manhattan = (ctx, o) => {
    const s = (o.scale || 1) * (o.size || 1);
    const a = o.alpha == null ? 1 : o.alpha;
    const pulse = 0.85 + Math.sin((o.t || 0) * 2.2) * 0.08;
    Gfx.glow(ctx, o.x, o.y, 54 * s, '#2fa8ff', 0.4 * a * pulse);
    Gfx.figure(ctx, Object.assign({}, Gfx.MANHATTAN_LOOK, o, { mark: '#eafcff', markT: (o.t || 0) * 1.4 }));
    Gfx.glow(ctx, o.x, o.y, 22 * s, '#bff1ff', 0.18 * a);
  };

  // Jon as pure awareness: a lone hydrogen atom.
  Gfx.awareness = (ctx, x, y, t, s = 1, alpha = 1) => {
    Gfx.glow(ctx, x, y, 46 * s, '#2fa8ff', 0.75 * alpha);
    Gfx.glow(ctx, x, y, 14 * s, '#eefbff', 0.9 * alpha);
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.translate(x, y);
    ctx.rotate(t * 0.7);
    ctx.strokeStyle = 'rgba(210,246,255,0.85)';
    ctx.lineWidth = 1.5;
    Gfx.ellipse(ctx, 0, 0, 17 * s, 6.5 * s);
    ctx.stroke();
    const ea = t * 4.2;
    ctx.fillStyle = '#ffffff';
    Gfx.circle(ctx, Math.cos(ea) * 17 * s, Math.sin(ea) * 6.5 * s, 2.6 * s);
    ctx.fill();
    Gfx.circle(ctx, 0, 0, 3.8 * s);
    ctx.fill();
    ctx.restore();
  };

  // ---- portraits (front view, for dialogue) --------------------------------
  Gfx.portrait = (ctx, x, y, size, look, t = 0, talking = false) => {
    const s = size / 100;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.beginPath();
    ctx.rect(0, 0, 100, 100);
    ctx.clip();
    ctx.fillStyle = look.bg || '#2a3340';
    ctx.fillRect(0, 0, 100, 100);
    // halftone dots for a printed-comic feel
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    for (let yy = 4; yy < 100; yy += 8) for (let xx = (yy / 8) % 2 ? 4 : 0; xx < 100; xx += 8) {
      Gfx.circle(ctx, xx, yy, 1.3);
      ctx.fill();
    }
    if (look.manhattan) Gfx.glow(ctx, 50, 52, 80, '#2fa8ff', 0.7);

    if (look.cape) {
      ctx.fillStyle = look.cape;
      Gfx.ellipse(ctx, 50, 112, 52, 34);
      ctx.fill();
    }
    ctx.fillStyle = look.body || '#666';
    Gfx.ellipse(ctx, 50, 110, 44, 32);
    ctx.fill();
    if (look.collar) {
      ctx.fillStyle = look.collar;
      ctx.beginPath();
      ctx.moveTo(38, 80); ctx.lineTo(50, 96); ctx.lineTo(62, 80); ctx.lineTo(56, 80); ctx.lineTo(50, 88); ctx.lineTo(44, 80);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = U.mix(look.skin, '#000000', 0.18);
    ctx.fillRect(43, 64, 14, 18);
    if (look.hairStyle === 'long') {
      ctx.fillStyle = look.hair;
      Gfx.ellipse(ctx, 50, 56, 28, 36);
      ctx.fill();
    }
    ctx.fillStyle = look.skin;
    Gfx.ellipse(ctx, 50, 48, 20, 25);
    ctx.fill();
    Gfx.ellipse(ctx, 30.5, 50, 3.5, 6);
    ctx.fill();
    Gfx.ellipse(ctx, 69.5, 50, 3.5, 6);
    ctx.fill();

    const style = look.hairStyle || 'short';
    if (look.hair && style !== 'bald') {
      ctx.fillStyle = look.hair;
      if (style === 'long') {
        Gfx.ellipse(ctx, 50, 32, 22, 13);
        ctx.fill();
        ctx.fillRect(28, 32, 7, 34);
        ctx.fillRect(65, 32, 7, 34);
      } else if (style === 'slick') {
        Gfx.ellipse(ctx, 50, 30, 21, 11);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(29, 36); ctx.quadraticCurveTo(45, 18, 72, 30); ctx.lineTo(70, 38); ctx.quadraticCurveTo(52, 28, 31, 42);
        ctx.fill();
      } else if (style === 'thin') {
        ctx.beginPath();
        ctx.moveTo(30, 44); ctx.quadraticCurveTo(30, 26, 40, 27); ctx.lineTo(36, 46);
        ctx.moveTo(70, 44); ctx.quadraticCurveTo(70, 26, 60, 27); ctx.lineTo(64, 46);
        ctx.fill();
      } else {
        Gfx.ellipse(ctx, 50, 31, 21, 12);
        ctx.fill();
        ctx.fillRect(29, 31, 5, 13);
        ctx.fillRect(66, 31, 5, 13);
      }
    }
    if (look.hat) {
      ctx.fillStyle = look.hat;
      if (look.hatStyle === 'cap') {
        Gfx.ellipse(ctx, 50, 27, 25, 11);
        ctx.fill();
        ctx.fillStyle = look.hatBrim || '#111';
        Gfx.ellipse(ctx, 50, 34, 27, 5);
        ctx.fill();
        if (look.badge) {
          ctx.fillStyle = look.badge;
          Gfx.circle(ctx, 50, 26, 4);
          ctx.fill();
        }
      } else {
        Gfx.ellipse(ctx, 50, 31, 36, 7);
        ctx.fill();
        Gfx.rr(ctx, 32, 10, 36, 22, 7);
        ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(32, 24, 36, 5);
      }
    }

    // face
    if (look.manhattan) {
      ctx.fillStyle = '#ffffff';
      Gfx.ellipse(ctx, 42, 49, 4.2, 2.6);
      ctx.fill();
      Gfx.ellipse(ctx, 58, 49, 4.2, 2.6);
      ctx.fill();
      Gfx.glow(ctx, 42, 49, 9, '#bff1ff', 0.7);
      Gfx.glow(ctx, 58, 49, 9, '#bff1ff', 0.7);
    } else {
      ctx.fillStyle = '#1b1612';
      Gfx.ellipse(ctx, 42, 49, 2.3, 2.6);
      ctx.fill();
      Gfx.ellipse(ctx, 58, 49, 2.3, 2.6);
      ctx.fill();
    }
    ctx.strokeStyle = 'rgba(30,20,15,0.75)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    Gfx.line(ctx, 37, 42, 46, 41);
    Gfx.line(ctx, 54, 41, 63, 42);
    ctx.lineWidth = 1.6;
    Gfx.line(ctx, 50, 50, 48, 57);
    Gfx.line(ctx, 48, 57, 51, 58);
    const open = talking ? (Math.sin(t * 22) * 0.5 + 0.5) * 4 : 0;
    ctx.fillStyle = 'rgba(60,20,20,0.8)';
    if (open > 0.6) {
      Gfx.ellipse(ctx, 50, 64, 5, open / 2 + 0.5);
      ctx.fill();
    } else Gfx.line(ctx, 45, 64, 55, 64);
    if (look.glasses) {
      ctx.strokeStyle = '#1b1612';
      ctx.lineWidth = 1.8;
      Gfx.circle(ctx, 42, 49, 6.5);
      ctx.stroke();
      Gfx.circle(ctx, 58, 49, 6.5);
      ctx.stroke();
      Gfx.line(ctx, 48.5, 49, 51.5, 49);
    }
    if (look.moustache) {
      ctx.fillStyle = look.hair || '#222';
      Gfx.ellipse(ctx, 50, 60, 8, 2.4);
      ctx.fill();
    }
    if (look.manhattan) Gfx.hydrogen(ctx, 50, 33, 6.5, '#e8fbff', t * 0.8, 1.5);
    ctx.restore();
    ctx.strokeStyle = DM.C.ink;
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, size, size);
  };

  // ---- power icons -------------------------------------------------------
  Gfx.icon = (ctx, id, x, y, size, color, t = 0) => {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size / 40, size / 40);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    switch (id) {
      case 'telekinesis':
        Gfx.circle(ctx, 0, 0, 4.5);
        ctx.fill();
        for (let i = 1; i <= 2; i++) {
          const r = 6 + i * 6 + Math.sin(t * 3 + i) * 0.8;
          ctx.beginPath(); ctx.arc(0, 0, r, -0.65, 0.65); ctx.stroke();
          ctx.beginPath(); ctx.arc(0, 0, r, Math.PI - 0.65, Math.PI + 0.65); ctx.stroke();
        }
        break;
      case 'disintegrate':
        ctx.setLineDash([3, 3]);
        Gfx.circle(ctx, -3, 2, 7);
        ctx.stroke();
        ctx.setLineDash([]);
        for (let i = 0; i < 9; i++) {
          const a = -1.2 + i * 0.32;
          const r = 10 + (i % 3) * 3.5;
          Gfx.circle(ctx, -3 + Math.cos(a) * r, 2 + Math.sin(a) * r, 2.4 - (i % 3) * 0.6);
          ctx.fill();
        }
        break;
      case 'teleport':
        ctx.setLineDash([2.5, 3]);
        Gfx.circle(ctx, -9, 6, 6);
        ctx.stroke();
        ctx.setLineDash([]);
        Gfx.circle(ctx, 9, -6, 6);
        ctx.fill();
        Gfx.line(ctx, -3, 2, 3, -2);
        Gfx.line(ctx, 3, -2, -1, -3);
        Gfx.line(ctx, 3, -2, 2, 2);
        break;
      case 'duplicate':
        for (const [dx, dy, a] of [[-11, 3, 0.5], [11, 3, 0.5], [0, -2, 1]]) {
          ctx.globalAlpha = a;
          Gfx.circle(ctx, dx, dy - 6, 4.5);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(dx, dy + 9, 8, Math.PI, 0);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        break;
      case 'timesight':
        Gfx.circle(ctx, 0, 0, 15);
        ctx.stroke();
        for (let i = 0; i < 4; i++) {
          const a = (i * Math.PI) / 2;
          Gfx.line(ctx, Math.cos(a) * 11, Math.sin(a) * 11, Math.cos(a) * 14, Math.sin(a) * 14);
        }
        Gfx.line(ctx, 0, 0, Math.cos(t * 2 - 1.57) * 10, Math.sin(t * 2 - 1.57) * 10);
        Gfx.line(ctx, 0, 0, 6, 3);
        break;
      case 'expand':
        ctx.strokeRect(-5, -5, 10, 10);
        for (const [sx, sy] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
          Gfx.line(ctx, sx * 8, sy * 8, sx * 15, sy * 15);
          Gfx.line(ctx, sx * 15, sy * 15, sx * 10, sy * 15);
          Gfx.line(ctx, sx * 15, sy * 15, sx * 15, sy * 10);
        }
        break;
      case 'coalesce':
        Gfx.circle(ctx, 0, 0, 4);
        ctx.fill();
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * TAU + t * 0.5;
          const r = 13 + Math.sin(t * 3 + i) * 2;
          Gfx.circle(ctx, Math.cos(a) * r, Math.sin(a) * r, 2);
          ctx.fill();
        }
        break;
      default:
        Gfx.circle(ctx, 0, 0, 12);
        ctx.stroke();
    }
    ctx.restore();
  };

  // ---- screen effects -----------------------------------------------------
  let vignetteCanvas = null;
  Gfx.vignette = (ctx, alpha = 1) => {
    if (!vignetteCanvas) {
      vignetteCanvas = document.createElement('canvas');
      vignetteCanvas.width = DM.W / 2;
      vignetteCanvas.height = DM.H / 2;
      const g = vignetteCanvas.getContext('2d');
      const grad = g.createRadialGradient(DM.W / 4, DM.H / 4, DM.H * 0.18, DM.W / 4, DM.H / 4, DM.W * 0.42);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, 'rgba(0,0,0,0.72)');
      g.fillStyle = grad;
      g.fillRect(0, 0, DM.W / 2, DM.H / 2);
    }
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.drawImage(vignetteCanvas, 0, 0, DM.W, DM.H);
    ctx.restore();
  };

  let grainPattern = null;
  Gfx.grain = (ctx, alpha = 0.05) => {
    if (!grainPattern) {
      const c = document.createElement('canvas');
      c.width = c.height = 160;
      const g = c.getContext('2d');
      const img = g.createImageData(160, 160);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = (Math.random() * 255) | 0;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
        img.data[i + 3] = 255;
      }
      g.putImageData(img, 0, 0);
      grainPattern = ctx.createPattern(c, 'repeat');
    }
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = grainPattern;
    const ox = (Math.random() * 160) | 0, oy = (Math.random() * 160) | 0;
    ctx.translate(-ox, -oy);
    ctx.fillRect(0, 0, DM.W + 160, DM.H + 160);
    ctx.restore();
  };

  // Seeded starfield
  Gfx.makeStars = (seed, n, w, h) => {
    const rnd = U.seeded(seed);
    const out = [];
    for (let i = 0; i < n; i++) out.push({ x: rnd() * w, y: rnd() * h, r: rnd() * 1.4 + 0.2, a: rnd() * 0.7 + 0.2, tw: rnd() * TAU });
    return out;
  };

  DM.Gfx = Gfx;
})();
</script>
<script>/* src/core/particles.js */
/* Particle system: a flat array, swap-remove on death, two render passes (normal + additive). */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;
  const TAU = Math.PI * 2;

  class Particles {
    constructor(max = 3500) {
      this.list = [];
      this.max = max;
    }

    // o: vx, vy, life, size, size1 (end size), color, alpha, drag, g (gravity),
    //    add (additive, default true), shape: 'dot' | 'glow' | 'spark' | 'ring' | 'shard' | 'smoke'
    emit(x, y, o = {}) {
      if (this.list.length >= this.max) return null;
      const p = {
        x, y,
        vx: o.vx || 0,
        vy: o.vy || 0,
        t: 0,
        life: o.life == null ? 1 : o.life,
        size: o.size == null ? 3 : o.size,
        size1: o.size1 == null ? 0 : o.size1,
        color: o.color || '#ffffff',
        alpha: o.alpha == null ? 1 : o.alpha,
        drag: o.drag == null ? 2 : o.drag,
        g: o.g || 0,
        add: o.add == null ? true : o.add,
        shape: o.shape || 'dot',
        rot: o.rot || Math.random() * TAU,
        vr: o.vr || 0,
      };
      this.list.push(p);
      return p;
    }

    // Radial burst. Ranges are [min, max]. `angle` + `spread` aim it.
    burst(x, y, n, o = {}) {
      const sp = o.speed || [40, 200];
      const lf = o.life || [0.4, 1];
      const sz = o.size || [2, 4];
      for (let i = 0; i < n; i++) {
        const a = o.angle != null ? o.angle + U.rand(-(o.spread || TAU) / 2, (o.spread || TAU) / 2) : U.rand(0, TAU);
        const v = U.rand(sp[0], sp[1]);
        const r = o.radius ? U.rand(0, o.radius) : 0;
        this.emit(x + Math.cos(a) * r, y + Math.sin(a) * r, {
          vx: Math.cos(a) * v + (o.vx || 0),
          vy: Math.sin(a) * v + (o.vy || 0),
          life: U.rand(lf[0], lf[1]),
          size: U.rand(sz[0], sz[1]),
          size1: o.size1,
          color: Array.isArray(o.color) ? U.pick(o.color) : o.color,
          alpha: o.alpha,
          drag: o.drag,
          g: o.g,
          add: o.add,
          shape: o.shape,
          vr: o.vr ? U.rand(-o.vr, o.vr) : 0,
        });
      }
    }

    // Particles that start on a ring and rush inward (charging effects).
    implode(x, y, r, n, o = {}) {
      for (let i = 0; i < n; i++) {
        const a = U.rand(0, TAU);
        const life = o.life || 0.35;
        const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
        this.emit(px, py, { vx: (x - px) / life, vy: (y - py) / life, life, size: o.size || 2.5, size1: 0.5, color: o.color || '#bff1ff', drag: 0 });
      }
    }

    update(dt) {
      const L = this.list;
      for (let i = L.length - 1; i >= 0; i--) {
        const p = L[i];
        p.t += dt;
        if (p.t >= p.life) {
          L[i] = L[L.length - 1];
          L.pop();
          continue;
        }
        if (p.drag) {
          const f = Math.exp(-p.drag * dt);
          p.vx *= f;
          p.vy *= f;
        }
        p.vy += p.g * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
      }
    }

    render(ctx, view) {
      this._pass(ctx, view, false);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      this._pass(ctx, view, true);
      ctx.restore();
    }

    _pass(ctx, view, additive) {
      const L = this.list;
      for (let i = 0; i < L.length; i++) {
        const p = L[i];
        if (p.add !== additive) continue;
        if (view && (p.x < view.x0 - 40 || p.x > view.x1 + 40 || p.y < view.y0 - 40 || p.y > view.y1 + 40)) continue;
        const k = p.t / p.life;
        const size = p.size + (p.size1 - p.size) * k;
        const a = p.alpha * (1 - k * k);
        if (a <= 0.01 || size <= 0.05) continue;
        ctx.globalAlpha = a;
        switch (p.shape) {
          case 'glow': {
            const spr = Gfx.glowSprite(p.color, size * 3);
            ctx.drawImage(spr, p.x - size * 3, p.y - size * 3, size * 6, size * 6);
            break;
          }
          case 'spark':
            ctx.strokeStyle = p.color;
            ctx.lineWidth = size;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x - p.vx * 0.04, p.y - p.vy * 0.04);
            ctx.stroke();
            break;
          case 'ring':
            ctx.strokeStyle = p.color;
            ctx.lineWidth = Math.max(1, 3 * (1 - k));
            Gfx.circle(ctx, p.x, p.y, size);
            ctx.stroke();
            break;
          case 'shard':
            ctx.fillStyle = p.color;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.beginPath();
            ctx.moveTo(size, 0);
            ctx.lineTo(-size * 0.6, size * 0.5);
            ctx.lineTo(-size * 0.4, -size * 0.6);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
            break;
          case 'smoke':
            ctx.fillStyle = p.color;
            Gfx.circle(ctx, p.x, p.y, size);
            ctx.fill();
            break;
          default:
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x - size / 2, p.y - size / 2, size, size);
        }
      }
      ctx.globalAlpha = 1;
    }

    clear() {
      this.list.length = 0;
    }
  }

  DM.Particles = Particles;
})();
</script>
<script>/* src/core/camera.js */
/* Camera: smooth follow, trauma-based screen shake, zoom, world bounds. */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;

  class Camera {
    constructor() {
      this.x = 0;
      this.y = 0;
      this.zoom = 1;
      this.targetZoom = 1;
      this.trauma = 0;
      this.ox = 0;
      this.oy = 0;
      this.bounds = null; // {w, h}
    }
    snap(x, y) {
      this.x = x;
      this.y = y;
      this.clamp();
    }
    follow(tx, ty, dt, speed = 6) {
      this.x = U.damp(this.x, tx, speed, dt);
      this.y = U.damp(this.y, ty, speed, dt);
      this.clamp();
    }
    shake(amount) {
      const s = DM.Save.settings.shake == null ? 1 : DM.Save.settings.shake;
      this.trauma = Math.min(1, this.trauma + amount * s);
    }
    update(dt) {
      this.trauma = Math.max(0, this.trauma - dt * 1.5);
      const s = this.trauma * this.trauma * 16;
      this.ox = (Math.random() * 2 - 1) * s;
      this.oy = (Math.random() * 2 - 1) * s;
      this.zoom = U.damp(this.zoom, this.targetZoom, 3, dt);
      this.clamp();
    }
    clamp() {
      if (!this.bounds) return;
      const hw = DM.W / 2 / this.zoom, hh = DM.H / 2 / this.zoom;
      const b = this.bounds;
      this.x = b.w <= hw * 2 ? b.w / 2 : U.clamp(this.x, hw, b.w - hw);
      this.y = b.h <= hh * 2 ? b.h / 2 : U.clamp(this.y, hh, b.h - hh);
    }
    apply(ctx) {
      ctx.translate(DM.W / 2, DM.H / 2);
      ctx.scale(this.zoom, this.zoom);
      ctx.translate(-this.x + this.ox, -this.y + this.oy);
    }
    toWorld(sx, sy) {
      return { x: (sx - DM.W / 2) / this.zoom + this.x, y: (sy - DM.H / 2) / this.zoom + this.y };
    }
    toScreen(wx, wy) {
      return { x: (wx - this.x) * this.zoom + DM.W / 2, y: (wy - this.y) * this.zoom + DM.H / 2 };
    }
    view() {
      const hw = DM.W / 2 / this.zoom, hh = DM.H / 2 / this.zoom;
      return { x0: this.x - hw, y0: this.y - hh, x1: this.x + hw, y1: this.y + hh };
    }
  }

  DM.Camera = Camera;
})();
</script>
<script>/* src/core/engine.js */
/*
 * Engine: canvas, letterboxing, the main loop and a scene stack.
 *
 * Scenes are plain objects/classes with optional hooks:
 *   enter(params), exit(), resume(), update(dt), render(ctx)
 * and flags:
 *   opaque (default true)  — if false, the scene below is rendered first (overlays)
 *   cursor ('pointer' | 'reticle' | 'none')
 * Only the top scene updates, so pushing an overlay pauses whatever is under it.
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;

  const Engine = {
    stack: [],
    time: 0,
    fps: 60,
    scale: 1,
    offX: 0,
    offY: 0,
    dpr: 1,
    fade: { a: 0, dir: 0, speed: 2, color: '#000', cb: null, inSpeed: 2 },
    error: null,

    init(canvas) {
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d');
      this.resize();
      window.addEventListener('resize', () => this.resize());
      this.last = performance.now();
      requestAnimationFrame((t) => this.frame(t));
    },

    resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
      this.canvas.width = Math.round(w * dpr);
      this.canvas.height = Math.round(h * dpr);
      this.canvas.style.width = w + 'px';
      this.canvas.style.height = h + 'px';
      this.dpr = dpr;
      this.scale = Math.min(w / DM.W, h / DM.H);
      this.offX = (w - DM.W * this.scale) / 2;
      this.offY = (h - DM.H * this.scale) / 2;
    },

    toLogical(cx, cy) {
      const r = this.canvas.getBoundingClientRect();
      return { x: (cx - r.left - this.offX) / this.scale, y: (cy - r.top - this.offY) / this.scale };
    },

    // ---- scenes -----------------------------------------------------------
    set(scene, params) {
      while (this.stack.length) {
        const s = this.stack.pop();
        s.exit && s.exit();
      }
      this.push(scene, params);
    },
    push(scene, params) {
      this.stack.push(scene);
      scene.enter && scene.enter(params || {});
    },
    pop() {
      const s = this.stack.pop();
      if (s && s.exit) s.exit();
      const top = this.top();
      if (top && top.resume) top.resume();
      return s;
    },
    remove(scene) {
      const i = this.stack.indexOf(scene);
      if (i < 0) return;
      if (i === this.stack.length - 1) this.pop();
      else {
        this.stack.splice(i, 1);
        scene.exit && scene.exit();
      }
    },
    top() {
      return this.stack[this.stack.length - 1];
    },

    // Fade to a colour, run cb (usually a scene change), fade back in.
    fadeTo(cb, o = {}) {
      const f = this.fade;
      f.color = o.color || '#000';
      f.speed = 1 / (o.out || 0.45);
      f.inSpeed = 1 / (o.in || 0.45);
      f.dir = 1;
      f.cb = cb;
    },
    get fading() {
      return this.fade.dir === 1;
    },

    // ---- loop -------------------------------------------------------------
    frame(t) {
      requestAnimationFrame((tt) => this.frame(tt));
      let dt = (t - this.last) / 1000;
      this.last = t;
      if (!(dt > 0)) dt = 1 / 60;
      if (dt > 0.05) dt = 0.05; // clamp after tab switches / hitches
      this.time += dt;
      this.fps = U.lerp(this.fps, 1 / dt, 0.05);

      if (this.error) {
        this.renderError();
        if (DM.Input.pressed('confirm')) location.reload();
        DM.Input.endFrame();
        return;
      }

      const f = this.fade;
      if (f.dir === 1) {
        DM.Input.clearAll();
        f.a = Math.min(1, f.a + dt * f.speed);
        if (f.a >= 1) {
          f.dir = -1;
          const cb = f.cb;
          f.cb = null;
          if (cb) this.guard(cb);
        }
      } else if (f.dir === -1) {
        f.a = Math.max(0, f.a - dt * f.inSpeed);
        if (f.a <= 0) f.dir = 0;
      }

      const top = this.top();
      if (top && top.update) this.guard(() => top.update(dt));
      this.guard(() => this.render());
      DM.Input.endFrame();
    },

    guard(fn) {
      try {
        fn();
      } catch (e) {
        console.error(e);
        this.error = e;
      }
    },

    render() {
      const ctx = this.ctx;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#020306';
      ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
      const k = this.dpr * this.scale;
      ctx.setTransform(k, 0, 0, k, this.dpr * this.offX, this.dpr * this.offY);
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, DM.W, DM.H);
      ctx.clip();

      let i = this.stack.length - 1;
      while (i > 0 && this.stack[i].opaque === false) i--;
      for (; i < this.stack.length; i++) {
        ctx.save();
        this.stack[i].render(ctx);
        ctx.restore();
      }
      if (this.fade.a > 0) {
        ctx.globalAlpha = this.fade.a;
        ctx.fillStyle = this.fade.color;
        ctx.fillRect(0, 0, DM.W, DM.H);
        ctx.globalAlpha = 1;
      }
      this.renderCursor(ctx);
      ctx.restore();
    },

    renderCursor(ctx) {
      const I = DM.Input;
      if (I.touch || !I.mouse.inside) return;
      const top = this.top();
      const mode = (top && top.cursor) || 'pointer';
      if (mode === 'none') return;
      const { x, y } = I.mouse;
      ctx.save();
      if (mode === 'reticle') {
        ctx.strokeStyle = 'rgba(200,245,255,0.9)';
        ctx.lineWidth = 1.5;
        DM.Gfx.circle(ctx, x, y, 9);
        ctx.stroke();
        for (let a = 0; a < 4; a++) {
          const ang = (a * Math.PI) / 2;
          DM.Gfx.line(ctx, x + Math.cos(ang) * 12, y + Math.sin(ang) * 12, x + Math.cos(ang) * 17, y + Math.sin(ang) * 17);
        }
        ctx.fillStyle = '#ffffff';
        DM.Gfx.circle(ctx, x, y, 1.6);
        ctx.fill();
      } else {
        ctx.fillStyle = '#eefbff';
        ctx.strokeStyle = '#0b1420';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + 13, y + 5);
        ctx.lineTo(x + 6, y + 7);
        ctx.lineTo(x + 4, y + 14);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();
    },

    renderError() {
      const ctx = this.ctx;
      const k = this.dpr * this.scale;
      ctx.setTransform(k, 0, 0, k, this.dpr * this.offX, this.dpr * this.offY);
      ctx.fillStyle = '#0a0d14';
      ctx.fillRect(0, 0, DM.W, DM.H);
      const G = DM.Gfx;
      G.text(ctx, 'THE INTRINSIC FIELD COLLAPSED', DM.W / 2, 260, { size: 34, align: 'center', color: DM.C.blue, spacing: 3, weight: 600 });
      G.text(ctx, 'Something went wrong. Click or press Enter to reload.', DM.W / 2, 310, { size: 18, align: 'center', color: '#cfe0ee' });
      const msg = String((this.error && (this.error.stack || this.error.message)) || this.error).split('\n').slice(0, 6);
      msg.forEach((l, i) => G.text(ctx, l.slice(0, 140), DM.W / 2, 370 + i * 20, { size: 13, align: 'center', color: '#7f93a6', font: DM.FONTS.type }));
    },
  };

  DM.Engine = Engine;
})();
</script>

<script>/* src/game/entity.js */
/*
 * Entity: base class for everything that lives in a World.
 *
 * Physics flags:
 *   solid   — collides with walls
 *   body    — pushes against other bodies
 *   static  — never moved by physics
 *   selfMove— moves itself in update() (projectiles); the world won't integrate it
 *   flying  — ignores low walls and doesn't collide with ground bodies
 *   timeless— keeps (most of) its speed during Temporal Sight (the player, duplicates)
 * Gameplay flags:
 *   grabbable (telekinesis), disintegratable, hp (null = indestructible), team
 *   interact = { label, range, onInteract(entity, player), enabled() }
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  let nextId = 1;

  class Entity {
    constructor(o = {}) {
      this.id = nextId++;
      this.x = o.x || 0;
      this.y = o.y || 0;
      this.vx = o.vx || 0;
      this.vy = o.vy || 0;
      this.r = o.r == null ? 12 : o.r;
      this.mass = o.mass == null ? 1 : o.mass;
      this.friction = o.friction == null ? 6 : o.friction;
      this.bounce = o.bounce == null ? 0.25 : o.bounce;
      this.solid = o.solid == null ? true : o.solid;
      this.body = o.body == null ? true : o.body;
      this.static = !!o.static;
      this.flying = !!o.flying;
      this.team = o.team || 'neutral';
      this.hp = o.hp == null ? null : o.hp;
      this.maxHp = this.hp;
      this.grabbable = !!o.grabbable;
      this.disintegratable = o.disintegratable == null ? true : o.disintegratable;
      this.layer = o.layer == null ? 1 : o.layer;
      this.colors = o.colors || ['#ffffff', '#cccccc'];
      this.interact = o.interact || null;
      this.tags = new Set(o.tags || []);
      this.dead = false;
      this.age = 0;
      this.heldBy = null;
      this.thrown = 0;
      this.stun = 0;
      this.hitFlash = 0;
    }

    update(dt, world) {}
    render(ctx, world) {}

    get speed() {
      return Math.hypot(this.vx, this.vy);
    }

    damage(amount, source, kind) {
      if (this.hp == null || this.dead) return false;
      this.hp -= amount;
      this.hitFlash = 0.12;
      if (this.hp <= 0) {
        this.hp = 0;
        this.die(kind, source);
      }
      return true;
    }

    die(kind, source) {
      if (this.dead) return;
      this.dead = true;
      if (this.onDeath) this.onDeath(kind, source);
    }

    // Default: scatter into particles of this entity's colours.
    disintegrate(world, source) {
      if (this.dead) return;
      const n = Math.min(110, 18 + this.r * 2.5);
      world.particles.burst(this.x, this.y, n, { color: this.colors, speed: [30, 280], life: [0.4, 1.3], size: [2, 4.5], drag: 2.5, add: false, radius: this.r });
      world.particles.burst(this.x, this.y, Math.round(n / 2), { color: ['#bff1ff', '#5fd4ff'], speed: [60, 340], life: [0.3, 0.9], size: [1.5, 3], drag: 3 });
      this.wasDisintegrated = true;
      this.die('disintegrate', source);
    }

    // Called when this hits a wall/body hard while thrown.
    onImpact(speed, other, world) {
      if (this.hp == null) return;
      const m = other ? U.clamp(other.mass, 0.6, 6) : 1.4;
      const dmg = (speed - 200) * 0.12 * m * (this.impactMul || 1);
      if (dmg <= 1) return;
      this.damage(dmg, other, 'impact');
      world.particles.burst(this.x, this.y, 8, { color: ['#d8d0c0', '#9a9080'], speed: [40, 160], life: [0.2, 0.5], size: [2, 3.5], add: false });
      DM.Audio.play('impact');
      world.camera.shake(Math.min(0.3, dmg / 220));
    }

    impulse(ix, iy) {
      if (this.static) return;
      this.vx += ix / this.mass;
      this.vy += iy / this.mass;
    }

    distTo(e) {
      return U.dist(this.x, this.y, e.x, e.y);
    }
  }

  DM.Entity = Entity;
})();
</script>
<script>/* src/game/world.js */
/*
 * World: one playable map. Owns entities, walls, particles and the camera.
 *
 * Maps are built by chapter `maps` functions using the helpers here
 * (wall, room, bake, decal...). Walls are axis-aligned rects; their look comes
 * from WALL_STYLES (extendable per map via world.wallStyles).
 */
(function () {
  'use strict';
  const DM = window.DM;
  const U = DM.U;
  const Gfx = DM.Gfx;

  // low: blocks movement but not shots/sight. seeThrough: blocks shots, not sight.
  const WALL_STYLES = {
    wall: { top: '#3d4552', face: '#262c35', edge: '#11151b' },
    glass: { top: 'rgba(150,215,255,0.22)', face: 'rgba(120,190,240,0.3)', edge: 'rgba(190,235,255,0.75)', seeThrough: true },
    low: { top: '#7a6a4c', face: '#54472f', edge: '#2e2619', low: true },
    door: { draw: () => {} },
  };

  class World {
    constructor(o = {}) {
      this.w = o.w || 2000;
      this.h = o.h || 2000;
      this.bg = o.bg || '#05070b';
      this.entities = [];
      this.walls = [];
      this.decals = []; // fn(ctx, world, view) drawn above the floor
      this.overlays = []; // fn(ctx, world, view) drawn above entities
      this.barks = [];
      this.particles = new DM.Particles(4000);
      this.camera = new DM.Camera();
      this.camera.bounds = { w: this.w, h: this.h };
      this.baseZoom = o.zoom || 1; // per-map camera zoom; Expand zooms out relative to it
      this.camera.zoom = this.camera.targetZoom = this.baseZoom;
      this.wallStyles = Object.assign({}, WALL_STYLES, o.wallStyles || {});
      this.time = 0;
      this.timeScale = 1;
      this.slowmo = false; // set by Temporal Sight
      this.timesight = false;
      this.mouse = { x: 0, y: 0 };
      this.player = null;
      this.boss = null;
      this.floorCanvas = null;
      this.floorLive = null;
      this.tint = null; // screen tint colour (rgba string)
      this._bodies = [];
      this._deferred = [];
    }

    // Run fn after this frame's entity updates (chain reactions, spawns from callbacks).
    defer(fn) {
      this._deferred.push(fn);
    }

    // ---- building ---------------------------------------------------------
    add(e) {
      e.world = this;
      this.entities.push(e);
      if (e.onAdd) e.onAdd(this);
      return e;
    }

    wall(x, y, w, h, kind = 'wall', extra) {
      const st = this.wallStyles[kind] || this.wallStyles.wall;
      const wl = Object.assign({ x, y, w, h, kind, low: !!st.low, seeThrough: !!st.seeThrough, noCollide: false }, extra || {});
      this.walls.push(wl);
      return wl;
    }

    // A rectangular room outline with door gaps.
    // doors: [{ side: 'top'|'bottom'|'left'|'right', at: offset along side, w: width }]
    room(x, y, w, h, o = {}) {
      const t = o.t || 16;
      const kind = o.kind || 'wall';
      const doors = o.doors || [];
      const side = (name, len, seg) => {
        const gaps = doors.filter((d) => d.side === name).map((d) => [d.at, d.at + d.w]).sort((a, b) => a[0] - b[0]);
        let cur = 0;
        for (const [g0, g1] of gaps) {
          if (g0 > cur) seg(cur, g0);
          cur = Math.max(cur, g1);
        }
        if (cur < len) seg(cur, len);
      };
      side('top', w, (a, b) => this.wall(x + a, y, b - a, t, kind));
      side('bottom', w, (a, b) => this.wall(x + a, y + h - t, b - a, t, kind));
      side('left', h, (a, b) => this.wall(x, y + a, t, b - a, kind));
