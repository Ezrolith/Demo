      { kind: 'events', sound: 'ninth_drip', every: [3, 7], first: [1, 3], gain: 0.7 },
      { kind: 'events', sound: 'ninth_tick', every: [6, 11], first: [3, 7], gain: 0.6 },
    ],
  };

  function rivetedColumn(g, x, y) {
    g.fillStyle = 'rgba(0,0,0,0.3)';
    g.fillRect(x + 7, y - 66, 38, 159);
    const metal = g.createLinearGradient(x - 20, 0, x + 20, 0);
    metal.addColorStop(0, '#233936');
    metal.addColorStop(0.45, '#56756b');
    metal.addColorStop(0.6, '#7c9180');
    metal.addColorStop(1, '#263f3b');
    g.fillStyle = metal;
    g.fillRect(x - 16, y - 67, 32, 134);
    for (const end of [-1, 1]) {
      g.fillStyle = '#87957d';
      g.fillRect(x - 29, y + end * 62 - 8, 58, 16);
      g.fillStyle = '#344e45';
      g.fillRect(x - 24, y + end * 49 - 6, 48, 11);
    }
    for (let j = -3; j <= 3; j++) {
      for (const dx of [-11, 11]) {
        g.fillStyle = '#172a28';
        G.circle(g, x + dx, y + j * 17, 2.5);
        g.fill();
        g.fillStyle = '#9aab92';
        G.circle(g, x + dx - 0.7, y + j * 17 - 0.8, 1);
        g.fill();
      }
    }
  }

  function bench(g, x, y) {
    g.fillStyle = 'rgba(0,0,0,0.3)';
    G.rr(g, x - 93, y - 12, 193, 53, 8);
    g.fill();
    for (let i = 0; i < 5; i++) {
      g.fillStyle = i % 2 ? '#987449' : '#b09160';
      g.fillRect(x - 90, y - 16 + i * 8, 180, 6);
      g.strokeStyle = 'rgba(36,20,12,0.45)';
      g.lineWidth = 1;
      G.line(g, x - 83, y - 13 + i * 8, x + 75, y - 13 + i * 8);
    }
    for (const dx of [-71, 71]) {
      g.fillStyle = '#192e2b';
      g.fillRect(x + dx - 4, y - 27, 8, 63);
      G.rr(g, x + dx - 11, y - 28, 22, 10, 4);
      g.fill();
    }
  }

  function poster(g, x, y, title, subtitle, color) {
    g.fillStyle = '#142923';
    g.fillRect(x - 58, y - 78, 116, 156);
    g.fillStyle = color;
    g.fillRect(x - 53, y - 72, 106, 143);
    g.fillStyle = '#d0c19c';
    G.circle(g, x, y - 24, 29);
    g.fill();
    g.fillStyle = color;
    G.circle(g, x + 9, y - 28, 25);
    g.fill();
    G.text(g, title, x, y + 24, { size: 12, align: 'center', color: '#eee0b9', weight: 600, spacing: 1 });
    G.text(g, subtitle, x, y + 42, { size: 11, align: 'center', color: '#e3cfa3' });
    g.fillStyle = 'rgba(12,25,21,0.16)';
    g.fillRect(x - 50, y + 53, 100, 14);
    g.fillStyle = '#c4c0a0';
    g.beginPath();
    g.moveTo(x + 36, y + 70);
    g.lineTo(x + 53, y + 51);
    g.lineTo(x + 53, y + 70);
    g.fill();
  }

  function newsstand(g, x, y) {
    g.fillStyle = '#152723';
    G.rr(g, x - 112, y - 67, 224, 139, 7);
    g.fill();
    g.fillStyle = '#7f4c35';
    g.fillRect(x - 105, y - 63, 210, 126);
    g.fillStyle = '#1e302b';
    g.fillRect(x - 93, y - 38, 186, 68);
    for (let row = 0; row < 2; row++) {
      for (let col = 0; col < 7; col++) {
        g.fillStyle = ['#cbbb8e', '#b78662', '#829182'][col % 3];
        g.fillRect(x - 88 + col * 26, y - 30 + row * 31, 22, 26);
        g.fillStyle = '#4c5445';
        g.fillRect(x - 85 + col * 26, y - 26 + row * 31, 16, 3);
        g.fillRect(x - 85 + col * 26, y - 18 + row * 31, 8, 11);
      }
    }
    g.fillStyle = '#ba9a65';
    g.fillRect(x - 108, y + 32, 216, 14);
    G.text(g, 'EVENING PAPERS', x, y - 45, { size: 14, spacing: 2, align: 'center', color: '#ead2a1' });
  }

  function pipe(g, x, y, length, vertical = false) {
    g.save();
    g.translate(x, y);
    if (vertical) g.rotate(Math.PI / 2);
    g.strokeStyle = '#0e2024';
    g.lineWidth = 19;
    G.line(g, 0, 4, length, 4);
    g.strokeStyle = '#67796a';
    g.lineWidth = 12;
    G.line(g, 0, 0, length, 0);
    g.strokeStyle = '#a09b7e';
    g.lineWidth = 2;
    G.line(g, 0, -3, length, -3);
    for (let i = 20; i < length; i += 72) {
      g.fillStyle = '#263e3b';
      g.fillRect(i, -10, 9, 20);
    }
    g.restore();
  }

  function gear(g, x, y, radius, angle) {
    g.save();
    g.translate(x, y);
    g.rotate(angle);
    g.fillStyle = '#796f50';
    for (let i = 0; i < 18; i++) {
      g.rotate(Math.PI / 9);
      g.fillRect(radius - 5, -8, 17, 16);
    }
    G.circle(g, 0, 0, radius);
    g.fill();
    K.ring(g, 0, 0, radius - 5, '#b3a276', 3);
    g.fillStyle = '#203a38';
    G.circle(g, 0, 0, radius * 0.66);
    g.fill();
    g.strokeStyle = '#8e8967';
    g.lineWidth = 9;
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3;
      G.line(g, 0, 0, Math.cos(a) * (radius - 10), Math.sin(a) * (radius - 10));
    }
    g.fillStyle = '#c7b382';
    G.circle(g, 0, 0, 12);
    g.fill();
    g.restore();
  }

  function trainCar(g, x, y, doorOpen, index) {
    g.save();
    g.translate(x, y);
    g.fillStyle = 'rgba(0,0,0,0.4)';
    G.rr(g, 7, 10, 368, 168, 20);
    g.fill();
    const steel = g.createLinearGradient(0, 0, 0, 165);
    steel.addColorStop(0, '#8b9f96');
    steel.addColorStop(0.16, '#b4b9a6');
    steel.addColorStop(0.24, '#637b72');
    steel.addColorStop(0.78, '#405d57');
    steel.addColorStop(0.94, '#9fa789');
    steel.addColorStop(1, '#344b49');
    g.fillStyle = steel;
    G.rr(g, 0, 0, 364, 163, 19);
    g.fill();
    g.strokeStyle = '#182e2b';
    g.lineWidth = 4;
    G.rr(g, 0, 0, 364, 163, 19);
    g.stroke();
    for (let row = 0; row < 7; row++) {
      g.strokeStyle = row % 2 ? 'rgba(210,220,187,0.18)' : 'rgba(13,33,29,0.25)';
      g.lineWidth = 2;
      G.line(g, 18, 23 + row * 17, 347, 23 + row * 17);
    }
    g.fillStyle = '#182e2b';
    for (const wx of [33, 82, 242, 291]) {
      G.rr(g, wx - 3, 34, 40, 80, 6);
      g.fill();
      const glass = g.createLinearGradient(0, 35, 0, 113);
      glass.addColorStop(0, '#e2d399');
      glass.addColorStop(1, '#8e956e');
      g.fillStyle = glass;
      g.fillRect(wx, 38, 34, 70);
      g.fillStyle = 'rgba(29,48,43,0.75)';
      G.circle(g, wx + 18, 66, 7);
      g.fill();
      G.ellipse(g, wx + 18, 91, 13, 18);
      g.fill();
      g.fillStyle = '#182e2b';
    }
    // The black opening appears between two sliding leaves, not a text label.
    g.fillStyle = '#11221f';
    g.fillRect(137, 27, 83, 119);
    for (const side of [-1, 1]) {
      const offset = side * doorOpen * 30;
      g.fillStyle = '#839789';
      g.fillRect(178 + (side < 0 ? -39 : 0) + offset, 28, 39, 116);
      g.fillStyle = '#d3c999';
      g.fillRect(184 + (side < 0 ? -39 : 0) + offset, 39, 27, 62);
      g.fillStyle = '#263d37';
      g.fillRect(180 + offset + side * 3, 105, 3, 22);
    }
    g.fillStyle = '#384e42';
    G.circle(g, 335, 139, 13);
    g.fill();
    G.text(g, '9', 335, 145, { size: 17, align: 'center', color: '#d8cca0', weight: 600 });
    g.fillStyle = '#142626';
    g.fillRect(364, 65, 18, 34);
    g.fillStyle = '#cfc39a';
    g.fillRect(8, 129, 6, 10);
    if (index === 2) {
      g.fillStyle = '#e7dfb0';
      G.circle(g, 353, 31, 5);
      g.fill();
      G.circle(g, 353, 131, 5);
      g.fill();
    }
    g.restore();
  }

  class Cycle extends DM.Entity {
    constructor(ctx, mode) {
      const world = ctx.world;
      super({ x: world.w / 2, y: world.h / 2, r: world.w, static: true, body: false,
        solid: false, disintegratable: false, layer: -5 });
      this.ctx = ctx;
      this.mode = mode;
      this.started = false;
      this.resetAge = 1;
      this.crossings = { arrive: 0, chime: 0, depart: 0, rewind: 0 };
      world.cycleT = 0;
      world.cycleNumber = 0;
      world.stationCycle = this;
    }
    get trainX() {
      const t = this.world.cycleT;
      if (t < 2.2) return U.lerp(-1180, 390, 1 - Math.pow(1 - t / 2.2, 3));
      if (t < 6.4) return 390;
      return U.lerp(390, this.world.w + 200, Math.pow((t - 6.4) / 2.6, 2));
    }
    get doorOpen() {
      const t = this.world.cycleT;
      return U.clamp(Math.min((t - 2.4) / 0.45, (6.4 - t) / 0.5), 0, 1);
    }
    update(dt, world) {
      if (world.ceasefire) return;
      const audible = this.mode !== 'engine';
      if (!this.started) {
        this.started = true;
        this.crossings.arrive++;
        if (audible) DM.Audio.play('ninth_arrive');
      }
      const before = world.cycleT;
      const after = before + dt;
      if (before < 2.4 && after >= 2.4) {
        this.crossings.chime++;
        if (audible) DM.Audio.play('ninth_chime');
      }
      if (before < 6.4 && after >= 6.4) {
        this.crossings.depart++;
        if (audible) DM.Audio.play('ninth_depart');
      }
      world.cycleT = after;
      this.resetAge += dt;
      if (after >= 9) {
        world.cycleT = after % 9;
        this.resetAge = 0;
        this.started = false;
        this.crossings.rewind++;
        if (audible) DM.Audio.play('ninth_rewind');
        world.cycleNumber++;
        if (audible && world.cycleNumber % 3 === 2) DM.Audio.play('ninth_announcement');
      }
      if (this.mode === 'engine' && before < 4 && after >= 4 && fullMotion()) {
        for (const [x, y] of [[440, 420], [1460, 1120]]) {
          world.particles.burst(x, y, DM.Save.settings.fx === 'full' ? 14 : 5, {
            color: ['#c2d0c1'], speed: [10, 35], life: [0.7, 1.8], size: [7, 14],
            drag: 2, add: false, alpha: 0.08,
          });
        }
      }
    }
    light(world) {
      if (this.mode !== 'platform') return null;
      return { x: this.trainX + 1130, y: 592, r: 480, i: 0.8, color: '#e7e1b7', k: 0.13, cone: 0, spread: 0.24 };
    }
    render() {}
    overlay(g, world) {
      const t = world.cycleT;
      if (this.mode === 'platform') {
        g.save();
        g.beginPath();
        g.rect(100, 500, world.w - 200, 205);
        g.clip();
        for (let i = 0; i < 3; i++) trainCar(g, this.trainX + i * 382, 514, this.doorOpen, i);
        g.restore();
        if (fullMotion()) {
          for (let i = 0; i < 7; i++) {
            const route = i % 2 ? -1 : 1;
            const x = 500 + i * 145 + route * Math.min(t, 6.3) * 14;
            const y = 778 + (i % 3) * 43;
            g.save();
            g.globalAlpha = world.timesight ? 0.48 : 0.12;
            G.figure(g, Object.assign({}, DM.LOOKS.commuter, {
              x, y, angle: route > 0 ? 0 : Math.PI, walk: t * 6, moving: t < 6.3,
            }));
            g.restore();
          }
        }
      }
      if (this.mode === 'engine') {
        for (const [x, y, r, k] of [[380, 500, 74, 1], [497, 420, 54, -1.37],
          [1490, 470, 82, -0.9], [1590, 570, 49, 1.5], [400, 1090, 65, 1.1], [1515, 1060, 76, -1]]) {
          gear(g, x, y, r, t * k * 0.38);
        }
      }
      if (this.resetAge < 0.25 && !reduced() && fullMotion()) {
        g.save();
        g.globalCompositeOperation = 'saturation';
        g.globalAlpha = 0.17 * (1 - this.resetAge / 0.25);
        g.strokeStyle = '#888888';
        g.lineWidth = 90;
        G.circle(g, world.w / 2, world.h / 2, this.resetAge * 6500);
        g.stroke();
        g.restore();
      }
    }
  }

  function decorate(ctx, mode) {
    const world = ctx.world;
    const g = world.floorCanvas.getContext('2d');
    g.save();
    g.setTransform(world.floorScale, 0, 0, world.floorScale, 0, 0);
    const rnd = U.seeded(mode === 'platform' ? 1977 : mode === 'train' ? 908 : 9009);
    const width = world.w;
    // Cream tile, green dado and hairline grout retain the original muted palette.
    for (let y = 177; y < 286; y += 18) {
      for (let x = 98; x < width - 98; x += 30) {
        g.fillStyle = y > 243 ? '#406153' : (rnd() > 0.35 ? '#c4c0a4' : '#aaa991');
        g.fillRect(x + 1, y + 1, 28, 16);
        if (rnd() < 0.1) {
          g.strokeStyle = 'rgba(42,58,46,0.35)';
          g.lineWidth = 1;
          G.line(g, x + 4, y + 3, x + 16, y + 15);
        }
      }
    }
    g.fillStyle = '#304a3e';
    g.fillRect(width / 2 - 236, 196, 472, 52);
    for (let y = 197; y < 247; y += 5) {
      for (let x = width / 2 - 235; x < width / 2 + 235; x += 5) {
        g.fillStyle = rnd() > 0.6 ? '#3f5947' : '#28463b';
        g.fillRect(x, y, 4, 4);
      }
    }
    G.text(g, mode === 'engine' ? 'HARROW • CLOCK WORKS' : 'HARROW ST', width / 2, 233,
      { size: 26, align: 'center', spacing: 5, weight: 600, color: '#d8d1ae' });
    for (let i = 0; i < 38; i++) {
      g.fillStyle = 'rgba(14,35,29,0.12)';
      g.fillRect(100 + rnd() * (width - 200), 177, 6 + rnd() * 18, 35 + rnd() * 80);
    }
    if (mode !== 'engine') {
      for (const y of [492, 705]) {
        g.fillStyle = '#b19d4d';
        g.fillRect(103, y, width - 206, 8);
        for (let x = 110; x < width - 110; x += 11) {
          g.fillStyle = '#d3c58c';
          G.circle(g, x, y + 15, 1.8);
          g.fill();
          G.circle(g, x + 5, y + 23, 1.8);
          g.fill();
        }
      }
      bench(g, 650, mode === 'platform' ? 1090 : 1220);
      bench(g, width - 420, mode === 'platform' ? 1090 : 1220);
      newsstand(g, mode === 'platform' ? 1280 : 1180, 350);
      poster(g, 700, 350, 'TOMORROW', 'ON TIME', '#765441');
      poster(g, width - 350, 350, 'TAKE THE', 'LONG WAY HOME', '#3d6962');
      for (const x of [510, width - 600]) {
        g.fillStyle = '#253e36';
        G.ellipse(g, x, 1080, 25, 34);
        g.fill();
        K.ring(g, x, 1060, 22, '#879481', 3);
        for (let j = 0; j < 5; j++) {
          g.strokeStyle = '#637a68';
          g.lineWidth = 2;
          G.line(g, x - 17 + j * 8, 1069, x - 17 + j * 8, 1103);
        }
      }
      for (let i = 0; i < 17; i++) {
        const x = 200 + rnd() * (width - 400), y = 850 + rnd() * 270;
        g.save();
        g.translate(x, y);
        g.rotate(rnd() * 1.7);
        g.fillStyle = '#a8a48c';
        g.fillRect(-12, -8, 25, 17);
        g.fillStyle = '#526153';
        g.fillRect(-9, -5, 19, 2);
        for (let row = 0; row < 4; row++) g.fillRect(-9, -1 + row * 2.5, 8, 1);
        g.fillRect(2, -1, 8, 8);
        g.restore();
      }
      for (const x of [610, 1150, width - 300]) {
        const y = mode === 'platform' ? 968 : 350;
        rivetedColumn(g, x, y);
      }
    } else {
      pipe(g, 270, 330, 1350);
      pipe(g, 280, 340, 890, true);
      pipe(g, 1620, 330, 900, true);
      for (const [x, y] of [[430, 420], [1460, 420], [430, 1110], [1460, 1110]]) {
        g.fillStyle = '#102927';
        g.fillRect(x - 58, y - 36, 116, 72);
        for (let j = -4; j < 5; j++) {
          g.strokeStyle = '#8b8b65';
          g.lineWidth = 6;
          G.line(g, x - 45 + j * 10, y - 29, x - 10 + j * 10, y + 29);
        }
        g.fillStyle = '#324c46';
        g.fillRect(x - 40, y - 23, 80, 46);
        for (let j = -3; j < 4; j++) {
          g.strokeStyle = '#132f2c';
          g.lineWidth = 3;
          G.line(g, x - 31, y + j * 6, x + 31, y + j * 6);
        }
      }
      for (const dx of [-8, 0, 8]) {
        g.strokeStyle = dx ? '#676b4d' : '#34453b';
        g.lineWidth = 4;
        g.beginPath();
        g.moveTo(360 + dx, 1200);
        g.bezierCurveTo(650 + dx, 1320, 750 + dx, 910, 950 + dx, 850);
        g.stroke();
      }
    }
    for (const [x, y] of [[550, 820], [1210, 1050], [width - 340, 810]]) {
      const wet = g.createRadialGradient(x, y, 0, x, y, 110);
      wet.addColorStop(0, 'rgba(143,175,151,0.17)');
      wet.addColorStop(1, 'rgba(15,38,35,0.03)');
      g.fillStyle = wet;
      G.ellipse(g, x, y, 115, 22);
      g.fill();
      g.strokeStyle = 'rgba(160,185,156,0.14)';
      g.lineWidth = 1;
      G.line(g, x - 60, y + 5, x + 84, y + 5);
    }
    g.restore();
    const cycle = ctx.add(new Cycle(ctx, mode));
    world.overlays.push((canvas, current) => cycle.overlay(canvas, current));
    if (mode === 'engine') {
      for (const [x, y] of [[260, 350], [1640, 350], [260, 1200], [1640, 1200]]) {
        ctx.add(new K.Lamp(x, y, { r: 230, i: 0.65, color: GOLD, k: 0.13 }));
      }
    }
    return cycle;
  }

  DM.NinthAtmosphere = { decorate, Cycle, trainCar };
})();
</script>

  DM.Ambience.beds.broadcast_rain = {
    layers: [
      {
        kind: 'wind', ftype: 'lowpass', freq: 2100, q: 0.5, gain: 0.018, lfo: { rate: 0.12, depth: 0.16 }
      },
      {

      },
      {

          { f: 58, wave: 'sine' },

        ], cutoff: 180, gain: 0.007
      },
      {
        kind: 'events', sound: 'broadcast_siren', every: [17, 29], first: [8, 14], gain: 0.6
      },
    ],
  };
  DM.Ambience.beds.broadcast_hum = {
    layers: [
      {
        kind: 'drone', oscs: [
          { f: 60, wave: 'sine' },
          { f: 120, wave: 'triangle', g: 0.14 }
        ],
        cutoff: 280, gain: 0.014, lfo: { rate: 0.08, depth: 0.1 }

      for (const dish of this.dishes().filter(d => this.phase === 2 || d.side < 0)) {
        g.save();
        if (this.beamT < 1) {
          g.strokeStyle = '#f1c078';
          g.lineWidth = 2;
          g.setLineDash([12, 10]);
          for (const t of [1, 3.5]) {

      }, enabled: () => !!ctx.flags.pendulumDown, range: 90
    }));
    ctx.add(new Terminal(625, 500, 'E · RELEASE THE LOOP', () => {
      ctx.flags.choice = 'release';
      ctx.flags.stable = true;
    }, () => ctx.flags.deciding && !ctx.flags.choice, BLUE));
    ctx.add(new Terminal(1275, 500, 'E · PRESERVE THE RECORD', () => {
      ctx.flags.choice = 'preserve';
      ctx.player.energy = 100;
    }, () => ctx.flags.deciding && !ctx.flags.choice, GOLD));
    ctx.add(new Terminal(340, 1210, 'E · RETURN TO THE PLATFORM', () => {
      ctx.flags.departed = true;
    }, () => !!ctx.flags.stable, TEAL));

  }
  function quiet(ctx) {
    const f = ctx.flags;
    f.pendulumDown = true;
    if (f.pendulum && f.pendulum.cameraFrame)
      f.pendulum.cameraFrame.release();
    ctx.clearHostiles();
    for (const e of ctx.world.entities)
      if (e.team === 'enemy')
        e.dead = true;
    ctx.world.boss = null;
  }
  class NinthComplete {
    constructor(play, record) {
      this.play = play;
      this.record = record;
      this.cursor = 'pointer';
      this.t = 0;
    }
    enter() {
      DM.Audio.stopHums();
      DM.Audio.music.play('ninth_dawn');
      DM.Audio.play('success');
      this.menu = new DM.UI.Menu([
        {
          label: 'RETURN TO BONUS LEVELS', action: () => DM.Engine.fadeTo(() => DM.Engine.set(new DM.Scenes.BonusMenu()))
        },
        {
          label: 'PLAY AGAIN · TRY THE OTHER ROUTE', action: () => DM.Bonus.start('ninth_minute', false)
        }
      ], {
        x: 640, y: 556, w: 660, align: 'center', size: 21, itemH: 44
      });
    }
    update(dt) {
      this.t += dt;
      if (this.t > 1)
        this.menu.update(dt);
    }
    render(g) {
      stationBackdrop(g, this.t);
      g.fillStyle = 'rgba(4,14,20,.94)';
      g.fillRect(110, 52, 1060, 614);
      g.strokeStyle = 'rgba(147,221,210,.4)';
      g.strokeRect(110, 52, 1060, 614);
      const f = this.record.flags;
      G.text(g, 'BONUS II · ADVENTURE COMPLETE', 640, 111, {
        size: 16, spacing: 5, align: 'center', color: TEAL
      });
      G.text(g, 'THE NINTH MINUTE', 640, 180, {
        size: 48, weight: 700, spacing: 4, align: 'center', color: '#eee4cb'
      });
      const text = f.choice === 'preserve' ?
        'Six people leave the station. The record leaves with them: proof of what the machine ' +
        'did, and who signed for it. For once, tomorrow has something useful to learn from ' + 'yesterday.' :
        'Six people leave the station. Behind them, the last repeated minute dissolves. There is ' +
        'no perfect record of what happened. There are people who will get to tell it.';
      G.paragraph(g, text, 244, 224, 792, 28, {
        size: 21, font: DM.FONTS.type, color: '#deddd0'
      });
      const rows = [
        ['PASSENGERS HOME', `${f.passengers ||
          0} / 6`],
        ['LOST MOMENTS HEARD', `${bits(f.moments)} / 3`],
        ['YOUR CHOICE', f.choice === 'preserve' ? 'THE RECORD PRESERVED' : 'THE LOOP RELEASED']
      ];
      rows.forEach(([label, value], i) => {
        G.text(g, label, 610, 386 + i * 42, {
          size: 15, align: 'right', spacing: 2, color: '#a7bbb9'
        });
        G.text(g, value, 645, 386 + i * 42, {
          size: i === 2 ? 15 : 21, color: i === 1 ? GOLD : TEAL
        });
      });
      G.text(g, 'The station clock reads 12:10. Nothing else needs to happen.', 640, 522, {
        size: 15, align: 'center', font: DM.FONTS.type, color: '#b4c6bf'
      });
      this.menu.render(g);
      G.postFx(g);
    }
  }
  const chapter = DM.Bonus.register({
    id: 'ninth_minute', numeral: 'BONUS II', title: 'The Ninth Minute', date: '1977', place: 'Harrow Street',
    clock: 9, color: '#24494a', music: 'ninth_platform', form: 'manhattan',
    menuAccent: TEAL, menuTitle: ['THE NINTH', 'MINUTE'], menuLocation: 'NEW YORK · 1977', menuCast: ['silkspectre', 'niteowl'],
    menuSummary: 'The same train arrives every nine seconds. Six passengers are trapped between one ' + 'moment and the next.',
    menuBrief: 'Join Silk Spectre and Nite Owl beneath the city. Break the loop. Bring the passengers home.',
    menuTagline: 'LET THE NEXT SECOND HAPPEN.', menuBackdrop: stationBackdrop, menuEmblem: (g, x, y, t) => clock(g, x, y, 65, t,
      false), bonusComplete: NinthComplete,
    persistFlags: [
      'moments',
      'route',
      'passengers',
      'opened',
      'pendulumDown',
      'choice',
      'stable'
    ],
    intro: [
      'It is February 1977. A train is arriving at Harrow Street. In nine seconds, it will arrive again.',
      'Laurie has heard a child counting through the emergency telephone. Eight. Nine. Eight. ' +
      'Nine. Dan has found a machine beneath the tracks that should not be there.',
      'I have come to a place where the future is only nine seconds long. For six people, it ' + 'is already much too long.'
    ],
    maps: {
      ninth_platform: platform, ninth_train: rescue, ninth_engine: engine
    },
    stages: [
      {
        id: 'platform', label: 'A station out of time', map: 'ninth_platform', checkpoint: true,
        run: function*(ctx) {
          yield ctx.dialog([
            [
              'silkspectre',
              'That is the same train. Same windows, same faces. Jon, they have been arriving for ' + 'forty-three minutes.'
            ],
            [
              'niteowl',
              'Security drones on the platform. The signal box still works, but someone routed the ' + 'line back into itself.'
            ],
            [
              'manhattan',
              'The station has forgotten how to leave this moment.'
            ],
            ['silkspectre', 'Then remind it. I will stay with you.']
          ]);
          ready(ctx);
          ctx.objective('Clear the platform · Set the route to SERVICE',
            () => `${ctx.flags.platformFoes.filter(alive).length} drones · ${ctx.flags.route === 1 ? 'SERVICE selected' :
              'signal box not set'}`);
          ctx.marker(1690, 955, 'SIGNAL BOX');
          ctx.tutorial('E cycles the signal: choose SERVICE. Amber rails warn before firing. F slows them.', 16);
          ctx.fork(function*(c) {
            yield c.until(() => c.flags.route === 1 && c.flags.platformFoes.every(e => !alive(e)));
            c.marker(1730, 330, 'SERVICE TUNNEL');
            c.toast('SAFE ROUTE OPEN · CROSS TO THE SERVICE TUNNEL', TEAL);
          });
          yield ctx.until(() => ctx.flags.enterTrain);
          ctx.objectiveDone();
          yield ctx.dialog([
            [
              'niteowl',
              'Service line selected. The train is no longer coming back here. It is stuck between ' + 'stations instead.'
            ],
            [
              'silkspectre',
              'That sounds less like good news than you think it does.'
            ],
            ['niteowl', 'It means we can reach the doors.']
          ]);
        }, restore: ctx => {
          ctx.flags.route = 1;
        }
      },
      {
        id: 'rescue', label: 'The people between seconds', map: 'ninth_train', checkpoint: true,
        run: function*(ctx) {
          yield ctx.dialog([
            [
              'silkspectre',
              'Three carriages. I can force the shutters, but not while a drone is looking over my shoulder.'
            ],
            [
              'niteowl',
              'I will cover the platform. Jon, get Laurie to a door and keep the security machines off her.'
            ],
            [
              'vale',
              'Do not break the field. It is the only thing keeping the train from reaching the end of the line.'
            ],
            ['manhattan', 'There are other ways to stop a train.'],
            [
              'silkspectre',
              'And we will discuss them after these people are out.'
            ]
          ]);
          ready(ctx);
          ctx.objective('Open all three carriages · Escort six passengers out',
            () => `${ctx.flags.passengers}/6 safe · ${bits(ctx.flags.opened)}/3 doors open`);
          ctx.marker(600, 727, 'FIRST CARRIAGE');
          ctx.tutorial('E calls Laurie to a carriage. Clear nearby enemies while she opens it. Escort people out.', 16);
          ctx.fork(function*(c) {
            let last = -1;
            while (!c.flags.enterEngine) {
              const d = c.flags.doors.find(e => !e.open);
              const ix = d ? d.index : 3;
              if (ix !== last) {
                last = ix;
                c.marker(d ? d.x : 2120, d ? d.y : 1140, d ? `CARRIAGE ${ix + 1}` : 'CLOCK CHAMBER');
              }
              yield c.wait(.25);
            }
          });
          yield ctx.until(() => ctx.flags.enterEngine);
          ctx.objectiveDone();
          yield ctx.dialog([
            [
              'silkspectre',
              'Six at the stairs. The little girl got to ten.'
            ],
            [
              'niteowl',
              'Mara Vale designed the transit control system. Her prototype is holding this whole ' + 'tunnel inside a field.'
            ],
            [
              'vale',
              'The brake failed. I gave them nine seconds. Then I could not give them anything after it.'
            ],
            [
              'manhattan',
              'You have been repeating a rescue. Now we must finish it.'
            ]
          ]);
        }, restore: ctx => {
          ctx.flags.passengers = 6;
          ctx.flags.opened = 7;
        }
      },
      {
        id: 'pendulum', label: 'The minute engine', map: 'ninth_engine', checkpoint: true,
        run: function*(ctx) {
          yield ctx.dialog([
            [
              'niteowl',
              'The regulator is shielding itself in a nine-second cycle. It exposes the core for the final three.'
            ],
            [
              'silkspectre',
              'So wait for teal, then hit it. And do not stand where the clock hands are pointing.'
            ],
            [
              'vale',
              'If you can stop the regulator without rupturing the chamber, I can release the field.'
            ],
            [
              'manhattan',
              'I can see every second it is trying not to have.'
            ]
          ]);
          ready(ctx);
          ctx.objective('Stop the Pendulum · Strike when the core turns teal');
          ctx.marker(950, 660, 'THE PENDULUM');
          ctx.tutorial('Dodge the clock hands. Strike the open teal core or return a missile. F slows the cycle.', 17);
          yield ctx.until(() => ctx.flags.pendulumDown);
          ctx.objectiveDone();
          quiet(ctx);
          yield ctx.dialog([
            ['niteowl', 'Regulator is down. No more reset.'],
            [
              'silkspectre',
              'The passengers are safe. Mara, come away from the machine.'
            ],
            [
              'vale',
              'There is a record in the field. Every warning they ignored. Every signature. Release it ' +
              'now and the record goes with it.'
            ]
          ]);
        }, restore: quiet
      },
      {
        id: 'decision', label: 'What a moment is worth', checkpoint: true,
        run: function*(ctx) {
          quiet(ctx);
          ready(ctx);
          ctx.flags.deciding = true;
          ctx.flags.choice = null;
          ctx.flags.stable = false;
          yield ctx.dialog([
            [
              'niteowl',
              'Blue console releases the loop immediately. Gold tries to save the record first. Laurie ' +
              'and I can take the side controls.'
            ],
            [
              'silkspectre',
              'Your call, Jon. We already saved the people.'
            ],
            [
              'manhattan',
              'A moment can contain an entire life. It can also contain the reason someone should have listened.'
            ]
          ]);
          ctx.objective('Choose: release the loop, or preserve the record');
          ctx.marker(950, 500, 'TWO CONTROL CONSOLES');
          ctx.tutorial('Blue releases the loop. Gold saves the record: hold F in the teal ring. E chooses.', 16);
          yield ctx.until(() => !!ctx.flags.choice);
          if (ctx.flags.choice === 'preserve') {
            ctx.objective('Hold F inside the teal ring · Preserve the record',
              () => `${Math.round(ctx.flags.anchor.charge / 4 * 100)}% stabilised`);
            ctx.marker(950, 935, 'TEMPORAL ANCHOR');
            ctx.music('ninth_platform');
            yield ctx.dialog([
              [
                'niteowl',
                'I have the left control. Laurie, the other side. Jon, hold the field steady from that ring.'
              ],
              [
                'silkspectre',
                'Do not try to hold it forever. Just long enough.'
              ]
            ]);
            ctx.flags.operators = true;
            ctx.flags.owl.x = 635;
            ctx.flags.owl.y = 555;
            ctx.flags.laurie.x = 1265;
            ctx.flags.laurie.y = 555;
            yield ctx.until(() => ctx.flags.stable);
            ctx.flags.operators = false;
            yield ctx.dialog([
              [
                'niteowl',
                'Got it. The warnings, the reports, the signatures. All of it.'
              ],
              [
                'vale',
                'I thought if I could keep the moment from ending, it would not be a mistake.'
              ],
              [
                'silkspectre',
                'Come upstairs. You still have to decide what happens next.'
              ]
            ]);
          }
          else {
            yield ctx.dialog([
              ['vale', 'The record is gone.'],
              [
                'silkspectre',
                'You are not. You can tell them what happened.'
              ],
              [
                'manhattan',
                'We are not obliged to keep every moment. Only to let the next one arrive.'
              ]
            ]);
          }
          ctx.objectiveDone();
          ctx.music('ninth_dawn');
        }
      },
      {
        id: 'departure', label: 'The tenth minute',
        run: function*(ctx) {
          ready(ctx);
          ctx.objective('Return to the platform with your companions');
          ctx.marker(340, 1210, 'BACK TO THE CITY');
          ctx.flags.vale.walkTo(340, 1160);
          ctx.flags.vale.body = false;
          yield ctx.until(() => ctx.flags.departed);
          ctx.objectiveDone();
          ctx.marker(null);
          ctx.lock(true);
          yield ctx.dialog([
            [
              'niteowl',
              'Surface clocks are moving. Dispatch says the line is clear.'
            ],
            [
              'silkspectre',
              'The girl is asking whether she still has to go to school tomorrow. I told her probably.'
            ],
            [
              'manhattan',
              'Above us, a traffic light changes. A cup falls from a table. The city is making new mistakes.'
            ],
            ['silkspectre', 'Good. Let it.']
          ]);
          yield ctx.narrate('The station clock reads 12:10. For the first time tonight, nobody is waiting for it.', {
            dur: 4
          });
        }
      }
    ]
  });
  DM.NinthMinute = {
    chapter, Pendulum, CarriageDoor, Evacuee, SilkSpectre, RouteSwitch, RailArc, LostMoment, Anchor,
    TimeRing
  };
})();

<script>/* src/main.js */
/*
 * Boot: load save + settings, wait briefly for web fonts, start on the title
 * screen. Nothing stored or fetched may stop the title from appearing: a bad
 * save falls back to defaults, and the font wait is capped.
 */
(function () {
  'use strict';
  const DM = window.DM;
  let booted = false;

  function boot() {
    if (booted) return;
    booted = true;
    const canvas = document.getElementById('game');
    try {
      DM.Save.load();
      DM.Audio.setVolumes({ music: DM.Save.settings.music, sfx: DM.Save.settings.sfx });
    } catch (e) {
      console.error('Could not apply the saved game; starting with defaults.', e);
      DM.Save.data = DM.Save.defaults();
    }
    try {
      DM.Input.init(canvas);
    } catch (e) {
      console.error(e);
    }
    DM.Engine.init(canvas);
    try {
      DM.Engine.set(new DM.Scenes.Title());
    } catch (e) {
      // Last resort: a save the sanitizer did not anticipate. Retry on defaults, else show the crash screen.
      console.error(e);
      DM.Save.data = DM.Save.defaults();
      DM.Engine.stack = [];
      DM.Engine.guard(() => DM.Engine.set(new DM.Scenes.Title()));
    }
    const loading = document.getElementById('boot');
    if (loading) loading.remove();
    if (canvas.focus) canvas.focus({ preventScroll: true });

    // Hooks for debugging and automated tests (see tests/smoke.mjs).
    DM.dev = {
      start(chapter, stage = 0) {
        DM.Engine.set(new DM.Scenes.Play(), { chapter, stage });
      },
      play() {
        return DM.Engine.stack.find((s) => s instanceof DM.Scenes.Play) || null;
      },
      skip() {
        const p = this.play();
        if (p) p.ctx.skipStage();
      },
      state() {
        const p = this.play();
        const top = DM.Engine.top();
        return {
          scene: top && top.constructor.name,
          stack: DM.Engine.stack.map((s) => s.constructor.name),
          error: DM.Engine.error ? String(DM.Engine.error.stack || DM.Engine.error) : null,
          chapter: p && p.chapter.id,
          stage: p && p.ctx.stageIndex,
          stageId: p && p.chapter.stages[p.ctx.stageIndex] && p.chapter.stages[p.ctx.stageIndex].id,
          form: p && p.player.form,
          powers: p ? Object.keys(p.player.powers) : [],
          entities: p ? p.world.entities.length : 0,
          dialog: p ? p.dialog.active : false,
        };
      },
    };
  }

  // Web fonts: the stylesheet loads without blocking scripts (index.html), so
  // wait for it, then for the four faces, but never more than ~2.5 s after the
  // page started loading. Late fonts still arrive; wrapped text is re-measured.
  const fonts = ['700 20px Oswald', '400 20px Oswald', '20px "Special Elite"', '20px "Patrick Hand"'];
  const css = document.getElementById('fontcss');
  const sheet = new Promise((resolve) => {
    if (!css || css.dataset.ready || css.sheet) return resolve();
    css.addEventListener('load', resolve);
    css.addEventListener('error', resolve);
  });
  const faces = () => (document.fonts && document.fonts.load ? Promise.all(fonts.map((f) => document.fonts.load(f).catch(() => null))) : null);
  const ready = sheet.then(faces);
  const cap = Math.max(600, 2500 - (window.performance ? performance.now() : 0));
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', () => DM.Gfx.clearTextCache && DM.Gfx.clearTextCache());
  Promise.race([ready, new Promise((r) => setTimeout(r, cap))]).then(boot, boot);
})();
</script>
