<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dr. Manhattan</title>
<meta name="description" content="A Watchmen fan game: play Jon Osterman's journey to Dr. Manhattan, gaining powers chapter by chapter.">
<!-- build:fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Non-blocking: a slow or blocked font host must not delay the game (src/main.js waits up to 2.5 s). -->
<link id="fontcss" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Patrick+Hand&family=Special+Elite&display=swap" media="print" onload="this.media='all';this.dataset.ready='1'" onerror="this.dataset.ready='1'">
<!-- /build:fonts -->
<style>
  :root { --bg: #04060b; --fg: #7fc8ec; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  canvas { display: block; outline: none; cursor: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; font: 600 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.3em; text-transform: uppercase; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Dr. Manhattan: The Watchmaker's Son"></canvas>
<div id="boot">Assembling…</div>
<noscript><p style="padding:24px">This game needs JavaScript enabled.</p></noscript>

<!-- build:scripts — load order matters; tools/build.mjs inlines these into dist/ -->
